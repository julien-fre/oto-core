# yaml-language-server: $schema=../connector.schema.json
# Modjo Public API v2 reference: https://api.modjo.ai/v2/docs (OpenAPI: https://api.modjo.ai/v2/open-api.json)
connector:
  name: modjo
  label: Modjo
  namespace: modjo
  version: 1.0.0
  api_version: v2
  base_url: https://api.modjo.ai/v2
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: Workspace API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  query_arrays: comma
  rate_limit: { requests: 100, seconds: 60 }
  probe: { function: list_tags }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Modjo rejected the request as invalid: check the arguments." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Modjo rejected the API key: it is missing, invalid or revoked." }
    - { status: 403, code: not_enabled, retryable: false,
        message: "This Modjo feature is not enabled for the workspace." }
    - { status: 404, code: not_found, retryable: false,
        message: "Modjo object not found." }
    - { status: 409, code: conflict, retryable: false,
        message: "Modjo refused the operation: the object is not ready yet, or already exists." }
    - { status: 410, code: gone, retryable: false,
        message: "Deleted for good by the workspace's retention policy." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Modjo rate limit reached (100 requests per minute for the whole workspace): retry after the window resets." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Modjo is temporarily unavailable: retry later." }

functions:
  # --- calls ------------------------------------------------------------------
  - name: list_calls
    class: read
    description: >-
      List the calls recorded in Modjo, page by page (pagination.total gives
      the count; another page exists while page * size < total). The key
      belongs to the workspace: without user_id it returns every user's calls.
      date_from and date_to bound the call date, created_from and created_to the
      creation date. Without expand, related objects are ids only (userIds,
      contactIds, dealId, accountId); expand replaces them by the objects and
      can inline sub-resources (transcript, summaries, next-steps...), which
      makes pages heavy: expand transcript on one call at a time. status
      processing means the analysis is not finished (5 to 30 minutes after
      upload).
    input:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, minimum: 1 }
          description: "Only these numeric call ids."
        title: { type: string, minLength: 1, description: "Case-insensitive substring of the call title." }
        min_duration: { type: number, minimum: 0, description: "Minimum duration, in seconds, inclusive." }
        date_from: { type: string, format: date-time, description: "Calls that took place from this ISO 8601 date-time." }
        date_to: { type: string, format: date-time, description: "Calls that took place until this ISO 8601 date-time." }
        created_from: { type: string, format: date-time, description: "Calls created in Modjo from this date-time, inclusive." }
        created_to: { type: string, format: date-time, description: "Calls created in Modjo until this date-time, inclusive." }
        user_id: { type: integer, minimum: 1, description: "Only the calls of this Modjo user (see list_users)." }
        deal_id: { type: integer, minimum: 1, description: "Only the calls linked to this deal." }
        account_id: { type: integer, minimum: 1, description: "Only the calls linked to this account." }
        recording_retention_status:
          type: string
          enum: [available, deleted]
          description: "deleted: calls whose recording was removed by the retention policy."
        expand: &expand
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [contacts, deal, account, users, libraries, transcript, tags, topics,
                   summaries, notes, next-steps, crm-filling-answers, ai-scoring]
          description: "Relations and sub-resources to inline in each call."
        page: &page { type: integer, minimum: 1, default: 1, description: "Page number, from 1." }
        size: &size { type: integer, minimum: 1, maximum: 100, default: 25, description: "Items per page." }
    examples:
      - title: One person's calls of a week, with participants and deal
        input: { user_id: 42, date_from: "2026-10-05T00:00:00Z", date_to: "2026-10-12T00:00:00Z", expand: [users, contacts, deal] }
      - title: Calls with a title and their AI scoring
        input: { title: "Discovery", min_duration: 300, expand: [ai-scoring], size: 50 }
    call:
      method: GET
      path: /calls
      query: { ids: ids, title: title, min_duration: min_duration, from: date_from, to: date_to,
               created_from: created_from, created_to: created_to, user_id: user_id,
               deal_id: deal_id, account_id: account_id,
               recording_retention_status: recording_retention_status,
               expand: expand, page: page, size: size }
    cost: { per: request }

  - name: get_call
    class: read
    description: >-
      Get one Modjo call by its numeric id or its UUID (the one an upload
      returns): date, duration, direction, language, status, retention status,
      CRM activity. expand inlines participants, deal, account, transcript,
      AI summaries, notes, next steps, topics, tags, CRM filling answers and
      AI scoring in a single request.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: &call_id
          type: string
          pattern: "^([0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
          description: "Numeric call id, or the call UUID."
        expand: *expand
    examples:
      - title: One call with its summaries and next steps
        input: { call_id: "123456", expand: [summaries, next-steps, contacts] }
    refusals:
      - &call_not_found { code: call_not_found, when: 404, message: "No call with this id in this Modjo workspace." }
    call:
      method: GET
      path: "/calls/{call_id}"
      query: { expand: expand }
    cost: { per: request }

  - name: get_call_transcript
    class: read
    description: >-
      Get the transcript of one Modjo call: timed blocks with their speaker
      (type user for a workspace member, contact for an external participant).
      Empty while the call is still processing.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Transcript of a call
        input: { call_id: "123456" }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/calls/{call_id}/transcript" }
    cost: { per: request }

  - name: list_call_summaries
    class: read
    description: >-
      Get the AI summaries of one Modjo call, one per summary template of the
      workspace; the text is in answer.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Summaries of a call
        input: { call_id: "123456" }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/calls/{call_id}/summaries" }
    cost: { per: request }

  - name: list_call_notes
    class: read
    description: >-
      Get the published notes of one Modjo call, written by a user or by the
      AI; drafts are not returned. rawContent is rich text in JSON.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Notes of a call
        input: { call_id: "123456" }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/calls/{call_id}/notes" }
    cost: { per: request }

  - name: list_call_next_steps
    class: read
    description: >-
      Get the next steps Modjo's AI drew from one call (title, description).
      Empty while the call is processing or when there is none.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Next steps of a call
        input: { call_id: "123456" }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/calls/{call_id}/next-steps" }
    cost: { per: request }

  - name: get_call_recording
    class: read
    description: >-
      Get a signed URL to download the audio or video recording of one Modjo
      call. The URL expires after one hour (expiresAt): fetch it right before
      use and never store it.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Recording of a call
        input: { call_id: "123456" }
    refusals:
      - { code: recording_unavailable, when: 404,
          message: "No recording available for this call, or no call with this id." }
      - { code: recording_deleted, when: 410,
          message: "The recording of this call was deleted by the workspace's retention policy." }
    call: { method: GET, path: "/calls/{call_id}/recording" }
    cost: { per: request }

  - name: list_call_crm_filling_answers
    class: read
    description: >-
      List the CRM field values Modjo's AI filled from one call and pushed to
      the CRM; answers never pushed are not returned. crmFillingFieldUuid
      refers to a field of list_crm_filling_template_fields.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
        page: *page
        size: *size
    examples:
      - title: CRM answers of a call
        input: { call_id: "123456" }
    refusals:
      - *call_not_found
    call:
      method: GET
      path: "/calls/{call_id}/crm-filling-answers"
      query: { page: page, size: size }
    cost: { per: request }

  - name: list_call_tags
    class: read
    description: Get the tags set on one Modjo call.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Tags of a call
        input: { call_id: "123456" }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/calls/{call_id}/tags" }
    cost: { per: request }

  - name: add_call_tag
    class: write
    description: >-
      Set an existing tag on one Modjo call (tag ids from list_tags).
      Idempotent: a tag already set stays set once.
    input:
      type: object
      additionalProperties: false
      required: [call_id, tag_id]
      properties:
        call_id: *call_id
        tag_id: &tag_id { type: integer, minimum: 1 }
    examples:
      - title: Tag a call
        input: { call_id: "123456", tag_id: 7 }
    refusals:
      - { code: call_or_tag_not_found, when: 404, message: "No call or no tag with this id in this Modjo workspace." }
    call:
      method: POST
      path: "/calls/{call_id}/tags"
      body: { tagId: tag_id }
    cost: { per: request }

  - name: remove_call_tag
    class: write
    description: Remove a tag from one Modjo call; the tag itself is kept.
    input:
      type: object
      additionalProperties: false
      required: [call_id, tag_id]
      properties:
        call_id: *call_id
        tag_id: *tag_id
    examples:
      - title: Untag a call
        input: { call_id: "123456", tag_id: 7 }
    refusals:
      - { code: tag_not_on_call, when: 404, message: "This tag is not set on this call, or the call or the tag does not exist." }
    call: { method: DELETE, path: "/calls/{call_id}/tags/{tag_id}" }
    cost: { per: request }

  - name: upload_call
    class: sensitive
    description: >-
      Import into Modjo a call recorded elsewhere: Modjo downloads the media
      from media_url, which must be publicly reachable. At least one
      participant of type user must be a licensed Modjo user. Processing is
      asynchronous (5 to 30 minutes): the answer gives the call UUID and
      status processing; read it with get_call until completed or failed.
      Modjo also logs the call in the connected CRM, updating the activity
      crm_activity_id when given, creating one otherwise. The API cannot
      delete a call.
    input:
      type: object
      additionalProperties: false
      required: [media_url, date, participants]
      properties:
        media_url: { type: string, format: uri, pattern: "^https://", description: "Public URL of the audio or video file." }
        date: { type: string, format: date-time, description: "Start of the call, ISO 8601." }
        participants:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [email, type]
            properties:
              email: { type: string, format: email }
              name: { type: string, minLength: 1 }
              type: { enum: [user, contact], description: "user: a workspace member; contact: an external participant." }
        name: { type: string, minLength: 1, description: "Call title; generated from the participants when omitted." }
        direction: { type: string, enum: [inbound, outbound], default: outbound }
        duration: { type: number, minimum: 0, description: "Duration in seconds." }
        tags: { type: array, items: { type: string, minLength: 1 }, description: "Tag names to set on the call." }
        account: &crm_link
          type: object
          additionalProperties: false
          required: [crm, crmId]
          properties:
            crm: { type: string, minLength: 1, description: "CRM name, as Modjo knows it: salesforce, hubspot..." }
            crmId: { type: string, minLength: 1, description: "Id of the object in that CRM." }
          description: "CRM account or deal to link the call to."
        deal: *crm_link
        crm_activity_id: { type: string, minLength: 1, description: "Id of the call activity already logged in the CRM, which Modjo updates." }
    examples:
      - title: Import a call with one user and one contact
        input:
          media_url: "https://storage.example.com/recordings/call-123.mp3"
          date: "2026-10-12T09:30:00Z"
          participants:
            - { email: "jane.doe@company.example", type: user }
            - { email: "john@customer.example", name: John Smith, type: contact }
          name: Demo with Customer
          direction: outbound
    confirm:
      summary: "Import into Modjo the call of {date} from {media_url}: it is logged in the connected CRM and cannot be deleted through the API."
    call:
      method: POST
      path: /calls
      body: { downloadMediaUrl: media_url, date: date, participants: participants, name: name,
              direction: direction, duration: duration, tags: tags, account: account,
              deal: deal, crmActivityId: crm_activity_id }
    cost: { per: request }

  - name: list_call_reviews
    class: read
    description: >-
      List the reviews of calls (coaching scorecards), with their answers per
      question; ratings go from 0 to 4, -1 meaning not applicable. Newest
      first unless order is asc, the choice for incremental syncs. The API
      returns private reviews too (isPrivate is informative only).
    input:
      type: object
      additionalProperties: false
      properties:
        start_date_time: { type: string, format: date-time, description: "Reviews created from this date-time, inclusive." }
        end_date_time: { type: string, format: date-time, description: "Reviews created until this date-time, inclusive." }
        order: { type: string, enum: [asc, desc], default: desc }
        page: *page
        size: *size
    examples:
      - title: Reviews of the last month, oldest first
        input: { start_date_time: "2026-09-12T00:00:00Z", order: asc }
    call:
      method: GET
      path: /call-reviews
      query: { startDateTime: start_date_time, endDateTime: end_date_time, order: order,
               page: page, size: size }
    cost: { per: request }

  # --- CRM objects mirrored by Modjo --------------------------------------------
  - name: list_accounts
    class: read
    description: >-
      List the accounts (companies) Modjo mirrors from the connected CRM, with
      their CRM id and link.
    input:
      type: object
      additionalProperties: false
      properties:
        name: &name_filter { type: string, minLength: 1, description: "Filter by name." }
        page: *page
        size: *size
    examples:
      - title: Accounts named Acme
        input: { name: Acme }
    call:
      method: GET
      path: /accounts
      query: { name: name, page: page, size: size }
    cost: { per: request }

  - name: get_account
    class: read
    description: Get one account Modjo mirrors from the connected CRM.
    input:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: integer, minimum: 1 }
    examples:
      - title: One account
        input: { account_id: 42 }
    refusals:
      - { code: account_not_found, when: 404, message: "No account with this id in this Modjo workspace." }
    call: { method: GET, path: "/accounts/{account_id}" }
    cost: { per: request }

  - name: list_contacts
    class: read
    description: >-
      List the contacts (external people) Modjo mirrors from the connected
      CRM: email, phone, job title, account.
    input:
      type: object
      additionalProperties: false
      properties:
        name: *name_filter
        page: *page
        size: *size
    examples:
      - title: Contacts named Smith
        input: { name: Smith }
    call:
      method: GET
      path: /contacts
      query: { name: name, page: page, size: size }
    cost: { per: request }

  - name: get_contact
    class: read
    description: Get one contact Modjo mirrors from the connected CRM.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: { type: integer, minimum: 1 }
    examples:
      - title: One contact
        input: { contact_id: 42 }
    refusals:
      - { code: contact_not_found, when: 404, message: "No contact with this id in this Modjo workspace." }
    call: { method: GET, path: "/contacts/{contact_id}" }
    cost: { per: request }

  - name: list_deals
    class: read
    description: >-
      List the deals Modjo mirrors from the connected CRM: status, stage,
      amount, close date, probability, owner (a Modjo user id).
    input:
      type: object
      additionalProperties: false
      properties:
        name: *name_filter
        account_id: { type: integer, minimum: 1, description: "Only the deals of this account." }
        status: { type: string, enum: [Open, Closed won, Closed lost, Closed, Deleted] }
        page: *page
        size: *size
    examples:
      - title: Open deals of an account
        input: { account_id: 42, status: Open }
    call:
      method: GET
      path: /deals
      query: { name: name, account_id: account_id, status: status, page: page, size: size }
    cost: { per: request }

  - name: get_deal_summary
    class: read
    description: >-
      Get the AI summary Modjo built for one deal across its calls, as typed
      sections.
    input:
      type: object
      additionalProperties: false
      required: [deal_id]
      properties:
        deal_id: { type: integer, minimum: 1 }
    examples:
      - title: Summary of a deal
        input: { deal_id: 42 }
    refusals:
      - { code: deal_summary_not_found, when: 404, message: "No deal with this id, or no summary for it yet." }
    call: { method: GET, path: "/deals/{deal_id}/summary" }
    cost: { per: request }

  # --- workspace ----------------------------------------------------------------
  - name: list_tags
    class: read
    description: List the call tags of the Modjo workspace.
    input:
      type: object
      additionalProperties: false
      properties:
        page: *page
        size: *size
    examples:
      - title: All tags
        input: {}
    call:
      method: GET
      path: /tags
      query: { page: page, size: size }
    cost: { per: request }

  - name: list_topics
    class: read
    description: >-
      List the topics Modjo detects in calls (saidBy: by a user, by a
      contact, or by anyone).
    input:
      type: object
      additionalProperties: false
      properties:
        page: *page
        size: *size
    examples:
      - title: All topics
        input: {}
    call:
      method: GET
      path: /topics
      query: { page: page, size: size }
    cost: { per: request }

  - name: list_users
    class: read
    description: >-
      List the members of the Modjo workspace (role user, manager or admin).
      email finds one person, whose id filters list_calls.
    input:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, description: "Exact email of one member." }
        page: *page
        size: *size
    examples:
      - title: Find a member by email
        input: { email: "jane.doe@company.example" }
    call:
      method: GET
      path: /users
      query: { email: email, page: page, size: size }
    cost: { per: request }

  - name: get_user
    class: read
    description: Get one member of the Modjo workspace.
    input:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: integer, minimum: 1 }
    examples:
      - title: One member
        input: { user_id: 42 }
    refusals:
      - { code: user_not_found, when: 404, message: "No member with this id in this Modjo workspace." }
    call: { method: GET, path: "/users/{user_id}" }
    cost: { per: request }

  - name: list_teams
    class: read
    description: List the teams of the Modjo workspace.
    input:
      type: object
      additionalProperties: false
      properties:
        name: *name_filter
        page: *page
        size: *size
    examples:
      - title: All teams
        input: {}
    call:
      method: GET
      path: /teams
      query: { name: name, page: page, size: size }
    cost: { per: request }

  - name: get_team
    class: read
    description: Get one team of the Modjo workspace.
    input:
      type: object
      additionalProperties: false
      required: [team_id]
      properties:
        team_id: &team_id { type: integer, minimum: 1 }
    examples:
      - title: One team
        input: { team_id: 3 }
    refusals:
      - &team_not_found { code: team_not_found, when: 404, message: "No team with this id in this Modjo workspace." }
    call: { method: GET, path: "/teams/{team_id}" }
    cost: { per: request }

  - name: list_team_members
    class: read
    description: List the members of one Modjo team.
    input:
      type: object
      additionalProperties: false
      required: [team_id]
      properties:
        team_id: *team_id
        page: *page
        size: *size
    examples:
      - title: Members of a team
        input: { team_id: 3 }
    refusals:
      - *team_not_found
    call:
      method: GET
      path: "/teams/{team_id}/members"
      query: { page: page, size: size }
    cost: { per: request }

  # --- CRM filling templates ------------------------------------------------------
  - name: list_crm_filling_templates
    class: read
    description: >-
      List the CRM filling templates: which calls (duration, providers, teams,
      tags) get CRM fields filled by Modjo's AI.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending, published] }
        page: *page
        size: *size
    examples:
      - title: Published templates
        input: { status: published }
    call:
      method: GET
      path: /crm-filling-templates
      query: { status: status, page: page, size: size }
    cost: { per: request }

  - name: get_crm_filling_template
    class: read
    description: Get one CRM filling template.
    input:
      type: object
      additionalProperties: false
      required: [template_uuid]
      properties:
        template_uuid: &template_uuid
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    examples:
      - title: One template
        input: { template_uuid: "0b6c3f7e-2a41-4d0c-9a51-3f1e2d7c8b90" }
    refusals:
      - &template_not_found { code: template_not_found, when: 404, message: "No CRM filling template with this uuid." }
    call: { method: GET, path: "/crm-filling-templates/{template_uuid}" }
    cost: { per: request }

  - name: list_crm_filling_template_fields
    class: read
    description: >-
      List the fields of one CRM filling template: the prompt, the CRM field
      it fills (entity, key, type) and whether it is pushed automatically.
    input:
      type: object
      additionalProperties: false
      required: [template_uuid]
      properties:
        template_uuid: *template_uuid
        page: *page
        size: *size
    examples:
      - title: Fields of a template
