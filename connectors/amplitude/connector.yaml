# yaml-language-server: $schema=../connector.schema.json
# Amplitude references:
#   https://amplitude.com/docs/apis/analytics/dashboard-rest
#   https://amplitude.com/docs/apis/analytics/taxonomy
#   https://amplitude.com/docs/apis/analytics/behavioral-cohorts
# Read only. One key pair = one project: there is no project argument anywhere.
# One host per region, chosen per account by the region setting: a project lives
# in one region, and its keys are unknown to the other host.
connector:
  name: amplitude
  label: Amplitude
  namespace: amplitude
  version: 1.1.0
  api_version: "Dashboard REST and Taxonomy api/2; charts and cohort list api/3; cohort download api/5"
  base_urls:
    setting: region
    values:
      us: https://amplitude.com
      eu: https://analytics.eu.amplitude.com
  auth:
    kind: basic
    username: api_key
    password: secret_key
  credential:
    - { name: api_key, label: API key, secret: true }
    - { name: secret_key, label: Secret key, secret: true }
  settings:
    - { name: region, label: Data region, type: choice, choices: [us, eu], default: us }
  modes: [byo_user, byo_org]
  timeout_s: 60
  query_arrays: repeat
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Amplitude rejected the request as invalid: check the arguments and the exact event and property names." }
    - { status: [401, 403], code: access_rejected, retryable: false,
        message: "Amplitude refused the key pair: \"Invalid API Key\" means the key is unknown on this host (the project may live in the EU region); \"Invalid API/Secret Key combination\" means the secret key is wrong or missing." }
    - { status: 404, code: not_found, retryable: false,
        message: "Amplitude object not found: check the id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Amplitude query budget or concurrency limit reached for this project: retry later, or query a shorter window." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Amplitude is temporarily unavailable: retry later." }

functions:
  # --- Taxonomy: the project's vocabulary -----------------------------------
  - name: list_event_types
    class: read
    description: >-
      List the event types declared in this Amplitude project, with category,
      description and visibility. Read it before writing a query: a misspelt
      event name returns zeros, not an error.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: All declared event types
        input: {}
    call: { method: GET, path: /api/2/taxonomy/event }
    output: { items: data }

  - name: list_event_properties
    class: read
    description: >-
      List the event properties of this Amplitude project, or only those of
      one event type.
    input:
      type: object
      additionalProperties: false
      properties:
        event_type: { type: string, minLength: 1, description: "Only this event type's properties." }
    examples:
      - title: Properties of one event
        input: { event_type: Sign Up }
      - title: All event properties
        input: {}
    call: { method: GET, path: /api/2/taxonomy/event-property, query: { event_type: event_type } }
    output: { items: data }

  - name: list_user_properties
    class: read
    description: >-
      List the user properties of this Amplitude project. Custom ones come back
      prefixed gp: — use that exact name in segments and group-bys.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: All user properties
        input: {}
    call: { method: GET, path: /api/2/taxonomy/user-property }
    output: { items: data }

  - name: list_group_properties
    class: read
    description: >-
      List the group (account) properties of this Amplitude project, prefixed
      grp:. Empty when the project has no Accounts add-on.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: All group properties
        input: {}
    call: { method: GET, path: /api/2/taxonomy/group-property }
    output: { items: data }

  - name: list_events
    class: read
    description: >-
      List the event types with their weekly totals and uniques: what actually
      fires, not only what is declared.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Event volumes this week
        input: {}
    call: { method: GET, path: /api/2/events/list }
    output: { items: data }

  # --- Dashboard REST queries -------------------------------------------------
  - name: get_segmentation
    class: read
    description: >-
      Compute one event's metric over time (event segmentation). Each query
      spends the project's hourly cost budget (days x conditions x query type):
      keep windows short or use a weekly or monthly interval. Prefer a saved
      chart (get_chart) when the team already has one.
    input:
      type: object
      additionalProperties: false
      required: [event, start, end]
      properties:
        event: &event
          type: string
          contentMediaType: application/json
          description: >-
            JSON event object: {"event_type": "Sign Up", "filters": [...],
            "group_by": [{"type": "event", "value": "plan"}]}. _active is any
            active event, _all any event.
        start: &day { type: string, pattern: "^[0-9]{8}$", description: "First day, YYYYMMDD." }
        end: { type: string, pattern: "^[0-9]{8}$", description: "Last day, YYYYMMDD, inclusive." }
        metric:
          type: string
          enum: [uniques, totals, pct_dau, average, histogram, sums, value_avg, formula]
          description: "Defaults to uniques on Amplitude's side."
        interval:
          type: integer
          enum: [1, 7, 30, -3600000, -300000]
          description: "1 daily (default), 7 weekly, 30 monthly, -3600000 hourly, -300000 realtime."
        segments: &segments
          type: string
          contentMediaType: application/json
          description: >-
            JSON list of user segments to compare:
            [{"prop": "country", "op": "is", "values": ["France"]}].
        group_by: &group_by { type: string, minLength: 1, description: "One property to break down by: country, gp:plan." }
        limit: &limit { type: integer, minimum: 1, maximum: 1000, description: "Group-by values returned." }
        event2:
          type: string
          contentMediaType: application/json
          description: "Second JSON event object, for metric formula."
        formula: { type: string, minLength: 1, description: "Formula, for metric formula." }
    examples:
      - title: Daily unique sign-ups in September
        input: { event: '{"event_type":"Sign Up"}', start: "20260901", end: "20260930" }
      - title: Weekly totals by country, French users only
        input:
          event: '{"event_type":"Purchase"}'
          start: "20260801"
          end: "20260930"
          metric: totals
          interval: 7
          segments: '[{"prop":"country","op":"is","values":["France"]}]'
          group_by: city
    call:
      method: GET
      path: /api/2/events/segmentation
      query: { e: event, e2: event2, m: metric, i: interval, limit: limit, formula: formula,
               start: start, end: end, s: segments, g: group_by }

  - name: get_funnel
    class: read
    description: >-
      Compute the conversion through ordered steps (funnel). Spends the
      project's hourly cost budget. Prefer a saved chart (get_chart) when the
      team already has the funnel: conversion window, step order and
      exclusions rarely survive being re-specified.
    input:
      type: object
      additionalProperties: false
      required: [events, start, end]
      properties:
        events:
          type: array
          minItems: 2
          items: *event
          description: "The steps, in order, each a JSON event object."
        start: *day
        end: { type: string, pattern: "^[0-9]{8}$", description: "Last day, YYYYMMDD, inclusive." }
        mode: { type: string, enum: [ordered, unordered, sequential], description: "Defaults to ordered." }
        new_or_active: { type: string, enum: [active, new], description: "Defaults to active." }
        conversion_window_seconds:
          type: integer
          minimum: 1
          description: "Defaults to 2592000 (30 days)."
        segments: *segments
        group_by: *group_by
        limit: *limit
    examples:
      - title: Sign-up to purchase in September
        input:
          events: ['{"event_type":"Sign Up"}', '{"event_type":"Purchase"}']
          start: "20260901"
          end: "20260930"
          conversion_window_seconds: 604800
    call:
      method: GET
      path: /api/2/funnels
      query: { e: events, mode: mode, n: new_or_active, cs: conversion_window_seconds,
               limit: limit, start: start, end: end, s: segments, g: group_by }

  - name: get_retention
    class: read
    description: >-
      Of the users who did start_event, how many came back to do return_event
      (use {"event_type": "_active"} for any event). Spends the project's
      hourly cost budget.
    input:
      type: object
      additionalProperties: false
      required: [start_event, return_event, start, end]
      properties:
        start_event: *event
        return_event: *event
        start: *day
        end: { type: string, pattern: "^[0-9]{8}$", description: "Last day, YYYYMMDD, inclusive." }
        mode: { type: string, enum: [n-day, rolling, bracket], description: "Defaults to n-day." }
        interval: { type: integer, enum: [1, 7, 30], description: "1 daily, 7 weekly, 30 monthly." }
        segments: *segments
        group_by: *group_by
    examples:
      - title: Weekly retention of new sign-ups
        input:
          start_event: '{"event_type":"Sign Up"}'
          return_event: '{"event_type":"_active"}'
          start: "20260801"
          end: "20260930"
          interval: 7
    call:
      method: GET
      path: /api/2/retention
      query: { se: start_event, re: return_event, rm: mode, i: interval,
               start: start, end: end, s: segments, g: group_by }

  - name: get_active_users
    class: read
    description: >-
      Count active (default) or new users over time. Spends the project's
      hourly cost budget.
    input:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: *day
        end: { type: string, pattern: "^[0-9]{8}$", description: "Last day, YYYYMMDD, inclusive." }
        metric: { type: string, enum: [active, new], description: "Defaults to active." }
        interval: { type: integer, enum: [1, 7, 30], description: "1 daily, 7 weekly, 30 monthly." }
        segments: *segments
        group_by: *group_by
    examples:
      - title: Monthly new users this year
        input: { start: "20260101", end: "20260930", metric: new, interval: 30 }
    call:
      method: GET
      path: /api/2/users
      query: { m: metric, i: interval, start: start, end: end, s: segments, g: group_by }

  - name: get_sessions
    class: read
    description: >-
      Session metrics over a window: length (distribution of session
      lengths), average (average session length) or peruser (sessions per
      user).
    input:
      type: object
      additionalProperties: false
      required: [kind, start, end]
      properties:
        kind: { type: string, enum: [length, average, peruser] }
        start: *day
        end: { type: string, pattern: "^[0-9]{8}$", description: "Last day, YYYYMMDD, inclusive." }
    examples:
      - title: Average session length in September
        input: { kind: average, start: "20260901", end: "20260930" }
    call:
      method: GET
      path: /api/2/sessions/{kind}
      query: { start: start, end: end }

  # --- Saved charts -------------------------------------------------------------
  - name: get_chart
    class: read
    description: >-
      Run a saved Amplitude chart and return its results as JSON, computed by
      Amplitude with the chart's own definition: the number the team reads in
      Amplitude. The chart id is the last segment of the chart URL.
    input:
      type: object
      additionalProperties: false
      required: [chart_id]
      properties:
        chart_id: { type: string, pattern: "^[^/?#\\s.][^/?#\\s]*$" }
    examples:
      - title: One saved chart
        input: { chart_id: abc123x }
    refusals:
      - { code: chart_not_found, when: 404, message: "No saved chart with this id in this Amplitude project." }
    call: { method: GET, path: "/api/3/chart/{chart_id}/query" }

  # --- Users: 360 queries per hour shared by both -----------------------------
  - name: search_users
    class: read
    description: >-
      Find a user by user id, device id or Amplitude id. Returns the matches
      with their amplitude_id, needed to read the user's activity. Shares a
      budget of 360 calls per hour with get_user_activity.
    input:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { type: string, minLength: 1, description: "User id, device id or Amplitude id." }
    examples:
      - title: Find a user by their user id
        input: { user: user-1042 }
    call: { method: GET, path: /api/2/usersearch, query: { user: user } }
    output: { items: matches }

  - name: get_user_activity
    class: read
    description: >-
      Read one user's summary and event stream. Takes the amplitude_id
      returned by search_users, not the user id.
    input:
      type: object
      additionalProperties: false
      required: [amplitude_id]
      properties:
        amplitude_id: { type: string, pattern: "^[0-9]+$", description: "From search_users." }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 1000, description: "Events returned, Amplitude default 1000." }
        direction: { type: string, enum: [latest, earliest], description: "Defaults to latest." }
    examples:
      - title: Latest 50 events of a user
        input: { amplitude_id: "123456789", limit: 50 }
    call:
      method: GET
      path: /api/2/useractivity
      query: { user: amplitude_id, offset: offset, limit: limit, direction: direction }

  # --- Behavioral cohorts (Growth / Enterprise add-on) -------------------------
  - name: list_cohorts
    class: read
    description: >-
      List the project's behavioral cohorts: id, name, size, last computed.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: All cohorts
        input: {}
    call: { method: GET, path: /api/3/cohorts }
    output: { items: cohorts }

  - name: request_cohort_download
    class: read
    description: >-
      Start a download job for one cohort and return its request_id. Each
      request counts against the project's 500 cohort downloads per month.
      Poll get_cohort_download_status with the request_id until JOB COMPLETED.
    input:
      type: object
      additionalProperties: false
      required: [cohort_id]
      properties:
        cohort_id: { type: string, pattern: "^[^/?#\\s.][^/?#\\s]*$", description: "From list_cohorts." }
        props: { type: integer, enum: [0, 1], default: 0, description: "1 includes user properties in the file." }
    examples:
      - title: Download a cohort with user properties
        input: { cohort_id: x7y8z9, props: 1 }
    call:
      method: GET
      path: "/api/5/cohorts/request/{cohort_id}"
      query: { props: props }

  - name: get_cohort_download_status
    class: read
    description: >-
      Read the status of a cohort download job: async_status is JOB INPROGRESS
      while running, JOB COMPLETED when the file is ready.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string, pattern: "^[^/?#\\s.][^/?#\\s]*$", description: "From request_cohort_download." }
    examples:
      - title: Status of a download job
        input: { request_id: req-4f2a }
    call: { method: GET, path: "/api/5/cohorts/request-status/{request_id}" }

exposure:
  mode: per_connector
  tool: amplitude
