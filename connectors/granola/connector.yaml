# yaml-language-server: $schema=../connector.schema.json
# Granola API v1 (https://docs.granola.ai, OpenAPI 3.1.0 https://docs.granola.ai/api-reference/openapi.json, read on
# 2026-10-24). The values come from the Python client, oto.tools.granola, which this description follows: one request
# per method to public-api.granola.ai, the API key (grn_…) as a Bearer token, JSON bodies. The function names, the
# argument names and the keys sent to Granola are the client's (tests/test_granola_description.py reads it to keep
# both equal).
#
# Eight functions over four objects: notes, a note's transcript, folders, webhook endpoints. Not described, as the
# client leaves them out: the audit log (GET /v1/audit, answered 404 on a workspace key whose other routes worked),
# and what the OpenAPI added since the client was written (spaces, legal holds, the space_id filter of the notes).
#
# Read and act. The notes, the transcript, the folders and the list of endpoints are reads. Creating and changing an
# endpoint are writes, served on the act side. Deleting one is sensitive, with a confirmation, as for every webhook
# delete described here: deliveries stop for good.
#
# No secret reaches the agent. Granola returns an endpoint's signing secret (Standard Webhooks, HMAC-SHA256) only in
# the answer that creates it, and never again: every answer about an endpoint strips signing_secret (output.strip),
# and the client strips it the same way. An endpoint created here cannot have its deliveries verified by signature.
#
# No address that opens content without a login reaches the agent either: the url of a photo attached to a note
# (attachments[].url, "anyone with this URL can view it") is stripped from get_note, and the client strips it the
# same way.
#
# Ids. Granola's ids are a prefix and fourteen letters or digits (not_, fol_, whe_), the prefix in any case; the
# schema takes the patterns of the OpenAPI, where the client passes any text through.
#
# Pagination: the three lists answer {<items>, hasMore, cursor}, the cursor passed back as the cursor argument.
#
# Rate: 25 requests per 5 seconds in burst, 5 per second sustained (300 per minute), per key; the sustained rate is
# declared. The client does not pace.
#
# Errors (the client names none: raise_for_upstream, every status above 400 the same error). The 401 says an invalid
# API key: it marks the account credential_rejected. The 403 says a scope that the workspace's API settings disable,
# an endpoint that only its creator may change, or a workspace-managed endpoint: not a refused key. The 404 of a
# webhook route may say the webhooks API is not open for this workspace. A 429 and a 5xx are retryable, as oto 1 says
# ("try again in a moment", "try again later"); a 5xx on a create may have registered the endpoint.
#
# Probe: list_webhook_endpoints, as oto 1, a read without argument. A workspace without the webhooks API answers it 404:
# to read on a real call.
connector:
  name: granola
  label: Granola
  namespace: granola
  version: 1.0.0
  api_version: v1
  base_url: https://public-api.granola.ai
  auth: { kind: bearer, token: api_key }
  credential:
    - { name: api_key, label: API key, secret: true }
  # A personal key (any member of a Business plan) or a workspace key (provisioned by an admin): same Bearer header,
  # Granola applies the key's scope. No platform key.
  modes: [byo_user, byo_org]
  timeout_s: 60
  rate_limit: { requests: 5, seconds: 1 }
  probe: { function: list_webhook_endpoints }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Granola rejected the request: an id, a date, page_size or a cursor is invalid, or the scopes do not fit the key (a workspace key takes exactly [workspace])." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "Granola rejected the API key: invalid or revoked. A key is made in the Granola app, Settings, Connectors, API keys." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Granola refused this call for this key: a scope disabled by the workspace's API settings, an endpoint that only its creator may change (others change only enabled), or a workspace-managed endpoint whose scope is fixed." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Granola: wrong id, out of this key's reach, or the webhooks API is not available for this workspace." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Granola rate limit reached (25 requests per 5 seconds, 5 per second sustained): wait a moment, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Granola is temporarily unavailable: try again later. A webhook endpoint being created may have been registered: list the endpoints before creating it again." }

functions:
  # --- Notes -----------------------------------------------------------------------

  - name: list_notes
    class: read
    description: >-
      List the meeting notes this key can reach: id, title, owner, created_at,
      updated_at (and deleted_at, seen only by keys that reach every workspace
      note). Filters: created_before, created_after, updated_after (a date or
      a date-time), folder_id (the folder and its subfolders). The content of a
      note (summary, attendees, transcript) comes with get_note. A page holds
      page_size notes; hasMore and cursor give the next one.
    input:
      type: object
      additionalProperties: false
      properties:
        created_before: { type: string, minLength: 1, description: "Notes created before this date (YYYY-MM-DD) or date-time (ISO 8601)." }
        created_after: { type: string, minLength: 1, description: "Notes created after this date (YYYY-MM-DD) or date-time (ISO 8601)." }
        updated_after: { type: string, minLength: 1, description: "Notes updated after this date (YYYY-MM-DD) or date-time (ISO 8601)." }
        folder_id: &folder_id { type: string, pattern: "^[Ff][Oo][Ll]_[a-zA-Z0-9]{14}$", description: "A folder id (fol_…), from list_folders." }
        cursor: &cursor { type: string, minLength: 1, description: "cursor of the previous page." }
        page_size: &page_size_30 { type: integer, minimum: 1, maximum: 30, description: "Page size, 10 by default, at most 30." }
    examples:
      - { title: The latest notes, input: {} }
      - { title: Notes of a folder since a date, input: { folder_id: fol_4y6LduVdwSKC27, created_after: "2026-10-01", page_size: 30 } }
    call:
      method: GET
      path: /v1/notes
      query:
        created_before: created_before
        created_after: created_after
        updated_after: updated_after
        folder_id: folder_id
        cursor: cursor
        page_size: page_size
    pagination: { kind: cursor, request_param: cursor, next: cursor, more: hasMore, max_pages: 10 }
    output: { items: notes }
    cost: &request { per: request }

  - name: get_note
    class: read
    description: >-
      One meeting note: title, owner, calendar event and its invitees,
      attendees, folders and spaces, the AI summary (text and markdown),
      private notes, and its link in the Granola web app. include=transcript
      adds the transcript inline; a transcript too large to come inline is
      refused, then read it page by page with get_transcript. The download
      address of a photo attached to the note is never given: anyone holding
      it sees the photo.
    input:
      type: object
      additionalProperties: false
      required: [note_id]
      properties:
        note_id: &note_id { type: string, pattern: "^[Nn][Oo][Tt]_[a-zA-Z0-9]{14}$", description: "A note id (not_…), from list_notes." }
        include: { type: string, enum: [transcript], description: "transcript adds the transcript inline." }
    examples:
      - { title: A note, input: { note_id: not_1d3tmYTlCICgjy } }
      - { title: A note with its transcript, input: { note_id: not_1d3tmYTlCICgjy, include: transcript } }
    call:
      method: GET
      path: "/v1/notes/{note_id}"
      query: { include: include }
    refusals:
      - { code: transcript_too_large, when: 413,
          message: "The transcript of this note is too large to come inline: read it page by page." }
    # Anyone with the address of an attached photo can view it: it never reaches the agent.
    output:
      strip: [attachments.url]
      sample:
        id: not_1d3tmYTlCICgjy
        object: note
        title: Weekly sync
        attachments: [{ id: att_4y6LduVdwSKC27, object: attachment, type: photo, url: "https://files.example.test/photo.jpg", width: 800, height: 600 }]
    cost: *request

  - name: get_transcript
    class: read
    description: >-
      The transcript of a meeting note, page by page: each item has its
      speaker (source microphone or speaker; attribution me, the note's owner,
      or them; a name when Granola identified the speaker), its text and its
      start and end times. A page holds page_size items; hasMore and cursor
      give the next one.
    input:
      type: object
      additionalProperties: false
      required: [note_id]
      properties:
        note_id: *note_id
        cursor: *cursor
        page_size: { type: integer, minimum: 1, maximum: 100, description: "Page size, 50 by default, at most 100." }
    examples:
      - { title: The transcript of a note, input: { note_id: not_1d3tmYTlCICgjy } }
      - { title: The next page, input: { note_id: not_1d3tmYTlCICgjy, cursor: eyJyb3dfb2Zmc2V0Ijo1MH0, page_size: 100 } }
    call:
      method: GET
      path: "/v1/notes/{note_id}/transcript"
      query: { cursor: cursor, page_size: page_size }
    pagination: { kind: cursor, request_param: cursor, next: cursor, more: hasMore, max_pages: 20 }
    output: { items: transcript }
    cost: *request

  # --- Folders ---------------------------------------------------------------------

  - name: list_folders
    class: read
    description: >-
      List the folders this key can reach, in alphabetical order: id, name,
      parent_folder_id (null at the top level) and space_id. A folder id
      filters list_notes and restricts a webhook endpoint. A page holds
      page_size folders; hasMore and cursor give the next one.
    input:
      type: object
      additionalProperties: false
      properties:
        cursor: *cursor
        page_size: *page_size_30
    examples:
      - { title: The folders, input: {} }
    call:
      method: GET
      path: /v1/folders
      query: { cursor: cursor, page_size: page_size }
    pagination: { kind: cursor, request_param: cursor, next: cursor, more: hasMore, max_pages: 10 }
    output: { items: folders }
    cost: *request

  # --- Webhook endpoints -----------------------------------------------------------
  # No secret reaches the agent: every answer about an endpoint strips signing_secret.

  - name: list_webhook_endpoints
    class: read
    description: >-
      List this key's webhook endpoints: url, events, scopes, folder_ids,
      enabled, creator. The url is cut to its origin when the key's user did
      not create the endpoint. A signing secret is never given.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The webhook endpoints, input: {} }
    call: { method: GET, path: /v1/webhook-endpoints }
    output:
      strip: [webhook_endpoints.signing_secret]
      sample: { webhook_endpoints: [&sample_endpoint { id: whe_2mKr8fQxLp7Ta3, object: webhook_endpoint, url: "https://hooks.example.test/granola", url_redacted: false, events: [note.generated], folder_ids: [], scopes: [personal], enabled: true, signing_secret: sample-signing-secret }] }
    cost: *request

  - name: create_webhook_endpoint
    class: write
    description: >-
      Register an https address that Granola posts note events to:
      note.generated, note.edited, note.access_granted (all three when events
      is omitted), for the notes of scopes: personal (notes the key's user
      owns or that are shared with them), public (notes visible to the whole
      workspace), or both; a workspace API key takes exactly [workspace].
      folder_ids restricts the deliveries to these folders and their
      subfolders. The signing secret, which Granola gives only in this answer,
      is never given: the deliveries to this endpoint cannot be verified by
      their signature from here.
    input:
      type: object
      additionalProperties: false
      required: [url, scopes]
      properties:
        url: &webhook_url { type: string, pattern: "^https://", description: "The publicly reachable https address that receives the events." }
        scopes: &scopes
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [personal, public, workspace] }
        events: &events
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [note.access_granted, note.edited, note.generated] }
        folder_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: *folder_id
    examples:
      - title: Generated notes of a folder
        input: { url: "https://hooks.acme.example/granola", scopes: [personal, public], events: [note.generated], folder_ids: [fol_4y6LduVdwSKC27] }
      - title: Every event, workspace key
        input: { url: "https://hooks.acme.example/granola", scopes: [workspace] }
    call:
      method: POST
      path: /v1/webhook-endpoints
      body: { url: url, scopes: scopes, events: events, folder_ids: folder_ids }
    output: { strip: [signing_secret] }
    cost: *request

  - name: update_webhook_endpoint
    class: write
    description: >-
      Change a webhook endpoint: only the fields given change; scopes, events
      and folder_ids replace the current ones (folder_ids [] removes the
      folder filter); enabled=false pauses the deliveries (events while paused
      are never delivered), true resumes them. Only the endpoint's creator
      changes more than enabled; a workspace-managed endpoint keeps scopes
      [workspace]. A signing secret is never given.
    input:
      type: object
      additionalProperties: false
      required: [webhook_endpoint_id]
      minProperties: 2
      properties:
        webhook_endpoint_id: &webhook_endpoint_id { type: string, pattern: "^[Ww][Hh][Ee]_[a-zA-Z0-9]{14}$", description: "A webhook endpoint id (whe_…), from list_webhook_endpoints." }
        url: *webhook_url
        scopes: *scopes
        events: *events
        folder_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: *folder_id
        enabled: { type: boolean, description: "false pauses the deliveries, true resumes them." }
    examples:
      - { title: Pause an endpoint, input: { webhook_endpoint_id: whe_2mKr8fQxLp7Ta3, enabled: false } }
      - { title: Remove the folder filter, input: { webhook_endpoint_id: whe_2mKr8fQxLp7Ta3, folder_ids: [] } }
    call:
      method: PATCH
      path: "/v1/webhook-endpoints/{webhook_endpoint_id}"
      body: { url: url, scopes: scopes, events: events, folder_ids: folder_ids, enabled: enabled }
    output: { strip: [signing_secret] }
    cost: *request

  - name: delete_webhook_endpoint
    class: sensitive
    description: Delete a webhook endpoint; Granola stops delivering to it, for good.
    input:
      type: object
      additionalProperties: false
      required: [webhook_endpoint_id]
      properties:
        webhook_endpoint_id: *webhook_endpoint_id
    examples:
      - { title: Delete an endpoint, input: { webhook_endpoint_id: whe_2mKr8fQxLp7Ta3 } }
    call: { method: DELETE, path: "/v1/webhook-endpoints/{webhook_endpoint_id}" }
    confirm:
      summary: "Delete Granola webhook endpoint {webhook_endpoint_id}: its deliveries stop for good."
    cost: *request
