# yaml-language-server: $schema=../connector.schema.json
# Dropcontact API v1 (https://developer.dropcontact.com, read on 2026-10-24). The values come from the Python client,
# oto.tools.dropcontact, which this description follows: an asynchronous batch, POSTed to /enrich/all (submit), then
# read back by its request_id (fetch); the API key in the X-Access-Token header. The function names, the argument names
# and the keys sent to Dropcontact are the client's; the client is not changed (tests/test_dropcontact_description.py
# reads it to keep both equal).
#
# Three functions: submit a batch, fetch its result, read the credit balance (check_credits).
# Not described: custom_callback_url, which the client takes, has Dropcontact post the results (personal data) to an
# address of the caller's choosing; the account's default webhook (/enrich/webhook), which the client does not call.
#
# Read and act. submit is a write, served on the act side: it spends Dropcontact credits on persons. fetch is a read.
# check_credits is a read: the client's zero-credit probe, a POST of one empty contact ("A POST with a single empty
# contact returns the credits left without consuming any", Credits), which changes nothing in the account.
#
# Asynchronous: submit answers at once with a request_id; the job runs at Dropcontact (about 30 seconds, no bound
# documented); fetch reads it with the request_id alone, a 200 with success false and a reason while it runs. Not a
# long function (background): the job is held by Dropcontact, with its collection described (async).
#
# Cost of submit, "Pay on success" (Credits): 1 credit per contact when a verified email is returned (refunded when
# none is found), 1 credit per email sent in for verification. The worst case is one credit per contact. No answer says
# the credits consumed (only credits_left, a balance, not a quantity): nothing is settled, and no collection delay is
# needed.
#
# No secret and no address that opens content without a login reaches the agent: the answers carry the contact and
# company data (emails, phones, SIREN, public website and LinkedIn addresses), never the key nor a signed address.
# Nothing is stripped. The fields of a contact that name a person (email, first_name, last_name, full_name, phone,
# linkedin) are personal, and so are its free custom_fields, echoed back unchanged, which nothing says what they carry.
#
# Gaps with the client, named: each contact must carry one of the documented identifying combinations (email, linkedin,
# first_name + last_name + company, full_name + company), which the client does not require and Dropcontact would
# report as an error on the item; the 15 kB cap per contact stays the client's (a schema does not weigh an item).
#
# Rate: 60 requests per second per key; over it, 429. The client does not pace; it waits 30 s for an answer.
#
# Errors, as Dropcontact documents them. 401: wrong access token, marks the account credential_rejected. 403: "the
# token has exceeded its quota", the credits spent, marks the account quota_exhausted. 429: the rate limit, retried, as
# oto 1 says. 500, 503 (maintenance), 504 and 524 (timeouts): not retried, a batch may have been accepted and billed;
# reading a result or the balance again is harmless, as the message says.
#
# Probe: check_credits, as oto 1, a read without argument, free (above). Its balance is credits_left, healthy at one
# credit or more.
connector:
  name: dropcontact
  label: Dropcontact
  namespace: dropcontact
  version: 1.0.0
  api_version: v1
  base_url: https://api.dropcontact.com/v1
  auth: { kind: api_key, in: header, name: X-Access-Token, key: api_key }
  credential:
    - { name: api_key, label: API key, secret: true }
  # As oto 1: the user's or organization's own key, or a platform key on explicit grant.
  modes: [platform, byo_user, byo_org]
  rate_limit: { requests: 60, seconds: 1 }
  probe: { function: check_credits, balance: { path: credits_left, min: 1, unit: credits } }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Dropcontact rejected the request: a field is invalid or unexpected, or the batch is over 250 contacts or 15 kB per contact." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "Dropcontact refused the access token: it is wrong. A token is made in the Dropcontact account, API settings." }
    - { status: 403, code: credits_exhausted, retryable: false, marks_account: quota_exhausted,
        message: "The Dropcontact token has exceeded its quota: the account's credits are spent. Retrying frees nothing: top up the credits or wait for the renewal." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Dropcontact." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Dropcontact rate limit reached (60 requests per second): retry in a moment." }
    - { status: [500, 503, 504, 524], code: upstream_unavailable, retryable: false,
        message: "Dropcontact failed, is in maintenance or timed out. Reading a result or the balance can be retried; a submitted batch may have been accepted and billed: do not submit it again blindly." }

functions:
  - name: submit
    class: write
    description: >-
      Submit a Dropcontact enrichment batch of 1 to 250 contacts and return at
      once {request_id, credits_left, data}: data echoes each contact with its
      own errors or warnings. Each contact gives an email, a linkedin URL,
      first_name, last_name and company, or full_name and company. The job
      runs at Dropcontact, about 30 seconds: read it with fetch and the
      request_id. It finds the professional email (qualified), phones, job,
      company website and LinkedIn; with siren, French company data (SIREN,
      SIRET, VAT, NAF, address, leader). Pay on success: 1 credit per contact
      whose verified email is returned, or whose email sent in is verified.
    input:
      type: object
      additionalProperties: false
      required: [contacts]
      properties:
        contacts:
          type: array
          minItems: 1
          maxItems: 250
          items:
            type: object
            additionalProperties: false
            anyOf:
              - { required: [email] }
              - { required: [linkedin] }
              - { required: [first_name, last_name, company] }
              - { required: [full_name, company] }
            properties:
              email: { type: string, minLength: 3, personal: true }
              first_name: { type: string, minLength: 1, personal: true }
              last_name: { type: string, minLength: 1, personal: true }
              full_name: { type: string, minLength: 1, personal: true }
              phone: { type: string, minLength: 1, personal: true }
              linkedin: { type: string, minLength: 1, personal: true, description: "The person's LinkedIn profile URL." }
              company: { type: string, minLength: 1 }
              website: { type: string, minLength: 1, description: "The company website." }
              num_siren: { type: string, minLength: 1, description: "The company's SIREN number." }
              siret: { type: string, minLength: 1 }
              company_linkedin: { type: string, minLength: 1, description: "The company's LinkedIn page URL." }
              country: { type: string, minLength: 2, description: "A country code, e.g. FR." }
              job: { type: string, minLength: 1, description: "The person's job title." }
              custom_fields:
                type: object
                additionalProperties: { type: string, personal: true }
                description: "Returned unchanged with the result: an id of yours, as strings."
        siren: { type: boolean, default: false, description: "Also find the French company data: SIREN, SIRET, VAT, NAF code, address, leader." }
        language: { type: string, pattern: "^[a-z]{2}$", description: "en for English output; omitted, French." }
    examples:
      - title: The email of one person, by name and company
        input:
          contacts:
            - { first_name: Jane, last_name: Doe, company: Example, website: example.com }
      - title: Two contacts with French company data, in English
        input:
          siren: true
          language: en
          contacts:
            - { email: jane.doe@example.com, custom_fields: { crm_id: "12584" } }
            - { linkedin: "https://www.linkedin.com/in/janedoe/" }
    refusals:
      - { code: request_id_missing, when: "the response carries no request_id",
          message: "Dropcontact accepted the request but returned no request id." }
    expect:
      - { kind: non_empty, refusal: request_id_missing, path: request_id }
    call:
      method: POST
      path: /enrich/all
      body: { data: contacts, siren: siren, language: language }
    cost: { per: item, items: contacts, unit: credits }
    async: { collect: fetch, job_id: { from: request_id, to: request_id } }

  - name: fetch
    class: read
    description: >-
      Read a Dropcontact batch by its request_id, from submit. While it runs:
      {success: false, reason}, the reason "Request not ready yet, try again
      in 30 seconds"; read again then. Another reason is not a pending job:
      check the request_id. Once done: {success: true, credits_left, data},
      one entry per contact: civility, names, email (a list of {email,
      qualification}, such as nominative@pro, catch_all@pro, invalid@invalid),
      phone, mobile_phone, job, job_level, job_function, company, website,
      linkedin, company_linkedin, country, with siren the company's siren,
      siret, address, vat, naf5_code, nb_employees, and custom_fields. A
      contact with nothing found comes back as sent. force_results returns the
      partial result now, unprocessed contacts as sent. Free.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", description: "From submit." }
        force_results: { type: boolean, default: false, description: "Return the partial result now instead of waiting for the whole batch." }
    examples:
      - { title: The result of a batch, input: { request_id: req-0 } }
      - { title: The partial result now, input: { request_id: req-0, force_results: true } }
    refusals:
      - { code: request_not_found, when: 404, message: "No Dropcontact batch with this request id for this key." }
    call:
      method: GET
      path: "/enrich/all/{request_id}"
      query: { forceResults: force_results }

  - name: check_credits
    class: read
    description: >-
      The credits left on the Dropcontact account behind this key:
      {credits_left}. Sends one empty contact, which Dropcontact does not
      bill. Free.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The credits left, input: {} }
    call:
      method: POST
      path: /enrich/all
      constants: { body: { data: [{}] } }
