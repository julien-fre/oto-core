# yaml-language-server: $schema=../connector.schema.json
# Pennylane Firm API v1 reference: https://firm-pennylane.readme.io/ (index:
# https://firm-pennylane.readme.io/llms.txt).
#
# One firm token reaches every company of the firm, within the scopes chosen
# when the token was created: companies:readonly, fiscal_years:readonly or
# fiscal_years:all, dms_files:readonly or dms_files:all. A call outside them
# is refused with 403, and Pennylane names the missing scope. Every function
# but list_companies takes the company in its path: company_id is the firm-side
# id read from list_companies, unrelated to the ids of the Company API
# (connector pennylane), where one key is bound to one company.
#
# Covered: companies, fiscal years and the DMS (folders, files, file changes).
# The DMS has no single-item read, no update, no delete and no move.
#
# Not described here: uploading a file into the DMS (multipart POST
# /companies/{company_id}/dms/files). The format has no multipart body. The
# upload is served by the Python client (PennylaneFirmClient.upload_dms_file)
# behind a relay of the host's own.
#
# list_companies and list_fiscal_years are paged by page number (page,
# per_page): the response gives current_page and total_pages but no next page,
# so the host does not follow them; the agent asks for the next page itself.
#
# The filter query parameter is a JSON array serialised as a string:
# [{"field": "id", "operator": "eq", "value": "42"}]. The agent passes the
# clauses as a list; encode: json serialises them into the query.
connector:
  name: pennylane_firm
  label: Pennylane (firm)
  namespace: pennylane_firm
  version: 1.0.0
  api_version: v1
  base_url: https://app.pennylane.com/api/external/firm/v1
  auth:
    kind: bearer
    token: token
  credential:
    - { name: token, label: Firm API token, secret: true }
  modes: [byo_org]
  timeout_s: 30
  rate_limit: { requests: 5, seconds: 1 }
  probe: { function: list_companies }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Pennylane rejected the request as invalid: check the arguments." }
    - { status: 401, code: token_invalid, retryable: false, marks_account: credential_rejected,
        message: "Pennylane refused the firm token as invalid: a valid token is needed, and retrying unchanged fails the same way." }
    - { status: 403, code: scope_missing, retryable: false,
        message: "The firm token lacks the scope this action requires; Pennylane names it in its message. A missing right is not an argument to fix: tell the user which scope the token needs." }
    - { status: 404, code: not_found, retryable: false,
        message: "No such object for this firm: company_id is the firm-side id from the list of companies, and folder or file ids belong to that one company." }
    - { status: 422, code: content_rejected, retryable: false,
        message: "Pennylane rejected the content: the values sent fail its checks. Fix them before calling again." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Pennylane request rate exceeded (5 requests per second): wait about a minute before retrying." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Pennylane is temporarily unavailable: retry later." }

functions:
  # --- Companies ----------------------------------------------------------

  - name: list_companies
    class: read
    description: >-
      List the companies of the firm the token belongs to: id, name,
      billing_company_name, siren, address, city, postal_code,
      activity_nomenclature, activity_code, external_id, client_code. The id
      is the company_id every other function takes; it is the firm-side id
      and means nothing to the Company API. Paged by page number: the
      response carries current_page, total_pages, total_items and per_page;
      ask for page + 1 while it is below total_pages. Scope
      companies:readonly.
    input:
      type: object
      additionalProperties: false
      properties:
        page: &page { type: integer, minimum: 1, default: 1, description: "Page number, starting at 1." }
        per_page: { type: integer, minimum: 1, maximum: 1000, default: 20 }
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [client_code] }
              operator: { enum: [eq, not_eq, in, not_in] }
              value: &clause_value { type: [string, integer, array], items: { type: [string, integer] } }
            allOf:
              - &in_takes_a_list
                if: { properties: { operator: { enum: [in, not_in] } } }
                then: { properties: { value: { type: array, minItems: 1 } } }
                else: { properties: { value: { type: [string, integer] } } }
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Field: client_code (eq, not_eq, in,
            not_in).
    examples:
      - title: Every company of the firm, in one page
        input: { per_page: 1000 }
      - title: The company with client code 0042
        input: { filter: [{ field: client_code, operator: eq, value: "0042" }] }
    call:
      method: GET
      path: /companies
      query: { page: page, per_page: per_page, filter: filter }
      encode: { filter: json }
    cost: { per: request }

  - name: get_company
    class: read
    description: >-
      Get one company of the firm by its firm-side id (from list_companies):
      name, billing_company_name, siren, address, activity codes,
      external_id, client_code. Scope companies:readonly.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: &company_id
          type: integer
          minimum: 1
          description: "Firm-side company id, from list_companies. Not a Company API id."
    examples:
      - title: One company
        input: { company_id: 1234 }
    refusals:
      - { code: company_not_found, when: 404, message: "No company with this id in the firm: read the ids from the list of companies." }
    call: { method: GET, path: "/companies/{company_id}" }
    cost: { per: request }

  # --- Fiscal years -------------------------------------------------------

  - name: list_fiscal_years
    class: read
    description: >-
      List the fiscal years of one company: id, start, finish (YYYY-MM-DD)
      and status (open, reopen, closed, frozen). Paged by page number, up to
      100 per page: the response carries current_page and total_pages. Scope
      fiscal_years:readonly.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        page: *page
        per_page: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: All fiscal years of a company
        input: { company_id: 1234, per_page: 100 }
    call:
      method: GET
      path: "/companies/{company_id}/fiscal_years"
      query: { page: page, per_page: per_page }
    cost: { per: request }

  # --- DMS ----------------------------------------------------------------

  - name: list_dms_folders
    class: read
    description: >-
      List the folders of one company's DMS: id, name, path (full path from
      the root, e.g. /Annual/2018/FEC), parent_folder ({id}, or null at the
      root), files.url, created_at, updated_at. The tree is rebuilt from
      parent_folder or path. Paged by limit and cursor: pass next_cursor as
      cursor for the next page. Folders cannot be renamed, moved or deleted
      through the API. Scope dms_files:readonly.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id] }
              operator: &operator { enum: [lt, lteq, gt, gteq, eq, not_eq, in, not_in] }
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Field: id (lt, lteq, gt, gteq, eq,
            not_eq, in, not_in).
        limit: &limit { type: integer, minimum: 1, maximum: 100, default: 100 }
        cursor: &cursor { type: string, description: "next_cursor of the previous page." }
    examples:
      - title: The whole folder tree of a company
        input: { company_id: 1234 }
    call:
      method: GET
      path: "/companies/{company_id}/dms/folders"
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: &pagination
      kind: cursor
      request_param: cursor
      next: next_cursor
      more: has_more
      max_pages: 10
    output: &list_output
      items: items
    cost: { per: request }

  - name: list_dms_files
    class: read
    description: >-
      List the files of one company's DMS: id, name, path (full path,
      folders included), parent_folder ({id}, or null at the root), url (to
      download the file), created_at, updated_at. Filter on parent_folder_id
      to list one folder. There is no single-file read: filter on id
      instead. Files cannot be renamed, moved or deleted through the API.
      Paged by limit and cursor: pass next_cursor as cursor for the next
      page. Scope dms_files:readonly.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, parent_folder_id] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id and parent_folder_id (lt,
            lteq, gt, gteq, eq, not_eq, in, not_in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: Files of one folder
        input: { company_id: 1234, filter: [{ field: parent_folder_id, operator: eq, value: 567 }] }
    call:
      method: GET
      path: "/companies/{company_id}/dms/files"
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: create_dms_folder
    class: write
    description: >-
      Create a folder in one company's DMS, at the root or under
      parent_folder_id. Returns the folder with its id and full path. A
      folder cannot be renamed, moved or deleted through the API afterwards:
      list the folders first and reuse an existing one rather than creating
      a duplicate. Scope dms_files:all.
    input:
      type: object
      additionalProperties: false
      required: [company_id, name]
      properties:
        company_id: *company_id
        name: { type: string, minLength: 1, description: "Folder name." }
        parent_folder_id: { type: integer, minimum: 1, description: "Parent folder id; the folder goes at the root without it." }
    examples:
      - title: A folder under an existing one
        input: { company_id: 1234, name: "2026", parent_folder_id: 567 }
    refusals:
      - { code: folder_rejected, when: 422, message: "Pennylane refused to create this folder: check the name and the parent folder." }
    call:
      method: POST
      path: "/companies/{company_id}/dms/folders"
      body: { name: name, parent_folder_id: parent_folder_id }
    cost: { per: request }

  - name: list_dms_file_changes
    class: read
    description: >-
      List the changes to one company's DMS files, oldest first: id (of the
      file), operation (insert, update, delete), processed_at, updated_at,
      created_at. Start from start_date (RFC 3339), or from the oldest change
      kept without it; changes are kept four weeks, and an older start_date
      is refused. Then pass next_cursor as cursor, without start_date, while
      has_more is true. Up to 1000 changes per page. Scope
      dms_files:readonly.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      not: { required: [start_date, cursor] }
      properties:
        company_id: *company_id
        start_date: { type: string, format: date-time, description: "RFC 3339, within the last four weeks. Never with cursor." }
        cursor: { type: string, description: "next_cursor of the previous page. Never with start_date." }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
    examples:
      - title: Changes since a given time
        input: { company_id: 1234, start_date: "2026-10-01T00:00:00Z" }
    refusals:
      - { code: start_date_too_old, when: 422, message: "Pennylane keeps DMS file changes four weeks only: pick a start_date within that window." }
    call:
      method: GET
      path: "/companies/{company_id}/changelogs/dms_files"
      query: { start_date: start_date, cursor: cursor, limit: limit }
    cost: { per: request }
