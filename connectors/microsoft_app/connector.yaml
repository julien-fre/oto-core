# yaml-language-server: $schema=../connector.schema.json
# Microsoft Graph v1.0 reference: https://learn.microsoft.com/graph/api/resources/mail-api-overview
# Client credentials flow: https://learn.microsoft.com/entra/identity-platform/v2-oauth2-client-creds-grant-flow
# RBAC for Applications in Exchange Online: https://learn.microsoft.com/exchange/permissions-exo/application-rbac
# Outlook mail of one mailbox of an organization, with application access: no
# person signs in. An application registered in Microsoft Entra exchanges its
# client id and secret for a token of the account's tenant. Distinct from
# `microsoft`, which acts on behalf of one signed-in person (delegated consent).
#
# One account is one mailbox: the mailbox setting is cited by base_url
# (.../users/{mailbox}) and no function takes a mailbox. A second mailbox is a
# second account, under its own label. The setting is the user's object id (a
# GUID): a setting cited in an address may only hold letters, digits, - and _,
# which a userPrincipalName (with @ and .) is not.
#
# Reach of the consent: the Mail.* application permissions granted in
# Microsoft Entra let the application act on every mailbox of the tenant,
# whatever the account says. RBAC for Applications in Exchange Online adds to
# Entra and bounds nothing while Mail.* stays granted there; the application is
# held to chosen mailboxes only once the admin grants the rights through RBAC
# for Applications and removes Mail.* from Entra. Application access policies
# are being replaced by RBAC for Applications.
#
# Not described here:
# - the next page of a message list by @odata.nextLink (a full URL): the list
#   pages with skip, outside a search;
# - attachment content (contentBytes, base64), and sending or drafting with
#   attachments: large attachments need an upload session, several calls.
connector:
  name: microsoft_app
  label: Microsoft 365 mail (application access)
  namespace: microsoft_app
  version: 1.0.0
  api_version: v1.0
  base_url: https://graph.microsoft.com/v1.0/users/{mailbox}
  auth:
    kind: oauth2_client_credentials
    token_url: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
    token_request: form
    client_auth: body
    client_id: client_id
    client_secret: client_secret
    scope: https://graph.microsoft.com/.default
    expires_in_default: 3599
  credential:
    - { name: client_id, label: Application (client) ID, secret: false }
    - { name: client_secret, label: Client secret, secret: true }
  settings:
    - { name: tenant, label: Directory (tenant) ID, type: text,
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }
    - { name: mailbox, label: Mailbox user object ID, type: text,
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }
  modes: [byo_org]
  timeout_s: 60
  query_arrays: comma
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Microsoft Graph rejected the request as invalid: check the arguments; $search cannot be combined with filter, orderby or skip." }
    - { status: 401, code: access_rejected, retryable: false,
        message: "Microsoft rejected the application token: check the tenant id, client id and client secret (it may have expired)." }
    - { status: 403, code: access_denied, retryable: false,
        message: "Microsoft Graph refused the call: the application lacks the permission it needs on this mailbox (Mail.Read, Mail.ReadWrite or Mail.Send), granted in Microsoft Entra or through Exchange RBAC for Applications. It does not mean the mailbox is absent." }
    - { status: 404, code: not_found, retryable: false,
        message: "Microsoft Graph object not found: check the id, and the account's mailbox setting." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Microsoft Graph is throttling these requests (Outlook allows about 10,000 requests per 10 minutes per mailbox): retry after the delay it gives." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Microsoft Graph is temporarily unavailable: retry later." }

functions:
  - name: list_messages
    class: read
    description: >-
      List the messages of the account's mailbox, every folder included,
      newest first unless orderby says otherwise: {value: [{id, subject,
      from, toRecipients, receivedDateTime, isRead, hasAttachments,
      bodyPreview, body, parentFolderId, conversationId, webLink}]}; bodies
      come as text. search is a KQL query in double quotes ("from:dupont
      subject:invoice"), ranked by relevance; it cannot be combined with filter,
      orderby or skip. filter is OData (receivedDateTime ge
      2026-10-01T00:00:00Z and hasAttachments eq true); a property in orderby
      must also come first in filter. Needs the application permission
      Mail.Read. Granted in Microsoft Entra, it opens every mailbox of the
      tenant to the application, not only this account's, unless the admin
      grants it through Exchange RBAC for Applications and removes it from
      Entra.
    input:
      type: object
      additionalProperties: false
      properties:
        search: &search { type: string, minLength: 3, pattern: "^\".*\"$", description: "KQL in double quotes, e.g. \"subject:annual report\" or \"from:jane@example.com\"." }
        filter: &filter { type: string, minLength: 1, description: "OData filter on message properties." }
        orderby: &orderby { type: string, minLength: 1, description: "e.g. receivedDateTime desc." }
        select: &select
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [id, subject, from, sender, toRecipients, ccRecipients, bccRecipients, replyTo, receivedDateTime,
                   sentDateTime, isRead, isDraft, importance, hasAttachments, bodyPreview, body, parentFolderId,
                   conversationId, internetMessageId, webLink, categories, flag]
          description: "Properties returned; a short list keeps large pages fast."
        top: &top { type: integer, minimum: 1, maximum: 100, default: 25, description: "Messages per page." }
        skip: &skip { type: integer, minimum: 0, description: "Messages skipped, for the next page; not with search." }
    examples:
      - title: Messages about one invoice, by search
        input: { search: "\"subject:invoice 2026-118\"", top: 10 }
      - title: Unread messages with attachments received since 1 October
        input:
          filter: "receivedDateTime ge 2026-10-01T00:00:00Z and isRead eq false and hasAttachments eq true"
          orderby: receivedDateTime desc
          select: [id, subject, from, receivedDateTime, hasAttachments, bodyPreview]
    refusals:
      - &mailbox_not_found { code: mailbox_not_found, when: 404, message: "The account's mailbox is not in this tenant, or has no Exchange Online mailbox: check the mailbox setting." }
    call:
      method: GET
      path: /messages
      query: &list_query { $search: search, $filter: filter, $orderby: orderby, $select: select, $top: top, $skip: skip }
      constants: &text_body { headers: { Prefer: "outlook.body-content-type=\"text\"" } }
    output: { items: value }

  - name: list_folder_messages
    class: read
    description: >-
      List the messages of one folder of the account's mailbox, same answer
      and query rules as list_messages. folder is a folder id or a well-known name:
      inbox, sentitems, drafts, deleteditems, archive, junkemail.
    input:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder: { type: string, pattern: "^[^\\s/?#]+$", description: "Folder id or well-known name, e.g. inbox." }
        search: *search
        filter: *filter
        orderby: *orderby
        select: *select
        top: *top
        skip: *skip
    examples:
      - title: The last 20 messages of the inbox
        input: { folder: inbox, top: 20, select: [id, subject, from, receivedDateTime, isRead] }
    refusals:
      - { code: folder_not_found, when: 404, message: "No folder with this id or name in the account's mailbox." }
    call:
      method: GET
      path: "/mailFolders/{folder}/messages"
      query: *list_query
      constants: *text_body
    output: { items: value }

  - name: get_message
    class: read
    description: >-
      Get one message of the account's mailbox by id: subject, from, sender,
      toRecipients, ccRecipients, receivedDateTime, sentDateTime, body (as
      text), hasAttachments, internetMessageId, conversationId, webLink.
      Needs Mail.Read (application).
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: &message_id { type: string, minLength: 1, description: "Message id, as returned by the list functions." }
        select: *select
    examples:
      - title: One message
        input: { message_id: "AAMkAGI2THVSAAA=" }
    refusals:
      - &message_not_found { code: message_not_found, when: 404, message: "No message with this id in the account's mailbox." }
    call:
      method: GET
      path: "/messages/{message_id}"
      query: { $select: select }
      constants: *text_body

  - name: list_attachments
    class: read
    description: >-
      List the attachments of one message, metadata only: {value: [{id, name,
      contentType, size, isInline, lastModifiedDateTime}]}; size is in bytes.
      The content is not returned. Needs Mail.Read (application).
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: *message_id
    examples:
      - title: Attachments of one message
        input: { message_id: "AAMkAGI2THVSAAA=" }
    refusals:
      - *message_not_found
    call:
      method: GET
      path: "/messages/{message_id}/attachments"
      constants: { query: { $select: "id,name,contentType,size,isInline,lastModifiedDateTime" } }
    output: { items: value }

  - name: create_draft
    class: write
    act: false
    description: >-
      Create a draft in the Drafts folder of the account's mailbox, without
      sending it, and return it with its id and webLink, where someone can review and
      send it from Outlook. Needs Mail.ReadWrite (application).
    input:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject: { type: string, minLength: 1, maxLength: 255 }
        body: &body
          type: object
          additionalProperties: false
          required: [contentType, content]
          properties:
            contentType: { enum: [text, html] }
            content: { type: string }
        to_recipients: &recipients
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [emailAddress]
            properties:
              emailAddress:
                type: object
                additionalProperties: false
                required: [address]
                properties:
                  address: { type: string, format: email }
                  name: { type: string, minLength: 1 }
          description: "[{emailAddress: {address, name}}]."
        cc_recipients: *recipients
        bcc_recipients: *recipients
        importance: &importance { enum: [low, normal, high] }
    examples:
      - title: A draft answer to a client, left for review
        input:
          subject: "Votre dossier 2026-118 : pièces manquantes"
          body: { contentType: text, content: "Bonjour, pour avancer sur votre dossier, il nous manque votre justificatif de domicile." }
          to_recipients: [{ emailAddress: { address: claire.martin@example.com, name: Claire Martin } }]
    refusals:
      - *mailbox_not_found
    call:
      method: POST
      path: /messages
      body:
        subject: subject
        body: body
        toRecipients: to_recipients
        ccRecipients: cc_recipients
        bccRecipients: bcc_recipients
        importance: importance

  - name: send_mail
    class: sensitive
    description: >-
      Send an email from the account's mailbox, at once: it leaves for its
      recipients and, unless save_to_sent_items is false, is kept in
      Sent Items. Nothing is returned (202). Prefer create_draft when a
      person should read it first. Needs the application permission
      Mail.Send. Granted in Microsoft Entra, it lets the application send as
      any mailbox of the tenant, not only this account's, unless the admin
      grants it through Exchange RBAC for Applications and removes it from
      Entra.
    input:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: object
          additionalProperties: false
          required: [subject, body, toRecipients]
          properties:
            subject: { type: string, minLength: 1, maxLength: 255 }
            body: *body
            toRecipients: *recipients
            ccRecipients: *recipients
            bccRecipients: *recipients
            replyTo: *recipients
            importance: *importance
        save_to_sent_items: { type: boolean, description: "Keep a copy in Sent Items; true by default." }
    examples:
      - title: Confirm an appointment to a client
        input:
          message:
            subject: "Rendez-vous de signature le 22 octobre"
            body: { contentType: text, content: "Bonjour, nous vous confirmons le rendez-vous de signature le 22 octobre à 10 h." }
            toRecipients: [{ emailAddress: { address: claire.martin@example.com } }]
    refusals:
      - *mailbox_not_found
    confirm:
      summary: "Send this email from the account's mailbox now: it leaves for its recipients and cannot be recalled."
    call:
      method: POST
      path: /sendMail
      body: { message: message, saveToSentItems: save_to_sent_items }

exposure:
  mode: per_connector
  tool: microsoft_app
