# yaml-language-server: $schema=../connector.schema.json
# Mux Video API reference: https://docs.mux.com/api-reference
# The new asset's settings of an upload are nested (new_asset_settings): `body` places
# arguments at the first level only, so create_upload takes them as one closed object.
connector:
  name: mux
  label: Mux
  namespace: mux
  version: 1.0.0
  api_version: video v1
  base_url: https://api.mux.com
  auth:
    kind: basic
    username: token_id
    password: token_secret
  credential:
    - { name: token_id, label: Access Token ID, secret: false }
    - { name: token_secret, label: Secret Key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  probe: { function: list_assets }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Mux rejected the request as invalid: error.messages names the faulty argument." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Mux did not accept the access token: check its ID and secret key, and that it has the Mux Video permission." }
    - { status: 403, code: not_allowed, retryable: false,
        message: "Mux refused the operation: the token lacks write access to Mux Video, or the plan does not include it." }
    - { status: 404, code: not_found, retryable: false,
        message: "Mux object not found in this token's environment: an asset or upload belongs to one environment only." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Mux rate limit reached: retry in a moment." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Mux is temporarily unavailable: retry later." }

functions:
  - name: list_assets
    class: read
    description: >-
      The videos (assets) of the token's environment, newest first: id,
      status (preparing, ready, errored), duration in seconds, resolution,
      playback ids, passthrough and title. next_cursor pages on. upload_id
      finds the asset a direct upload made. A public playback id plays at
      https://stream.mux.com/<playback_id>.m3u8.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        cursor: { type: string, minLength: 1, description: "next_cursor of the previous page." }
        upload_id: { type: string, pattern: "^[A-Za-z0-9]{1,128}$" }
    examples:
      - title: The ten latest videos
        input: { limit: 10 }
    call:
      method: GET
      path: /video/v1/assets
      query: { limit: limit, cursor: cursor, upload_id: upload_id }
    cost: { per: request }

  - name: get_asset
    class: read
    description: >-
      One video: status (preparing until Mux has processed it, then ready or
      errored, with errors), duration, resolution and max stored resolution,
      aspect ratio, playback ids with their policy, tracks, passthrough and
      title.
    input:
      type: object
      additionalProperties: false
      required: [asset_id]
      properties:
        asset_id: { type: string, pattern: "^[A-Za-z0-9]{1,128}$" }
    examples:
      - title: Is the video ready
        input: { asset_id: a1B2c3D4e5F6 }
    call: { method: GET, path: "/video/v1/assets/{asset_id}" }
    cost: { per: request }

  - name: get_upload
    class: read
    description: >-
      One direct upload: status (waiting until the file is sent, then
      asset_created, or errored, cancelled, timed_out) and, once the file has
      arrived, the asset_id of the video it made.
    input:
      type: object
      additionalProperties: false
      required: [upload_id]
      properties:
        upload_id: { type: string, pattern: "^[A-Za-z0-9]{1,128}$" }
    examples:
      - title: Has the file arrived
        input: { upload_id: u1V2w3X4y5Z6 }
    call: { method: GET, path: "/video/v1/uploads/{upload_id}" }
    cost: { per: request }

  - name: create_upload
    class: write
    description: >-
      A direct upload address: the answer's data.url takes the video file in
      ONE HTTP PUT, from wherever the file is, with no credential (the address
      is the authorisation). Mux then makes the video: read get_upload for its
      asset_id, then get_asset until it is ready. The address expires after
      timeout seconds (3600 by default). Playback is public unless
      new_asset_settings says signed. test makes a free 10-second watermarked
      video deleted after a day.
    input:
      type: object
      additionalProperties: false
      properties:
        new_asset_settings:
          type: object
          additionalProperties: false
          properties:
            playback_policy: { type: array, items: { type: string, enum: [public, signed] }, minItems: 1 }
            video_quality: { type: string, enum: [basic, plus, premium] }
            max_resolution_tier: { type: string, enum: [1080p, 1440p, 2160p] }
            passthrough: { type: string, maxLength: 255 }
            meta:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 512 }
        cors_origin: { type: string, minLength: 1, description: "Origin allowed to PUT from a browser, or *." }
        timeout: { type: integer, minimum: 60, maximum: 604800 }
        test: { type: boolean }
    examples:
      - title: An upload for a 1440p film
        input: { new_asset_settings: { playback_policy: [public], video_quality: plus, max_resolution_tier: 1440p, meta: { title: Product tour } } }
    call:
      method: POST
      path: /video/v1/uploads
      body: { new_asset_settings: new_asset_settings, cors_origin: cors_origin, timeout: timeout, test: test }
    cost: { per: request }

  - name: create_asset
    class: write
    description: >-
      A video from a file Mux fetches itself at an https address (public or
      pre-signed), instead of an upload. The answer's data.id is the asset:
      read get_asset until it is ready. Playback is public unless
      playback_policy says signed.
    input:
      type: object
      additionalProperties: false
      required: [inputs]
      properties:
        inputs:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, pattern: "^https://" }
        playback_policy: { type: array, items: { type: string, enum: [public, signed] }, minItems: 1 }
        video_quality: { type: string, enum: [basic, plus, premium] }
        max_resolution_tier: { type: string, enum: [1080p, 1440p, 2160p] }
        passthrough: { type: string, maxLength: 255 }
        meta:
          type: object
          additionalProperties: false
          properties:
            title: { type: string, maxLength: 512 }
        test: { type: boolean }
    examples:
      - title: A video from a file address
        input: { inputs: [{ url: "https://files.example/film.mp4" }], playback_policy: [public] }
    call:
      method: POST
      path: /video/v1/assets
      body: { inputs: inputs, playback_policy: playback_policy, video_quality: video_quality,
              max_resolution_tier: max_resolution_tier, passthrough: passthrough, meta: meta, test: test }
    cost: { per: request }
