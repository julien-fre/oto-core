# yaml-language-server: $schema=../connector.schema.json
# FullEnrich API v2 reference, read on 2026-10-19 (OpenAPI 3.1, version 2.0.0):
#   https://docs.fullenrich.com/api/v2/reference/openapi.yaml
#   https://docs.fullenrich.com/api/v2/contact/enrich/bulk/post.md
#   https://docs.fullenrich.com/api/v2/contact/enrich/bulk/get.md
#   https://docs.fullenrich.com/api/v2/general/credit.md
#   https://docs.fullenrich.com/api/v2/general/ratelimit.md
#   https://docs.fullenrich.com/api/v2/implement-in-product/getting-started.md
# Waterfall contact enrichment: an asynchronous bulk job of up to 100 contacts
# (submit), read back by its enrichment id (fetch). The function names are those
# of the Python client, oto.tools.fullenrich.
#
# Cost of submit, public rate card read on 2026-10-19 (credit.md): credits per
# value found, by field: "If a Deliverable, High Probability, or Catch-all email
# is found, 1 credit will be used. If a mobile phone is found, 10 credits will
# be used. If a valid personal email is found, 3 credits will be used. (For
# custom plans, this ratio might be different)". The fields are asked per
# contact (data[].enrich_fields): the worst case is, over the contacts, the sum
# of the weights of the fields each asks. The real quantity is the credits the
# job consumed, read when collected: "cost.credits: Number of credits consumed
# for this enrichment" (OpenAPI v2, GET /contact/enrich/bulk/{enrichment_id}).
# A custom plan may cost more than this card: the excess is settled as read and
# reported, as the format says.
#
# No collection delay: "Jobs don't expire and there's no automatic timeout"
# (getting-started.md); 30 to 90 seconds per contact is typical, not a bound.
# Hence no_deadline instead of within_s.
#
# Not described here: webhook_url and webhook_events, which post the results
# to an address of the caller's choosing; forceResults (partial results, "not
# recommended for regular use"); the credit balance, key check, reverse email
# lookup and search endpoints, which the Python client does not call.
connector:
  name: fullenrich
  label: FullEnrich
  namespace: fullenrich
  version: 1.0.0
  api_version: v2
  base_url: https://app.fullenrich.com/api/v2
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [platform, byo_user, byo_org]
  # "The API rate limit is 60 API calls per minute. This applies to all API
  # endpoints" (ratelimit.md), a fixed window per calendar minute.
  rate_limit: { requests: 60, seconds: 60 }
  errors:
    - { status: 400, body: { path: code, equals: [error.enrichment.in_progress] }, code: enrichment_in_progress,
        retryable: true,
        message: "FullEnrich has not finished this enrichment yet: read it again later, a few minutes apart." }
    - { status: 400, code: invalid_request, retryable: false,
        message: "FullEnrich rejected the request: check each contact (first and last name, a domain or a LinkedIn URL, at least one field to enrich)." }
    - { status: 401, body: { path: code, equals: [error.api.key] }, code: key_refused, retryable: false,
        marks_account: credential_rejected,
        message: "FullEnrich does not know this API key: check it or regenerate it." }
    - { status: 401, code: authorization_missing, retryable: false,
        message: "FullEnrich found no bearer Authorization header on the request." }
    - { status: [200, 402], body: { path: status, equals: [CREDITS_INSUFFICIENT] }, code: credits_insufficient,
        retryable: false, marks_account: quota_exhausted,
        message: "FullEnrich stopped this enrichment: the workspace has not enough credits." }
    - { status: 402, code: payment_required, retryable: false,
        message: "FullEnrich answered Payment Required for this enrichment." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "FullEnrich rate limit reached (60 calls per minute): retry after the current minute." }

functions:
  - name: submit
    class: write
    description: >-
      Start a FullEnrich waterfall enrichment of up to 100 contacts and return
      {enrichment_id}. Each contact gives first_name, last_name, a domain (the
      company website) or a linkedin_url, and the fields to find:
      contact.work_emails, contact.personal_emails, contact.phones. The job runs
      at FullEnrich, typically 30 to 90 seconds per contact; read it with fetch
      and the enrichment_id, a few minutes apart. Credits are spent per value
      found: 1 for a work email, 3 for a personal email, 10 for a phone; the
      same contact with the same input, enriched again within three months,
      costs nothing. With silent_fail, a contact with invalid input is skipped
      instead of failing the whole job.
    input:
      type: object
      additionalProperties: false
      required: [name, contacts]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, personal: true, description: "A readable name for this enrichment, shown in the FullEnrich dashboard." }
        contacts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [first_name, last_name, enrich_fields]
            anyOf: [{ required: [domain] }, { required: [linkedin_url] }]
            properties:
              first_name: { type: string, minLength: 1, personal: true }
              last_name: { type: string, minLength: 1, personal: true }
              domain: { type: string, pattern: "^[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)+$", description: "Company website domain, without scheme: example.com." }
              company_name: { type: string, minLength: 1 }
              linkedin_url: { type: string, pattern: "^https://([a-z]{2,3}\\.)?linkedin\\.com/in/\\S+$", personal: true, description: "LinkedIn profile URL, standard or Sales Navigator; it also returns the full profile." }
              enrich_fields:
                type: array
                minItems: 1
                uniqueItems: true
                items: { enum: [contact.work_emails, contact.personal_emails, contact.phones] }
              custom:
                type: object
                maxProperties: 10
                additionalProperties: { type: string, maxLength: 100 }
                description: "Returned unchanged with the result: an id of yours, as strings."
        silent_fail: { type: boolean, default: false, description: "Skip a contact with invalid input instead of failing the whole job." }
    examples:
      - title: Work email and phone of one person, by LinkedIn URL
        input:
          name: Jane Doe
          contacts:
            - { first_name: Jane, last_name: Doe, linkedin_url: "https://www.linkedin.com/in/janedoe/", enrich_fields: [contact.work_emails, contact.phones] }
      - title: Work emails of two people, by company domain, skipping invalid contacts
        input:
          name: Sales team at Example
          silent_fail: true
          contacts:
            - { first_name: John, last_name: Snow, domain: example.com, company_name: Example Inc, enrich_fields: [contact.work_emails], custom: { crm_id: "12584" } }
            - { first_name: Arya, last_name: Stark, domain: example.com, enrich_fields: [contact.work_emails] }
    refusals:
      - { code: enrichment_id_missing, when: "the response carries no enrichment_id",
          message: "FullEnrich accepted the request but returned no enrichment id." }
    expect:
      - { kind: non_empty, refusal: enrichment_id_missing, path: enrichment_id }
    call:
      method: POST
      path: /contact/enrich/bulk
      query: { silentFail: silent_fail }
      body: { name: name, data: contacts }
    cost:
      per: item
      items: contacts
      weights:
        field: enrich_fields
        values: { contact.work_emails: 1, contact.personal_emails: 3, contact.phones: 10 }
      unit: credits
      settle: { path: cost.credits }
    async: { collect: fetch, job_id: { from: enrichment_id, to: enrichment_id }, no_deadline: true }

  - name: fetch
    class: read
    description: >-
      Read a FullEnrich enrichment by its enrichment_id, from submit: {id, name,
      status, cost: {credits}, data: [{input, custom, contact_info:
      {most_probable_work_email, most_probable_personal_email,
      most_probable_phone, work_emails, personal_emails, phones}, profile}]}.
      status is CREATED or IN_PROGRESS while the job runs (the refusal
      enrichment_in_progress says the same), FINISHED when data is complete,
      or CANCELED, RATE_LIMIT, UNKNOWN. cost.credits is what FullEnrich deducted for the whole
      job. Results are kept three months.
    input:
      type: object
      additionalProperties: false
      required: [enrichment_id]
      properties:
        enrichment_id: { type: string, pattern: "^[A-Za-z0-9-]+$", description: "From submit." }
    examples:
      - title: Result of an enrichment
        input: { enrichment_id: 2db5ea61-1752-42cf-8ea1-ab1da060cd0a }
    refusals:
      - { code: enrichment_not_found, when: 404, message: "No FullEnrich enrichment with this id for this key." }
    call: { method: GET, path: "/contact/enrich/bulk/{enrichment_id}" }

exposure:
  mode: per_connector
  tool: fullenrich
