  - name: create_person_attribute
    class: write
    description: >-
      A custom field of people; its key is derived from the label (lowercase,
      no accents, _ between words, 64 characters). A DROPDOWN field needs
      options, any other type takes none. Idempotent: the same label and type
      again return the existing field with already_existed=true, and the label
      of a deleted field restores it with its stored values.
    input:
      type: object
      additionalProperties: false
      required: [label, type]
      properties:
        label: { type: string, minLength: 1, maxLength: 255 }
        type: &attribute_type { type: string, enum: [TEXT, NUMBER, DATE, BOOLEAN, DROPDOWN] }
        options: &attribute_options
          type: array
          minItems: 1
          description: "The allowed values of a DROPDOWN field. Send an option's current key to keep it when renaming its label."
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              label: { type: string, minLength: 1 }
              key: { type: string, minLength: 1 }
      if: &is_dropdown { properties: { type: { const: DROPDOWN } } }
      then: { required: [options] }
      else: { not: { required: [options] } }
    examples:
      - title: A text field
        input: { label: Lead source, type: TEXT }
      - title: A dropdown field
        input: { label: Plan, type: DROPDOWN, options: [{ label: Starter }, { label: Enterprise }] }
    call: { method: POST, path: /v2/api/crm/attributes, body: { label: label, type: type, options: options } }

  - name: update_person_attribute
    class: write
    description: >-
      Change a custom field of people: only the fields given change; its key
      and type never do. options replaces the whole list (DROPDOWN only). A
      field synced from a CRM integration cannot be edited.
    input:
      type: object
      additionalProperties: false
      required: [key]
      minProperties: 2
      properties:
        key: &attribute_key { type: string, minLength: 1, description: "The field key, from the list of fields." }
        label: { type: string, minLength: 1 }
        description: { type: string, description: "A blank value clears it." }
        options: *attribute_options
    examples:
      - title: Rename a field
        input: { key: lead_source, label: Source }
    call:
      method: PATCH
      path: "/v2/api/crm/attributes/{key}"
      body: { label: label, description: description, options: options }

  - name: delete_person_attribute
    class: sensitive
    description: >-
      Remove a custom field of people: it leaves the list and the people, and
      writing it is refused. Its stored values are kept: creating a field with
      the same label and type restores it with them. Built-in fields and fields
      synced from a CRM integration cannot be deleted.
    input:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: *attribute_key
    examples:
      - title: Remove a field
        input: { key: lead_source }
    call: { method: DELETE, path: "/v2/api/crm/attributes/{key}" }
    confirm:
      summary: "Remove the people field {key} from Allo (its values are kept; creating it again restores them)."

  - name: create_company_attribute
    class: write
    description: >-
      A custom attribute of companies; its key is derived from the label. A
      DROPDOWN attribute needs options, any other type takes none. prompt tells
      Allo's AI how to fill it from calls, should_prompt_override whether it may
      overwrite a value already set. Idempotent: the same key and type again
      return the existing attribute with already_existed=true.
    input:
      type: object
      additionalProperties: false
      required: [label, type]
      properties:
        label: { type: string, minLength: 1 }
        type: *attribute_type
        options: *attribute_options
        prompt: &attribute_prompt { type: string, description: "A blank value clears it." }
        should_prompt_override: { type: boolean }
      if: *is_dropdown
      then: { required: [options] }
      else: { not: { required: [options] } }
    examples:
      - title: A segment filled by the AI
        input: { label: Segment, type: DROPDOWN, options: [{ label: SMB }, { label: Enterprise }],
                 prompt: "Pick the segment that matches the company size mentioned on the call." }
    call:
      method: POST
      path: /v2/api/crm/companies/attributes
      body: { label: label, type: type, options: options, prompt: prompt,
              should_prompt_override: should_prompt_override }

  - name: update_company_attribute
    class: write
    description: >-
      Change a custom attribute of companies: only the fields given change; its
      key and type never do. options replaces the whole list (DROPDOWN only).
      An attribute synced from a CRM integration only takes prompt,
      should_prompt_override and is_visible.
    input:
      type: object
      additionalProperties: false
      required: [key]
      minProperties: 2
      properties:
        key: *attribute_key
        label: { type: string, minLength: 1 }
        options: *attribute_options
        prompt: *attribute_prompt
        should_prompt_override: { type: boolean }
        is_visible: { type: boolean, description: "Show or hide it in the Allo apps." }
    examples:
      - title: Hide an attribute
        input: { key: segment, is_visible: false }
    call:
      method: PATCH
      path: "/v2/api/crm/companies/attributes/{key}"
      body: { label: label, options: options, prompt: prompt, should_prompt_override: should_prompt_override,
              is_visible: is_visible }

  - name: delete_company_attribute
    class: sensitive
    description: >-
      Delete a custom attribute of companies and clear its value on every
      company. Irreversible: unlike a field of people, nothing restores the
      values. An attribute synced from a CRM integration cannot be deleted.
    input:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: *attribute_key
    examples:
      - title: Delete an attribute
        input: { key: segment }
    call: { method: DELETE, path: "/v2/api/crm/companies/attributes/{key}" }
    confirm:
      summary: "Delete the company attribute {key} and its value on every company: irreversible."

