  - name: send_sms
    class: sensitive
    description: >-
      Send a text message now: from one of the team's numbers (from_number,
      recipient in the same country), or from a Sender ID verified by Allo
      (sender_id, France). Give exactly one of the two. Billed per segment:
      160 characters (153 once split), or 70 (67) as soon as one character is
      outside the standard SMS alphabet (ç, ê, â, a curly quote, an emoji).
    input:
      type: object
      additionalProperties: false
      required: [to, message]
      properties:
        to: { type: string, minLength: 1, personal: true, description: "Recipient, E.164." }
        message: { type: string, minLength: 1, maxLength: 1000 }
        from_number: { type: string, minLength: 1, description: "One of the team's numbers, E.164." }
        sender_id: { type: string, minLength: 1, description: "A Sender ID verified by Allo." }
      oneOf:
        - { required: [from_number] }
        - { required: [sender_id] }
    examples:
      - title: A text from a US line
        input: { from_number: "+14155550100", to: "+14155550123", message: "Thanks for your time today!" }
      - title: A text from a French Sender ID
        input: { sender_id: MyCompany, to: "+33199000001", message: "Merci pour votre temps aujourd'hui." }
    call:
      method: POST
      path: /v1/api/sms
      body: { from: from_number, sender_id: sender_id, to: to, message: message }
    # Allo bills a text per segment (help.withallo.com/en/billing/sms-rates, read 2026-10-22): up to 15 for the 1000
    # characters the API takes. The answer does not say how many segments were sent, so nothing settles the real
    # quantity: a quantity of 15 would settle every text at its worst case. One request is what this file can state;
    # a quantity computed from an argument (the segments of a text) is a question of the format.
    cost: { per: request }
    confirm:
      summary: "Send a text to {to} now: it cannot be recalled."

  - name: list_summary_templates
    class: read
    description: The team's call summary templates (tst-*), each with its sections.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The summary templates
        input: {}
    call: { method: GET, path: /v2/api/summary_templates }

  - name: get_summary_template
    class: read
    description: One call summary template, with its context, icon and sections.
    input:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: &template_id { type: string, minLength: 1, description: "tst-* id." }
    examples:
      - title: A template
        input: { template_id: tst-abc123 }
    call: { method: GET, path: "/v2/api/summary_templates/{template_id}" }

  - name: create_summary_template
    class: write
    description: >-
      A call summary template for the team: its name, the context that helps
      the AI summarize (4000 characters at most), an icon, and up to 10
      ordered sections, each a title and instructions.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: &template_name { type: string, minLength: 1 }
        call_context: &call_context { type: string, maxLength: 4000 }
        icon: &template_icon { type: string, minLength: 1, description: "An emoji, for instance." }
        sections: &template_sections
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              title: { type: string, minLength: 1 }
              instructions: { type: string, minLength: 1 }
              order: { type: integer, minimum: 0, description: "0-based position of the section." }
    examples:
      - title: A sales call template
        input: { name: Sales call, call_context: B2B software sales calls,
                 sections: [{ title: Pain points, instructions: "List the prospect's pain points", order: 0 }] }
    call:
      method: POST
      path: /v2/api/summary_templates
      body: { name: name, call_context: call_context, icon: icon, sections: sections }

  - name: update_summary_template
    class: write
    description: >-
      Replace a call summary template whole: name, context, icon and sections;
      what is left out is cleared, so read it first and send it all back.
    input:
      type: object
      additionalProperties: false
      required: [template_id, name]
      properties:
        template_id: *template_id
        name: *template_name
        call_context: *call_context
        icon: *template_icon
        sections: *template_sections
    examples:
      - title: Rename a template
        input: { template_id: tst-abc123, name: Discovery call }
    call:
      method: PUT
      path: "/v2/api/summary_templates/{template_id}"
      body: { name: name, call_context: call_context, icon: icon, sections: sections }

  - name: delete_summary_template
    class: sensitive
    description: Deactivate a call summary template; it is no longer offered for summaries.
    input:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: *template_id
    examples:
      - title: Delete a template
        input: { template_id: tst-abc123 }
    call: { method: DELETE, path: "/v2/api/summary_templates/{template_id}" }
    confirm:
      summary: "Delete Allo summary template {template_id}."

  - name: set_default_summary_template
    class: write
    description: >-
      The summary template a line's call summaries use by default. Without
      summary_template_id, the line's default is cleared.
    input:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: &line_number { type: string, minLength: 1, description: "An Allo line, E.164, from list_numbers." }
        summary_template_id: { type: string, minLength: 1, description: "tst-* id." }
    examples:
      - title: A default template for a line
        input: { number: "+33199000000", summary_template_id: tst-abc123 }
    call:
      method: PUT
      path: "/v2/api/numbers/{number}/default_summary_template"
      body: { summary_template_id: summary_template_id }

  - name: list_webhooks
    class: read
    description: The webhook endpoints of the account (url, topics, label, enabled).
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The webhooks
        input: {}
    call: { method: GET, path: /v2/api/webhooks }

  - name: get_webhook
    class: read
    description: One webhook endpoint, with the signing_secret that verifies its deliveries.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      properties:
        webhook_id: &webhook_id { type: string, minLength: 1 }
    examples:
      - title: A webhook
        input: { webhook_id: ep_abc123 }
    call: { method: GET, path: "/v2/api/webhooks/{webhook_id}" }

  - name: create_webhook
    class: write
    description: >-
      A webhook endpoint: Allo posts the events of topics to url (https). The
      answer carries the signing_secret that verifies the deliveries.
    input:
      type: object
      additionalProperties: false
      required: [url, topics]
      properties:
        url: &webhook_url { type: string, pattern: "^https://", description: "The https address that receives the events." }
        topics: &webhook_topics
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [call.received, call.triggered, call.answered, call.completed, tag.added, tag.removed,
                   sms.received, sms.sent, contact.created, contact.updated, summary.updated]
        description: &webhook_label { type: string, description: "A label." }
    examples:
      - title: Completed calls to a receiver
        input: { url: "https://hooks.acme.example/allo", topics: [call.completed], description: CRM sync }
    call: { method: POST, path: /v2/api/webhooks, body: { url: url, topics: topics, description: description } }

  - name: update_webhook
    class: write
    description: >-
      Change a webhook endpoint: only the fields given change; topics replaces
      the whole set; enabled=false stops the deliveries.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      minProperties: 2
      properties:
        webhook_id: *webhook_id
        url: *webhook_url
        topics: *webhook_topics
        description: *webhook_label
        enabled: { type: boolean }
    examples:
      - title: Pause a webhook
        input: { webhook_id: ep_abc123, enabled: false }
    call:
      method: PUT
      path: "/v2/api/webhooks/{webhook_id}"
      body: { url: url, topics: topics, description: description, enabled: enabled }

  - name: delete_webhook
    class: sensitive
    description: Delete a webhook endpoint and its delivery history, for good.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      properties:
        webhook_id: *webhook_id
    examples:
      - title: Delete a webhook
        input: { webhook_id: ep_abc123 }
    call: { method: DELETE, path: "/v2/api/webhooks/{webhook_id}" }
    confirm:
      summary: "Delete Allo webhook {webhook_id} and its delivery history."

  - name: list_webhook_event_types
    class: read
    description: The event topics a webhook may subscribe to, with what each sends.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The event topics
        input: {}
    call: { method: GET, path: /v2/api/webhooks/event_types }

  - name: get_call_flow
    class: read
    description: >-
      The call flow of a line (the tree that routes its inbound calls): the
      published one by default, or status=draft for the working draft (the
      published one when there is no draft), with its lock_version.
    input:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: *line_number
        status: { type: string, enum: [draft, published] }
    examples:
      - title: The live call flow of a line
        input: { number: "+33199000000" }
    call: { method: GET, path: "/v2/api/numbers/{number}/call_flow", query: { status: status } }

  - name: get_call_flow_draft
    class: read
    description: >-
      The working draft of a line's call flow only, with its lock_version to
      pass when saving or publishing; never the published flow.
    input:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: *line_number
    examples:
      - title: The draft of a line
        input: { number: "+33199000000" }
    # The code Allo puts in error.code (OpenAPI, getCallFlowDraft).
    refusals:
      - { code: call_flow_draft_not_found, when: 404, body: { path: error.code, equals: [CALL_FLOW_DRAFT_NOT_FOUND] },
          message: "This line has no call flow draft." }
    call: { method: GET, path: "/v2/api/numbers/{number}/call_flow/draft" }

  - name: save_call_flow_draft
    class: write
    description: >-
      Create or replace the working draft of a line's call flow; nothing is
      live until publish_call_flow. definition is the flow tree (camelCase
      keys), schema_version the server's current one. lock_version (from the
      last read) and base_published_version detect a concurrent edit or
      publish (409). engine_subset FULL_FLOW runs the whole tree: send it for
      a flow built through the API.
    input:
      type: object
      additionalProperties: false
      required: [number, definition, schema_version]
      properties:
        number: *line_number
        definition: { type: object }
        schema_version: { type: integer }
        lock_version: { type: integer }
        base_published_version: { type: integer }
        engine_subset: { type: string, enum: [NESTED_IVR, FULL_FLOW] }
    examples:
      - title: Save a draft
        input: { number: "+33199000000", definition: { root: { type: menu } }, schema_version: 1, lock_version: 3,
                 engine_subset: FULL_FLOW }
    refusals:
      - { code: call_flow_changed, when: 409, message: "The call flow changed since it was read (edited or published): read it again." }
    call:
      method: PUT
      path: "/v2/api/numbers/{number}/call_flow/draft"
      body: { definition: definition, schema_version: schema_version, lock_version: lock_version,
              base_published_version: base_published_version, engine_subset: engine_subset }

  - name: publish_call_flow
    class: sensitive
    description: >-
      Publish the working draft of a line's call flow: it routes the line's
      live inbound calls at once. Validation is stricter than on save, and a
      failure publishes nothing; the draft is consumed.
    input:
      type: object
      additionalProperties: false
      required: [number, lock_version]
      properties:
        number: *line_number
        lock_version: { type: integer, description: "The lock_version of the draft, from its last read." }
    examples:
      - title: Publish a draft
        input: { number: "+33199000000", lock_version: 4 }
    refusals:
      - { code: call_flow_changed, when: 409, message: "The call flow changed since it was read (edited or published): read it again." }
    call: { method: POST, path: "/v2/api/numbers/{number}/call_flow/publish", body: { lock_version: lock_version } }
    confirm:
      summary: "Publish the call flow draft of line {number}: its live calls are routed by it at once."

  - name: get_receptionist
    class: read
    description: >-
      The whole configuration of a line's AI receptionist: business details,
      voice and language, prompt, capabilities, business hours, transfer
      rules, calendars and knowledge sources, status. Read it before any write:
      collections are replaced whole.
    input:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: *line_number
    examples:
      - title: The receptionist of a line
        input: { number: "+33199000000" }
    call: { method: GET, path: "/v2/api/numbers/{number}/agent" }

  - name: update_receptionist
    class: write
    description: >-
      Change a line's AI receptionist, prompt and status aside: a single value
      given changes, one left out stays; capabilities, business_hours,
      transfer_rules and scheduling.calendars given replace the configured set
      whole (a capability left out is turned off), so read get_receptionist
      first. Does not put the receptionist on the line.
    input:
      type: object
      additionalProperties: false
      required: [number]
      minProperties: 2
      properties:
        number: *line_number
        name: { type: string, maxLength: 64 }
        business_name: { type: string, maxLength: 64 }
        business_address: { type: string, maxLength: 255 }
        business_phone: { type: string, maxLength: 64, description: "E.164." }
        business_email: { type: string, maxLength: 64 }
        business_website: { type: string, maxLength: 64 }
        business_industry: { type: string, maxLength: 64 }
        language: { type: string, enum: [fr, fr-CA, en-US, en-GB, es, de, hr] }
        voice_id: { type: string, minLength: 1, description: "An id from list_voices, under the receptionist's language." }
        greeting_message: { type: string, maxLength: 1000 }
        closing_message: { type: string, maxLength: 1000 }
        tone_of_voice: { type: string, enum: [FRIENDLY, PROFESSIONAL, NEUTRAL, ENTHUSIASTIC] }
        answer_type: { type: string, enum: [CONCISE, STANDARD, DETAILED] }
        capabilities: { type: object, additionalProperties: { type: boolean }, description: "Every toggle, e.g. SCHEDULING, CALL_TRANSFER." }
        business_hours:
          type: object
          additionalProperties: false
          required: [schedule]
          properties:
            timezone: { type: string, description: "IANA time zone." }
            schedule:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [day, schedule]
                properties:
                  day: { type: string, enum: [MO, TU, WE, TH, FR, SA, SU] }
                  schedule:
                    type: array
                    description: "Open periods in seconds since midnight; an empty list closes the day."
                    items:
                      type: object
                      additionalProperties: false
                      required: [start_time, end_time]
                      properties:
                        start_time: { type: integer, minimum: 0, maximum: 86399 }
                        end_time: { type: integer, minimum: 0, maximum: 86399 }
        transfer_rules:
          type: array
          description: "Every rule; [] removes them all."
          items:
            type: object
            additionalProperties: false
            properties:
              description: { type: string, description: "The caller's reason, as a caller would say it." }
              type: { type: string, enum: [EXTERNAL_NUMBER, MEMBER, INBOX] }
              transfer_message: { type: string }
              target_number: { type: string, description: "For EXTERNAL_NUMBER, E.164." }
              target_member_id: { type: string, description: "For MEMBER, a usr-* id." }
              target_line_number: { type: string, description: "For INBOX, another Allo line, E.164." }
        scheduling:
          type: object
          additionalProperties: false
          properties:
            calendars:
              type: object
              description: "Every calendar it may book on, keyed by an id from list_calendars, each to its event types as get_calendar gives them."
              additionalProperties:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, slug, title]
                  properties:
                    id: { type: string }
                    slug: { type: string }
                    title: { type: string }
                    length_in_minutes: { type: integer }
                    description: { type: string, description: "When to book this one, as the caller's reason." }
        knowledge:
          type: object
          additionalProperties: false
          properties:
            text: { type: string, maxLength: 25000, description: "Deprecated by Allo: add websites instead." }
    examples:
      - title: Business details and a warmer tone
        input: { number: "+33199000000", business_name: Acme Plumbing, tone_of_voice: FRIENDLY }
    call:
      method: PATCH
      path: "/v2/api/numbers/{number}/agent"
      body: { name: name, business_name: business_name, business_address: business_address,
              business_phone: business_phone, business_email: business_email, business_website: business_website,
              business_industry: business_industry, language: language, voice_id: voice_id,
              greeting_message: greeting_message, closing_message: closing_message, tone_of_voice: tone_of_voice,
              answer_type: answer_type, capabilities: capabilities, business_hours: business_hours,
              transfer_rules: transfer_rules, scheduling: scheduling, knowledge: knowledge }

  - name: set_receptionist_status
    class: sensitive
    description: >-
      Put a line's AI receptionist on the line (ACTIVE) or take it off
      (FORWARDING: calls go to the business phone). Changes how the live line
      routes real calls at once.
    input:
      type: object
      additionalProperties: false
      required: [number, status]
      properties:
        number: *line_number
        status: { type: string, enum: [ACTIVE, FORWARDING] }
    examples:
      - title: Put the receptionist on
        input: { number: "+33199000000", status: ACTIVE }
    call: { method: PUT, path: "/v2/api/numbers/{number}/agent/status", body: { status: status } }
    confirm:
      summary: "Set the AI receptionist of line {number} to {status}: its live calls change at once."

  - name: set_receptionist_prompt
    class: write
    description: >-
      Replace the whole prompt of a line's AI receptionist: send every section,
      the unchanged ones too (read get_receptionist first). objective,
      personality and behaviors are required, each section once; a content
      holds 3000 characters at most; required_fields takes fields instead.
      Facts about the business belong in its knowledge, not here.
    input:
      type: object
      additionalProperties: false
      required: [number, sections]
      properties:
        number: *line_number
        sections:
          type: array
          minItems: 3
          items:
            type: object
            additionalProperties: false
            required: [section]
            properties:
              section: { type: string, enum: [objective, personality, behaviors, prohibited, required_fields, objective_completion] }
              content: { type: string, maxLength: 3000 }
              fields:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [label, question, complete_when]
                  properties:
                    label: { type: string }
                    question: { type: string }
                    complete_when: { type: string }
    examples:
      - title: A booking receptionist
        input: { number: "+33199000000", sections: [
                   { section: objective, content: "Book a visit for every caller with a leak." },
                   { section: personality, content: "Calm and brief." },
                   { section: behaviors, content: "Ask for the address first." }] }
    call: { method: PUT, path: "/v2/api/numbers/{number}/agent/prompt", body: { sections: sections } }

  - name: add_receptionist_website
    class: write
    description: >-
      Add a public website to the knowledge of a line's AI receptionist. Allo
      crawls it in the background and answers at once; the receptionist uses
      it once indexed, and a failed crawl is not reported. A site another line
      already has is linked, not crawled again.
    input:
      type: object
      additionalProperties: false
      required: [number, url]
      properties:
        number: *line_number
        url: { type: string, minLength: 1, description: "Without a scheme, https:// is assumed." }
    examples:
      - title: Learn from the company site
        input: { number: "+33199000000", url: "https://acme.example" }
    call: { method: POST, path: "/v2/api/numbers/{number}/agent/knowledge/websites", body: { url: url } }

  - name: update_receptionist_website
    class: write
    description: >-
      Turn a website on (ACTIVE) or off (DISABLED) for this line, its crawled
      content kept; ACTIVE on a website of the team's library adds it to the
      line.
    input:
      type: object
      additionalProperties: false
      required: [number, website_id, status]
      properties:
        number: *line_number
        website_id: &website_id { type: string, minLength: 1, description: "From get_receptionist, under knowledge." }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    examples:
      - title: Stop using a website on this line
        input: { number: "+33199000000", website_id: kws-abc123, status: DISABLED }
    call:
      method: PATCH
      path: "/v2/api/numbers/{number}/agent/knowledge/websites/{website_id}"
      body: { status: status }

  - name: delete_receptionist_website
    class: sensitive
    description: >-
      Delete a website from the team's knowledge library, for every line of
      the team; to stop one line using it, turn it off instead.
    input:
      type: object
      additionalProperties: false
      required: [number, website_id]
      properties:
        number: *line_number
        website_id: *website_id
    examples:
      - title: Delete a website
        input: { number: "+33199000000", website_id: kws-abc123 }
    call: { method: DELETE, path: "/v2/api/numbers/{number}/agent/knowledge/websites/{website_id}" }
    confirm:
      summary: "Delete website {website_id} from the knowledge of every Allo line of the team."

  - name: delete_receptionist_file
    class: sensitive
    description: >-
      Delete an uploaded document from the team's knowledge library, for every
      line of the team. Documents are uploaded in the Allo app only.
    input:
      type: object
      additionalProperties: false
      required: [number, file_id]
      properties:
        number: *line_number
        file_id: { type: string, minLength: 1, description: "From get_receptionist, under knowledge." }
    examples:
      - title: Delete a document
        input: { number: "+33199000000", file_id: kfl-abc123 }
    call: { method: DELETE, path: "/v2/api/numbers/{number}/agent/knowledge/files/{file_id}" }
    confirm:
      summary: "Delete document {file_id} from the knowledge of every Allo line of the team."

  - name: list_calendars
    class: read
    description: >-
      The calendars connected to the workspace that the key's user can see (all
      of them for an admin), booked on by a receptionist or not. Connecting one
      is done in the Allo app.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The calendars
        input: {}
    call: { method: GET, path: /v2/api/calendars }

  - name: get_calendar
    class: read
    description: One connected calendar with the event types its provider offers now, read live.
    input:
      type: object
      additionalProperties: false
      required: [calendar_id]
      properties:
        calendar_id: { type: string, minLength: 1 }
    examples:
      - title: A calendar
        input: { calendar_id: cal-abc123 }
    call: { method: GET, path: "/v2/api/calendars/{calendar_id}" }

  - name: list_voices
    class: read
    description: The voices an AI receptionist may speak with, by language; each id is a voice_id.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The voices
        input: {}
    call: { method: GET, path: /v2/api/voices }
