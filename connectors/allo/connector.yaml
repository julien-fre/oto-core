# yaml-language-server: $schema=../connector.schema.json
# Allo API reference: https://help.withallo.com/en/v2/api-reference/introduction
# OpenAPI: https://help.withallo.com/openapi.json
# Errors: https://help.withallo.com/en/v2/api-reference/guides/error-handling
# 1.1.0: no address of a recording reaches the agent. The reads of a call (list_conversations, under last_item;
# search_conversation_items, get_conversation_item, get_conversation_items) strip recording_url,
# recording_download_url (signed, 48 hours) and its expiry; the audio comes as a file (get_call_recording), in place
# of get_recording_link, which returned a signed link (60 minutes) that plays without an Allo login.
# 1.2.0: the whole team API, the Partner API aside (/v2/api/partner/*, a reseller key, not a team key): custom fields
# of people and companies, tag and note edits, discussion threads, summary templates, webhooks, the call flow and the AI
# receptionist of a line, calendars and voices, named Power Dialer queues and sessions. Deletes, publishing a call flow
# and switching the receptionist are sensitive. Threads and queues name a call by its id, never embed it: nothing to
# strip; the shape of a dialer session is unpublished, and a strip follows if it carries a call.
# The named queues (/v2/api/dialing-queues, /{queue_id}, /{queue_id}/numbers, /{queue_id}/assignee aside), DELETE
# /current and the sessions are served to the key (get_me) but absent from the OpenAPI and the reference: their
# arguments mirror those of /current, without user_id and email on a queue named by id.
# Lists are paged by number from 1 and answer pagination {page, size, total_count, total_pages, has_more}, without the
# next page number that the format's pagination reads: no pagination is declared, the agent passes page itself.
connector:
  name: allo
  label: Allo
  namespace: allo
  version: 1.2.0
  api_version: v2 (SMS on v1)
  base_url: https://api.withallo.com
  auth:
    kind: api_key
    in: header
    name: Authorization
    prefix: "Api-Key "
    key: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  rate_limit: { requests: 5, seconds: 1 }
  probe: { function: get_me }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Allo rejected the request as invalid: check the ids (cll-*, msg-*, per-*, com-*, dea-*), the E.164 numbers and the dates." }
    - { status: 401, code: key_rejected, retryable: false, marks_account: credential_rejected,
        message: "Allo did not accept the API key: it is wrong, revoked or expired." }
    - { status: 403, code: scope_missing, retryable: false,
        message: "Allo refused the call: the API key lacks the scope it needs (scopes are chosen when the key is created in Allo), or its user may not reach this object." }
    - { status: 404, code: not_found, retryable: false,
        message: "Allo object not found: check the id or the phone number (E.164)." }
    - { status: 409, code: conflict, retryable: false,
        message: "Allo refused a duplicate or a state conflict." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Allo rate limit reached (20 reads, 5 writes per second): retry after error.retry_after_seconds." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Allo is temporarily unavailable: retry later." }

functions:
  - name: get_me
    class: read
    description: >-
      The API key itself: its scopes, the endpoints it may call, the team (id,
      name) and the rate limits. Needs no scope: read it first to know what the
      key can do.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: What can this key do
        input: {}
    call: { method: GET, path: /v2/api/me }

  - name: list_users
    class: read
    description: The team's members (id, name, email, role, status).
    input:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [ADMIN, MANAGER, MEMBER] }
        status: { type: string, enum: [ACTIVE, BLOCKED] }
    examples:
      - title: The active members
        input: { status: ACTIVE }
    call: { method: GET, path: /v2/api/users, query: { role: role, status: status } }

  - name: get_user
    class: read
    description: One member of the team (id, name, email, role, status).
    input:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: string, minLength: 1, description: "usr-* id, from list_users." }
    examples:
      - title: A member
        input: { user_id: usr-abc123 }
    call: { method: GET, path: "/v2/api/users/{user_id}" }

  - name: list_numbers
    class: read
    description: >-
      The team's phone numbers and sender ids: number (E.164), name, country,
      type, capabilities and the members on each line.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The team's lines
        input: {}
    call: { method: GET, path: /v2/api/numbers }

  - name: list_conversations
    class: read
    description: >-
      The conversations of one Allo line, one per contact number, most recent
      activity first, each with its last call or text (last_item).
      last_activity_since (ISO 8601) reads only what changed.
      extend=transcript adds the call transcripts (large). The audio of a call
      is never a link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      required: [allo_number]
      properties:
        allo_number: &allo_number { type: string, minLength: 1, description: "An Allo line, E.164." }
        last_activity_since: { type: string, format: date-time }
        unread: { type: boolean }
        page: &page { type: integer, minimum: 1, description: "Page number, from 1; pagination.has_more in the answer is false on the last page." }
        size: &size { type: integer, minimum: 1, maximum: 100 }
        extend: &extend { type: string, enum: [transcript] }
    examples:
      - title: Unread conversations of a line
        input: { allo_number: "+33199000000", unread: true }
    call:
      method: GET
      path: /v2/api/conversations
      query: { allo_number: allo_number, last_activity_since: last_activity_since, unread: unread,
               page: page, size: size, extend: extend }
    # The addresses of a call's recording never reach the agent: recording_url, recording_download_url (signed,
    # 48 hours, no login) and its expiry, here on the last item of each conversation.
    output:
      strip: [data.last_item.recording_url, data.last_item.recording_download_url,
              data.last_item.recording_download_expires_at]
      sample:
        data:
          - contact_number: "+33199000001"
            last_item: &sample_item
              id: cll-0
              type: CALL
              duration: 42
              recording_duration: 30
              recording_url: "https://files.example.test/recordings/cll-0.mp3"
              recording_download_url: "https://files.example.test/sign/recordings/cll-0.mp3?token=t-0"
              recording_download_expires_at: "2026-01-01T00:00:00Z"
        pagination: &sample_pagination { page: 1, size: 20, total_count: 1, total_pages: 1, has_more: false }

  - name: search_conversation_items
    class: read
    description: >-
      Calls and texts across every conversation, filtered by line, contact,
      member, direction, type, result, tags, unread or unresponded, and date
      ({from, to}, both dates); search is a keyword over transcripts, summaries
      and message content. Each item: id (cll-* call, msg-* text), date,
      duration, result, member, contact, summary, tags. The audio of a call is
      never a link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      properties:
        allo_number: *allo_number
        contact_number: &contact_number { type: string, minLength: 1, personal: true, description: "The contact's number, E.164." }
        user_id: { type: string, minLength: 1 }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        type: { type: string, enum: [CALL, SMS, ALL] }
        result: { type: string, enum: [ANSWERED, VOICEMAIL, TRANSFERRED] }
        tags: { type: array, items: { type: string } }
        unread: { type: boolean }
        unresponded: { type: boolean }
        search: { type: string, minLength: 1 }
        date: &date
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        sort: { type: string, enum: [DATE_DESC, DATE_ASC, RELEVANCE] }
        extend: *extend
        page: *page
        size: *size
    examples:
      - title: Answered calls that mention pricing this month
        input: { type: CALL, result: ANSWERED, search: pricing, date: { from: "2026-10-01", to: "2026-10-20" } }
    call:
      method: POST
      path: /v2/api/conversations/items/search
      body: { allo_number: allo_number, contact_number: contact_number, user_id: user_id,
              direction: direction, type: type, result: result, tags: tags, unread: unread,
              unresponded: unresponded, search: search, date: date, sort: sort, extend: extend,
              page: page, size: size }
    output:
      strip: &item_addresses [data.recording_url, data.recording_download_url, data.recording_download_expires_at]
      sample: { data: [*sample_item], pagination: *sample_pagination }

  - name: get_conversation_item
    class: read
    description: >-
      One call (cll-*) or text (msg-*): date, duration, result, member,
      contact, AI summary, tags, extracted data, content of a text.
      extend=transcript adds the transcript. The audio of a call is never a
      link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        item_id: &item_id { type: string, minLength: 1, description: "cll-* for a call, msg-* for a text." }
        extend: *extend
    examples:
      - title: A call with its transcript
        input: { item_id: cll-abc123, extend: transcript }
    call: { method: GET, path: "/v2/api/conversations/items/{item_id}", query: { extend: extend } }
    output: { strip: *item_addresses, sample: { data: *sample_item } }

  - name: get_conversation_items
    class: read
    description: >-
      Several calls or texts by id in one request, full details. The audio of
      a call is never a link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    examples:
      - title: Two calls
        input: { ids: [cll-abc123, cll-def456] }
    call: { method: POST, path: /v2/api/conversations/items/batch, body: { ids: ids } }
    output: { strip: *item_addresses, sample: { data: [*sample_item] } }

  - name: get_call_recording
    class: read
    description: >-
      Get the audio recording of one Allo call (cll-*) as a file of yours,
      kept 24 hours: the answer gives its file id, to pass as is to a function
      that takes a file (a transcription). Never a link. A text (msg-*) or an
      unrecorded call has none; only a user who may play the call in Allo gets
      it, and never on a HIPAA-enabled team.
    input:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        item_id: { type: string, minLength: 1, description: "cll-* id of a call." }
    examples:
      - title: The recording of a call
        input: { item_id: cll-abc123 }
    # The codes Allo puts in error.code (OpenAPI, getConversationItemRecording).
    refusals:
      - { code: recording_not_found, when: 404, body: { path: error.code, equals: [RECORDING_NOT_FOUND] },
          message: "This call has no recording: it was not recorded, or the id is a text (msg-*)." }
      - { code: call_not_found, when: 404, message: "No Allo call with this id." }
      - { code: recording_access_denied, when: 403, body: { path: error.code, equals: [RECORDING_ACCESS_DENIED] },
          message: "The user of this API key may not play this call's recording in Allo." }
      - { code: recording_download_restricted, when: 403, body: { path: error.code, equals: [RECORDING_DOWNLOAD_RESTRICTED] },
          message: "The line belongs to a HIPAA-enabled team: Allo never lets its recordings out." }
    call: { method: GET, path: "/v2/api/conversations/items/{item_id}/recording" }
    # data.url is a fresh link signed by its own query, valid 60 minutes and played with no Allo login: downloaded at
    # once, without the account's authentication, never followed through a redirect.
    output:
      file:
        from: url
        path: data.url
        auth: none
        types: { mp3: [audio/mpeg, audio/mp3] }
        name: { template: "call-{item_id}-recording.mp3" }
        max_bytes: 52428800
    timeout_s: 120

  - name: update_call_summary
    class: write
    description: >-
      Replace the markdown of a call's AI summary (calls only). template_key
      picks the summary when the call has several.
    input:
      type: object
      additionalProperties: false
      required: [item_id, content]
      properties:
        item_id: *item_id
        content: { type: string, minLength: 1 }
        template_key: { type: string, enum: [MARKDOWN_CLASSIC, MARKDOWN_SHORT_CALL] }
    examples:
      - title: Rewrite a summary
        input: { item_id: cll-abc123, content: "## Next step\nSend the quote by Friday." }
    call:
      method: PATCH
      path: "/v2/api/conversations/items/{item_id}/summary"
      body: { content: content, template_key: template_key }

  - name: update_conversation
    class: write
    description: Mark a conversation read or unread, archive or unarchive it.
    input:
      type: object
      additionalProperties: false
      required: [contact_number, action]
      properties:
        contact_number: *contact_number
        action: { type: string, enum: [READ, UNREAD, ARCHIVE, UNARCHIVE] }
        allo_number: *allo_number
    examples:
      - title: Archive a conversation
        input: { contact_number: "+33199000001", action: ARCHIVE }
    call:
      method: PUT
      path: "/v2/api/conversations/{contact_number}/action"
      body: { action: action, allo_number: allo_number }

  - name: list_tags
    class: read
    description: The team's tags (key, name, color).
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The tags
        input: {}
    call: { method: GET, path: /v2/api/tags }

  - name: create_tag
    class: write
    description: A new team tag; its key is the slug of its name.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string, minLength: 1 }
    examples:
      - title: A tag for booked meetings
        input: { name: Meeting booked }
    call: { method: POST, path: /v2/api/tags, body: { name: name, color: color } }

  - name: delete_tag
    class: sensitive
    description: >-
      Delete a team tag by its key; it disappears from the tag list. A tag
      synced from a CRM integration cannot be deleted.
    input:
      type: object
      additionalProperties: false
      required: [tag_id]
      properties:
        tag_id: { type: string, minLength: 1, description: "The tag key, from list_tags." }
    examples:
      - title: Delete a tag
        input: { tag_id: meeting_booked }
    call: { method: DELETE, path: "/v2/api/tags/{tag_id}" }
    confirm:
      summary: "Delete Allo tag {tag_id} for the whole team."

  - name: add_item_tags
    class: write
    description: Tag a call with one or more tag keys.
    input:
      type: object
      additionalProperties: false
      required: [item_id, tags]
      properties:
        item_id: *item_id
        tags: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    examples:
      - title: Tag a call
        input: { item_id: cll-abc123, tags: [meeting_booked] }
    call: { method: POST, path: "/v2/api/conversations/items/{item_id}/tags", body: { tags: tags } }

  - name: remove_item_tag
    class: write
    description: Remove one tag from a call.
    input:
      type: object
      additionalProperties: false
      required: [item_id, tag]
      properties:
        item_id: *item_id
        tag: { type: string, minLength: 1, description: "The tag key." }
    examples:
      - title: Untag a call
        input: { item_id: cll-abc123, tag: meeting_booked }
    call: { method: DELETE, path: "/v2/api/conversations/items/{item_id}/tags/{tag}" }

  - name: list_conversation_notes
    class: read
    description: The internal team notes on a conversation, never shown to the contact.
    input:
      type: object
      additionalProperties: false
      required: [contact_number, allo_number]
      properties:
        contact_number: *contact_number
        allo_number: *allo_number
        page: *page
        size: *size
    examples:
      - title: Notes on a conversation
        input: { contact_number: "+33199000001", allo_number: "+33199000000" }
    call:
      method: GET
      path: "/v2/api/conversations/{contact_number}/notes"
      query: { allo_number: allo_number, page: page, size: size }

  - name: create_conversation_note
    class: write
    description: Add an internal team note to a conversation; the contact never sees it.
    input:
      type: object
      additionalProperties: false
      required: [contact_number, content]
      properties:
        contact_number: *contact_number
        content: { type: string, minLength: 1 }
        allo_number: *allo_number
        sender_id: { type: string, minLength: 1, description: "The member the note is written as." }
    examples:
      - title: A note after a call
        input: { contact_number: "+33199000001", content: "Wants a demo next week." }
    call:
      method: POST
      path: "/v2/api/conversations/{contact_number}/notes"
      body: { content: content, allo_number: allo_number, sender_id: sender_id }

  - name: get_conversation_note
    class: read
    description: One internal note on a conversation, by id.
    input:
      type: object
      additionalProperties: false
      required: [note_id]
      properties:
        note_id: &note_id { type: string, minLength: 1, description: "not-* id." }
    examples:
      - title: A note
        input: { note_id: not-abc123 }
    call: { method: GET, path: "/v2/api/conversations/notes/{note_id}" }

  - name: update_conversation_note
    class: write
    description: >-
      Replace the content of a note on a conversation; only its author may.
      Mention a teammate inline with @[Name](usr-...).
    input:
      type: object
      additionalProperties: false
      required: [note_id, content]
      properties:
        note_id: *note_id
        content: &note_content { type: string, minLength: 1, maxLength: 4000 }
    examples:
      - title: Correct a note
        input: { note_id: not-abc123, content: "Wants a demo on Tuesday." }
    call: { method: PATCH, path: "/v2/api/conversations/notes/{note_id}", body: { content: content } }

  - name: delete_conversation_note
    class: sensitive
    description: Delete a note on a conversation; only its author may.
    input:
      type: object
      additionalProperties: false
      required: [note_id]
      properties:
        note_id: *note_id
    examples:
      - title: Delete a note
        input: { note_id: not-abc123 }
    call: { method: DELETE, path: "/v2/api/conversations/notes/{note_id}" }
    confirm:
      summary: "Delete Allo note {note_id}."

  - name: list_person_notes
    class: read
    description: The notes on a person's CRM profile.
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: &person_id { type: string, minLength: 1, description: "per-* id." }
        page: *page
        size: *size
    examples:
      - title: Notes on a person
        input: { person_id: per-abc123 }
    call: { method: GET, path: "/v2/api/crm/people/{person_id}/notes", query: { page: page, size: size } }

  - name: create_person_note
    class: write
    description: Add a note to a person's CRM profile.
    input:
      type: object
      additionalProperties: false
      required: [person_id, content]
      properties:
        person_id: *person_id
        content: { type: string, minLength: 1 }
    examples:
      - title: A note on a person
        input: { person_id: per-abc123, content: "Decision maker for telephony." }
    call: { method: POST, path: "/v2/api/crm/people/{person_id}/notes", body: { content: content } }

  - name: update_person_note
    class: write
    description: Replace the content of a note on a person's CRM profile; only its author may.
    input:
      type: object
      additionalProperties: false
      required: [person_id, note_id, content]
      properties:
        person_id: *person_id
        note_id: *note_id
        content: *note_content
    examples:
      - title: Correct a person note
        input: { person_id: per-abc123, note_id: not-def456, content: "Decision maker for telephony and CRM." }
    call:
      method: PATCH
      path: "/v2/api/crm/people/{person_id}/notes/{note_id}"
      body: { content: content }

  - name: delete_person_note
    class: sensitive
    description: Delete a note on a person's CRM profile; only its author may.
    input:
      type: object
      additionalProperties: false
      required: [person_id, note_id]
      properties:
        person_id: *person_id
        note_id: *note_id
    examples:
      - title: Delete a person note
        input: { person_id: per-abc123, note_id: not-def456 }
    call: { method: DELETE, path: "/v2/api/crm/people/{person_id}/notes/{note_id}" }
    confirm:
      summary: "Delete Allo note {note_id} of person {person_id}."

  - name: find_thread
    class: read
    description: >-
      The discussion thread of one call, text or conversation note, if it has
      one (an item has one thread at most): the team's comments on it.
    input:
      type: object
      additionalProperties: false
      required: [entity_type, entity_id]
      properties:
        entity_type: &entity_type { type: string, enum: [CALL, TEXT_MESSAGE, CONVERSATION_NOTE] }
        entity_id: &entity_id { type: string, minLength: 1, description: "cll-* for a call, msg-* for a text, not-* for a note." }
    examples:
      - title: The thread of a call
        input: { entity_type: CALL, entity_id: cll-abc123 }
    call: { method: GET, path: /v2/api/threads, query: { entity_type: entity_type, entity_id: entity_id } }

  - name: get_thread
    class: read
    description: A thread with all its comments, its item and whether it is resolved.
    input:
      type: object
      additionalProperties: false
      required: [thread_id]
      properties:
        thread_id: &thread_id { type: string, minLength: 1, description: "cth-* id." }
    examples:
      - title: A thread
        input: { thread_id: cth-abc123 }
    call: { method: GET, path: "/v2/api/threads/{thread_id}" }

  - name: create_thread
    class: write
    description: >-
      Start the discussion thread of a call, text or conversation note with a
      first comment; an item has one thread at most. Mention a teammate inline
      with @[Name](usr-...).
    input:
      type: object
      additionalProperties: false
      required: [entity_type, entity_id, content]
      properties:
        entity_type: *entity_type
        entity_id: *entity_id
        content: *note_content
    examples:
      - title: Ask a teammate about a call
        input: { entity_type: CALL, entity_id: cll-abc123, content: "@[Marie](usr-abc123) can you follow up?" }
    call:
      method: POST
      path: /v2/api/threads
      body: { entity_type: entity_type, entity_id: entity_id, content: content }

  - name: add_thread_comment
    class: write
    description: Add a comment to a thread.
    input:
      type: object
      additionalProperties: false
      required: [thread_id, content]
      properties:
        thread_id: *thread_id
        content: *note_content
    examples:
      - title: Reply in a thread
        input: { thread_id: cth-abc123, content: "Done, quote sent." }
    call: { method: POST, path: "/v2/api/threads/{thread_id}/comments", body: { content: content } }

  - name: update_thread_comment
    class: write
    description: Replace the content of a comment; only its author may.
    input:
      type: object
      additionalProperties: false
      required: [comment_id, content]
      properties:
        comment_id: { type: string, minLength: 1, description: "thc-* id." }
        content: *note_content
    examples:
      - title: Correct a comment
        input: { comment_id: thc-abc123, content: "Done, quote sent on Monday." }
