    class: write
    description: >-
      Hand a Power Dialer queue, numbers and creator kept, to another member of
      the team, by user_id or email (user_id wins). Only the key of an admin or
      a manager who created the queue or runs it may.
    input:
      type: object
      additionalProperties: false
      required: [queue_id]
      properties:
        queue_id: *queue_id
