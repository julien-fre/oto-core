# yaml-language-server: $schema=../connector.schema.json
# Allo API reference: https://help.withallo.com/en/v2/api-reference/introduction
# OpenAPI: https://help.withallo.com/openapi.json
# Errors: https://help.withallo.com/en/v2/api-reference/guides/error-handling
# 1.1.0: no address of a recording reaches the agent. The reads of a call (list_conversations, under last_item;
# search_conversation_items, get_conversation_item, get_conversation_items) strip recording_url,
# recording_download_url (signed, 48 hours) and its expiry; the audio comes as a file (get_call_recording), in place
# of get_recording_link, which returned a signed link (60 minutes) that plays without an Allo login.
# Lists are paged by number from 1 and answer pagination {page, size, total_count, total_pages, has_more}, without the
# next page number that the format's pagination reads: no pagination is declared, the agent passes page itself.
connector:
  name: allo
  label: Allo
  namespace: allo
  version: 1.1.0
  api_version: v2 (SMS on v1)
  base_url: https://api.withallo.com
  auth:
    kind: api_key
    in: header
    name: Authorization
    prefix: "Api-Key "
    key: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  rate_limit: { requests: 5, seconds: 1 }
  probe: { function: get_me }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Allo rejected the request as invalid: check the ids (cll-*, msg-*, per-*, com-*, dea-*), the E.164 numbers and the dates." }
    - { status: 401, code: key_rejected, retryable: false, marks_account: credential_rejected,
        message: "Allo did not accept the API key: it is wrong, revoked or expired." }
    - { status: 403, code: scope_missing, retryable: false,
        message: "Allo refused the call: the API key lacks the scope it needs (scopes are chosen when the key is created in Allo), or its user may not reach this object." }
    - { status: 404, code: not_found, retryable: false,
        message: "Allo object not found: check the id or the phone number (E.164)." }
    - { status: 409, code: conflict, retryable: false,
        message: "Allo refused a duplicate or a state conflict." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Allo rate limit reached (20 reads, 5 writes per second): retry after error.retry_after_seconds." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Allo is temporarily unavailable: retry later." }

functions:
  - name: get_me
    class: read
    description: >-
      The API key itself: its scopes, the endpoints it may call, the team (id,
      name) and the rate limits. Needs no scope: read it first to know what the
      key can do.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: What can this key do
        input: {}
    call: { method: GET, path: /v2/api/me }

  - name: list_users
    class: read
    description: The team's members (id, name, email, role, status).
    input:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [ADMIN, MANAGER, MEMBER] }
        status: { type: string, enum: [ACTIVE, BLOCKED] }
    examples:
      - title: The active members
        input: { status: ACTIVE }
    call: { method: GET, path: /v2/api/users, query: { role: role, status: status } }

  - name: list_numbers
    class: read
    description: >-
      The team's phone numbers and sender ids: number (E.164), name, country,
      type, capabilities and the members on each line.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The team's lines
        input: {}
    call: { method: GET, path: /v2/api/numbers }

  - name: list_conversations
    class: read
    description: >-
      The conversations of one Allo line, one per contact number, most recent
      activity first, each with its last call or text (last_item).
      last_activity_since (ISO 8601) reads only what changed.
      extend=transcript adds the call transcripts (large). The audio of a call
      is never a link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      required: [allo_number]
      properties:
        allo_number: &allo_number { type: string, minLength: 1, description: "An Allo line, E.164." }
        last_activity_since: { type: string, format: date-time }
        unread: { type: boolean }
        page: &page { type: integer, minimum: 1, description: "Page number, from 1; pagination.has_more in the answer is false on the last page." }
        size: &size { type: integer, minimum: 1, maximum: 100 }
        extend: &extend { type: string, enum: [transcript] }
    examples:
      - title: Unread conversations of a line
        input: { allo_number: "+33199000000", unread: true }
    call:
      method: GET
      path: /v2/api/conversations
      query: { allo_number: allo_number, last_activity_since: last_activity_since, unread: unread,
               page: page, size: size, extend: extend }
    # The addresses of a call's recording never reach the agent: recording_url, recording_download_url (signed,
    # 48 hours, no login) and its expiry, here on the last item of each conversation.
    output:
      strip: [data.last_item.recording_url, data.last_item.recording_download_url,
              data.last_item.recording_download_expires_at]
      sample:
        data:
          - contact_number: "+33199000001"
            last_item: &sample_item
              id: cll-0
              type: CALL
              duration: 42
              recording_duration: 30
              recording_url: "https://files.example.test/recordings/cll-0.mp3"
              recording_download_url: "https://files.example.test/sign/recordings/cll-0.mp3?token=t-0"
              recording_download_expires_at: "2026-01-01T00:00:00Z"
        pagination: &sample_pagination { page: 1, size: 20, total_count: 1, total_pages: 1, has_more: false }

  - name: search_conversation_items
    class: read
    description: >-
      Calls and texts across every conversation, filtered by line, contact,
      member, direction, type, result, tags, unread or unresponded, and date
      ({from, to}, both dates); search is a keyword over transcripts, summaries
      and message content. Each item: id (cll-* call, msg-* text), date,
      duration, result, member, contact, summary, tags. The audio of a call is
      never a link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      properties:
        allo_number: *allo_number
        contact_number: &contact_number { type: string, minLength: 1, personal: true, description: "The contact's number, E.164." }
        user_id: { type: string, minLength: 1 }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        type: { type: string, enum: [CALL, SMS, ALL] }
        result: { type: string, enum: [ANSWERED, VOICEMAIL, TRANSFERRED] }
        tags: { type: array, items: { type: string } }
        unread: { type: boolean }
        unresponded: { type: boolean }
        search: { type: string, minLength: 1 }
        date: &date
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        sort: { type: string, enum: [DATE_DESC, DATE_ASC, RELEVANCE] }
        extend: *extend
        page: *page
        size: *size
    examples:
      - title: Answered calls that mention pricing this month
        input: { type: CALL, result: ANSWERED, search: pricing, date: { from: "2026-10-01", to: "2026-10-20" } }
    call:
      method: POST
      path: /v2/api/conversations/items/search
      body: { allo_number: allo_number, contact_number: contact_number, user_id: user_id,
              direction: direction, type: type, result: result, tags: tags, unread: unread,
              unresponded: unresponded, search: search, date: date, sort: sort, extend: extend,
              page: page, size: size }
    output:
      strip: &item_addresses [data.recording_url, data.recording_download_url, data.recording_download_expires_at]
      sample: { data: [*sample_item], pagination: *sample_pagination }

  - name: get_conversation_item
    class: read
    description: >-
      One call (cll-*) or text (msg-*): date, duration, result, member,
      contact, AI summary, tags, extracted data, content of a text.
      extend=transcript adds the transcript. The audio of a call is never a
      link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        item_id: &item_id { type: string, minLength: 1, description: "cll-* for a call, msg-* for a text." }
        extend: *extend
    examples:
      - title: A call with its transcript
        input: { item_id: cll-abc123, extend: transcript }
    call: { method: GET, path: "/v2/api/conversations/items/{item_id}", query: { extend: extend } }
    output: { strip: *item_addresses, sample: { data: *sample_item } }

  - name: get_conversation_items
    class: read
    description: >-
      Several calls or texts by id in one request, full details. The audio of
      a call is never a link: get it as a file with get_call_recording.
    input:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    examples:
      - title: Two calls
        input: { ids: [cll-abc123, cll-def456] }
    call: { method: POST, path: /v2/api/conversations/items/batch, body: { ids: ids } }
    output: { strip: *item_addresses, sample: { data: [*sample_item] } }

  - name: get_call_recording
    class: read
    description: >-
      Get the audio recording of one Allo call (cll-*) as a file of yours,
      kept 24 hours: the answer gives its file id, to pass as is to a function
      that takes a file (a transcription). Never a link. A text (msg-*) or an
      unrecorded call has none; only a user who may play the call in Allo gets
      it, and never on a HIPAA-enabled team.
    input:
      type: object
      additionalProperties: false
      required: [item_id]
      properties:
        item_id: { type: string, minLength: 1, description: "cll-* id of a call." }
    examples:
      - title: The recording of a call
        input: { item_id: cll-abc123 }
    # The codes Allo puts in error.code (OpenAPI, getConversationItemRecording).
    refusals:
      - { code: recording_not_found, when: 404, body: { path: error.code, equals: [RECORDING_NOT_FOUND] },
          message: "This call has no recording: it was not recorded, or the id is a text (msg-*)." }
      - { code: call_not_found, when: 404, message: "No Allo call with this id." }
      - { code: recording_access_denied, when: 403, body: { path: error.code, equals: [RECORDING_ACCESS_DENIED] },
          message: "The user of this API key may not play this call's recording in Allo." }
      - { code: recording_download_restricted, when: 403, body: { path: error.code, equals: [RECORDING_DOWNLOAD_RESTRICTED] },
          message: "The line belongs to a HIPAA-enabled team: Allo never lets its recordings out." }
    call: { method: GET, path: "/v2/api/conversations/items/{item_id}/recording" }
    # data.url is a fresh link signed by its own query, valid 60 minutes and played with no Allo login: downloaded at
    # once, without the account's authentication, never followed through a redirect.
    output:
      file:
        from: url
        path: data.url
        auth: none
        types: { mp3: [audio/mpeg, audio/mp3] }
        name: { template: "call-{item_id}-recording.mp3" }
        max_bytes: 52428800
    timeout_s: 120

  - name: update_call_summary
    class: write
    description: >-
      Replace the markdown of a call's AI summary (calls only). template_key
      picks the summary when the call has several.
    input:
      type: object
      additionalProperties: false
      required: [item_id, content]
      properties:
        item_id: *item_id
        content: { type: string, minLength: 1 }
        template_key: { type: string, enum: [MARKDOWN_CLASSIC, MARKDOWN_SHORT_CALL] }
    examples:
      - title: Rewrite a summary
        input: { item_id: cll-abc123, content: "## Next step\nSend the quote by Friday." }
    call:
      method: PATCH
      path: "/v2/api/conversations/items/{item_id}/summary"
      body: { content: content, template_key: template_key }

  - name: update_conversation
    class: write
    description: Mark a conversation read or unread, archive or unarchive it.
    input:
      type: object
      additionalProperties: false
      required: [contact_number, action]
      properties:
        contact_number: *contact_number
        action: { type: string, enum: [READ, UNREAD, ARCHIVE, UNARCHIVE] }
        allo_number: *allo_number
    examples:
      - title: Archive a conversation
        input: { contact_number: "+33199000001", action: ARCHIVE }
    call:
      method: PUT
      path: "/v2/api/conversations/{contact_number}/action"
      body: { action: action, allo_number: allo_number }

  - name: list_tags
    class: read
    description: The team's tags (key, name, color).
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The tags
        input: {}
    call: { method: GET, path: /v2/api/tags }

  - name: create_tag
    class: write
    description: A new team tag; its key is the slug of its name.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string, minLength: 1 }
    examples:
      - title: A tag for booked meetings
        input: { name: Meeting booked }
    call: { method: POST, path: /v2/api/tags, body: { name: name, color: color } }

  - name: add_item_tags
    class: write
    description: Tag a call with one or more tag keys.
    input:
      type: object
      additionalProperties: false
      required: [item_id, tags]
      properties:
        item_id: *item_id
        tags: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    examples:
      - title: Tag a call
        input: { item_id: cll-abc123, tags: [meeting_booked] }
    call: { method: POST, path: "/v2/api/conversations/items/{item_id}/tags", body: { tags: tags } }

  - name: remove_item_tag
    class: write
    description: Remove one tag from a call.
    input:
      type: object
      additionalProperties: false
      required: [item_id, tag]
      properties:
        item_id: *item_id
        tag: { type: string, minLength: 1, description: "The tag key." }
    examples:
      - title: Untag a call
        input: { item_id: cll-abc123, tag: meeting_booked }
    call: { method: DELETE, path: "/v2/api/conversations/items/{item_id}/tags/{tag}" }

  - name: list_conversation_notes
    class: read
    description: The internal team notes on a conversation, never shown to the contact.
    input:
      type: object
      additionalProperties: false
      required: [contact_number, allo_number]
      properties:
        contact_number: *contact_number
        allo_number: *allo_number
        page: *page
        size: *size
    examples:
      - title: Notes on a conversation
        input: { contact_number: "+33199000001", allo_number: "+33199000000" }
    call:
      method: GET
      path: "/v2/api/conversations/{contact_number}/notes"
      query: { allo_number: allo_number, page: page, size: size }

  - name: create_conversation_note
    class: write
    description: Add an internal team note to a conversation; the contact never sees it.
    input:
      type: object
      additionalProperties: false
      required: [contact_number, content]
      properties:
        contact_number: *contact_number
        content: { type: string, minLength: 1 }
        allo_number: *allo_number
        sender_id: { type: string, minLength: 1, description: "The member the note is written as." }
    examples:
      - title: A note after a call
        input: { contact_number: "+33199000001", content: "Wants a demo next week." }
    call:
      method: POST
      path: "/v2/api/conversations/{contact_number}/notes"
      body: { content: content, allo_number: allo_number, sender_id: sender_id }

  - name: list_person_notes
    class: read
    description: The notes on a person's CRM profile.
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: &person_id { type: string, minLength: 1, description: "per-* id." }
        page: *page
        size: *size
    examples:
      - title: Notes on a person
        input: { person_id: per-abc123 }
    call: { method: GET, path: "/v2/api/crm/people/{person_id}/notes", query: { page: page, size: size } }

  - name: create_person_note
    class: write
    description: Add a note to a person's CRM profile.
    input:
      type: object
      additionalProperties: false
      required: [person_id, content]
      properties:
        person_id: *person_id
        content: { type: string, minLength: 1 }
    examples:
      - title: A note on a person
        input: { person_id: per-abc123, content: "Decision maker for telephony." }
    call: { method: POST, path: "/v2/api/crm/people/{person_id}/notes", body: { content: content } }

  - name: search_people
    class: read
    description: >-
      People of the contacts CRM, filtered (name, last_name, job_title,
      website, company, phone_number, email, deal_status) or by a free search.
    input:
      type: object
      additionalProperties: false
      properties:
        filters:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, personal: true }
            last_name: { type: string, personal: true }
            job_title: { type: string }
            website: { type: string }
            company: { type: string }
            phone_number: { type: string, personal: true }
            email: { type: string, personal: true }
            deal_status: { type: string }
        search: { type: string, minLength: 1 }
        sort: &sort { type: string, enum: [DATE_DESC, DATE_ASC, NAME_ASC, NAME_DESC, CREATED_DESC, CREATED_ASC] }
        page: *page
        size: *size
    examples:
      - title: People at a company
        input: { filters: { company: Acme } }
    call:
      method: POST
      path: /v2/api/crm/people/search
      body: { filters: filters, search: search, sort: sort, page: page, size: size }

  - name: get_person
    class: read
    description: One person of the CRM, with company, numbers, emails and custom attributes.
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: *person_id
    examples:
      - title: A person
        input: { person_id: per-abc123 }
    call: { method: GET, path: "/v2/api/crm/people/{person_id}" }

  - name: create_person
    class: write
    description: >-
      A person in the CRM, with at least one phone number. custom_attributes
      takes the keys list_person_attributes returns.
    input:
      type: object
      additionalProperties: false
      required: [numbers]
      properties:
        numbers: &numbers { type: array, minItems: 1, items: { type: string, minLength: 1, personal: true } }
        name: &pname { type: string, personal: true }
        last_name: &plast { type: string, personal: true }
        job_title: &job { type: string }
        website: &pweb { type: string }
        address: &paddr { type: string, personal: true }
        emails: &emails { type: array, items: { type: string, personal: true } }
        company_id: &company_ref { type: string, minLength: 1 }
        allow_duplicate_number: { type: boolean }
        custom_attributes: &custom { type: object }
    examples:
      - title: A new prospect
        input: { numbers: ["+33199000001"], name: Marie, last_name: Durand, job_title: CEO }
    call:
      method: POST
      path: /v2/api/crm/people
      body: { numbers: numbers, name: name, last_name: last_name, job_title: job_title,
              website: website, address: address, emails: emails, company_id: company_id,
              allow_duplicate_number: allow_duplicate_number, custom_attributes: custom_attributes }

  - name: update_person
    class: write
    description: Update a person of the CRM; only the fields given change.
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: *person_id
        numbers: *numbers
        name: *pname
        last_name: *plast
        job_title: *job
        website: *pweb
        address: *paddr
        emails: *emails
        company_id: *company_ref
        custom_attributes: *custom
    examples:
      - title: A new job title
        input: { person_id: per-abc123, job_title: COO }
    call:
      method: PUT
      path: "/v2/api/crm/people/{person_id}"
      body: { numbers: numbers, name: name, last_name: last_name, job_title: job_title,
              website: website, address: address, emails: emails, company_id: company_id,
              custom_attributes: custom_attributes }

  - name: search_companies
    class: read
    description: Companies of the CRM, filtered by name, website or industry.
    input:
      type: object
      additionalProperties: false
      properties:
        filters:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
            website: { type: string }
            industry: { type: string }
        sort: *sort
        page: *page
        size: *size
    examples:
      - title: A company by name
        input: { filters: { name: Acme } }
    call:
      method: POST
      path: /v2/api/crm/companies/search
      body: { filters: filters, sort: sort, page: page, size: size }

  - name: get_company
    class: read
    description: One company of the CRM, with its people count and custom attributes.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: &company_id { type: string, minLength: 1, description: "com-* id." }
    examples:
      - title: A company
        input: { company_id: com-xyz789 }
    call: { method: GET, path: "/v2/api/crm/companies/{company_id}" }

  - name: create_company
    class: write
    description: A company in the CRM.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        website: { type: string }
        industry: { type: string }
        custom_attributes: *custom
    examples:
      - title: A new company
        input: { name: Acme, website: acme.example }
    call:
      method: POST
      path: /v2/api/crm/companies
      body: { name: name, website: website, industry: industry, custom_attributes: custom_attributes }

  - name: update_company
    class: write
    description: Update a company of the CRM; only the fields given change.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        name: { type: string, minLength: 1 }
        website: { type: string }
        industry: { type: string }
        custom_attributes: *custom
    examples:
      - title: Set the industry
        input: { company_id: com-xyz789, industry: Software }
    call:
      method: PUT
      path: "/v2/api/crm/companies/{company_id}"
      body: { name: name, website: website, industry: industry, custom_attributes: custom_attributes }

  - name: search_deals
    class: read
    description: Deals of the CRM, filtered by stage or by a free search.
    input:
      type: object
      additionalProperties: false
      properties:
        filters:
          type: object
          additionalProperties: false
          properties:
            stage: { type: string }
        search: { type: string, minLength: 1 }
        sort: *sort
        page: *page
        size: *size
    examples:
      - title: Open deals
        input: { filters: { stage: open } }
    call:
      method: POST
      path: /v2/api/crm/deals/search
      body: { filters: filters, search: search, sort: sort, page: page, size: size }

  - name: get_deal
    class: read
    description: One deal (name, status, amount, currency, company, closing date).
    input:
      type: object
      additionalProperties: false
      required: [deal_id]
      properties:
        deal_id: { type: string, minLength: 1, description: "dea-* id." }
    examples:
      - title: A deal
        input: { deal_id: dea-def456 }
    call: { method: GET, path: "/v2/api/crm/deals/{deal_id}" }

  - name: list_person_attributes
    class: read
    description: The custom fields of people, created or synced from a CRM integration.
    input:
      type: object
      additionalProperties: false
      properties:
        page: *page
        size: *size
    examples:
      - title: People's custom fields
        input: {}
    call: { method: GET, path: /v2/api/crm/attributes, query: { page: page, size: size } }

  - name: list_company_attributes
    class: read
    description: The custom attributes of companies.
    input:
      type: object
      additionalProperties: false
      properties:
        page: *page
        size: *size
    examples:
      - title: Companies' custom attributes
        input: {}
    call: { method: GET, path: /v2/api/crm/companies/attributes, query: { page: page, size: size } }

  - name: get_dialing_queue
    class: read
    description: >-
      The numbers of a Power Dialer queue by position, with the queue's name
      and settings: the key owner's queue, or a teammate's by user_id or email.
    input:
      type: object
      additionalProperties: false
      properties:
        user_id: &queue_user { type: string, minLength: 1, description: "A teammate whose queue to use." }
        email: &queue_email { type: string, format: email, personal: true, description: "A teammate's email, when no user_id." }
        page: *page
        size: *size
    examples:
      - title: My queue
        input: {}
    call:
      method: GET
      path: /v2/api/dialing-queues/current
      query: { user_id: user_id, email: email, page: page, size: size }

  - name: reset_dialing_queue
    class: write
    description: >-
      A fresh, empty Power Dialer queue for the key owner or a teammate; the
      previous queue is no longer the current one.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        user_id: *queue_user
        email: *queue_email
    examples:
      - title: A new queue for a campaign
        input: { name: October follow-ups }
    call:
      method: POST
      path: /v2/api/dialing-queues/current
      body: { name: name, user_id: user_id, email: email }

  - name: update_dialing_queue
    class: write
    description: >-
      The settings of the current queue, made if none: name, voicemail
      handling (SKIP or NO_SKIP), do not disturb while dialing.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        voicemail_handling: { type: string, enum: [SKIP, NO_SKIP] }
        do_not_disturb: { type: string, enum: [ENABLED, DISABLED] }
        user_id: *queue_user
        email: *queue_email
    examples:
      - title: Skip voicemails
        input: { voicemail_handling: SKIP }
    call:
      method: PATCH
      path: /v2/api/dialing-queues/current
      body: { name: name, voicemail_handling: voicemail_handling, do_not_disturb: do_not_disturb,
              user_id: user_id, email: email }

  - name: add_queue_numbers
    class: write
    description: >-
      Append numbers to the current Power Dialer queue, made if none exists;
      each entry a number (E.164) and optionally the contact's details. The
      answer lists the entries added and skipped.
    input:
      type: object
      additionalProperties: false
      required: [numbers]
      properties:
        numbers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [number]
            properties:
              number: { type: string, minLength: 1, personal: true }
              name: { type: string, personal: true }
              last_name: { type: string, personal: true }
              company: { type: string }
              website: { type: string }
              job_title: { type: string }
              emails: { type: array, items: { type: string, personal: true } }
              addresses: { type: array, items: { type: string, personal: true } }
        user_id: *queue_user
        email: *queue_email
    examples:
      - title: Two prospects to call
        input: { numbers: [{ number: "+33199000001", name: Marie, company: Acme }, { number: "+33199000002" }] }
    call:
      method: POST
      path: /v2/api/dialing-queues/current/numbers
      body: { numbers: numbers, user_id: user_id, email: email }

  - name: remove_queue_numbers
    class: write
    description: >-
      Remove entries from the current queue: by number (every occurrence), by
      position (0-based), both (one occurrence), or unassigned=true (every
      entry not yet called).
    input:
      type: object
      additionalProperties: false
      properties:
        number: { type: string, minLength: 1, personal: true }
        position: { type: integer, minimum: 0 }
        unassigned: { type: boolean }
        user_id: *queue_user
        email: *queue_email
    examples:
      - title: Clear what was not called
        input: { unassigned: true }
    call:
      method: DELETE
      path: /v2/api/dialing-queues/current/numbers
      query: { number: number, position: position, unassigned: unassigned, user_id: user_id, email: email }

  - name: get_team_metrics
    class: read
    description: >-
      Team KPIs over a date range (total calls, talk time, calls over a
      minute, answer rate), against compare_date, with a per-member breakdown;
      inbound and outbound.
    input:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date: *date
        compare_date: *date
        user_ids: &user_ids { type: array, items: { type: string } }
        allo_numbers: &allo_numbers { type: array, items: { type: string } }
    examples:
      - title: Last week against the week before
        input: { date: { from: "2026-10-12", to: "2026-10-18" }, compare_date: { from: "2026-10-05", to: "2026-10-11" } }
    call:
      method: POST
      path: /v2/api/analytics/overview
      body: { date: date, compare_date: compare_date, user_ids: user_ids, allo_numbers: allo_numbers }

  - name: get_outbound_metrics
    class: read
    description: >-
      The outbound funnel over a date range (dials, connected, conversations,
      conversions: a conversion is a call carrying one of tags), its time
      series by granularity, heatmap, leaderboard and time spent.
      extend=items with a stage lists the calls behind that stage, paged.
    input:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date: *date
        compare_date: *date
        user_ids: *user_ids
        allo_numbers: *allo_numbers
        tags: { type: array, items: { type: string } }
        granularity: { type: string, enum: [DAY, WEEK, MONTH] }
        extend: { type: string, enum: [items] }
        stage: { type: string, enum: [DIAL, CONNECTED, CONVERSATION, CONVERSION] }
        page: *page
        size: *size
    examples:
      - title: This month's funnel, meetings as conversions
        input: { date: { from: "2026-10-01", to: "2026-10-20" }, tags: [meeting_booked], granularity: WEEK }
    call:
      method: POST
      path: /v2/api/analytics/outbound
      body: { date: date, compare_date: compare_date, user_ids: user_ids, allo_numbers: allo_numbers,
              tags: tags, granularity: granularity, extend: extend, stage: stage, page: page, size: size }

  - name: send_sms
    class: sensitive
    description: >-
      Send a text message now: from one of the team's numbers (from_number,
      recipient in the same country), or from a Sender ID verified by Allo
      (sender_id, France). Give exactly one of the two. Billed per segment:
      160 characters (153 once split), or 70 (67) as soon as one character is
      outside the standard SMS alphabet (ç, ê, â, a curly quote, an emoji).
    input:
      type: object
      additionalProperties: false
      required: [to, message]
      properties:
        to: { type: string, minLength: 1, personal: true, description: "Recipient, E.164." }
        message: { type: string, minLength: 1, maxLength: 1000 }
        from_number: { type: string, minLength: 1, description: "One of the team's numbers, E.164." }
        sender_id: { type: string, minLength: 1, description: "A Sender ID verified by Allo." }
      oneOf:
        - { required: [from_number] }
        - { required: [sender_id] }
    examples:
      - title: A text from a US line
        input: { from_number: "+14155550100", to: "+14155550123", message: "Thanks for your time today!" }
      - title: A text from a French Sender ID
        input: { sender_id: MyCompany, to: "+33199000001", message: "Merci pour votre temps aujourd'hui." }
    call:
      method: POST
      path: /v1/api/sms
      body: { from: from_number, sender_id: sender_id, to: to, message: message }
    # Allo bills a text per segment (help.withallo.com/en/billing/sms-rates, read 2026-10-22): up to 15 for the 1000
    # characters the API takes. The answer does not say how many segments were sent, so nothing settles the real
    # quantity: a quantity of 15 would settle every text at its worst case. One request is what this file can state;
    # a quantity computed from an argument (the segments of a text) is a question of the format.
    cost: { per: request }
    confirm:
      summary: "Send a text to {to} now: it cannot be recalled."
