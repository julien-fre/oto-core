      query: { filterId: filter_id, query: query }
    cost: *request

  - name: get_watch_list_library
    class: read
    description: The library of ready-made watch lists.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The library
        input: {}
    call: { method: GET, path: /watchlist/library }
    cost: *request

  - name: get_watch_list_history
    class: read
    description: The history of a watch list.
    input:
      type: object
      additionalProperties: false
      required: [watch_list_id]
      properties:
        watch_list_id: *watch_list_id
        page: *page
        limit: *limit
    examples:
      - title: A list's history
        input: { watch_list_id: wl_example1 }
    call:
      method: GET
      path: /watchlist/history
      query: { watchListId: watch_list_id, page: page, limit: limit }
    cost: *request

  - name: get_signals
    class: read
    description: The signals caught by the watch lists, filtered by type, status, list and reception dates.
    input:
      type: object
      additionalProperties: false
      properties:
        page: *page
        limit: *limit
        sort_by: { type: string, minLength: 1 }
        sort_order: *sort_order
        type: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        received_at_from: *date
        received_at_to: *date
        watch_list_id: *watch_list_id
    examples:
      - title: Signals of one list
        input: { watch_list_id: wl_example1, limit: 50 }
    call:
      method: GET
      path: /watchlist/signals
      query:
        page: page
        limit: limit
        sortBy: sort_by
        sortOrder: sort_order
        type: type
        status: status
        receivedAtFrom: received_at_from
        receivedAtTo: received_at_to
        watchListId: watch_list_id
    cost: *request

  - name: push_external_signals
    class: sensitive
    description: >-
      Push a signal detected outside lemlist into a watch list: contact
      needs linkedinUrl, company needs domain and name. A list set to
      push_to_campaign pushes the person into its campaign.
    input:
      type: object
      additionalProperties: false
      required: [watch_list_id, contact, company]
      properties:
        watch_list_id: *watch_list_id
        contact:
          type: object
          required: [linkedinUrl]
          properties: { linkedinUrl: *linkedin_url }
        company:
          type: object
          required: [domain, name]
          properties: { domain: { type: string, minLength: 1 }, name: { type: string, minLength: 1 } }
        custom_fields: { type: object }
    examples:
      - title: A signal on one person
        input: { watch_list_id: wl_example1, contact: { linkedinUrl: "https://www.example.test/in/marie" }, company: { domain: example.test, name: Example } }
    confirm:
      summary: "Push an external signal into lemlist watch list {watch_list_id}."
    call:
      method: POST
      path: "/watchlist/{watch_list_id}/external-signals"
      body: { contact: contact, company: company, customFields: custom_fields }
    cost: *request

