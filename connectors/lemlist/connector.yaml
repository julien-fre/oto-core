  - name: get_lemwarm_settings
    class: read
    description: The lemwarm (deliverability warm-up) settings of a mailbox.
    input:
      type: object
      additionalProperties: false
      required: [user_mailbox_id]
      properties:
        user_mailbox_id: &mailbox_id { type: string, minLength: 1 }
    examples:
      - title: Warm-up settings
        input: { user_mailbox_id: mbx_example1 }
    call: { method: GET, path: "/lemwarm/{user_mailbox_id}/settings" }
    cost: *request

  - name: update_lemwarm_settings
    class: write
    description: >-
      Change the lemwarm settings of a mailbox: only the keys given in data
      change, one at least.
    input:
      type: object
      additionalProperties: false
      required: [user_mailbox_id, data]
      properties:
        user_mailbox_id: *mailbox_id
        data:
          type: object
          additionalProperties: false
          minProperties: 1
          description: "The settings to change, under lemlist's names."
          properties:
            warmEmailMax: { type: integer, minimum: 0, maximum: 40, description: "Warm-up emails a day at most (lemlist enforces 1 to 40 for most teams)." }
            warmEmailRampup: { type: integer, minimum: 0, maximum: 40, description: "Daily increase of the warm-up emails (lemlist enforces 1 to 40 for most teams)." }
            internalCommunicationPercent: { type: integer, minimum: 0, maximum: 100, description: "Share of warm-up emails sent inside the team, in percent." }
            answerPercentage: { type: integer, minimum: 0, maximum: 100, description: "Share of warm-up emails answered, in percent." }
            warmUsePlaintext: { type: boolean, description: "Warm-up emails in plain text." }
            warmDailyVarianceEnabled: { type: boolean, description: "A random daily variance on the warm-up target." }
    examples:
      - title: Thirty emails a day, five more each day
        input: { user_mailbox_id: mbx_example1, data: { warmEmailMax: 30, warmEmailRampup: 5 } }
    call:
      method: PATCH
      path: "/lemwarm/{user_mailbox_id}/settings"
      body: data
    cost: *request

  - name: start_lemwarm
    class: write
    description: >-
      Start warming a mailbox: it sends mail inside the lemwarm network of
      other lemlist mailboxes, never to a prospect.
    input:
      type: object
      additionalProperties: false
      required: [user_mailbox_id]
