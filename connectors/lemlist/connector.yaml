  - name: create_deliverability_alert
    class: write
    description: >-
      Create a deliverability alert on a warm-up or outreach metric, over a
      period, for the whole team, a mailbox or a domain. Without
      channel_config the alert is in-app only; its email channel needs at
      least one address.
    input:
      type: object
      additionalProperties: false
      required: [widget, metric, severity, scope, threshold, comparison_operator, period_days, period_mode]
      properties:
        widget: { type: string, enum: [warmup, outreach] }
        metric: { type: string, enum: [inboxRate, spamRate, score, deliveryRate, bounceRate] }
        severity: { type: string, enum: [warning, critical] }
        scope: { type: string, enum: [global, mailbox, domain] }
        threshold: { type: number }
        comparison_operator: { type: string, enum: [equal, below, above] }
        period_days: { type: integer, minimum: 1 }
        period_mode: { type: string, enum: [rolling, consecutive] }
        scope_entities: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        channel_config: { type: object }
        recheck_delay_hours: { type: integer, minimum: 1 }
    examples:
      - title: Spam rate above 5 % over 3 days
        input: { widget: outreach, metric: spamRate, severity: critical, scope: global, threshold: 5, comparison_operator: above, period_days: 3, period_mode: rolling }
    call:
      method: POST
      path: /deliverability/alerts
      body:
        widget: widget
        metric: metric
        severity: severity
        scope: scope
        threshold: threshold
        comparisonOperator: comparison_operator
        periodDays: period_days
        periodMode: period_mode
        scopeEntities: scope_entities
        channelConfig: channel_config
        recheckDelayHours: recheck_delay_hours
    cost: *request

  - name: update_deliverability_alert
    class: write
    description: >-
      Change a deliverability alert: only the keys given in data change. Its
      widget, metric, severity and scope do not change: create another
      alert for that.
    input:
      type: object
      additionalProperties: false
      required: [alert_id, data]
      properties:
        alert_id: *alert_id
        data:
          type: object
          additionalProperties: false
          description: "The keys to change, under lemlist's names."
          properties:
            threshold: { type: number, minimum: 0, maximum: 100 }
            comparisonOperator: { type: string, enum: [equal, below, above] }
            periodDays: { type: integer, minimum: 1, maximum: 30 }
            periodMode: { type: string, enum: [rolling, consecutive] }
            channelConfig:
              type: object
              additionalProperties: false
              description: "The channels notified when the alert fires; one at least enabled."
              properties:
                email:
                  type: object
                  additionalProperties: false
                  properties:
                    enabled: { type: boolean }
                    addresses: { type: array, items: { type: string, minLength: 3, personal: true }, description: "Required when email is enabled, one at least." }
                inapp: { type: object, additionalProperties: false, properties: { enabled: { type: boolean } } }
                webhook: { type: object, additionalProperties: false, properties: { enabled: { type: boolean, description: "Needs a webhook subscribed to deliverabilityAlertTriggered." } } }
                slack: { type: object, additionalProperties: false, properties: { enabled: { type: boolean, description: "Needs Slack connected to the team." } } }
            scopeEntities: { type: array, items: { type: string, minLength: 1 }, description: "The mailboxes or domains, for an alert scoped to them." }
            enabled: { type: boolean, description: "Pause or resume the alert." }
    examples:
      - title: A threshold of 7, in the app
        input: { alert_id: alr_example1, data: { threshold: 7, channelConfig: { inapp: { enabled: true } } } }
      - title: Pause an alert
        input: { alert_id: alr_example1, data: { enabled: false } }
    call:
      method: PATCH
      path: "/deliverability/alerts/{alert_id}"
      body: data
    cost: *request

  - name: delete_deliverability_alert
    class: sensitive
    description: Delete a deliverability alert.
    input:
      type: object
      additionalProperties: false
      required: [alert_id]
      properties:
        alert_id: *alert_id
    examples:
      - title: Delete an alert
        input: { alert_id: alr_example1 }
    confirm:
      summary: "Delete lemlist deliverability alert {alert_id}."
    call: { method: DELETE, path: "/deliverability/alerts/{alert_id}" }
    cost: *request

  # --- Webhooks ------------------------------------------------------------------------

  - name: list_webhooks
    class: read
    description: List the team's webhooks.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The webhooks
        input: {}
    call: { method: GET, path: /hooks }
    cost: *request

  - name: add_webhook
    class: sensitive
    description: >-
      Subscribe an address to lemlist events: lemlist then posts every
      matching event (replies, opens, LinkedIn acceptances, signals…) with
      lead data to it. type is one event name; without it, all events.
      campaign_id narrows to one campaign, is_first to the first occurrence
      per lead.
    input:
      type: object
      additionalProperties: false
      required: [target_url]
      properties:
        target_url: { type: string, pattern: "^https://", description: "Address lemlist posts the events to." }
        type: { type: string, minLength: 1, description: "One event name: emailsReplied, linkedinInviteAccepted…" }
        secret: { type: string, minLength: 1, description: "Secret lemlist signs the events with." }
        campaign_id: *campaign_id
        is_first: { type: boolean }
        zap_id: { type: string, minLength: 1 }
    examples:
      - title: Replies of one campaign
        input: { target_url: "https://hooks.example.test/lemlist", type: emailsReplied, campaign_id: cam_example1 }
    confirm:
      summary: "Send lemlist events to {target_url}."
    call:
      method: POST
      path: /hooks
      query: { campaignId: campaign_id, isFirst: is_first, zapId: zap_id }
      body: { targetUrl: target_url, type: type, secret: secret }
    cost: *request

  - name: delete_webhook
    class: sensitive
    description: Unsubscribe a webhook.
    input:
      type: object
      additionalProperties: false
      required: [hook_id]
      properties:
        hook_id: { type: string, minLength: 1 }
    examples:
      - title: Delete a webhook
        input: { hook_id: hok_example1 }
    confirm:
      summary: "Delete lemlist webhook {hook_id}."
    call: { method: DELETE, path: "/hooks/{hook_id}" }
    cost: *request
