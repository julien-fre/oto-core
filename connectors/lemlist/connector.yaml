# yaml-language-server: $schema=../connector.schema.json
# lemlist API (https://developer.lemlist.com). The values come from the Python client, oto.tools.lemlist, which this
# description follows: one request per method to api.lemlist.com under /api, the API key as the password of HTTP
# Basic authentication with an empty user name (lemlist's own convention: "the login is always empty"), JSON bodies.
# The function names, the argument names and the keys sent to lemlist are the client's; the client is not changed
# (tests/test_lemlist_description.py reads it to keep both equal).
#
# A CONTACT is not a LEAD: the lead is a person's copy inside a campaign (its sending state, its variables), the
# contact is the person in the lemlist CRM, campaign-independent.
#
# Read and act. Reads stay on the read side, the stats and database searches served in POST included. Every call
# that changes something is served on the act side (class write): pausing a campaign or a lead, creating a campaign,
# a schedule, a list, a label, a task, a persona, an alert, enriching (it spends lemlist credits). A draft, written or
# changed, is a write that stays on the read side (act false): it sends nothing. Ask for a confirmation (class sensitive) the calls that
# send or start sending to a real person (start_campaign, launch_lead, resume_lead, the three inbox sends, picking an
# A/B winner, creating an A/B variant), import leads into a campaign (an auto-review campaign launches them), push a
# signal into a watch list or create one (a watch list can push people into a campaign on its own), unsubscribe or
# resubscribe anything, delete anything, subscribe a webhook (lemlist posts its events to an address of the caller's)
# and have an export emailed to an address. Adding a step to a sequence or changing one is sensitive too: the leads of
# a running campaign receive it, and an api step has lemlist call an address of the caller's for each lead.
#
# Whole bodies (format rule 20, call.body naming one argument): nine methods send a dict argument as the whole JSON
# body, as is: update_campaign, add_step, update_step, update_ab_variant, update_schedule, update_lead, update_draft,
# update_lemwarm_settings, update_deliverability_alert. The argument is a strict object whose keys are lemlist's
# (developer.lemlist.com, OpenAPI v2, read on 2026-10-22) and the client's docstrings. Where the client checks a
# vocabulary locally, the schema takes the client's: the step types and the condition keys of add_step and update_step
# (lemlist also documents a linkedinInMail step and a customLeadInfo condition, which the client refuses, and the
# customField, customOperator and customValue keys that go with that condition), the HH:mm hours, weekdays 1 to 7 and
# IANA time zone of update_schedule. update_campaign leaves out autoReview and autoReviewConditions, as create_campaign
# does: they turn adding a lead into a send.
#
# A campaign created by the API is born running, not as a draft (measured by the client on 2026-08-31): nothing
# sends until a sender, a step and a launched lead exist, and pause_campaign right after creating it keeps it quiet.
#
# Values the client sets and lemlist requires, here required in the input (the host sends only what the call gives):
# the sending window of create_schedule (timezone, start, end, weekdays; the client fills Europe/Paris, 09:00, 18:00,
# Monday to Friday), the four fields of create_watch_list that lemlist requires though its reference says optional
# (filters, segment_type, signal_processing_type, activate; the client fills [], all, manual, false), the filters of
# list_tasks (the client sends [] when none: without them lemlist answers 400 "Malformed filters"), the variant of
# delete_ab_variant (the client sends B) and append of attach_inbox_labels (the client sends true), and the state of
# export_campaign_leads (the client sends all: without it lemlist filters every lead out, an empty list read as "no
# leads"). Constants: version v2 on list_campaigns and get_activities, as the client always sends it; format json on
# export_campaign_leads (the CSV form is an export, left out). get_activities: the client sends limit 100 and offset
# 0 when the call omits them, which are not declared as defaults.
#
# Query flags: the enrichment flags and force of delete_company go only when true, as the client sends them (const
# true). The other booleans in the query (not_in_any_campaign, is_first) are written true or false, by the host as by
# the client.
#
# Lists in the query are joined by commas (idsOrEmails, idsOrDomains, fields, campaignIds), as the client joins them.
# The stats channels and the task filters go as a JSON array in one query parameter (encode: json).
#
# Rate: 20 requests per 2 seconds for each API key, on all routes (lemlist reference, "Rate limits", read on
# 2026-10-21); the client spaces two requests by 100 ms, the same pace. Every call costs one request: enrichment
# spends lemlist credits, by action, which the client does not price.
#
# Errors: the client recognizes none (every status above 400 raises the same error, the service named), and oto 1
# none either. One exception: the 401 marks the account credential_rejected. Since the client names no refusal at
# all, marking the 401 is no broader than the client; and a 401 from lemlist means the key was refused. Nothing else
# marks the account. A 5xx is not retryable: a send or a launch may have gone through.
#
# Not described here, left to the hand-written client:
# - bodies with free top-level keys: create_lead (any key besides lemlist's fields is a custom variable of the lead,
#   which is how lemlist personalizes a message), upsert_contact and upsert_company (any other key is a custom field of
#   the CRM): rule 20 takes a strict object only, and the fixed fields alone would drop what the client sends;
# - bodies made from an argument: update_task and update_watch_list (the id added to the dict), add_lead (the email
#   taken out of the dict into the path);
# - a bare array as body: bulk_enrich;
# - query parameters with free keys (the lead variables): add_lead_variables, update_lead_variables,
#   delete_lead_variables;
# - compositions and local helpers: list_all_campaigns, get_campaign_tree, save_campaign_tree, load_campaign_tree,
#   sync_campaign, find_step, get_first_email, get_emails, print_tree, get_sequence_steps, get_all_leads,
#   get_campaign_stats, sync_activities, status, unsubscribe_lead (delete_lead without action);
# - a route chosen by an argument: mark_lead_interested and mark_lead_not_interested (one campaign, or all);
# - get_enrichment: a 404 is an answer (enrichmentStatus not-found), not an error;
# - CSV exports: export_leads, export_unsubscribes, export_unsubscribed_variables, export_unsubscribed_contacts,
#   export_contact_list (a rendered file in a later lot);
# - connect_email_account: the SMTP and IMAP passwords of a mailbox would be arguments, which the host journals;
# - the arguments: sort_order of list_campaigns and list_schedules (the client adds sortBy=createdAt with it),
#   auto_review and auto_review_conditions of create_campaign (they turn adding a lead into a send; oto 1 serves
#   them apart), webhook_url of enrich and enrich_lead (lemlist posts the result to an address of the caller's),
#   mark_as_read of get_contact_messages (it writes on a read), filename of upload_lead_audio (the host names the
#   part after the transit file).
# Pagination is by offset or page, without a next cursor in most answers: none is declared, the agent passes the
# page.
connector:
  name: lemlist
  label: lemlist
  namespace: lemlist
  version: 1.1.0
  api_version: v1 and v2 routes
  base_url: https://api.lemlist.com/api
  auth:
    kind: basic
    password: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  # Each team brings its own key: campaigns, leads and the inbox act on the team behind the key.
  modes: [byo_user, byo_org]
  # The client waits 60 s for an answer (10 s to connect).
  timeout_s: 60
  query_arrays: comma
  rate_limit: { requests: 20, seconds: 2 }
  probe: { function: list_campaigns }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "lemlist rejected the request: its message says why (a campaign already running, a lead already launched, a malformed field)." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "lemlist refused the API key: unknown or revoked." }
    - { status: 403, code: forbidden, retryable: false,
        message: "lemlist refused this call for this key: the plan or the user's rights do not include it." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in lemlist: wrong id, or not in this team." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "lemlist rate limit reached (20 requests per 2 seconds per key): wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: false,
        message: "lemlist failed. A read can be retried; a send, a launch or a write may have been applied: read it back before acting again." }

functions:
  # --- Campaigns ---------------------------------------------------------------

  - name: list_campaigns
    class: read
    description: >-
      List one page of the team's campaigns (at most 100): id, name, status,
      senders, labels, timezone, creation, errors, with a pagination object
      (nextPage). A campaign can hold several statuses at once (paused with
      errors): status filters, it does not partition. Pass page for the next
      page.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: &limit_100 { type: integer, minimum: 1, maximum: 100, description: "Page size, at most 100." }
        offset: &offset { type: integer, minimum: 0, description: "Records to skip." }
        page: &page { type: integer, minimum: 1, description: "Page number, from 1." }
        status: { type: string, enum: [running, draft, archived, ended, paused, errors] }
        created_by: &user_id { type: string, minLength: 1, description: "User id (usr_…)." }
    examples:
      - title: The running campaigns
        input: { status: running, limit: 100 }
      - title: The second page
        input: { page: 2 }
    call:
      method: GET
      path: /campaigns
      query: { limit: limit, offset: offset, page: page, status: status, createdBy: created_by }
      constants: { query: { version: v2 } }
    cost: &request { per: request }

  - name: get_campaign
    class: read
    description: >-
      Get one campaign: settings, senders, sequenceId and scheduleIds, the
      status shown in the app.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: &campaign_id { type: string, minLength: 1, description: "Campaign id (cam_…)." }
    examples:
      - title: One campaign
        input: { campaign_id: cam_example1 }
    call: { method: GET, path: "/campaigns/{campaign_id}" }
    cost: *request

  - name: create_campaign
    class: write
    description: >-
      Create a campaign, with an empty sequence and a default schedule; the
      answer gives sequenceId and scheduleIds. A campaign created by the API
      is born running, not as a draft: it sends nothing until it has a
      sender, a step and a launched lead. Call pause_campaign right after to
      build it quietly.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: "Campaign name." }
        timezone: &timezone { type: string, pattern: "^([A-Za-z_]+(/[A-Za-z0-9_+-]+)+|UTC)$", description: "IANA time zone: Europe/Paris." }
    examples:
      - title: A campaign in Paris time
        input: { name: Q4 outreach, timezone: Europe/Paris }
    call:
      method: POST
      path: /campaigns
      body: { name: name, timezone: timezone }
    cost: *request

  - name: start_campaign
    class: sensitive
    description: >-
      Start, in practice resume, a paused campaign: from here lemlist walks
      the sequence and sends to every launched lead. A campaign created by
      the API is already running: lemlist answers 400 "already running".
      Read get_campaign_statutes first: a level 3 statute blocks the launch.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - title: Resume a campaign
        input: { campaign_id: cam_example1 }
    confirm:
      summary: "Start lemlist campaign {campaign_id}: it sends to every launched lead."
    call: { method: POST, path: "/campaigns/{campaign_id}/start" }
    cost: *request

  - name: pause_campaign
    class: write
    description: >-
      Pause a running campaign: it stops advancing; already scheduled
      messages are not recalled. This is the switch that decides whether a
      campaign can send. A campaign that is not running gets 400.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - title: Pause a campaign
        input: { campaign_id: cam_example1 }
    call: { method: POST, path: "/campaigns/{campaign_id}/pause" }
    cost: *request

  - name: duplicate_campaign
    class: write
    description: >-
      Copy a campaign, sequence steps, schedules and AI templates included;
      the copy is paused, without leads. Without name, lemlist appends
      " Copy" to the original name.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
        name: { type: string, minLength: 1, description: "Name of the copy." }
    examples:
      - title: Copy a campaign
        input: { campaign_id: cam_example1, name: Q4 outreach (B) }
    call:
      method: POST
      path: "/campaigns/{campaign_id}/duplicate"
      body: { name: name }
    cost: *request

  - name: update_campaign
    class: write
    description: >-
      Change the settings of a campaign: only the keys given in data change.
      Its name, its senders (sendUserIds replaces the sender pool), the stop
      rules, the tracking, the AI handling of replies, and what happens to a
      lead on a reply, a click or a booked meeting. Auto-review is not set
      here: it turns adding a lead into a send.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, data]
      properties:
        campaign_id: *campaign_id
        data:
          type: object
          additionalProperties: false
          description: "The settings to change, under lemlist's names; the keys left out keep their value."
          properties:
            name: { type: string, minLength: 1, description: "Campaign name." }
            sendUserIds:
              type: array
              items: *user_id
              description: >-
                The senders (usr_…), replacing the sender pool. Refused on a
                campaign whose sender is chosen per lead (contact owner, lead
                importer, custom field); every channel the sequence reaches
                needs a sender that can use it.
            stopOnEmailReplied: { type: boolean, description: "Stop the campaign for a lead who replies by email." }
            stopOnMeetingBooked: { type: boolean, description: "Stop the campaign for a lead who books a meeting." }
            stopOnLinkClicked: { type: boolean, description: "Stop the campaign for a lead who clicks a link." }
            stopOnLinkClickedFilter: { type: string, description: "Which link clicks stop the campaign." }
            leadsPausedByInterest: { type: boolean, description: "Pause leads by their interest." }
            opportunityReplied: { type: boolean, description: "Create an opportunity when a lead replies." }
            opportunityClicked: { type: boolean, description: "Create an opportunity when a lead clicks a link." }
            autoLeadInterest: { type: boolean, description: "Detect lead interest automatically." }
            disableTrackOpen: { type: boolean, description: "Do not track email opens." }
            disableTrackClick: { type: boolean, description: "Do not track link clicks." }
            disableTrackReply: { type: boolean, description: "Do not track email replies." }
            disableOutOfOffice: { type: boolean, description: "Do not detect out-of-office answers." }
            sequenceSharing: { type: boolean, description: "Share the sequence." }
            aiFeatures:
              type: object
              additionalProperties: false
              description: "AI handling of replies; the flags left out keep their value."
              properties:
                scoreReplies: { type: boolean, description: "Score the replies." }
                onInterestedReply: &reply_action
                  type: object
                  additionalProperties: false
                  properties:
                    enabled: { type: boolean }
                    pauseAllCampaignsForLead: { type: boolean, description: "Pause every campaign of the lead." }
                    pauseCampaignForCompany: { type: boolean, description: "Pause this campaign for the other leads of the company." }
                    pauseAllCampaignsForCompany: { type: boolean, description: "Pause every campaign for the leads of the company." }
                onNotInterestedReply: *reply_action
            tracking:
              type: object
              additionalProperties: false
              properties:
                trackOpens: { type: boolean }
                trackClicks: { type: boolean }
                trackReplies: { type: boolean }
            onReplied:
              type: object
              additionalProperties: false
              description: "What happens when a lead replies."
              properties:
                createNewTask: { type: boolean }
                campaignProgress: &campaign_progress { type: string, enum: [continue, pause, stop], description: "What happens to the lead in the campaign." }
                propagateProgressToCompany: { type: boolean, description: "The same for the other leads of the company." }
                disableOutOfOffice: { type: boolean }
            onLinkClicked:
              type: object
              additionalProperties: false
              description: "What happens when a lead clicks a tracked link."
              properties:
                createNewTask: { type: boolean }
                campaignProgress: *campaign_progress
                propagateProgressToCompany: { type: boolean, description: "The same for the other leads of the company." }
                specificLinks: { type: array, items: { type: string }, description: "Only these links trigger it; empty, every link." }
            onMeetingBooked:
              type: object
              additionalProperties: false
              description: "What happens when a lead books a meeting."
              properties:
                campaignProgress: *campaign_progress
                propagateProgressToCompany: { type: boolean, description: "The same for the other leads of the company." }
    examples:
      - title: Rename a campaign
        input: { campaign_id: cam_example1, data: { name: Q4 outreach (FR) } }
      - title: Stop on a reply, two senders
        input: { campaign_id: cam_example1, data: { stopOnEmailReplied: true, sendUserIds: [usr_example1, usr_example2] } }
      - title: Pause the lead and create a task on a reply
        input: { campaign_id: cam_example1, data: { onReplied: { campaignProgress: pause, createNewTask: true } } }
    call:
      method: PATCH
      path: "/campaigns/{campaign_id}"
      body: data
    cost: *request

  - name: get_campaign_statutes
    class: read
    description: >-
      The validation statutes of a campaign, from the engine of the lemlist
      app: {name, status, statutes: [{type, level, message, category}]}.
      Level 3 blocks a launch (no sender, broken DNS), 2 is a warning, 1 is
      information. Read it before start_campaign.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - title: What blocks a campaign
        input: { campaign_id: cam_example1 }
    call: { method: GET, path: "/campaigns/{campaign_id}/statutes" }
    cost: *request

  # --- Sequences and A/B tests -------------------------------------------------

  - name: get_sequences
    class: read
    description: >-
      The sequences of a campaign: a map from sequence id to its level and
      steps (type, delay, subject and message of an email, branches of a
      conditional step).
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - title: The steps of a campaign
        input: { campaign_id: cam_example1 }
    call: { method: GET, path: "/campaigns/{campaign_id}/sequences" }
    cost: *request

  - name: delete_step
    class: sensitive
    description: >-
      Delete a step from a sequence. lemlist refuses it (400) while the
      campaign is running: pause it first.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id]
      properties:
        sequence_id: &sequence_id { type: string, minLength: 1, description: "Sequence id (seq_…)." }
        step_id: &step_id { type: string, minLength: 1, description: "Step id (stp_…)." }
    examples:
      - title: Delete a step
        input: { sequence_id: seq_example1, step_id: stp_example1 }
    confirm:
      summary: "Delete step {step_id} of lemlist sequence {sequence_id}."
    call: { method: DELETE, path: "/sequences/{sequence_id}/steps/{step_id}" }
    cost: *request

  - name: add_step
    class: sensitive
    description: >-
      Add a step, or a condition, to a sequence (get_sequences gives the
      sequence id). type is required; the other keys depend on it: subject
      and message for an email, message for a LinkedIn message, WhatsApp or
      SMS, title for a manual task, method and url for an api step (lemlist
      calls that address for each lead), conditionKey and delayType for a
      condition, campaignId for a move to another campaign. On a campaign
      leads have entered, the new step reaches them: it sends to real people.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step]
      properties:
        sequence_id: *sequence_id
        step:
          type: object
          additionalProperties: false
          required: [type]
          description: "The step, under lemlist's names."
          properties:
            type: &step_type
              type: string
              enum: [email, manual, phone, api, linkedinVisit, linkedinInvite, linkedinSend, linkedinVoiceNote,
                     linkedinFollow, linkedinLikeLastPost, linkedinCommentLastPost, linkedinEndorse,
                     linkedinWithdrawInvitation, sendToAnotherCampaign, conditional, whatsappMessage, sms]
              description: "The kind of step; on an update, it must be the step's own kind."
            index: { type: integer, minimum: -1, description: "Position in the sequence; left out or past the end, the step is added last." }
            delay: &step_delay { type: integer, description: "Days before the step (lemlist: 0 for the first step, 1 after)." }
            subject: &step_subject { type: string, description: "Email subject; empty on a follow-up, the email replies in the thread of the previous one." }
            message: &step_message { type: string, description: "The content: email body (HTML), LinkedIn, WhatsApp or SMS message, manual or phone task notes." }
            altMessage: &step_alt_message { type: string, description: "The LinkedIn note sent instead of message: the premium invitation note (linkedinInvite), the note to a lead out of the network (linkedinSend, linkedinVoiceNote)." }
            altMessagePremium: &step_alt_premium { type: string, description: "linkedinSend only: the out-of-network note for a Premium or Sales Navigator account." }
            title: &step_title { type: string, description: "Title of a manual task." }
            method: &step_method { type: string, enum: [GET, POST, PUT, DELETE, PATCH], description: "HTTP method of an api step." }
            url: &step_url { type: string, description: "Address an api step calls, http:// or https://." }
            conditionKey: &step_condition_key
              type: string
              enum: [hasEmailAddress, hasLinkedinUrl, hasPhoneNumber, hasScore, emailsOpened, emailsClicked,
                     emailsUnsubscribed, meetingBooked, linkedinInviteAccepted, linkedinOpened, aircallDone,
                     linkedinNetworkCheck, hasWhatsappAccount]
              description: "What a conditional step tests."
            delayType: &step_delay_type { type: string, enum: [within, waitUntil], description: "How a conditional step waits." }
            campaignId: &step_campaign_id { type: string, minLength: 1, description: "sendToAnotherCampaign: the campaign the lead moves to (cam_…), not archived." }
            leadAction: &step_lead_action { type: string, enum: [continue, pause, stop], description: "sendToAnotherCampaign: what happens to the lead in this campaign once moved." }
            images: &step_images { type: array, items: { type: string, format: uri }, description: "linkedinInvite or linkedinSend: public HTTPS addresses of images lemlist downloads and hosts (png, jpeg, gif)." }
            videos: &step_videos { type: array, items: { type: string, format: uri }, description: "linkedinInvite or linkedinSend: public HTTPS addresses of videos lemlist downloads and hosts (mp4, mov)." }
            skillName: &step_skill_name { type: string, description: "linkedinEndorse: the skill endorsed on the lead's profile." }
            endorseAnyFallback: &step_endorse_any { type: boolean, description: "linkedinEndorse: endorse any skill when the named one is missing." }
            recordMode: &step_record_mode { type: string, enum: [manual, ai], description: "linkedinVoiceNote: recorded by a person in the lemlist app, or generated by lemlist." }
    examples:
      - title: A follow-up email two days later
        input: { sequence_id: seq_example1, step: { type: email, subject: "", message: "<p>Hello {{firstName}},</p>", delay: 2 } }
      - title: A condition on an accepted invitation
        input: { sequence_id: seq_example1, step: { type: conditional, conditionKey: linkedinInviteAccepted, delayType: waitUntil, delay: 1 } }
    confirm:
      summary: "Add a step to lemlist sequence {sequence_id}: the leads of a running campaign reach it."
    call:
      method: POST
      path: "/sequences/{sequence_id}/steps"
      body: step
    cost: *request

  - name: update_step
    class: sensitive
    description: >-
      Change a step of a sequence: only the keys given in data change. type
      is required and must be the step's own kind: it says the step's shape,
      it does not convert it. images and videos replace what the step
      carries ([] clears them). It changes what the leads going through the
      step receive, and where an api step calls.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id, data]
      properties:
        sequence_id: *sequence_id
        step_id: *step_id
        data:
          type: object
          additionalProperties: false
          required: [type]
          description: "The keys to change, under lemlist's names, with the step's type."
          properties:
            type: *step_type
            delay: *step_delay
            subject: *step_subject
            message: *step_message
            altMessage: *step_alt_message
            altMessagePremium: *step_alt_premium
            title: *step_title
            method: *step_method
            url: *step_url
            conditionKey: *step_condition_key
            delayType: *step_delay_type
            campaignId: *step_campaign_id
            leadAction: *step_lead_action
            images: *step_images
            videos: *step_videos
            skillName: *step_skill_name
            endorseAnyFallback: *step_endorse_any
            recordMode: *step_record_mode
    examples:
      - title: A new subject for an email step
        input: { sequence_id: seq_example1, step_id: stp_example1, data: { type: email, subject: "Next week, {{firstName}}?" } }
      - title: Clear the images of a LinkedIn message
        input: { sequence_id: seq_example1, step_id: stp_example1, data: { type: linkedinSend, images: [] } }
    confirm:
      summary: "Change step {step_id} of lemlist sequence {sequence_id}: the leads going through it receive the new version."
    call:
      method: PATCH
      path: "/sequences/{sequence_id}/steps/{step_id}"
      body: data
    cost: *request

  - name: create_ab_variant
    class: sensitive
    description: >-
      Create variant B of an email step, prefilled from A, and start the A/B
      split: from here the leads going through the step are shared between A
      and B. Email Pro plan.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id]
      properties:
        sequence_id: *sequence_id
        step_id: *step_id
    examples:
      - title: Start an A/B test
        input: { sequence_id: seq_example1, step_id: stp_example1 }
    confirm:
      summary: "Start an A/B test on step {step_id}: variant B is sent to part of the leads."
    call: { method: POST, path: "/sequences/{sequence_id}/steps/{step_id}/ab-test" }
    cost: *request

  - name: get_ab_variant
    class: read
    description: Read variant B (subject, message, settings) of an email step's A/B test.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id]
      properties:
        sequence_id: *sequence_id
        step_id: *step_id
    examples:
      - title: Variant B of a step
        input: { sequence_id: seq_example1, step_id: stp_example1 }
    call: { method: GET, path: "/sequences/{sequence_id}/steps/{step_id}/ab-test" }
    cost: *request

  - name: update_ab_variant
    class: write
    description: >-
      Change variant B of an email step's A/B test: only the keys given in
      data change.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id, data]
      properties:
        sequence_id: *sequence_id
        step_id: *step_id
        data:
          type: object
          additionalProperties: false
          description: "The keys of variant B to change, under lemlist's names."
          properties:
            subject: { type: string, maxLength: 400, description: "Subject of B; empty, B replies in the thread of the previous email." }
            message: { type: string, description: "Body of B (HTML)." }
            altMessage: { type: string, description: "B's LinkedIn note, as altMessage of the step." }
            altMessagePremium: { type: string, description: "linkedinSend only: B's premium out-of-network note." }
            cc: { type: array, items: { type: string, minLength: 3, personal: true } }
            plainText: { type: boolean, description: "Send B as plain text." }
    examples:
      - title: A new subject for variant B
        input: { sequence_id: seq_example1, step_id: stp_example1, data: { subject: "A question about {{companyName}}" } }
    call:
      method: PATCH
      path: "/sequences/{sequence_id}/steps/{step_id}/ab-test"
      body: data
    cost: *request

  - name: delete_ab_variant
    class: sensitive
    description: >-
      End an A/B test by dropping one variant: B drops variant B; A drops A
      and promotes B, the step keeping B's content.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id, variant]
      properties:
        sequence_id: *sequence_id
        step_id: *step_id
        variant: &variant { type: string, enum: [A, B] }
    examples:
      - title: Drop variant B
        input: { sequence_id: seq_example1, step_id: stp_example1, variant: B }
    confirm:
      summary: "End the A/B test of step {step_id} by dropping variant {variant}."
    call:
      method: DELETE
      path: "/sequences/{sequence_id}/steps/{step_id}/ab-test"
      query: { variant: variant }
    cost: *request

  - name: select_ab_winner
    class: sensitive
    description: >-
      Pick the winning variant of an A/B test: its template is then sent to
      every remaining lead going through the step.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, step_id, variant]
      properties:
        sequence_id: *sequence_id
        step_id: *step_id
        variant: *variant
    examples:
      - title: Variant A wins
        input: { sequence_id: seq_example1, step_id: stp_example1, variant: A }
    confirm:
      summary: "Variant {variant} wins on step {step_id}: it is sent to every remaining lead."
    call:
      method: POST
      path: "/sequences/{sequence_id}/steps/{step_id}/ab-test/winner"
      body: { variant: variant }
    cost: *request

  # --- Schedules ---------------------------------------------------------------

  - name: list_schedules
    class: read
    description: >-
      List the team's schedules (sending windows: days, hours, time zone,
      pacing), one page: {schedules: [...], pagination}. A schedule belongs
      to the team; several campaigns can share one.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *limit_100
        offset: *offset
        page: *page
    examples:
      - title: The schedules
        input: { limit: 50 }
    call:
      method: GET
      path: /schedules
      query: { limit: limit, offset: offset, page: page }
    cost: *request

  - name: get_schedule
    class: read
    description: Get one schedule.
    input:
      type: object
      additionalProperties: false
      required: [schedule_id]
      properties:
        schedule_id: &schedule_id { type: string, minLength: 1, description: "Schedule id (skd_…)." }
    examples:
      - title: One schedule
        input: { schedule_id: skd_example1 }
    call: { method: GET, path: "/schedules/{schedule_id}" }
    cost: *request

  - name: create_schedule
    class: write
    description: >-
      Create a sending window: the days (1 Monday to 7 Sunday), the hours
      (HH:mm, 24 h) in an IANA time zone, and optionally the pacing between
      two sends (lemlist's default 1200 s) and whether the team sees it as a
      template. Attach it to a campaign with associate_schedule.
    input:
      type: object
      additionalProperties: false
      required: [name, timezone, start, end, weekdays]
      properties:
        name: { type: string, minLength: 1 }
        timezone: *timezone
        start: &hour { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "HH:mm, 24 h." }
        end: *hour
        weekdays: &weekdays
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "Active days, 1 = Monday … 7 = Sunday."
        seconds_to_wait: { type: integer, minimum: 0, description: "Seconds between two sends." }
        public: { type: boolean, description: "Shown to the team as a template." }
    examples:
      - title: Office hours in Paris, Monday to Friday
        input: { name: Office hours, timezone: Europe/Paris, start: "09:00", end: "18:00", weekdays: [1, 2, 3, 4, 5] }
    call:
      method: POST
      path: /schedules
      body: { name: name, timezone: timezone, start: start, end: end, weekdays: weekdays, secondsToWait: seconds_to_wait, public: public }
    cost: *request

  - name: update_schedule
    class: write
    description: >-
      Change a schedule: only the keys given in data change, with the
      vocabulary of create_schedule. Every campaign that uses it follows.
    input:
      type: object
      additionalProperties: false
      required: [schedule_id, data]
      properties:
        schedule_id: *schedule_id
        data:
          type: object
          additionalProperties: false
          description: "The keys to change, under lemlist's names."
          properties:
            name: { type: string, minLength: 1 }
            timezone: *timezone
            start: *hour
            end: *hour
            weekdays: *weekdays
            secondsToWait: { type: integer, minimum: 0, description: "Seconds between two sends." }
            public: { type: boolean, description: "Shown to the team as a template." }
    examples:
      - title: Later hours on Monday to Thursday
        input: { schedule_id: skd_example1, data: { start: "10:00", end: "19:00", weekdays: [1, 2, 3, 4] } }
    call:
      method: PATCH
      path: "/schedules/{schedule_id}"
      body: data
    cost: *request

  - name: delete_schedule
    class: sensitive
    description: Delete a schedule; the campaigns that use it lose that sending window.
    input:
      type: object
      additionalProperties: false
      required: [schedule_id]
      properties:
        schedule_id: *schedule_id
    examples:
      - title: Delete a schedule
        input: { schedule_id: skd_example1 }
    confirm:
      summary: "Delete lemlist schedule {schedule_id}."
    call: { method: DELETE, path: "/schedules/{schedule_id}" }
    cost: *request

  - name: get_campaign_schedules
    class: read
    description: The schedules attached to a campaign.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - title: The windows of a campaign
        input: { campaign_id: cam_example1 }
    call: { method: GET, path: "/campaigns/{campaign_id}/schedules/" }
    cost: *request

  - name: associate_schedule
    class: write
    description: Attach an existing schedule to a campaign.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, schedule_id]
      properties:
        campaign_id: *campaign_id
        schedule_id: *schedule_id
    examples:
      - title: Attach a window
        input: { campaign_id: cam_example1, schedule_id: skd_example1 }
    call: { method: POST, path: "/campaigns/{campaign_id}/schedules/{schedule_id}" }
    cost: *request

  # --- Leads -------------------------------------------------------------------

  - name: delete_lead
    class: sensitive
    description: >-
      Take a lead out of a campaign. Without action, lemlist UNSUBSCRIBES the
      lead (it stays in the campaign, marked unsubscribed); action remove
      deletes it from the campaign.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, email]
      properties:
        campaign_id: *campaign_id
        email: { type: string, minLength: 1, personal: true, description: "Lead email, or lead id." }
        action: { type: string, enum: [remove], description: "remove: delete the lead instead of unsubscribing it." }
    examples:
      - title: Unsubscribe a lead from a campaign
        input: { campaign_id: cam_example1, email: marie@example.test }
      - title: Delete a lead from a campaign
        input: { campaign_id: cam_example1, email: marie@example.test, action: remove }
    confirm:
      summary: "Unsubscribe (or, with action remove, delete) lead {email} from lemlist campaign {campaign_id}."
    call:
      method: DELETE
      path: "/campaigns/{campaign_id}/leads/{email}"
      query: { action: action }
    cost: *request

  - name: get_lead
    class: read
    description: >-
      Look a lead up by id or by email: its campaigns, state and variables.
      Give lead_id or email.
    input:
      type: object
      additionalProperties: false
      anyOf: [{ required: [lead_id] }, { required: [email] }]
      properties:
        lead_id: &lead_id { type: string, minLength: 1, description: "Lead id (lea_…)." }
        email: &email { type: string, minLength: 3, personal: true, description: "Email address." }
        version: &version { type: string, minLength: 1, description: "Answer version, as lemlist names it (v2)." }
    examples:
      - title: A lead by email
        input: { email: marie@example.test }
    call:
      method: GET
      path: /leads
      query: { id: lead_id, email: email, version: version }
    cost: *request

  - name: get_lead_by_email
    class: read
    description: Look a lead up by its email address, the same object as get_lead.
    input:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: *email
        version: *version
    examples:
      - title: A lead by email
        input: { email: marie@example.test }
    call:
      method: GET
      path: "/leads/{email}"
      query: { version: version }
    cost: *request

  - name: get_campaign_leads
    class: read
    description: >-
      The leads of a campaign with their state, as JSON. state filters on the
      lead state.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
        state: &lead_state { type: string, minLength: 1, description: "Lead state, as lemlist names it (all, interested, paused…)." }
        limit: { type: integer, minimum: 1 }
    examples:
      - title: The leads of a campaign
        input: { campaign_id: cam_example1, limit: 100 }
    call:
      method: GET
      path: "/campaigns/{campaign_id}/leads/"
      query: { state: state, limit: limit }
    cost: *request

  - name: update_lead
    class: write
    description: >-
      Change the fields of a lead in a campaign: only the keys given in data
      change. Its custom variables are not changed here.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, lead_id, data]
      properties:
        campaign_id: *campaign_id
        lead_id: *lead_id
        data:
          type: object
          additionalProperties: false
          description: "The fields to change, under lemlist's names."
          properties:
            firstName: { type: string, personal: true }
            lastName: { type: string, personal: true }
            companyName: { type: string, description: "The lead's company, renamed in place; without one, the lead is linked to a company of that name." }
            jobTitle: { type: string }
            preferredContactMethod: { type: string, description: "email or linkedIn." }
    examples:
      - title: A new job title
        input: { campaign_id: cam_example1, lead_id: lea_example1, data: { jobTitle: Head of Sales } }
    call:
      method: PATCH
      path: "/campaigns/{campaign_id}/leads/{lead_id}"
      body: data
    cost: *request

  - name: pause_lead
    class: write
    description: >-
      Pause a lead: in one campaign with campaign_id, in ALL its campaigns
      without it.
    input:
      type: object
      additionalProperties: false
      required: [lead_id]
      properties:
        lead_id: *lead_id
        campaign_id: *campaign_id
    examples:
      - title: Pause a lead in one campaign
        input: { lead_id: lea_example1, campaign_id: cam_example1 }
    call:
      method: POST
      path: "/leads/pause/{lead_id}"
      query: { campaignId: campaign_id }
    cost: *request

  - name: resume_lead
    class: sensitive
    description: "Resume a paused lead: it goes back into a live sequence, and lemlist sends to it again."
    input:
      type: object
      additionalProperties: false
      required: [lead_id]
      properties:
        lead_id: *lead_id
    examples:
      - title: Resume a lead
        input: { lead_id: lea_example1 }
    confirm:
      summary: "Resume lemlist lead {lead_id}: its sequence sends again."
    call: { method: POST, path: "/leads/start/{lead_id}" }
    cost: *request

  - name: launch_lead
    class: sensitive
    description: >-
      Launch a lead waiting for manual review, in a campaign that reviews
      before sending: from here its sequence sends. A 400 names the reason
      (CAMPAIGN_LEAD_REVIEW_LEAD_ALREADY_LAUNCHED, …_LEAD_PAUSED,
      …_AI_VARIABLE_INVALID, …_NO_SENDER_AVAILABLE, …_CAMPAIGN_STEP_ERRORS).
    input:
      type: object
      additionalProperties: false
      required: [lead_id]
      properties:
        lead_id: *lead_id
    examples:
      - title: Launch a reviewed lead
        input: { lead_id: lea_example1 }
    confirm:
      summary: "Launch lemlist lead {lead_id}: its sequence starts sending."
    call: { method: POST, path: "/leads/review/{lead_id}" }
    cost: *request

  - name: import_leads_from_crm
    class: sensitive
    description: >-
      Import leads from a connected CRM into a campaign, by a CRM-side
      filter (get_crm_filters lists them). In a campaign with auto review,
      the imported leads are launched and sent to.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, crm, user_id, filter_id]
      properties:
        campaign_id: *campaign_id
        crm: &crm { type: string, minLength: 1, description: "CRM name: hubspot, salesforce, pipedrive…" }
        user_id: *user_id
        filter_id: { type: string, minLength: 1 }
        filter_type: { type: string, minLength: 1 }
        deduplicate: { type: boolean, description: "Skip a lead already in another campaign." }
    examples:
      - title: Import a CRM view
        input: { campaign_id: cam_example1, crm: hubspot, user_id: usr_example1, filter_id: "42" }
    confirm:
      summary: "Import CRM leads (filter {filter_id}) into lemlist campaign {campaign_id}."
    call:
      method: POST
      path: "/campaigns/{campaign_id}/leads/import"
      body: { crm: crm, userId: user_id, filterId: filter_id, filterType: filter_type, deduplicate: deduplicate }
    cost: *request

  - name: upload_lead_audio
    class: write
    description: >-
      Upload the audio of a LinkedIn voice note step for one lead: the step
      sends it when it runs. audio is the id of a transit file of yours.
    input:
      type: object
      additionalProperties: false
      required: [lead_id, step_id, audio]
      properties:
        lead_id: *lead_id
        step_id: *step_id
        audio: { type: string, format: uuid, description: "Id of a transit file of yours: the audio to upload." }
    examples:
      - title: A voice note for one lead
        input: { lead_id: lea_example1, step_id: stp_example1, audio: 00000000-0000-4000-8000-000000000000 }
    call:
      method: POST
      path: /leads/audio
      query: { leadId: lead_id, stepId: step_id }
      files: { file: audio }
    cost: *request

  # --- Enrichment --------------------------------------------------------------

  - name: enrich
    class: write
    description: >-
      Submit a standalone enrichment, no campaign nor lead: find or verify an
      email, find a phone, enrich from LinkedIn. Each action spends lemlist
      credits. Give the identity you have: a LinkedIn URL, or a name with a
      company domain, resolves best. Returns {id}; the result is read later
      by the hand-written client (a 404 there is an answer).
    input:
      type: object
      additionalProperties: false
      anyOf: [{ required: [find_email] }, { required: [verify_email] }, { required: [linkedin_enrichment] }, { required: [find_phone] }]
      properties:
        email: *email
        linkedin_url: &linkedin_url { type: string, minLength: 1, personal: true, description: "LinkedIn profile URL." }
        first_name: &first_name { type: string, minLength: 1, personal: true }
        last_name: &last_name { type: string, minLength: 1, personal: true }
        company_name: { type: string, minLength: 1 }
        company_domain: { type: string, minLength: 1 }
        find_email: &find_email { const: true, description: "Find a verified email. Omit otherwise." }
        verify_email: &verify_email { const: true, description: "Verify the email given. Omit otherwise." }
        linkedin_enrichment: &linkedin_enrichment { const: true, description: "Run the LinkedIn enrichment. Omit otherwise." }
        find_phone: &find_phone { const: true, description: "Find a phone number. Omit otherwise." }
    examples:
      - title: Find the email of a person
        input: { first_name: Marie, last_name: Martin, company_domain: example.test, find_email: true }
    call:
      method: POST
      path: /enrich
      query:
        findEmail: find_email
        verifyEmail: verify_email
        linkedinEnrichment: linkedin_enrichment
        findPhone: find_phone
        email: email
        linkedinUrl: linkedin_url
        firstName: first_name
        lastName: last_name
        companyName: company_name
        companyDomain: company_domain
    cost: *request

  - name: enrich_lead
    class: write
    description: >-
      Enrich a lead of a campaign, the result written back onto it; same
      actions as enrich, each spending lemlist credits. Only a lead still
      awaiting review: a reviewed lead gets 400.
    input:
      type: object
      additionalProperties: false
      required: [lead_id]
      anyOf: [{ required: [find_email] }, { required: [verify_email] }, { required: [linkedin_enrichment] }, { required: [find_phone] }]
      properties:
        lead_id: *lead_id
        find_email: *find_email
        verify_email: *verify_email
        linkedin_enrichment: *linkedin_enrichment
        find_phone: *find_phone
    examples:
      - title: Find the phone of a lead
        input: { lead_id: lea_example1, find_phone: true }
    call:
      method: POST
      path: "/leads/{lead_id}/enrich"
      query: { findEmail: find_email, verifyEmail: verify_email, linkedinEnrichment: linkedin_enrichment, findPhone: find_phone }
    cost: *request

  # --- Activities and stats ----------------------------------------------------

  - name: get_activities
    class: read
    description: >-
      Activities of leads (emails sent, opened, replied, LinkedIn steps,
      pauses…), one page by offset. Filters: campaign, lead, type, first
      occurrence per lead, and two pairs of date bounds lemlist keeps apart.
    input:
      type: object
      additionalProperties: false
      properties:
        campaign_id: *campaign_id
        limit: { type: integer, minimum: 1, maximum: 1000 }
        offset: *offset
        type: { type: string, minLength: 1, description: "Activity type: emailsSent, emailsOpened, emailsReplied…" }
        is_first: { type: boolean, description: "Only the first activity of its kind per lead." }
        lead_id: *lead_id
        min_date: &date { type: string, minLength: 1, description: "ISO 8601 date." }
        max_date: *date
        start_date: *date
        end_date: *date
    examples:
      - title: Replies in one campaign
        input: { campaign_id: cam_example1, type: emailsReplied, limit: 100 }
    call:
      method: GET
      path: /activities
      query:
        limit: limit
        offset: offset
        campaignId: campaign_id
        type: type
        isFirst: is_first
        leadId: lead_id
        minDate: min_date
        maxDate: max_date
        startDate: start_date
        endDate: end_date
      constants: { query: { version: v2 } }
    cost: *request

  - name: delete_activity_recording_transcript
    class: sensitive
    description: Delete the recording transcript attached to a call activity.
    input:
      type: object
      additionalProperties: false
      required: [activity_id]
      properties:
        activity_id: { type: string, minLength: 1 }
    examples:
      - title: Delete a transcript
        input: { activity_id: act_example1 }
    confirm:
      summary: "Delete the recording transcript of activity {activity_id}."
    call: { method: DELETE, path: "/activities/{activity_id}/recording-transcript" }
    cost: *request

  - name: get_campaign_stats_v2
    class: read
    description: >-
      Campaign stats from lemlist's own counters over a period: leads
      (nbLeads, nbLeadsReached, nbLeadsAnswered…), messages (sent, opened,
      clicked, replied, bounced), perChannel and per step. Optionally one
      sender, one side of an A/B test, some channels.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, start_date, end_date]
      properties:
        campaign_id: *campaign_id
        start_date: *date
        end_date: *date
        send_user: &send_user { type: string, pattern: "^[^|]+\\|[^|]+$", personal: true, description: "One sender: usr_…|sender@email, both halves." }
        ab_selected: *variant
        channels: &channels { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [email, linkedin, others] } }
    examples:
      - title: October stats of a campaign
        input: { campaign_id: cam_example1, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-31T23:59:59Z" }
    call:
      method: GET
      path: "/v2/campaigns/{campaign_id}/stats"
      query: { startDate: start_date, endDate: end_date, sendUser: send_user, ABSelected: ab_selected, channels: channels }
      encode: { channels: json }
    cost: *request

  - name: get_batch_campaign_stats
    class: read
    description: The counters of get_campaign_stats_v2 for up to 100 campaigns in one call.
    input:
      type: object
      additionalProperties: false
      required: [campaign_ids, start_date, end_date]
      properties:
        campaign_ids: { type: array, minItems: 1, maxItems: 100, items: *campaign_id }
        start_date: *date
        end_date: *date
        send_user: *send_user
        ab_selected: *variant
        channels: *channels
    examples:
      - title: October stats of two campaigns
        input: { campaign_ids: [cam_example1, cam_example2], start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-31T23:59:59Z" }
    call:
      method: POST
      path: /v2/campaigns/stats/batch
      body: { campaignIds: campaign_ids, startDate: start_date, endDate: end_date, sendUser: send_user, ABSelected: ab_selected, channels: channels }
    cost: *request

  - name: get_campaign_reports
    class: read
    description: >-
      One report row per campaign, in the app's vocabulary (emailsSent,
      emailsOpened, emailsReplied, senderNames, state): the shape to compare
      campaigns.
    input:
      type: object
      additionalProperties: false
      required: [campaign_ids]
      properties:
        campaign_ids: { type: array, minItems: 1, items: *campaign_id }
    examples:
      - title: Compare two campaigns
        input: { campaign_ids: [cam_example1, cam_example2] }
    call:
      method: GET
      path: /campaigns/reports
      query: { campaignIds: campaign_ids }
    cost: *request

  # --- Unsubscribes ------------------------------------------------------------
  # Three lists: v1 emails and domains; v2 variables (any identifying value); v2 the do-not-contact flag of a CRM
  # contact. Unsubscribing an address does not flag the contact, and conversely.

  - name: list_unsubscribes
    class: read
    description: List the unsubscribed emails and domains (v1 list).
    input:
      type: object
      additionalProperties: false
      properties:
        offset: *offset
        limit: &limit { type: integer, minimum: 1 }
    examples:
      - title: The unsubscribe list
        input: { limit: 100 }
    call:
      method: GET
      path: /unsubscribes
      query: { offset: offset, limit: limit }
    cost: *request

  - name: get_unsubscribe
    class: read
    description: Read one unsubscribed email or domain (v1 list).
    input:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: &email_or_domain { type: string, minLength: 1, personal: true, description: "Email address or domain." }
    examples:
      - title: Is this address unsubscribed
        input: { email: marie@example.test }
    call: { method: GET, path: "/unsubscribes/{email}" }
    cost: *request

  - name: add_unsubscribe
    class: sensitive
    description: "Add an email, or a whole domain, to the unsubscribe list (v1): lemlist never sends to it again."
    input:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: *email_or_domain
    examples:
      - title: Unsubscribe an address
        input: { email: marie@example.test }
    confirm:
      summary: "Unsubscribe {email} from every lemlist send."
    call: { method: POST, path: "/unsubscribes/{email}" }
    cost: *request

  - name: delete_unsubscribe
    class: sensitive
    description: "Remove an email or a domain from the unsubscribe list (v1): lemlist may send to it again."
    input:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: *email_or_domain
    examples:
      - title: Resubscribe an address
        input: { email: marie@example.test }
    confirm:
      summary: "Remove {email} from the lemlist unsubscribe list: it can receive messages again."
    call: { method: DELETE, path: "/unsubscribes/{email}" }
    cost: *request

  - name: list_unsubscribed_variables
    class: read
    description: "List the unsubscribed variables (v2): emails, domains, LinkedIn URLs, phone numbers."
    input:
      type: object
      additionalProperties: false
      properties:
        offset: *offset
        limit: *limit
    examples:
      - title: The unsubscribed variables
        input: { limit: 100 }
    call:
      method: GET
      path: /v2/unsubscribes/variables
      query: { offset: offset, limit: limit }
    cost: *request

  - name: get_unsubscribed_variable
    class: read
    description: Read one unsubscribed variable by its value (v2).
    input:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: &variable_value { type: string, minLength: 1, personal: true, description: "Email, domain, LinkedIn URL or phone number." }
    examples:
      - title: Is this phone unsubscribed
        input: { value: "+33600000000" }
    call: { method: GET, path: "/v2/unsubscribes/variables/{value}" }
    cost: *request

  - name: unsubscribe_variable
    class: sensitive
    description: Unsubscribe one variable (v2). Idempotent.
    input:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: *variable_value
    examples:
      - title: Unsubscribe a domain
        input: { value: example.test }
    confirm:
      summary: "Unsubscribe {value} from every lemlist send."
    call: { method: POST, path: "/v2/unsubscribes/variables/{value}" }
    cost: *request

  - name: resubscribe_variable
    class: sensitive
    description: Re-subscribe a variable, removing it from the v2 list.
    input:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: *variable_value
    examples:
      - title: Resubscribe a domain
        input: { value: example.test }
    confirm:
      summary: "Remove {value} from the lemlist unsubscribe list: it can receive messages again."
    call: { method: DELETE, path: "/v2/unsubscribes/variables/{value}" }
    cost: *request

  - name: bulk_unsubscribe_variables
    class: sensitive
    description: Unsubscribe up to 10 000 variables in one call (v2).
    input:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: { type: array, minItems: 1, maxItems: 10000, items: *variable_value }
    examples:
      - title: Unsubscribe two addresses
        input: { values: [marie@example.test, paul@example.test] }
    confirm:
      summary: "Unsubscribe these values from every lemlist send."
    call:
      method: POST
      path: /v2/unsubscribes/variables
      body: { values: values }
    cost: *request

  - name: get_contact_subscription
    class: read
    description: Whether a CRM contact is flagged do-not-contact (v2).
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: &contact_id { type: string, minLength: 1, description: "CRM contact id (ctc_…)." }
    examples:
      - title: A contact's flag
        input: { contact_id: ctc_example1 }
    call: { method: GET, path: "/v2/unsubscribes/contacts/{contact_id}" }
    cost: *request

  - name: unsubscribe_contact
    class: sensitive
    description: Flag a CRM contact do-not-contact (v2); the flag rides the contact, not one of its values.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: *contact_id
    examples:
      - title: Flag a contact
        input: { contact_id: ctc_example1 }
    confirm:
      summary: "Flag lemlist contact {contact_id} do-not-contact."
    call: { method: POST, path: "/v2/unsubscribes/contacts/{contact_id}" }
    cost: *request

  - name: resubscribe_contact
    class: sensitive
    description: Clear the do-not-contact flag of a CRM contact (v2).
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: *contact_id
    examples:
      - title: Clear a contact's flag
        input: { contact_id: ctc_example1 }
    confirm:
      summary: "Clear the do-not-contact flag of lemlist contact {contact_id}: it can receive messages again."
    call: { method: DELETE, path: "/v2/unsubscribes/contacts/{contact_id}" }
    cost: *request

  # --- Contacts and companies (the lemlist CRM) ---------------------------------

  - name: list_contacts
    class: read
    description: >-
      List or look up contacts of the lemlist CRM: specific ones by id or
      email (at most 100), or by search, list, company, or contacts in no
      campaign.
    input:
      type: object
      additionalProperties: false
      properties:
        ids_or_emails: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, personal: true } }
        search: { type: string, minLength: 1 }
        email: *email
        list_id: &list_id { type: string, minLength: 1, description: "Contact list id." }
        not_in_any_campaign: { type: boolean }
        company_id: &company_id { type: string, minLength: 1, description: "CRM company id." }
        company_domain: { type: string, minLength: 1 }
        company_linkedin_url: { type: string, minLength: 1 }
        company_salesnav_url: { type: string, minLength: 1 }
        field_rejection_reason: { type: string, minLength: 1 }
        limit: *limit
        offset: *offset
    examples:
      - title: Contacts of one company
        input: { company_domain: example.test, limit: 50 }
    call:
      method: GET
      path: /contacts
      query:
        idsOrEmails: ids_or_emails
        search: search
        email: email
        listId: list_id
        notInAnyCampaign: not_in_any_campaign
        companyId: company_id
        companyDomain: company_domain
        companyLinkedinUrl: company_linkedin_url
        companySalesnavUrl: company_salesnav_url
        fieldRejectionReason: field_rejection_reason
        limit: limit
        offset: offset
    cost: *request

  - name: get_contact
    class: read
    description: Read one CRM contact by id or email.
    input:
      type: object
      additionalProperties: false
      required: [id_or_email]
      properties:
        id_or_email: &id_or_email { type: string, minLength: 1, personal: true, description: "Contact id or email." }
    examples:
      - title: A contact by email
        input: { id_or_email: marie@example.test }
    call: { method: GET, path: "/contacts/{id_or_email}" }
    cost: *request

  - name: delete_contact
    class: sensitive
    description: Delete a CRM contact.
    input:
      type: object
      additionalProperties: false
      required: [id_or_email]
      properties:
        id_or_email: *id_or_email
    examples:
      - title: Delete a contact
        input: { id_or_email: ctc_example1 }
    confirm:
      summary: "Delete lemlist contact {id_or_email}."
    call: { method: DELETE, path: "/contacts/{id_or_email}" }
    cost: *request

  - name: list_contact_lists
    class: read
    description: List the contact lists of the team.
    input:
      type: object
      additionalProperties: false
      properties:
        search: { type: string, minLength: 1 }
    examples:
      - title: The lists
        input: {}
    call:
      method: GET
      path: /contacts/lists
      query: { search: search }
    cost: *request

  - name: create_contact_list
    class: write
    description: Create a contact list.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    examples:
      - title: A new list
        input: { name: Trade show leads }
    call:
      method: POST
      path: /contacts/lists
      body: { name: name }
    cost: *request

  - name: manage_contact_list
    class: write
    description: >-
      Add contacts to a list, or, with action remove, take them out. Without
      action, it ADDS.
    input:
      type: object
      additionalProperties: false
      required: [list_id, contact_ids]
      properties:
        list_id: *list_id
        contact_ids: { type: array, minItems: 1, items: *contact_id }
        action: { type: string, enum: [remove], description: "remove: take the contacts out. Omit to add." }
    examples:
      - title: Add two contacts to a list
        input: { list_id: lst_example1, contact_ids: [ctc_example1, ctc_example2] }
    call:
      method: POST
      path: "/contacts/lists/{list_id}/entities"
      query: { action: action }
      body: { contactIds: contact_ids }
    cost: *request

  - name: list_companies
    class: read
    description: List or look up companies of the lemlist CRM, by id or domain, or by search, with chosen fields.
    input:
      type: object
      additionalProperties: false
      properties:
        ids_or_domains: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        search: { type: string, minLength: 1 }
        fields: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        offset: *offset
        limit: *limit
        sort_by: { type: string, minLength: 1 }
        sort_order: &sort_order { type: string, enum: [asc, desc] }
        crm_sync_status: { type: string, minLength: 1 }
        field_rejection_reason: { type: string, minLength: 1 }
    examples:
      - title: A company by domain
        input: { ids_or_domains: [example.test] }
    call:
      method: GET
      path: /companies
      query:
        idsOrDomains: ids_or_domains
        search: search
        fields: fields
        offset: offset
        limit: limit
        sortBy: sort_by
        sortOrder: sort_order
        crmSyncStatus: crm_sync_status
        fieldRejectionReason: field_rejection_reason
    cost: *request

  - name: delete_company
    class: sensitive
    description: >-
      Delete a CRM company. lemlist refuses while contacts hang off it;
      force: true deletes it anyway.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        force: { const: true, description: "Delete even with contacts attached. Omit otherwise." }
    examples:
      - title: Delete a company
        input: { company_id: cpy_example1 }
    confirm:
      summary: "Delete lemlist company {company_id}."
    call:
      method: DELETE
      path: "/companies/{company_id}"
      query: { force: force }
    cost: *request

  - name: get_company_notes
    class: read
    description: List the notes attached to a CRM company.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        limit: *limit
        page: *page
        sort_by: { type: string, minLength: 1 }
        sort_order: *sort_order
    examples:
      - title: The notes of a company
        input: { company_id: cpy_example1 }
    call:
      method: GET
      path: "/companies/{company_id}/notes"
      query: { limit: limit, page: page, sortBy: sort_by, sortOrder: sort_order }
    cost: *request

  - name: create_company_note
    class: write
    description: Attach a note to a CRM company.
    input:
      type: object
      additionalProperties: false
      required: [company_id, note]
      properties:
        company_id: *company_id
        note: { type: string, minLength: 1 }
    examples:
      - title: A note
        input: { company_id: cpy_example1, note: Met at the trade show. }
    call:
      method: POST
      path: "/companies/{company_id}/notes"
      body: { note: note }
    cost: *request

  # --- Inbox -------------------------------------------------------------------
  # Conversations per CRM contact, all channels together, with drafts and labels. The three sends below go out
  # directly, through neither a campaign nor a review.

  - name: list_inboxes
    class: read
    description: The inbox conversations of one user.
    input:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: *user_id
        page: *page
        limit: *limit
    examples:
      - title: A user's conversations
        input: { user_id: usr_example1 }
    call:
      method: GET
      path: /inbox
      query: { userId: user_id, page: page, limit: limit }
    cost: *request

  - name: get_contact_messages
    class: read
    description: The message history of a conversation, by CRM contact, all channels.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: *contact_id
        user_id: *user_id
        limit: *limit
        skip: { type: integer, minimum: 0 }
    examples:
      - title: A conversation
        input: { contact_id: ctc_example1, limit: 20 }
    call:
      method: GET
      path: "/inbox/{contact_id}"
      query: { userId: user_id, limit: limit, skip: skip }
    cost: *request

  - name: list_inbox_labels
    class: read
    description: List the inbox labels of the team.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The labels
        input: {}
    call: { method: GET, path: /inbox/labels }
    cost: *request

  - name: get_inbox_label
    class: read
    description: Read one inbox label.
    input:
      type: object
      additionalProperties: false
      required: [label_id]
      properties:
        label_id: &label_id { type: string, minLength: 1, description: "Inbox label id." }
    examples:
      - title: One label
        input: { label_id: lbl_example1 }
    call: { method: GET, path: "/inbox/labels/{label_id}" }
    cost: *request

  - name: create_inbox_label
    class: write
    description: Create an inbox label.
    input:
      type: object
      additionalProperties: false
      required: [label_name]
      properties:
        label_name: { type: string, minLength: 1 }
    examples:
      - title: A label
        input: { label_name: Hot }
    call:
      method: POST
      path: /inbox/labels
      body: { labelName: label_name }
    cost: *request

  - name: attach_inbox_labels
    class: write
    description: >-
      Put labels on a conversation. append true adds them; append false
      REPLACES the conversation's labels with these.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, label_ids, append]
      properties:
        contact_id: *contact_id
        label_ids: &label_ids { type: array, minItems: 1, items: *label_id }
        append: { type: boolean, description: "true adds the labels; false replaces the conversation's labels." }
    examples:
      - title: Add a label
        input: { contact_id: ctc_example1, label_ids: [lbl_example1], append: true }
    call:
      method: POST
      path: "/inbox/conversations/labels/{contact_id}"
      body: { labelIds: label_ids, appendLabels: append }
    cost: *request

  - name: remove_inbox_labels
    class: write
    description: Take labels off a conversation.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, label_ids]
      properties:
        contact_id: *contact_id
        label_ids: *label_ids
    examples:
      - title: Remove a label
        input: { contact_id: ctc_example1, label_ids: [lbl_example1] }
    call:
      method: DELETE
      path: "/inbox/conversations/labels/{contact_id}"
      body: { labelIds: label_ids }
    cost: *request

  - name: list_drafts
    class: read
    description: The drafts of a conversation; a draft belongs to a user, draft_owner.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, draft_owner]
      properties:
        contact_id: *contact_id
        draft_owner: *user_id
    examples:
      - title: A user's drafts in a conversation
        input: { contact_id: ctc_example1, draft_owner: usr_example1 }
    call:
      method: GET
      path: "/inbox/{contact_id}/drafts"
      query: { draftOwner: draft_owner }
    cost: *request

  - name: get_draft
    class: read
    description: Read one draft.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, draft_id, draft_owner]
      properties:
        contact_id: *contact_id
        draft_id: &draft_id { type: string, minLength: 1 }
        draft_owner: *user_id
    examples:
      - title: One draft
        input: { contact_id: ctc_example1, draft_id: drf_example1, draft_owner: usr_example1 }
    call:
      method: GET
      path: "/inbox/{contact_id}/drafts/{draft_id}"
      query: { draftOwner: draft_owner }
    cost: *request

  - name: create_draft
    class: write
    act: false
    description: >-
      Write a draft in a conversation, on one channel. A draft sends
      nothing: a person sends it from the lemlist inbox.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, draft_owner, channel, content]
      properties:
        contact_id: *contact_id
        draft_owner: *user_id
        channel: { type: string, enum: [email, linkedin, whatsapp, sms] }
        content: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        cc: &cc { type: array, minItems: 1, items: { type: string, minLength: 3, personal: true } }
        attachments: { type: array, minItems: 1, items: { type: object } }
        reply_to_activity_id: &reply_to { type: string, minLength: 1, description: "Activity id of the message replied to." }
        source_metadata: { type: object }
    examples:
      - title: An email draft
        input: { contact_id: ctc_example1, draft_owner: usr_example1, channel: email, subject: Next week, content: "<p>Hello Marie,</p>" }
    call:
      method: POST
      path: "/inbox/{contact_id}/drafts"
      query: { draftOwner: draft_owner }
      body:
        channel: channel
        content: content
        subject: subject
        cc: cc
        attachments: attachments
        replyToActivityId: reply_to_activity_id
        sourceMetadata: source_metadata
    cost: *request

  - name: update_draft
    class: write
    act: false
    description: >-
      Change a draft: only the keys given in data change. A draft sends
      nothing: a person sends it from the lemlist inbox.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, draft_id, draft_owner, data]
      properties:
        contact_id: *contact_id
        draft_id: *draft_id
        draft_owner: *user_id
        data:
          type: object
          additionalProperties: false
          description: "The keys to change, under lemlist's names."
          properties:
            subject: { type: string }
            cc: { type: array, items: { type: string, minLength: 3, personal: true } }
            content: { type: string, description: "The content, 30 KB at most." }
            attachments: { type: array, items: { type: object } }
            replyToActivityId: *reply_to
    examples:
      - title: A new content
        input: { contact_id: ctc_example1, draft_id: drf_example1, draft_owner: usr_example1, data: { content: "<p>Hello Marie, see you on Tuesday.</p>" } }
    call:
      method: PATCH
      path: "/inbox/{contact_id}/drafts/{draft_id}"
      query: { draftOwner: draft_owner }
      body: data
    cost: *request

  - name: delete_draft
    class: sensitive
    description: Delete a draft.
    input:
      type: object
      additionalProperties: false
      required: [contact_id, draft_id, draft_owner]
      properties:
        contact_id: *contact_id
        draft_id: *draft_id
        draft_owner: *user_id
    examples:
      - title: Delete a draft
        input: { contact_id: ctc_example1, draft_id: drf_example1, draft_owner: usr_example1 }
    confirm:
      summary: "Delete draft {draft_id} of lemlist conversation {contact_id}."
    call:
      method: DELETE
      path: "/inbox/{contact_id}/drafts/{draft_id}"
      query: { draftOwner: draft_owner }
    cost: *request

  - name: send_inbox_email
    class: sensitive
    description: >-
      Send an email from the inbox, at once, to a real person: no campaign,
      no review. The sender's user id, email and mailbox id are required
      (get_user_channels lists them).
    input:
      type: object
      additionalProperties: false
      required: [send_user_id, send_user_email, send_user_mailbox_id, message]
      properties:
        send_user_id: *user_id
        send_user_email: { type: string, minLength: 3, personal: true, description: "The sender's email." }
        send_user_mailbox_id: { type: string, minLength: 1, description: "The sender's mailbox id." }
        message: { type: string, minLength: 1, description: "Body, HTML." }
        contact_id: *contact_id
        lead_id: *lead_id
        subject: { type: string, minLength: 1 }
        cc: *cc
        reply_to_activity_id: *reply_to
    examples:
      - title: Reply to a contact
        input: { send_user_id: usr_example1, send_user_email: me@example.test, send_user_mailbox_id: mbx_example1, contact_id: ctc_example1, subject: Re, message: "<p>Thanks!</p>" }
    confirm:
      summary: "Send an email from {send_user_email} now."
    call:
      method: POST
      path: /inbox/email
      body:
        sendUserId: send_user_id
        sendUserEmail: send_user_email
        sendUserMailboxId: send_user_mailbox_id
        message: message
        contactId: contact_id
        leadId: lead_id
        subject: subject
        cc: cc
        replyToActivityId: reply_to_activity_id
    cost: *request

  - name: send_linkedin_message
    class: sensitive
    description: Send a LinkedIn message from the inbox, at once, to a real person.
    input:
      type: object
      additionalProperties: false
      required: [send_user_id, lead_id, contact_id, message]
      properties:
        send_user_id: *user_id
        lead_id: *lead_id
        contact_id: *contact_id
        message: { type: string, minLength: 1 }
    examples:
      - title: A LinkedIn message
        input: { send_user_id: usr_example1, lead_id: lea_example1, contact_id: ctc_example1, message: Thanks for connecting. }
    confirm:
      summary: "Send a LinkedIn message to contact {contact_id} now."
    call:
      method: POST
      path: /inbox/linkedin
      body: { sendUserId: send_user_id, leadId: lead_id, contactId: contact_id, message: message }
    cost: *request

  - name: send_whatsapp_message
    class: sensitive
    description: Send a WhatsApp message from the inbox, at once, to a real person.
    input:
      type: object
      additionalProperties: false
      required: [send_user_id, send_user_whatsapp_account_id, lead_id, contact_id, message]
      properties:
        send_user_id: *user_id
        send_user_whatsapp_account_id: { type: string, minLength: 1 }
        lead_id: *lead_id
        contact_id: *contact_id
        message: { type: string, minLength: 1 }
    examples:
      - title: A WhatsApp message
        input: { send_user_id: usr_example1, send_user_whatsapp_account_id: wa_example1, lead_id: lea_example1, contact_id: ctc_example1, message: See you tomorrow. }
    confirm:
      summary: "Send a WhatsApp message to contact {contact_id} now."
    call:
      method: POST
      path: /inbox/whatsapp
      body: { sendUserId: send_user_id, sendUserWhatsappAccountId: send_user_whatsapp_account_id, leadId: lead_id, contactId: contact_id, message: message }
