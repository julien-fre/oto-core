  # --- Tasks -------------------------------------------------------------------

  - name: list_tasks
    class: read
    description: >-
      List tasks, filtered by a list of {filterId, …} objects. filters is
      required by lemlist (400 "Malformed filters" without it): pass [] for
      no filter.
    input:
      type: object
      additionalProperties: false
      required: [filters]
      properties:
        page: *page
        filters: { type: array, items: { type: object } }
    examples:
      - title: All tasks
        input: { filters: [] }
    call:
      method: GET
      path: /tasks
      query: { filters: filters, page: page }
      encode: { filters: json }
    cost: *request

  - name: create_task
    class: write
    description: >-
      Create a manual task assigned to a user, on a contact (ctc_…) or a
      lead (lea_…): record_id is required by lemlist. It sends nothing by
      itself.
    input:
      type: object
      additionalProperties: false
      required: [task_type, assigned_to, due_date, record_id]
      properties:
        task_type: { type: string, enum: [email, manual, phone, linkedin] }
        assigned_to: *user_id
        due_date: *date
        record_id: { type: string, minLength: 1, description: "Contact (ctc_…) or lead (lea_…) the task hangs off." }
        title: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        priority: { type: string, description: "0 high … 2 low, empty for none." }
        images: &media { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        videos: *media
    examples:
      - title: Call a contact tomorrow
        input: { task_type: phone, assigned_to: usr_example1, due_date: "2026-10-22T09:00:00Z", record_id: ctc_example1, title: Call back }
    call:
      method: POST
      path: /tasks
      body: { type: task_type, assignedTo: assigned_to, dueDate: due_date, recordId: record_id, title: title, message: message, priority: priority, images: images, videos: videos }
    cost: *request

  - name: ignore_tasks
    class: write
    description: Dismiss tasks without completing them.
    input:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    examples:
      - title: Dismiss two tasks
        input: { ids: [tsk_example1, tsk_example2] }
    call:
      method: POST
      path: /tasks/ignore
      body: { ids: ids }
    cost: *request

  # --- Watch lists and signals ---------------------------------------------------

  - name: list_watch_lists
    class: read
    description: List the team's watch lists (signals monitored).
    input:
      type: object
      additionalProperties: false
      properties:
        page: *page
        limit: *limit
        type: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
    examples:
      - title: The watch lists
        input: {}
    call:
      method: GET
      path: /watchlist
      query: { page: page, limit: limit, type: type, status: status }
    cost: *request

  - name: create_watch_list
    class: sensitive
    description: >-
      Create a watch list on a signal type. lemlist requires filters,
      segment_type, signal_processing_type and activate. Filters depend on
      the type (read get_watch_list_filters, values from
      get_watch_list_filter_values, numbers as strings). With
      push_to_campaign and activate true, the list pushes people into a
      campaign on its own, which can end in sends; persona_id and
      campaign_id go only with push_to_campaign. An active list spends
      lemlist credits per signal caught.
    input:
      type: object
      additionalProperties: false
      required: [name, type, filters, segment_type, signal_processing_type, activate]
      dependentSchemas:
        persona_id: &pushes { properties: { signal_processing_type: { const: push_to_campaign } } }
        campaign_id: *pushes
      properties:
        name: { type: string, minLength: 1 }
        type:
          type: string
          enum: [companyIsHiring, companyRaisedFunds, recruitmentCampaign, jobChange, newHire,
                 companyEmployeeVisitedMyWebsite, customSignals, competitorConnections, competitorReactions,
                 companyFollowers, technologyChange, linkedinPeopleProfile, linkedinCompanyProfile,
                 mergersAcquisitions, promotion, linkedinKeywords, externalSignalContact, externalSignalCompany,
                 buyingIntent]
        filters: { type: array, items: { type: object } }
        emoji: { type: string, minLength: 1 }
        segment_type: { type: string, minLength: 1, description: "Segment of the signals: all." }
        signal_processing_type: { type: string, enum: [manual, create_opportunity, push_to_campaign] }
        signal_opportunity_template: { type: object }
        persona_id: { type: string, minLength: 1, description: "Persona (pdp_…), with push_to_campaign." }
        campaign_id: *campaign_id
        activate: { type: boolean, description: "false keeps the list a draft." }
    examples:
      - title: A draft list on hiring companies
        input:
          name: Hiring sales
          type: companyIsHiring
          filters: [{ filterId: maxIdentificationsPerDay, in: ["5"] }]
          segment_type: all
          signal_processing_type: manual
          activate: false
    confirm:
      summary: "Create lemlist watch list {name} ({signal_processing_type}, activate {activate})."
    call:
      method: POST
      path: /watchlist
      body:
        name: name
        type: type
        filters: filters
        segmentType: segment_type
        signalProcessingType: signal_processing_type
        activate: activate
        emoji: emoji
        signalOpportunityTemplate: signal_opportunity_template
        personaId: persona_id
        campaignId: campaign_id
    cost: *request

  - name: delete_watch_list
    class: sensitive
    description: Delete a watch list.
    input:
      type: object
      additionalProperties: false
      required: [watch_list_id]
      properties:
        watch_list_id: &watch_list_id { type: string, minLength: 1 }
    examples:
      - title: Delete a watch list
        input: { watch_list_id: wl_example1 }
    confirm:
      summary: "Delete lemlist watch list {watch_list_id}."
    call:
      method: DELETE
      path: /watchlist
      query: { watchListId: watch_list_id }
    cost: *request

  - name: get_watch_list_filters
    class: read
