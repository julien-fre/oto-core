      query: { type: type }
    cost: *request

  - name: get_watch_list_filter_values
    class: read
    description: The canonical values a watch list filter accepts, by search text; a free value is refused.
    input:
      type: object
      additionalProperties: false
      required: [filter_id]
      properties:
        filter_id: { type: string, minLength: 1 }
