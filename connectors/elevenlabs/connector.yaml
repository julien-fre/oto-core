# yaml-language-server: $schema=../connector.schema.json
# ElevenLabs API reference: https://elevenlabs.io/docs/api-reference
# Only the JSON reads are described here. The four generations of the Python client
# (create_speech, create_music, create_sound, create_voice_design) answer audio, as
# bytes or as base64 inside JSON, which the format cannot say yet ("réponse autre
# que JSON", docs/conception/format-de-description.md): they stay out of this file.
connector:
  name: elevenlabs
  label: ElevenLabs
  namespace: elevenlabs
  version: 1.0.0
  api_version: v1 (voices on v2)
  base_url: https://api.elevenlabs.io
  auth:
    kind: api_key
    in: header
    name: xi-api-key
    key: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  probe: { function: get_subscription, non_empty: [tier] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "ElevenLabs rejected the request as invalid: detail.message names the faulty argument." }
    - { status: 401, body: { path: detail.status, equals: [quota_exceeded] }, code: quota_exceeded,
        retryable: false, marks_account: quota_exhausted,
        message: "The ElevenLabs account has no credits left for this period: top up or wait for the reset." }
    - { status: 401, body: { path: detail.status, equals: [missing_permissions] }, code: missing_permissions,
        retryable: false,
        message: "This ElevenLabs key is restricted and lacks the permission this call needs: widen it or use another key." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "ElevenLabs did not accept the API key: missing, revoked or mistyped. Retrying unchanged fails the same way." }
    - { status: 403, code: not_allowed, retryable: false,
        message: "ElevenLabs refused the operation: the plan does not include it (some voices, models and output formats are paid only)." }
    - { status: 404, code: not_found, retryable: false,
        message: "ElevenLabs object not found: check the voice id." }
    - { status: 422, code: invalid_request, retryable: false,
        message: "ElevenLabs could not validate the arguments: detail names the faulty field." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "ElevenLabs limit reached (concurrent requests or rate): retry in a moment." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "ElevenLabs is temporarily unavailable: retry later." }

functions:
  - name: get_subscription
    class: read
    description: >-
      The account's plan and credits: tier, credits used this period
      (character_count) against the allowance (character_limit), when they
      reset (next_character_count_reset_unix, UNIX seconds), and the voice
      slots used and allowed. Read it before a batch of generations. A key
      restricted without user_read cannot read it.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Credits left this period
        input: {}
    call: { method: GET, path: /v1/user/subscription }
    cost: { per: request }

  - name: list_voices
    class: read
    description: >-
      The voices the account can use: its own (cloned, designed, saved from
      the library) and the default ones, with each voice's id, name, category,
      labels (accent, age, gender, use case) and a preview URL. Paged by
      next_page_token while has_more is true. A voice id is what a generation
      takes.
    input:
      type: object
      additionalProperties: false
      properties:
        search: { type: string, minLength: 1, description: "Words matched against the name, description, labels and category." }
        voice_type:
          type: string
          enum: [personal, community, default, workspace, non-default]
          description: "Which voices: the account's own, saved from the community library, ElevenLabs' default ones, shared in the workspace, or every voice but the default ones."
        category:
          type: string
          enum: [premade, cloned, generated, professional]
        page_size: { type: integer, minimum: 1, maximum: 100, default: 10 }
        next_page_token: { type: string, minLength: 1, description: "From the previous page's answer." }
    examples:
      - title: Warm default voices
        input: { search: warm, voice_type: default, page_size: 20 }
    call:
      method: GET
      path: /v2/voices
      query: { search: search, voice_type: voice_type, category: category, page_size: page_size,
               next_page_token: next_page_token }
    cost: { per: request }

  - name: get_voice
    class: read
    description: >-
      One voice: name, category, labels, description, preview URL, its default
      settings (stability, similarity_boost, style, speed) and the models it
      was tuned for.
    input:
      type: object
      additionalProperties: false
      required: [voice_id]
      properties:
        voice_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    examples:
      - title: A default voice
        input: { voice_id: cgSgspJ2msm6clMCkdW9 }
    call: { method: GET, path: "/v1/voices/{voice_id}" }
    cost: { per: request }

  - name: list_models
    class: read
    description: >-
      The models and what each can do: text to speech or not, languages,
      maximum characters per request, whether it takes style and speaker
      boost. A model id (eleven_multilingual_v2, eleven_v3…) is what a speech
      generation takes.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Every model
        input: {}
    call: { method: GET, path: /v1/models }
    cost: { per: request }
