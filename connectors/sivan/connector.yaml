# yaml-language-server: $schema=../connector.schema.json
# Sivan External API — read-only workforce data, scoped to the company group of
# the API key. Auth: X-Api-Key header (Authorization: Bearer <key> also accepted).
connector:
  name: sivan
  label: Sivan
  namespace: sivan
  version: 1.0.0
  api_version: external-1.0
  base_url: https://api2.sivan.io
  auth:
    kind: api_key
    in: header
    name: X-Api-Key
    key: api_key
  credential:
    - { name: api_key, label: Company-group API key, secret: true }
  modes: [byo_org]
  timeout_s: 60
  probe:
    function: list_companies
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Sivan rejected the request: check the dates (a period cannot exceed 31 days), or the time-clock module is not enabled for this group." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Sivan rejected the API key: check the company-group key (it is case-sensitive, prefix 'siv_')." }
    - { status: 404, code: not_found, retryable: false,
        message: "Sivan endpoint not found: check the route." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Sivan rate limit reached: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Sivan is temporarily unavailable: retry later." }

functions:
  - name: list_companies
    class: read
    description: >-
      List the activated companies of the group, each with its salaries (and
      their contracts), localisations and opening hours. The API key is scoped
      to one company group; this returns every company in it.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - { title: All companies of the group, input: {} }
    call:
      method: POST
      path: /api/external/companies
    cost: { per: request }

  - name: list_salaries
    class: read
    description: >-
      List the salaries of the group. with_counter adds each salary's hour
      counter (in seconds) for the current ISO week/year; with_absences_counter
      adds the absences counter object. Both default to false.
    input:
      type: object
      additionalProperties: false
      properties:
        with_counter:
          type: boolean
          default: false
          description: "Add the current ISO week/year hour counter (seconds)."
        with_absences_counter:
          type: boolean
          default: false
          description: "Add the absences counter object."
    examples:
      - { title: Salaries with hour counters, input: { with_counter: true } }
      - { title: Bare salary list, input: {} }
    call:
      method: POST
      path: /api/external/salaries
      body: { withCounter: with_counter, withAbsencesCounter: with_absences_counter }
    cost: { per: request }

  - name: list_events
    class: read
    description: >-
      List planned calendar events over a window, grouped by company then
      salary. The period cannot exceed 31 days (inclusive); split a longer range
      into successive windows. with_absence_type adds absenceType on each event
      (null when it is not an absence). companies_ids and salaries_ids, when
      non-empty, restrict the load BEFORE generation — use them on large groups.
    input:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: &day
          type: string
          minLength: 1
          description: "Window start, date or ISO-8601 (2026-01-01, 2026-01-01T13:00:00+01:00)."
        end:
          <<: *day
          description: "Window end, date or ISO-8601; at most 31 days after start (inclusive)."
        with_absence_type:
          type: boolean
          default: false
          description: "Include absenceType on each event."
        companies_ids: &id_list
          type: array
          items: { type: integer }
          description: "When non-empty, only these company ids (applied before generation)."
        salaries_ids: &salary_id_list
          type: array
          items: { type: integer }
          description: "When non-empty, only these salary ids (applied before generation)."
    examples:
      - { title: "One month, whole group", input: { start: "2026-01-01", end: "2026-01-31" } }
      - title: One site, with absence types
        input: { start: "2026-01-01", end: "2026-01-15", with_absence_type: true, companies_ids: [1575] }
    call:
      method: POST
      path: /api/external/events
      body:
        start: start
        end: end
        withAbsenceType: with_absence_type
        companiesIds: companies_ids
        salariesIds: salaries_ids
    cost: { per: request }

  - name: list_badged_events
    class: read
    description: >-
      List time-clock (badged) events over a window, grouped by company then
      salary. Requires the time-clock module to be enabled on the group (400
      otherwise). The period cannot exceed 31 days (inclusive). companies_ids
      and salaries_ids, when non-empty, restrict the load BEFORE generation.
    input:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: *day
        end:
          <<: *day
          description: "Window end, date or ISO-8601; at most 31 days after start (inclusive)."
        companies_ids: *id_list
        salaries_ids: *salary_id_list
    examples:
      - { title: One month of badged events, input: { start: "2026-01-01", end: "2026-01-31" } }
    call:
      method: POST
      path: /api/external/badged-events
      body:
        start: start
        end: end
        companiesIds: companies_ids
        salariesIds: salaries_ids
    cost: { per: request }

  - name: list_absences
    class: read
    description: >-
      List absences overlapping the window, as a flat list. By default includes
      PENDING, ACCEPTED and REFUSED; pass status to restrict to a subset.
      salaries_ids, when non-empty, restricts to the listed salaries.
    input:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: *day
        end:
          <<: *day
          description: "Window end, date or ISO-8601."
        status:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [PENDING, ACCEPTED, REFUSED] }
          description: "Subset of absence statuses; default is all three."
        salaries_ids: *salary_id_list
    examples:
      - { title: Accepted absences of a quarter, input: { start: "2026-01-01", end: "2026-03-31", status: [ACCEPTED] } }
      - { title: All absences of a month, input: { start: "2026-01-01", end: "2026-01-31" } }
    call:
      method: POST
      path: /api/external/absences
      body:
        start: start
        end: end
        status: status
        salariesIds: salaries_ids
    cost: { per: request }

  - name: list_timesheets
    class: read
    description: >-
      List timesheet aggregates per salary and contract over a window: weekly
      totals and daily planned/done events, in seconds. Root and week objects
      may carry extra numeric aggregates (overtime, paid vacation, night time…),
      returned as-is. The period cannot exceed 31 days (inclusive). salaries_ids,
      when non-empty, restricts to the listed salaries.
    input:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: *day
        end:
          <<: *day
          description: "Window end, date or ISO-8601; at most 31 days after start (inclusive)."
        salaries_ids: *salary_id_list
    examples:
      - { title: One salary over a month, input: { start: "2026-01-01", end: "2026-01-31", salaries_ids: [42] } }
    call:
      method: POST
      path: /api/external/timesheets
      body:
        start: start
        end: end
        salariesIds: salaries_ids
    cost: { per: request }

exposure:
  mode: per_connector
  tool: sivan
