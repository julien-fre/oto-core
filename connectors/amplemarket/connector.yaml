# yaml-language-server: $schema=../connector.schema.json
# Amplemarket API reference: https://docs.amplemarket.com/api-reference/introduction
#
# One workspace API key, sent as "Authorization: Bearer <key>"; an admin
# creates it in Amplemarket, Settings > API. Bodies and responses are JSON.
#
# Covered: the account and its users, personas and territories; Prospect Hub
# accounts and contacts; the people and company searcher; single and batch
# enrichment of people and companies; batch email validation; lead lists;
# sequences (list, add leads); tasks; calls (list, log, dispositions);
# mailboxes; email and domain exclusion lists; phone-number review; job
# openings. Adding leads to a sequence starts outreach to them, and lifting an
# exclusion lets outreach reach those addresses again: both are sensitive.
#
# Not declared, because the format cannot say it:
# - pagination: lists page by cursor, the next page announced in
#   _links.next.href, a relative URL carrying page[after]; the agent passes
#   that cursor back as page_after. The searcher pages by number in the body
#   (page, page_size) and answers _pagination {page, page_size, total_pages,
#   total}.
# - per-endpoint rate limits: 500 requests/min overall, 300/min on the people
#   search, 350/min on the single person enrichment, 30/min on adding leads to
#   a sequence, one daily-limit change per mailbox per minute and per hour.
# - batches (enrichment, email validation) are asynchronous: start, then read
#   the results until the status is final, or cancel.
# - get_email_validation's page_size/page_after/page_before are not listed on
#   that endpoint's reference page: they come from the API's pagination guide,
#   which names email validation as cursor-paged (cursor on the email).
#
# Not covered: the Duo custom-signal webhook (a per-workspace URL, not an API
# route) and call recordings (a binary download).
connector:
  name: amplemarket
  label: Amplemarket
  namespace: amplemarket
  version: 1.0.0
  api_version: v1
  base_url: https://api.amplemarket.com
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  query_arrays: repeat
  rate_limit: { requests: 500, seconds: 60 }
  probe: { function: get_account_info, non_empty: [id] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Amplemarket rejected the request (unsupported_value or missing_field): _errors[].detail and _errors[].source.pointer name the faulty field." }
    - { status: 401, code: key_invalid, retryable: false,
        message: "Amplemarket did not accept the API key: missing, revoked or mistyped. Retrying unchanged fails the same way." }
    - { status: 402, code: insufficient_credits, retryable: false,
        message: "The Amplemarket account has no credits left for this operation (enrichment, reveal or email validation)." }
    - { status: 403, code: forbidden, retryable: false,
        message: "The Amplemarket user behind the key is not allowed to do this." }
    - { status: 404, code: not_found, retryable: false,
        message: "No such object in this Amplemarket account (or no matching person): check the id or the matching fields." }
    - { status: 409, code: conflict, retryable: false,
        message: "Amplemarket refused the change because it conflicts with existing data, such as a contact with this email already existing." }
    - { status: 410, code: gone, retryable: false,
        message: "This Amplemarket object no longer exists (a deleted lead list, a closed job opening)." }
    - { status: 422, code: validation_failed, retryable: false,
        message: "Amplemarket could not process the leads: validation_errors names each faulty lead." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Amplemarket rate limit reached (500/min overall; 30/min when adding leads to a sequence): wait before retrying." }
    - { status: 451, code: unavailable_for_legal_reasons, retryable: false,
        message: "Amplemarket found this person but removed their data for privacy reasons." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Amplemarket is temporarily unavailable: retry later." }

functions:
  # --- Workspace ----------------------------------------------------------

  - name: get_account_info
    class: read
    description: >-
      The Amplemarket workspace the API key belongs to: {id, name}.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The workspace, input: {} }
    call: { method: GET, path: /account-info }
    cost: { per: request }

  - name: list_users
    class: read
    description: >-
      The users of the workspace: {users: [{id, email, name, role, status}],
      _links}. A user id is what list_tasks, log_call and review_phone_number
      take; a user email is what owner fields take. For the next page, pass
      the page[after] value of _links.next.href as page_after.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, description: "Filter by user status." }
        role: { type: string, description: "Filter by user role." }
        email: { type: string, description: "Filter by user email." }
        page_size: &page_size { type: integer, minimum: 1, description: "Results per page." }
        page_after: &page_after { type: string, minLength: 1, description: "Cursor of the next page: the page[after] value of _links.next.href." }
        page_before: &page_before { type: string, minLength: 1, description: "Cursor of the previous page: the page[before] value of _links.prev.href." }
    examples:
      - { title: Find a user by email, input: { email: jane@example.com } }
    call:
      method: GET
      path: /users
      query: { status: status, role: role, email: email, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: list_personas
    class: read
    description: >-
      The buyer personas defined in the workspace: {personas, _links}, at most
      20 per page.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: "Persona name, partial and case-insensitive." }
        enabled: { type: boolean, description: "Only enabled (true) or disabled (false) personas." }
        page_size: { type: integer, minimum: 1, maximum: 20, description: "Results per page (max 20)." }
        page_after: *page_after
    examples:
      - { title: Enabled personas, input: { enabled: true } }
    call:
      method: GET
      path: /personas
      query: { name: name, enabled: enabled, "page[size]": page_size, "page[after]": page_after }
    cost: { per: request }

  - name: list_territories
    class: read
    description: >-
      The sales territories of the workspace: {territories, _links}, at most
      20 per page.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: "Territory name, partial and case-insensitive." }
        page_size: { type: integer, minimum: 1, maximum: 20, description: "Results per page (max 20)." }
        page_after: *page_after
    examples:
      - { title: All territories, input: {} }
    call:
      method: GET
      path: /territories
      query: { name: name, "page[size]": page_size, "page[after]": page_after }
    cost: { per: request }

  - name: list_accounts
    class: read
    description: >-
      Prospect Hub accounts (companies tracked in Amplemarket): {accounts:
      [{id, name, domain, linkedin_url, industry, size, location, owner,
      tags}], _links}, at most 50 per page. name matches partially; domain
      and owner_email match exactly.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: "Account name, partial and case-insensitive." }
        domain: { type: string, description: "Exact company domain." }
        owner_email: { type: string, description: "Exact email of the account owner." }
        tags: { type: array, items: { type: string }, description: "Tag names." }
        page_size: { type: integer, minimum: 1, maximum: 50, description: "Results per page (default 10, max 50)." }
        page_after: *page_after
    examples:
      - { title: An account by domain, input: { domain: example.com } }
    call:
      method: GET
      path: /accounts
      query: { name: name, domain: domain, owner_email: owner_email, "tags[]": tags, "page[size]": page_size, "page[after]": page_after }
    cost: { per: request }

  - name: get_account
    class: read
    description: >-
      One Prospect Hub account by id, with its description, owner, tags and
      AI insights (insights, insights_status).
    input:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string, minLength: 1, description: "Account id, from list_accounts." }
    examples:
      - { title: One account, input: { account_id: acc_123 } }
    call: { method: GET, path: "/accounts/{account_id}" }
    cost: { per: request }

  - name: list_mailboxes
    class: read
    description: >-
      The sending mailboxes: {mailboxes: [{id, email, email_provider,
      daily_email_limit, status, user}], _links}, at most 20 per page.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { enum: [active, inactive, needs_reconnection], description: "Mailbox status." }
        email_provider: { enum: [google, outlook, other, other_mixed], description: "Email provider." }
        user_email: { type: string, description: "Email of the mailbox's user." }
        page_size: { type: integer, minimum: 1, maximum: 20, description: "Results per page (max 20)." }
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: Mailboxes to reconnect, input: { status: needs_reconnection } }
    call:
      method: GET
      path: /mailboxes
      query: { status: status, email_provider: email_provider, user_email: user_email, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: update_mailbox_daily_limit
    class: write
    description: >-
      Set how many emails a mailbox may send per day. Amplemarket accepts one
      change per mailbox per minute and per hour.
    input:
      type: object
      additionalProperties: false
      required: [mailbox_id, daily_email_limit]
      properties:
        mailbox_id: { type: string, minLength: 1, description: "Mailbox id, from list_mailboxes." }
        daily_email_limit: { type: integer, minimum: 0, description: "New daily email limit." }
    examples:
      - { title: Lower a mailbox to 30 emails a day, input: { mailbox_id: mbx_1, daily_email_limit: 30 } }
    call:
      method: PATCH
      path: "/mailboxes/{mailbox_id}"
      body: { daily_email_limit: daily_email_limit }
    cost: { per: request }

  # --- Searcher -----------------------------------------------------------

  - name: search_people
    class: read
    description: >-
      Search Amplemarket's people database; every filter is optional and they
      combine with AND (values inside one list combine with OR). Answers
      {results: [{id, name, title, linkedin_url, location, company}],
      _pagination: {page, page_size, total_pages, total}}; no email is
      revealed: use find_person or start_person_enrichment for that. Pages
      are numbered from 1, page_size is capped at 100. Seniorities, sizes,
      revenue and funding take the listed values; industries, departments and
      job functions take Amplemarket's supported values (see the API
      reference). 300 calls per minute.
    input:
      type: object
      additionalProperties: false
      properties:
        person_name: { type: string, description: "Person name." }
        person_titles: &strings { type: array, items: { type: string } }
        person_title_exact_match: { type: boolean, description: "Match person_titles exactly instead of loosely." }
        person_keywords: *strings
        person_exclude_keywords: *strings
        person_seniorities: &seniorities
          type: array
          items: { enum: [Owner, Founder, C-Suite, Partner, VP, Head, Director, Manager, Senior, Entry, Intern, Other] }
        person_departments: *strings
        person_job_functions: *strings
        person_locations: *strings
        person_exclude_locations: *strings
        person_linkedin_presence:
          type: array
          items: { enum: [influencer, large, limited, micro_influencer, moderate, none] }
        education_company_ids: *strings
        education_company_names: *strings
        linkedin_networks: { type: array, items: { type: string }, description: "Emails of workspace users whose LinkedIn network the people must be in." }
        exclude_linkedin_networks: { type: array, items: { type: string }, description: "Emails of workspace users whose LinkedIn network is excluded." }
        company_names: *strings
        company_exclude_names: *strings
        company_ids: *strings
        company_exclude_ids: *strings
        company_domains: *strings
        company_exclude_domains: *strings
        company_linkedin_urls: *strings
        company_exclude_linkedin_urls: *strings
        company_domains_match_subsidiaries_and_affiliates: &subsidiaries { type: boolean, description: "Let company_domains also match subsidiaries and affiliates." }
        company_locations: *strings
        company_exclude_locations: *strings
        company_keywords: *strings
        company_exclude_keywords: *strings
        company_focuses: &focuses { type: array, items: { enum: [b2b, b2c] } }
        company_types: &company_types
          type: array
          items: { enum: [Public Company, Educational, Self Employed, Government Agency, Non Profit, Self Owned, Privately Held, Partnership] }
        company_sizes: &company_sizes
          type: array
          items: { enum: [1-10 employees, 11-50 employees, 51-200 employees, 201-500 employees, 501-1000 employees, 1001-5000 employees, 5001-10000 employees, 10001+ employees] }
        company_industries: *strings
        company_exclude_industries: *strings
        company_investors: { type: array, items: { type: string }, description: "Investor names: companies funded by any of them." }
        company_shares_investors_with: { type: array, items: { type: string }, description: "Company names: companies sharing an investor with any of them." }
        company_revenue: &revenue
          type: array
          items: { enum: [$0-$1M, $1M-$10M, $10M-$100M, $100M-$1B, $1B+] }
        company_founded_date: &year_range
          type: object
          additionalProperties: false
          properties: { min: { type: integer }, max: { type: integer } }
        company_web_traffic_rank: &rank_range
          type: object
          additionalProperties: false
          properties: { min: { type: integer }, max: { type: integer } }
        job_openings: &job_openings
          type: object
          additionalProperties: false
          description: "Companies with open positions matching these titles."
          properties: { titles: { type: array, items: { type: string } } }
        news: &news
          type: object
          additionalProperties: false
          description: "Companies with recent news in these categories."
          properties:
            categories: { type: array, items: { type: string } }
            range_months: { type: integer, minimum: 1 }
        headcount_growth: &headcount_growth
          type: object
          additionalProperties: false
          description: "Total headcount growth over 3, 6 or 12 months; growth_rates are {min?, max?} percentages."
          properties:
            growth_rates: { type: array, items: { type: object } }
            time_frame_in_months: { enum: [3, 6, 12] }
        crm_account_owner: &crm_owner { type: array, items: { type: string }, description: "CRM account owner emails (needs a connected Salesforce or HubSpot)." }
        company_last_funding: &last_funding
          type: object
          additionalProperties: false
          properties:
            round_type:
              type: array
              items: { enum: [pre_seed, seed, angel, venture_round_unknown_series, series_a, series_b, series_c, series_d, series_e, series_f, series_g, series_h] }
            range_months: { type: integer, minimum: 1 }
        company_linkedin_presence: &company_presence
          type: array
          items: { enum: [large, limited, massive, moderate, none] }
        page: &search_page { type: integer, minimum: 1, description: "Page number, from 1." }
        page_size: { type: integer, minimum: 1, maximum: 100, description: "Results per page (capped at 100)." }
    examples:
      - title: Heads of sales in French SaaS companies of 51-200 people
        input:
          person_titles: [Head of Sales, VP Sales]
          person_locations: [France]
          company_sizes: [51-200 employees]
          company_keywords: [SaaS]
          page_size: 25
    call:
      method: POST
      path: /people/search
      body:
        person_name: person_name
        person_titles: person_titles
        person_title_exact_match: person_title_exact_match
        person_keywords: person_keywords
        person_exclude_keywords: person_exclude_keywords
        person_seniorities: person_seniorities
        person_departments: person_departments
        person_job_functions: person_job_functions
        person_locations: person_locations
        person_exclude_locations: person_exclude_locations
        person_linkedin_presence: person_linkedin_presence
        education_company_ids: education_company_ids
        education_company_names: education_company_names
        linkedin_networks: linkedin_networks
        exclude_linkedin_networks: exclude_linkedin_networks
        company_names: company_names
        company_exclude_names: company_exclude_names
        company_ids: company_ids
        company_exclude_ids: company_exclude_ids
        company_domains: company_domains
        company_exclude_domains: company_exclude_domains
        company_linkedin_urls: company_linkedin_urls
        company_exclude_linkedin_urls: company_exclude_linkedin_urls
        company_domains_match_subsidiaries_and_affiliates: company_domains_match_subsidiaries_and_affiliates
        company_locations: company_locations
        company_exclude_locations: company_exclude_locations
        company_keywords: company_keywords
        company_exclude_keywords: company_exclude_keywords
        company_focuses: company_focuses
        company_types: company_types
        company_sizes: company_sizes
        company_industries: company_industries
        company_exclude_industries: company_exclude_industries
        company_investors: company_investors
        company_shares_investors_with: company_shares_investors_with
        company_revenue: company_revenue
        company_founded_date: company_founded_date
        company_web_traffic_rank: company_web_traffic_rank
        job_openings: job_openings
        news: news
        headcount_growth: headcount_growth
        crm_account_owner: crm_account_owner
        company_last_funding: company_last_funding
        company_linkedin_presence: company_linkedin_presence
        page: page
        page_size: page_size
    cost: { per: request }

  - name: search_companies
    class: read
    description: >-
      Search Amplemarket's company database; every filter is optional and
      they combine with AND (values inside one list combine with OR). Answers
      {results: [{id, name, domain, linkedin_url, industry, size, location}],
      _pagination: {page, page_size, total_pages, total}}. Pages are numbered
      from 1, page_size is capped at 50. Industries take Amplemarket's
      supported values (see the API reference).
    input:
      type: object
      additionalProperties: false
      properties:
        company_names: *strings
        company_exclude_names: *strings
        company_ids: *strings
        company_exclude_ids: *strings
        company_domains: *strings
        company_exclude_domains: *strings
        company_linkedin_urls: *strings
        company_exclude_linkedin_urls: *strings
        company_domains_match_subsidiaries_and_affiliates: *subsidiaries
        company_locations: *strings
        company_exclude_locations: *strings
        company_keywords: *strings
        company_exclude_keywords: *strings
        company_focuses: *focuses
        company_types: *company_types
        company_sizes: *company_sizes
        company_industries: *strings
        company_exclude_industries: *strings
        company_investors: { type: array, items: { type: string }, description: "Investor names: companies funded by any of them." }
        company_shares_investors_with: { type: array, items: { type: string }, description: "Company names: companies sharing an investor with any of them." }
        company_revenue: *revenue
        company_founded_date: *year_range
        company_web_traffic_rank: *rank_range
        job_openings: *job_openings
        news: *news
        headcount_growth: *headcount_growth
        crm_account_owner: *crm_owner
        company_last_funding: *last_funding
        company_linkedin_presence: *company_presence
        page: *search_page
        page_size: { type: integer, minimum: 1, maximum: 50, description: "Results per page (capped at 50)." }
    examples:
      - title: B2B companies in France that raised a seed or series A
        input:
          company_locations: [France]
          company_focuses: [b2b]
          company_last_funding: { round_type: [seed, series_a], range_months: 12 }
    call:
      method: POST
      path: /companies/search
      body:
        company_names: company_names
        company_exclude_names: company_exclude_names
        company_ids: company_ids
        company_exclude_ids: company_exclude_ids
        company_domains: company_domains
        company_exclude_domains: company_exclude_domains
        company_linkedin_urls: company_linkedin_urls
        company_exclude_linkedin_urls: company_exclude_linkedin_urls
        company_domains_match_subsidiaries_and_affiliates: company_domains_match_subsidiaries_and_affiliates
        company_locations: company_locations
        company_exclude_locations: company_exclude_locations
        company_keywords: company_keywords
        company_exclude_keywords: company_exclude_keywords
        company_focuses: company_focuses
        company_types: company_types
        company_sizes: company_sizes
        company_industries: company_industries
        company_exclude_industries: company_exclude_industries
        company_investors: company_investors
        company_shares_investors_with: company_shares_investors_with
        company_revenue: company_revenue
        company_founded_date: company_founded_date
        company_web_traffic_rank: company_web_traffic_rank
        job_openings: job_openings
        news: news
        headcount_growth: headcount_growth
        crm_account_owner: crm_account_owner
        company_last_funding: company_last_funding
        company_linkedin_presence: company_linkedin_presence
        page: page
        page_size: page_size
    cost: { per: request }

  # --- Enrichment ---------------------------------------------------------

  - name: find_person
    class: read
    description: >-
      Enrich ONE person, matched by email, by LinkedIn URL, or by name with
      company_name or company_domain (title helps). Answers the person
      (name, title, headline, location, linkedin_url, company, experience)
      and, when asked with reveal_email / reveal_phone_numbers, the email and
      phone numbers; a reveal consumes credits (402 insufficient_credits when
      none are left). 404 person_not_found when nobody matches. 350 calls per
      minute; for many people, use start_person_enrichment.
    input:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, description: "Email to match." }
        linkedin_url: { type: string, description: "LinkedIn profile URL to match." }
        name: { type: string, description: "Full name, with company_name or company_domain." }
        title: { type: string, description: "Job title, to disambiguate a name match." }
        company_name: { type: string }
        company_domain: { type: string }
        reveal_email: { type: boolean, description: "Reveal the email (consumes credits)." }
        reveal_phone_numbers: { type: boolean, description: "Reveal phone numbers (consumes credits)." }
    examples:
      - { title: Email of a LinkedIn profile, input: { linkedin_url: "https://www.linkedin.com/in/jane-doe", reveal_email: true } }
      - { title: Match by name and company, input: { name: Jane Doe, company_domain: example.com } }
    call:
      method: GET
      path: /people/find
      query: { email: email, linkedin_url: linkedin_url, name: name, title: title, company_name: company_name, company_domain: company_domain, reveal_email: reveal_email, reveal_phone_numbers: reveal_phone_numbers }
    cost: { per: request }

  - name: start_person_enrichment
    class: write
    description: >-
      Start a batch enrichment of up to 10,000 people, each identified by
      email, linkedin_url, or name with company_name or company_domain.
      Answers 202 {id, status, results, _links}: read the results with
      get_person_enrichment until the status is final, or stop it with
      cancel_person_enrichment. Reveals consume credits; 15,000 enrichments
      per hour.
    input:
      type: object
      additionalProperties: false
      required: [leads]
      properties:
        leads:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            properties:
              email: { type: string }
              linkedin_url: { type: string }
              name: { type: string }
              title: { type: string }
              company_name: { type: string }
              company_domain: { type: string }
        reveal_email: { type: boolean, description: "Reveal emails (consumes credits)." }
        reveal_phone_numbers: { type: boolean, description: "Reveal phone numbers (consumes credits)." }
    examples:
      - title: Emails of two LinkedIn profiles
        input:
          leads: [{ linkedin_url: "https://www.linkedin.com/in/jane-doe" }, { linkedin_url: "https://www.linkedin.com/in/john-roe" }]
          reveal_email: true
    call:
      method: POST
      path: /people/enrichment-requests
      body: { leads: leads, reveal_email: reveal_email, reveal_phone_numbers: reveal_phone_numbers }
    cost: { per: request }

  - name: get_person_enrichment
    class: read
    description: >-
      The status and results of a person enrichment batch: {id, status,
      results, _errors}.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: &request_id { type: string, minLength: 1, description: "Batch id, from the start call." }
    examples:
      - { title: A batch's results, input: { request_id: req_1 } }
    call: { method: GET, path: "/people/enrichment-requests/{request_id}" }
    cost: { per: request }

  - name: cancel_person_enrichment
    class: write
    description: >-
      Stop a running person enrichment batch; results already produced stay
      readable.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: *request_id
    examples:
      - { title: Stop a batch, input: { request_id: req_1 } }
    call:
      method: PATCH
      path: "/people/enrichment-requests/{request_id}"
      constants: { body: { status: canceled } }
    cost: { per: request }

  - name: find_company
    class: read
    description: >-
      Enrich ONE company by domain or LinkedIn URL: name, overview, website,
      industry, size, estimated employees, locations, keywords, logo.
    input:
      type: object
      additionalProperties: false
      properties:
        domain: { type: string, description: "Company domain." }
        linkedin_url: { type: string, description: "Company LinkedIn URL." }
    examples:
      - { title: A company by domain, input: { domain: example.com } }
    call:
      method: GET
      path: /companies/find
      query: { domain: domain, linkedin_url: linkedin_url }
    cost: { per: request }

  - name: start_company_enrichment
    class: write
    description: >-
      Start a batch enrichment of up to 10,000 companies, each identified by
      domain or linkedin_url. Answers 202 {id, status, results, _links}: read
      the results with get_company_enrichment until the status is final.
    input:
      type: object
      additionalProperties: false
      required: [companies]
      properties:
        companies:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            properties:
              domain: { type: string }
              linkedin_url: { type: string }
    examples:
      - { title: Two companies, input: { companies: [{ domain: example.com }, { domain: example.org }] } }
    call:
      method: POST
      path: /companies/enrichment-requests
      body: { companies: companies }
    cost: { per: request }

  - name: get_company_enrichment
    class: read
    description: >-
      The status and results of a company enrichment batch: {id, status,
      results, _errors}.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: *request_id
    examples:
      - { title: A batch's results, input: { request_id: req_2 } }
    call: { method: GET, path: "/companies/enrichment-requests/{request_id}" }
    cost: { per: request }

  - name: cancel_company_enrichment
    class: write
    description: >-
      Stop a running company enrichment batch.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: *request_id
    examples:
      - { title: Stop a batch, input: { request_id: req_2 } }
    call:
      method: PATCH
      path: "/companies/enrichment-requests/{request_id}"
      constants: { body: { status: canceled } }
    cost: { per: request }

  # --- Email validation ---------------------------------------------------

  - name: start_email_validation
    class: write
    description: >-
      Start validating up to 100,000 emails (15,000 per hour); consumes
      credits. Answers 202 {id, status, results, _links}: read the results
      with get_email_validation until the status is final.
    input:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required: [email]
            properties: { email: { type: string } }
    examples:
      - { title: Validate two emails, input: { emails: [{ email: jane@example.com }, { email: john@example.com }] } }
    call:
      method: POST
      path: /email-validations
      body: { emails: emails }
    cost: { per: request }

  - name: get_email_validation
    class: read
    description: >-
      The status and results of an email validation batch, a page at a time:
      {id, status, results: [{email, result, catch_all}], _links}.
    input:
      type: object
      additionalProperties: false
      required: [validation_id]
      properties:
        validation_id: &validation_id { type: string, minLength: 1, description: "Batch id, from start_email_validation." }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: A batch's results, input: { validation_id: val_1 } }
    call:
      method: GET
      path: "/email-validations/{validation_id}"
      query: { "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: cancel_email_validation
    class: write
    description: >-
      Stop a running email validation batch.
    input:
      type: object
      additionalProperties: false
      required: [validation_id]
      properties:
        validation_id: *validation_id
    examples:
      - { title: Stop a batch, input: { validation_id: val_1 } }
    call:
      method: PATCH
      path: "/email-validations/{validation_id}"
      constants: { body: { status: canceled } }
    cost: { per: request }

  # --- Job openings -------------------------------------------------------

  - name: list_job_openings
    class: read
    description: >-
      A company's open positions, the company given by Amplemarket id, domain
      or LinkedIn URL: {company, job_openings: [{id, title, url,
      raw_location, seniorities, departments, first_seen_at}], _links}, at
      most 100 per page.
    input:
      type: object
      additionalProperties: false
      properties:
        company_id: { type: string, description: "Amplemarket company id." }
        domain: { type: string, description: "Company domain." }
        linkedin_url: { type: string, description: "Company LinkedIn URL." }
        person_seniorities: *seniorities
        person_departments: *strings
        person_job_functions: *strings
        only_remote: { type: boolean, description: "Only remote positions." }
        page_size: { type: integer, minimum: 1, maximum: 100, description: "Results per page (default 10, max 100)." }
        page_after: *page_after
    examples:
      - { title: Open sales positions, input: { domain: example.com, person_departments: [Sales] } }
    call:
      method: GET
      path: /job-openings
      query: { company_id: company_id, domain: domain, linkedin_url: linkedin_url, "person_seniorities[]": person_seniorities, "person_departments[]": person_departments, "person_job_functions[]": person_job_functions, only_remote: only_remote, "page[size]": page_size, "page[after]": page_after }
    cost: { per: request }

  - name: get_job_opening
    class: read
    description: >-
      One job opening with its description, salary and contract types; 410
      once it has closed.
    input:
      type: object
      additionalProperties: false
      required: [job_opening_id]
      properties:
        job_opening_id: { type: string, minLength: 1 }
    examples:
      - { title: One job opening, input: { job_opening_id: job_1 } }
    call: { method: GET, path: "/job-openings/{job_opening_id}" }
    cost: { per: request }

  # --- Lead lists ---------------------------------------------------------

  - name: list_lead_lists
    class: read
    description: >-
      The lead lists: {lead_lists: [{id, name, status, type, owner, shared,
      created_at}], _links}.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, description: "Lead list status." }
        owner_id: { type: string, description: "Owner user id." }
        owner_email: { type: string, description: "Owner user email." }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: Jane's lead lists, input: { owner_email: jane@example.com } }
    call:
      method: GET
      path: /lead-lists
      query: { status: status, owner_id: owner_id, owner_email: owner_email, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: get_lead_list
    class: read
    description: >-
      One lead list with a page of its leads (emails and phone numbers once
      processed): {id, name, status, type, options, leads, _links}. 410 if
      the list was deleted.
    input:
      type: object
      additionalProperties: false
      required: [lead_list_id]
      properties:
        lead_list_id: &lead_list_id { type: string, minLength: 1, description: "Lead list id." }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: One lead list, input: { lead_list_id: ll_1 } }
    call:
      method: GET
      path: "/lead-lists/{lead_list_id}"
      query: { "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: create_lead_list
    class: write
    description: >-
      Create a lead list from up to 10,000 leads, owned by the user whose
      email is owner. type says how leads are identified: linkedin
      (linkedin_url), email, or titles_and_company (title with company_name
      or company_domain). options reveal_phone_numbers, validate_email and
      enrich consume credits. Answers 202: the list is processed
      asynchronously; follow its status with get_lead_list.
    input:
      type: object
      additionalProperties: false
      required: [owner, type, leads]
      properties:
        name: { type: string }
        owner: { type: string, description: "Email of the owning user." }
        type: &lead_list_type { enum: [linkedin, email, titles_and_company] }
        shared: { type: boolean, default: false, description: "Share the list with the workspace." }
        visible: { type: boolean }
        options:
          type: object
          additionalProperties: false
          properties:
            reveal_phone_numbers: { type: boolean }
            validate_email: { type: boolean }
            enrich: { type: boolean }
        leads: &lead_list_leads
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            properties:
              linkedin_url: { type: string }
              email: { type: string }
              title: { type: string }
              company_name: { type: string }
              company_domain: { type: string }
              phone_numbers: { type: array, items: { type: string } }
              context: { type: object, description: "Free key/value context kept with the lead." }
    examples:
      - title: A list of two LinkedIn profiles
        input:
          name: Event attendees
          owner: jane@example.com
          type: linkedin
          leads: [{ linkedin_url: "https://www.linkedin.com/in/jane-doe" }, { linkedin_url: "https://www.linkedin.com/in/john-roe" }]
    call:
      method: POST
      path: /lead-lists
      body: { name: name, owner: owner, type: type, shared: shared, visible: visible, options: options, leads: leads }
    cost: { per: request }

  - name: add_leads_to_lead_list
    class: write
    description: >-
      Add up to 10,000 leads to an existing lead list (a list holds 60,000 at
      most; beyond, leads are added partially). Answers {total,
      total_added_to_lead_list}.
    input:
      type: object
      additionalProperties: false
      required: [lead_list_id, leads]
      properties:
        lead_list_id: *lead_list_id
        type: *lead_list_type
        leads: *lead_list_leads
    examples:
      - { title: Add one lead, input: { lead_list_id: ll_1, leads: [{ email: jane@example.com }] } }
    call:
      method: POST
      path: "/lead-lists/{lead_list_id}/leads"
      body: { type: type, leads: leads }
    cost: { per: request }

  # --- Sequences ----------------------------------------------------------

  - name: list_sequences
    class: read
    description: >-
      The sequences: {sequences: [{id, name, status, created_by, ...}],
      _links}. A sequence id is what add_leads_to_sequence takes.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, description: "Sequence status." }
        name: { type: string, description: "Sequence name, case-insensitive." }
        created_by_user_id: { type: string }
        created_by_user_email: { type: string }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: Active sequences, input: { status: active } }
    call:
      method: GET
      path: /sequences
      query: { status: status, name: name, created_by_user_id: created_by_user_id, created_by_user_email: created_by_user_email, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: add_leads_to_sequence
    class: sensitive
    description: >-
      Enroll leads in a sequence, each {email or linkedin_url, data?,
      routing?, overrides?}: data fills the sequence's variables, overrides
      lifts the recently-contacted, exclusion-list or duplicate checks. An
      active sequence starts emailing or messaging them. Answers the counts:
      total, total_added_to_sequence and those skipped (duplicates, exclusion
      list, recently contacted, already in this or another sequence). 30
      calls per minute.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id, leads]
      properties:
        sequence_id: { type: string, minLength: 1, description: "Sequence id, from list_sequences." }
        leads:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              email: { type: string }
              linkedin_url: { type: string }
              data: { type: object, description: "Sequence variables, string values up to 1024 characters." }
              routing:
                type: object
                additionalProperties: false
                properties: { salesforce_account_id: { type: string } }
              overrides:
                type: object
                additionalProperties: false
                properties:
                  ignore_recently_contacted: { type: boolean }
                  ignore_exclusion_list: { type: boolean }
                  ignore_duplicate_leads_in_other_draft_sequences: { type: boolean }
                  ignore_duplicate_leads_in_other_active_sequences: { type: boolean }
        settings:
          type: object
          additionalProperties: false
          properties:
            leads_distribution: { enum: [sequence_senders, custom_mailboxes] }
            mailboxes: { type: array, items: { type: string }, description: "Mailbox emails, with custom_mailboxes." }
    examples:
      - title: Enroll one lead with a variable
        input:
          sequence_id: seq_1
          leads: [{ email: jane@example.com, data: { first_name: Jane } }]
    call:
      method: POST
      path: "/sequences/{sequence_id}/leads"
      body: { leads: leads, settings: settings }
    cost: { per: request }
    confirm:
      summary: "Enroll these leads in Amplemarket sequence {sequence_id}: an active sequence starts emailing or messaging them."

  # --- Contacts -----------------------------------------------------------

  - name: get_contact
    class: read
    description: >-
      One contact by id: name, email, title, company, owner, phone numbers,
      sequences.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: { type: string, minLength: 1 }
    examples:
      - { title: One contact, input: { contact_id: ct_1 } }
    call: { method: GET, path: "/contacts/{contact_id}" }
    cost: { per: request }

  - name: get_contact_by_email
    class: read
    description: >-
      One contact by email; 404 when no contact has it.
    input:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, minLength: 3 }
    examples:
      - { title: A contact by email, input: { email: jane@example.com } }
    call: { method: GET, path: "/contacts/email/{email}" }
    cost: { per: request }

  - name: list_contacts
    class: read
    description: >-
      Contacts by id (up to 20), or by name and/or Prospect Hub account:
      {contacts}.
    input:
      type: object
      additionalProperties: false
      properties:
        ids: { type: array, maxItems: 20, items: { type: string }, description: "Contact ids (max 20)." }
        name: { type: string, description: "Contact name." }
        account_id: { type: string, description: "Prospect Hub account id." }
    examples:
      - { title: Contacts of an account, input: { account_id: acc_123 } }
    call:
      method: GET
      path: /contacts
      query: { "ids[]": ids, name: name, account_id: account_id }
    cost: { per: request }

  - name: create_contact
    class: write
    description: >-
      Create a contact (409 if one already has this email). The Prospect Hub
      account is account_id, else resolved from crm_account_id, then
      company_domain, then company_name. phone_numbers are attached as
      user-uploaded numbers.
    input:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, minLength: 3 }
        first_name: { type: string }
        last_name: { type: string }
        title: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        industry: { type: string }
        linkedin_url: { type: string }
        owner_email: { type: string, description: "Email of the owning user." }
        account_id: { type: string }
        crm_account_id: { type: string }
        company_domain: { type: string }
        company_name: { type: string }
        phone_numbers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number]
            properties:
              number: { type: string }
              kind: { enum: [mobile, office, phone, landline, voip, direct, fax] }
    examples:
      - { title: A new contact, input: { email: jane@example.com, first_name: Jane, last_name: Doe, company_domain: example.com } }
    call:
      method: POST
      path: /contacts
      body: { email: email, first_name: first_name, last_name: last_name, title: title, city: city, state: state, country: country, industry: industry, linkedin_url: linkedin_url, owner_email: owner_email, account_id: account_id, crm_account_id: crm_account_id, company_domain: company_domain, company_name: company_name, phone_numbers: phone_numbers }
    cost: { per: request }

  # --- Tasks --------------------------------------------------------------

  - name: list_tasks
    class: read
    description: >-
      One user's tasks (calls, LinkedIn steps, manual emails of sequences):
      {tasks, _links}. type and status take the values of list_task_types and
      list_task_statuses; keyword matches the contact's name, email or
      company.
    input:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: string, minLength: 1, description: "User id, from list_users." }
        status: { type: string }
        type: { type: string }
        automatic: { type: boolean }
        sequence_key: { type: string }
        keyword: { type: string }
        contact_local_time_from: { type: integer, minimum: 0, maximum: 23 }
        contact_local_time_to: { type: integer, minimum: 0, maximum: 23 }
        message_opens: { type: integer, minimum: 0 }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: A user's tasks, input: { user_id: usr_1 } }
    call:
      method: GET
      path: /tasks
      query: { user_id: user_id, status: status, type: type, automatic: automatic, sequence_key: sequence_key, keyword: keyword, contact_local_time_from: contact_local_time_from, contact_local_time_to: contact_local_time_to, message_opens: message_opens, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: list_task_statuses
    class: read
    description: The task statuses list_tasks filters on.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Task statuses, input: {} }
    call: { method: GET, path: /tasks/statuses }
    cost: { per: request }

  - name: list_task_types
    class: read
    description: The task types list_tasks filters on.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Task types, input: {} }
    call: { method: GET, path: /tasks/types }
    cost: { per: request }

  - name: complete_task
    class: write
    description: >-
      Mark a task done: the sequence moves the lead to its next step, or
      completes the lead with set_lead_to_completed.
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: &task_id { type: string, minLength: 1 }
        set_lead_to_completed: { type: boolean }
    examples:
      - { title: Complete a task, input: { task_id: tsk_1 } }
    call:
      method: POST
      path: "/tasks/{task_id}/complete"
      body: { set_lead_to_completed: set_lead_to_completed }
    cost: { per: request }

  - name: skip_task
    class: write
    description: Skip a task; the sequence moves the lead to its next step.
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: *task_id
    examples:
      - { title: Skip a task, input: { task_id: tsk_1 } }
    call: { method: POST, path: "/tasks/{task_id}/skip" }
    cost: { per: request }

  # --- Calls --------------------------------------------------------------

  - name: list_calls
    class: read
    description: >-
      Calls, newest first: {calls: [{id, from, to, duration, answered,
      disposition_name, user_email, transcription}], _links}. Calls that
      never connected are not returned. Dates are ISO 8601.
    input:
      type: object
      additionalProperties: false
      properties:
        user_id: { type: string }
        from_number: { type: string, description: "Calling number." }
        to_number: { type: string, description: "Called number." }
        direction: { enum: [incoming, outgoing] }
        start_date_from: { type: string, description: "Calls started after (ISO 8601)." }
        start_date_to: { type: string, description: "Calls started before (ISO 8601)." }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: Outgoing calls since October, input: { direction: outgoing, start_date_from: "2026-10-01T00:00:00Z" } }
    call:
      method: GET
      path: /calls
      query: { user_id: user_id, from: from_number, to: to_number, direction: direction, start_date_from: start_date_from, start_date_to: start_date_to, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: list_call_dispositions
    class: read
    description: The call outcomes (dispositions) log_call can take, with their action.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Dispositions, input: {} }
    call: { method: GET, path: /calls/dispositions }
    cost: { per: request }

  - name: log_call
    class: write
    description: >-
      Log a call made outside Amplemarket against a task. A disposition whose
      action is "complete" also completes the task. recording_url is stored
      as a link, not downloaded.
    input:
      type: object
      additionalProperties: false
      required: [task_id, user_id, from_number, to_number, duration, answered, human]
      properties:
        task_id: { type: string, minLength: 1 }
        user_id: { type: string, minLength: 1 }
        from_number: { type: string, description: "Number that placed the call." }
        to_number: { type: string, description: "Number that received the call." }
        duration: { type: integer, minimum: 0, description: "Seconds." }
        answered: { type: boolean }
        human: { type: boolean, description: "A human answered (false: machine or voicemail)." }
        disposition_id: { type: string }
        transcription: { type: string }
        recording_url: { type: string }
    examples:
      - title: A 2-minute answered call
        input: { task_id: tsk_1, user_id: usr_1, from_number: "+33100000000", to_number: "+33600000000", duration: 120, answered: true, human: true }
    call:
      method: POST
      path: /calls
      body: { task_id: task_id, user_id: user_id, from: from_number, to: to_number, duration: duration, answered: answered, human: human, disposition_id: disposition_id, transcription: transcription, recording_url: recording_url }
    cost: { per: request }

  # --- Exclusion lists ----------------------------------------------------

  - name: list_excluded_emails
    class: read
    description: The emails excluded from all outreach, filtered by keyword.
    input:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, description: "Keyword in the email." }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: Excluded emails of a domain, input: { email: example.com } }
    call:
      method: GET
      path: /excluded-emails
      query: { "filter[email]": email, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: list_excluded_domains
    class: read
    description: The domains excluded from all outreach, filtered by keyword.
    input:
      type: object
      additionalProperties: false
      properties:
        domain: { type: string, description: "Keyword in the domain." }
        page_size: *page_size
        page_after: *page_after
        page_before: *page_before
    examples:
      - { title: All excluded domains, input: {} }
    call:
      method: GET
      path: /excluded-domains
      query: { "filter[domain]": domain, "page[size]": page_size, "page[after]": page_after, "page[before]": page_before }
    cost: { per: request }

  - name: add_excluded_emails
    class: write
    description: Exclude emails from all outreach (customers, opt-outs, competitors).
    input:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails: &excluded_emails
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [email]
            properties: { email: { type: string } }
    examples:
      - { title: Exclude one email, input: { emails: [{ email: jane@example.com }] } }
    call:
      method: POST
      path: /excluded-emails
      body: { excluded_emails: emails }
    cost: { per: request }

  - name: add_excluded_domains
    class: write
    description: Exclude whole domains from all outreach.
    input:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains: &excluded_domains
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [domain]
            properties: { domain: { type: string } }
    examples:
      - { title: Exclude a customer's domain, input: { domains: [{ domain: example.com }] } }
    call:
      method: POST
      path: /excluded-domains
      body: { excluded_domains: domains }
    cost: { per: request }

  - name: remove_excluded_emails
    class: sensitive
    description: >-
      Lift the exclusion of emails: sequences can contact them again.
    input:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails: *excluded_emails
    examples:
      - { title: Lift one exclusion, input: { emails: [{ email: jane@example.com }] } }
    call:
      method: DELETE
      path: /excluded-emails
      body: { excluded_emails: emails }
    cost: { per: request }
    confirm:
      summary: "Remove these emails from the Amplemarket exclusion list: sequences can contact them again."

  - name: remove_excluded_domains
    class: sensitive
    description: >-
      Lift the exclusion of domains: sequences can contact their people again.
    input:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains: *excluded_domains
    examples:
      - { title: Lift one domain exclusion, input: { domains: [{ domain: example.com }] } }
    call:
      method: DELETE
      path: /excluded-domains
      body: { excluded_domains: domains }
    cost: { per: request }
    confirm:
      summary: "Remove these domains from the Amplemarket exclusion list: sequences can contact their people again."

  # --- Phone numbers ------------------------------------------------------

  - name: review_phone_number
    class: write
    description: Report a contact's phone number as wrong, on behalf of a user.
    input:
      type: object
      additionalProperties: false
      required: [phone_number_id, user_id]
      properties:
        phone_number_id: { type: string, minLength: 1 }
        user_id: { type: string, minLength: 1 }
        reason: { enum: [wrong_number], default: wrong_number }
    examples:
      - { title: Flag a wrong number, input: { phone_number_id: ph_1, user_id: usr_1 } }
    call:
      method: POST
      path: "/phone_numbers/{phone_number_id}/review"
      body: { user_id: user_id, reason: reason }
    cost: { per: request }

exposure:
  mode: per_connector
  tool: amplemarket
