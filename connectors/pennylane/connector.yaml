# yaml-language-server: $schema=../connector.schema.json
# Pennylane Company API v2 reference: https://pennylane.readme.io/ (OpenAPI:
# https://pennylane.readme.io/openapi/accounting.json, "Company V2", version 2.0).
#
# One API key = one company: every id (customer, journal, ledger account,
# invoice...) belongs to that company and means nothing in another one. Firm
# tokens, which pick the company with the header X-Company-Id, are not served;
# the Firm API, for accounting firms, is described in pennylane_firm.
# Each key carries its own scopes, chosen by whoever created it; GET /me lists
# them (field scopes).
#
# Not described here: uploading a file (multipart POST /file_attachments) and
# importing a supplier invoice from it (POST /supplier_invoices/import), which
# depend on that upload; categorizing an invoice or a ledger entry line
# (PUT .../categories), whose body is a list at the top level.
#
# The filter query parameter is a JSON array serialised as a string:
# [{"field": "date", "operator": "gteq", "value": "2026-01-01"}]. The agent passes
# the clauses as a list; encode: json serialises them into the query.
connector:
  name: pennylane
  label: Pennylane
  namespace: pennylane
  version: 2.1.0
  api_version: v2
  base_url: https://app.pennylane.com/api/external/v2
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 30
  rate_limit: { requests: 4, seconds: 1 }
  probe: { function: get_company, non_empty: [scopes] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Pennylane rejected the request as invalid: check the arguments. An invoice line that matches neither line shape comes back as NotAnyOf." }
    - { status: [401, 403], code: access_rejected, retryable: false,
        message: "Pennylane refused access: the key is invalid or lacks the scope for this action. A missing right is not an argument to fix, so retrying unchanged fails the same way; the key's actual scopes are listed in the scopes field of the company information." }
    - { status: 404, code: not_found, retryable: false,
        message: "No such object in this Pennylane company: ids belong to the one company the key is bound to." }
    - { status: 409, code: conflict, retryable: false,
        message: "Conflict with the current state of the Pennylane object." }
    - { status: 422, code: content_rejected, retryable: false,
        message: "Pennylane rejected the content: the values sent fail its checks. Fix them before calling again." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Pennylane request rate exceeded: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Pennylane is temporarily unavailable: retry later." }

functions:
  # --- Reference data -----------------------------------------------------

  - name: get_company
    class: read
    description: >-
      Get the company and the user the API key belongs to, and the key's
      scopes. One key reaches one company only. The scopes field is the
      key's actual set of rights: read it whenever Pennylane refuses access
      (401/403), and tell the user which scope is missing rather than
      retrying. Scopes are split by object: journals:*, ledger_accounts:* and
      ledger_entries:* are distinct, so a key that reads entries may not read
      journals.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Company, user and scopes of the key
        input: {}
    call: { method: GET, path: /me }
    cost: { per: request }

  - name: list_fiscal_years
    class: read
    description: >-
      List the company's fiscal years, newest first by default. Paged by
      limit and cursor: pass next_cursor as cursor for the next page.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: &limit { type: integer, minimum: 1, maximum: 100, default: 100 }
        cursor: &cursor { type: string, description: "next_cursor of the previous page." }
        sort: { enum: [id, -id, start, -start], description: "Prefix with - for descending order." }
    examples:
      - title: Fiscal years by start date, oldest first
        input: { sort: start }
    call:
      method: GET
      path: /fiscal_years
      query: { limit: limit, cursor: cursor, sort: sort }
    pagination: &pagination
      kind: cursor
      request_param: cursor
      next: next_cursor
      more: has_more
      max_pages: 10
    output: &list_output
      items: items
    cost: { per: request }

  - name: list_ledger_accounts
    class: read
    description: >-
      List the chart of accounts. Every ledger entry line needs a
      ledger_account_id, read here, never guessed. Scope
      ledger_accounts:readonly. Up to 1000 accounts per page.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, number, enabled] }
              operator: &operator { enum: [lt, lteq, gt, gteq, eq, not_eq, in, not_in, start_with] }
              value: &clause_value { type: [string, number, boolean, array], items: { type: [string, number] } }
            allOf:
              - &in_takes_a_list
                if: { properties: { operator: { enum: [in, not_in] } } }
                then: { properties: { value: { type: array, minItems: 1 } } }
                else: { properties: { value: { type: [string, number, boolean] } } }
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id (lt, lteq, gt, gteq, eq,
            not_eq, in, not_in), number (start_with, eq, in), enabled (eq).
        limit: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        cursor: *cursor
    examples:
      - title: Accounts whose number starts with 411
        input: { filter: [{ field: number, operator: start_with, value: "411" }] }
    call:
      method: GET
      path: /ledger_accounts
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_journals
    class: read
    description: >-
      List the company's journals ({id, code, label, type}: purchases,
      sales, bank...). A ledger entry needs a journal_id: these ids are
      specific to the company, resolve them here every time and never
      hard-code them. Scope journals:readonly, distinct from the scope of
      ledger entries.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [type] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Field: type (eq, not_eq, in, not_in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: All journals
        input: {}
    call:
      method: GET
      path: /journals
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_categories
    class: read
    description: >-
      List the analytical categories (expense and revenue categories), each
      in one group (an analytical axis, see list_category_groups). Scope
      categories:readonly.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, category_group_id, label, analytical_code] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id and category_group_id (lt,
            lteq, gt, gteq, eq, not_eq, in, not_in), label (start_with, eq,
            in), analytical_code (eq, not_eq, in, not_in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: All categories
        input: {}
    call:
      method: GET
      path: /categories
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_category_groups
    class: read
    description: >-
      List the category groups, the analytical axes ({id, label}): a
      category belongs to one group, and the weights an object carries
      within one group sum to 1. Scope categories:readonly.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *limit
        cursor: *cursor
    examples:
      - title: All analytical axes
        input: {}
    call:
      method: GET
      path: /category_groups
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_supplier_invoice_categories
    class: read
    description: >-
      List the analytical categories of one supplier invoice, each with its
      weight (a string between 0 and 1). Scope supplier_invoices:readonly.
    input:
      type: object
      additionalProperties: false
      required: [supplier_invoice_id]
      properties:
        supplier_invoice_id: { type: integer }
        limit: *limit
        cursor: *cursor
    examples:
      - title: Categories of a supplier invoice
        input: { supplier_invoice_id: 1234 }
    call:
      method: GET
      path: /supplier_invoices/{supplier_invoice_id}/categories
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_customer_invoice_categories
    class: read
    description: >-
      List the analytical categories of one customer invoice, each with its
      weight (a string between 0 and 1). Scope customer_invoices:readonly.
    input:
      type: object
      additionalProperties: false
      required: [customer_invoice_id]
      properties:
        customer_invoice_id: { type: integer }
        limit: *limit
        cursor: *cursor
    examples:
      - title: Categories of a customer invoice
        input: { customer_invoice_id: 1234 }
    call:
      method: GET
      path: /customer_invoices/{customer_invoice_id}/categories
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_ledger_entry_line_categories
    class: read
    description: >-
      List the analytical categories of one ledger entry line, each with its
      weight (a string between 0 and 1). The line ids come from
      list_ledger_entry_lines. Scope ledger_entries:readonly.
    input:
      type: object
      additionalProperties: false
      required: [ledger_entry_line_id]
      properties:
        ledger_entry_line_id: { type: integer }
        limit: *limit
        cursor: *cursor
    examples:
      - title: Categories of a ledger entry line
        input: { ledger_entry_line_id: 1234 }
    call:
      method: GET
      path: /ledger_entry_lines/{ledger_entry_line_id}/categories
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_invoice_templates
    class: read
    description: >-
      List the customer invoice templates. The template drives the PDF
      rendering: a credit-note template without the payment and IBAN block
      is the only way through the API to get a credit-note layout. Pass its
      id as customer_invoice_template_id when creating or updating an
      invoice or a credit note. Scope customer_invoice_templates:readonly.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *limit
        cursor: *cursor
    examples:
      - title: All templates
        input: {}
    call:
      method: GET
      path: /customer_invoice_templates
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_products
    class: read
    description: >-
      List the product catalogue (id, label, price, unit, vat_rate...).
      Resolve the product_id of an invoice or quote line here, never guess
      it. Beware of near-homonym labels: choose on the full record (price,
      unit), not on the start of the name.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, label, reference, external_reference] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id (lt, lteq, gt, gteq, eq,
            not_eq, in, not_in), label and reference (eq, in),
            external_reference (eq, not_eq, in, not_in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: All products
        input: {}
    call:
      method: GET
      path: /products
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: get_product
    class: read
    description: Get one product by its id.
    input:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id: &id { type: integer, minimum: 1 }
    examples:
      - title: One product
        input: { product_id: 1201 }
    refusals:
      - { code: product_not_found, when: 404, message: "No product with this id in this Pennylane company." }
    call: { method: GET, path: "/products/{product_id}" }
    cost: { per: request }

  - name: create_product
    class: write
    description: >-
      Create a product in the catalogue. price_before_tax is a decimal
      string ("700.00"). vat_rate is a Pennylane code, never a percentage:
      20% is FR_200, 10% FR_100, 5.5% FR_55, 2.1% FR_21, exempt is exempt.
    input:
      type: object
      additionalProperties: false
      required: [label, price_before_tax, vat_rate]
      properties:
        label: { type: string, minLength: 1 }
        price_before_tax: &decimal
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Decimal amount as a string, e.g. \"700.00\"."
        vat_rate: &vat_rate
          type: string
          pattern: "^[A-Za-z0-9_]+$"
          description: >-
            Pennylane VAT code, never a percentage: FR_200 (20%), FR_100 (10%),
            FR_55 (5.5%), FR_21 (2.1%), exempt. Reverse-charge codes:
            intracom_21, intracom_55, intracom_85, intracom_100, extracom,
            crossborder, FR_85_construction, FR_100_construction,
            FR_200_construction.
        unit: { type: string, description: "e.g. day, hour, piece." }
        description: { type: string, maxLength: 5000 }
        reference: { type: string }
        external_reference: { type: string, description: "Your own unique value." }
        currency: &currency { type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217, EUR by default." }
        ledger_account_id: *id
    examples:
      - title: A consulting day at 700 EUR before tax, 20% VAT
        input: { label: Consulting day, price_before_tax: "700.00", vat_rate: FR_200, unit: day }
    call:
      method: POST
      path: /products
      body: { label: label, price_before_tax: price_before_tax, vat_rate: vat_rate,
              unit: unit, description: description, reference: reference,
              external_reference: external_reference, currency: currency,
              ledger_account_id: ledger_account_id }
    cost: { per: request }

  # --- Customers ----------------------------------------------------------

  - name: list_customers
    class: read
    description: >-
      List customers (companies and individuals) with their contact details.
      Resolve a customer_id from a name here: invoice lists carry only
      customer.{id, url}. Before creating a customer, look it up by
      external_reference with the filter: creating it again is refused
      ("External reference has already been taken"); reuse the id found.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, customer_type, ledger_account_id, name, external_reference, reg_no, emails] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id (lt, lteq, gt, gteq, eq,
            not_eq, in, not_in), customer_type and ledger_account_id (eq,
            not_eq), name (start_with, eq), external_reference (start_with,
            eq, not_eq, in, not_in), reg_no (eq, not_eq, in, not_in), emails
            (in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: The customer carrying an external reference
        input: { filter: [{ field: external_reference, operator: eq, value: "CRM-12345" }] }
      - title: Customers whose name starts with Acme
        input: { filter: [{ field: name, operator: start_with, value: "Acme" }] }
    call:
      method: GET
      path: /customers
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: create_customer
    class: write
    description: >-
      Create a company customer. The full billing address is required. Look
      the customer up by external_reference first (list_customers): an
      external_reference already taken is refused. Returns the customer with
      its id, to pass as customer_id when creating an invoice or a quote.
    input:
      type: object
      additionalProperties: false
      required: [name, billing_address]
      properties:
        name: { type: string, minLength: 1 }
        billing_address: &address
          type: object
          additionalProperties: false
          required: [address, postal_code, city, country_alpha2]
          properties:
            address: { type: string }
            postal_code: { type: string }
            city: { type: string }
            country_alpha2: { type: string, pattern: "^[A-Z]{2}$", description: "ISO 3166-1 alpha-2, e.g. FR." }
        delivery_address: *address
        emails: &emails
          type: array
          items: { type: string, format: email }
          description: "Recipients of the invoices."
        external_reference: { type: string, description: "Your own unique value, e.g. the id in your CRM." }
        vat_number: { type: string }
        reg_no: { type: string, description: "Registration number (SIREN in France)." }
        phone: { type: string }
        recipient: { type: string, description: "Person the invoices are addressed to." }
        billing_iban: { type: string }
        billing_language: &language { enum: [fr_FR, en_GB, de_DE, es_ES] }
        notes: { type: string }
    examples:
      - title: A French company customer
        input:
          name: Acme SAS
          billing_address: { address: 1 rue de la Paix, postal_code: "75002", city: Paris, country_alpha2: FR }
          emails: [billing@acme.example]
          external_reference: CRM-12345
    refusals:
      - { code: customer_already_exists, when: 409, message: "A customer already carries this external_reference: reuse it instead of creating one." }
    call:
      method: POST
      path: /company_customers
      body: { name: name, billing_address: billing_address, delivery_address: delivery_address,
              emails: emails, external_reference: external_reference, vat_number: vat_number,
              reg_no: reg_no, phone: phone, recipient: recipient, billing_iban: billing_iban,
              billing_language: billing_language, notes: notes }
    cost: { per: request }

  - name: update_customer
    class: write
    description: >-
      Update a company customer: complete its emails, VAT number,
      registration number, IBAN, external_reference... Typical use: a
      customer known to Pennylane without email or identifier, completed
      before invoicing it. Only the arguments passed are changed.
    input:
      type: object
      additionalProperties: false
      required: [customer_id]
      minProperties: 2
      properties:
        customer_id: *id
        name: { type: string, minLength: 1 }
        billing_address: *address
        delivery_address: *address
        emails: *emails
        external_reference: { type: string }
        vat_number: { type: string }
        reg_no: { type: string }
        phone: { type: string }
        recipient: { type: string }
        billing_iban: { type: string }
        billing_language: *language
        notes: { type: string }
    examples:
      - title: Add a billing email and an external reference
        input: { customer_id: 3001, emails: [billing@acme.example], external_reference: CRM-12345 }
    refusals:
      - { code: customer_not_found, when: 404, message: "No company customer with this id in this Pennylane company." }
    call:
      method: PUT
      path: /company_customers/{customer_id}
      body: { name: name, billing_address: billing_address, delivery_address: delivery_address,
              emails: emails, external_reference: external_reference, vat_number: vat_number,
              reg_no: reg_no, phone: phone, recipient: recipient, billing_iban: billing_iban,
              billing_language: billing_language, notes: notes }
    cost: { per: request }

  # --- Suppliers ----------------------------------------------------------

  - name: list_suppliers
    class: read
    description: >-
      List suppliers (id, name...). Resolve the supplier_id of an existing
      supplier here before creating one.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, ledger_account_id, name, external_reference, emails] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id (lt, lteq, gt, gteq, eq,
            not_eq, in, not_in), ledger_account_id (eq, not_eq), name
            (start_with), external_reference (eq, not_eq, in, not_in),
            emails (in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: Suppliers whose name starts with Office
        input: { filter: [{ field: name, operator: start_with, value: "Office" }] }
    call:
      method: GET
      path: /suppliers
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: get_supplier
    class: read
    description: Get one supplier by its id.
    input:
      type: object
      additionalProperties: false
      required: [supplier_id]
      properties:
        supplier_id: *id
    examples:
      - title: One supplier
        input: { supplier_id: 4001 }
    refusals:
      - { code: supplier_not_found, when: 404, message: "No supplier with this id in this Pennylane company." }
    call: { method: GET, path: "/suppliers/{supplier_id}" }
    cost: { per: request }

  - name: create_supplier
    class: write
    description: >-
      Create a supplier, before recording the purchase invoice of a new
      supplier. Look it up first (list_suppliers). Returns the supplier with
      its id.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        reg_no: { type: string, pattern: "^[0-9]{9}$", description: "SIREN, French companies only." }
        establishment_no: { type: string, pattern: "^[0-9]{14}$", description: "SIRET, French companies only." }
        vat_number: { type: string }
        postal_address: *address
        emails: { type: array, items: { type: string, format: email } }
        iban: { type: string }
        external_reference: { type: string, description: "Your own unique value." }
        supplier_payment_method:
          enum: [automatic_transfer, manual_transfer, automatic_debiting, bill_of_exchange,
                 check, cash, card, other]
        supplier_due_date_delay: { type: integer, minimum: 0, description: "Payment delay, in days." }
        supplier_due_date_rule: { enum: [days, days_or_end_of_month] }
    examples:
      - title: A French supplier
        input: { name: Office Supplies SARL, reg_no: "123456789", emails: [accounting@office.example] }
    refusals:
      - { code: supplier_already_exists, when: 409, message: "A supplier already carries this external_reference: reuse it instead of creating one." }
    call:
      method: POST
      path: /suppliers
      body: { name: name, reg_no: reg_no, establishment_no: establishment_no,
              vat_number: vat_number, postal_address: postal_address, emails: emails,
              iban: iban, external_reference: external_reference,
              supplier_payment_method: supplier_payment_method,
              supplier_due_date_delay: supplier_due_date_delay,
              supplier_due_date_rule: supplier_due_date_rule }
    cost: { per: request }

  # --- Customer invoices and credit notes ---------------------------------

  - name: list_customer_invoices
    class: read
    description: >-
      List customer invoices and credit notes (the revenue side), newest
      first: to match against incoming payments, or to find unpaid
      invoices. Without a filter the whole history comes back; start with a
      date or customer filter. To find one invoice by its external_reference
      (e.g. before creating a credit note for a failed payment: if an
      invoice already carries the reference, the credit note exists), filter
      on external_reference: the server filter is exhaustive, archived and
      old invoices included.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, date, customer_id, quote_id, invoice_number, draft, credit_note, external_reference, category_id] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id, date, customer_id, quote_id
            (lt, lteq, gt, gteq, eq, not_eq, in, not_in), invoice_number
            (eq, not_eq, in, not_in), draft and credit_note (eq, boolean),
            external_reference (eq), category_id (in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: The invoice carrying an external reference
        input: { filter: [{ field: external_reference, operator: eq, value: "PM0001AAAA" }] }
      - title: Invoices of one customer since January
        input:
          filter: [{ field: customer_id, operator: eq, value: "3001" }, { field: date, operator: gteq, value: "2026-01-01" }]
          limit: 50
    call:
      method: GET
      path: /customer_invoices
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: &pagination_long
      kind: cursor
      request_param: cursor
      next: next_cursor
      more: has_more
      max_pages: 5
    output: *list_output
    cost: { per: request }

  - name: list_customer_invoice_lines
    class: read
    description: >-
      List the lines of a customer invoice or credit note, with their id
      (needed to update a line of a draft).
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
        limit: *limit
        cursor: *cursor
    examples:
      - title: Lines of an invoice
        input: { invoice_id: 5001 }
    call:
      method: GET
      path: /customer_invoices/{invoice_id}/invoice_lines
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: create_customer_invoice
    class: write
    act: false
    description: >-
      Create a customer invoice, always as a draft. The customer
      must exist (list_customers, create_customer). Finalizing and sending
      are separate functions, called only after explicit human validation.
      Each line takes exactly one of two shapes, with no other key (any
      deviation is refused as NotAnyOf): a product line {product_id,
      quantity}, the product filling the rest (label,
      raw_currency_unit_price, unit, vat_rate may override it); or a free
      line {label, quantity, unit, raw_currency_unit_price, vat_rate}, all
      required. raw_currency_unit_price is the unit price before tax as a
      string ("700.00"); quantity is a number, never a string. Pass an
      external_reference to trace the source and look it up before creating
      again.
    input:
      type: object
      additionalProperties: false
      required: [customer_id, date, deadline, invoice_lines]
      properties:
        customer_id: *id
        date: &date { type: string, format: date, description: "YYYY-MM-DD." }
        deadline: { type: string, format: date, description: "Payment deadline, YYYY-MM-DD." }
        invoice_lines:
          type: array
          minItems: 1
          items: &invoice_line
            oneOf:
              - type: object
                additionalProperties: false
                required: [product_id, quantity]
                properties:
                  product_id: *id
                  quantity: { type: number }
                  label: { type: string }
                  raw_currency_unit_price: *decimal
                  unit: { type: string }
                  vat_rate: *vat_rate
                  description: { type: string }
              - type: object
                additionalProperties: false
                required: [label, quantity, unit, raw_currency_unit_price, vat_rate]
                properties:
                  label: { type: string, minLength: 1 }
                  quantity: { type: number }
                  unit: { type: string }
                  raw_currency_unit_price: *decimal
                  vat_rate: *vat_rate
                  description: { type: string }
        external_reference: { type: string, description: "Trace of the source, unique; look it up before creating again." }
        pdf_invoice_free_text: &free_text
          type: string
          description: "Free text printed on the PDF, visible to the customer."
        pdf_invoice_subject: { type: string, description: "Title printed on the PDF." }
        customer_invoice_template_id: &template_id
          type: integer
          minimum: 1
          description: "Rendering template, from list_invoice_templates."
        label: { type: string, description: "Label of the accounting entry; generated when absent." }
        currency: *currency
        language: *language
    examples:
      - title: A draft invoice with one product line
        input:
          customer_id: 3001
          date: "2026-10-06"
          deadline: "2026-11-05"
          invoice_lines: [{ product_id: 1201, quantity: 3 }]
      - title: A draft invoice with one free line
        input:
          customer_id: 3001
          date: "2026-10-06"
          deadline: "2026-11-05"
          invoice_lines:
            - { label: Workshop, quantity: 1, unit: day, raw_currency_unit_price: "1200.00", vat_rate: FR_200 }
    call:
      method: POST
      path: /customer_invoices
      body: { customer_id: customer_id, date: date, deadline: deadline,
              invoice_lines: invoice_lines,
              external_reference: external_reference,
              pdf_invoice_free_text: pdf_invoice_free_text,
              pdf_invoice_subject: pdf_invoice_subject,
              customer_invoice_template_id: customer_invoice_template_id,
              label: label, currency: currency, language: language }
      constants: { body: { draft: true } }
    cost: { per: request }

  - name: create_credit_note
    class: write
    act: false
    description: >-
      Create a standalone credit note, always as a draft. In
      Pennylane v2 a credit note is a customer invoice with negative
      amounts: give every line a NEGATIVE quantity (crediting 195 credits at
      1.45 is quantity -195, unit price "1.45"). Lines follow the invoice
      line shapes (product line or free line). Nothing is linked at
      creation: the creation-time credited_invoice_id is broken upstream;
      link afterwards with link_credit_note if needed, or name the original
      invoice in pdf_invoice_free_text. Pass the source event as
      external_reference and look it up first (list_customer_invoices) so
      one event gives one credit note. For the credit-note layout, pass the
      id of a credit-note template.
    input:
      type: object
      additionalProperties: false
      required: [customer_id, date, deadline, invoice_lines]
      properties:
        customer_id: *id
        date: *date
        deadline: { type: string, format: date, description: "YYYY-MM-DD." }
        invoice_lines:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [product_id, quantity]
                properties:
                  product_id: *id
                  quantity: &negative_quantity { type: number, exclusiveMaximum: 0, description: "Negative: the credited quantity." }
                  label: { type: string }
                  raw_currency_unit_price: *decimal
                  unit: { type: string }
                  vat_rate: *vat_rate
                  description: { type: string }
              - type: object
                additionalProperties: false
                required: [label, quantity, unit, raw_currency_unit_price, vat_rate]
                properties:
                  label: { type: string, minLength: 1 }
                  quantity: *negative_quantity
                  unit: { type: string }
                  raw_currency_unit_price: *decimal
                  vat_rate: *vat_rate
                  description: { type: string }
        external_reference: { type: string, description: "Source event, e.g. a failed payment id; keeps one credit note per event." }
        pdf_invoice_free_text: *free_text
        customer_invoice_template_id: *template_id
        currency: *currency
    examples:
      - title: A draft credit note for 195 credits
        input:
          customer_id: 3001
          date: "2026-10-06"
          deadline: "2026-10-06"
          invoice_lines: [{ product_id: 1202, quantity: -195 }]
          external_reference: PM0001AAAA
          pdf_invoice_free_text: Credit note on invoice F-2026-0042 after a failed payment.
    call:
      method: POST
      path: /customer_invoices
      body: { customer_id: customer_id, date: date, deadline: deadline,
              invoice_lines: invoice_lines,
              external_reference: external_reference,
              pdf_invoice_free_text: pdf_invoice_free_text,
              customer_invoice_template_id: customer_invoice_template_id,
              currency: currency }
      constants: { body: { draft: true } }
    cost: { per: request }

  - name: link_credit_note
    class: sensitive
    description: >-
      Link an existing credit note to the customer invoice it credits. The
      only working way to link them (the creation-time attribute is broken
      upstream). The API offers no unlinking.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id, credit_note_id]
      properties:
        invoice_id: { type: integer, minimum: 1, description: "The invoice being credited." }
        credit_note_id: { type: integer, minimum: 1 }
    examples:
      - title: Link a credit note to its invoice
        input: { invoice_id: 5001, credit_note_id: 5002 }
    confirm:
      summary: "Link credit note {credit_note_id} to invoice {invoice_id}: the API cannot unlink it."
    call:
      method: POST
      path: /customer_invoices/{invoice_id}/link_credit_note
      body: { credit_note_id: credit_note_id }
    cost: { per: request }

  - name: update_customer_invoice
    class: write
    description: >-
      Update a draft customer invoice or credit note: dates, customer,
      template, free text, external_reference, and its lines through
      invoice_lines {create, update, delete} (update and delete need the
      line id, from list_customer_invoice_lines). Typical use: switch a
      draft credit note to the credit-note template before finalizing. On a
      finalized document Pennylane only accepts label, external_reference
      and line updates: never use this to correct an issued document.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      minProperties: 2
      properties:
        invoice_id: *id
        date: *date
        deadline: { type: string, format: date, description: "YYYY-MM-DD." }
        customer_id: *id
        customer_invoice_template_id: *template_id
        pdf_invoice_free_text: *free_text
        pdf_invoice_subject: { type: string }
        label: { type: string }
        external_reference: { type: string }
        currency: *currency
        language: *language
        invoice_lines:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            create: { type: array, items: *invoice_line }
            update:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                minProperties: 2
                properties:
                  id: *id
                  product_id: *id
                  quantity: { type: number }
                  label: { type: string }
                  raw_currency_unit_price: *decimal
                  unit: { type: string }
                  vat_rate: *vat_rate
                  description: { type: string }
            delete:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                properties: { id: *id }
          description: "Lines to add, change or remove."
    examples:
      - title: Switch a draft credit note to the credit-note template
        input: { invoice_id: 5002, customer_invoice_template_id: 7001 }
      - title: Change the quantity of one line of a draft
        input: { invoice_id: 5001, invoice_lines: { update: [{ id: 9001, quantity: 2 }] } }
    call:
      method: PUT
      path: /customer_invoices/{invoice_id}
      body: { date: date, deadline: deadline, customer_id: customer_id,
              customer_invoice_template_id: customer_invoice_template_id,
              pdf_invoice_free_text: pdf_invoice_free_text,
              pdf_invoice_subject: pdf_invoice_subject, label: label,
              external_reference: external_reference, currency: currency,
              language: language, invoice_lines: invoice_lines }
    cost: { per: request }

  - name: finalize_customer_invoice
    class: sensitive
    description: >-
      Finalize a draft customer invoice or credit note: it gets its
      definitive number and can no longer be edited. Only after explicit
      human validation of the draft.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
    examples:
      - title: Finalize a validated draft
        input: { invoice_id: 5001 }
    confirm:
      summary: "Finalize customer invoice {invoice_id}: it gets its definitive number and can no longer be edited."
    call: { method: PUT, path: "/customer_invoices/{invoice_id}/finalize" }
    cost: { per: request }

  - name: send_customer_invoice
    class: sensitive
    description: >-
      Email a finalized customer invoice or credit note to the customer, at
      the addresses on the customer's record. Only after explicit human
      validation. The PDF takes a few minutes to generate after
      finalization: a conflict means it is not ready yet, retry later.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
    examples:
      - title: Send a finalized invoice
        input: { invoice_id: 5001 }
    refusals:
      - { code: pdf_not_ready, when: 409, message: "The invoice PDF is not generated yet: retry in a few minutes." }
    confirm:
      summary: "Email customer invoice {invoice_id} to the customer's addresses."
    call: { method: POST, path: "/customer_invoices/{invoice_id}/send_by_email" }
    cost: { per: request }

  - name: delete_customer_invoice
    class: sensitive
    description: >-
      Delete a draft customer invoice or credit note, e.g. an obsolete draft
      before it is finalized by mistake. A finalized document cannot be
      deleted: it is cancelled with a credit note.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
    examples:
      - title: Delete an obsolete draft
        input: { invoice_id: 5003 }
    refusals:
      - { code: invoice_not_draft, when: 422, message: "Only a draft can be deleted: cancel a finalized invoice with a credit note." }
    confirm:
      summary: "Delete draft customer invoice {invoice_id}."
    call: { method: DELETE, path: "/customer_invoices/{invoice_id}" }
    cost: { per: request }

  # --- Quotes -------------------------------------------------------------

  - name: list_quotes
    class: read
    description: >-
      List sales quotes, newest first. Without a filter the whole history
      comes back: filter on status or customer_id. Statuses: pending,
      accepted, denied, invoiced, expired.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, customer_id, status] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id and customer_id (lt, lteq,
            gt, gteq, eq, not_eq, in, not_in), status (eq, not_eq, in,
            not_in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: Pending quotes
        input: { filter: [{ field: status, operator: eq, value: "pending" }] }
    call:
      method: GET
      path: /quotes
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination_long
    output: *list_output
    cost: { per: request }

  - name: get_quote
    class: read
    description: >-
      Get one quote: status, quote_number, linked_invoices, and
      public_file_url, its PDF (a link that expires after 30 minutes).
    input:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id: *id
    examples:
      - title: One quote
        input: { quote_id: 6001 }
    refusals:
      - &quote_not_found { code: quote_not_found, when: 404, message: "No quote with this id in this Pennylane company." }
    call: { method: GET, path: "/quotes/{quote_id}" }
    cost: { per: request }

  - name: get_quote_pdf_link
    class: read
    description: >-
      Get the PDF link of a quote, to attach to an email. The link expires
      after 30 minutes: read it right before use, never store it.
    input:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id: *id
    examples:
      - title: PDF link of a quote
        input: { quote_id: 6001 }
    refusals:
      - *quote_not_found
      - { code: pdf_missing, when: "public_file_url is empty in the response", message: "Pennylane returned no PDF link for this quote." }
    expect:
      - { kind: non_empty, refusal: pdf_missing, path: public_file_url }
    call: { method: GET, path: "/quotes/{quote_id}" }
    output:
      projection: [id, quote_number, public_file_url, filename]
    cost: { per: request }

  - name: list_quote_lines
    class: read
    description: List the lines of a quote.
    input:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id: *id
        limit: *limit
        cursor: *cursor
    examples:
      - title: Lines of a quote
        input: { quote_id: 6001 }
    call:
      method: GET
      path: /quotes/{quote_id}/invoice_lines
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: create_quote
    class: write
    description: >-
      Create a sales quote. A quote has no draft: it is created pending and
      reaches the customer only when sent. The customer must exist. Tell the
      user the customer, the lines and the validity date before calling.
      Lines follow the invoice line shapes: a product line {product_id,
      quantity} or a free line {label, quantity, unit,
      raw_currency_unit_price, vat_rate}, all required; a discount is a free
      line with a negative price ("-100.00").
    input:
      type: object
      additionalProperties: false
      required: [customer_id, date, deadline, invoice_lines]
      properties:
        customer_id: *id
        date: *date
        deadline: { type: string, format: date, description: "End of validity, YYYY-MM-DD." }
        invoice_lines: { type: array, minItems: 1, items: *invoice_line }
        external_reference: { type: string, description: "Trace of the source, unique." }
        pdf_invoice_free_text: { type: string, description: "Free text printed on the PDF: terms, the customer's order reference..." }
        pdf_invoice_subject: { type: string, description: "Title printed on the PDF." }
        quote_template_id: { type: integer, minimum: 1, description: "Rendering template of the quote." }
        currency: *currency
        language: *language
    examples:
      - title: A quote for three consulting days
        input:
          customer_id: 3001
          date: "2026-10-06"
          deadline: "2026-11-06"
          invoice_lines: [{ product_id: 1201, quantity: 3 }]
    call:
      method: POST
      path: /quotes
      body: { customer_id: customer_id, date: date, deadline: deadline,
              invoice_lines: invoice_lines, external_reference: external_reference,
              pdf_invoice_free_text: pdf_invoice_free_text,
              pdf_invoice_subject: pdf_invoice_subject,
              quote_template_id: quote_template_id, currency: currency,
              language: language }
    cost: { per: request }

  - name: update_quote_status
    class: write
    description: >-
      Set the status of a quote: pending, accepted, denied, invoiced or
      expired; e.g. accepted once the customer has signed.
    input:
      type: object
      additionalProperties: false
      required: [quote_id, status]
      properties:
        quote_id: *id
        status: { enum: [pending, accepted, denied, invoiced, expired] }
    examples:
      - title: Mark a quote accepted
        input: { quote_id: 6001, status: accepted }
    refusals:
      - *quote_not_found
    call:
      method: PUT
      path: /quotes/{quote_id}/update_status
      body: { status: status }
    cost: { per: request }

  - name: create_invoice_from_quote
    class: write
    act: false
    description: >-
      Create a draft customer invoice from a quote, taking over its customer
      and lines. Finalizing and sending it remain
      separate steps after human validation. Needs the scope
      customer_invoices:all on top of quotes.
    input:
      type: object
      additionalProperties: false
      required: [quote_id]
      properties:
        quote_id: *id
        external_reference: { type: string, description: "Reference of the invoice created." }
        customer_invoice_template_id: *template_id
    examples:
      - title: Invoice an accepted quote
        input: { quote_id: 6001 }
    call:
      method: POST
      path: /customer_invoices/create_from_quote
      body: { quote_id: quote_id, external_reference: external_reference,
              customer_invoice_template_id: customer_invoice_template_id }
      constants: { body: { draft: true } }
    cost: { per: request }

  # --- Supplier invoices --------------------------------------------------

  - name: list_supplier_invoices
    class: read
    description: >-
      List supplier invoices (the expense side), newest first: to match
      against outgoing payments, or to find what remains to pay. Without a
      filter the whole history comes back: filter on date or supplier_id.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, supplier_id, date, invoice_number, external_reference, payment_status, category_id] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id, supplier_id, date (lt, lteq,
            gt, gteq, eq, not_eq, in, not_in), invoice_number,
            external_reference, payment_status (eq, not_eq, in, not_in),
            category_id (in).
        sort: { enum: [id, -id, date, -date], description: "Prefix with - for descending order." }
        limit: *limit
        cursor: *cursor
    examples:
      - title: Supplier invoices of the third quarter
        input:
          filter: [{ field: date, operator: gteq, value: "2026-07-01" }, { field: date, operator: lteq, value: "2026-09-30" }]
    call:
      method: GET
      path: /supplier_invoices
      query: { filter: filter, sort: sort, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination_long
    output: *list_output
    cost: { per: request }

  - name: get_supplier_invoice
    class: read
    description: >-
      Get one supplier invoice, with its accounting_status: draft, archived,
      entry, validation_needed or complete. Its lines are read with
      list_supplier_invoice_lines.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
    examples:
      - title: One supplier invoice
        input: { invoice_id: 8001 }
    refusals:
      - &supplier_invoice_not_found { code: supplier_invoice_not_found, when: 404, message: "No supplier invoice with this id in this Pennylane company." }
    call: { method: GET, path: "/supplier_invoices/{invoice_id}" }
    cost: { per: request }

  - name: list_supplier_invoice_lines
    class: read
    description: >-
      List the lines of a supplier invoice, with their id (needed to update
      or delete a line) and their vat_rate.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
        limit: *limit
        cursor: *cursor
    examples:
      - title: Lines of a supplier invoice
        input: { invoice_id: 8001 }
    call:
      method: GET
      path: /supplier_invoices/{invoice_id}/invoice_lines
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: update_supplier_invoice
    class: write
    description: >-
      Correct a supplier invoice not yet validated: label, dates, invoice
      number, supplier, amounts, external_reference, and its lines through
      invoice_lines {create, update, delete} (update and delete need the
      line id, from list_supplier_invoice_lines). Amounts are decimal
      strings. The amount before tax exists at invoice level only: a line
      carries currency_amount (tax included) and currency_tax, plus its
      vat_rate. No intracom_200 code exists: for an intra-EU acquisition at
      20%, ask the user which code applies, never guess. Pennylane decides
      whether an invoice already complete can be changed.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      minProperties: 2
      properties:
        invoice_id: *id
        label: { type: string }
        date: *date
        deadline: { type: string, format: date, description: "YYYY-MM-DD." }
        invoice_number: { type: string, description: "The supplier's invoice number." }
        supplier_id: *id
        currency: *currency
        currency_amount_before_tax: *decimal
        currency_amount: *decimal
        currency_tax: *decimal
        external_reference: { type: string }
        invoice_lines:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            create:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [label, currency_amount, currency_tax, vat_rate]
                properties:
                  label: { type: string }
                  description: { type: string }
                  currency_amount: *decimal
                  currency_tax: *decimal
                  vat_rate: *vat_rate
                  ledger_account_id: *id
            update:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                minProperties: 2
                properties:
                  id: *id
                  label: { type: string }
                  description: { type: string }
                  currency_amount: *decimal
                  currency_tax: *decimal
                  vat_rate: *vat_rate
                  ledger_account_id: *id
            delete:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                properties: { id: *id }
          description: "Lines to add, change or remove."
    examples:
      - title: Change the VAT code of one line
        input: { invoice_id: 8001, invoice_lines: { update: [{ id: 9101, vat_rate: intracom_100 }] } }
      - title: Correct the invoice number and the deadline
        input: { invoice_id: 8001, invoice_number: FA-2026-118, deadline: "2026-11-30" }
    refusals:
      - *supplier_invoice_not_found
    call:
      method: PUT
      path: /supplier_invoices/{invoice_id}
      body: { label: label, date: date, deadline: deadline, invoice_number: invoice_number,
              supplier_id: supplier_id, currency: currency,
              currency_amount_before_tax: currency_amount_before_tax,
              currency_amount: currency_amount, currency_tax: currency_tax,
              external_reference: external_reference, invoice_lines: invoice_lines }
    cost: { per: request }

  - name: validate_supplier_invoice
    class: sensitive
    description: >-
      Validate the accounting of a supplier invoice: it moves to complete and
      its accounting entry is posted. The API offers no way back. Call it
      only on the user's explicit request, invoice by invoice, never right
      after a correction. Refused when the entry lines are not balanced.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id: *id
    examples:
      - title: Validate one checked invoice
        input: { invoice_id: 8001 }
    refusals:
      - *supplier_invoice_not_found
      - { code: entry_unbalanced, when: 422, message: "Pennylane refused the validation: the entry lines of this invoice are not balanced, or the invoice is incomplete." }
    confirm:
      summary: "Validate the accounting of supplier invoice {invoice_id}: its entry is posted and the API cannot undo it."
    call: { method: PUT, path: "/supplier_invoices/{invoice_id}/validate_accounting" }
    cost: { per: request }

  # --- Ledger -------------------------------------------------------------

  - name: list_ledger_entries
    class: read
    description: >-
      List ledger entries. Without a filter the whole history comes back,
      thousands of entries on a real ledger: filter at the source on date,
      journal_id or id, the only way to find an entry without reading every
      page. Scope ledger_entries:readonly.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, journal_id, date] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id and journal_id (lt, lteq, gt,
            gteq, eq, not_eq, in, not_in), date (lt, lteq, gt, gteq, eq,
            not_eq).
        sort: { enum: [id, -id, date, -date], description: "Prefix with - for descending order." }
        limit: *limit
        cursor: *cursor
    examples:
      - title: Entries of one journal since January
        input:
          filter: [{ field: journal_id, operator: eq, value: "12" }, { field: date, operator: gteq, value: "2026-01-01" }]
          sort: -date
    call:
      method: GET
      path: /ledger_entries
      query: { filter: filter, sort: sort, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination_long
    output: *list_output
    cost: { per: request }

  - name: get_ledger_entry
    class: read
    description: One ledger entry by its id, e.g. to read back an entry just posted.
    input:
      type: object
      additionalProperties: false
      required: [entry_id]
      properties:
        entry_id: *id
    examples:
      - title: One entry
        input: { entry_id: 10001 }
    refusals:
      - &entry_not_found { code: ledger_entry_not_found, when: 404, message: "No ledger entry with this id in this Pennylane company." }
    call: { method: GET, path: "/ledger_entries/{entry_id}" }
    cost: { per: request }

  - name: list_ledger_entry_lines
    class: read
    description: >-
      List the lines of a ledger entry with their id: lettering takes line
      ids, not entry ids. Line order is not guaranteed: match a line on its
      content, never on its position.
    input:
      type: object
      additionalProperties: false
      required: [entry_id]
      properties:
        entry_id: *id
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [ledger_account_id] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Field: ledger_account_id (lt, lteq, gt,
            gteq, eq, not_eq, in, not_in).
        limit: *limit
        cursor: *cursor
    examples:
      - title: Lines of an entry
        input: { entry_id: 10001 }
    refusals:
      - *entry_not_found
    call:
      method: GET
      path: /ledger_entries/{entry_id}/ledger_entry_lines
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: list_lettered_lines
    class: read
    description: >-
      List the ledger entry lines lettered with a given line: the way to see
      what a lettering actually grouped, since lettering spreads to lines
      already lettered.
    input:
      type: object
      additionalProperties: false
      required: [line_id]
      properties:
        line_id: *id
        limit: *limit
        cursor: *cursor
    examples:
      - title: Lines lettered with one line
        input: { line_id: 20001 }
    call:
      method: GET
      path: /ledger_entry_lines/{line_id}/lettered_ledger_entry_lines
      query: { limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: create_ledger_entry
    class: sensitive
    description: >-
      Post an entry to the general ledger. Pennylane has no draft for a
      ledger entry and the API cannot delete one: the entry is posted at
      once, and the only remedy is update_ledger_entry. Before calling, give
      the user the exact detail (journal, date, label, each line with its
      account and amount) and wait for agreement. Each line carries debit
      and credit as decimal strings ("120.50", "0.00") and a
      ledger_account_id (list_ledger_accounts); total debits must equal
      total credits, or Pennylane refuses the entry. journal_id comes from
      list_journals. 1 to 1000 lines. The order of the returned lines is not
      guaranteed: find a line by its content.
    input:
      type: object
      additionalProperties: false
      required: [date, label, journal_id, ledger_entry_lines]
      properties:
        date: *date
        label: { type: string, minLength: 1 }
        journal_id: *id
        ledger_entry_lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: &entry_line
            type: object
            additionalProperties: false
            required: [debit, credit, ledger_account_id]
            properties:
              debit: *decimal
              credit: *decimal
              ledger_account_id: *id
              label: { type: string }
        due_date: { type: string, format: date, description: "YYYY-MM-DD." }
        currency: *currency
        piece_number: { type: string, description: "Generated when absent." }
    examples:
      - title: A balanced two-line entry
        input:
          date: "2026-10-06"
          label: Bank fees October
          journal_id: 12
          ledger_entry_lines:
            - { debit: "15.00", credit: "0.00", ledger_account_id: 4101 }
            - { debit: "0.00", credit: "15.00", ledger_account_id: 4102 }
    refusals:
      - { code: entry_unbalanced, when: "total debits differ from total credits", message: "The entry is not balanced: total debits must equal total credits." }
    checks:
      - { kind: equal_sums, refusal: entry_unbalanced, items: ledger_entry_lines, fields: [debit, credit] }
    confirm:
      summary: "Post ledger entry \"{label}\" dated {date} in journal {journal_id}: no draft, and the API cannot delete it."
    call:
      method: POST
      path: /ledger_entries
      body: { date: date, label: label, journal_id: journal_id,
              ledger_entry_lines: ledger_entry_lines, due_date: due_date,
              currency: currency, piece_number: piece_number }
    cost: { per: request }

  - name: update_ledger_entry
    class: sensitive
    description: >-
      Change a posted ledger entry: the only remedy for a wrong entry, since
      the API cannot delete one. ledger_entry_lines takes {create, update,
      delete}, and delete removes lines by id: this commits as much as a
      creation, so give the user the exact detail and wait for agreement.
      The lines must stay balanced; line ids come from
      list_ledger_entry_lines.
    input:
      type: object
      additionalProperties: false
      required: [entry_id]
      minProperties: 2
      properties:
        entry_id: *id
        date: *date
        label: { type: string, minLength: 1 }
        journal_id: *id
        currency: *currency
        piece_number: { type: string }
        ledger_entry_lines:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            create: { type: array, items: *entry_line }
            update:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                minProperties: 2
                properties:
                  id: *id
                  debit: *decimal
                  credit: *decimal
                  ledger_account_id: *id
                  label: { type: string }
            delete:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id]
                properties: { id: *id }
    examples:
      - title: Move one line to another account
        input: { entry_id: 10001, ledger_entry_lines: { update: [{ id: 20001, ledger_account_id: 4103 }] } }
    refusals:
      - *entry_not_found
    confirm:
      summary: "Change posted ledger entry {entry_id}: lines may be rewritten or deleted."
    call:
      method: PUT
      path: /ledger_entries/{entry_id}
      body: { date: date, label: label, journal_id: journal_id, currency: currency,
              piece_number: piece_number, ledger_entry_lines: ledger_entry_lines }
    cost: { per: request }

  - name: letter_ledger_entry_lines
    class: sensitive
    description: >-
      Letter ledger entry lines together. Not to be confused with matching a
      bank transaction to an invoice (match_customer_invoice_transaction,
      match_supplier_invoice_transaction): the wrong one raises no error, it
      just acts on the wrong objects. Lettering spreads: if a line passed is
      already lettered, the lettering extends to the lines it is already
      lettered with (asking for A and C when A and B are lettered gives A, B
      and C); check the result with list_lettered_lines. Pass line ids, not
      entry ids (list_ledger_entry_lines). unbalanced_lettering_strategy
      none refuses an unbalanced lettering, partial accepts it.
    input:
      type: object
      additionalProperties: false
      required: [ledger_entry_lines, unbalanced_lettering_strategy]
      properties:
        ledger_entry_lines: &lettering_lines
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties: { id: *id }
          description: "At least two ledger entry lines, as {id}."
        unbalanced_lettering_strategy: &strategy
          enum: [none, partial]
          default: none
          description: "none refuses an unbalanced lettering; partial accepts it."
    examples:
      - title: Letter an invoice line with its payment line
        input: { ledger_entry_lines: [{ id: 20001 }, { id: 20002 }], unbalanced_lettering_strategy: none }
    confirm:
      summary: "Letter the given ledger entry lines together; lines already lettered bring their group along."
    call:
      method: POST
      path: /ledger_entry_lines/lettering
      body: { ledger_entry_lines: ledger_entry_lines,
              unbalanced_lettering_strategy: unbalanced_lettering_strategy }
    cost: { per: request }

  - name: unletter_ledger_entry_lines
    class: sensitive
    description: >-
      Undo the lettering of ledger entry lines. The previous grouping is not
      returned: read it first with list_lettered_lines if it may have to be
      restored.
    input:
      type: object
      additionalProperties: false
      required: [ledger_entry_lines, unbalanced_lettering_strategy]
      properties:
        ledger_entry_lines: *lettering_lines
        unbalanced_lettering_strategy: *strategy
    examples:
      - title: Unletter two lines
        input: { ledger_entry_lines: [{ id: 20001 }, { id: 20002 }], unbalanced_lettering_strategy: none }
    confirm:
      summary: "Unletter the given ledger entry lines."
    call:
      method: DELETE
      path: /ledger_entry_lines/lettering
      body: { ledger_entry_lines: ledger_entry_lines,
              unbalanced_lettering_strategy: unbalanced_lettering_strategy }
    cost: { per: request }

  # --- Bank, balance, reconciliation --------------------------------------

  - name: list_transactions
    class: read
    description: >-
      List bank transactions, newest first. Without a filter the whole
      history comes back, far beyond what an agent can read: filter on date
      at the source. A transaction not fully matched carries a non-zero
      outstanding_balance.
    input:
      type: object
      additionalProperties: false
      properties:
        filter:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { enum: [id, bank_account_id, journal_id, date] }
              operator: *operator
              value: *clause_value
            allOf: [*in_takes_a_list]
          description: >-
            Clauses that must all hold, each {field, operator, value}; in
            and not_in take a list. Fields: id, bank_account_id, journal_id
            (eq, not_eq, in, not_in), date (eq, not_eq, gt, lt, lteq, gteq).
        limit: *limit
        cursor: *cursor
    examples:
      - title: Transactions of September
        input:
          filter: [{ field: date, operator: gteq, value: "2026-09-01" }, { field: date, operator: lteq, value: "2026-09-30" }]
    call:
      method: GET
      path: /transactions
      query: { filter: filter, limit: limit, cursor: cursor }
      encode: { filter: json }
    pagination: *pagination_long
    output: *list_output
    cost: { per: request }

  - name: get_trial_balance
    class: read
    description: >-
      Get the trial balance for a period: balances grouped by ledger
      account. Scope trial_balance:readonly. Up to 1000 accounts per page.
    input:
      type: object
      additionalProperties: false
      required: [period_start, period_end]
      properties:
        period_start: { type: string, format: date, description: "YYYY-MM-DD." }
        period_end: { type: string, format: date, description: "YYYY-MM-DD." }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        cursor: *cursor
    examples:
      - title: Trial balance of 2025
        input: { period_start: "2025-01-01", period_end: "2025-12-31" }
    call:
      method: GET
      path: /trial_balance
      query: { period_start: period_start, period_end: period_end, limit: limit, cursor: cursor }
    pagination: *pagination
    output: *list_output
    cost: { per: request }

  - name: match_customer_invoice_transaction
    class: write
    description: >-
      Match a bank transaction to a finalized customer invoice, e.g. to
      settle a paid invoice whose incoming transfer is not matched (else
      Pennylane keeps it late and reminds the customer wrongly). A
      reconciliation link, not an accounting entry. Not to be confused with
      lettering ledger entry lines (letter_ledger_entry_lines). One
      transaction per call.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id, transaction_id]
      properties:
        invoice_id: *id
        transaction_id: *id
    examples:
      - title: Match an incoming transfer to an invoice
        input: { invoice_id: 5001, transaction_id: 30001 }
    call:
      method: POST
      path: /customer_invoices/{invoice_id}/matched_transactions
      body: { transaction_id: transaction_id }
    cost: { per: request }

  - name: match_supplier_invoice_transaction
    class: write
    description: >-
      Match a bank transaction to a supplier invoice. A reconciliation link,
      not an accounting entry. Not to be confused with lettering ledger
      entry lines (letter_ledger_entry_lines). One transaction per call.
    input:
      type: object
      additionalProperties: false
      required: [invoice_id, transaction_id]
      properties:
        invoice_id: *id
        transaction_id: *id
    examples:
      - title: Match an outgoing transfer to a supplier invoice
        input: { invoice_id: 8001, transaction_id: 30002 }
    call:
      method: POST
      path: /supplier_invoices/{invoice_id}/matched_transactions
      body: { transaction_id: transaction_id }
    cost: { per: request }

exposure:
  mode: per_connector
  tool: pennylane
