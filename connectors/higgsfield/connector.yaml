# yaml-language-server: $schema=../connector.schema.json
# Higgsfield API reference: https://docs.higgsfield.ai (OpenAPI: https://docs.higgsfield.ai/docs/openapi.json)
# The fixed endpoints are described here. The generation and its estimate are not: each
# model is its own path (`POST /<model slug>`, `POST /estimate/<model slug>`, a slug with
# slashes in it) and takes its own body, with no published schema (`GET /models` answers
# `input_schema: null`); the estimate answers either an amount or a sentence of
# per-second prices. They stay in the Python client (`generate`, `estimate`, `price_of`).
# A 403 is documented both as an insufficient balance and as a disabled key, so it marks
# nothing.
connector:
  name: higgsfield
  label: Higgsfield
  namespace: higgsfield
  version: 1.0.0
  api_version: "2.0.0"
  base_url: https://api.higgsfield.ai
  auth:
    kind: api_key
    in: header
    name: Authorization
    prefix: "Key "
    key: api_key
  credential:
    - { name: api_key, label: "API key (KEY_ID:KEY_SECRET)", secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  probe: { function: list_models, non_empty: [items] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Higgsfield rejected the request: detail names the faulty parameter, or the job has already started and can no longer be canceled." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Higgsfield did not accept the key: it is KEY_ID:KEY_SECRET from the console, joined by a colon. Retrying unchanged fails the same way." }
    - { status: 403, code: not_allowed, retryable: false,
        message: "Higgsfield refused the call: the balance is too low for this job (add funds in the console), or the key is disabled or expired." }
    - { status: 404, code: not_found, retryable: false,
        message: "Higgsfield found no such request or model for this key: a request belongs to the account that made it." }
    - { status: 409, code: still_running, retryable: true,
        message: "The Higgsfield job is still queued or in progress: its data can be deleted once it has finished." }
    - { status: 422, code: invalid_request, retryable: false,
        message: "Higgsfield could not validate the request: detail names the field." }
    - { status: 423, code: model_blocked, retryable: true,
        message: "This Higgsfield model is temporarily blocked: retry later or use another model." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "The Higgsfield account's queue is full or a limit was reached: retry after Retry-After seconds." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Higgsfield is temporarily unavailable, or the model is not ready: retry later." }

functions:
  - name: list_models
    class: read
    description: >-
      The models this key can call: slug (the path a generation is sent to,
      e.g. higgsfield-ai/soul/v2/standard), title, description, output_type
      (image or video) and operation_type (text2image, image2video,
      video2video…). The parameters of each model are on its page of the API
      reference; none are listed here.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Every model
        input: {}
    call: { method: GET, path: /models }
    cost: { per: request }

  - name: get_request
    class: read
    description: >-
      One generation: status queued, in_progress, completed, failed (with
      error), nsfw or canceled. Once completed, the outputs as public
      addresses (images, video, audio, audios, each with url) and expires_at,
      when the files are deleted (seven days after the end by default).
      Failed, nsfw and canceled jobs are not charged.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid, pattern: "^[0-9a-fA-F-]{36}$" }
    examples:
      - title: Is the clip ready
        input: { request_id: d7e6c0f3-6699-4f6c-bb45-2ad7fd9158ff }
    call: { method: GET, path: "/requests/{request_id}/status" }
    cost: { per: request }

  - name: cancel_request
    class: write
    description: >-
      Cancel a generation that is still queued; it is refunded. A job that
      has started (in_progress) can no longer be canceled and answers 400.
      The answer has no body.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid, pattern: "^[0-9a-fA-F-]{36}$" }
    examples:
      - title: Cancel a queued job
        input: { request_id: d7e6c0f3-6699-4f6c-bb45-2ad7fd9158ff }
    call: { method: POST, path: "/requests/{request_id}/cancel" }
    cost: { per: request }

  - name: delete_request
    class: sensitive
    description: >-
      Delete a finished generation's input and output files, prompt and
      parameters now, before their retention ends; billing records stay.
      A job still queued or in progress answers 409. Repeating the call
      answers the same.
    input:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid, pattern: "^[0-9a-fA-F-]{36}$" }
    examples:
      - title: Remove a job's files
        input: { request_id: d7e6c0f3-6699-4f6c-bb45-2ad7fd9158ff }
    call: { method: DELETE, path: "/requests/{request_id}" }
    cost: { per: request }
    confirm:
      summary: "Delete the files, prompt and parameters of Higgsfield request {request_id}: irreversible."

  - name: create_upload_url
    class: write
    act: false
    description: >-
      A presigned address for one input file (an image, a video or an audio
      a model takes): PUT the bytes to upload_url within the hour, with every
      header of upload_headers and never the API key, then pass public_url in
      the model's parameters (image_url, video_url…). Content types: jpeg,
      png, webp, gif, wav, mp4.
    input:
      type: object
      additionalProperties: false
      required: [content_type]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/jpg, image/png, image/webp, image/gif, audio/wav, audio/x-wav, video/mp4]
    examples:
      - title: Upload a first frame
        input: { content_type: image/png }
    call: { method: POST, path: /files/generate-upload-url, body: { content_type: content_type } }
    cost: { per: request }
