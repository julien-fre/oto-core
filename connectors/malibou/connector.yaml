# yaml-language-server: $schema=../connector.schema.json
# Malibou Public API v1 reference: https://developers.malibou.com
# OpenAPI: https://developers.malibou.com/api-reference/openapi/public-api-1.11.0.json
# French payroll and HR, READ-ONLY: employees (collaborators), absences and
# work locations of one organization. An organization admin creates the key
# under Admin → Company → API keys, ticks its scopes, and copies the
# organization id from the same page. The key never expires until revoked.
#
# Scopes a key may carry: org:employee:read, org:employee:details:read
# (social security number, address, phone, bank account, manager, team),
# org:contract:details:read, org:absence:read, org:absence:type:read (leave
# code), org:work_location:read. Personal fields are returned only when the key
# holds the matching details scope.
#
# One account is one organization: the organization_id setting is cited by
# base_url (.../organizations/{organization_id}) and no function takes it.
#
# Not described here: the partner-only routes (organization and establishments,
# meal vouchers, complementary health contracts and affiliations), which need
# a partnership agreement with Malibou; a self-serve key gets 403 on them.
connector:
  name: malibou
  label: Malibou
  namespace: malibou
  version: 1.0.0
  api_version: 1.11.0
  base_url: https://app.malibou.com/api/public/v1/organizations/{organization_id}
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  settings:
    - { name: organization_id, label: Organization ID, type: text,
        pattern: "^[A-Za-z0-9_-]{1,64}$" }
  modes: [byo_user, byo_org]
  timeout_s: 60
  probe:
    function: list_collaborators
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Malibou rejected the request as invalid: check the arguments (dates as YYYY-MM-DD, page and limit positive)." }
    - { status: 401, code: access_rejected, retryable: false,
        message: "Malibou rejected the API key: it is invalid or revoked." }
    - { status: 403, code: scope_missing, retryable: false,
        message: "Malibou refused the call: the API key lacks the scope this read needs (employees, absences or work locations), or the organization id does not match the key." }
    - { status: 404, code: not_found, retryable: false,
        message: "Malibou object not found: check the collaborator id and the organization id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Malibou rate limit reached: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Malibou is temporarily unavailable: retry later." }

functions:
  - name: list_collaborators
    class: read
    description: >-
      List the employees (collaborators) of the organization, ordered by last
      then first name: {data: [{id, status, personnelNumber, firstName,
      lastName, email, seniorityDate, team, manager, currentContract {id,
      startDate, natureContrat, estCadre}, ...}], total, page, limit}. Personal
      fields (social security number, address, phone, bank account) come only
      when the key holds the details scope. contract_status narrows on today's
      employment: active (at least one active contract), past (all contracts
      ended) or future (only an upcoming contract). Pages are numbered from 1;
      the last page holds fewer than limit items.
    input:
      type: object
      additionalProperties: false
      properties:
        establishment_id: &establishment
          type: string
          minLength: 1
          description: "Only the employees of this establishment."
        contract_status:
          type: string
          enum: [past, active, future]
          description: "Employment status relative to today."
        page: &page
          type: integer
          minimum: 1
          description: "Page number, from 1."
        limit: &limit
          type: integer
          minimum: 1
          description: "Items per page."
    examples:
      - { title: Active employees, input: { contract_status: active } }
      - { title: Second page of one establishment, input: { establishment_id: "est_123", page: 2, limit: 50 } }
    call:
      method: GET
      path: /collaborators
      query: { establishmentId: establishment_id, contractStatus: contract_status,
               page: page, limit: limit }
    cost: { per: request }

  - name: get_collaborator
    class: read
    description: >-
      Get one employee by id, unwrapped (no data envelope): identity, contact,
      seniority, team, manager, current contract, and every contract
      {contractId, startDate, endDate}. Personal fields (socialSecurityNumber,
      address, phone, bankAccount, countryOfBirth) come only when the key holds
      the details scope.
    input:
      type: object
      additionalProperties: false
      required: [collaborator_id]
      properties:
        collaborator_id:
          type: string
          minLength: 1
          description: "The collaborator id, from list_collaborators."
        establishment_id: *establishment
    examples:
      - { title: One employee, input: { collaborator_id: "col_123" } }
    call:
      method: GET
      path: /collaborators/{collaborator_id}
      query: { establishmentId: establishment_id }
    cost: { per: request }

  - name: list_absences
    class: read
    description: >-
      List the absences that overlap a date window (both bounds required,
      YYYY-MM-DD), ordered by start date: {data: [{id, collaboratorId,
      startDate, endDate, startHalfDay, endHalfDay, status, type, createdAt}],
      total, page, limit}. type (the leave code) needs the absence-type scope.
      status narrows to approved, pending or rejected.
    input:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date: &day
          type: string
          pattern: "^\\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\\d|3[01])$"
          description: "Window start, YYYY-MM-DD."
        end_date:
          <<: *day
          description: "Window end, YYYY-MM-DD."
        status: &status
          type: string
          enum: [approved, pending, rejected]
          description: "Only the records with this status."
        establishment_id: *establishment
        page: *page
        limit: *limit
    examples:
      - { title: Approved absences in October, input: { start_date: "2026-10-01", end_date: "2026-10-31", status: approved } }
    call:
      method: GET
      path: /absences
      query: { startDate: start_date, endDate: end_date, status: status,
               establishmentId: establishment_id, page: page, limit: limit }
    cost: { per: request }

  - name: list_work_locations
    class: read
    description: >-
      List the declared work locations (remote work or on site) that overlap a
      date window (both bounds required, YYYY-MM-DD), ordered by start date:
      {data: [{id, collaboratorId, isRemoteWork, location, startDate, endDate,
      startHalfDay, endHalfDay, status, createdAt}], total, page, limit}.
      status narrows to approved, pending or rejected.
    input:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date: *day
        end_date:
          <<: *day
          description: "Window end, YYYY-MM-DD."
        status: *status
        establishment_id: *establishment
        page: *page
        limit: *limit
    examples:
      - { title: Remote work this week, input: { start_date: "2026-10-12", end_date: "2026-10-16" } }
    call:
      method: GET
      path: /work-locations
      query: { startDate: start_date, endDate: end_date, status: status,
               establishmentId: establishment_id, page: page, limit: limit }
    cost: { per: request }
