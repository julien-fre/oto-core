# yaml-language-server: $schema=../connector.schema.json
# Brevo API v3 (https://developers.brevo.com/reference, OpenAPI https://api.brevo.com/v3/swagger_definition_v3.yml,
# read on 2026-10-23). The values come from the Python client, oto.tools.brevo, which this description follows: one
# request per call to api.brevo.com/v3, the v3 API key in the api-key header, JSON bodies. The argument names and the
# keys sent to Brevo are the client's; the client is not changed (tests/test_brevo_description.py reads it to keep
# both equal).
#
# One function per request. A client method that sends one request to one route is a function of its name. A method
# that picks its route from an argument is one function per route, the argument fixed by the function, named in the
# test (SPLIT): list_lists (account, or a folder: list_folder_lists), list_templates (all, or one: get_template),
# transactional_report (one total, or one row per day: transactional_report_by_day), list_blocked (contacts, or
# domains: list_blocked_domains), and the native CRM, whose generic methods take the object as entity, where the four
# objects live under different paths: crm_list, crm_get, crm_create, crm_update (crm_<verb>_deal, _company, _task,
# _note) and crm_link (crm_link_deal, crm_link_company).
#
# Read and act. Reads stay on the read side. Every call that creates or changes something is served on the act side
# (class write), but create_campaign, which only writes a draft (act: false). Ask for a confirmation (class
# sensitive): everything that sends an email (send_email, send_campaign_test), everything that changes the membership
# of a list or the consent of a contact (upsert_contact and update_contact take listIds, unlinkListIds and the
# blacklist flags; add_to_list, remove_from_list, whose all empties the list): a list may start the Brevo
# automations tied to it, as Klaviyo's; the bulk import (thousands of contacts written, existing ones updated); the
# export, whose notifyUrl receives the link of a file holding the selected contacts.
#
# What the client and oto 1 keep out stays out: sending a campaign (sendNow, status sent), every delete, purging hard
# bounces. scheduled_at of create_campaign and scheduledAt/sendAtBestTime of update_campaign are left out: they
# schedule the mass send that the client and oto 1 leave to the Brevo app (oto 1 never passes them).
#
# Values the client sets when the call omits them:
# - Brevo's own defaults (limit and offset of the lists, updateExistingContacts and emptyContactsAttributes of an
#   import): not declared as defaults, the host sends nothing for an absent argument and Brevo then applies the same.
# - Values whose absence changes what Brevo does, required here: updateEnabled of upsert_contact (the client sends
#   true; Brevo's default is false, a known email is then refused), isActive of create_template (the client sends
#   true), excludeHtmlContent of list_campaigns and get_campaign (the client sends true: without it every campaign
#   comes with its HTML), disableNotification of the import and the export (the client sends true; Brevo's default
#   sends an email to the account), customContactFilter of the export (the client sends {emailBlacklisted: false}).
# - The client caps limit (contacts 1000, contacts of a list 500, transactional logs 500, events 100, templates 1000,
#   campaigns 100); the schema refuses above, where the client would lower it. The lists, folders and segments take
#   at most 50, Brevo's reference bound, which the client passes through.
#
# Contact attributes: Brevo stores typed attributes (text, number, date, boolean, category) declared on the account,
# in UPPERCASE, under attributes, an object nested in the body (not the body itself). They are free keys of simple
# value, each personal: additionalProperties { type: [string, number, boolean], personal: true }, a date as a text.
# Brevo also takes a list of texts for a multiple-choice attribute ({COUNTRIES: [..]}), as does the client: refused
# here, named in the test. The deal and company attributes of the CRM take the same form.
#
# The CRM lists take, as named arguments, the filters the client writes from its filters dict: filters[<key>] for
# deals and companies, filter[<key>] for tasks, flat keys for notes, one per filter documented by the reference.
# Companies page by page number, which the client computes from offset: crm_list_companies takes page. The keys the
# client sends but the reference does not document for tasks and notes (modifiedSince, createdSince; sortBy of notes)
# are left out.
#
# Pagination: limit and offset (page for companies); the answers give count, never the next offset: no pagination is
# declared, the agent passes offset. Lists in the query repeat their key (listIds=1&listIds=2), as the client sends
# them; the reference says senders of list_blocked is comma separated: to read on a real call.
#
# Rate: Brevo limits per route and per plan (10 per second on the contacts, 300 per hour on the other /smtp reads,
# 100 per hour on the CRM and campaigns for the general plans; developers.brevo.com/docs/api-limits, read on
# 2026-10-23); one connector rate cannot say it, none is declared. The client does not pace.
#
# Errors (body {code, message}): the client names none (raise_for_upstream, every status above 400 the same error).
# A 401 says "Invalid or missing API key" (the host always sends it): it marks the account credential_rejected, but
# when its message names an unrecognised IP address (Brevo's authorised IPs, on by default since 2024: the key is
# valid, the calling address is not allowed; reported by users, not in the reference: to read on a real call). The
# code not_enough_credits, under a 400 or a 402, marks it quota_exhausted. A 425 (account still in process) and a 429
# are refused before running: retryable. A 5xx is not: a send or a write may have gone through.
#
# Probe: get_account, as oto 1. No balance: the account gives its credits per plan and credit type (plan[].credits),
# no single value. The marketingAutomation.key of the account is the public tracker id of a website, not a secret.
#
# Not described here, left to the hand-written client:
# - attachment of send_email: the bytes of a file go base64 inside the JSON body (or a URL Brevo downloads); the
#   format takes a file only as a transit file of the caller, sent in multipart (oto 1 never passes it);
# - the async import and export return {processId}; the client has no method to read a process, so no async is
#   declared.
connector:
  name: brevo
  label: Brevo
  namespace: brevo
  version: 1.0.0
  api_version: v3
  base_url: https://api.brevo.com/v3
  auth: { kind: api_key, in: header, name: api-key, key: api_key }
  credential:
    - { name: api_key, label: API key (v3), secret: true }
  # A key covers the whole Brevo account: its contacts, its credits, its senders. No platform key.
  modes: [byo_user, byo_org]
  query_arrays: repeat
  probe: { function: get_account }
  errors:
    - { status: 400, body: { path: code, equals: [not_enough_credits] }, code: credits_exhausted, retryable: false,
        marks_account: quota_exhausted,
        message: "Brevo credits are exhausted for this send or this plan. Top up or upgrade the Brevo account." }
    - { status: 400, code: invalid_request, retryable: false,
        message: "Brevo rejected the request: its code and message say why (invalid_parameter, missing_parameter, duplicate_parameter, campaign_sent, an unknown attribute…)." }
    - { status: 401, body: { path: message, contains: [unrecognised ip address] }, code: ip_not_authorized,
        retryable: false,
        message: "Brevo refused the calling IP address: the key is valid, but the account allows only its authorised IPs (Brevo, Security, Authorised IPs)." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "Brevo refused the API key: invalid or revoked. A new v3 key is made in Brevo, SMTP & API, API keys." }
    - { status: 402, body: { path: code, equals: [not_enough_credits] }, code: credits_exhausted, retryable: false,
        marks_account: quota_exhausted,
        message: "Brevo credits are exhausted for this send or this plan. Top up or upgrade the Brevo account." }
    - { status: 402, code: payment_required, retryable: false,
        message: "Brevo refused for billing: the account needs an activation or a plan that includes this." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Brevo refused this call for this account: a permission or a feature it lacks." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Brevo: wrong id or address, or not in this account." }
    - { status: 425, code: account_in_process, retryable: true,
        message: "Brevo is still processing the account or the contact: wait, then retry." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Brevo rate limit reached for this route and plan: wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: false,
        message: "Brevo failed. A read can be retried; a send or a write may have gone through: read it back before acting again." }

functions:
  # --- Account ---------------------------------------------------------------------

  - name: get_account
    class: read
    description: >-
      Get the Brevo account: company, login email, plans and their remaining
      email and SMS credits (plan[].credits, per credit type), relay.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The account, input: {} }
    call: { method: GET, path: /account }
    cost: &request { per: request }

  - name: list_senders
    class: read
    description: >-
      List the account's verified senders (id, name, email, active). Sending an
      email or creating a template or campaign takes one of them as sender.
    input:
      type: object
      additionalProperties: false
      properties:
        ip: { type: string, minLength: 1, description: "Only the senders of this dedicated IP." }
        domain: { type: string, minLength: 1, description: "Only the senders of this domain." }
    examples:
      - { title: Every sender, input: {} }
      - { title: The senders of a domain, input: { domain: acme.example } }
    call:
      method: GET
      path: /senders
      query: { ip: ip, domain: domain }
    cost: *request

  # --- Contacts --------------------------------------------------------------------

  - name: list_contacts
    class: read
    description: >-
      List contacts, newest first by default: {contacts, count}. Page with
      limit (50 by default, at most 1000) and offset. Restrict to lists
      (list_ids) or to a segment (segment_id), never both; to some ids (20 at
      most); to a change or creation date; or to attribute values with filter,
      equals only: equals(FIRSTNAME,"Alex").
    input:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 1000, description: "Page size, 50 by default." }
        offset: &offset { type: integer, minimum: 0, description: "Index of the first record, 0 by default." }
        modified_since: &modified_since { type: string, minLength: 1, description: "UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ): changed after." }
        created_since: &created_since { type: string, minLength: 1, description: "UTC date-time (YYYY-MM-DDTHH:mm:ss.SSSZ): created after." }
        sort: &sort { type: string, enum: [asc, desc], description: "Order of creation, desc by default." }
        segment_id: { type: integer, minimum: 1, description: "Only this segment's contacts; not with list_ids." }
        list_ids: &list_ids { type: array, minItems: 1, items: { type: integer, minimum: 1 }, description: "List ids." }
        ids: { type: array, minItems: 1, maxItems: 20, items: { type: integer, minimum: 1 }, description: "Contact ids, 20 at most." }
        filter: { type: string, minLength: 1, personal: true, description: "equals(ATTRIBUTE,\"value\"), equals only." }
    examples:
      - { title: The latest contacts, input: {} }
      - { title: The contacts of two lists, input: { list_ids: [3, 7], limit: 500 } }
      - { title: By first name, input: { filter: "equals(FIRSTNAME,\"Alex\")", sort: asc } }
    call:
      method: GET
      path: /contacts
      query: { limit: limit, offset: offset, modifiedSince: modified_since, createdSince: created_since, sort: sort,
               segmentId: segment_id, listIds: list_ids, ids: ids, filter: filter }
    cost: *request

  - name: get_contact
    class: read
    description: >-
      Get one contact: attributes, lists, blacklist flags and its campaign
      statistics (opens, clicks, bounces, unsubscriptions). identifier is its
      email by default; identifier_type says otherwise. start_date and
      end_date (YYYY-MM-DD, both or none) bound the statistics.
    input:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: &identifier { type: string, minLength: 1, personal: true, description: "Email, contact id, phone (SMS attribute) or EXT_ID, as identifier_type says." }
        identifier_type: &identifier_type
          type: string
          enum: [email_id, contact_id, phone_id, ext_id, whatsapp_id, landline_number_id]
          description: "What identifier is; an email by default."
        start_date: &day_from { type: string, minLength: 1, description: "YYYY-MM-DD." }
        end_date: &day_to { type: string, minLength: 1, description: "YYYY-MM-DD." }
    examples:
      - { title: A contact by email, input: { identifier: marie@example.test } }
      - { title: A contact by id, input: { identifier: "42", identifier_type: contact_id } }
    call:
      method: GET
      path: "/contacts/{identifier}"
      query: { identifierType: identifier_type, startDate: start_date, endDate: end_date }
    cost: *request

  - name: upsert_contact
    class: sensitive
    description: >-
      Create a contact, or update it when it exists and update_enabled is
      true. Answers {id} on creation, {} on an update. attributes are the
      account's attributes in UPPERCASE (list_attributes), a text, a number or
      a boolean each, a date as a text; an unknown one is refused. list_ids
      subscribes it to lists, which may start the automations tied to them.
      email_blacklisted / sms_blacklisted true stop every email / SMS to it.
      email is needed unless ext_id or the SMS attribute is given.
    input:
      type: object
      additionalProperties: false
      required: [update_enabled]
      properties:
        email: { type: string, minLength: 1, personal: true }
        attributes: &attributes
          type: object
          minProperties: 1
          propertyNames: { minLength: 1 }
          additionalProperties: { type: [string, number, boolean], personal: true }
          description: "Attribute name in UPPERCASE: a text, a number or a boolean."
        list_ids: *list_ids
        update_enabled: { type: boolean, description: "true: update the contact when it exists; false: refuse it." }
        ext_id: { type: string, minLength: 1, description: "Your own id for the contact." }
        email_blacklisted: { type: boolean, description: "true: no email goes to it anymore." }
        sms_blacklisted: { type: boolean, description: "true: no SMS goes to it anymore." }
    examples:
      - title: A contact, subscribed to a list
        input: { email: marie@example.test, attributes: { FIRSTNAME: Marie, LASTNAME: Martin, SCORE: 3 }, list_ids: [3], update_enabled: true }
      - { title: Create only, input: { email: paul@example.test, update_enabled: false } }
    confirm:
      summary: "Create or update Brevo contact {email} (update when it exists: {update_enabled}); lists {list_ids}, email blacklist {email_blacklisted}: a list may start its automations."
    call:
      method: POST
      path: /contacts
      body: { email: email, attributes: attributes, listIds: list_ids, updateEnabled: update_enabled, ext_id: ext_id,
              emailBlacklisted: email_blacklisted, smsBlacklisted: sms_blacklisted }
    cost: *request

  - name: update_contact
    class: sensitive
    description: >-
      Update an existing contact; answers {} on success. attributes are the
      account's attributes in UPPERCASE, a text, a number or a boolean each
      (EMAIL changes its address). list_ids subscribes it to lists, which may
      start their automations; unlink_list_ids unsubscribes it from lists.
      email_blacklisted / sms_blacklisted true stop every email / SMS to it,
      false allows them again.
    input:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: *identifier
        attributes: *attributes
        list_ids: *list_ids
        unlink_list_ids: { type: array, minItems: 1, items: { type: integer, minimum: 1 }, description: "Lists to unsubscribe it from." }
        identifier_type: *identifier_type
        email_blacklisted: { type: boolean, description: "true: no email goes to it; false: allowed again." }
        sms_blacklisted: { type: boolean, description: "true: no SMS goes to it; false: allowed again." }
        ext_id: { type: string, minLength: 1, description: "A new EXT_ID for the contact." }
    examples:
      - { title: Rename a contact, input: { identifier: marie@example.test, attributes: { LASTNAME: Durand } } }
      - { title: Unsubscribe from a list, input: { identifier: "42", identifier_type: contact_id, unlink_list_ids: [3] } }
    confirm:
      summary: "Update Brevo contact {identifier}: lists added {list_ids}, removed {unlink_list_ids}, email blacklist {email_blacklisted}."
    call:
      method: PUT
      path: "/contacts/{identifier}"
      query: { identifierType: identifier_type }
      body: { attributes: attributes, listIds: list_ids, unlinkListIds: unlink_list_ids, ext_id: ext_id,
              emailBlacklisted: email_blacklisted, smsBlacklisted: sms_blacklisted }
    cost: *request

  - name: contact_campaign_stats
    class: read
    description: >-
      Get one contact's email campaign statistics: messages sent, opened,
      clicked (links), bounces, unsubscriptions, each with its campaign.
      start_date and end_date (YYYY-MM-DD, both or none) bound them.
    input:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 1, personal: true, description: "Email or contact id." }
        start_date: *day_from
        end_date: *day_to
    examples:
      - { title: The statistics of a contact, input: { identifier: marie@example.test } }
    call:
      method: GET
      path: "/contacts/{identifier}/campaignStats"
      query: { startDate: start_date, endDate: end_date }
    cost: *request

  - name: import_contacts
    class: sensitive
    description: >-
      Import contacts in bulk, asynchronously: answers {processId}, not the
      contacts. The way past 150 contacts. One source: json_body (a list of
      {email, attributes}), file_url (a remote CSV, TXT or JSON) or file_body
      (CSV text, ; between columns). Into list_ids, or into a list created on
      the way (new_list: listName, folderId). Existing contacts are updated
      unless update_existing_contacts is false; empty_contacts_attributes
      true erases their attributes left empty.
    input:
      type: object
      additionalProperties: false
      required: [disable_notification]
      properties:
        list_ids: *list_ids
        json_body:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              email: { type: string, minLength: 1, personal: true }
              attributes: *attributes
        file_url: { type: string, minLength: 1, description: "Address of the file to import (https)." }
        file_body: { type: string, minLength: 1, personal: true, description: "CSV content, a header line first." }
        update_existing_contacts: { type: boolean, description: "Update the contacts that exist, true by default." }
        empty_contacts_attributes: { type: boolean, description: "true: an empty value erases the attribute. false by default." }
        new_list:
          type: object
          additionalProperties: false
          required: [listName, folderId]
          properties:
            listName: { type: string, minLength: 1 }
            folderId: { type: integer, minimum: 1 }
        notify_url: { type: string, minLength: 1, description: "Address Brevo calls when the import ends." }
        disable_notification: { type: boolean, description: "true: no email to the account when the import ends." }
    examples:
      - title: Two contacts into a list
        input:
          list_ids: [3]
          json_body:
            - { email: marie@example.test, attributes: { FIRSTNAME: Marie } }
            - { email: paul@example.test, attributes: { FIRSTNAME: Paul } }
          disable_notification: true
    confirm:
      summary: "Import contacts into Brevo lists {list_ids} (new list {new_list}); existing contacts updated: {update_existing_contacts}, empty values erase: {empty_contacts_attributes}."
    call:
      method: POST
      path: /contacts/import
      body: { listIds: list_ids, jsonBody: json_body, fileUrl: file_url, fileBody: file_body,
              updateExistingContacts: update_existing_contacts, emptyContactsAttributes: empty_contacts_attributes,
              newList: new_list, notifyUrl: notify_url, disableNotification: disable_notification }
    cost: *request

  - name: export_contacts
    class: sensitive
    description: >-
      Export contacts to a file, asynchronously: answers {processId}, not the
      contacts; Brevo makes the file and, given notify_url, posts its link
      there. contact_filter selects them: actionForContacts (allContacts,
      subscribed, unsubscribed, unsubscribedPerList) with listId, segmentId,
      modifiedSince or createdSince; or actionForEmailCampaigns with
      emailCampaignId; or actionForSmsCampaigns. To read contacts, list them.
    input:
      type: object
      additionalProperties: false
      required: [contact_filter, disable_notification]
      properties:
        contact_filter:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            actionForContacts: { type: string, enum: [allContacts, subscribed, unsubscribed, unsubscribedPerList] }
            actionForEmailCampaigns: { type: string, enum: [openers, nonOpeners, clickers, nonClickers, unsubscribed, hardBounces, softBounces] }
            actionForSmsCampaigns: { type: string, enum: [hardBounces, softBounces, unsubscribed] }
            listId: { type: integer, minimum: 1 }
            segmentId: { type: integer, minimum: 1 }
            emailCampaignId: { type: integer, minimum: 1 }
            smsCampaignId: { type: integer, minimum: 1 }
            modifiedSince: { type: string, minLength: 1 }
            createdSince: { type: string, minLength: 1 }
        export_attributes: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Attributes to export, in UPPERCASE." }
        notify_url: { type: string, minLength: 1, description: "Address Brevo posts the file link to when the export ends." }
        disable_notification: { type: boolean, description: "true: no email to the account when the export ends." }
    examples:
      - title: The subscribed contacts of a list
        input: { contact_filter: { actionForContacts: subscribed, listId: 3 }, export_attributes: [EMAIL, FIRSTNAME], disable_notification: true }
    confirm:
      summary: "Export Brevo contacts ({contact_filter}) to a file; its link goes to {notify_url}."
    call:
      method: POST
      path: /contacts/export
      body: { customContactFilter: contact_filter, exportAttributes: export_attributes, notifyUrl: notify_url,
              disableNotification: disable_notification }
    cost: *request

  - name: list_attributes
    class: read
    description: >-
      List the contact attributes declared on the account: name, category
      (normal, transactional, category, calculated, global), type (text, date,
      float, boolean…), and the choices of a category attribute. Read it
      before writing attributes: an unknown one is refused.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Every attribute, input: {} }
    call: { method: GET, path: /contacts/attributes }
    cost: *request

  - name: list_segments
    class: read
    description: >-
      List the segments, the dynamic lists a filter defines (read-only):
      {segments, count}. A segment's id restricts list_contacts.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: &limit_50 { type: integer, minimum: 1, maximum: 50, description: "Page size, 50 by default, at most 50." }
        offset: *offset
        sort: *sort
    examples:
      - { title: Every segment, input: {} }
    call:
      method: GET
      path: /contacts/segments
      query: { limit: limit, offset: offset, sort: sort }
    cost: *request

  # --- Lists and folders -------------------------------------------------------------

  - name: list_lists
    class: read
    description: >-
      List the account's contact lists: id, name, folderId, uniqueSubscribers,
      totalBlacklisted: {lists, count}. The lists of one folder:
      list_folder_lists.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *limit_50
        offset: *offset
        sort: *sort
    examples:
      - { title: Every list, input: {} }
    call:
      method: GET
      path: /contacts/lists
      query: { limit: limit, offset: offset, sort: sort }
    cost: *request

  - name: list_folder_lists
    class: read
    description: >-
      List the contact lists of one folder: {lists, count}.
    input:
      type: object
      additionalProperties: false
      required: [folder_id]
      properties:
        folder_id: { type: integer, minimum: 1, description: "Folder id (list_folders)." }
        limit: *limit_50
        offset: *offset
        sort: *sort
    examples:
      - { title: The lists of a folder, input: { folder_id: 1 } }
    call:
      method: GET
      path: "/contacts/folders/{folder_id}/lists"
      query: { limit: limit, offset: offset, sort: sort }
    cost: *request

  - name: get_list
    class: read
    description: >-
      Get one list: name, folder, number of subscribers and of blacklisted
      contacts, creation date, its campaigns' statistics.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: &list_id { type: integer, minimum: 1, description: "List id." }
    examples:
      - { title: A list, input: { list_id: 3 } }
    call: { method: GET, path: "/contacts/lists/{list_id}" }
    cost: *request

  - name: list_contacts_of_list
    class: read
    description: >-
      List the contacts of one list: {contacts, count}. Page with limit (50 by
      default, at most 500) and offset.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: *list_id
        limit: { type: integer, minimum: 1, maximum: 500, description: "Page size, 50 by default." }
        offset: *offset
        modified_since: *modified_since
        sort: *sort
    examples:
      - { title: The contacts of a list, input: { list_id: 3, limit: 500 } }
    call:
      method: GET
      path: "/contacts/lists/{list_id}/contacts"
      query: { limit: limit, offset: offset, modifiedSince: modified_since, sort: sort }
    cost: *request

  - name: create_list
    class: write
    description: >-
      Create a contact list in a folder (list_folders gives the ids). Answers
      {id}.
    input:
      type: object
      additionalProperties: false
      required: [name, folder_id]
      properties:
        name: { type: string, minLength: 1, description: "List name." }
        folder_id: { type: integer, minimum: 1, description: "Folder id." }
    examples:
      - { title: A newsletter list, input: { name: Newsletter, folder_id: 1 } }
    call:
      method: POST
      path: /contacts/lists
      body: { name: name, folderId: folder_id }
    cost: *request

  - name: update_list
    class: write
    description: >-
      Rename a list, or move it to another folder; answers {} on success.
      Brevo changes one of the two per call.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: *list_id
        name: { type: string, minLength: 1, description: "New name." }
        folder_id: { type: integer, minimum: 1, description: "Folder to move it to." }
    examples:
      - { title: Rename a list, input: { list_id: 3, name: Customers } }
    call:
      method: PUT
      path: "/contacts/lists/{list_id}"
      body: { name: name, folderId: folder_id }
    cost: *request

  - name: add_to_list
    class: sensitive
    description: >-
      Add existing contacts to a list, by emails, ids or ext_ids (one kind, 150
      at most); adding may start the automations tied to the list. Answers
      {contacts: {success, failure}}: read failure, an unknown contact fails
      without failing the call. Past 150, or to create contacts, import them.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      oneOf:
        - { required: [emails] }
        - { required: [ids] }
        - { required: [ext_ids] }
      properties:
        list_id: *list_id
        emails: &emails { type: array, minItems: 1, maxItems: 150, items: { type: string, minLength: 1, personal: true }, description: "Contact emails, 150 at most." }
        ids: &ids { type: array, minItems: 1, maxItems: 150, items: { type: integer, minimum: 1 }, description: "Contact ids, 150 at most." }
        ext_ids: &ext_ids { type: array, minItems: 1, maxItems: 150, items: { type: string, minLength: 1 }, description: "Contact EXT_IDs, 150 at most." }
    examples:
      - { title: Two contacts by email, input: { list_id: 3, emails: [marie@example.test, paul@example.test] } }
    confirm:
      summary: "Add contacts to Brevo list {list_id} (emails {emails}, ids {ids}, ext ids {ext_ids}): the list's automations may start."
    call:
      method: POST
      path: "/contacts/lists/{list_id}/contacts/add"
      body: { emails: emails, ids: ids, extIds: ext_ids }
    cost: *request

  - name: remove_from_list
    class: sensitive
    description: >-
      Remove contacts from a list, by emails, ids or ext_ids (one kind, 150 at
      most), or every contact of the list with all_contacts true; the
      contacts themselves stay. Answers {contacts: {success, failure}}, or a
      processId when the list is emptied.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      oneOf:
        - { required: [emails] }
        - { required: [ids] }
        - { required: [ext_ids] }
        - { required: [all_contacts] }
      properties:
        list_id: *list_id
        emails: *emails
        ids: *ids
        ext_ids: *ext_ids
        all_contacts: { const: true, description: "true: empty the whole list. Omit otherwise." }
    examples:
      - { title: One contact by email, input: { list_id: 3, emails: [marie@example.test] } }
      - { title: Empty a list, input: { list_id: 3, all_contacts: true } }
    confirm:
      summary: "Remove contacts from Brevo list {list_id} (emails {emails}, ids {ids}, ext ids {ext_ids}; the whole list: {all_contacts})."
    call:
      method: POST
      path: "/contacts/lists/{list_id}/contacts/remove"
      body: { emails: emails, ids: ids, extIds: ext_ids, all: all_contacts }
    cost: *request

  - name: list_folders
    class: read
    description: >-
      List the folders of contact lists: {folders, count}. A folder id is
      needed to create a list.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *limit_50
        offset: *offset
        sort: *sort
    examples:
      - { title: Every folder, input: {} }
    call:
      method: GET
      path: /contacts/folders
      query: { limit: limit, offset: offset, sort: sort }
    cost: *request

  # --- Transactional email ---------------------------------------------------------------

  - name: send_email
    class: sensitive
    description: >-
      Send one transactional email for real; answers {messageId}. Either from
      a template (template_id, its variables in params as {{params.NAME}}),
      or direct: subject, html_content (or text_content) and sender, a
      verified sender of the account (list_senders). to holds up to 99
      recipients. scheduled_at (UTC date-time, up to 72 h ahead) sends later.
      A send to a list is a campaign, not this.
    input:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: array, minItems: 1, maxItems: 99, items: &recipient { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, minLength: 1, personal: true }, name: { type: string, minLength: 1, personal: true } } } }
        subject: { type: string, minLength: 1, personal: true }
        html_content: { type: string, minLength: 1, personal: true }
        text_content: { type: string, minLength: 1, personal: true }
        sender: &sender
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            email: { type: string, minLength: 1, personal: true }
            name: { type: string, minLength: 1, personal: true }
            id: { type: integer, minimum: 1 }
          description: "A verified sender: its email (and a name), or its id."
        template_id: { type: integer, minimum: 1, description: "Template id: its subject and sender apply unless given." }
        params: { type: object, minProperties: 1, additionalProperties: { personal: true }, description: "The template's variables, {{params.NAME}}." }
        cc: { type: array, minItems: 1, items: *recipient }
        bcc: { type: array, minItems: 1, items: *recipient }
        reply_to: *recipient
        headers: { type: object, minProperties: 1, additionalProperties: { type: string }, description: "Custom email headers." }
        tags: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        scheduled_at: { type: string, minLength: 1, description: "UTC date-time, up to 72 hours ahead." }
    examples:
      - title: A direct email
        input:
          to: [{ email: marie@example.test, name: Marie Martin }]
          subject: Your quote
          html_content: "<p>Hello Marie, here is your quote.</p>"
          sender: { email: sales@acme.example, name: Acme }
      - { title: From a template, input: { to: [{ email: paul@example.test }], template_id: 12, params: { FIRSTNAME: Paul } } }
    confirm:
      summary: "Send an email through Brevo to {to} (subject {subject}, template {template_id}); cc {cc}, bcc {bcc}."
    call:
      method: POST
      path: /smtp/email
      body: { to: to, subject: subject, htmlContent: html_content, textContent: text_content, sender: sender,
              templateId: template_id, params: params, cc: cc, bcc: bcc, replyTo: reply_to, headers: headers,
              tags: tags, scheduledAt: scheduled_at }
    cost: *request

  - name: list_transactional_emails
    class: read
    description: >-
      List sent transactional emails for a recipient, a template or a message
      id (at least one of the three): their uuid, subject, date. Dates are
      YYYY-MM-DD, a month at most. What became of an email (delivered, opened,
      bounced): transactional_events.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [email] }
        - { required: [template_id] }
        - { required: [message_id] }
      properties:
        email: { type: string, minLength: 1, personal: true, description: "Recipient." }
        template_id: { type: integer, minimum: 1 }
        message_id: { type: string, minLength: 1 }
        start_date: *day_from
        end_date: *day_to
        limit: { type: integer, minimum: 1, maximum: 500, description: "Page size, 50 by default." }
        offset: *offset
        sort: *sort
    examples:
      - { title: The emails sent to a recipient, input: { email: marie@example.test } }
    call:
      method: GET
      path: /smtp/emails
      query: { email: email, templateId: template_id, messageId: message_id, startDate: start_date, endDate: end_date,
               limit: limit, offset: offset, sort: sort }
    cost: *request

  - name: get_transactional_email_content
    class: read
    description: >-
      Get the personalized content of one sent transactional email (its HTML,
      subject, events), by the uuid that list_transactional_emails gives.
    input:
      type: object
      additionalProperties: false
      required: [uuid]
      properties:
        uuid: { type: string, minLength: 1, description: "uuid of the sent email." }
    examples:
      - { title: One sent email, input: { uuid: 00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/smtp/emails/{uuid}" }
    cost: *request

  - name: transactional_events
    class: read
    description: >-
      List the deliverability events of transactional emails, the source of
      truth per email: delivered, opened, clicks, hardBounces, softBounces,
      spam, blocked, unsubscribed, deferred… Over days (90 at most) or between
      two dates (YYYY-MM-DD); 30 days by default. limit 50 by default, at most
      100.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, description: "Page size, 50 by default." }
        offset: *offset
        start_date: *day_from
        end_date: *day_to
        days: { type: integer, minimum: 1, maximum: 90, description: "The last days, today included; not with dates." }
        email: { type: string, minLength: 1, personal: true, description: "Recipient." }
        event:
          type: string
          enum: [bounces, hardBounces, softBounces, delivered, spam, requests, opened, clicks, invalid, deferred, blocked,
                 unsubscribed, error, loadedByProxy]
        tags: { type: string, minLength: 1, description: "Tags, a serialized array." }
        message_id: { type: string, minLength: 1 }
        template_id: { type: integer, minimum: 1 }
        sort: *sort
    examples:
      - { title: The hard bounces of the week, input: { event: hardBounces, days: 7 } }
    call:
      method: GET
      path: /smtp/statistics/events
      query: { limit: limit, offset: offset, startDate: start_date, endDate: end_date, days: days, email: email,
               event: event, tags: tags, messageId: message_id, templateId: template_id, sort: sort }
    cost: *request

  - name: transactional_report
    class: read
    description: >-
      Get the transactional counters summed over a period: requests,
      delivered, opens, clicks, bounces, spam reports, unsubscriptions. Over
      days (90 at most, 90 by default) or between two dates (YYYY-MM-DD); for
      one tag. One row per day: transactional_report_by_day.
    input:
      type: object
      additionalProperties: false
      properties:
        start_date: *day_from
        end_date: *day_to
        days: { type: integer, minimum: 1, maximum: 90, description: "The last days, today included; not with dates." }
        tag: { type: string, minLength: 1 }
    examples:
      - { title: The last 30 days, input: { days: 30 } }
    call:
      method: GET
      path: /smtp/statistics/aggregatedReport
      query: { startDate: start_date, endDate: end_date, days: days, tag: tag }
    cost: *request

  - name: transactional_report_by_day
    class: read
    description: >-
      Get the transactional counters one row per day: requests, delivered,
      opens, clicks, bounces, spam reports. Over days (30 at most) or between
      two dates (YYYY-MM-DD); limit 10 rows by default, at most 30.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 30, description: "Rows, 10 by default." }
        offset: *offset
        start_date: *day_from
        end_date: *day_to
        days: { type: integer, minimum: 1, maximum: 30, description: "The last days, today included; not with dates." }
        tag: { type: string, minLength: 1 }
    examples:
      - { title: The last week by day, input: { days: 7 } }
    call:
      method: GET
      path: /smtp/statistics/reports
      query: { limit: limit, offset: offset, startDate: start_date, endDate: end_date, days: days, tag: tag }
    cost: *request

  - name: list_blocked
    class: read
    description: >-
      List the contacts blocked for transactional email (hard bounce, spam
      complaint, unsubscription, admin block): a blocked contact silently
      receives nothing. limit 50 by default, at most 100.
    input:
      type: object
      additionalProperties: false
      properties:
        start_date: *day_from
        end_date: *day_to
        limit: { type: integer, minimum: 1, maximum: 100, description: "Page size, 50 by default." }
        offset: *offset
        senders: { type: array, minItems: 1, items: { type: string, minLength: 1, personal: true }, description: "Only those blocked from these sender emails." }
        sort: *sort
    examples:
      - { title: The blocked contacts, input: {} }
    call:
      method: GET
      path: /smtp/blockedContacts
      query: { startDate: start_date, endDate: end_date, limit: limit, offset: offset, senders: senders, sort: sort }
    cost: *request

  - name: list_blocked_domains
    class: read
    description: >-
      List the domains blocked for transactional email on the account (no
      paging).
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The blocked domains, input: {} }
    call: { method: GET, path: /smtp/blockedDomains }
    cost: *request

  # --- Templates -----------------------------------------------------------------------

  - name: list_templates
    class: read
    description: >-
      List the transactional email templates: id, name, subject, sender,
      active, with their HTML. active_only true keeps the active ones, false
      the inactive ones. One template: get_template.
    input:
      type: object
      additionalProperties: false
      properties:
        active_only: { type: boolean, description: "true: active templates only; false: inactive ones only." }
        limit: { type: integer, minimum: 1, maximum: 1000, description: "Page size, 50 by default." }
        offset: *offset
        sort: *sort
    examples:
      - { title: The active templates, input: { active_only: true } }
    call:
      method: GET
      path: /smtp/templates
      query: { templateStatus: active_only, limit: limit, offset: offset, sort: sort }
    cost: *request

  - name: get_template
    class: read
    description: >-
      Get one transactional template with its HTML: name, subject, sender,
      replyTo, tag, active.
    input:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: &template_id { type: integer, minimum: 1, description: "Template id." }
    examples:
      - { title: A template, input: { template_id: 12 } }
    call: { method: GET, path: "/smtp/templates/{template_id}" }
    cost: *request

  - name: create_template
    class: write
    description: >-
      Create a transactional template; answers {id}. sender is a verified
      sender of the account (list_senders). The body is html_content (more
      than 10 characters) or html_url; variables {{params.NAME}} and
      {{contact.FIRSTNAME}}. is_active true makes it usable at once.
    input:
      type: object
      additionalProperties: false
      required: [template_name, subject, sender, is_active]
      properties:
        template_name: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        sender: *sender
        html_content: { type: string, minLength: 1 }
        html_url: { type: string, minLength: 1, description: "Address of the HTML body, instead of html_content." }
        reply_to: &reply_to_email { type: string, minLength: 1, personal: true, description: "Reply-to email." }
        to_field: { type: string, minLength: 1, description: "The To field, e.g. {{contact.FIRSTNAME}}." }
        tag: { type: string, minLength: 1 }
        is_active: { type: boolean, description: "Active at once." }
        attachment_url: { type: string, minLength: 1, description: "Address of a file attached to each email." }
    examples:
      - title: A follow-up template
        input:
          template_name: Follow-up
          subject: "Hello {{contact.FIRSTNAME}}"
          sender: { email: sales@acme.example, name: Acme }
          html_content: "<p>Hello {{params.FIRSTNAME}}, a short follow-up.</p>"
          is_active: true
    call:
      method: POST
      path: /smtp/templates
      body: { templateName: template_name, subject: subject, sender: sender, htmlContent: html_content,
              htmlUrl: html_url, replyTo: reply_to, toField: to_field, tag: tag, isActive: is_active,
              attachmentUrl: attachment_url }
    cost: *request

  - name: update_template
    class: write
    description: >-
      Update a transactional template, the fields given only; answers {} on
      success. An active template changes the emails sent from it next.
    input:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: *template_id
        template_name: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        sender: *sender
        html_content: { type: string, minLength: 1 }
        html_url: { type: string, minLength: 1 }
        reply_to: *reply_to_email
        to_field: { type: string, minLength: 1 }
        tag: { type: string, minLength: 1 }
        is_active: { type: boolean }
    examples:
      - { title: A new subject, input: { template_id: 12, subject: A short follow-up } }
    call:
      method: PUT
      path: "/smtp/templates/{template_id}"
      body: { templateName: template_name, subject: subject, sender: sender, htmlContent: html_content,
              htmlUrl: html_url, replyTo: reply_to, toField: to_field, tag: tag, isActive: is_active }
    cost: *request

  # --- Email campaigns -------------------------------------------------------------------

  - name: list_campaigns
    class: read
    description: >-
      List email campaigns: id, name, subject, status, sender, recipients,
      dates, statistics if asked (globalStats, linksStats, statsByDomain).
      exclude_html_content true keeps the answer light (the HTML stays in
      Brevo). Filter by type (classic, trigger), status (draft, sent, queued,
      suspended, archive, inProcess…), sent dates. limit 50 by default, at
      most 100.
    input:
      type: object
      additionalProperties: false
      required: [exclude_html_content]
      properties:
        type: { type: string, enum: [classic, trigger] }
        status: { type: string, minLength: 1, description: "draft, sent, queued, suspended, archive, inProcess…" }
        statistics: { type: string, minLength: 1, description: "globalStats, linksStats or statsByDomain." }
        start_date: { type: string, minLength: 1, description: "UTC date-time: sent after." }
        end_date: { type: string, minLength: 1, description: "UTC date-time: sent before." }
        limit: { type: integer, minimum: 1, maximum: 100, description: "Page size, 50 by default." }
        offset: *offset
        sort: *sort
        exclude_html_content: &exclude_html { type: boolean, description: "true: leave the HTML out of the answer." }
    examples:
      - { title: The sent campaigns with their statistics, input: { status: sent, statistics: globalStats, exclude_html_content: true } }
    call:
      method: GET
      path: /emailCampaigns
      query: { type: type, status: status, statistics: statistics, startDate: start_date, endDate: end_date,
               limit: limit, offset: offset, sort: sort, excludeHtmlContent: exclude_html_content }
    cost: *request

  - name: get_campaign
    class: read
    description: >-
      Get one email campaign, with its statistics (globalStats, linksStats,
      statsByDomain, statsByDevice, statsByBrowser). exclude_html_content true
      leaves its HTML out.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, exclude_html_content]
      properties:
        campaign_id: &campaign_id { type: integer, minimum: 1, description: "Campaign id." }
        statistics: { type: string, minLength: 1, description: "globalStats, linksStats, statsByDomain, statsByDevice or statsByBrowser." }
        exclude_html_content: *exclude_html
    examples:
      - { title: A campaign and its statistics, input: { campaign_id: 9, statistics: globalStats, exclude_html_content: true } }
    call:
      method: GET
      path: "/emailCampaigns/{campaign_id}"
      query: { statistics: statistics, excludeHtmlContent: exclude_html_content }
    cost: *request

  - name: create_campaign
    class: write
    act: false
    description: >-
      Create an email campaign as a draft; answers {id}. Nothing is sent: the
      send is started in the Brevo app, after review; send_campaign_test
      sends a test first. sender is a verified sender (list_senders). The body
      is html_content, html_url or template_id (a template's content copied).
      recipients: {listIds, exclusionListIds, segmentIds,
      exclusionSegmentIds}.
    input:
      type: object
      additionalProperties: false
      required: [name, sender]
      properties:
        name: { type: string, minLength: 1 }
        sender: *sender
        subject: { type: string, minLength: 1 }
        html_content: { type: string, minLength: 1 }
        html_url: { type: string, minLength: 1 }
        template_id: { type: integer, minimum: 1, description: "An active template whose content is copied." }
        recipients: &recipients
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            listIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
            exclusionListIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
            segmentIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
            exclusionSegmentIds: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        reply_to: *reply_to_email
        preview_text: { type: string, minLength: 1, description: "The preheader." }
        tag: { type: string, minLength: 1 }
        params: &campaign_params { type: object, minProperties: 1, additionalProperties: { personal: true }, description: "Values for {{params.NAME}}." }
    examples:
      - title: A draft for a list
        input:
          name: October newsletter
          sender: { email: news@acme.example, name: Acme }
          subject: What is new in October
          html_content: "<p>Hello {{contact.FIRSTNAME}}, the news of the month.</p>"
          recipients: { listIds: [3] }
    call:
      method: POST
      path: /emailCampaigns
      body: { name: name, sender: sender, subject: subject, htmlContent: html_content, htmlUrl: html_url,
              templateId: template_id, recipients: recipients, replyTo: reply_to, previewText: preview_text, tag: tag,
              params: params }
    cost: *request

  - name: update_campaign
    class: write
    description: >-
      Update an email campaign not yet sent, the keys of fields only, under
      Brevo's names (name, subject, previewText, htmlContent, htmlUrl, sender,
      recipients, replyTo, tag, toField, params, header, footer,
      mirrorActive, inlineImageActivation, utmCampaign); answers {} on
      success. Its send is not scheduled here.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, fields]
      properties:
        campaign_id: *campaign_id
        fields:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name: { type: string, minLength: 1 }
            subject: { type: string, minLength: 1 }
            previewText: { type: string, minLength: 1 }
            htmlContent: { type: string, minLength: 1 }
            htmlUrl: { type: string, minLength: 1 }
            sender: *sender
            recipients: *recipients
            replyTo: *reply_to_email
            tag: { type: string, minLength: 1 }
            toField: { type: string, minLength: 1 }
            params: *campaign_params
            header: { type: string, minLength: 1 }
            footer: { type: string, minLength: 1 }
            mirrorActive: { type: boolean }
            inlineImageActivation: { type: boolean }
            utmCampaign: { type: string, minLength: 1 }
    examples:
      - { title: A new subject, input: { campaign_id: 9, fields: { subject: The October news } } }
    call:
      method: PUT
      path: "/emailCampaigns/{campaign_id}"
      body: fields
    cost: *request

  - name: send_campaign_test
    class: sensitive
    description: >-
      Send a test of an email campaign, for real, to the given addresses only
      (not to its recipients). Each address must be a contact of the account,
      otherwise Brevo refuses. Answers {} on success.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id, email_to]
      properties:
        campaign_id: *campaign_id
        email_to: { type: array, minItems: 1, items: { type: string, minLength: 1, personal: true }, description: "Test addresses, contacts of the account." }
    examples:
      - { title: A test to oneself, input: { campaign_id: 9, email_to: [me@acme.example] } }
    confirm:
      summary: "Send a test of Brevo campaign {campaign_id} to {email_to}."
    call:
      method: POST
      path: "/emailCampaigns/{campaign_id}/sendTest"
      body: { emailTo: email_to }
    cost: *request

  - name: campaign_ab_test_result
    class: read
    description: >-
      Get the result of an A/B test campaign: the winning version, its
      criterion, open and click rates, the clicks of each version.
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - { title: An A/B test, input: { campaign_id: 9 } }
    call: { method: GET, path: "/emailCampaigns/{campaign_id}/abTestCampaignResult" }
    cost: *request

  - name: campaign_shared_url
    class: read
    description: >-
      Get the share link of a campaign (a page other Brevo users can open).
    input:
      type: object
      additionalProperties: false
      required: [campaign_id]
      properties:
        campaign_id: *campaign_id
    examples:
      - { title: The share link, input: { campaign_id: 9 } }
    call: { method: GET, path: "/emailCampaigns/{campaign_id}/sharedUrl" }
    cost: *request

  # --- Native CRM: deals ------------------------------------------------------------------

  - name: crm_list_deals
    class: read
    description: >-
      List CRM deals: {items}, each with its attributes (deal_name, amount,
      deal_stage, pipeline, deal_owner, close_date…) and linked contacts and
      companies. Filter by name, owner (an account email), stage or pipeline
      id (pipelines), a linked company or contact. limit 50 by default.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: &crm_limit { type: integer, minimum: 1, description: "Page size, 50 by default." }
        offset: *offset
        deal_name: { type: string, minLength: 1 }
        deal_owner: { type: string, minLength: 1, personal: true, description: "Owner: an account email." }
        deal_stage: { type: string, minLength: 1, description: "Stage id." }
        pipeline: { type: string, minLength: 1, description: "Pipeline id." }
        linked_companies_ids: { type: string, minLength: 1, description: "A company id." }
        linked_contacts_ids: { type: string, minLength: 1, description: "A contact id." }
        sort: *sort
        sort_by: &sort_by { type: string, minLength: 1, description: "Field to sort by." }
        modified_since: *modified_since
        created_since: *created_since
    examples:
      - { title: Every deal, input: {} }
      - { title: The deals of a contact, input: { linked_contacts_ids: "12" } }
    call:
      method: GET
      path: /crm/deals
      query: { limit: limit, offset: offset, "filters[attributes.deal_name]": deal_name,
               "filters[attributes.deal_owner]": deal_owner, "filters[attributes.deal_stage]": deal_stage,
               "filters[attributes.pipeline]": pipeline, "filters[linkedCompaniesIds]": linked_companies_ids,
               "filters[linkedContactsIds]": linked_contacts_ids, sort: sort, sortBy: sort_by,
               modifiedSince: modified_since, createdSince: created_since }
    cost: *request

  - name: crm_get_deal
    class: read
    description: Get one CRM deal by id, its attributes and linked contacts and companies.
    input:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id: &object_id { type: string, minLength: 1, description: "Id of the CRM object." }
    examples:
      - { title: A deal, input: { object_id: 0000000000000000000000d1 } }
    call: { method: GET, path: "/crm/deals/{object_id}" }
    cost: *request

  - name: crm_create_deal
    class: write
    description: >-
      Create a CRM deal; answers {id}. attributes: deal_stage and pipeline
      (ids from pipelines), amount, close_date, deal_owner (an account email
      or id), and the custom attributes (crm_attributes deals), a text, a
      number or a boolean each.
    input:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            attributes: &crm_attributes
              type: object
              minProperties: 1
              propertyNames: { minLength: 1 }
              additionalProperties: { type: [string, number, boolean], personal: true }
              description: "Attribute internal name: a text, a number or a boolean."
            linkedContactsIds: &contact_ids { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
            linkedCompaniesIds: &object_ids { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    examples:
      - title: A deal of 10,000
        input: { payload: { name: Acme pilot, attributes: { amount: 10000, deal_stage: stage-0 }, linkedContactsIds: [12] } }
    call:
      method: POST
      path: /crm/deals
      body: payload
    cost: *request

  - name: crm_update_deal
    class: write
    description: >-
      Update a CRM deal, the keys given only; answers {} on success.
      linkedContactsIds and linkedCompaniesIds replace the linked lists (an id
      left out is unlinked): to add or remove one, crm_link_deal.
    input:
      type: object
      additionalProperties: false
      required: [object_id, payload]
      properties:
        object_id: *object_id
        payload:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name: { type: string, minLength: 1 }
            attributes: *crm_attributes
            linkedContactsIds: *contact_ids
            linkedCompaniesIds: *object_ids
    examples:
      - { title: Move a deal to a stage, input: { object_id: 0000000000000000000000d1, payload: { attributes: { deal_stage: stage-1 } } } }
    call:
      method: PATCH
      path: "/crm/deals/{object_id}"
      body: payload
    cost: *request

  - name: crm_link_deal
    class: write
    description: >-
      Link or unlink contacts (ids) and companies (link_ids, unlink_ids) to a
      CRM deal, the others left as they are.
    input:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id: *object_id
        link_contact_ids: *contact_ids
        unlink_contact_ids: *contact_ids
        link_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Company ids to link." }
        unlink_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Company ids to unlink." }
    examples:
      - { title: Link a contact and a company, input: { object_id: 0000000000000000000000d1, link_contact_ids: [12], link_ids: [0000000000000000000000c1] } }
    call:
      method: PATCH
      path: "/crm/deals/link-unlink/{object_id}"
      body: { linkContactIds: link_contact_ids, unlinkContactIds: unlink_contact_ids, linkCompanyIds: link_ids,
              unlinkCompanyIds: unlink_ids }
    cost: *request

  # --- Native CRM: companies --------------------------------------------------------------

  - name: crm_list_companies
    class: read
    description: >-
      List CRM companies: {items}, each with its attributes (name, domain,
      owner…) and linked contacts and deals. Pages by number: page (1 by
      default) and limit (50 by default). Filter by name or owner (an account
      email).
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *crm_limit
        page: { type: integer, minimum: 1, description: "Page number, from 1." }
        name: { type: string, minLength: 1 }
        owner: { type: string, minLength: 1, personal: true, description: "Owner: an account email." }
        sort: *sort
        sort_by: *sort_by
        modified_since: *modified_since
        created_since: *created_since
    examples:
      - { title: Companies by name, input: { name: Acme } }
    call:
      method: GET
      path: /companies
      query: { limit: limit, page: page, "filters[attributes.name]": name, "filters[attributes.owner]": owner,
               sort: sort, sortBy: sort_by, modifiedSince: modified_since, createdSince: created_since }
    cost: *request

  - name: crm_get_company
    class: read
    description: Get one CRM company by id, its attributes and linked contacts and deals.
    input:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id: *object_id
    examples:
      - { title: A company, input: { object_id: 0000000000000000000000c1 } }
    call: { method: GET, path: "/companies/{object_id}" }
    cost: *request

  - name: crm_create_company
    class: write
    description: >-
      Create a CRM company; answers {id}. attributes: domain, industry, owner
      (an account id), phone_number (countryCode then says its country), and
      the custom attributes (crm_attributes companies), a text, a number or a
      boolean each.
    input:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            attributes: *crm_attributes
            countryCode: { type: integer, minimum: 1 }
            linkedContactsIds: *contact_ids
            linkedDealsIds: *object_ids
    examples:
      - { title: A company, input: { payload: { name: Acme, attributes: { domain: acme.example } } } }
    call:
      method: POST
      path: /companies
      body: payload
    cost: *request

  - name: crm_update_company
    class: write
    description: >-
      Update a CRM company, the keys given only. linkedContactsIds and
      linkedDealsIds replace the linked lists (an id left out is unlinked):
      to add or remove one, crm_link_company.
    input:
      type: object
      additionalProperties: false
      required: [object_id, payload]
      properties:
        object_id: *object_id
        payload:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name: { type: string, minLength: 1 }
            attributes: *crm_attributes
            countryCode: { type: integer, minimum: 1 }
            linkedContactsIds: *contact_ids
            linkedDealsIds: *object_ids
    examples:
      - { title: A new domain, input: { object_id: 0000000000000000000000c1, payload: { attributes: { domain: acme.example } } } }
    call:
      method: PATCH
      path: "/companies/{object_id}"
      body: payload
    cost: *request

  - name: crm_link_company
    class: write
    description: >-
      Link or unlink contacts (ids) and deals (link_ids, unlink_ids) to a CRM
      company, the others left as they are.
    input:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id: *object_id
        link_contact_ids: *contact_ids
        unlink_contact_ids: *contact_ids
        link_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Deal ids to link." }
        unlink_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Deal ids to unlink." }
    examples:
      - { title: Link a deal, input: { object_id: 0000000000000000000000c1, link_ids: [0000000000000000000000d1] } }
    call:
      method: PATCH
      path: "/companies/link-unlink/{object_id}"
      body: { linkContactIds: link_contact_ids, unlinkContactIds: unlink_contact_ids, linkDealsIds: link_ids,
              unlinkDealsIds: unlink_ids }
    cost: *request

  # --- Native CRM: tasks -----------------------------------------------------------------

  - name: crm_list_tasks
    class: read
    description: >-
      List CRM tasks: {items}. Filter by type (a task type id, task_types),
      status (done, undone), date (overdue, today, tomorrow, week), assignee
      (an account email or id), a linked contact, deal or company. limit 50
      by default.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *crm_limit
        offset: *offset
        type: { type: string, minLength: 1, description: "Task type id." }
        status: { type: string, enum: [done, undone] }
        date: { type: string, enum: [overdue, today, tomorrow, week] }
        assign_to: { type: string, minLength: 1, personal: true, description: "Assignee: an account email or id." }
        contacts: { type: string, minLength: 1, description: "A contact id." }
        deals: { type: string, minLength: 1, description: "A deal id." }
        companies: { type: string, minLength: 1, description: "A company id." }
        sort: *sort
        sort_by: *sort_by
    examples:
      - { title: The overdue tasks, input: { status: undone, date: overdue } }
    call:
      method: GET
      path: /crm/tasks
      query: { limit: limit, offset: offset, "filter[type]": type, "filter[status]": status, "filter[date]": date,
               "filter[assignTo]": assign_to, "filter[contacts]": contacts, "filter[deals]": deals,
               "filter[companies]": companies, sort: sort, sortBy: sort_by }
    cost: *request

  - name: crm_get_task
    class: read
    description: Get one CRM task by id.
    input:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id: *object_id
    examples:
      - { title: A task, input: { object_id: 0000000000000000000000a1 } }
    call: { method: GET, path: "/crm/tasks/{object_id}" }
    cost: *request

  - name: crm_create_task
    class: write
    description: >-
      Create a CRM task; answers {id}. name, taskTypeId (task_types) and date
      (ISO 8601) are required; assignToId takes an account email or id;
      duration is in milliseconds; reminder {value, unit, types}.
    input:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: false
          required: [name, taskTypeId, date]
          properties: &task_fields
            name: { type: string, minLength: 1 }
            taskTypeId: { type: string, minLength: 1 }
            date: { type: string, minLength: 1, description: "Due date-time, ISO 8601." }
            duration: { type: integer, minimum: 0, description: "Milliseconds." }
            notes: { type: string, minLength: 1, personal: true }
            done: { type: boolean }
            assignToId: { type: string, minLength: 1, personal: true, description: "An account email or id." }
            contactsIds: *contact_ids
            dealsIds: *object_ids
            companiesIds: *object_ids
            reminder:
              type: object
              additionalProperties: false
              required: [value, unit, types]
              properties:
                value: { type: integer, minimum: 0 }
                unit: { type: string, enum: [minutes, hours, weeks, days] }
                types: { type: array, minItems: 1, items: { type: string, enum: [email, push] } }
    examples:
      - title: A call to make
        input: { payload: { name: Call Marie, taskTypeId: type-0, date: "2026-11-02T09:00:00Z", contactsIds: [12] } }
    call:
      method: POST
      path: /crm/tasks
      body: payload
    cost: *request

  - name: crm_update_task
    class: write
    description: >-
      Update a CRM task, the keys given only: done true marks it done.
    input:
      type: object
      additionalProperties: false
      required: [object_id, payload]
      properties:
        object_id: *object_id
        payload:
          type: object
          additionalProperties: false
          minProperties: 1
          properties: *task_fields
    examples:
      - { title: Mark a task done, input: { object_id: 0000000000000000000000a1, payload: { done: true } } }
    call:
      method: PATCH
      path: "/crm/tasks/{object_id}"
      body: payload
    cost: *request

  # --- Native CRM: notes -----------------------------------------------------------------

  - name: crm_list_notes
    class: read
    description: >-
      List CRM notes, or those of some contacts, deals or companies (entity
      and entity_ids, comma separated), between two dates (timestamps in
      milliseconds). limit 50 by default.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *crm_limit
        offset: *offset
        entity: { type: string, enum: [companies, deals, contacts] }
        entity_ids: { type: string, minLength: 1, description: "Ids of that entity, comma separated." }
        date_from: { type: integer, minimum: 0, description: "Timestamp in milliseconds." }
        date_to: { type: integer, minimum: 0, description: "Timestamp in milliseconds." }
        sort: *sort
    examples:
      - { title: The notes of a deal, input: { entity: deals, entity_ids: 0000000000000000000000d1 } }
    call:
      method: GET
      path: /crm/notes
      query: { limit: limit, offset: offset, entity: entity, entityIds: entity_ids, dateFrom: date_from,
               dateTo: date_to, sort: sort }
    cost: *request

  - name: crm_get_note
    class: read
    description: Get one CRM note by id.
    input:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id: *object_id
    examples:
      - { title: A note, input: { object_id: 0000000000000000000000b1 } }
    call: { method: GET, path: "/crm/notes/{object_id}" }
    cost: *request

  - name: crm_create_note
    class: write
    description: >-
      Create a CRM note on contacts, deals or companies; answers {id}. text
      takes simple HTML (p, b, i, u, br, a).
    input:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: false
          required: [text]
          properties: &note_fields
            text: { type: string, minLength: 1, personal: true }
            contactIds: *contact_ids
            dealIds: *object_ids
            companyIds: *object_ids
    examples:
      - { title: A note on a deal, input: { payload: { text: "<p>Call back in November.</p>", dealIds: [0000000000000000000000d1] } } }
    call:
      method: POST
      path: /crm/notes
      body: payload
    cost: *request

  - name: crm_update_note
    class: write
    description: >-
      Update a CRM note; text is required by Brevo, the links given replace
      the note's.
    input:
      type: object
      additionalProperties: false
      required: [object_id, payload]
      properties:
        object_id: *object_id
        payload:
          type: object
          additionalProperties: false
          required: [text]
          properties: *note_fields
    examples:
      - { title: A new text, input: { object_id: 0000000000000000000000b1, payload: { text: "<p>Called back.</p>" } } }
    call:
      method: PATCH
      path: "/crm/notes/{object_id}"
      body: payload
    cost: *request

  # --- Native CRM: metadata ---------------------------------------------------------------

  - name: pipelines
    class: read
    description: >-
      List the deal pipelines and their stages: a deal's pipeline and
      deal_stage are these ids.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Every pipeline, input: {} }
    call: { method: GET, path: /crm/pipeline/details/all }
    cost: *request

  - name: task_types
    class: read
    description: >-
      List the task types of the account (call, email, meeting…): a task's
      taskTypeId is one of these ids.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Every task type, input: {} }
    call: { method: GET, path: /crm/tasktypes }
    cost: *request

  - name: crm_attributes
    class: read
    description: >-
      List the attributes of CRM deals or companies: internal name, label,
      type, choices. Read it before writing attributes.
    input:
      type: object
      additionalProperties: false
      required: [entity]
      properties:
        entity: { type: string, enum: [deals, companies] }
    examples:
      - { title: The deal attributes, input: { entity: deals } }
    call: { method: GET, path: "/crm/attributes/{entity}" }
    cost: *request
