# yaml-language-server: $schema=../connector.schema.json
# Youtrust (formerly Yousign) public API v3 reference: https://developers.youtrust.com/reference
# OpenAPI: https://developers.youtrust.com/openapi/public-api-v3.json
# Rate limits: https://developers.youtrust.com/reference/rate-limits
# One host per environment, chosen per account by the environment setting: a
# sandbox key is unknown to production and the other way round.
#
# Two ways to build a draft signature request (nothing is sent before
# activation, which emails every signer):
# - from a template: the template carries the documents and their fields,
#   the signers fill its placeholders;
# - from scratch: create the request, add each document (multipart upload of a
#   transit file of the caller, call.files), add the signers, then place the
#   fields on the documents. Smart anchors (parse_anchors) only ever create
#   signature fields; every other field type is placed by page and
#   coordinates (points, origin at the top left of the page).
# Delivery is by email only (constant delivery_mode): the per-signer signature
# links of an activation are stripped from its answer, never handed back.
# Templates are created in the Yousign app only: the API reads them, it has
# no write on them.
#
# Not described here:
# - replacing a document, the document-level initials and the visibility
#   lists (excluded_signers, excluded_approvers), whose multipart encoding the
#   reference does not give;
# - answering a field on behalf of a signer (POST .../fields/{id}/answer);
# - downloading signed documents and audit trails: PDF answers, not JSON;
# - cancel, delete, reminders, approvers, followers, webhooks.
connector:
  name: yousign
  label: Yousign
  namespace: yousign
  version: 1.1.0
  api_version: v3
  base_urls:
    setting: environment
    values:
      production: https://api.yousign.app/v3
      sandbox: https://api-sandbox.yousign.app/v3
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  settings:
    - { name: environment, label: Environment, type: choice, choices: [production, sandbox] }
  modes: [byo_org]
  timeout_s: 60
  query_arrays: comma
  # The sandbox limit (30 per minute, 200 per hour), the lower of the two
  # environments; production allows 60 per minute and 1200 per hour.
  rate_limit: { requests: 30, seconds: 60 }
  probe: { function: list_templates }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Yousign rejected the request as invalid: its detail names the faulty field." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Yousign rejected the API key: unknown, revoked, or issued for the other environment (sandbox and production keys differ)." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Yousign forbids this action in this context: the key's workspace scope, or the request's status, does not allow it." }
    - { status: 404, code: not_found, retryable: false,
        message: "Yousign object not found: check the id and the environment." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Yousign rate limit reached (per minute and per hour): retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Yousign is temporarily unavailable or under maintenance: retry later." }

functions:
  - name: list_signature_requests
    class: read
    description: >-
      List the signature requests of the organization, newest first: {meta:
      {next_cursor}, data: [{id, name, status, created_at, activated_at,
      completed_at, expiration_date, source, external_id, workspace_id,
      signers: [{id, status}], documents: [{id, nature}]}]}. status: draft
      (not sent), ongoing (waiting for signers), done (every signer signed),
      approval, paused, expired, canceled, declined, rejected, deleted. By
      default only the requests created through the API are listed: pass
      source [public_api, app] to include those created in the Yousign app.
      Dates are YYYY-MM-DD. To get the next page, pass meta.next_cursor as
      after.
    input:
      type: object
      additionalProperties: false
      properties:
        status:
          type: array
          minItems: 1
          uniqueItems: true
          items: &status { enum: [draft, ongoing, done, deleted, expired, canceled, approval, rejected, declined, paused] }
          description: "Only these statuses."
        q: { type: string, minLength: 1, description: "Text searched in the request name." }
        created_after: &day { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "YYYY-MM-DD." }
        created_before: *day
        source:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [public_api, app, hubspot_integration, connector_salesforce_api, connector_google_api, connector_zapier_api] }
          description: "Origin channels; public_api only upstream by default."
        external_id: { type: string, pattern: "^[\\w\\-@.%+]+$", maxLength: 255, description: "Only the request carrying this external id." }
        workspace_id: { type: string, format: uuid, description: "Only the requests of this workspace." }
        after: { type: string, minLength: 1, description: "Cursor: meta.next_cursor of the previous page." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100, description: "Requests per page." }
    examples:
      - title: Requests waiting for signers, from the app and the API
        input: { status: [ongoing], source: [public_api, app] }
      - title: Requests completed since 1 October 2026
        input: { status: [done], created_after: "2026-10-01", limit: 20 }
    call:
      method: GET
      path: /signature_requests
      query:
        "status[in]": status
        q: q
        "created_at[after]": created_after
        "created_at[before]": created_before
        "source[in]": source
        "external_id[eq]": external_id
        "workspace_id[eq]": workspace_id
        after: after
        limit: limit
    pagination: { kind: cursor, request_param: after, next: meta.next_cursor, max_pages: 10 }
    output: { items: data }

  - name: get_signature_request
    class: read
    description: >-
      Get one signature request by id: name, status, dates (created_at,
      activated_at, completed_at, expiration_date), signers [{id, status}]
      (initiated, notified, verified, processing, consent_given, signed,
      declined, aborted, error),
      approvers, documents [{id, nature}], sender, workspace_id, external_id.
      Only status done means every signer signed.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id]
      properties:
        signature_request_id: &request_id { type: string, format: uuid, description: "Signature request id." }
    examples:
      - title: One signature request
        input: { signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748" }
    refusals:
      - &request_not_found { code: signature_request_not_found, when: 404, message: "No signature request with this id in this Yousign environment." }
    call: { method: GET, path: "/signature_requests/{signature_request_id}" }

  - name: list_templates
    class: read
    description: >-
      List the signature templates of the organization: {meta: {next_cursor},
      data: [{id, name, description, status, created_at, workspace_id}]}.
      Only an active template can start a signature request. Its id is the
      template_id of get_template and create_signature_request_from_template.
    input:
      type: object
      additionalProperties: false
      properties:
        after: { type: string, minLength: 1, description: "Cursor: meta.next_cursor of the previous page." }
        limit: { type: integer, minimum: 1, maximum: 10, default: 10, description: "Templates per page." }
    examples:
      - title: First templates
        input: {}
    call:
      method: GET
      path: /templates
      query: { after: after, limit: limit }
    pagination: { kind: cursor, request_param: after, next: meta.next_cursor, max_pages: 10 }
    output: { items: data }

  - name: get_template
    class: read
    description: >-
      Get one signature template: name, status, workspace_id,
      expiration_delay, and placeholders: {signers: [{label}],
      read_only_text_fields: [{label}], documents}, the slots a signature
      request created from it must fill, matched by label.
    input:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: &template_id { type: string, format: uuid, description: "Template id, from list_templates." }
    examples:
      - title: The placeholders of one template
        input: { template_id: "0e3a9f6e-7c2b-4a51-9d3e-5b8f1c2d4e6a" }
    refusals:
      - &template_not_found { code: template_not_found, when: 404, message: "No signature template with this id in this Yousign environment." }
    call: { method: GET, path: "/templates/{template_id}" }

  - name: create_signature_request_from_template
    class: write
    act: false
    description: >-
      Create a draft signature request from an active template, with its
      documents and fields; nothing is sent until activation. Fill each
      signer placeholder of the template (get_template) by its label, with
      the signer's identity; every signer is notified by email at
      activation. Returns the request, with its id and status draft.
    input:
      type: object
      additionalProperties: false
      required: [name, template_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: "Name of the request, shown to signers; no URL, email nor HTML." }
        template_id: *template_id
        template_placeholders:
          type: object
          additionalProperties: false
          minProperties: 1
          description: "What the template leaves blank, matched by label (get_template placeholders)."
          properties:
            signers:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [label, info]
                properties:
                  label: { type: string, minLength: 1, maxLength: 64, description: "Signer placeholder label defined in the template." }
                  info: &signer_info
                    type: object
                    additionalProperties: false
                    required: [first_name, last_name, email, locale]
                    properties:
                      first_name: { type: string, minLength: 1, maxLength: 255 }
                      last_name: { type: string, minLength: 1, maxLength: 255 }
                      email: { type: string, format: email, maxLength: 100 }
                      phone_number: { type: string, pattern: "^\\+[1-9][0-9]{6,14}$", description: "E.164, e.g. +33612345678; required for otp_sms." }
                      locale: { enum: [en, fr, de, it, nl, es, pl, pt, ro], description: "Language of the emails and signing page." }
                  signature_level: &signature_level
                    enum: [electronic_signature, advanced_electronic_signature, qualified_electronic_signature]
                    description: "Legal level of the signature; electronic_signature by default."
                  signature_authentication_mode: &auth_mode
                    enum: [otp_email, otp_sms, no_otp]
                    description: "One-time code sent to the signer before signing; otp_sms needs phone_number."
              description: "One entry per signer placeholder of the template."
            read_only_text_fields:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [label, text]
                properties:
                  label: { type: string, minLength: 1, maxLength: 64 }
                  text: { type: string, minLength: 1, maxLength: 5000 }
              description: "Text written into the template's read-only text placeholders, by label."
        expiration_date: &expiration_date
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9])?$"
          description: "Due date, YYYY-MM-DD or YYYY-MM-DDThh:mm:ss in the request time zone, within one year; the template's delay by default."
        timezone: &timezone { type: string, minLength: 1, description: "tz database name; Europe/Paris by default." }
        external_id: &own_external_id { type: string, pattern: "^[\\w\\-@.%+]+$", maxLength: 255, description: "Your own id for this request, e.g. a case number." }
        signers_allowed_to_decline: &allowed_to_decline { type: boolean }
    examples:
      - title: A sale agreement for two buyers from the office template
        input:
          name: Compromis de vente - Dossier 2026-118
          template_id: "0e3a9f6e-7c2b-4a51-9d3e-5b8f1c2d4e6a"
          template_placeholders:
            signers:
              - { label: Acquéreur 1, info: { first_name: Claire, last_name: Martin, email: claire.martin@example.com, locale: fr } }
              - { label: Acquéreur 2, info: { first_name: Paul, last_name: Martin, email: paul.martin@example.com, locale: fr },
                  signature_authentication_mode: otp_email }
            read_only_text_fields:
              - { label: Prix, text: "350 000 EUR" }
          external_id: "2026-118"
    refusals:
      - { code: template_not_usable, when: 400, message: "Yousign refused the request: the template is not active, or a placeholder label or signer field is wrong." }
      - *template_not_found
    call:
      method: POST
      path: /signature_requests
      body:
        name: name
        template_id: template_id
        expiration_date: expiration_date
        timezone: timezone
        external_id: external_id
        signers_allowed_to_decline: signers_allowed_to_decline
        template_placeholders: template_placeholders
      constants: { body: { delivery_mode: email } }

  - name: create_signature_request
    class: write
    act: false
    description: >-
      Create an empty draft signature request, without a template; nothing is
      sent until activation. Then add its documents (add_document), its
      signers (add_signer) and their fields (add_field or the signers'
      fields). With ordered_signers, each signer is invited after the
      previous one signed, in the order they were added. Every signer is
      notified by email at activation. Returns the request, with its id and
      status draft.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: "Name of the request, shown to signers; no URL, email nor HTML." }
        ordered_signers: { type: boolean, description: "Signers sign one after the other, in the order they are added." }
        expiration_date: *expiration_date
        timezone: *timezone
        external_id: *own_external_id
        signers_allowed_to_decline: *allowed_to_decline
    examples:
      - title: A two-party agreement signed in order
        input: { name: Service agreement 2026-07, ordered_signers: true, external_id: "agreement-2026-07" }
    refusals:
      - { code: request_refused, when: 400, message: "Yousign refused the request: a name, date or id value is invalid." }
    call:
      method: POST
      path: /signature_requests
      body:
        name: name
        ordered_signers: ordered_signers
        expiration_date: expiration_date
        timezone: timezone
        external_id: external_id
        signers_allowed_to_decline: signers_allowed_to_decline
      constants: { body: { delivery_mode: email } }

  - name: add_document
    class: write
    act: false
    description: >-
      Upload a document into a draft signature request: PDF or DOCX
      (converted to PDF) to be signed, or a PDF, DOCX, JPEG or PNG
      attachment shown but never signed, 50 MB and 50 documents per request
      at most. With parse_anchors, each smart anchor written in the text,
      {{s1|signature|85|37}} (signer rank, width, height in points), becomes
      a signature field of that signer; anchors only make signature fields.
      Returns the document: id (the document_id of the fields), total_pages,
      total_anchors.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, file, nature]
      properties:
        signature_request_id: *request_id
        file: { type: string, format: uuid, description: "Id of a transit file of yours: the document to upload." }
        nature: { enum: [signable_document, attachment], description: "signable_document is signed; attachment is only shown (images are attachments only)." }
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^(?!\\s)[^\\/\\\\]+(?<!\\s)$"
          description: "Display name; the file name by default. No slash nor backslash, no leading or trailing space."
        parse_anchors: { type: boolean, description: "Turn the smart anchors of the document into signature fields." }
        insert_after_id: { type: string, format: uuid, description: "Place the document right after this document of the request." }
    examples:
      - title: The contract to sign, with its signature anchors
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          file: "2b9f4c1e-8d3a-4f6b-9e2c-7a1d5b3c8e4f"
          nature: signable_document
          name: Service agreement
          parse_anchors: true
    refusals:
      - *request_not_found
      - { code: document_refused, when: 400, message: "Yousign refused the document: the request is no longer a draft, or the file is too large, of an unaccepted format, protected or of a nature it cannot take." }
    call:
      method: POST
      path: "/signature_requests/{signature_request_id}/documents"
      body:
        nature: nature
        name: name
        parse_anchors: parse_anchors
        insert_after_id: insert_after_id
      files: { file: file }

  - name: add_signer
    class: write
    act: false
    description: >-
      Add a signer to a draft signature request; they are emailed at
      activation. A signer needs at least one signature field on a document,
      placed here (fields), by add_field, or by a smart anchor of the
      document; for a request built from a template, fill the signer
      placeholders at creation instead. Fields placed here are signature,
      mention, text, checkbox or radio_group, by page and coordinates in
      points from the top left of the page. Returns the signer, with its id
      and status.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, info, signature_level]
      properties:
        signature_request_id: *request_id
        info: *signer_info
        signature_level:
          enum: [electronic_signature, advanced_electronic_signature, qualified_electronic_signature]
          description: "Legal level of the signature."
        signature_authentication_mode: *auth_mode
        fields:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [type, document_id, page, x, y]
                properties:
                  type: { const: signature }
                  document_id: &field_document_id { type: string, format: uuid, description: "A document of the request (add_document, get_signature_request documents)." }
                  page: &page { type: integer, minimum: 1 }
                  x: &x { type: integer, minimum: 0, maximum: 32767, description: "Points from the left of the page." }
                  y: &y { type: integer, minimum: 0, maximum: 32767, description: "Points from the top of the page." }
                  width: &signature_width { type: integer, minimum: 85, maximum: 2000, description: "85 by default." }
                  height: &signature_height { type: integer, minimum: 37, maximum: 1000, description: "37 by default." }
                  reason: &reason { type: string, maxLength: 150, description: "Why the document is signed, shown in the signature." }
              - type: object
                additionalProperties: false
                required: [type, document_id, page, x, y, mention]
                properties:
                  type: { const: mention }
                  document_id: *field_document_id
                  page: *page
                  x: *x
                  y: *y
                  mention: &mention { type: string, minLength: 1, maxLength: 255, description: "Text the signer sees written, e.g. Read and approved; %date% and %datetime% become the signing date." }
                  width: &free_width { type: integer, minimum: 24, description: "Computed from the content by default." }
                  height: &signer_free_height { type: integer, minimum: 24 }
                  name: &field_name { type: string, minLength: 1, maxLength: 128, description: "Name of the field." }
              - type: object
                additionalProperties: false
                required: [type, document_id, page, x, y, max_length, question, optional]
                properties:
                  type: { const: text }
                  document_id: *field_document_id
                  page: *page
                  x: *x
                  y: *y
                  max_length: &max_length { type: integer, minimum: 1, maximum: 32767, description: "Characters the signer may type." }
                  question: &question { type: string, maxLength: 255, description: "Label shown to the signer; may be empty." }
                  optional: &optional { type: boolean, description: "The signer may leave it blank." }
                  instruction: &instruction { type: string, description: "Help text shown to the signer." }
                  default_value: &default_value { type: string, minLength: 1, maxLength: 32767, description: "Prefilled value." }
                  read_only: &read_only { type: boolean, description: "The signer cannot change it." }
                  width: *free_width
                  height: *signer_free_height
                  name: *field_name
              - type: object
                additionalProperties: false
                required: [type, document_id, page, x, y, checked, optional]
                properties:
                  type: { const: checkbox }
                  document_id: *field_document_id
                  page: *page
                  x: *x
                  y: *y
                  checked: &checked { type: boolean, description: "Checked at first." }
                  optional: *optional
                  size: &checkbox_size { type: integer, minimum: 8, maximum: 240, description: "Side in points, 24 by default." }
                  read_only: *read_only
                  name: *field_name
              - type: object
                additionalProperties: false
                required: [type, document_id, page, radios, optional]
                properties:
                  type: { const: radio_group }
                  document_id: *field_document_id
                  page: *page
                  radios: &radios
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [x, y]
                      properties:
                        x: *x
                        y: *y
                        size: *checkbox_size
                        name: *field_name
                        default_checked: { type: boolean, description: "This choice is selected at first." }
                    description: "The choices of the group, one radio button each."
                  optional: *optional
                  read_only: *read_only
                  name: *field_name
          description: "Fields placed for this signer, on documents already added."
    examples:
      - title: A seller signing at the bottom of page 3
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          info: { first_name: Jeanne, last_name: Durand, email: jeanne.durand@example.com, locale: fr }
          signature_level: electronic_signature
          signature_authentication_mode: otp_email
          fields: [{ type: signature, document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", page: 3, x: 77, y: 700 }]
      - title: A buyer who writes a mention and ticks a box before signing
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          info: { first_name: Paul, last_name: Martin, email: paul.martin@example.com, locale: fr }
          signature_level: electronic_signature
          fields:
            - { type: mention, document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", page: 3, x: 77, y: 640, mention: "Lu et approuvé, le %date%" }
            - { type: checkbox, document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", page: 3, x: 77, y: 600, checked: false, optional: false }
            - { type: signature, document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", page: 3, x: 77, y: 700 }
    refusals:
      - *request_not_found
      - { code: signer_refused, when: 400, message: "Yousign refused the signer: the request is no longer a draft, or a field or identity value is invalid." }
    call:
      method: POST
      path: "/signature_requests/{signature_request_id}/signers"
      body:
        info: info
        signature_level: signature_level
        signature_authentication_mode: signature_authentication_mode
        fields: fields
      constants: { body: { delivery_mode: email } }
    output: { strip: [signature_link, signature_link_expiration_date] }

  - name: add_field
    class: write
    act: false
    description: >-
      Place one field on a document of a draft signature request, by page and
      coordinates in points from the top left of the page (an A4 page is 595
      by 842). type: signature (min 85 by 37), mention (text the signer sees
      written, %date% for the signing date), signature_date, text (the signer
      types an answer to question), checkbox, radio_group (radios, each its
      own x and y), read_only_text (fixed text, no signer), signer_name,
      signer_email. Every type but read_only_text belongs to a signer
      (signer_id, from add_signer). On mention, text and read_only_text, font requires width and height; height is
      lines x font size x 1.5. 500 fields per request at most. Returns the
      field, with its id.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, document_id, type, page]
      properties:
        signature_request_id: *request_id
        document_id: &path_document_id { type: string, format: uuid, description: "A document of the request (add_document, get_signature_request documents)." }
        type: { enum: [signature, mention, signature_date, text, checkbox, radio_group, read_only_text, signer_name, signer_email] }
        signer_id: &signer_id { type: string, format: uuid, description: "The signer who fills or signs the field (add_signer)." }
        page: *page
        x: *x
        y: *y
        width: &any_width { type: integer, minimum: 24, maximum: 32767, description: "Points; signature 85 to 2000 (85 by default), else computed from the content by default." }
        height: &any_height { type: integer, minimum: 1, maximum: 32767, description: "Points; signature 37 to 1000 (37 by default)." }
        reason: *reason
        display: &display
          type: object
          additionalProperties: false
          required: [layout]
          properties:
            layout: { enum: [minimal, detailed], description: "detailed adds the signer's name, email and signing date to the signature." }
        mention: *mention
        font: &font
          type: object
          additionalProperties: false
          required: [family, color, size, variants]
          properties:
            family: { enum: [Inconsolata, Open Sans, Lato, Raleway, Merriweather, EB Garamond, Comic Neue, Monaco, Helvetica, Courier, Times Roman] }
            color: { type: string, pattern: "^#([a-f0-9]{6}|[A-F0-9]{6})$", description: "Hex color, e.g. #000000." }
            size: { type: integer, minimum: 7, maximum: 96 }
            variants:
              type: object
              additionalProperties: false
              required: [bold, italic]
              properties:
                bold: { type: boolean }
                italic: { type: boolean }
        name: *field_name
        date_format: &date_format { enum: [dd/MM/yyyy, dd-MM-yyyy, dd.MM.yyyy, yyyy-MM-dd, MM/dd/yyyy, dd MMMM yyyy, "MMMM dd, yyyy", "MMM dd, yyyy"], description: "dd/MM/yyyy by default." }
        time_format: &time_format { enum: ["HH:mm", "hh:mm a"], description: "Also shows the time; the date only by default." }
        show_timezone: &show_timezone { type: boolean, description: "Shows the time zone next to the time." }
        show_email: &show_email { type: boolean, description: "Shows the signer's email; true by default." }
        offset_unit: &offset_unit { enum: [days, weeks, months, years], description: "Unit of offset_value." }
        offset_value: &offset_value { type: integer, minimum: 0, description: "Shown date = signing date plus this many offset_unit." }
        max_length: *max_length
        question: *question
        instruction: *instruction
        optional: *optional
        default_value: *default_value
        read_only: *read_only
        size: *checkbox_size
        checked: *checked
        radios: *radios
        text: &fixed_text { type: string, minLength: 1, maxLength: 5000, description: "The fixed text written on the document." }
        name_format: { enum: [full_name, first_name, last_name], description: "full_name by default." }
      oneOf:
        - properties: { type: { const: signature }, width: { minimum: 85, maximum: 2000 }, height: { minimum: 37, maximum: 1000 } }
          required: [signer_id, x, y]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, width, height, reason, display] }
        - properties: { type: { const: mention } }
          dependentRequired: { font: [width, height] }
          required: [signer_id, x, y, mention]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, width, height, mention, font, name] }
        - properties: { type: { const: signature_date } }
          required: [signer_id, x, y]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, font, name, date_format, time_format, show_timezone, show_email, offset_unit, offset_value] }
        - properties: { type: { const: text } }
          dependentRequired: { font: [width, height] }
          required: [signer_id, x, y, max_length, question]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, width, height, max_length, question, instruction, optional, font, name, default_value, read_only] }
        - properties: { type: { const: checkbox } }
          required: [signer_id, x, y]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, size, optional, name, checked, read_only] }
        - properties: { type: { const: radio_group } }
          required: [signer_id, radios]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, radios, optional, name, read_only] }
        - properties: { type: { const: read_only_text } }
          dependentRequired: { font: [width, height] }
          required: [x, y, text]
          propertyNames: { enum: [signature_request_id, document_id, type, page, x, y, width, height, text, font] }
        - properties: { type: { const: signer_name } }
          required: [signer_id, x, y]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, font, name, name_format] }
        - properties: { type: { const: signer_email } }
          required: [signer_id, x, y]
          propertyNames: { enum: [signature_request_id, document_id, type, signer_id, page, x, y, font, name] }
    examples:
      - title: The signer's signature at the bottom of page 2
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
          type: signature
          signer_id: "7e8f9a0b-1c2d-4e3f-8a5b-6c7d8e9f0a1b"
          page: 2
          x: 77
          y: 700
          width: 180
          height: 60
      - title: A start date the signer types in
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
          type: text
          signer_id: "7e8f9a0b-1c2d-4e3f-8a5b-6c7d8e9f0a1b"
          page: 1
          x: 300
          y: 410
          max_length: 10
          question: Start date
          instruction: DD/MM/YYYY
      - title: A fixed reference printed on page 1
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
          type: read_only_text
          page: 1
          x: 400
          y: 60
          text: "Ref. 2026-118"
    refusals:
      - *request_not_found
      - &field_refused { code: field_refused, when: 400, message: "Yousign refused the field: the request is no longer a draft, the signer or document is not part of it, the position is outside the page, or a value does not fit its type." }
    call:
      method: POST
      path: "/signature_requests/{signature_request_id}/documents/{document_id}/fields"
      body:
        type: type
        signer_id: signer_id
        page: page
        x: x
        y: y
        width: width
        height: height
        reason: reason
        display: display
        mention: mention
        font: font
        name: name
        date_format: date_format
        time_format: time_format
        show_timezone: show_timezone
        show_email: show_email
        offset_unit: offset_unit
        offset_value: offset_value
        max_length: max_length
        question: question
        instruction: instruction
        optional: optional
        default_value: default_value
        read_only: read_only
        size: size
        checked: checked
        radios: radios
        text: text
        name_format: name_format

  - name: list_fields
    class: read
    description: >-
      List the fields placed on one document of a signature request: {meta:
      {next_cursor}, data: [{id, type, signer_id, document_id, page, x, y,
      width, height, and the values of its type}]}, those from smart anchors
      included once resolved. Filter by type or by signer. To get the next
      page, pass meta.next_cursor as after.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, document_id]
      properties:
        signature_request_id: *request_id
        document_id: *path_document_id
        type:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [signature, mention, signature_date, text, checkbox, radio_group, read_only_text, signer_name, signer_email] }
          description: "Only these field types."
        signer_id: { type: string, format: uuid, description: "Only the fields of this signer." }
        after: { type: string, minLength: 1, description: "Cursor: meta.next_cursor of the previous page." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100, description: "Fields per page." }
    examples:
      - title: The signature fields of a document
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
          type: [signature]
    refusals:
      - *request_not_found
    call:
      method: GET
      path: "/signature_requests/{signature_request_id}/documents/{document_id}/fields"
      query:
        "type[in]": type
        "signer_id[eq]": signer_id
        after: after
        limit: limit
    pagination: { kind: cursor, request_param: after, next: meta.next_cursor, max_pages: 10 }
    output: { items: data }

  - name: update_field
    class: write
    act: false
    description: >-
      Change a field of a draft signature request: move or resize it, give it
      to another signer, or change its values; only the values passed
      change, and each must fit the field's type (as in add_field). The type
      itself cannot change, nor can a signer_name or signer_email field: delete
      it and add another. Returns the field.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, document_id, field_id]
      properties:
        signature_request_id: *request_id
        document_id: *path_document_id
        field_id: &field_id { type: string, format: uuid, description: "Field id, from add_field or list_fields." }
        signer_id: *signer_id
        page: *page
        x: *x
        y: *y
        width: *any_width
        height: *any_height
        reason: *reason
        display: *display
        mention: *mention
        font: *font
        name: *field_name
        date_format: *date_format
        time_format: *time_format
        show_timezone: *show_timezone
        show_email: *show_email
        offset_unit: *offset_unit
        offset_value: *offset_value
        max_length: *max_length
        question: *question
        instruction: *instruction
        optional: *optional
        default_value: *default_value
        read_only: *read_only
        size: *checkbox_size
        checked: *checked
        radios: *radios
        text: *fixed_text
      anyOf:
        - required: [signer_id]
        - required: [page]
        - required: [x]
        - required: [y]
        - required: [width]
        - required: [height]
        - required: [reason]
        - required: [display]
        - required: [mention]
        - required: [font]
        - required: [name]
        - required: [date_format]
        - required: [time_format]
        - required: [show_timezone]
        - required: [show_email]
        - required: [offset_unit]
        - required: [offset_value]
        - required: [max_length]
        - required: [question]
        - required: [instruction]
        - required: [optional]
        - required: [default_value]
        - required: [read_only]
        - required: [size]
        - required: [checked]
        - required: [radios]
        - required: [text]
    examples:
      - title: Move a signature field lower on its page
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
          field_id: "5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f"
          y: 784
    refusals:
      - *request_not_found
      - *field_refused
    call:
      method: PATCH
      path: "/signature_requests/{signature_request_id}/documents/{document_id}/fields/{field_id}"
      body:
        signer_id: signer_id
        page: page
        x: x
        y: y
        width: width
        height: height
        reason: reason
        display: display
        mention: mention
        font: font
        name: name
        date_format: date_format
        time_format: time_format
        show_timezone: show_timezone
        show_email: show_email
        offset_unit: offset_unit
        offset_value: offset_value
        max_length: max_length
        question: question
        instruction: instruction
        optional: optional
        default_value: default_value
        read_only: read_only
        size: size
        checked: checked
        radios: radios
        text: text

  - name: delete_field
    class: write
    description: >-
      Delete a field from a document of a draft signature request. A signer
      left without any signature field cannot be activated: add another one
      first. Returns nothing.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, document_id, field_id]
      properties:
        signature_request_id: *request_id
        document_id: *path_document_id
        field_id: *field_id
    examples:
      - title: Remove a misplaced field
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
          field_id: "5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f"
    refusals:
      - *request_not_found
      - { code: field_not_deleted, when: 400, message: "Yousign refused to delete the field: the request is no longer a draft." }
    call: { method: DELETE, path: "/signature_requests/{signature_request_id}/documents/{document_id}/fields/{field_id}" }

  - name: activate_signature_request
    class: sensitive
    description: >-
      Activate a draft signature request: Yousign emails every signer (and
      approver) an invitation to sign, and the request becomes ongoing (or
      approval). It cannot be undone here. The request needs at least one
      document and, for each signer, a signature field. Returns the request;
      signature links are not returned.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id]
      properties:
        signature_request_id: *request_id
    examples:
      - title: Send a prepared request
        input: { signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748" }
    refusals:
      - *request_not_found
      - { code: activation_refused, when: 400, message: "Yousign refused the activation: the request is not a draft, or lacks a document, a signer or a signer's signature field." }
    confirm:
      summary: "Send signature request {signature_request_id}: Yousign emails every signer an invitation to sign; it cannot be undone here."
    call: { method: POST, path: "/signature_requests/{signature_request_id}/activate" }
    output: { strip: [signers, approvers] }

exposure:
  mode: per_connector
  tool: yousign
