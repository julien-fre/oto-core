# yaml-language-server: $schema=../connector.schema.json
# Youtrust (formerly Yousign) public API v3 reference: https://developers.youtrust.com/reference
# OpenAPI: https://developers.youtrust.com/openapi/public-api-v3.json
# Rate limits: https://developers.youtrust.com/reference/rate-limits
# One host per environment, chosen per account by the environment setting: a
# sandbox key is unknown to production and the other way round.
#
# Signature requests built from a template: the template carries the
# documents and their fields; the request is created as a draft (nothing is
# sent), signers are filled in, then activation emails every signer.
# Delivery is by email only (constant delivery_mode): the per-signer signature
# links of an activation are stripped from its answer, never handed back.
#
# Not described here:
# - adding or replacing a document (POST .../documents): its body is
#   multipart/form-data with the PDF file, which the format does not say;
#   a request without a template therefore cannot get a document here;
# - downloading signed documents and audit trails: PDF answers, not JSON;
# - cancel, delete, reminders, approvers, followers, webhooks.
connector:
  name: yousign
  label: Yousign
  namespace: yousign
  version: 1.0.0
  api_version: v3
  base_urls:
    setting: environment
    values:
      production: https://api.yousign.app/v3
      sandbox: https://api-sandbox.yousign.app/v3
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  settings:
    - { name: environment, label: Environment, type: choice, choices: [production, sandbox] }
  modes: [byo_org]
  timeout_s: 60
  query_arrays: comma
  # The sandbox limit (30 per minute, 200 per hour), the lower of the two
  # environments; production allows 60 per minute and 1200 per hour.
  rate_limit: { requests: 30, seconds: 60 }
  probe: { function: list_templates }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Yousign rejected the request as invalid: its detail names the faulty field." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Yousign rejected the API key: unknown, revoked, or issued for the other environment (sandbox and production keys differ)." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Yousign forbids this action in this context: the key's workspace scope, or the request's status, does not allow it." }
    - { status: 404, code: not_found, retryable: false,
        message: "Yousign object not found: check the id and the environment." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Yousign rate limit reached (per minute and per hour): retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Yousign is temporarily unavailable or under maintenance: retry later." }

functions:
  - name: list_signature_requests
    class: read
    description: >-
      List the signature requests of the organization, newest first: {meta:
      {next_cursor}, data: [{id, name, status, created_at, activated_at,
      completed_at, expiration_date, source, external_id, workspace_id,
      signers: [{id, status}], documents: [{id, nature}]}]}. status: draft
      (not sent), ongoing (waiting for signers), done (every signer signed),
      approval, paused, expired, canceled, declined, rejected, deleted. By
      default only the requests created through the API are listed: pass
      source [public_api, app] to include those created in the Yousign app.
      Dates are YYYY-MM-DD. To get the next page, pass meta.next_cursor as
      after.
    input:
      type: object
      additionalProperties: false
      properties:
        status:
          type: array
          minItems: 1
          uniqueItems: true
          items: &status { enum: [draft, ongoing, done, deleted, expired, canceled, approval, rejected, declined, paused] }
          description: "Only these statuses."
        q: { type: string, minLength: 1, description: "Text searched in the request name." }
        created_after: &day { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "YYYY-MM-DD." }
        created_before: *day
        source:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [public_api, app, hubspot_integration, connector_salesforce_api, connector_google_api, connector_zapier_api] }
          description: "Origin channels; public_api only upstream by default."
        external_id: { type: string, pattern: "^[\\w\\-@.%+]+$", maxLength: 255, description: "Only the request carrying this external id." }
        workspace_id: { type: string, format: uuid, description: "Only the requests of this workspace." }
        after: { type: string, minLength: 1, description: "Cursor: meta.next_cursor of the previous page." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100, description: "Requests per page." }
    examples:
      - title: Requests waiting for signers, from the app and the API
        input: { status: [ongoing], source: [public_api, app] }
      - title: Requests completed since 1 October 2026
        input: { status: [done], created_after: "2026-10-01", limit: 20 }
    call:
      method: GET
      path: /signature_requests
      query:
        "status[in]": status
        q: q
        "created_at[after]": created_after
        "created_at[before]": created_before
        "source[in]": source
        "external_id[eq]": external_id
        "workspace_id[eq]": workspace_id
        after: after
        limit: limit
    pagination: { kind: cursor, request_param: after, next: meta.next_cursor, max_pages: 10 }
    output: { items: data }

  - name: get_signature_request
    class: read
    description: >-
      Get one signature request by id: name, status, dates (created_at,
      activated_at, completed_at, expiration_date), signers [{id, status}]
      (initiated, notified, verified, processing, consent_given, signed,
      declined, aborted, error),
      approvers, documents [{id, nature}], sender, workspace_id, external_id.
      Only status done means every signer signed.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id]
      properties:
        signature_request_id: &request_id { type: string, format: uuid, description: "Signature request id." }
    examples:
      - title: One signature request
        input: { signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748" }
    refusals:
      - &request_not_found { code: signature_request_not_found, when: 404, message: "No signature request with this id in this Yousign environment." }
    call: { method: GET, path: "/signature_requests/{signature_request_id}" }

  - name: list_templates
    class: read
    description: >-
      List the signature templates of the organization: {meta: {next_cursor},
      data: [{id, name, description, status, created_at, workspace_id}]}.
      Only an active template can start a signature request. Its id is the
      template_id of get_template and create_signature_request_from_template.
    input:
      type: object
      additionalProperties: false
      properties:
        after: { type: string, minLength: 1, description: "Cursor: meta.next_cursor of the previous page." }
        limit: { type: integer, minimum: 1, maximum: 10, default: 10, description: "Templates per page." }
    examples:
      - title: First templates
        input: {}
    call:
      method: GET
      path: /templates
      query: { after: after, limit: limit }
    pagination: { kind: cursor, request_param: after, next: meta.next_cursor, max_pages: 10 }
    output: { items: data }

  - name: get_template
    class: read
    description: >-
      Get one signature template: name, status, workspace_id,
      expiration_delay, and placeholders: {signers: [{label}],
      read_only_text_fields: [{label}], documents}, the slots a signature
      request created from it must fill, matched by label.
    input:
      type: object
      additionalProperties: false
      required: [template_id]
      properties:
        template_id: &template_id { type: string, format: uuid, description: "Template id, from list_templates." }
    examples:
      - title: The placeholders of one template
        input: { template_id: "0e3a9f6e-7c2b-4a51-9d3e-5b8f1c2d4e6a" }
    refusals:
      - &template_not_found { code: template_not_found, when: 404, message: "No signature template with this id in this Yousign environment." }
    call: { method: GET, path: "/templates/{template_id}" }

  - name: create_signature_request_from_template
    class: write
    act: false
    description: >-
      Create a draft signature request from an active template, with its
      documents and fields; nothing is sent until activation. Fill each
      signer placeholder of the template (get_template) by its label, with
      the signer's identity; every signer is notified by email at
      activation. Returns the request, with its id and status draft.
    input:
      type: object
      additionalProperties: false
      required: [name, template_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: "Name of the request, shown to signers; no URL, email nor HTML." }
        template_id: *template_id
        template_placeholders:
          type: object
          additionalProperties: false
          minProperties: 1
          description: "What the template leaves blank, matched by label (get_template placeholders)."
          properties:
            signers:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [label, info]
                properties:
                  label: { type: string, minLength: 1, maxLength: 64, description: "Signer placeholder label defined in the template." }
                  info: &signer_info
                    type: object
                    additionalProperties: false
                    required: [first_name, last_name, email, locale]
                    properties:
                      first_name: { type: string, minLength: 1, maxLength: 255 }
                      last_name: { type: string, minLength: 1, maxLength: 255 }
                      email: { type: string, format: email, maxLength: 100 }
                      phone_number: { type: string, pattern: "^\\+[1-9][0-9]{6,14}$", description: "E.164, e.g. +33612345678; required for otp_sms." }
                      locale: { enum: [en, fr, de, it, nl, es, pl, pt, ro], description: "Language of the emails and signing page." }
                  signature_level: &signature_level
                    enum: [electronic_signature, advanced_electronic_signature, qualified_electronic_signature]
                    description: "Legal level of the signature; electronic_signature by default."
                  signature_authentication_mode: &auth_mode
                    enum: [otp_email, otp_sms, no_otp]
                    description: "One-time code sent to the signer before signing; otp_sms needs phone_number."
              description: "One entry per signer placeholder of the template."
            read_only_text_fields:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [label, text]
                properties:
                  label: { type: string, minLength: 1, maxLength: 64 }
                  text: { type: string, minLength: 1, maxLength: 5000 }
              description: "Text written into the template's read-only text placeholders, by label."
        expiration_date:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])(T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9])?$"
          description: "Due date, YYYY-MM-DD or YYYY-MM-DDThh:mm:ss in the request time zone, within one year; the template's delay by default."
        timezone: { type: string, minLength: 1, description: "tz database name; Europe/Paris by default." }
        external_id: { type: string, pattern: "^[\\w\\-@.%+]+$", maxLength: 255, description: "Your own id for this request, e.g. a case number." }
        signers_allowed_to_decline: { type: boolean }
    examples:
      - title: A sale agreement for two buyers from the office template
        input:
          name: Compromis de vente - Dossier 2026-118
          template_id: "0e3a9f6e-7c2b-4a51-9d3e-5b8f1c2d4e6a"
          template_placeholders:
            signers:
              - { label: Acquéreur 1, info: { first_name: Claire, last_name: Martin, email: claire.martin@example.com, locale: fr } }
              - { label: Acquéreur 2, info: { first_name: Paul, last_name: Martin, email: paul.martin@example.com, locale: fr },
                  signature_authentication_mode: otp_email }
            read_only_text_fields:
              - { label: Prix, text: "350 000 EUR" }
          external_id: "2026-118"
    refusals:
      - { code: template_not_usable, when: 400, message: "Yousign refused the request: the template is not active, or a placeholder label or signer field is wrong." }
      - *template_not_found
    call:
      method: POST
      path: /signature_requests
      body:
        name: name
        template_id: template_id
        expiration_date: expiration_date
        timezone: timezone
        external_id: external_id
        signers_allowed_to_decline: signers_allowed_to_decline
        template_placeholders: template_placeholders
      constants: { body: { delivery_mode: email } }

  - name: add_signer
    class: write
    act: false
    description: >-
      Add a signer to a draft signature request; they are emailed at
      activation. A signer needs at least one signature field on a document:
      for a request built from a template, fill the signer placeholders at
      creation instead. Returns the signer, with its id and status.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id, info, signature_level]
      properties:
        signature_request_id: *request_id
        info: *signer_info
        signature_level:
          enum: [electronic_signature, advanced_electronic_signature, qualified_electronic_signature]
          description: "Legal level of the signature."
        signature_authentication_mode: *auth_mode
        fields:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, document_id, page, x, y]
            properties:
              type: { const: signature }
              document_id: { type: string, format: uuid, description: "A document of the request (get_signature_request documents)." }
              page: { type: integer, minimum: 1 }
              x: { type: integer, minimum: 0, maximum: 32767, description: "Points from the left of the page." }
              y: { type: integer, minimum: 0, maximum: 32767, description: "Points from the top of the page." }
              width: { type: integer, minimum: 85, maximum: 2000 }
              height: { type: integer, minimum: 37, maximum: 1000 }
          description: "Signature fields placed for this signer."
    examples:
      - title: A seller signing at the bottom of page 3
        input:
          signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748"
          info: { first_name: Jeanne, last_name: Durand, email: jeanne.durand@example.com, locale: fr }
          signature_level: electronic_signature
          signature_authentication_mode: otp_email
          fields: [{ type: signature, document_id: "4c1d2e3f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", page: 3, x: 77, y: 700 }]
    refusals:
      - *request_not_found
      - { code: signer_refused, when: 400, message: "Yousign refused the signer: the request is no longer a draft, or a field or identity value is invalid." }
    call:
      method: POST
      path: "/signature_requests/{signature_request_id}/signers"
      body:
        info: info
        signature_level: signature_level
        signature_authentication_mode: signature_authentication_mode
        fields: fields
      constants: { body: { delivery_mode: email } }
    output: { strip: [signature_link, signature_link_expiration_date] }

  - name: activate_signature_request
    class: sensitive
    description: >-
      Activate a draft signature request: Yousign emails every signer (and
      approver) an invitation to sign, and the request becomes ongoing (or
      approval). It cannot be undone here. The request needs at least one
      document and, for each signer, a signature field. Returns the request;
      signature links are not returned.
    input:
      type: object
      additionalProperties: false
      required: [signature_request_id]
      properties:
        signature_request_id: *request_id
    examples:
      - title: Send a prepared request
        input: { signature_request_id: "9b6ed2f3-244f-487a-baa1-bbe4f51c8748" }
    refusals:
      - *request_not_found
      - { code: activation_refused, when: 400, message: "Yousign refused the activation: the request is not a draft, or lacks a document, a signer or a signer's signature field." }
    confirm:
      summary: "Send signature request {signature_request_id}: Yousign emails every signer an invitation to sign; it cannot be undone here."
    call: { method: POST, path: "/signature_requests/{signature_request_id}/activate" }
    output: { strip: [signers, approvers] }

exposure:
  mode: per_connector
  tool: yousign
