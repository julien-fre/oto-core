      constants:
        body:
          variables: {}
          query: >-
            query Cycle($id: String!) { cycle(id: $id) { id number name startsAt endsAt completedAt team { id name } }
            }

  # --- Labels ----------------------------------------------------------------------

  - name: get_label
    class: read
    description: One Linear issue label, under data.issueLabel - name, color, description, team (none for a workspace label).
    input:
      type: object
      additionalProperties: false
      required: [label_id]
      properties:
        label_id: &label_id { type: string, minLength: 1 }
    examples:
      - { title: A label, input: { label_id: l-0 } }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.issueLabel }]
    call:
      method: POST
      path: /graphql
      body: { variables: { id: label_id } }
      constants:
        body:
          variables: {}
          query: >-
            query IssueLabel($id: String!) { issueLabel(id: $id) { id name color description team { id name } } }

  - name: create_label
    class: write
    description: >-
      Create a Linear issue label, in a team, or for the whole workspace
      without team_id. The answer is under data.issueLabelCreate: success and
      the label.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        team_id: *team_id
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", description: "A hex color, #RRGGBB." }
        description: { type: string }
    examples:
      - { title: A team label, input: { name: Regression, team_id: t-0, color: "#EB5757" } }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.issueLabelCreate }]
    call:
      method: POST
      path: /graphql
      body: { variables: { input: { name: name, teamId: team_id, color: color, description: description } } }
      constants:
        body:
          variables: {}
          query: >-
            mutation IssueLabelCreate($input: IssueLabelCreateInput!) { issueLabelCreate(input: $input) { success
            issueLabel { id name color description team { id name } } } }

  - name: delete_label
    class: sensitive
    description: Delete a Linear issue label; the issues that carry it lose it. The answer is data.issueLabelDelete.success.
    input:
      type: object
      additionalProperties: false
      required: [label_id]
      properties:
        label_id: *label_id
    examples:
      - { title: Delete a label, input: { label_id: l-0 } }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.issueLabelDelete }]
    confirm: { summary: "Delete Linear label {label_id}: the issues that carry it lose it." }
    call:
      method: POST
      path: /graphql
      body: { variables: { id: label_id } }
      constants:
        body: { variables: {}, query: "mutation IssueLabelDelete($id: String!) { issueLabelDelete(id: $id) { success } }" }

  # --- Users -----------------------------------------------------------------------

  - name: get_viewer
    class: read
    description: >-
      The Linear user who holds the API key, under data.viewer: id, name,
      email, display name, whether active and admin, creation date. Use it to
      know on whose behalf the key acts.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Who holds the key, input: {} }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.viewer }]
    call:
      method: POST
      path: /graphql
      constants:
        body:
          query: "query Viewer { viewer { id name email displayName active admin createdAt } }"
          variables: {}

  - name: get_user
    class: read
    description: >-
