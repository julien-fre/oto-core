    input:
      type: object
      additionalProperties: false
      properties:
        first: *first
        after: *after
    examples:
      - { title: The members, input: {} }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.users }]
    call:
      method: POST
      path: /graphql
      body: { variables: { first: first, after: after } }
      constants:
        body:
          variables: {}
          query: >-
            query Users($first: Int, $after: String) { users(first: $first, after: $after) { nodes { id name email
            displayName active admin createdAt } pageInfo { hasNextPage endCursor } } }
    pagination: { kind: cursor, request_param: after, next: data.users.pageInfo.endCursor, more: data.users.pageInfo.hasNextPage, max_pages: 20 }
    output: { items: data.users.nodes }

  # --- Webhooks --------------------------------------------------------------------
  # No selection reads a webhook's secret.

  - name: create_webhook
    class: write
    description: >-
      Register an https address that Linear posts events to, for the
      resource types listed (Issue, Comment, IssueLabel, Project, Cycle,
      ProjectUpdate, Reaction…), from one team (team_id) or every public team
      (all_public_teams). Disabled from the start with enabled false. Linear
      makes the signing secret, readable in its settings only. The answer is
      under data.webhookCreate: success and the webhook (url, enabled,
      resource types, team, date).
    input:
      type: object
      additionalProperties: false
      required: [url, resource_types]
      properties:
        url: &webhook_url { type: string, pattern: "^https://", description: "The publicly reachable https address that receives the events." }
        team_id: *team_id
        resource_types: &resource_types { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Linear's resource types, such as Issue or Comment." }
        enabled: { type: boolean, description: "False to create it disabled; enabled by default at Linear." }
        all_public_teams: { const: true, description: "Every public team instead of one team_id." }
    examples:
      - { title: Issue events of a team, input: { url: "https://hooks.example.test/linear", team_id: t-0, resource_types: [Issue, Comment] } }
      - { title: Every public team, input: { url: "https://hooks.example.test/linear", resource_types: [Issue], all_public_teams: true } }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.webhookCreate }]
    call:
      method: POST
      path: /graphql
      body:
        variables:
          input: { url: url, teamId: team_id, resourceTypes: resource_types, enabled: enabled,
                   allPublicTeams: all_public_teams }
      constants:
        body:
          variables: {}
          query: >-
            mutation WebhookCreate($input: WebhookCreateInput!) { webhookCreate(input: $input) { success webhook { id
            url enabled resourceTypes team { id name } createdAt } } }

  - name: update_webhook
    class: write
    description: >-
      Change a Linear webhook: its address, its resource types, or enable or
      disable it; only what is given changes. The answer is under
      data.webhookUpdate: success and the webhook. At least one change.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      minProperties: 2
      properties:
        webhook_id: &webhook_id { type: string, minLength: 1 }
        url: *webhook_url
        resource_types: *resource_types
        enabled: { type: boolean }
    examples:
      - { title: Disable a webhook, input: { webhook_id: w-0, enabled: false } }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.webhookUpdate }]
    call:
      method: POST
      path: /graphql
      body:
        variables:
          id: webhook_id
          input: { url: url, resourceTypes: resource_types, enabled: enabled }
      constants:
        body:
          variables: {}
          query: >-
            mutation WebhookUpdate($id: String!, $input: WebhookUpdateInput!) { webhookUpdate(id: $id, input: $input)
            { success webhook { id url enabled resourceTypes team { id name } createdAt } } }

  - name: delete_webhook
    class: sensitive
    description: Delete a Linear webhook; Linear stops posting to its address. The answer is data.webhookDelete.success.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      properties:
        webhook_id: *webhook_id
    examples:
      - { title: Delete a webhook, input: { webhook_id: w-0 } }
    refusals: [*no_result]
    expect: [{ kind: non_empty, refusal: no_result, path: data.webhookDelete }]
    confirm: { summary: "Delete Linear webhook {webhook_id}: Linear stops posting to its address." }
    call:
      method: POST
      path: /graphql
      body: { variables: { id: webhook_id } }
      constants:
        body: { variables: {}, query: "mutation WebhookDelete($id: String!) { webhookDelete(id: $id) { success } }" }
