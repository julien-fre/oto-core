          minItems: 1
          uniqueItems: true
          items: { enum: [1, 2, 3] }
          description: "Connection degrees: 1 first, 2 second, 3 third and beyond."
        cursor: { type: string, minLength: 1, description: "next_cursor of the previous page, passed alone." }
