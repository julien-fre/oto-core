  - name: search_recruiter_people
    class: read
    description: >-
      Search LinkedIn members (candidates) with Recruiter, under the selected
      contract. Facets take ids already resolved: call resolve_facet first
      (LOCATION, COMPANY, INDUSTRY, SKILL), keep the relevant ids, then search
      with them; a name instead of an id is refused. A skill is given as
      {name: <SKILL id>}: the field is called name but carries the id, never the
      label; add priority DOESNT_HAVE to exclude it. Industries can be included
      or excluded; locations and employers are included only. Recruiter has no
      companies search. For the next page, pass back next_cursor alone, without
      any other argument: the cursor carries the whole search.
    input:
      type: object
      additionalProperties: false
      properties:
        keywords: { type: string, minLength: 1, personal: true, description: "Keywords (a name, a job title…)." }
        location:
          type: array
          minItems: 1
          description: "LOCATION facets, each by its id from resolve_facet."
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]+$" }
        current_company:
          type: array
          minItems: 1
          description: "COMPANY facets of the current employer, each by its id from resolve_facet."
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]+$" }
        industry:
          type: object
          additionalProperties: false
          minProperties: 1
          description: "INDUSTRY facet ids to include or exclude, from resolve_facet."
          properties:
            include: { type: array, minItems: 1, items: { type: string, pattern: "^[0-9]+$" } }
            exclude: { type: array, minItems: 1, items: { type: string, pattern: "^[0-9]+$" } }
        network_distance:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [1, 2, 3] }
          description: "Connection degrees: 1 first, 2 second, 3 third and beyond."
        skills:
          type: array
          minItems: 1
          description: "SKILL facets: the id from resolve_facet in name; priority DOESNT_HAVE excludes the skill."
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, pattern: "^[0-9]+$", description: "The SKILL facet id (not its label)." }
              priority: { enum: [DOESNT_HAVE] }
        cursor: { type: string, minLength: 1, description: "next_cursor of the previous page, passed alone." }
      dependentSchemas:
        cursor: { maxProperties: 1 }
    examples:
      - { title: Candidates with a skill in a city, input: { keywords: data engineer, location: [{ id: "105015875" }], skills: [{ name: "1234" }] } }
      - { title: Excluding a skill and an industry, input: { skills: [{ name: "1234" }, { name: "5678", priority: DOESNT_HAVE }], industry: { exclude: ["4"] } } }
      - { title: Next page, input: { cursor: eyJsaW1pdCI6MjUsInN0YXJ0IjoyNX0 } }
    call:
      method: POST
      path: /linkedin/recruiter/search/people
      query: { cursor: cursor }
      body: { keywords: keywords, location: location, current_company: current_company, industry: industry, network_distance: network_distance, skills: skills }
    timeout_s: 60
    # Member, company, school and organisation pictures open without a login: they never reach the agent.
    output:
      items: data
      strip: [public_picture_url, public_picture_url_large, work_experience.company.picture_url, education.school.picture_url, certifications.organization.picture_url, volunteering.organization.picture_url, projects.contributors.public_picture_url, recommendations.user.public_picture_url]
      sample:
        data:
          - id: r-0
            first_name: Jane
            profile_url: "https://www.example.test/in/r-0"
            public_picture_url: "https://media.example.test/r-0.jpg"
            public_picture_url_large: "https://media.example.test/r-0-large.jpg"
            work_experience: [{ position: Engineer, company: { name: Sample Co, picture_url: "https://media.example.test/c-0.png" } }]
            education: [{ degree: MSc, school: { name: Sample School, picture_url: "https://media.example.test/s-0.png" } }]
            certifications: [{ name: Sample cert, organization: { name: Sample Org, picture_url: "https://media.example.test/o-0.png" } }]
            volunteering: [{ role: Mentor, organization: { name: Sample Org, picture_url: "https://media.example.test/o-1.png" } }]
            projects: [{ name: Sample project, contributors: [{ first_name: Max, public_picture_url: "https://media.example.test/m-0.jpg" }] }]
            recommendations: [{ text: Sample, user: { first_name: Lee, public_picture_url: "https://media.example.test/u-0.jpg" } }]

  # --- Search by a pasted URL: one function per product -------------------------

  - name: search_by_url
    class: read
    description: >-
      Run a classic LinkedIn search from its URL, pasted from the browser
      (linkedin.com/search/results/…): the filters are those of the URL. The
      results can be members, companies, posts or jobs, as the URL says. For
      the next page, pass next_cursor alone to search_people or
      search_companies, as the URL's target. Prefer the structured search to
      control the filters.
    input:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, pattern: "^https://", personal: true, description: "LinkedIn search URL, pasted from the browser." }
    examples:
      - { title: A pasted search, input: { url: "https://www.linkedin.com/search/results/people/?keywords=data%20engineer" } }
    call:
      method: POST
      path: /linkedin/search
      body: { url: url }
