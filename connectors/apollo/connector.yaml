# yaml-language-server: $schema=../connector.schema.json
# Apollo.io REST API v1 (https://docs.apollo.io/reference). The values come from the Python client, oto.tools.apollo,
# which this description follows: one request per method to api.apollo.io under /api/v1 (the documented root; /v1
# is a legacy alias that does not answer on the search endpoints), the API key in the X-Api-Key header, JSON bodies.
# The function names, the argument names and the keys sent to Apollo are the client's; the client is not changed
# (tests/test_apollo_description.py reads it to keep both equal).
#
# Two data sets behind one key: the shared Apollo database (organizations and people that every customer searches
# and enriches, paid in credits) and the team's own workspace (saved contacts, sequences, emails, conversations,
# custom fields, mostly free but often behind a master key: a key without that right gets a 403 on them).
#
# Read and act: searches and reads of the workspace stay on the read side. Enrichment is served on the act side
# (class write), like any call that spends credits on a person or a company (fullenrich.submit): enrich_organization,
# bulk_enrich_organizations, match_person (which, on too weak an identifier, creates an empty person in Apollo and
# bills it) and bulk_match_people. Creating a sequence (always inactive), deactivating it, changing the status of
# contacts in sequences, creating a custom field and updating a contact are writes; an email draft is a write that
# stays on the read side (act false). Activating a sequence (it starts sending), archiving it, updating it (its
# steps, cc and bcc go to every recipient) and sending an email ask for a confirmation (class sensitive).
#
# Cost, in Apollo credits, as the client documents it: a page of organization search costs 1 credit, an
# organization enrichment 1 per organization, a person match 1 per person (more with personal emails, depending on
# the plan: the real cost can exceed the declared worst case); the people search of api_search costs none. A
# conversation costs 1 credit only when it has AI insights, which nothing says before the call: 1 is declared, a
# worst case. bulk_match_people settles on credits_consumed, which oto 1 reads in its answer; match_person declares
# no settle, nothing showing that its answer carries it. Everything else costs one request.
#
# Lists in the query go with brackets (domains[]=a&domains[]=b), as the client sends them; booleans in the query
# (reveal_personal_emails) are written true and false, which the client writes by hand for the same reason: Apollo
# ignores what it does not recognize (Python would write True).
#
# The client sends page 1 and its own per_page when the call omits them (10 for organizations, 25 for the other
# searches, 50 for the activity feed): the description does not declare them as defaults, the host sending nothing
# for an omitted argument; Apollo then applies its own, which the client does not document.
#
# Errors: Apollo surfaces its message in the body (error, error_message, message). A 401 is a refused key and marks
# the account; a 402 is an account out of credits and marks it. Apollo also says "insufficient credits" under a 422,
# the status of a malformed request, with a message the client matches by pattern and that a body condition, which
# compares whole values, does not say: such a 422 is the generic refusal, whose message says what it means. A 403
# is a key without the master right or a plan without the endpoint: it marks nothing. The client spaces two
# requests by one second and retries a short 429 itself; the rate declared here is the client's. A 5xx is not
# retryable: a write (a send, an activation) may have gone through.
#
# Not described here, left to the hand-written client:
# - poll_webhook_result: a 404 result_pending read as "not ready yet", and an envelope (done, result) the client
#   builds; it reads back the phone reveal, itself left out;
# - add_contacts_to_sequence: the sequence id goes both in the path and in the query (emailer_campaign_id, which
#   Apollo requires), an argument goes to one place only; the sending mailbox may be a list sent without brackets,
#   and the safety flags pass as Python booleans;
# - export_conversations and get_conversations_export: the export ends as a signed download address, which never
#   goes to the agent, in a format that no source gives (a rendered file needs its type);
# - the arguments the client reshapes: domain (wrapped in a one-element list), country (merged into locations),
#   revenue_min and revenue_max (nested into revenue_range) of search_organizations; max_length of
#   create_custom_field (nested into meta); the extra fields of create_sequence;
# - the phone reveal of match_person and bulk_match_people (reveal_phone_number with webhook_url): Apollo posts the
#   numbers later to an address chosen by the caller, a receiver of the host's, out of the format.
# The client also marks, in the answer of a match, the empty person Apollo creates on a weak identifier (_stub): the
# description says how to recognize it.
# No probe: the client calls no account endpoint, and the reads without argument (mailboxes, schedules, custom
# fields) need the master right that a working search key may lack.
connector:
  name: apollo
  label: Apollo.io
  namespace: apollo
  version: 1.0.0
  api_version: v1
  base_url: https://api.apollo.io/api/v1
  auth:
    kind: api_key
    in: header
    name: X-Api-Key
    key: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  # Each team brings its own key: sequences, emails and contacts act on the account behind the key.
  modes: [byo_user, byo_org]
  # The client waits 60 s for an answer (10 s to connect).
  timeout_s: 60
  query_arrays: brackets
  # The client spaces two requests of one key by one second.
  rate_limit: { requests: 1, seconds: 1 }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Apollo rejected the request as invalid: check the arguments." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "Apollo refused the API key: unknown or revoked." }
    - { status: 402, code: credits_exhausted, retryable: false, marks_account: quota_exhausted,
        message: "The Apollo account behind this key is out of credits. The call was correct: do not change it nor retry it." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Apollo refused this endpoint for this key: it needs a master API key (Apollo, Settings, Integrations, API), or the plan does not include it. Retrying unchanged fails the same way." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Apollo: wrong id, or not visible to this team." }
    - { status: 422, code: invalid_request, retryable: false,
        message: "Apollo refused the request; its message names the field. If it says insufficient credits, the account is out of credits: the call was correct, do not change it." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Apollo rate limit reached: wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: false,
        message: "Apollo failed. A read can be retried; a write or a send may have been applied: read it back before acting again." }

functions:
  # --- Shared database: organizations ---------------------------------------

  - name: search_organizations
    class: read
    description: >-
      Search companies in the shared Apollo database by name, headquarters
      location, headcount range, activity keywords, technologies used or
      Apollo ids. Returns organizations (or accounts already saved by the
      team) with their firmographics, without the exact headcount (that is
      enrich_organization), and pagination (page, total_entries,
      total_pages). Costs 1 Apollo credit per page. An unknown filter value
      is not refused: check that the results match the filters.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, description: "Company name to search." }
        employee_ranges:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]+,[0-9]+$" }
          description: "Headcount ranges, bounds included, as \"min,max\": [\"1,10\", \"11,50\"]."
        locations: &locations
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          description: "Cities, regions or countries of the headquarters: [\"France\", \"Lyon, France\"]."
        keywords: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Activity keywords." }
        technologies: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Uids of technologies used (salesforce)." }
        org_ids: &org_ids { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Apollo organization ids." }
        per_page: { type: integer, minimum: 1, maximum: 100, description: "Results per page, at most 100." }
        page: &page { type: integer, minimum: 1, description: "Page number, from 1." }
    examples:
      - title: French software companies of 11 to 50 people
        input: { locations: [France], keywords: [software], employee_ranges: ["11,50"], per_page: 25 }
      - title: A company by name
        input: { name: Example Industries }
    call:
      method: POST
      path: /mixed_companies/search
      body:
        q_organization_name: name
        organization_locations: locations
        organization_num_employees_ranges: employee_ranges
        q_organization_keyword_tags: keywords
        currently_using_any_of_technology_uids: technologies
        organization_ids: org_ids
        per_page: per_page
        page: page
    cost: { per: request, unit: credits }

  - name: enrich_organization
    class: write
    description: >-
      Enrich one company from its domain: full firmographics from the shared
      Apollo database, among them estimated_num_employees, departmental
      headcounts, growth and revenue. Costs 1 Apollo credit.
    input:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: &domain { type: string, pattern: "^[^\\s/]+\\.[^\\s/]+$", description: "Company domain, without scheme: example.test." }
    examples:
      - title: A company by its domain
        input: { domain: example.test }
    call:
      method: GET
      path: /organizations/enrich
      query: { domain: domain }
    cost: { per: request, unit: credits }

  - name: bulk_enrich_organizations
    class: write
    description: >-
      Enrich up to 10 companies in one call, from their domains, with the
      same firmographics as enrich_organization. Costs 1 Apollo credit per
      organization, as in single mode: the batch saves calls, not credits.
    input:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 10
          items: *domain
          description: "Company domains, at most 10."
    examples:
      - title: Two companies at once
        input: { domains: [example.test, example.net] }
    call:
      method: POST
      path: /organizations/bulk_enrich
      query: { domains: domains }
    cost: { per: item, items: domains, unit: credits }

  - name: get_job_postings
    class: read
    description: >-
      List the job postings Apollo knows for one organization, by its Apollo
      id (from search_organizations or enrich_organization).
    input:
      type: object
      additionalProperties: false
      required: [org_id]
      properties:
        org_id: { type: string, pattern: "^[A-Za-z0-9]+$", description: "Apollo organization id." }
    examples:
      - title: The job postings of one company
        input: { org_id: 5f0c0d0e0a0b0c0d0e0f0a0b }
    call: { method: GET, path: "/organizations/{org_id}/job_postings" }
    cost: &cost { per: request }

  # --- Shared database: people ----------------------------------------------

  - name: search_people
    class: read
    description: >-
      Search people in the shared Apollo database (net-new prospecting) by
      employer domain or id, title keywords, seniority and location. Returns
      people without email or phone, last names obfuscated (Vi***l), each
      with an id to pass to match_person or bulk_match_people, and
      pagination. Costs no credit. There is no department filter: target by
      titles and seniorities; on a global group, person_locations isolates a
      country.
    input:
      type: object
      additionalProperties: false
      properties:
        domains: { type: array, minItems: 1, items: *domain, description: "Employer domains." }
        org_ids: *org_ids
        titles: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Title keywords: [\"head of sales\"]." }
        seniorities:
          type: array
          minItems: 1
          items: { enum: [owner, founder, c_suite, partner, vp, head, director, manager, senior, entry, intern] }
          description: "Seniority levels."
        person_locations: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Where the person is: [\"France\", \"Paris, France\"]." }
        organization_locations: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Where the employer's site is." }
        per_page: &per_page { type: integer, minimum: 1, maximum: 100, description: "Results per page, at most 100." }
        page: *page
    examples:
      - title: Sales directors of one company in France
        input: { domains: [example.test], titles: [sales], seniorities: [director, vp], person_locations: [France] }
    call:
      method: POST
      path: /mixed_people/api_search
      body:
        q_organization_domains_list: domains
        organization_ids: org_ids
        person_titles: titles
        person_seniorities: seniorities
        person_locations: person_locations
        organization_locations: organization_locations
        per_page: per_page
        page: page
    cost: *cost

  - name: match_person
    class: write
    description: >-
      Enrich one person from the shared Apollo database: email, title,
      employer, employment history. Costs 1 Apollo credit per call, more with
      reveal_personal_emails (by plan), even when nothing matches. Give
      person_id (from search_people), email or linkedin_url; otherwise a full
      name (first and last) with domain or org_name. On too weak an
      identifier Apollo creates an empty person and bills it: a person
      without last_name, title, email, linkedin_url nor organization_id is
      such a shell, not a result. The phone reveal is not served here.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - required: [person_id]
        - required: [email]
        - required: [linkedin_url]
        - required: [last_name]
        - { required: [name], properties: { name: { pattern: "\\S\\s+\\S" } } }
      properties:
        person_id: { type: string, minLength: 1, description: "Apollo id of the person, from search_people: the safest identifier." }
        linkedin_url: &linkedin_url { type: string, minLength: 1, personal: true, description: "LinkedIn profile address." }
        email: &email { type: string, minLength: 3, personal: true, description: "Email address." }
        first_name: &first_name { type: string, minLength: 1, personal: true }
        last_name: &last_name { type: string, minLength: 1, personal: true }
        name: &full_name { type: string, minLength: 1, personal: true, description: "Full name: first and last." }
        domain: *domain
        org_name: { type: string, minLength: 1, description: "Employer name." }
        reveal_personal_emails: &reveal_personal_emails { type: boolean, description: "Also return personal emails, in the answer; costs more credits, depending on the plan." }
    examples:
      - title: A person found by search_people
        input: { person_id: 6a1b2c3d4e5f6a7b8c9d0e1f }
      - title: A full name at a company
        input: { first_name: Marie, last_name: Martin, domain: example.test }
    refusals:
      - { code: no_match, when: 404, message: "Apollo matched no person: the credit may still have been spent. Do not retry with the same identifiers." }
    call:
      method: POST
      path: /people/match
      body:
        id: person_id
        linkedin_url: linkedin_url
        email: email
        first_name: first_name
        last_name: last_name
        name: name
        domain: domain
        organization_name: org_name
      query: { reveal_personal_emails: reveal_personal_emails }
    cost: { per: request, unit: credits }

  - name: bulk_match_people
    class: write
    description: >-
      Enrich up to 10 people in one call, with the same identifiers as
      match_person, each entry on its own: id (from search_people), email or
      linkedin_url, otherwise a full name with domain or organization_name.
      Returns matches, one per entry in order, null where nothing matched.
      Costs 1 Apollo credit per person, more with reveal_personal_emails: the
      batch saves calls, not credits. An entry without last_name, title,
      email, linkedin_url nor organization_id is an empty shell Apollo
      created and billed. The phone reveal is not served here.
    input:
      type: object
      additionalProperties: false
      required: [details]
      properties:
        details:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            anyOf:
              - required: [id]
              - required: [email]
              - required: [linkedin_url]
              - required: [last_name]
              - { required: [name], properties: { name: { pattern: "\\S\\s+\\S" } } }
            properties:
              id: { type: string, minLength: 1, description: "Apollo id of the person, from search_people." }
              email: *email
              linkedin_url: *linkedin_url
              first_name: *first_name
              last_name: *last_name
              name: *full_name
              domain: *domain
              organization_name: { type: string, minLength: 1 }
          description: "The people to match, at most 10."
        reveal_personal_emails: *reveal_personal_emails
    examples:
      - title: Two people found by search_people
        input: { details: [{ id: 6a1b2c3d4e5f6a7b8c9d0e1f }, { id: 6a1b2c3d4e5f6a7b8c9d0e20 }] }
      - title: A person by email, another by full name
        input: { details: [{ email: marie.martin@example.test }, { first_name: Paul, last_name: Durand, domain: example.test }] }
    call:
      method: POST
      path: /people/bulk_match
      body: { details: details }
      query: { reveal_personal_emails: reveal_personal_emails }
    cost: { per: item, items: details, unit: credits, settle: { path: credits_consumed } }

  # --- Mailboxes and schedules ----------------------------------------------

  - name: list_email_accounts
    class: read
    description: >-
      List the mailboxes connected to this Apollo team, each with the id that
      sends a sequence's emails. Costs no credit.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The connected mailboxes, input: {} }
    call: { method: GET, path: /email_accounts }
    cost: *cost

  - name: list_email_schedules
    class: read
    description: >-
      List the send schedules of this Apollo team, each with the id that
      create_sequence requires (emailer_schedule_id). Costs no credit.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The send schedules, input: {} }
    call: { method: GET, path: /emailer_schedules }
    cost: *cost

  # --- Sequences ------------------------------------------------------------

  - name: search_sequences
    class: read
    description: >-
      Search this team's sequences by a part of their name. Returns
      emailer_campaigns (each with its id, name, active and archived state)
      and pagination. Costs no credit.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, description: "A part of the sequence name." }
        per_page: *per_page
        page: *page
    examples:
      - title: Sequences whose name holds a word
        input: { name: onboarding }
    call:
      method: POST
      path: /emailer_campaigns/search
      body: { q_name: name, per_page: per_page, page: page }
    cost: *cost

  - name: create_sequence
    class: write
    description: >-
      Create a sequence, always inactive: nothing is sent until
      activate_sequence. emailer_schedule_id comes from list_email_schedules.
      emailer_steps defines the steps (Apollo's structure, not checked here);
      label_names are created if absent. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [name, emailer_schedule_id]
      properties:
        name: { type: string, minLength: 1, pattern: "\\S" }
        emailer_schedule_id: { type: string, minLength: 1, pattern: "\\S", description: "Send schedule id, from list_email_schedules." }
        label_names: &label_names { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Label names." }
        folder_id: { type: string, minLength: 1 }
        max_emails_per_day: &max_emails_per_day { type: integer, minimum: 1, description: "Daily send ceiling." }
        emailer_steps: &emailer_steps
          type: array
          minItems: 1
          items: { type: object }
          description: "The steps, in Apollo's structure (type, wait_time, position, emailer_template)."
    examples:
      - title: An inactive sequence on a schedule
        input: { name: Q4 outreach, emailer_schedule_id: 6b0c0d0e0a0b0c0d0e0f0a0b, max_emails_per_day: 50 }
    call:
      method: POST
      path: /sequences
      body:
        name: name
        emailer_schedule_id: emailer_schedule_id
        label_names: label_names
        folder_id: folder_id
        max_emails_per_day: max_emails_per_day
        emailer_steps: emailer_steps
      constants: { body: { active: false } }
    cost: *cost

  - name: update_sequence
    class: sensitive
    description: >-
      Update a sequence: only the fields given change. Steps with an id are
      modified, steps without one are created. cc_emails and bcc_emails are
      copied on every email the sequence sends, and changed steps reach the
      contacts still in it. Activating or deactivating has its own function.
      Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [sequence_id]
      minProperties: 2
      properties:
        sequence_id: &sequence_id { type: string, pattern: "^[A-Za-z0-9]+$", description: "Apollo sequence id (emailer_campaign id)." }
        name: { type: string, minLength: 1 }
        emailer_schedule_id: { type: string, minLength: 1 }
        label_names: *label_names
        max_emails_per_day: *max_emails_per_day
        cc_emails: &copies { type: array, minItems: 1, items: { type: string, minLength: 3, personal: true } }
        bcc_emails: *copies
        emailer_steps: *emailer_steps
    examples:
      - title: Lower the daily ceiling
        input: { sequence_id: 6c0c0d0e0a0b0c0d0e0f0a0b, max_emails_per_day: 30 }
    confirm: { summary: "Update Apollo sequence {sequence_id}: changes reach every contact still in it." }
    call:
      method: PUT
      path: "/sequences/{sequence_id}"
      body:
        name: name
        emailer_schedule_id: emailer_schedule_id
        label_names: label_names
        max_emails_per_day: max_emails_per_day
        cc_emails: cc_emails
        bcc_emails: bcc_emails
        emailer_steps: emailer_steps
    cost: *cost

  - name: activate_sequence
    class: sensitive
    description: >-
      Activate a sequence: Apollo starts sending its emails to the contacts
      in it, on its schedule. Refused (422) if it is already active or has no
      step. Costs no credit at the call; sends and reveals cost as they go.
    input: &sequence_only
      type: object
      additionalProperties: false
      required: [sequence_id]
      properties:
        sequence_id: *sequence_id
    examples:
      - title: Start a reviewed sequence
        input: { sequence_id: 6c0c0d0e0a0b0c0d0e0f0a0b }
    confirm: { summary: "Activate Apollo sequence {sequence_id}: its emails start going out." }
    call: { method: POST, path: "/emailer_campaigns/{sequence_id}/approve" }
    cost: *cost

  - name: deactivate_sequence
    class: write
    description: >-
      Deactivate a sequence: its sending stops until it is activated again.
      Refused (422) if it is already inactive. Costs no credit.
    input: *sequence_only
    examples:
      - title: Pause a sequence
        input: { sequence_id: 6c0c0d0e0a0b0c0d0e0f0a0b }
    call: { method: POST, path: "/emailer_campaigns/{sequence_id}/abort" }
    cost: *cost

  - name: archive_sequence
    class: sensitive
    description: >-
      Archive a sequence: it stops and leaves the active lists. Needs to own
      it or have full access to it. Costs no credit.
    input: *sequence_only
    examples:
      - title: Archive an old sequence
        input: { sequence_id: 6c0c0d0e0a0b0c0d0e0f0a0b }
    confirm: { summary: "Archive Apollo sequence {sequence_id}." }
    call: { method: POST, path: "/emailer_campaigns/{sequence_id}/archive" }
    cost: *cost

  - name: update_sequence_contact_status
    class: write
    description: >-
      Change the status of contacts in one or more sequences: mark_as_finished
      ends their sequence, remove takes them out of it, stop halts their
      progression. Returns an asynchronous job (entity_progress_job), without
      its final state. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [emailer_campaign_ids, contact_ids, mode]
      properties:
        emailer_campaign_ids: { type: array, minItems: 1, items: *sequence_id, description: "Sequence ids." }
        contact_ids: &contact_ids { type: array, minItems: 1, items: { type: string, pattern: "^[A-Za-z0-9]+$" }, description: "Apollo contact ids (from search_contacts)." }
        mode: { enum: [mark_as_finished, remove, stop] }
    examples:
      - title: Take two contacts out of a sequence
        input: { emailer_campaign_ids: [6c0c0d0e0a0b0c0d0e0f0a0b], contact_ids: [6d0c0d0e0a0b0c0d0e0f0a0b, 6d0c0d0e0a0b0c0d0e0f0a0c], mode: remove }
    call:
      method: POST
      path: /emailer_campaigns/remove_or_stop_contact_ids
      query: { emailer_campaign_ids: emailer_campaign_ids, contact_ids: contact_ids, mode: mode }
    cost: *cost

  - name: get_contact_sequence_activity
    class: read
    description: >-
      Read the sequence activity of one contact of this team, most recent
      first: at most per_page events, not a pagination. sequence_id keeps one
      sequence. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: &contact_id { type: string, pattern: "^[A-Za-z0-9]+$", description: "Apollo contact id, from search_contacts (not a person id)." }
        sequence_id: *sequence_id
        per_page: { type: integer, minimum: 1, maximum: 50, description: "The most recent events, 1 to 50." }
    examples:
      - title: The last events of one contact
        input: { contact_id: 6d0c0d0e0a0b0c0d0e0f0a0b, per_page: 20 }
    call:
      method: POST
      path: /emailer_campaigns/activity_feed
      body: { contact_id: contact_id, sequence_id: sequence_id, per_page: per_page }
    cost: *cost

  # --- One-off emails -------------------------------------------------------

  - name: create_email_draft
    class: write
    act: false
    description: >-
      Write an email draft, which does not go out: send_email_now sends it.
      contact_id is the recipient (from search_contacts), unless the draft
      answers a thread (in_response_to_emailer_message_id). Apollo cleans the
      HTML. Costs no credit.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - required: [contact_id]
        - required: [in_response_to_emailer_message_id]
      properties:
        contact_id: *contact_id
        subject: { type: string, minLength: 1 }
        body_html: { type: string, minLength: 1 }
        recipients:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              email: *email
              contact_id: *contact_id
              recipient_type_cd: { enum: [to, cc, bcc] }
          description: "Recipients: [{email, contact_id, recipient_type_cd: to, cc or bcc}]."
        in_response_to_emailer_message_id: { type: string, minLength: 1, description: "Id of the message this draft answers." }
        emailer_template_id: { type: string, minLength: 1 }
        attachment_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        enable_tracking: { type: boolean, description: "Track opens and clicks." }
        outreach_task_id: { type: string, minLength: 1, description: "Apollo task to link." }
    examples:
      - title: A draft to one contact
        input: { contact_id: 6d0c0d0e0a0b0c0d0e0f0a0b, subject: Hello, body_html: "<p>Hello Marie,</p>" }
    call:
      method: POST
      path: /emailer_messages
      body:
        contact_id: contact_id
        subject: subject
        body_html: body_html
        recipients: recipients
        in_response_to_emailer_message_id: in_response_to_emailer_message_id
        emailer_template_id: emailer_template_id
        attachment_ids: attachment_ids
        enable_tracking: enable_tracking
        outreach_task_id: outreach_task_id
    cost: *cost

  - name: send_email_now
    class: sensitive
    description: >-
      Send an existing draft now, from create_email_draft: it reaches a real
      person and cannot be recalled. check_email_send_status follows it.
      Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: &message_id { type: string, pattern: "^[A-Za-z0-9]+$", description: "Apollo message id." }
        surface: { type: string, minLength: 1, description: "Apollo's internal attribution (emails)." }
    examples:
      - title: Send a reviewed draft
        input: { message_id: 6e0c0d0e0a0b0c0d0e0f0a0b }
    confirm: { summary: "Send Apollo email {message_id} now: irreversible." }
    call:
      method: POST
      path: "/emailer_messages/{message_id}/send_now"
      body: { surface: surface }
    cost: *cost

  - name: check_email_send_status
    class: read
    description: >-
      Read the send status of one message: completed_at once sent, a failure
      or not-sent reason, or retry_after_seconds while it is pending. Costs no
      credit.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: *message_id
    examples:
      - title: Was it sent?
        input: { message_id: 6e0c0d0e0a0b0c0d0e0f0a0b }
    call:
      method: POST
      path: /emailer_messages/email_send_status
      body: { id: message_id }
    cost: *cost

  - name: search_emails
    class: read
    description: >-
      Search this team's outreach emails by status, reply class, sequence,
      keywords and date range. Returns emailer_messages and emailer_steps.
      Apollo shows at most 50,000 results (500 pages of 100). Costs no
      credit.
    input:
      type: object
      additionalProperties: false
      properties:
        stats:
          type: array
          minItems: 1
          items: { enum: [delivered, scheduled, drafted, not_opened, opened, clicked, unsubscribed, demoed, bounced, spam_blocked, failed_other] }
        reply_classes:
          type: array
          minItems: 1
          items: { enum: [willing_to_meet, follow_up_question, person_referral, out_of_office, already_left_company_or_not_right_person, not_interested, unsubscribe, none_of_the_above] }
        sequence_ids: { type: array, minItems: 1, items: *sequence_id }
        exclude_sequence_ids: { type: array, minItems: 1, items: *sequence_id }
        keywords: { type: string, minLength: 1, personal: true, description: "Full-text search: a name, an address, a subject." }
        date_range_mode: { enum: [due_at, completed_at] }
        date_min: &date { type: string, format: date, description: "YYYY-MM-DD." }
        date_max: *date
        per_page: *per_page
        page: *page
    examples:
      - title: Emails that got a positive reply
        input: { reply_classes: [willing_to_meet], per_page: 50 }
    call:
      method: GET
      path: /emailer_messages/search
      query:
        emailer_message_stats: stats
        emailer_message_reply_classes: reply_classes
        emailer_campaign_ids: sequence_ids
        not_emailer_campaign_ids: exclude_sequence_ids
        q_keywords: keywords
        emailer_message_date_range_mode: date_range_mode
        "emailer_message_date_range[min]": date_min
        "emailer_message_date_range[max]": date_max
        page: page
        per_page: per_page
    cost: *cost

  - name: get_email_content
    class: read
    description: >-
      Read the body of up to 10 sent emails, in the order asked; an id that
      matches no sent email is left out without error. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 10, items: *message_id, description: "Ids of sent emails, at most 10." }
        body_format: { enum: [plain, html], default: plain }
    examples:
      - title: Two sent emails as text
        input: { ids: [6e0c0d0e0a0b0c0d0e0f0a0b, 6e0c0d0e0a0b0c0d0e0f0a0c] }
    call:
      method: POST
      path: /emailer_messages/get_content
      body: { ids: ids, body_format: body_format }
    cost: *cost

  - name: get_email_stats
    class: read
    description: >-
      Read the opens and clicks of one sent email (num_opens, num_clicks,
      activities). Needs a master API key. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: *message_id
    examples:
      - title: Opens of one email
        input: { message_id: 6e0c0d0e0a0b0c0d0e0f0a0b }
    call: { method: GET, path: "/emailer_messages/{message_id}/activities" }
    cost: *cost

  # --- Conversations --------------------------------------------------------

  - name: search_conversations
    class: read
    description: >-
      Search this team's recorded calls and video meetings by type, account,
      contacts, organizations, tags, trackers and date range. Returns
      conversations and pagination. Costs no credit; reading one with
      get_conversation may cost one.
    input:
      type: object
      additionalProperties: false
      properties:
        conversation_type: { enum: [video_conference, phone_call] }
        account_id: { type: string, minLength: 1 }
        contact_ids: *contact_ids
        tag_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        tracker_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        organization_ids: *org_ids
        date_range:
          type: object
          additionalProperties: false
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
          description: "{start, end}, ISO 8601."
        per_page: *per_page
        page: *page
    examples:
      - title: Phone calls of October
        input: { conversation_type: phone_call, date_range: { start: "2026-10-01T00:00:00Z", end: "2026-10-31T23:59:59Z" } }
    call:
      method: POST
      path: /conversations/search
      body:
        page: page
        num_fetch_result: per_page
        conversation_type: conversation_type
        account_id: account_id
        contact_ids: contact_ids
        tag_ids: tag_ids
        tracker_ids: tracker_ids
        organization_ids: organization_ids
        date_range: date_range
    cost: *cost

  - name: get_conversation
    class: read
    description: >-
      Read one recorded conversation: transcript, participants,
      opportunities. Costs 1 Apollo credit when the conversation has AI
      insights, none otherwise, which nothing says before the call. The
      recording links are not returned.
    input:
      type: object
      additionalProperties: false
      required: [conversation_id]
      properties:
        conversation_id: { type: string, pattern: "^[A-Za-z0-9_]+$", description: "Conversation id, or its id_shareid form." }
    examples:
      - title: The transcript of one call
        input: { conversation_id: 6f0c0d0e0a0b0c0d0e0f0a0b }
    call: { method: GET, path: "/conversations/{conversation_id}" }
    output: { strip: [video_recording, audio_recording] }
    cost: { per: request, unit: credits }

  # --- Contacts of the team -------------------------------------------------

  - name: list_typed_custom_fields
    class: read
    description: >-
      List this team's custom fields: id (the key update_contact expects in
      typed_custom_fields), name, modality (contact, account, opportunity),
      type and, for a picklist, its values with their ids (send the id, not
      the label). Needs a master API key. Costs no credit.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: The custom fields, input: {} }
    call: { method: GET, path: /typed_custom_fields }
    cost: *cost

  - name: create_custom_field
    class: write
    description: >-
      Declare a new custom field on this team. Apollo does not deduplicate on
      the label: creating it twice makes two fields, so read
      list_typed_custom_fields first. A string field is bounded (120
      characters by default) and silently truncated: use textarea for long
      text. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [label, modality, field_type]
      properties:
        label: { type: string, minLength: 1, pattern: "\\S" }
        modality: { enum: [contact, account, opportunity] }
        field_type: { enum: [string, textarea, number, date, datetime, boolean] }
    examples:
      - title: A long text field on contacts
        input: { label: Hook sentence, modality: contact, field_type: textarea }
    call:
      method: POST
      path: /fields
      body: { label: label, modality: modality, type: field_type }
    cost: *cost

  - name: search_contacts
    class: read
    description: >-
      Search the contacts saved by this team (not the shared database, which
      is search_people): the only source of contact ids for sequences and
      emails. Returns contacts, breadcrumbs and pagination; Apollo shows at
      most 500 pages. Costs no credit.
    input:
      type: object
      additionalProperties: false
      dependentRequired: { sort_ascending: [sort_by_field] }
      properties:
        q_keywords: { type: string, minLength: 1, personal: true, description: "Free search on name, title, employer, email." }
        contact_stage_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        contact_label_ids: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        sort_by_field: { enum: [contact_last_activity_date, contact_email_last_opened_at, contact_email_last_clicked_at, contact_created_at, contact_updated_at] }
        sort_ascending: { type: boolean, description: "Ascending order; needs sort_by_field." }
        per_page: *per_page
        page: *page
    examples:
      - title: Contacts matching a name, last updated first
        input: { q_keywords: martin, sort_by_field: contact_updated_at }
    call:
      method: POST
      path: /contacts/search
      body:
        q_keywords: q_keywords
        contact_stage_ids: contact_stage_ids
        contact_label_ids: contact_label_ids
        sort_by_field: sort_by_field
        sort_ascending: sort_ascending
        per_page: per_page
        page: page
    cost: *cost

  - name: get_contact
    class: read
    description: >-
      Read one contact of this team by its id: the values the team wrote
      (stage, owner, labels, custom fields, phones). Costs no credit, unlike
      match_person. Needs a master API key.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: *contact_id
    examples:
      - title: One saved contact
        input: { contact_id: 6d0c0d0e0a0b0c0d0e0f0a0b }
    refusals:
      - { code: contact_not_found, when: 422, message: "No contact with this id in this team: deleted, another team's, or a person id from search_people rather than a contact id." }
    call: { method: GET, path: "/contacts/{contact_id}" }
    cost: *cost

  - name: update_contact
    class: write
    description: >-
      Update one contact of this team: fields not given stay as they are,
      except label_names, which replaces the contact's lists (one list given
      takes it out of all the others). typed_custom_fields is keyed by field
      id, from list_typed_custom_fields, and a picklist takes the id of its
      value. Needs a master API key. Costs no credit.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      minProperties: 2
      properties:
        contact_id: *contact_id
        first_name: *first_name
        last_name: *last_name
        organization_name: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        account_id: { type: string, minLength: 1 }
        email: *email
        website_url: { type: string, minLength: 1 }
        label_names: *label_names
        contact_stage_id: { type: string, minLength: 1 }
        present_raw_address: { type: string, minLength: 1, personal: true }
        direct_phone: &phone { type: string, minLength: 1, personal: true }
        corporate_phone: *phone
        mobile_phone: *phone
        home_phone: *phone
        other_phone: *phone
        typed_custom_fields:
          type: object
          minProperties: 1
          propertyNames: { pattern: "^[A-Za-z0-9]+$" }
          description: "{field id: value}, ids from list_typed_custom_fields."
    examples:
      - title: Move a contact to a stage and fill a custom field
        input: { contact_id: 6d0c0d0e0a0b0c0d0e0f0a0b, contact_stage_id: 6a0c0d0e0a0b0c0d0e0f0a01, typed_custom_fields: { 6a0c0d0e0a0b0c0d0e0f0a02: "2026-10-21" } }
    call:
      method: PATCH
      path: "/contacts/{contact_id}"
      body:
        first_name: first_name
        last_name: last_name
        organization_name: organization_name
        title: title
        account_id: account_id
        email: email
        website_url: website_url
        label_names: label_names
        contact_stage_id: contact_stage_id
        present_raw_address: present_raw_address
        direct_phone: direct_phone
        corporate_phone: corporate_phone
        mobile_phone: mobile_phone
        home_phone: home_phone
        other_phone: other_phone
        typed_custom_fields: typed_custom_fields
    cost: *cost
