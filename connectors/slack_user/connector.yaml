# yaml-language-server: $schema=../connector.schema.json
# Slack Web API (https://docs.slack.dev/reference/methods), on a person's user token. The values come from the Python
# client, oto.tools.slack, which this description follows, as connectors/slack does for the bot token: one request per
# method to slack.com/api/<method>, the token as a bearer token, reads in the query of a GET, writes in a JSON body.
# The function names, the argument names and the keys sent to Slack are the client's; the client is not changed
# (tests/test_slack_user_description.py reads it to keep both equal).
#
# One token: the user token (xoxp-), the person who installed the app, decided by Alexis on 2026-10-22: a second
# connector rather than a second token in the format. The client holds two tokens per workspace and picks one per call;
# this description holds what the client sends on the user token when the workspace holds both:
# - by the call: search (search:read is a user-token scope), a read of a DM (a channel id D…, history and replies), a
#   listing of the direct conversations only (types im, mpim), and opening a DM (open_dm);
# - by the author the caller chooses (as_user, the author oto 1 requires when both tokens are set): posting, rewriting
#   and deleting a message, a reaction, and a file's metadata, under the person's name and with their reach.
# The bot's side, the same client, is connectors/slack. What the client sends on the bot token when both are set is not
# here: channel reads (C…, G…), a channel's metadata, joining a channel, a person by id or email, user groups. When the
# workspace holds only a user token, the client sends those on it too (it falls through to the only token): that
# fallback is not described, and a person who needs them connects the bot side as well. post_ephemeral, which the
# client also sends on the chosen author's token, stays on the bot side: an ephemeral message is an app's notice, and
# oto 1 does not send one.
#
# Read and act. Reads stay on the read side: search and DMs are a person's private messages (personal). open_dm only
# opens (or finds) a conversation, Slack tells no one: a write that stays on the read side (act: false). A reaction is
# served on the act side (class write). Ask for a confirmation (class sensitive): posting, rewriting and deleting a
# message, all under the person's own name.
#
# post_message. The client preprocesses text (oto/tools/slack/text.py), as for the bot: it breaks every number between
# two colons that Slack would read as an emoji code, except :100: and :1234:, and splits a text over 4,000 characters.
# The description refuses such a text (pattern) and caps it at 4,000 characters (maxLength), as connectors/slack does;
# under these bounds the client sends exactly what the host sends. update_message does not preprocess.
# Link previews (1.1.0): unfurl_links and unfurl_media go to chat.postMessage as given, only when the call gives
# them, as the client sends them on every part it splits; absent, Slack's default holds, unchanged for oto 1.
#
# Pagination: conversations.history by cursor (response_metadata.next_cursor, has_more), declared; not
# conversations.replies, which repeats the thread's parent first on every page. search.messages pages by number, and
# the client takes no page: one page. conversations.list: the client reads the first page only.
#
# Values the client sets when the call does not give them, not declared as defaults (the host sends only what the call
# gives): limit 50 (history, replies), count 20 (search_messages). list_channels takes types, required: absent, the
# client sends public_channel, which it reads on the bot token.
#
# Errors: the table of connectors/slack, worded for the person's token. Slack answers a refused call with HTTP 200 and
# {ok: false, error: <code>}: each code the client names has its entry under status 200, grouped as the client groups
# them; any other ok: false is invalid_request, last. The five codes the client counts as authentication mark the
# account credential_rejected. ratelimited and HTTP 429 are retryable; a Slack incident is not.
#
# Not described here, left to the hand-written client or to connectors/slack:
# - fetch_file and download_file: the file is read on files.slack.com with the token, another origin than base_url;
# - the five user group writes (form-encoded body), which the client sends on the chosen author's token;
# - the as_user argument of every method that takes it (one token: the user token).
# No probe: every function here needs an argument (oto 1 checks a user token with auth.test, not a client method). No
# rate is declared: Slack limits each method by its own tier.
connector:
  name: slack_user
  label: Slack (personal token)
  namespace: slack_user
  version: 1.1.0
  api_version: Web API
  base_url: https://slack.com/api
  auth: { kind: bearer, token: user_token }
  credential:
    - { name: user_token, label: User token (xoxp-), secret: true }
  # A user token speaks for one person: posts go out under their name, their DMs are read.
  modes: [byo_user]
  # The client waits 60 s for an answer (10 s to connect).
  timeout_s: 60
  errors:
    - { status: 200, body: { path: error, equals: [not_authed, invalid_auth, account_inactive, token_revoked, token_expired] },
        code: token_refused, retryable: false, marks_account: credential_rejected,
        message: "Slack refused the user token: invalid, revoked or expired, the person deactivated, or the app uninstalled. Set a valid xoxp- token again." }
    - { status: 200, body: { path: error, equals: [missing_scope] }, code: scope_missing, retryable: false,
        message: "The user token lacks a scope this method needs (Slack's reference names it): add it to the app's user scopes, reinstall the app, then set the new token." }
    - { status: 200, body: { path: error, equals: [not_allowed_token_type] }, code: token_type_refused, retryable: false,
        message: "This Slack method does not take a user token." }
    - { status: 200, body: { path: error, equals: [not_in_channel] }, code: not_in_channel, retryable: false,
        message: "The person is not a member of this channel." }
    - { status: 200, body: { path: error, equals: [is_archived] }, code: channel_archived, retryable: false,
        message: "This channel is archived: it cannot be posted to." }
    - { status: 200, body: { path: error, equals: [plan_upgrade_required, paid_teams_only] }, code: plan_required, retryable: false,
        message: "This Slack feature needs a paid plan of the workspace." }
    - { status: 200, body: { path: error, equals: [ekm_access_denied, restricted_action, cant_post_message, no_permission, permission_denied] },
        code: forbidden, retryable: false,
        message: "Slack refused this action for the person: a workspace setting or the channel's permissions forbid it." }
    - { status: 200, body: { path: error, equals: [channel_not_found] }, code: channel_not_found, retryable: false,
        message: "No such channel or conversation for this person." }
    - { status: 200, body: { path: error, equals: [user_not_found, users_not_found] }, code: user_not_found, retryable: false,
        message: "No such Slack user." }
    - { status: 200, body: { path: error, equals: [message_not_found, thread_not_found] }, code: message_not_found, retryable: false,
        message: "No such message or thread in this conversation: check its ts." }
    - { status: 200, body: { path: error, equals: [file_not_found] }, code: file_not_found, retryable: false,
        message: "No such file, or a file the person cannot see." }
    - { status: 200, body: { path: error, equals: [no_such_subteam] }, code: usergroup_not_found, retryable: false,
        message: "No such user group in this workspace." }
    - { status: 200, body: { path: error, equals: [name_already_exists, handle_already_exists] }, code: name_taken, retryable: false,
        message: "This name or handle is already taken in the workspace." }
    - { status: 200, body: { path: error, equals: [ratelimited, rate_limited] }, code: rate_limited, retryable: true,
        message: "Slack rate limit reached for this method: wait, then retry." }
    - { status: 200, body: { path: error, equals: [internal_error, fatal_error, service_unavailable, request_timeout] },
        code: upstream_unavailable, retryable: false,
        message: "Slack failed. A read can be retried; a post may have gone through: read the conversation back before posting again." }
    - { status: 200, body: { path: ok, equals: [false] }, code: invalid_request, retryable: false,
        message: "Slack refused the request: check the arguments against the method's reference." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Slack rate limit reached for this method: wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: false,
        message: "Slack failed. A read can be retried; a post may have gone through: read the conversation back before posting again." }

functions:
  # --- Search and direct messages ------------------------------------------------

  - name: search_messages
    class: read
    description: >-
      Search the messages the person can see, across channels and DMs, with
      Slack's search syntax: words, "exact phrase", in:#channel, in:@person,
      from:@person, before:2026-10-01, after:, has:link. Answers messages.matches
      (text, user, channel, ts, permalink) and messages.total; one page only, up
      to count matches.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, personal: true, description: "Slack search query." }
        count: { type: integer, minimum: 1, maximum: 100, description: "Matches per page; Slack may return fewer." }
    examples:
      - { title: A word in one channel, input: { query: "invoice in:#finance", count: 20 } }
      - { title: What one person wrote lately, input: { query: "from:@marie after:2026-10-01" } }
    call: { method: GET, path: /search.messages, query: { query: query, count: count } }
    cost: &request { per: request }

  - name: list_channels
    class: read
    description: >-
      List the person's direct conversations: im (one-to-one DMs: id D…, user)
      and mpim (group DMs). One page only (Slack's default size). The workspace
      channels are listed on the bot side (connectors/slack).
    input:
      type: object
      additionalProperties: false
      required: [types]
      properties:
        types:
          type: string
          pattern: "^(im|mpim)(,(im|mpim))?$"
          description: "im, mpim, or both comma-separated."
    examples:
      - { title: The person's DMs, input: { types: im } }
      - { title: DMs and group DMs, input: { types: "im,mpim" } }
    call: { method: GET, path: /conversations.list, query: { types: types } }
    output: { items: channels }
    cost: *request

  - name: history
    class: read
    description: >-
      Read one of the person's direct-message conversations (a DM id, D…, from
      list_channels or open_dm), newest first: TOP-LEVEL messages only; a
      thread's replies are read with replies. oldest and latest are exclusive
      bounds (a message ts), inclusive includes the messages sitting on them.
      When more remain, pass the cursor given back.
    input:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: &dm_id { type: string, pattern: "^D[A-Z0-9]+$", description: "Direct-message conversation id (D…)." }
        limit: &limit { type: integer, minimum: 1, maximum: 1000, description: "Messages per page; Slack may return fewer." }
        cursor: &cursor { type: string, minLength: 1, description: "response_metadata.next_cursor of the previous page." }
        oldest: &oldest { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$", description: "Only messages after this ts (exclusive)." }
        latest: &latest { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$", description: "Only messages before this ts (exclusive)." }
        inclusive: &inclusive { const: true, description: "Also return the messages sitting exactly on oldest or latest. Omit otherwise." }
    examples:
      - { title: The last twenty messages of a DM, input: { channel: D0000000001, limit: 20 } }
      - { title: A DM over one day, input: { channel: D0000000001, oldest: "1767225600", latest: "1767312000", inclusive: true } }
    call:
      method: GET
      path: /conversations.history
      query: { channel: channel, limit: limit, cursor: cursor, oldest: oldest, latest: latest, inclusive: inclusive }
    pagination: { kind: cursor, request_param: cursor, next: response_metadata.next_cursor, more: has_more, max_pages: 10 }
    output: { items: messages }
    cost: *request

  - name: replies
    class: read
    description: >-
      Read the replies of a thread in one of the person's DMs (D…). thread_ts is
      the ts of the PARENT message. The parent comes first, as messages[0], on
      every page; limit counts the replies only. Called with the ts of a reply,
      Slack returns that one message alone: call again with its thread_ts. When
      has_more, pass response_metadata.next_cursor as cursor.
    input:
      type: object
      additionalProperties: false
      required: [channel, thread_ts]
      properties:
        channel: *dm_id
        thread_ts: &message_ts { type: string, pattern: "^[0-9]+\\.[0-9]+$", description: "Message ts (1767225600.000100)." }
        limit: *limit
        cursor: *cursor
        oldest: *oldest
        latest: *latest
        inclusive: *inclusive
    examples:
      - { title: The replies of a thread in a DM, input: { channel: D0000000001, thread_ts: "1767225600.000100" } }
    call:
      method: GET
      path: /conversations.replies
      query: { channel: channel, ts: thread_ts, limit: limit, cursor: cursor, oldest: oldest, latest: latest, inclusive: inclusive }
    cost: *request

  - name: open_dm
    class: write
    act: false
    description: >-
      Open the person's direct conversation with another user, or get it if it
      exists: the answer's channel.id is the DM id to read (history) or to post
      to (post_message). Nothing is sent and no one is told.
    input:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { type: string, minLength: 1, personal: true, description: "Slack user id (U…)." }
    examples:
      - { title: The person's DM with a colleague, input: { user: U0000000001 } }
    call: { method: POST, path: /conversations.open, body: { users: user } }
    cost: *request

  # --- Messages under the person's name -------------------------------------------

  - name: post_message
    class: sensitive
    description: >-
      Post a message under the PERSON's own name, to a channel they are in or a
      DM, or reply in a thread (thread_ts, the parent's ts). text is Slack
      mrkdwn, 4,000 characters at most: split a longer text yourself, the later
      parts as replies under the first. Slack reads a number between two colons
      (20:51:, 12:30:00) as an emoji code and swallows it: such a text is refused,
      write the time without seconds and with no colon right after it. blocks go
      as given. unfurl_links and unfurl_media false post
      it without link previews. The answer gives ts, the anchor of a reply.
    input:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel: { type: string, minLength: 1, description: "Channel id (C…, G…), DM id (D…, from open_dm), or channel name." }
        text:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: "^(?![\\s\\S]*:(?!(?:100|1234):)[0-9]+:)"
          personal: true
          description: "Message text (mrkdwn), at most 4,000 characters, no number between two colons."
        blocks: &blocks
          type: array
          minItems: 1
          maxItems: 50
          items: { type: object }
          personal: true
          description: "Block Kit blocks, sent as given."
        thread_ts: *message_ts
        unfurl_links:
          type: boolean
          description: "false: no preview of the text links under the message; true: ask for it. Absent: Slack's default."
        unfurl_media:
          type: boolean
          description: "false: no preview of the media links (images, videos). Absent: Slack's default."
    examples:
      - { title: A message in a DM, input: { channel: D0000000001, text: "Thanks, I'll look at it this afternoon." } }
      - { title: A reply in a thread, input: { channel: C0000000001, text: "Agreed, let's ship it.", thread_ts: "1767225600.000100" } }
      - { title: A link without its preview, input: { channel: C0000000001, text: "Release notes: https://example.com/release-notes", unfurl_links: false, unfurl_media: false } }
    call:
      method: POST
      path: /chat.postMessage
      body: { channel: channel, text: text, blocks: blocks, thread_ts: thread_ts, unfurl_links: unfurl_links, unfurl_media: unfurl_media }
    cost: *request
    confirm: { summary: "Post a message to Slack conversation {channel} under the person's own name, seen by its members." }

  - name: update_message
    class: sensitive
    description: >-
      Replace the text or blocks of a message the person posted (channel and its
      ts); it stays under their name, marked edited. The text goes as given: a
      number between two colons (20:51:) is read by Slack as an emoji code.
    input:
      type: object
      additionalProperties: false
      required: [channel, ts]
      properties:
        channel: &channel_id { type: string, minLength: 1, description: "Channel or DM id (C…, G…, D…)." }
        ts: *message_ts
        text: { type: string, minLength: 1, personal: true, description: "New message text (mrkdwn)." }
        blocks: *blocks
    examples:
      - { title: Correct a message, input: { channel: D0000000001, ts: "1767225600.000100", text: "Thanks, I'll look at it tomorrow morning." } }
    call:
      method: POST
      path: /chat.update
      body: { channel: channel, ts: ts, text: text, blocks: blocks }
    cost: *request
    confirm: { summary: "Rewrite message {ts} in Slack conversation {channel}, under the person's own name." }

  - name: delete_message
    class: sensitive
    description: >-
      Delete a message the person posted (channel and its ts). It cannot be
      restored.
    input:
      type: object
      additionalProperties: false
      required: [channel, ts]
      properties:
        channel: *channel_id
        ts: *message_ts
    examples:
      - { title: Delete a message, input: { channel: D0000000001, ts: "1767225600.000100" } }
    call: { method: POST, path: /chat.delete, body: { channel: channel, ts: ts } }
    cost: *request
    confirm: { summary: "Delete message {ts}, posted under the person's own name, from Slack conversation {channel}: it cannot be restored." }

  - name: add_reaction
    class: write
    description: >-
      Add an emoji reaction to a message (channel and its ts), under the person's
      own name. name is the emoji's name without colons (white_check_mark).
    input:
      type: object
      additionalProperties: false
      required: [channel, ts, name]
      properties:
        channel: *channel_id
        ts: *message_ts
        name: { type: string, pattern: "^[^:\\s]+$", description: "Emoji name, without colons." }
    examples:
      - { title: Tick a message, input: { channel: D0000000001, ts: "1767225600.000100", name: white_check_mark } }
    call:
      method: POST
      path: /reactions.add
      body: { channel: channel, timestamp: ts, name: name }
    cost: *request

  # --- Files ---------------------------------------------------------------------

  - name: file_info
    class: read
    description: >-
      Get the metadata of a file the person can see, DMs included, by its id
      (F…, from a message's files[].id): name, title, mimetype, size, the
      conversations it was shared in. Its content is not returned.
    input:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: { type: string, minLength: 1, description: "Slack file id (F…)." }
    examples:
      - { title: One file, input: { file_id: F0000000001 } }
    call: { method: GET, path: /files.info, query: { file: file_id } }
    cost: *request
