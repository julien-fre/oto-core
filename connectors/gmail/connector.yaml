# yaml-language-server: $schema=../connector.schema.json
# Gmail API v1 reference: https://developers.google.com/workspace/gmail/api/reference/rest
# The mailbox of one signed-in person (delegated access, userId "me"): every
# call sees exactly what that person sees.
# The access token comes from the person's consent (OAuth 2.0 authorization
# code), with the OAuth application of the host or of the organization.
# access_type=offline and prompt=consent bring a refresh token at each consent;
# Google does not rotate it. Incremental authorization (include_granted_scopes)
# is not asked for: a consent at level read never inherits a broader scope
# granted earlier to the same application.
# Two access levels: read (gmail.readonly) and full (gmail.modify, which Google
# accepts wherever it accepts gmail.readonly for the functions below).
# Out of this file: sending a composed message, replying and drafting (the
# message is an RFC 2822 text built by code, then base64url-encoded), and
# decoding a body or an attachment (base64url in the response). Sending an
# existing draft is a plain call: send_draft below.
connector:
  name: gmail
  label: Gmail
  namespace: gmail
  version: 1.0.0
  api_version: v1
  base_url: https://gmail.googleapis.com/gmail/v1
  auth:
    kind: oauth2_user
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_auth: body
    access_levels:
      read: { scopes: ["https://www.googleapis.com/auth/gmail.readonly"] }
      full: { scopes: ["https://www.googleapis.com/auth/gmail.modify"] }
    scope_implies:
      "https://www.googleapis.com/auth/gmail.modify": ["https://www.googleapis.com/auth/gmail.readonly"]
    authorize_params: { access_type: offline, prompt: select_account consent }
    pkce: S256
    refresh: refresh_token
    rotates: false
    expires_in_default: 3600
    identity: { function: get_profile, path: emailAddress }
  modes: [byo_user]
  timeout_s: 60
  query_arrays: repeat
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Gmail rejected the request as invalid: check the arguments." }
    - { status: 401, code: authorization_expired, retryable: false,
        message: "Google no longer accepts this authorization (expired or revoked): the person must sign in again." }
    - { status: 403, code: permission_missing, retryable: false,
        message: "Google refused the call: a scope is missing, or a per-user rate limit was hit; the reason in the response tells which. It does not mean the message is absent." }
    - { status: 404, code: not_found, retryable: false,
        message: "Gmail object not found: check the id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Gmail is throttling these requests: retry after a delay." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Gmail is temporarily unavailable: retry later." }

functions:
  - name: get_profile
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      Get the mailbox of the signed-in person: emailAddress, messagesTotal,
      threadsTotal and historyId. Every other function acts on this mailbox.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Whose mailbox this is
        input: {}
    call: { method: GET, path: /users/me/profile }
    cost: { per: request }

  - name: list_messages
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      List the messages of the mailbox, newest first, optionally filtered by a
      Gmail search query and by labels. Returns ids and thread ids only: read a
      message with get_message. Spam and trash are left out unless
      include_spam_trash is true.
    input:
      type: object
      additionalProperties: false
      properties:
        query: &query
          type: string
          minLength: 1
          description: "Gmail search syntax, as in the Gmail search box, e.g. from:jane@acme.example is:unread newer_than:7d."
        label_ids: &label_ids
          type: array
          minItems: 1
          uniqueItems: true
          items: &label_id { type: string, pattern: "^[A-Za-z0-9_-]+$" }
          description: "Only messages carrying every one of these labels, e.g. INBOX, UNREAD or a user label id from list_labels."
        max_results: &max_results
          type: integer
          minimum: 1
          maximum: 500
          default: 20
          description: "Maximum number of messages in the page."
        page_token: &page_token
          type: string
          minLength: 1
          description: "nextPageToken of the previous page."
        include_spam_trash: &include_spam_trash
          type: boolean
          default: false
          description: "Include the messages in spam and trash."
    examples:
      - title: Unread messages of the inbox
        input: { label_ids: [INBOX, UNREAD], max_results: 10 }
      - title: Recent messages from one sender
        input: { query: "from:jane@acme.example newer_than:7d" }
    call:
      method: GET
      path: /users/me/messages
      query: { q: query, labelIds: label_ids, maxResults: max_results, pageToken: page_token, includeSpamTrash: include_spam_trash }
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: messages
    cost: { per: page }

  - name: get_message
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      Get one message by id. format full (default) returns the headers and the
      MIME parts, whose bodies are base64url-encoded in payload.parts[].body.data;
      an attachment is a part with a filename and a body.attachmentId, to read
      with get_attachment right away (Gmail issues a new attachment id at each
      read). format metadata returns the headers only, restricted to
      metadata_headers when given.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: &message_id
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Message id, from list_messages or a thread."
        format: &format
          enum: [full, metadata, minimal]
          default: full
          description: "full: headers and body parts; metadata: headers only; minimal: ids and labels."
        metadata_headers: &metadata_headers
          type: array
          minItems: 1
          items: { type: string, pattern: "^[A-Za-z0-9-]+$" }
          description: "With format metadata: the headers to return, e.g. From, To, Subject, Date."
    examples:
      - title: One message in full
        input: { message_id: 18f2a3b4c5d6e7f8 }
      - title: Sender and subject only
        input: { message_id: 18f2a3b4c5d6e7f8, format: metadata, metadata_headers: [From, Subject, Date] }
    refusals:
      - { code: message_not_found, when: 404, message: "No message with this id in this mailbox." }
    call:
      method: GET
      path: "/users/me/messages/{message_id}"
      query: { format: format, metadataHeaders: metadata_headers }
    cost: { per: request }

  - name: get_thread
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      Get one conversation by thread id, with every message in it, oldest first.
      Same formats as get_message.
    input:
      type: object
      additionalProperties: false
      required: [thread_id]
      properties:
        thread_id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Thread id, the threadId of a message."
        format: *format
        metadata_headers: *metadata_headers
    examples:
      - title: One conversation, headers only
        input: { thread_id: 18f2a3b4c5d6e7f8, format: metadata, metadata_headers: [From, Subject, Date] }
    refusals:
      - { code: thread_not_found, when: 404, message: "No thread with this id in this mailbox." }
    call:
      method: GET
      path: "/users/me/threads/{thread_id}"
      query: { format: format, metadataHeaders: metadata_headers }
    cost: { per: request }

  - name: get_attachment
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      Get the content of one attachment of a message: size and data,
      base64url-encoded. The attachment id comes from a get_message or
      get_thread read just before: Gmail issues a new one at each read.
    input:
      type: object
      additionalProperties: false
      required: [message_id, attachment_id]
      properties:
        message_id: *message_id
        attachment_id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "body.attachmentId of the part, from a fresh read of the message."
    examples:
      - title: One attachment
        input: { message_id: 18f2a3b4c5d6e7f8, attachment_id: ANGjdJ8exampleAttachmentId0001 }
    refusals:
      - { code: attachment_not_found, when: 404, message: "No such attachment: read the message again for a fresh attachment id." }
    call: { method: GET, path: "/users/me/messages/{message_id}/attachments/{attachment_id}" }
    cost: { per: request }

  - name: list_labels
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      List the labels of the mailbox, system (INBOX, UNREAD, SENT, STARRED…) and
      user-created, with their ids.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Every label
        input: {}
    call: { method: GET, path: /users/me/labels }
    output:
      items: labels
    cost: { per: request }

  - name: list_drafts
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      List the drafts of the mailbox, optionally filtered by a Gmail search
      query. Returns draft ids with their message id: read one with get_draft.
    input:
      type: object
      additionalProperties: false
      properties:
        query: *query
        max_results: *max_results
        page_token: *page_token
        include_spam_trash: *include_spam_trash
    examples:
      - title: Latest drafts
        input: { max_results: 10 }
    call:
      method: GET
      path: /users/me/drafts
      query: { q: query, maxResults: max_results, pageToken: page_token, includeSpamTrash: include_spam_trash }
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: drafts
    cost: { per: page }

  - name: get_draft
    class: read
    scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
    description: >-
      Get one draft by id, with its message. Same formats as get_message.
    input:
      type: object
      additionalProperties: false
      required: [draft_id]
      properties:
        draft_id: &draft_id
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Draft id, from list_drafts."
        format: *format
    examples:
      - title: One draft
        input: { draft_id: r-1234567890123456789 }
    refusals:
      - { code: draft_not_found, when: 404, message: "No draft with this id in this mailbox." }
    call:
      method: GET
      path: "/users/me/drafts/{draft_id}"
      query: { format: format }
    cost: { per: request }

  - name: modify_message_labels
    class: write
    scopes: ["https://www.googleapis.com/auth/gmail.modify"]
    description: >-
      Add labels to a message, remove labels from it, or both. Archive by
      removing INBOX, mark as read by removing UNREAD, star by adding STARRED.
      Returns the message id and its labels.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      anyOf: [{ required: [add_label_ids] }, { required: [remove_label_ids] }]
      properties:
        message_id: *message_id
        add_label_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: *label_id
          description: "Label ids to add."
        remove_label_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: *label_id
          description: "Label ids to remove."
    examples:
      - title: Archive a message
        input: { message_id: 18f2a3b4c5d6e7f8, remove_label_ids: [INBOX] }
      - title: Mark as read and star
        input: { message_id: 18f2a3b4c5d6e7f8, add_label_ids: [STARRED], remove_label_ids: [UNREAD] }
    refusals:
      - { code: message_not_found, when: 404, message: "No message with this id in this mailbox." }
    call:
      method: POST
      path: "/users/me/messages/{message_id}/modify"
      body: { addLabelIds: add_label_ids, removeLabelIds: remove_label_ids }
    cost: { per: request }

  - name: trash_message
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/gmail.modify"]
    description: >-
      Move a message to the trash. Gmail deletes it for good after 30 days;
      until then untrash_message brings it back.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: *message_id
    examples:
      - title: Trash one message
        input: { message_id: 18f2a3b4c5d6e7f8 }
    refusals:
      - { code: message_not_found, when: 404, message: "No message with this id in this mailbox." }
    call: { method: POST, path: "/users/me/messages/{message_id}/trash" }
    cost: { per: request }
    confirm:
      summary: "Move message {message_id} to the trash."

  - name: untrash_message
    class: write
    scopes: ["https://www.googleapis.com/auth/gmail.modify"]
    description: >-
      Take a message out of the trash, back to where it was.
    input:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id: *message_id
    examples:
      - title: Restore one message
        input: { message_id: 18f2a3b4c5d6e7f8 }
    refusals:
      - { code: message_not_found, when: 404, message: "No message with this id in this mailbox." }
    call: { method: POST, path: "/users/me/messages/{message_id}/untrash" }
    cost: { per: request }

  - name: delete_draft
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/gmail.modify"]
    description: >-
      Delete a draft for good. It does not go to the trash and cannot be
      restored.
    input:
      type: object
      additionalProperties: false
      required: [draft_id]
      properties:
        draft_id: *draft_id
    examples:
      - title: Delete one draft
        input: { draft_id: r-1234567890123456789 }
    refusals:
      - { code: draft_not_found, when: 404, message: "No draft with this id in this mailbox." }
    call: { method: DELETE, path: "/users/me/drafts/{draft_id}" }
    cost: { per: request }
    confirm:
      summary: "Delete draft {draft_id} for good."

  - name: send_draft
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/gmail.modify"]
    description: >-
      Send an existing draft as it stands, to the recipients written in it.
      The draft leaves the drafts list and the message lands in SENT. Read it
      with get_draft first to check its recipients and content. Returns the
      sent message id and its thread id.
    input:
      type: object
      additionalProperties: false
      required: [draft_id]
      properties:
        draft_id: *draft_id
    examples:
      - title: Send one draft
        input: { draft_id: r-1234567890123456789 }
    refusals:
      - { code: draft_not_found, when: 404, message: "No draft with this id in this mailbox." }
    call:
      method: POST
      path: /users/me/drafts/send
      body: { id: draft_id }
    cost: { per: request }
    confirm:
      summary: "Send draft {draft_id} to its recipients."

exposure:
  mode: per_connector
  tool: gmail
