# yaml-language-server: $schema=../connector.schema.json
# Aircall Public API reference: https://developer.aircall.io/api-references/
# 1.1.0: the addresses of a call's audio (recording, voicemail, their short URLs, the asset page) are stripped from
# every read of a call; the audio comes as a file (get_call_recording, get_call_voicemail). Not yet stripped: the
# audio URLs of a line's messages (messages.welcome, .voicemail, ...) in list_numbers and get_number, left for later.
connector:
  name: aircall
  label: Aircall
  namespace: aircall
  version: 1.1.0
  api_version: v1 (users on v2)
  base_url: https://api.aircall.io
  auth:
    kind: basic
    username: api_id
    password: api_token
  credential:
    - { name: api_id, label: API ID, secret: false }
    - { name: api_token, label: API Token, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Aircall rejected the request as invalid: check the arguments." }
    - { status: [401, 403], code: access_rejected, retryable: false,
        message: "Aircall rejected the access: check api_id and api_token; the company may be inactive or not verified." }
    - { status: 404, code: not_found, retryable: false,
        message: "Aircall object not found: calls older than six months and contacts synced from integrations are not served." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Aircall rate limit reached (120 requests per minute per company): retry in a minute." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Aircall is temporarily unavailable: retry later." }

functions:
  - name: list_calls
    class: read
    description: >-
      List the calls of the Aircall company, bounded on their creation date:
      who called whom, when, how long, the line, the agent, tags and comments.
      Six months of history only, and at most 10,000 calls through pagination:
      narrow with date_from to reach further. Ascending by creation date unless
      order is desc. duration includes ringing; talk time is
      ended_at - answered_at. Times are UNIX seconds, UTC. meta.next_page_link
      is null on the last page. The audio of a call is never a link: get it as
      a file with get_call_recording or get_call_voicemail.
    input:
      type: object
      additionalProperties: false
      properties:
        date_from: &date_from
          type: integer
          minimum: 0
          description: "Lower bound on the creation date, UNIX seconds (UTC)."
        date_to: &date_to
          type: integer
          minimum: 0
          description: "Upper bound on the creation date, UNIX seconds (UTC)."
        order: &order
          type: string
          enum: [asc, desc]
          description: "Order by creation date; ascending when omitted."
        page: &page
          type: integer
          minimum: 1
          description: "Page number, from 1."
        per_page: &per_page
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        fetch_contact: &fetch_contact
          type: boolean
          description: "Add the contact details of each call."
    examples:
      - title: Latest calls since 1 September 2026
        input: { date_from: 1788220800, order: desc, per_page: 50 }
    call:
      method: GET
      path: /v1/calls
      query: { from: date_from, to: date_to, order: order, page: page, per_page: per_page,
               fetch_contact: fetch_contact }
    # The signed links to the audio of a call (one to three hours) and its secured page never reach the agent.
    output:
      strip: &calls_addresses [calls.recording, calls.recording_short_url, calls.voicemail,
                               calls.voicemail_short_url, calls.asset]
      sample: &calls_sample
        calls:
          - &sample_call
            id: 1
            direction: inbound
            duration: 42
            recording: "https://files.example.test/recordings/c-1.mp3"
            recording_short_url: "https://short.example.test/r/c-1"
            voicemail: "https://files.example.test/voicemails/c-1.mp3"
            voicemail_short_url: "https://short.example.test/v/c-1"
            asset: "https://assets.example.test/recording/c-1"
        meta: { count: 1, total: 1, current_page: 1, per_page: 20, next_page_link: null }
    cost: { per: request }

  - name: search_calls
    class: read
    description: >-
      Search the calls of the Aircall company by direction, agent (user_id) or
      external phone number, bounded on their creation date. A call transferred
      from line A to line B is found by B only. Same history and limits as
      list_calls; the audio of a call is never a link (get_call_recording,
      get_call_voicemail).
    input:
      type: object
      additionalProperties: false
      properties:
        direction:
          type: string
          enum: [inbound, outbound]
        user_id:
          type: integer
          minimum: 0
          description: "The agent who made or received the calls (see list_users)."
        phone_number:
          type: string
          minLength: 1
          description: "The external number of the calls, E.164."
        date_from: *date_from
        date_to: *date_to
        order: *order
        page: *page
        per_page: *per_page
        fetch_contact: *fetch_contact
    examples:
      - title: Inbound calls from one number
        input: { direction: inbound, phone_number: "+33100000000" }
      - title: Outbound calls of one agent
        input: { direction: outbound, user_id: 123456, order: desc }
    call:
      method: GET
      path: /v1/calls/search
      query: { direction: direction, user_id: user_id, phone_number: phone_number,
               from: date_from, to: date_to, order: order, page: page, per_page: per_page,
               fetch_contact: fetch_contact }
    output: { strip: *calls_addresses, sample: *calls_sample }
    cost: { per: request }

  - name: get_call
    class: read
    description: >-
      Get one Aircall call by its id: who called whom, when, how long, the
      line, the agent, tags and comments. The audio of the call is never a
      link: get it as a file with get_call_recording or get_call_voicemail.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: &call_id
          type: integer
          minimum: 0
        fetch_contact: *fetch_contact
    examples:
      - title: One call with its contact
        input: { call_id: 987654321, fetch_contact: true }
    refusals:
      - &call_not_found { code: call_not_found, when: 404,
          message: "No call with this id in the last six months of this Aircall company." }
    call:
      method: GET
      path: /v1/calls/{call_id}
      query: { fetch_contact: fetch_contact }
    output:
      strip: [call.recording, call.recording_short_url, call.voicemail, call.voicemail_short_url, call.asset]
      sample: { call: *sample_call }
    cost: { per: request }

  - name: get_call_recording
    class: read
    description: >-
      Get the audio recording of one Aircall call as a file of yours, kept 24
      hours: the answer gives its file id, to pass as is to a function that
      takes a file (a transcription). Never a link. Only calls on a line with
      live recording enabled have one; a call without it is refused as having
      no file.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: The recording of one call
        input: { call_id: 987654321 }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/v1/calls/{call_id}" }
    # call.recording is a link signed by its own query, valid one hour: downloaded at once, without the account's
    # authentication, never followed through a redirect (the short URL redirects, so it is not used).
    output:
      file:
        from: url
        path: call.recording
        auth: none
        types: &mp3 { mp3: [audio/mpeg, audio/mp3] }
        name: { template: "call-{call_id}-recording.mp3" }
        max_bytes: 52428800
    timeout_s: 120
    cost: { per: request }

  - name: get_call_voicemail
    class: read
    description: >-
      Get the voicemail a caller left on one inbound Aircall call as a file of
      yours, kept 24 hours: the answer gives its file id, to pass as is to a
      function that takes a file (a transcription). Never a link. A call
      without a voicemail is refused as having no file.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: The voicemail of one call
        input: { call_id: 987654321 }
    refusals:
      - *call_not_found
    call: { method: GET, path: "/v1/calls/{call_id}" }
    output:
      file:
        from: url
        path: call.voicemail
        auth: none
        types: *mp3
        name: { template: "call-{call_id}-voicemail.mp3" }
        max_bytes: 52428800
    timeout_s: 120
    cost: { per: request }

  - name: get_call_transcription
    class: read
    description: >-
      Get the transcription of one Aircall call: utterances in order, each with
      participant_type (internal = agent with user_id, external = caller with
      phone_number) and start/end offsets in seconds; content.language gives
      the language. Served only to companies on the Aircall AI package (AI
      Assist or AI Assist Pro); mode realtime needs AI Assist Pro.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
        mode:
          type: string
          enum: [async, realtime]
          description: "async: post-call transcription; realtime: the one shown to the agent during the call."
    examples:
      - title: Post-call transcription
        input: { call_id: 987654321, mode: async }
    refusals:
      - &no_intelligence { code: no_call_intelligence, when: 404,
          message: "No such content for this call: not analysed, or the company is not on the Aircall AI package." }
    call:
      method: GET
      path: /v1/calls/{call_id}/transcription
      query: { mode: mode }
    cost: { per: request }

  - name: get_call_summary
    class: read
    description: >-
      Get the AI summary of one Aircall call. Served only to companies on the
      Aircall AI package, for calls that were analysed.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Summary of a call
        input: { call_id: 987654321 }
    refusals:
      - *no_intelligence
    call: { method: GET, path: "/v1/calls/{call_id}/summary" }
    cost: { per: request }

  - name: get_call_topics
    class: read
    description: >-
      Get the key topics of one Aircall call, as a list of strings. Served only
      to companies on the Aircall AI package, for calls that were analysed.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Topics of a call
        input: { call_id: 987654321 }
    refusals:
      - *no_intelligence
    call: { method: GET, path: "/v1/calls/{call_id}/topics" }
    cost: { per: request }

  - name: get_call_sentiments
    class: read
    description: >-
      Get the sentiment (POSITIVE, NEUTRAL, NEGATIVE) of each participant of
      one Aircall call. Served only to companies on the Aircall AI package, for
      calls that were analysed.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Sentiments of a call
        input: { call_id: 987654321 }
    refusals:
      - *no_intelligence
    call: { method: GET, path: "/v1/calls/{call_id}/sentiments" }
    cost: { per: request }

  - name: get_call_action_items
    class: read
    description: >-
      Get the action items of one Aircall call; ai_generated false means
      written by an agent. Served only to companies on the Aircall AI package,
      for calls that were analysed.
    input:
      type: object
      additionalProperties: false
      required: [call_id]
      properties:
        call_id: *call_id
    examples:
      - title: Follow-ups of a call
        input: { call_id: 987654321 }
    refusals:
      - *no_intelligence
    call: { method: GET, path: "/v1/calls/{call_id}/action_items" }
    cost: { per: request }

  - name: list_users
    class: read
    description: >-
      List the users (agents) of the Aircall company, bounded on their creation
      date: id, name, email, availability, time zone, extension. The id is the
      user_id of search_calls.
    input:
      type: object
      additionalProperties: false
      properties:
        date_from: *date_from
        date_to: *date_to
        order: *order
        page: *page
        per_page: *per_page
    examples:
      - title: First page of users
        input: { per_page: 50 }
    call:
      method: GET
      path: /v2/users
      query: { from: date_from, to: date_to, order: order, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_user
    class: read
    description: >-
      Get one Aircall user by numeric id or by email address.
    input:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          type: string
          pattern: "^([0-9]+|[^@\\s/]+@[^@\\s/]+)$"
          description: "The user's numeric id or email address."
    examples:
      - title: A user by email
        input: { user: "agent@acme.example" }
      - title: A user by id
        input: { user: "123456" }
    refusals:
      - { code: user_not_found, when: 404, message: "No user with this id or email in this Aircall company." }
    call: { method: GET, path: "/v2/users/{user}" }
    cost: { per: request }

  - name: list_teams
    class: read
    description: >-
      List the Aircall teams (groups of users that route inbound calls), each
      with its users.
    input:
      type: object
      additionalProperties: false
      properties:
        order: *order
        page: *page
        per_page: *per_page
    examples:
      - title: All teams, first page
        input: { per_page: 50 }
    call:
      method: GET
      path: /v1/teams
      query: { order: order, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_team
    class: read
    description: >-
      Get one Aircall team with its users.
    input:
      type: object
      additionalProperties: false
      required: [team_id]
      properties:
        team_id: { type: integer, minimum: 0 }
    examples:
      - title: One team
        input: { team_id: 4242 }
    refusals:
      - { code: team_not_found, when: 404, message: "No team with this id in this Aircall company." }
    call: { method: GET, path: "/v1/teams/{team_id}" }
    cost: { per: request }

  - name: list_numbers
    class: read
    description: >-
      List the phone numbers (lines) of the Aircall company, bounded on their
      creation date: digits, name, country, time zone, live recording, and the
      users on the line.
    input:
      type: object
      additionalProperties: false
      properties:
        date_from: *date_from
        date_to: *date_to
        order: *order
        page: *page
        per_page: *per_page
    examples:
      - title: First page of lines
        input: { per_page: 50 }
    call:
      method: GET
      path: /v1/numbers
      query: { from: date_from, to: date_to, order: order, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_number
    class: read
    description: >-
      Get one Aircall phone number (line) with its users.
    input:
      type: object
      additionalProperties: false
      required: [number_id]
      properties:
        number_id: { type: integer, minimum: 0 }
    examples:
      - title: One line
        input: { number_id: 31415 }
    refusals:
      - { code: number_not_found, when: 404, message: "No phone number with this id in this Aircall company." }
    call: { method: GET, path: "/v1/numbers/{number_id}" }
    cost: { per: request }

  - name: list_contacts
    class: read
    description: >-
      List the shared contacts of the Aircall company: name, company, phone
      numbers, emails. Contacts synced from third-party integrations (CRM) are
      not served by the API. At most 10,000 contacts through pagination: narrow
      with date_from beyond that.
    input:
      type: object
      additionalProperties: false
      properties:
        date_from: *date_from
        date_to: *date_to
        order: *order
        order_by: &order_by
          type: string
          enum: [created_at, updated_at]
          description: "Sort field; created_at when omitted."
        page: *page
        per_page: *per_page
    examples:
      - title: Contacts by last update
        input: { order_by: updated_at, order: desc }
    call:
      method: GET
      path: /v1/contacts
      query: { from: date_from, to: date_to, order: order, order_by: order_by,
               page: page, per_page: per_page }
    cost: { per: request }

  - name: search_contacts
    class: read
    description: >-
      Search the shared contacts of the Aircall company by phone number and/or
      email. Contacts synced from third-party integrations are not served.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - required: [phone_number]
        - required: [email]
      properties:
        phone_number: { type: string, minLength: 1, description: "A phone number of the contact." }
        email: { type: string, minLength: 1, description: "An email address of the contact." }
        date_from: *date_from
        date_to: *date_to
        order: *order
        order_by: *order_by
        page: *page
        per_page: *per_page
    examples:
      - title: A contact by email
        input: { email: "jane.doe@acme.example" }
    call:
      method: GET
      path: /v1/contacts/search
      query: { phone_number: phone_number, email: email, from: date_from, to: date_to,
               order: order, order_by: order_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_contact
    class: read
    description: >-
      Get one shared Aircall contact by its id.
    input:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id: { type: integer, minimum: 0 }
    examples:
      - title: One contact
        input: { contact_id: 271828 }
    refusals:
      - { code: contact_not_found, when: 404, message: "No shared contact with this id in this Aircall company." }
    call: { method: GET, path: "/v1/contacts/{contact_id}" }
    cost: { per: request }

  - name: get_company
    class: read
    description: >-
      Get the Aircall company behind the API key: its name, number of users
      and number of phone numbers.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: The connected company
        input: {}
    call: { method: GET, path: /v1/company }
    cost: { per: request }

exposure:
  mode: per_connector
  tool: aircall
