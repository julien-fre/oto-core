# yaml-language-server: $schema=../connector.schema.json
# Google Drive API v3 reference: https://developers.google.com/workspace/drive/api/reference/rest/v3
# The Drive of one signed-in person (delegated access): My Drive, what is
# shared with them, and the shared drives they belong to. Every call sees
# exactly what that person sees.
# The access token comes from the person's consent (OAuth 2.0 authorization
# code), with the OAuth application of the host or of the organization.
# access_type=offline and prompt=consent bring a refresh token at each consent;
# Google does not rotate it. Incremental authorization (include_granted_scopes)
# is not asked for: a consent at level read never inherits a broader scope
# granted earlier to the same application.
# Two access levels: read (drive.readonly) and full (drive).
# Every call sets supportsAllDrives: without it, the items of shared drives are
# not found. fields is a constant: Drive returns only the fields it names.
# Out of this file: the content of a file (download and export answer with the
# file itself, not JSON) and the upload (multipart body).
connector:
  name: google_drive
  label: Google Drive
  namespace: google_drive
  version: 1.0.0
  api_version: v3
  base_url: https://www.googleapis.com/drive/v3
  auth:
    kind: oauth2_user
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_auth: body
    access_levels:
      read: { scopes: ["https://www.googleapis.com/auth/drive.readonly"] }
      full: { scopes: ["https://www.googleapis.com/auth/drive"] }
    scope_implies:
      "https://www.googleapis.com/auth/drive": ["https://www.googleapis.com/auth/drive.readonly"]
    authorize_params: { access_type: offline, prompt: select_account consent }
    pkce: S256
    refresh: refresh_token
    rotates: false
    expires_in_default: 3600
    identity: { function: get_about, path: user.emailAddress }
  modes: [byo_user]
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Google Drive rejected the request as invalid: check the arguments, and the syntax of a query." }
    - { status: 401, code: authorization_expired, retryable: false,
        message: "Google no longer accepts this authorization (expired or revoked): the person must sign in again." }
    - { status: 403, code: permission_missing, retryable: false,
        message: "Google refused the call: the signed-in person lacks access to this item, a scope is missing, or a per-user rate limit was hit; the reason in the response tells which." }
    - { status: 404, code: not_found, retryable: false,
        message: "Google Drive item not found, or not visible to the signed-in person: check the id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Google Drive is throttling these requests: retry after a delay." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Google Drive is temporarily unavailable: retry later." }

functions:
  - name: get_about
    class: read
    scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    description: >-
      Get the signed-in person (displayName, emailAddress, permissionId) and the
      storage quota of their Drive. Every other function acts on their behalf.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Who the token acts as
        input: {}
    call:
      method: GET
      path: /about
      constants:
        query: { fields: "user(displayName,emailAddress,permissionId),storageQuota" }
    cost: { per: request }

  - name: list_files
    class: read
    scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    description: >-
      List or search files and folders with a Drive query. Trashed items are
      included unless the query says trashed = false. Children of a folder:
      '<folder id>' in parents and trashed = false. By name: name contains
      'report'. Folders only: mimeType = 'application/vnd.google-apps.folder'.
      corpora user (default) covers My Drive and what is shared with the
      person; drive with drive_id, one shared drive; allDrives, everything.
    input:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: "Drive query language, e.g. '1AbCdEf' in parents and trashed = false."
        corpora:
          enum: [user, drive, allDrives]
          description: "Bodies of items searched: user (default), drive (needs drive_id) or allDrives."
        drive_id: &shared_drive_id
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Shared drive id, from list_shared_drives; with corpora drive."
        order_by:
          type: string
          pattern: "^[A-Za-z_]+( desc)?(,[A-Za-z_]+( desc)?)*$"
          description: "Sort keys, e.g. modifiedTime desc,name; folder, name, createdTime, modifiedTime, viewedByMeTime…"
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: "Maximum number of items in the page."
        page_token: &page_token
          type: string
          minLength: 1
          description: "nextPageToken of the previous page."
      if: { required: [drive_id] }
      then: { required: [corpora], properties: { corpora: { const: drive } } }
    examples:
      - title: Content of one folder
        input: { query: "'1AbCdEfGhIjKlMnOpQrStUvWxYz012345' in parents and trashed = false" }
      - title: Latest reports in one shared drive
        input: { query: "name contains 'report'", corpora: drive, drive_id: 0AbCdEfGhIjKlUk9PVA, order_by: modifiedTime desc }
    call:
      method: GET
      path: /files
      query: { q: query, corpora: corpora, driveId: drive_id, orderBy: order_by, pageSize: page_size, pageToken: page_token }
      constants:
        query:
          supportsAllDrives: true
          includeItemsFromAllDrives: true
          fields: "nextPageToken,incompleteSearch,files(id,name,mimeType,size,modifiedTime,parents,driveId,trashed,webViewLink)"
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: files
    cost: { per: page }

  - name: get_file
    class: read
    scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    description: >-
      Get the metadata of one file or folder by id: name, type, size, dates,
      owners, parent folder, shared drive, link, and whether it is trashed.
    input:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: &file_id
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "File or folder id, from list_files or a Drive link (the part after /d/ or folders/)."
    examples:
      - title: One file by id
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345 }
    refusals:
      - { code: file_not_found, when: 404, message: "No file with this id that the signed-in person can see." }
    call:
      method: GET
      path: "/files/{file_id}"
      constants:
        query:
          supportsAllDrives: true
          fields: "id,name,mimeType,size,createdTime,modifiedTime,owners(displayName,emailAddress),parents,driveId,trashed,webViewLink"
    cost: { per: request }

  - name: list_shared_drives
    class: read
    scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    description: >-
      List the shared drives the signed-in person belongs to. A shared drive id
      is the drive_id of list_files.
    input:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: "Shared drive query, e.g. name contains 'Finance'."
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
          description: "Maximum number of shared drives in the page."
        page_token: *page_token
    examples:
      - title: Every shared drive
        input: {}
    call:
      method: GET
      path: /drives
      query: { q: query, pageSize: page_size, pageToken: page_token }
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: drives
    cost: { per: page }

  - name: list_permissions
    class: read
    scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    description: >-
      List who has access to a file or folder: permission id, type (user,
      group, domain, anyone), role and email address. A permission id is what
      delete_permission takes.
    input:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: *file_id
        page_token: *page_token
    examples:
      - title: Access to one file
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345 }
    refusals:
      - { code: file_not_found, when: 404, message: "No file with this id that the signed-in person can see." }
    call:
      method: GET
      path: "/files/{file_id}/permissions"
      query: { pageToken: page_token }
      constants:
        query:
          supportsAllDrives: true
          fields: "nextPageToken,permissions(id,type,role,emailAddress,domain,displayName)"
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: permissions
    cost: { per: page }

  - name: create_folder
    class: write
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Create a folder, at the root of My Drive or inside a parent folder.
      Returns its id, name, parent and link.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: &file_name
          type: string
          minLength: 1
          maxLength: 255
          description: "Folder name."
        parent_ids:
          type: array
          minItems: 1
          maxItems: 1
          items: *file_id
          description: "The parent folder id, alone in the list; absent, the root of My Drive."
    examples:
      - title: A folder inside another
        input: { name: Contracts 2026, parent_ids: [1AbCdEfGhIjKlMnOpQrStUvWxYz012345] }
    refusals:
      - { code: parent_not_found, when: 404, message: "No parent folder with this id that the signed-in person can see." }
    call:
      method: POST
      path: /files
      body: { name: name, parents: parent_ids }
      constants:
        query: { supportsAllDrives: true, fields: "id,name,parents,webViewLink" }
        body: { mimeType: application/vnd.google-apps.folder }
    cost: { per: request }

  - name: rename_file
    class: write
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Rename a file or folder. Returns its id, new name and link.
    input:
      type: object
      additionalProperties: false
      required: [file_id, name]
      properties:
        file_id: *file_id
        name: *file_name
    examples:
      - title: Rename one file
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345, name: Signed contract.pdf }
    refusals:
      - { code: file_not_found, when: 404, message: "No file with this id that the signed-in person can see." }
    call:
      method: PATCH
      path: "/files/{file_id}"
      body: { name: name }
      constants:
        query: { supportsAllDrives: true, fields: "id,name,webViewLink" }
    cost: { per: request }

  - name: move_file
    class: write
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Move a file or folder from its parent folder to another: remove_parent_id
      is its current parent, from get_file. Returns its id, name and parents.
    input:
      type: object
      additionalProperties: false
      required: [file_id, add_parent_id, remove_parent_id]
      properties:
        file_id: *file_id
        add_parent_id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Destination folder id."
        remove_parent_id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Current parent folder id, the parents of get_file."
    examples:
      - title: Move one file to another folder
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345, add_parent_id: 1ZyXwVuTsRqPoNmLkJiHgFeDcBa543210, remove_parent_id: 1QwErTyUiOpAsDfGhJkLzXcVbNm678901 }
    refusals:
      - { code: file_not_found, when: 404, message: "No file or folder with this id that the signed-in person can see." }
    call:
      method: PATCH
      path: "/files/{file_id}"
      query: { addParents: add_parent_id, removeParents: remove_parent_id }
      constants:
        query: { supportsAllDrives: true, fields: "id,name,parents" }
    cost: { per: request }

  - name: trash_file
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Move a file or folder to the trash, for every person who has access.
      Google deletes it for good after 30 days; until then untrash_file brings
      it back. Only its owner, or a manager of its shared drive, can trash it.
    input:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: *file_id
    examples:
      - title: Trash one file
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345 }
    refusals:
      - { code: file_not_found, when: 404, message: "No file with this id that the signed-in person can see." }
    call:
      method: PATCH
      path: "/files/{file_id}"
      constants:
        query: { supportsAllDrives: true, fields: "id,name,trashed" }
        body: { trashed: true }
    cost: { per: request }
    confirm:
      summary: "Move file {file_id} to the trash, for everyone who has access."

  - name: untrash_file
    class: write
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Take a file or folder out of the trash, back to its folder.
    input:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: *file_id
    examples:
      - title: Restore one file
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345 }
    refusals:
      - { code: file_not_found, when: 404, message: "No file with this id that the signed-in person can see." }
    call:
      method: PATCH
      path: "/files/{file_id}"
      constants:
        query: { supportsAllDrives: true, fields: "id,name,trashed" }
        body: { trashed: false }
    cost: { per: request }

  - name: share_file
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Give one person access to a file or folder, by email address, as reader,
      commenter or writer. With notify true, Google emails them the link.
      Returns the permission id.
    input:
      type: object
      additionalProperties: false
      required: [file_id, email, role, notify]
      properties:
        file_id: *file_id
        email:
          type: string
          format: email
          description: "Email address of the person."
        role:
          enum: [reader, commenter, writer]
          description: "Access given."
        notify:
          type: boolean
          description: "Email the person a link to the item."
    examples:
      - title: Share one file read-only, without email
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345, email: jane.doe@acme.example, role: reader, notify: false }
    refusals:
      - { code: file_not_found, when: 404, message: "No file with this id that the signed-in person can see." }
    call:
      method: POST
      path: "/files/{file_id}/permissions"
      query: { sendNotificationEmail: notify }
      body: { emailAddress: email, role: role }
      constants:
        query: { supportsAllDrives: true, fields: "id,type,role,emailAddress" }
        body: { type: user }
    cost: { per: request }
    confirm:
      summary: "Give {email} {role} access to file {file_id} (email sent: {notify})."

  - name: delete_permission
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/drive"]
    description: >-
      Remove one access to a file or folder, by permission id from
      list_permissions. The owner's permission cannot be removed.
    input:
      type: object
      additionalProperties: false
      required: [file_id, permission_id]
      properties:
        file_id: *file_id
        permission_id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Permission id, from list_permissions."
    examples:
      - title: Remove one access
        input: { file_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz012345, permission_id: "01234567890123456789" }
    refusals:
      - { code: permission_not_found, when: 404, message: "No such file, or no permission with this id on it." }
    call:
      method: DELETE
      path: "/files/{file_id}/permissions/{permission_id}"
      constants:
        query: { supportsAllDrives: true }
    cost: { per: request }
    confirm:
      summary: "Remove permission {permission_id} from file {file_id}."

exposure:
  mode: per_connector
  tool: google_drive
