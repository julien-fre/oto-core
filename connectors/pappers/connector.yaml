# yaml-language-server: $schema=../connector.schema.json
# Pappers API v2 reference: https://www.pappers.fr/api/documentation
# (OpenAPI 3.1 served at https://www.pappers.fr/api_v2.yaml).
# French companies by SIREN or SIRET: search, full record (legal
# representatives, beneficial owners, collective proceedings, BODACC
# publications, accounts), and the search of legal representatives. Read only.
# The key goes in the api-key header: the reference accepts it in the api_token
# query parameter too, and advises against it. Credit costs quoted here are
# those of the reference (v2.20.0, champs_supplementaires of /entreprise); it
# states no base cost of a record or of a search.
#
# Not described here: documents (Kbis extract, by-laws, beneficial owners
# declaration, financial reports), which come back as PDF, not JSON.
connector:
  name: pappers
  label: Pappers
  namespace: pappers
  version: 1.0.0
  api_version: v2
  base_url: https://api.pappers.fr/v2
  auth:
    kind: api_key
    in: header
    name: api-key
    key: api_key
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_org]
  timeout_s: 60
  query_arrays: comma
  probe: { function: get_credit_usage }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Pappers rejected the request as invalid: check the arguments (SIREN 9 digits, SIRET 14 digits, dates DD-MM-YYYY)." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Pappers rejected the API key: unknown or revoked." }
    - { status: 403, code: plan_exceeded, retryable: false,
        message: "Pappers refused the call: the plan's credits are spent, or the key lacks the right this call needs." }
    - { status: 404, code: not_found, retryable: false,
        message: "Pappers found nothing for these criteria." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Pappers rate limit reached: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Pappers is temporarily unavailable: retry later." }

functions:
  - name: search_companies
    class: read
    description: >-
      Search French companies by name and criteria: {total, page,
      curseurSuivant, resultats: [{siren, nom_entreprise, denomination,
      forme_juridique, code_naf, libelle_code_naf, date_creation,
      entreprise_cessee, statut_rcs, siege: {siret, adresse_ligne_1,
      code_postal, ville}, capital, effectif, chiffre_affaires, resultat}]}.
      The siren of a result is what get_company takes. Every criterion is
      optional; dates are DD-MM-YYYY. Page-based browsing stops at the first
      400 results: to go further, pass curseur "*" then each curseurSuivant
      returned. A 404 means no company matches.
    input:
      type: object
      additionalProperties: false
      properties:
        q: &q { type: string, minLength: 1, description: "Text searched: company name, or first and last name for a sole trader." }
        precision: &precision { enum: [approximative, standard, exacte], description: "Matching precision of q; standard upstream by default." }
        code_naf: { type: array, minItems: 1, items: { type: string, pattern: "^[^,]+$" }, description: "NAF codes, e.g. 69.10Z." }
        departement:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9AB]{2,3}$" }
          description: "Departments of one of the company's establishments, e.g. 75, 2A, 974."
        code_postal:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{5}$" }
          description: "Postal codes of one of the company's establishments."
        siege: { type: boolean, description: "When true, the location criteria apply to the head office only." }
        categorie_juridique: { type: string, pattern: "^[0-9]{4}$", description: "Insee legal category code, e.g. 5710 (SAS); SASU is 5720, EURL 5498." }
        entreprise_cessee: { type: boolean, description: "true: ceased companies only; false: active ones only." }
        statut_rcs: { enum: [inscrit, radie, non inscrit], description: "Status in the trade and companies register." }
        nom_dirigeant: &nom_dirigeant { type: string, minLength: 1, description: "Last name of one of the legal representatives." }
        prenom_dirigeant: &prenom_dirigeant { type: string, minLength: 1, description: "First name of one of the legal representatives." }
        date_creation_min: &date { type: string, pattern: "^[0-9]{2}-[0-9]{2}-[0-9]{4}$", description: "DD-MM-YYYY." }
        date_creation_max: *date
        page: &page { type: integer, minimum: 1, description: "Page number, from 1 (first 400 results only)." }
        per_page: &per_page { type: integer, minimum: 1, maximum: 100, default: 10, description: "Results per page." }
        curseur: { type: string, minLength: 1, description: "\"*\" for the first call, then the curseurSuivant of the last answer. Replaces page." }
        per_cursor: { type: integer, minimum: 1, maximum: 1000, description: "Results per cursor call; 50 upstream by default." }
    examples:
      - title: Real estate agencies in Lyon
        input: { q: immobilier, code_postal: ["69001", "69002"], entreprise_cessee: false, per_page: 5 }
      - title: Every active company of one NAF code in a department, by cursor
        input: { code_naf: ["68.31Z"], departement: ["33"], entreprise_cessee: false, curseur: "*", per_cursor: 50 }
    refusals:
      - &no_company { code: no_company_found, when: 404, message: "No French company matches these criteria." }
    call:
      method: GET
      path: /recherche
      query:
        q: q
        precision: precision
        code_naf: code_naf
        departement: departement
        code_postal: code_postal
        siege: siege
        categorie_juridique: categorie_juridique
        entreprise_cessee: entreprise_cessee
        statut_rcs: statut_rcs
        nom_dirigeant: nom_dirigeant
        prenom_dirigeant: prenom_dirigeant
        date_creation_min: date_creation_min
        date_creation_max: date_creation_max
        page: page
        par_page: per_page
        curseur: curseur
        par_curseur: per_cursor
    pagination: { kind: cursor, request_param: curseur, next: curseurSuivant, total: total, max_pages: 5 }
    output: { items: resultats }

  - name: get_company
    class: read
    description: >-
      Get the full record of one French company by SIREN (with all its
      establishments in etablissements) or by SIRET (that establishment only,
      in etablissement). It holds identity and legal form, capital, NAF code,
      register status, head office, representants (legal representatives:
      qualites, nom, prenom, date_de_naissance_formate, nationalite, or
      denomination and siren for a legal person), beneficiaires_effectifs
      (beneficial owners and their share and vote percentages, when the key
      is entitled to them), procedure_collective_existe,
      procedure_collective_en_cours and procedures_collectives ([{type,
      date_debut, date_fin, publications_bodacc}]), publications_bodacc,
      depots_actes, comptes and finances. diffusable false means the company
      restricts its Insee data: names and address may be null. A 206 answer
      is partial: one source did not answer in time. Some extra_fields cost
      extra credits, listed in their description.
    input:
      type: object
      additionalProperties: false
      properties:
        siren: &siren { type: string, pattern: "^[0-9]{9}$", description: "SIREN, 9 digits without spaces." }
        siret: { type: string, pattern: "^[0-9]{14}$", description: "SIRET, 14 digits without spaces." }
        extra_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [representants_legaux, nom_personne_physique, categorie_entreprise, motif_cessation, micro_entreprise,
                   code_departement, departement, code_region, region, code_commune, enseigne_1, enseigne_2, enseigne_3,
                   nomenclature_code_naf, lien_pappers, labels, sites_internet, entreprises_dirigees, observations, deces,
                   sanctions, personne_politiquement_exposee, actif_net_inferieur_moitie_capital, decisions]
          description: >-
            Extra fields of the record. Free: representants_legaux,
            nom_personne_physique, categorie_entreprise, motif_cessation,
            micro_entreprise, code_departement, departement, code_region,
            region, code_commune, enseigne_1 to 3, nomenclature_code_naf,
            lien_pappers, labels. Extra credits, per the Pappers API
            reference (champs_supplementaires): sites_internet 1 and
            entreprises_dirigees 1 when available, observations 0.5, deces
            0.5, sanctions 1, personne_politiquement_exposee 1,
            actif_net_inferieur_moitie_capital 1, decisions 5 when available
            (0.5 otherwise).
        format_publications_bodacc: { enum: [objet, texte], description: "BODACC publications as structured objects (default) or as text." }
        allow_missing_insee: { type: boolean, description: "When true, also returns the rare companies unknown to Insee (otherwise a 404); categorie_juridique and siege may then be null." }
      oneOf:
        - { required: [siren] }
        - { required: [siret] }
    examples:
      - title: One company with its representatives, beneficial owners and proceedings
        input: { siren: "123456789" }
      - title: One establishment, with the department and the representatives' entity
        input: { siret: "12345678900012", extra_fields: [departement, representants_legaux] }
    refusals:
      - { code: company_not_found, when: 404, message: "No French company with this SIREN or SIRET." }
    call:
      method: GET
      path: /entreprise
      query:
        siren: siren
        siret: siret
        champs_supplementaires: extra_fields
        format_publications_bodacc: format_publications_bodacc
        autoriser_absence_insee: allow_missing_insee

  - name: search_representatives
    class: read
    description: >-
      Search the legal representatives of French companies (directors,
      managers, chairpersons, statutory auditors, natural or legal persons):
      {total, page, resultats: [{nom_complet, nom, prenom, qualites,
      date_de_naissance_formate, age, nationalite, personne_morale,
      denomination, siren, actuel, date_prise_de_poste, date_depart_de_poste,
      nb_entreprises_total, entreprises: [{siren, nom_entreprise, ...}]}]}.
      Find everyone who runs a company (siren), or every company one person
      runs (q, or nom_dirigeant with prenom_dirigeant, narrowed by birth date).
      Dates are DD-MM-YYYY. A 404 means nobody matches.
    input:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, minLength: 1, description: "First and last name of a natural person, or name of a legal person." }
        precision: *precision
        siren: { type: string, pattern: "^[0-9]{9}$", description: "Only the representatives of this company." }
        type_dirigeant: { enum: [physique, morale], description: "Natural (physique) or legal (morale) person." }
        qualite_dirigeant: { type: string, minLength: 1, description: "Role, e.g. Gérant, Président, Directeur général." }
        nom_dirigeant: *nom_dirigeant
        prenom_dirigeant: *prenom_dirigeant
        date_de_naissance_dirigeant_min: *date
        date_de_naissance_dirigeant_max: *date
        departement:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9AB]{2,3}$" }
          description: "Departments of one of the companies' establishments."
        code_postal:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{5}$" }
          description: "Postal codes of one of the companies' establishments."
        entreprise_cessee: { type: boolean, description: "true: ceased companies only; false: active ones only." }
        page: { type: integer, minimum: 1, description: "Page number, from 1." }
        per_page: *per_page
    examples:
      - title: The companies run by one person born in 1968
        input: { nom_dirigeant: Martin, prenom_dirigeant: Claire, date_de_naissance_dirigeant_min: "01-01-1968", date_de_naissance_dirigeant_max: "31-12-1968" }
      - title: The representatives of one company
        input: { siren: "123456789" }
    refusals:
      - { code: no_representative_found, when: 404, message: "No legal representative matches these criteria." }
    call:
      method: GET
      path: /recherche-dirigeants
      query:
        q: q
        precision: precision
        siren: siren
        type_dirigeant: type_dirigeant
        qualite_dirigeant: qualite_dirigeant
        nom_dirigeant: nom_dirigeant
        prenom_dirigeant: prenom_dirigeant
        date_de_naissance_dirigeant_min: date_de_naissance_dirigeant_min
        date_de_naissance_dirigeant_max: date_de_naissance_dirigeant_max
        departement: departement
        code_postal: code_postal
        entreprise_cessee: entreprise_cessee
        page: page
        par_page: per_page
    output: { items: resultats }

  - name: get_credit_usage
    class: read
    description: >-
      Get the credit usage of this Pappers key: jetons_abonnement (monthly
      credits of the plan), jetons_abonnement_utilises (used this month),
      jetons_pay_as_you_go_restants (prepaid credits left). Read it before a
      large search.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Credits left
        input: {}
    call: { method: GET, path: /suivi-jetons }

exposure:
  mode: per_connector
  tool: pappers
