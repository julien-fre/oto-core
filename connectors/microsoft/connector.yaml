# yaml-language-server: $schema=../connector.schema.json
# Microsoft Graph v1.0 reference: https://learn.microsoft.com/graph/api/overview
# Files surface only (SharePoint sites, document libraries, OneDrive items), on
# behalf of one signed-in person (delegated access): every call sees exactly what
# that person sees in Microsoft 365.
# The access token comes from the person's consent (OAuth 2.0 authorization
# code, delegated scopes), with the OAuth application of the host or of the
# organization; work and school accounts only (organizations endpoint). Entra
# rotates the refresh token: each refresh returns the one to keep.
# Two access levels: read (Files.Read.All, Sites.Read.All) and full
# (Files.ReadWrite.All, Sites.ReadWrite.All, which cover the read scopes).
# Every function below reads: both levels serve them all.
connector:
  name: microsoft
  label: Microsoft 365 (SharePoint, OneDrive)
  namespace: microsoft
  version: 3.1.0
  api_version: v1.0
  base_url: https://graph.microsoft.com/v1.0
  auth:
    kind: oauth2_user
    authorize_url: https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
    client_auth: body
    access_levels:
      read:
        scopes: [offline_access, User.Read, "https://graph.microsoft.com/Files.Read.All", "https://graph.microsoft.com/Sites.Read.All"]
      full:
        scopes: [offline_access, User.Read, "https://graph.microsoft.com/Files.ReadWrite.All", "https://graph.microsoft.com/Sites.ReadWrite.All"]
    scope_implies:
      "https://graph.microsoft.com/Files.ReadWrite.All": ["https://graph.microsoft.com/Files.Read.All"]
      "https://graph.microsoft.com/Sites.ReadWrite.All": ["https://graph.microsoft.com/Sites.Read.All"]
    authorize_params: { prompt: select_account, response_mode: query }
    refresh: refresh_token
    rotates: true
    expires_in_default: 3600
    identity: { function: get_me, path: userPrincipalName }
  modes: [byo_user]
  timeout_s: 120
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Microsoft Graph rejected the request as invalid: check the arguments." }
    - { status: 401, code: authorization_expired, retryable: false,
        message: "Microsoft no longer accepts this authorization (expired or revoked): the person must sign in again." }
    - { status: 403, code: permission_missing, retryable: false,
        message: "The signed-in person has no access to this resource, or a delegated scope is missing. It does not mean the resource is absent." }
    - { status: 404, code: not_found, retryable: false,
        message: "Microsoft Graph object not found: check the id or path." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Microsoft Graph is throttling these requests: retry after the delay it gives." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Microsoft Graph is temporarily unavailable: retry later." }

functions:
  - name: search_sites
    class: read
    scopes: ["https://graph.microsoft.com/Sites.Read.All"]
    description: >-
      Search the SharePoint sites whose name or description matches a query.
      Only the sites the signed-in person can open are returned.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, description: "Words to look for." }
        limit: &limit
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: "Maximum number of results in the page."
    examples:
      - title: Sites about marketing
        input: { query: marketing }
    call:
      method: GET
      path: /sites
      query: { search: query, $top: limit }
    output:
      items: value
    cost: { per: request }

  - name: get_site
    class: read
    scopes: ["https://graph.microsoft.com/Sites.Read.All"]
    description: >-
      Get one SharePoint site by its composite id
      ({hostname},{site-collection-id},{web-id}), as returned by search_sites.
    input:
      type: object
      additionalProperties: false
      required: [site_id]
      properties:
        site_id: &site_id
          type: string
          pattern: "^[^\\s/?#]+$"
          description: "Composite site id: {hostname},{site-collection-id},{web-id}."
    examples:
      - title: One site by id
        input:
          site_id: "acme.sharepoint.com,0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0,1a2b3c4d-5e6f-7081-92a3-b4c5d6e7f809"
    refusals:
      - { code: site_not_found, when: 404, message: "No SharePoint site with this id that the signed-in person can open." }
    call: { method: GET, path: "/sites/{site_id}" }
    cost: { per: request }

  - name: get_site_by_path
    class: read
    scopes: ["https://graph.microsoft.com/Sites.Read.All"]
    description: >-
      Get one SharePoint site by the host name and server-relative path read
      in its URL: https://acme.sharepoint.com/sites/Marketing gives hostname
      acme.sharepoint.com and site_path sites/Marketing.
    input:
      type: object
      additionalProperties: false
      required: [hostname, site_path]
      properties:
        hostname:
          type: string
          pattern: "^[A-Za-z0-9.-]+$"
          description: "SharePoint host name, e.g. acme.sharepoint.com."
        site_path:
          type: string
          pattern: "^[^/?#:]([^?#:]*[^/?#:])?$"
          description: "Site path without leading or trailing slash, e.g. sites/Marketing. Its slashes are kept."
    examples:
      - title: The marketing site of Acme
        input: { hostname: acme.sharepoint.com, site_path: sites/Marketing }
    refusals:
      - { code: site_not_found, when: 404, message: "No SharePoint site at this path that the signed-in person can open." }
    call: { method: GET, path: "/sites/{hostname}:/{site_path}" }
    cost: { per: request }

  - name: list_site_drives
    class: read
    scopes: ["https://graph.microsoft.com/Sites.Read.All"]
    description: >-
      List the document libraries of a SharePoint site. A library is a drive:
      its id is the drive_id of the item functions.
    input:
      type: object
      additionalProperties: false
      required: [site_id]
      properties:
        site_id: *site_id
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
          description: "Maximum number of libraries in the page."
    examples:
      - title: Libraries of one site
        input:
          site_id: "acme.sharepoint.com,0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0,1a2b3c4d-5e6f-7081-92a3-b4c5d6e7f809"
    call:
      method: GET
      path: /sites/{site_id}/drives
      query: { $top: limit }
    output:
      items: value
    cost: { per: request }

  - name: get_me
    class: read
    scopes: [User.Read]
    description: >-
      Get the signed-in person: id, displayName, mail and userPrincipalName.
      Every other function acts on their behalf and sees what they see.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Who the token acts as
        input: {}
    call: { method: GET, path: /me }
    cost: { per: request }

  - name: get_my_drive
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      Get the OneDrive of the signed-in person. Its id is the drive_id of the
      item functions.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: My OneDrive
        input: {}
    call: { method: GET, path: /me/drive }
    cost: { per: request }

  - name: get_user_drive
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      Get the OneDrive of a colleague, by user id or userPrincipalName (usually
      the work email), if they shared it with the signed-in person. Its id is
      the drive_id of the item functions.
    input:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          type: string
          pattern: "^[^\\s/?#]+$"
          description: "User id or userPrincipalName, e.g. jane.doe@acme.example."
    examples:
      - title: The OneDrive of one person
        input: { user: jane.doe@acme.example }
    refusals:
      - { code: drive_not_found, when: 404, message: "No such user, or this user has no OneDrive." }
    call: { method: GET, path: "/users/{user}/drive" }
    cost: { per: request }

  - name: get_item
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      Get the metadata of one file or folder of a drive by its item id.
    input:
      type: object
      additionalProperties: false
      required: [drive_id, item_id]
      properties:
        drive_id: &drive_id
          type: string
          pattern: "^[^\\s/?#]+$"
          description: "Drive id, from list_site_drives, get_my_drive or get_user_drive."
        item_id: &item_id
          type: string
          pattern: "^[^\\s/?#]+$"
          description: "Item id, as returned by the other item functions."
    examples:
      - title: One file by id
        input: { drive_id: b!AcmeDrive0001, item_id: 01ACMEITEM0000000000000000000001 }
    refusals:
      - { code: item_not_found, when: 404, message: "No item with this id in this drive." }
    call: { method: GET, path: "/drives/{drive_id}/items/{item_id}" }
    cost: { per: request }

  - name: get_item_by_path
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      Get the metadata of one file or folder of a drive by its path from the
      drive root, e.g. Contracts/2026/nda.docx.
    input:
      type: object
      additionalProperties: false
      required: [drive_id, path]
      properties:
        drive_id: *drive_id
        path: &item_path
          type: string
          pattern: "^[^/?#:]([^?#:]*[^/?#:])?$"
          description: "Path from the drive root, without leading or trailing slash. Its slashes are kept."
    examples:
      - title: One contract by path
        input: { drive_id: b!AcmeDrive0001, path: Contracts/2026/nda.docx }
    refusals:
      - { code: item_not_found, when: 404, message: "No item at this path in this drive." }
    call: { method: GET, path: "/drives/{drive_id}/root:/{path}:" }
    cost: { per: request }

  - name: list_root_children
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      List the files and folders at the root of a drive.
    input:
      type: object
      additionalProperties: false
      required: [drive_id]
      properties:
        drive_id: *drive_id
        limit: &children_limit
          type: integer
          minimum: 1
          maximum: 200
          default: 200
          description: "Maximum number of items in the page."
    examples:
      - title: Root of a library
        input: { drive_id: b!AcmeDrive0001 }
    call:
      method: GET
      path: /drives/{drive_id}/root/children
      query: { $top: limit }
    output:
      items: value
    cost: { per: request }

  - name: list_children
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      List the files and folders inside one folder of a drive, by the folder's
      item id.
    input:
      type: object
      additionalProperties: false
      required: [drive_id, item_id]
      properties:
        drive_id: *drive_id
        item_id: *item_id
        limit: *children_limit
    examples:
      - title: Content of one folder by id
        input: { drive_id: b!AcmeDrive0001, item_id: 01ACMEFOLDER00000000000000000001, limit: 50 }
    refusals:
      - { code: folder_not_found, when: 404, message: "No folder with this id in this drive." }
    call:
      method: GET
      path: /drives/{drive_id}/items/{item_id}/children
      query: { $top: limit }
    output:
      items: value
    cost: { per: request }

  - name: list_children_by_path
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      List the files and folders inside one folder of a drive, by the folder's
      path from the drive root, e.g. Contracts/2026.
    input:
      type: object
      additionalProperties: false
      required: [drive_id, path]
      properties:
        drive_id: *drive_id
        path: *item_path
        limit: *children_limit
    examples:
      - title: Content of one folder by path
        input: { drive_id: b!AcmeDrive0001, path: Contracts/2026 }
    refusals:
      - { code: folder_not_found, when: 404, message: "No folder at this path in this drive." }
    call:
      method: GET
      path: /drives/{drive_id}/root:/{path}:/children
      query: { $top: limit }
    output:
      items: value
    cost: { per: request }

  - name: search_items
    class: read
    scopes: ["https://graph.microsoft.com/Files.Read.All"]
    description: >-
      Search the files of a whole drive by name, metadata and content. Results
      come from the SharePoint index, not a live scan: a file added seconds ago
      may not show yet. The query cannot contain an apostrophe.
    input:
      type: object
      additionalProperties: false
      required: [drive_id, query]
      properties:
        drive_id: *drive_id
        query:
          type: string
          minLength: 1
          pattern: "^[^'/?#]+$"
          description: "Words to look for, without apostrophe."
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: "Maximum number of results in the page."
    examples:
      - title: Files about a supplier contract
        input: { drive_id: b!AcmeDrive0001, query: supplier contract }
    call:
      method: GET
      path: /drives/{drive_id}/root/search(q='{query}')
      query: { $top: limit }
    output:
      items: value
    cost: { per: request }

exposure:
  mode: per_connector
  tool: microsoft
