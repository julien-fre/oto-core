# yaml-language-server: $schema=../connector.schema.json
# Mailpool API v1 reference: https://api.mailpool.ai
#
# Not described here: update_domain_dns (its body is an array of records, which
# this format cannot declare). It REPLACES the whole record set of a domain.
#
# Mailbox payloads carry the mailbox, IMAP/SMTP and admin passwords and the
# admin secret; the Python client removes them (strip_secrets) and every
# function returning a mailbox strips them below, with a closed output schema. Billed endpoints (domain
# registration, transfer, renewal, mailbox creation, subscription slots,
# warmup enrolment, inbox placement) are deliberately absent.
connector:
  name: mailpool
  label: Mailpool
  namespace: mailpool
  version: 1.0.1
  api_version: v1
  base_url: https://app.mailpool.io/v1/api
  auth:
    kind: api_key
    in: header
    name: X-Api-Authorization
    key: api_key
  credential:
    - { name: api_key, label: Workspace API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 40
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Mailpool rejected the request as invalid: check the arguments (list calls need limit and offset)." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Mailpool rejected the API key: check the workspace key." }
    - { status: 403, code: not_enabled, retryable: false,
        message: "Mailpool refused the operation: this feature is not enabled for the workspace." }
    - { status: 404, code: not_found, retryable: false,
        message: "Mailpool object not found in this workspace." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Mailpool rate limit reached: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Mailpool is temporarily unavailable: retry later." }

functions:
  # --- domains ---------------------------------------------------------------
  - name: list_domains
    class: read
    description: >-
      List the workspace's domains with their type (google, outlook, shared,
      private), status, expiry, owner and redirect URL. Mailpool requires limit
      and offset on every list.
    input:
      type: object
      additionalProperties: false
      required: [limit, offset]
      properties:
        limit: &limit { type: integer, minimum: 1, maximum: 100, description: "Page size." }
        offset: &offset { type: integer, minimum: 0, description: "Number of items to skip." }
    examples:
      - title: First page of domains
        input: { limit: 50, offset: 0 }
    call: { method: GET, path: /domains/, query: { limit: limit, offset: offset } }
    output:
      items: data
      schema: &domain_out
        type: object
        additionalProperties: false
        properties:
          id: { type: integer }
          createdAt: { type: string, format: date-time }
          expireAt: { type: string, format: date-time }
          domain: { type: string }
          domainOwner: { type: object, description: "Registrant contact." }
          redirectUrl: { type: [string, "null"] }
          type: { enum: [google, shared, private, outlook, unassigned] }
          status: { enum: [active, pending, inactive] }
          nameservers: { type: [array, "null"], items: { type: string } }
          error: { type: [object, "null"] }
    cost: { per: request }

  - name: get_domain
    class: read
    description: >-
      Get one domain by its id: type, status, expiry, owner, redirect URL.
    input:
      type: object
      additionalProperties: false
      required: [domain_id]
      properties:
        domain_id: &domain_id { type: integer, minimum: 1, description: "Mailpool domain id." }
    examples:
      - title: One domain
        input: { domain_id: 1201 }
    call: { method: GET, path: "/domains/{domain_id}" }
    output: { schema: *domain_out }
    cost: { per: request }

  - name: get_domain_dns
    class: read
    description: >-
      Get the DNS records Mailpool holds for a domain, as {type, key, value,
      priority}; key is the host label, null for the apex. This is the stored
      configuration, not a live lookup. The _dmarc record is published from the
      domain's DMARC settings (set_dmarc_email, set_dmarc_policy).
    input:
      type: object
      additionalProperties: false
      required: [domain_id]
      properties:
        domain_id: *domain_id
    examples:
      - title: DNS records of one domain
        input: { domain_id: 1201 }
    call: { method: GET, path: "/domains/{domain_id}/dns" }
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          type: { enum: [A, AAAA, CNAME, MX, TXT, SRV] }
          key: { type: [string, "null"], description: "Host label, null for the apex." }
          value: { type: string }
          priority: { type: integer }
          port: { type: integer }
          weight: { type: integer }
    cost: { per: request }

  - name: set_dmarc_email
    class: write
    description: >-
      Set the address that receives a domain's DMARC reports. It is written as
      both rua and ruf, and the stored _dmarc record is published with it.
    input:
      type: object
      additionalProperties: false
      required: [domain_id, email]
      properties:
        domain_id: *domain_id
        email: { type: string, format: email, description: "Report address." }
    examples:
      - title: Send DMARC reports to one address
        input: { domain_id: 1201, email: "dmarc@example.com" }
    call: { method: POST, path: "/domains/{domain_id}/dmarc-email", body: { email: email } }
    output: { schema: *domain_out }
    cost: { per: request }

  - name: set_dmarc_policy
    class: write
    description: >-
      Set a domain's DMARC policy: none, quarantine or reject.
    input:
      type: object
      additionalProperties: false
      required: [domain_id, policy]
      properties:
        domain_id: *domain_id
        policy: { enum: [none, quarantine, reject] }
    examples:
      - title: Quarantine failing mail
        input: { domain_id: 1201, policy: quarantine }
    call: { method: POST, path: "/domains/{domain_id}/dmarc-policy", body: { policy: policy } }
    output: { schema: *domain_out }
    cost: { per: request }

  - name: set_redirect_url
    class: write
    description: >-
      Set where a web visit to the domain is redirected.
    input:
      type: object
      additionalProperties: false
      required: [domain_id, url]
      properties:
        domain_id: *domain_id
        url: { type: string, minLength: 1, description: "Target URL or host." }
    examples:
      - title: Redirect to the main site
        input: { domain_id: 1201, url: "example.com" }
    call: { method: POST, path: "/domains/{domain_id}/redirect-url", body: { url: url } }
    output: { schema: *domain_out }
    cost: { per: request }

  - name: get_domain_info
    class: read
    description: >-
      Tell whether a domain can be registered through Mailpool, and its price.
      Nothing is bought.
    input:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: &domain { type: string, minLength: 3, description: "Domain name, such as example.com." }
    examples:
      - title: Availability of one name
        input: { domain: "example-outreach.com" }
    call: { method: GET, path: /domains/info, query: { domain: domain } }
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          available: { type: boolean }
          price: { type: number }
    cost: { per: request }

  - name: get_domain_suggestions
    class: read
    description: >-
      Suggest available domain names close to a name, with their price.
      Nothing is bought.
    input:
      type: object
      additionalProperties: false
      required: [domain, limit, offset]
      properties:
        domain: { type: string, minLength: 1, description: "Name to start from." }
        limit: *limit
        offset: *offset
    examples:
      - title: Five variants of a brand
        input: { domain: "example", limit: 5, offset: 0 }
    call: { method: GET, path: /domains/suggestions, query: { domain: domain, limit: limit, offset: offset } }
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          domain: { type: string }
          available: { type: boolean }
          price: { type: number }
    cost: { per: request }

  - name: check_google_workspace_availability
    class: read
    description: >-
      Tell whether a domain is already used by a Google Workspace account. Must
      be enabled for the workspace, otherwise 403.
    input:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: *domain
    examples:
      - title: Google Workspace check
        input: { domain: "example-outreach.com" }
    call: { method: POST, path: /domains/google-workspace-availability, body: { domain: domain } }
    output: { schema: &availability_out { type: object, additionalProperties: false, properties: { isAvailable: { type: boolean } } } }
    cost: { per: request }

  - name: check_microsoft_365_availability
    class: read
    description: >-
      Tell whether a domain is already used by a Microsoft 365 tenant. Must be
      enabled for the workspace, otherwise 403.
    input:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: *domain
    examples:
      - title: Microsoft 365 check
        input: { domain: "example-outreach.com" }
    call: { method: POST, path: /domains/microsoft-365-availability, body: { domain: domain } }
    output: { schema: *availability_out }
    cost: { per: request }

  - name: list_domain_owners
    class: read
    description: >-
      List the saved registrant contacts used when registering domains.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Saved owners
        input: {}
    call: { method: GET, path: /domains/owners }
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          id: { type: [integer, string] }
          company: { type: string }
          firstName: { type: string }
          lastName: { type: string }
          email: { type: string }
          streetAddress1: { type: string }
          streetAddress2: { type: string }
          city: { type: string }
          state: { type: string }
          postalCode: { type: string }
          country: { type: string }
          phone: { type: [string, "null"] }
          gtldVerified: { type: [boolean, "null"] }
    cost: { per: request }

  # --- mailboxes -------------------------------------------------------------
  - name: list_mailboxes
    class: read
    description: >-
      List the workspace's mailboxes: address, name, type (google, outlook,
      shared, private), status, domain and IMAP/SMTP hosts. Credentials are
      never returned.
    input:
      type: object
      additionalProperties: false
      required: [limit, offset]
      properties:
        limit: *limit
        offset: *offset
        domain_id: *domain_id
    examples:
      - title: Mailboxes of one domain
        input: { limit: 50, offset: 0, domain_id: 1201 }
    call: { method: GET, path: /mailboxes, query: { limit: limit, offset: offset, domainId: domain_id } }
    output:
      items: data
      strip: &secrets [password, imapPassword, smtpPassword, secret, authCode, admin]
      schema: &mailbox_out
        type: object
        additionalProperties: false
        properties:
          id: { type: integer }
          email: { type: string }
          firstName: { type: string }
          lastName: { type: string }
          signature: { type: string }
          forwardTo: { type: string }
          status: { enum: [active, pending, inactive] }
          avatar: { type: string }
          type: { enum: [google, shared, private, outlook] }
          isAdmin: { type: boolean }
          domain: *domain_out
          imapHost: { type: string }
          imapPort: { type: integer }
          imapTLS: { type: boolean }
          imapUsername: { type: string }
          smtpHost: { type: string }
          smtpPort: { type: integer }
          smtpTLS: { type: boolean }
          smtpUsername: { type: string }
          scheduledDeletionAt: { type: [string, "null"] }
          error: { type: [object, "null"] }
    cost: { per: request }

  - name: get_mailbox
    class: read
    description: >-
      Get one mailbox by its id. Credentials are never returned.
    input:
      type: object
      additionalProperties: false
      required: [mailbox_id]
      properties:
        mailbox_id: &mailbox_id { type: integer, minimum: 1, description: "Mailpool mailbox id." }
    examples:
      - title: One mailbox
        input: { mailbox_id: 5301 }
    call: { method: GET, path: "/mailboxes/{mailbox_id}" }
    output: { strip: *secrets, schema: *mailbox_out }
    cost: { per: request }

  # --- spam checks -----------------------------------------------------------
  - name: list_spam_checks
    class: read
    description: >-
      List past spam checks with their state and results (SPF, DKIM, DMARC,
      blacklists, SpamAssassin, score).
    input:
      type: object
      additionalProperties: false
      required: [limit, offset]
      properties:
        limit: *limit
        offset: *offset
    examples:
      - title: Recent spam checks
        input: { limit: 20, offset: 0 }
    call: { method: GET, path: /spam-checks/, query: { limit: limit, offset: offset } }
    output:
      items: data
      strip: [mailbox]
      schema: &spam_check_out
        type: object
        additionalProperties: false
        properties:
          id: { type: integer }
          createdAt: { type: string, format: date-time }
          email: { type: string, description: "Mailpool's test address the email was sent to." }
          fromEmail: { type: string }
          state: { enum: [pending, completed] }
          result: { type: [object, "null"], description: "score, and SPF, DKIM, DMARK, domainAge, reverseDNS, ipBlackList, domainBlackList, spamAssassin, shortUrls, brokenLinks, each with a status." }
    cost: { per: request }

  - name: create_spam_check
    class: write
    description: >-
      Run a spam check: Mailpool sends a test email from the mailbox and scores
      it. Free; the state goes from pending to completed within seconds. Read
      it with get_spam_check. Refused with 404 for mailbox types it does not
      support.
    input:
      type: object
      additionalProperties: false
      required: [mailbox_id]
      properties:
        mailbox_id: *mailbox_id
    examples:
      - title: Check one mailbox
        input: { mailbox_id: 5301 }
    call: { method: POST, path: /spam-checks/, body: { mailboxId: mailbox_id } }
    output: { strip: [mailbox], schema: *spam_check_out }
    cost: { per: request }

  - name: get_spam_check
    class: read
    description: >-
      Get one spam check with its state and detailed results.
    input:
      type: object
      additionalProperties: false
      required: [spam_check_id]
      properties:
        spam_check_id: &spam_check_id { type: integer, minimum: 1, description: "Spam check id." }
    examples:
      - title: One spam check
        input: { spam_check_id: 880011 }
    call: { method: GET, path: "/spam-checks/{spam_check_id}" }
    output: { strip: [mailbox], schema: *spam_check_out }
    cost: { per: request }

  - name: delete_spam_check
    class: write
    description: >-
      Delete one spam check from the history.
    input:
      type: object
      additionalProperties: false
      required: [spam_check_id]
      properties:
        spam_check_id: *spam_check_id
    examples:
      - title: Delete one spam check
        input: { spam_check_id: 880011 }
    call: { method: DELETE, path: "/spam-checks/{spam_check_id}" }
    output: { strip: [mailbox], schema: *spam_check_out }
    cost: { per: request }

  # --- warmup ----------------------------------------------------------------
  - name: list_warmup_inboxes
    class: read
    description: >-
      List the inboxes enrolled in Mailpool warmup, with their status.
    input:
      type: object
      additionalProperties: false
      required: [limit, offset]
      properties:
        limit: *limit
        offset: *offset
    examples:
      - title: Warmup inboxes
        input: { limit: 50, offset: 0 }
    call: { method: GET, path: /warmup, query: { limit: limit, offset: offset } }
    output:
      items: data
      schema:
        type: object
        additionalProperties: false
        properties:
          id: { type: integer }
          mailboxId: { type: integer }
          email: { type: string }
          fullName: { type: string }
          type: { type: string }
          status: { type: string }
          warmboxId: { type: [integer, string, "null"] }
          createdAt: { type: string, format: date-time }
    cost: { per: request }

  - name: get_warmup_inbox
    class: read
    description: >-
      Get one warmup inbox: settings and daily counters.
    input:
      type: object
      additionalProperties: false
      required: [warmup_id]
      properties:
        warmup_id: { type: integer, minimum: 1, description: "Warmup inbox id." }
    examples:
      - title: One warmup inbox
        input: { warmup_id: 77 }
    call: { method: GET, path: "/warmup/{warmup_id}" }
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          id: { type: integer }
          mailboxId: { type: integer }
          email: { type: string }
          status: { type: string }
          dailyTarget: { type: number }
          replyRate: { type: number }
          duration: { type: [number, "null"] }
          counters: { type: [object, array, "null"] }
          createdAt: { type: string, format: date-time }
    cost: { per: request }

  - name: list_available_warmup_inboxes
    class: read
    description: >-
      List the active mailboxes that are not enrolled in warmup yet.
    input:
      type: object
      additionalProperties: false
      required: [limit, offset]
      properties:
        limit: *limit
        offset: *offset
    examples:
      - title: Mailboxes that could be warmed up
        input: { limit: 50, offset: 0 }
    call: { method: GET, path: /warmup/available-inboxes, query: { limit: limit, offset: offset } }
    output:
      items: data
      schema:
        type: object
        additionalProperties: false
        properties:
          id: { type: integer }
          email: { type: string }
          fullName: { type: string }
          type: { type: string }
    cost: { per: request }

  # --- subscription ----------------------------------------------------------
  - name: get_subscription_slots
    class: read
    description: >-
      Get the mailboxes used and the slots paid, per mailbox type, and the
      warmup slots. A mailbox can only be created while a slot is free.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Slots in use
        input: {}
    call: { method: GET, path: /subscriptions/slots }
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          mailboxes: { type: object, description: "Mailboxes in use, per type." }
          slots: { type: object, description: "Slots paid, per type." }
          warmup: { type: object, description: "Warmup slots: used and paid." }
    cost: { per: request }
