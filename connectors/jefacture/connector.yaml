# yaml-language-server: $schema=../connector.schema.json
# jefacture.com runs on the Banqup platform, French region. API reference:
# https://docs.btx.banqup.com (OpenAPI under "downloads").
# French e-invoicing, READ-ONLY: issued and received invoices and their
# statuses, what remains due and the payments matched to it, customers and
# suppliers, payment accounts and their movements.
#
# The access token comes from a person's consent (OAuth 2.0 authorization
# code, scope openid), with the OAuth application of the host or of the
# organization, created on the Banqup developer portal (its API key is the
# client id). What the token reads is decided by the API products enabled on
# the application and by the person's rights in each space, not by a scope.
# Each refresh returns a new refresh token, which replaces the old one; the
# platform documents a dedicated refresh endpoint (/oauth2/refresh), which the
# Python client calls.
#
# Every read but get_me and list_spaces is scoped to one space (the workspace
# of one company), passed as space_id; a person may reach several (an
# accounting firm reaches its clients'). Lists are paged by number from 0.
connector:
  name: jefacture
  label: jefacture.com
  namespace: jefacture
  version: 1.0.0
  api_version: "2026-10"
  base_url: https://api.btx.fr.banqup.com
  auth:
    kind: oauth2_user
    authorize_url: https://api.btx.fr.banqup.com/oauth2/auth
    token_url: https://api.btx.fr.banqup.com/oauth2/token
    client_auth: body
    scopes: [openid]
    refresh: refresh_token
    rotates: true
    expires_in_default: 3600
    identity: { function: get_me, path: email }
  modes: [byo_user]
  timeout_s: 60
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "jefacture.com rejected the request as invalid: check the arguments (ids as UUIDs, dates as YYYY-MM-DD, page from 0)." }
    - { status: 401, code: authorization_expired, retryable: false,
        message: "jefacture.com no longer accepts this authorization (expired or revoked): the person must sign in again." }
    - { status: 403, code: permission_missing, retryable: false,
        message: "jefacture.com refused the read: the person has no right on this space or this resource, or the application lacks the API product it needs." }
    - { status: 404, code: not_found, retryable: false,
        message: "jefacture.com object not found: check the space id and the object id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "jefacture.com rate limit reached: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "jefacture.com is temporarily unavailable: retry later." }

functions:
  - name: get_me
    class: read
    description: >-
      Get the person the authorization acts as: {email, firstName, lastName,
      status, subject, partnerIds}. Every other read acts on their behalf.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Who the token acts as, input: {} }
    call: { method: GET, path: /workspace/user/business/v1/users/me }
    cost: { per: request }

  - name: list_spaces
    class: read
    description: >-
      List the spaces the person reaches, by name: {spaces: [{id, name, type
      (BUSINESS, PARTNER...), status, entityId, accessType (DIRECT, or PARTNER
      for a client space reached through an accounting firm)}], totalElements,
      currentPage, pageSize}. A space is the workspace of one company; its id
      is the space_id of every other read.
    input:
      type: object
      additionalProperties: false
      properties:
        page: &page
          type: integer
          minimum: 0
          description: "Page number, from 0."
        page_size: &page_size
          type: integer
          minimum: 1
          maximum: 200
          description: "Items per page (20 by default)."
    examples:
      - { title: The spaces of the person, input: {} }
    call:
      method: GET
      path: /workspace/space/v2/spaces
      query: { page: page, pageSize: page_size }
      constants: { query: { sortBy: name.asc } }
    cost: { per: request }

  - name: list_documents
    class: read
    description: >-
      List the invoices and credit notes of a space, with their counterparts
      and matched payments: {documents: [{id, folder, category, status
      {document, pay, delivery}, metadata {documentNumber, issueDate, dueDate,
      currencyCode, supplier, customer, documentTotals {netAmount, vatAmount,
      grossAmount, payableAmount, openBalance}}, connections, balanceOffsets}],
      totalElements, currentPage, pageSize}. folder SALES = issued, PURCHASES =
      received. status_query filters on the statuses in the platform's query
      language, e.g. "pay=UNPAID OR pay=PARTIALLY_PAID" (pay: UNPAID,
      PARTIALLY_PAID, FULLY_PAID, WONT_BE_PAID, IN_TRANSIT; document:
      AWAITING_VALIDATION, VALIDATED, FULLY_APPROVED, REFUSED, DISPUTED...).
      Date bounds are inclusive.
    input:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: &space_id
          type: string
          format: uuid
          description: "The space id, from list_spaces."
        folder:
          type: string
          enum: [SALES, PURCHASES, DRAFTS, INBOX]
          description: "SALES: issued documents; PURCHASES: received ones."
        category:
          type: string
          enum: [INVOICE, CREDIT_NOTE, SELF_BILLED_INVOICE, SELF_BILLED_CREDIT_NOTE,
                 PROFORMA_INVOICE, INVOICE_REMINDER, RECEIPT, QUOTE]
          description: "Kind of document."
        status_query:
          type: string
          minLength: 1
          description: "Filter on status.document, status.pay and status.delivery, e.g. pay=UNPAID."
        issued_from: &day
          type: string
          pattern: "^\\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\\d|3[01])$"
          description: "Issued on or after this date, YYYY-MM-DD."
        issued_to:
          <<: *day
          description: "Issued on or before this date, YYYY-MM-DD."
        due_from:
          <<: *day
          description: "Due on or after this date, YYYY-MM-DD."
        due_to:
          <<: *day
          description: "Due on or before this date, YYYY-MM-DD."
        updated_since:
          type: string
          minLength: 10
          description: "Updated on or after this date or ISO 8601 date-time."
        document_number:
          type: string
          minLength: 1
          description: "Part of the document number."
        counterpart:
          type: string
          minLength: 1
          description: "Part of the customer's or supplier's name."
        sort_by:
          type: string
          enum: [issueDate.desc, issueDate.asc, dueDate.asc, dueDate.desc, updatedAt.desc,
                 updatedAt.asc, openBalance.desc, payableAmount.desc, documentNumber.asc]
          description: "Sort order."
        page: *page
        page_size: *page_size
    examples:
      - title: Received invoices still to pay
        input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f", folder: PURCHASES,
                 status_query: "pay=UNPAID OR pay=PARTIALLY_PAID", sort_by: dueDate.asc }
      - title: Invoices issued in September
        input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f", folder: SALES,
                 category: INVOICE, issued_from: "2026-09-01", issued_to: "2026-09-30" }
    call:
      method: GET
      path: /documents/core/transaction/v2/spaces/{space_id}/documents
      query:
        folder: folder
        category: category
        "status[ql]": status_query
        "issueDate[gte]": issued_from
        "issueDate[lte]": issued_to
        "dueDate[gte]": due_from
        "dueDate[lte]": due_to
        "updatedAt[gte]": updated_since
        "documentNumber[icont]": document_number
        "connectionName[icont]": counterpart
        sortBy: sort_by
        page: page
        pageSize: page_size
      constants: { query: { include: "connections,balanceOffsets" } }
    cost: { per: request }

  - name: get_document
    class: read
    description: >-
      Get one invoice or credit note with its lines, counterparts and matched
      payments: id, folder, category, status {document, pay, delivery},
      metadata (number, dates, supplier, customer, totals with openBalance,
      VAT details, payment means), lines, connections, balanceOffsets.
    input:
      type: object
      additionalProperties: false
      required: [space_id, document_id]
      properties:
        space_id: *space_id
        document_id: &document_id
          type: string
          format: uuid
          description: "The document id, from list_documents."
    examples:
      - { title: One invoice, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f",
                                       document_id: "1d0159ca-ab19-49d5-9e13-9d34afb03849" } }
    call:
      method: GET
      path: /documents/core/transaction/v2/spaces/{space_id}/documents/{document_id}
      constants: { query: { include: "lines,connections,balanceOffsets" } }
    cost: { per: request }

  - name: list_balance_offsets
    class: read
    description: >-
      List the payments imputed to one document: {balanceOffsets: [{paymentId,
      amount {value, currency}, offsetType (FULL, PARTIAL, DISCOUNT, REFUND,
      OVERPAYMENT, UNDERPAYMENT, FEE...), aggregationStatus (PROPOSED,
      AUTO_CONFIRMED, USER_CONFIRMED, REJECTED)}]}. Only confirmed offsets
      count as paid.
    input:
      type: object
      additionalProperties: false
      required: [space_id, document_id]
      properties:
        space_id: *space_id
        document_id: *document_id
    examples:
      - { title: Payments of one invoice, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f",
                                                   document_id: "1d0159ca-ab19-49d5-9e13-9d34afb03849" } }
    call:
      method: GET
      path: /documents/payment/pay/v1/spaces/{space_id}/documents/{document_id}/balanceOffsets
    cost: { per: request }

  - name: get_payment
    class: read
    description: >-
      Get one payment of a space: amount, date, counterparty and the documents
      it settles. Its id comes from a balance offset (paymentId).
    input:
      type: object
      additionalProperties: false
      required: [space_id, payment_id]
      properties:
        space_id: *space_id
        payment_id:
          type: string
          format: uuid
          description: "The payment id, from list_balance_offsets."
    examples:
      - { title: One payment, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f",
                                       payment_id: "7c2e9a10-3b4d-4e5f-8a6b-9c0d1e2f3a4b" } }
    call:
      method: GET
      path: /documents/payment/business/v2/spaces/{space_id}/payments/{payment_id}
    cost: { per: request }

  - name: list_reconciliations
    class: read
    description: >-
      List the documents of a space with the payments matched or proposed for
      them: {documentAggregations: [{document metadata with documentTotals
      {payableAmount, totalAmount, projectedOpenBalance}, aggregations
      [{balanceOffset, aggregationStatus, modifier (the payment: paymentDate,
      amount...)}]}], totalElements, totalMatchedElements,
      totalProposedElements, totalUnmatchedElements}. matching_status narrows
      to MATCHED, PROPOSED or UNMATCHED documents.
    input:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: *space_id
        matching_status:
          type: string
          enum: [PROPOSED, UNMATCHED, MATCHED]
          description: "Matching state of the documents."
        page:
          type: integer
          minimum: 0
          maximum: 10000
          description: "Page number, from 0."
        page_size: *page_size
    examples:
      - { title: Documents without a matched payment,
          input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f", matching_status: UNMATCHED } }
    call:
      method: GET
      path: /payments/reconciliation/documents/v2/spaces/{space_id}/documents/aggregations
      query: { matchingStatus: matching_status, page: page, size: page_size }
    cost: { per: request }

  - name: list_connections
    class: read
    description: >-
      List the customers and suppliers of a space, by name: {connections:
      [{id, displayName, relationTypes, globalIdentifiers (SIREN, VAT
      number...), connectionStatus, addresses, metadata}], totalElements,
      currentPage, pageSize}. identifier is a key:value pair such as
      "FR:SIREN:123456789".
    input:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: *space_id
        relation_type:
          type: string
          enum: [CUSTOMER, SUPPLIER]
          description: "Customers or suppliers."
        search:
          type: string
          minLength: 1
          description: "Part of the name."
        identifier:
          type: string
          minLength: 1
          description: "A legal identifier, as key:value."
        page: *page
        page_size: *page_size
    examples:
      - { title: Suppliers, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f",
                                     relation_type: SUPPLIER } }
    call:
      method: GET
      path: /network/core/transaction/v3/spaces/{space_id}/connections
      query: { relationTypes: relation_type, "search[cont]": search,
               identifierKeyValue: identifier, page: page, pageSize: page_size }
      constants: { query: { sortBy: name.asc } }
    cost: { per: request }

  - name: get_connection
    class: read
    description: >-
      Get one customer or supplier: name, relation types, legal identifiers,
      addresses, status and metadata.
    input:
      type: object
      additionalProperties: false
      required: [space_id, connection_id]
      properties:
        space_id: *space_id
        connection_id:
          type: string
          format: uuid
          description: "The connection id, from list_connections."
    examples:
      - { title: One supplier, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f",
                                        connection_id: "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d" } }
    call:
      method: GET
      path: /network/core/transaction/v3/spaces/{space_id}/connections/{connection_id}
    cost: { per: request }

  - name: list_payment_accounts
    class: read
    description: >-
      List the active or requested payment accounts of a space, with their
      last known balances: {paymentAccounts: [{id, alias, identifier (IBAN),
      bank, currency, status, balances [{amount, balanceType
      (CURRENT_AVAILABLE, CURRENT_BOOKED, CLOSING_BOOKED...)}], consent
      {status, expirationDate}, availableOperations}]}. An external bank
      account shows balances and movements only while its consent is valid.
    input:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: *space_id
    examples:
      - { title: Accounts and balances, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f" } }
    call:
      method: GET
      path: /payments/paymentaccounts/v2/spaces/{space_id}/paymentAccounts
    cost: { per: request }

  - name: list_account_movements
    class: read
    description: >-
      List the movements of one payment account: {movements: [{id, amount,
      bookingDate, bookingType, counterparty, endToEndId, paymentId,
      balancesAfterOperation}], currentPage, nextPage, pageSize,
      totalElements}. booking_type BOOKED (default view), PLANNED or RESERVED.
      Date bounds are inclusive, YYYY-MM-DD. At most 100 per page.
    input:
      type: object
      additionalProperties: false
      required: [space_id, payment_account_id]
      properties:
        space_id: *space_id
        payment_account_id:
          type: string
          format: uuid
          description: "The payment account id, from list_payment_accounts."
        booking_type:
          type: string
          enum: [BOOKED, PLANNED, RESERVED]
          description: "Booked, planned or reserved movements."
        date_from:
          <<: *day
          description: "From this date, YYYY-MM-DD."
        date_to:
          <<: *day
          description: "Up to this date, YYYY-MM-DD."
        page: *page
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: "Items per page (30 by default)."
    examples:
      - { title: October movements, input: { space_id: "4b0a3c5e-0d1f-4c2a-9f6e-1a2b3c4d5e6f",
                                             payment_account_id: "2f1e0d9c-8b7a-4c6d-9e5f-4a3b2c1d0e9f",
                                             date_from: "2026-10-01", date_to: "2026-10-31" } }
    call:
      method: GET
      path: /payments/paymentaccounts/v1/spaces/{space_id}/paymentAccounts/{payment_account_id}/movements
      query: { bookingType: booking_type, dateFrom: date_from, dateTo: date_to,
               page: page, size: page_size }
    cost: { per: request }

exposure: { mode: per_connector, tool: jefacture }
