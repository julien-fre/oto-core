# Les clients Python de la lib et leurs descriptions.
#
# Un client est une entrée directe de oto/tools/ (paquet ou module), ou un sous-paquet d'une famille. Le code qu'une
# description couvre : le client du même nom que le connecteur, entier ; ou ce que described_by rattache, un client
# entier ou seulement des fichiers et sous-dossiers d'un client (alors le reste du client n'est le code d'aucun
# connecteur). Quand ce code change, la version du connecteur monte (fabrique/commits.py).
#
# Un client sans description figure dans without_description, avec sa catégorie et sa raison. Trois catégories de
# principe (not_a_service_client, not_describable, oto_service) admettent une entrée nouvelle ; les deux catégories en
# attente (not_described_yet, before_the_rule) ne font que décroître : un client nouveau entre au format.
# Gardes : tests/test_clients_described.py (l'arbre), fabrique/commits.py (chaque commit contre son parent).
# Format : docs/conception/format-de-description.md, « Contrôles ».

# Un paquet par service : chacun de ses sous-paquets est un client.
families:
  google: un sous-paquet par service Google, chacun son client

# Client décrit sous un autre nom, ou en partie seulement.
described_by:
  # La description linkedin_unipile couvre tout le client : le transport commun, profils, entreprises, relations,
  # invitations, posts, messagerie, la recherche (facettes, et `search` en huit fonctions, écart décidé par Alexis),
  # le fil d'actualité, les produits premium (contrats, InMail, offres d'emploi, candidats, projets Recruiter) et les
  # adresses ouvertes retirées des réponses. Restent au client, nommées dans la description, les méthodes que le format
  # ne sait pas dire (member_action, get_feed).
  unipile/client.py: linkedin_unipile
  unipile/const.py: linkedin_unipile
  unipile/errors.py: linkedin_unipile
  unipile/_api/accounts.py: linkedin_unipile
  unipile/_api/profiles.py: linkedin_unipile
  unipile/_api/network.py: linkedin_unipile
  unipile/_api/content.py: linkedin_unipile
  unipile/_api/messaging.py: linkedin_unipile
  unipile/_api/search.py: linkedin_unipile
  unipile/_api/premium.py: linkedin_unipile
  unipile/feed.py: linkedin_unipile
  unipile/open_addresses.py: linkedin_unipile
  google/gmail: gmail
  google/drive: google_drive
  google/calendar: google_calendar
  google/sheets: google_sheets
  # La description microsoft couvre les fichiers (SharePoint, OneDrive) d'une personne connectée : le consentement, ses
  # droits, le transport commun et la surface fichiers. Courrier, agenda, Teams, OneNote, annuaire et cellules d'un
  # classeur Excel ne sont pas décrits.
  microsoft/files.py: microsoft
  microsoft/auth.py: microsoft
  microsoft/scopes.py: microsoft
  microsoft/_transport.py: microsoft

without_description:
  # De principe : pas le client d'un service.
  browser: { category: not_a_service_client, reason: "pas un client : automatisation d'un navigateur local" }
  common: { category: not_a_service_client, reason: "pas un client : utilitaires communs de la lib (credentials, erreurs, débit, garde d'adresse)" }
  http: { category: not_a_service_client, reason: "pas le client d'un service : nœud HTTP générique, l'adresse vient de l'appelant" }
  markdown_lint.py: { category: not_a_service_client, reason: "pas un client : contrôle local de Markdown" }
  naf: { category: not_a_service_client, reason: "pas le client d'un service : suggestion de code NAF, calcul local" }
  pdf: { category: not_a_service_client, reason: "pas un client : génération locale de PDF (pandoc, weasyprint)" }
  # De principe : le format ne sait pas le dire (« Les connecteurs décrits »).
  boondmanager: { category: not_describable, reason: "jeton signé à chaque requête" }
  collective: { category: not_describable, reason: "pas d'API publique : piloté par un navigateur" }
  dataforseo: { category: not_describable, reason: "corps en liste de tâches au premier niveau ; erreur lue dans le corps d'un 200 ; audit en file, relu par identifiant" }
  search_console: { category: not_describable, reason: "assertion signée par un compte de service, échangée contre un jeton dont la portée change selon l'appel" }
  ubersuggest: { category: not_describable, reason: "transport MCP en JSON-RPC sur un seul point d'entrée ; client OAuth public obtenu par enregistrement dynamique" }
  wordpress: { category: not_describable, reason: "la racine REST se découvre à l'appel (/wp-json/ ou ?rest_route=) ; téléversement de média en corps binaire" }
  zeendoc: { category: not_describable, reason: "session ouverte par le login d'un compte utilisateur, portée par un cookie ; texte et fichiers servis par des pages de l'application, document absent signalé par une redirection" }
  zohosign: { category: not_describable, reason: "consentement lié au data center : l'adresse d'autorisation change d'hôte par région (accounts.zoho.com.au, accounts.zohocloud.ca), ce qu'aucun gabarit ne dit et qu'aucune table par réglage ne donne pour authorize_url ; création depuis un modèle en corps formulaire, un document JSON dans un champ" }
  google/bigquery: { category: not_describable, reason: "SDK de Google, pas de requête HTTP décrite" }
  # De principe : client d'un service d'oto, pas d'un tiers.
  datastore: { category: oto_service, reason: "client d'un service d'oto (son serveur MCP), pas d'un tiers" }
  ninja: { category: oto_service, reason: "client d'un service d'oto (son serveur MCP), pas d'un tiers" }
  # En attente, ne fait que décroître : ajouté après la règle du 05/10 sans description.
  luma: { category: not_described_yet, reason: "ajouté le 09/10, après la règle, sans description : pas encore décrit" }
  urbanisme: { category: not_described_yet, reason: "ajouté le 11/10, après la règle, sans description : pas encore décrit (enchaîne trois services publics côté client)" }
  google/ads: { category: not_described_yet, reason: "ajouté le 08/10, après la règle, sans description : pas encore décrit" }
  # En attente, ne fait que décroître : antérieur à la règle du 05/10, pas encore décrit.
