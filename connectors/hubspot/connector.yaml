# yaml-language-server: $schema=../connector.schema.json
# HubSpot CRM API v3 (https://developers.hubspot.com/docs/api/crm/understanding-the-crm). The values come from the
# Python client, oto.tools.hubspot, which this description follows: one request per method to api.hubapi.com, the
# private app access token as a bearer token, JSON bodies. The function names, the argument names and the keys sent
# to HubSpot are the client's (tests/test_hubspot_description.py reads it to keep both equal). The client gained one
# argument for this file, filter_groups of search_objects (1.0.1); what it sends for its other calls is unchanged.
#
# One token = one private app of one portal (HubSpot account). HubSpot grants its scopes object by object: a token
# may read contacts and not tickets, or read without writing. A missing scope is a 403 whose category is
# MISSING_SCOPES; it is a checkbox on the private app, never a refused token.
#
# Read and act: reads stay on the read side; every create, update, archive, restore and membership change is served
# on the act side (class write); archiving a record, a property or a list, emptying a list and replacing a list's
# filters ask for a confirmation (class sensitive).
#
# Lists: properties and associations go in the query joined by commas, as the client joins them (query_arrays).
# The client sends limit 100 when the call omits it (HubSpot's own default is 10) and caps it at 100, which the schema
# follows, though HubSpot's reference now serves up to 200 a page: the client is raised when a need asks for it. It
# also sends includeFilters, archived and enrollObjectsInWorkflows false, HubSpot's own default: the booleans declare it as
# default, limit does not, since the host sends nothing for an omitted argument. A list is created with its
# processingType, which HubSpot requires: required here, where the client defaults it to MANUAL.
#
# Rate: HubSpot's usage guidelines (read 2026-10-21) allow a private app 100 requests every 10 seconds on a Free or
# Starter portal, 190 on Professional and Enterprise; the lower is declared. The search endpoints have a lower limit
# of their own (5 requests per second per portal), which the format does not say per function: search_objects says
# it. A 429 whose policyName is DAILY (or MONTHLY) is the portal's daily quota, shared by all its private apps: not
# retryable, it marks the account. The client retries a short-window 429 itself, never a 5xx: a 5xx does not say
# whether a write went through, and replaying a create would duplicate a record. The table says so (not retryable).
#
# Not described here, left to the hand-written client:
# - batch_read_objects: several /batch/read calls, one per slice of 100 ids, fused into an envelope that adds
#   missing_ids, a local diff of what came back;
# - create_note: a composition (the association type of the note looked up for a custom object, the timestamp set
#   to now, the association built); a host writes a note with create_object on notes, with its association;
# - get_lists: listIds repeated in the query, where every other list of this connector is joined by commas;
# - add_list_memberships and remove_list_memberships: a body that is a bare array of ids, which body does not say;
#   add_and_remove_list_memberships does both;
# - create_property and update_property: the body is the definition argument itself (its keys at the top level),
#   which body does not say (it maps a key of the body to an argument);
# - the filters argument of search_objects, which the client wraps in filterGroups ([{filters}]), a nesting that
#   body does not say. Since 1.0.1 the client also takes filter_groups, HubSpot's native form sent as is in
#   filterGroups, which the description declares: the agent filters with one group for AND, several for OR. The
#   client refuses filters and filter_groups together.
#
# Filter operators, from HubSpot's CRM search guide (read 2026-10-21): EQ, NEQ, LT, LTE, GT, GTE and CONTAINS_TOKEN,
# NOT_CONTAINS_TOKEN take value; BETWEEN takes value and highValue; IN and NOT_IN take values; HAS_PROPERTY and
# NOT_HAS_PROPERTY take none. At most 5 groups, 6 filters per group, 18 filters in all; the schema bounds the first
# two, the description says the third.
# No probe: the account read that oto 1 probes with (GET /account-info/v3/details) is no method of the client, and
# list_owners, the only read without a required argument, needs a scope of its own (crm.objects.owners.read) that a
# working token may lack.
connector:
  name: hubspot
  label: HubSpot
  namespace: hubspot
  version: 1.0.2
  api_version: v3
  base_url: https://api.hubapi.com
  auth:
    kind: bearer
    token: access_token
  credential:
    - { name: access_token, label: Private app access token, secret: true }
  modes: [byo_user, byo_org]
  query_arrays: comma
  rate_limit: { requests: 100, seconds: 10 }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "HubSpot rejected the request as invalid: check the arguments. A property name that does not exist in this portal is refused here; internal names (dealstage, not Deal stage) are read with list_properties." }
    - { status: 401, code: token_refused, retryable: false, marks_account: credential_rejected,
        message: "HubSpot rejected the token: it must be the private app's access token, valid and not revoked." }
    - { status: 403, body: { path: category, equals: [MISSING_SCOPES] }, code: missing_scopes, retryable: false,
        message: "The private app token lacks the scope for this object or action: add it to the private app's scopes in HubSpot. Retrying unchanged fails the same way." }
    - { status: 403, code: forbidden, retryable: false,
        message: "HubSpot refused this action for this token or this portal's plan." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in this portal: deleted, archived, or never existed under this id." }
    - { status: 409, code: conflict, retryable: false,
        message: "Conflict with an existing HubSpot object: a unique value (a contact's email, a list or property name) is already taken." }
    - { status: 429, body: { path: policyName, equals: [DAILY, MONTHLY] }, code: daily_limit_reached, retryable: false,
        marks_account: quota_exhausted,
        message: "The portal's daily HubSpot API quota is spent: retrying today will not help." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "HubSpot rate limit reached: wait about ten seconds, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: false,
        message: "HubSpot failed. A read can be retried; a write may or may not have been applied: read the record before writing again, or it may be duplicated." }

functions:
  # --- CRM objects ----------------------------------------------------------

  - name: list_objects
    class: read
    description: >-
      List the records of one CRM object type (contacts, companies, deals,
      tickets, notes or a custom object), one page at a time, in no useful
      order: to find records by value, use search_objects. Each record comes
      with its id and the properties asked for (a default set otherwise),
      under their internal names. associations adds the ids of associated
      records of the named types. Pass paging.next.after as after for the
      next page.
    input:
      type: object
      additionalProperties: false
      required: [object_type]
      properties:
        object_type: &object_type { type: string, pattern: "^[A-Za-z0-9_-]+$", description: "contacts, companies, deals, tickets, notes, or a custom object type (2-<n>, or its name)." }
        properties: &property_names
          type: array
          minItems: 1
          items: { type: string, pattern: "^[A-Za-z0-9_]+$" }
          description: "Internal names of the properties to return (firstname, dealstage); list_properties gives them."
        limit: &limit { type: integer, minimum: 1, maximum: 100, description: "Records per page, at most 100." }
        after: &after { type: string, minLength: 1, description: "paging.next.after of the previous page." }
        associations: &association_types
          type: array
          minItems: 1
          items: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
          description: "Object types whose associated record ids to add (deals, companies)."
    examples:
      - title: Contacts with their name and email
        input: { object_type: contacts, properties: [firstname, lastname, email], limit: 50 }
      - title: The next page of deals, with their companies
        input: { object_type: deals, associations: [companies], after: "100" }
    call:
      method: GET
      path: /crm/v3/objects/{object_type}
      query: { limit: limit, properties: properties, associations: associations, after: after }
    pagination: &pagination { kind: cursor, request_param: after, next: paging.next.after, max_pages: 10 }
    output: { items: results }
    cost: &cost { per: request }

  - name: get_object
    class: read
    description: >-
      Get one CRM record by its id: its properties (those asked for, a default
      set otherwise) under their internal names, and the ids of its associated
      records of the types named in associations. A property that does not
      exist in the portal is ignored here, not refused.
    input:
      type: object
      additionalProperties: false
      required: [object_type, object_id]
      properties:
        object_type: *object_type
        object_id: &object_id { type: string, pattern: "^[0-9]+$", description: "Record id (hs_object_id)." }
        properties: *property_names
        associations: *association_types
    examples:
      - title: A deal with its stage, amount and contacts
        input: { object_type: deals, object_id: "1001", properties: [dealname, dealstage, amount], associations: [contacts] }
    refusals:
      - { code: object_not_found, when: 404, message: "No record with this id in this object type: deleted, archived, or never existed. A search finds it by its properties." }
    call:
      method: GET
      path: /crm/v3/objects/{object_type}/{object_id}
      query: { properties: properties, associations: associations }
    cost: *cost

  - name: search_objects
    class: read
    description: >-
      Search the records of one CRM object type by full-text query, by
      filters on property values, or both. filter_groups: the filters inside
      one group must all match (AND); the record matches if any group matches
      (OR); at most 5 groups, 6 filters per group, 18 in all. A filter names a
      property by internal name and an operator: EQ, NEQ, LT, LTE, GT, GTE,
      CONTAINS_TOKEN (* as wildcard), NOT_CONTAINS_TOKEN take value; BETWEEN
      takes value and highValue; IN, NOT_IN take values (exact match);
      HAS_PROPERTY, NOT_HAS_PROPERTY take nothing. Dates go as epoch
      milliseconds; dropdowns take their option value. sorts orders by one
      property. Returns total and results; pass paging.next.after as after
      for the next page. At most 10,000 results per search, about 5 searches
      per second; a record just written can take a few seconds to be found.
    input:
      type: object
      additionalProperties: false
      required: [object_type]
      properties:
        object_type: *object_type
        query: { type: string, minLength: 1, personal: true, description: "Full-text search: a name, an email, a domain, a phone number." }
        properties: *property_names
        limit: *limit
        after: *after
        sorts:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [propertyName, direction]
            properties:
              propertyName: { type: string, pattern: "^[A-Za-z0-9_]+$" }
              direction: { enum: [ASCENDING, DESCENDING] }
          description: "One sort: [{propertyName: createdate, direction: DESCENDING}]."
        filter_groups:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [filters]
            properties:
              filters:
                type: array
                minItems: 1
                maxItems: 6
                items:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [propertyName, operator, value]
                      properties:
                        propertyName: &filter_property { type: string, pattern: "^[A-Za-z0-9_]+$", description: "Internal name of the property." }
                        operator: { enum: [EQ, NEQ, LT, LTE, GT, GTE, CONTAINS_TOKEN, NOT_CONTAINS_TOKEN] }
                        value: &filter_value { type: [string, number, boolean], personal: true }
                    - type: object
                      additionalProperties: false
                      required: [propertyName, operator, value, highValue]
                      properties:
                        propertyName: *filter_property
                        operator: { const: BETWEEN }
                        value: { type: [string, number], description: "Low bound, included." }
                        highValue: { type: [string, number], description: "High bound, included." }
                    - type: object
                      additionalProperties: false
                      required: [propertyName, operator, values]
                      properties:
                        propertyName: *filter_property
                        operator: { enum: [IN, NOT_IN] }
                        values: { type: array, minItems: 1, items: { type: [string, number], personal: true } }
                    - type: object
                      additionalProperties: false
                      required: [propertyName, operator]
                      properties:
                        propertyName: *filter_property
                        operator: { enum: [HAS_PROPERTY, NOT_HAS_PROPERTY] }
          description: "Filter groups, OR between groups, AND inside a group: [{filters: [{propertyName, operator, value}]}]."
    examples:
      - title: Customer contacts or open leads, newest first
        input:
          object_type: contacts
          properties: [firstname, lastname, email, lifecyclestage]
          filter_groups:
            - filters: [{ propertyName: lifecyclestage, operator: EQ, value: customer }]
            - filters:
                - { propertyName: hs_lead_status, operator: IN, values: [NEW, OPEN] }
                - { propertyName: email, operator: HAS_PROPERTY }
          sorts: [{ propertyName: createdate, direction: DESCENDING }]
      - title: Deals closing in a date range above an amount
        input:
          object_type: deals
          properties: [dealname, amount, closedate]
          filter_groups:
            - filters:
                - { propertyName: closedate, operator: BETWEEN, value: "1790812800000", highValue: "1798761600000" }
                - { propertyName: amount, operator: GTE, value: 10000 }
      - title: Contacts matching a name, newest first
        input:
          object_type: contacts
          query: dupont
          properties: [firstname, lastname, email]
          sorts: [{ propertyName: createdate, direction: DESCENDING }]
      - title: Companies matching a domain
        input: { object_type: companies, query: example.test, limit: 10 }
    call:
      method: POST
      path: /crm/v3/objects/{object_type}/search
      body: { limit: limit, query: query, filterGroups: filter_groups, properties: properties, sorts: sorts, after: after }
    pagination: *pagination
    output: { items: results }
    cost: *cost

  - name: create_object
    class: write
    description: >-
      Create one CRM record: a contact, a company, a deal, a ticket, a note or
      a custom object record. properties are keyed by internal name
      (list_properties gives them, and the values a dropdown accepts);
      associations attach it to existing records at creation. A note takes
      hs_note_body and hs_timestamp, and an association to its record. Returns
      the created record and its id.
    input:
      type: object
      additionalProperties: false
      required: [object_type, properties]
      properties:
        object_type: *object_type
        properties: &property_values
          type: object
          minProperties: 1
          personal: true
          propertyNames: { pattern: "^[A-Za-z0-9_]+$" }
          additionalProperties: { type: [string, number, boolean] }
          description: "Property values by internal name: {email: ..., firstname: ...}. An empty string clears a value."
        associations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [to, types]
            properties:
              to:
                type: object
                additionalProperties: false
                required: [id]
                properties: { id: { type: string, pattern: "^[0-9]+$" } }
              types:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [associationCategory, associationTypeId]
                  properties:
                    associationCategory: { enum: [HUBSPOT_DEFINED, USER_DEFINED, INTEGRATOR_DEFINED] }
                    associationTypeId: { type: integer, minimum: 1 }
          description: "Records to associate, HubSpot v3 form: [{to: {id}, types: [{associationCategory, associationTypeId}]}]. Default type ids: note to contact 202, to company 190, to deal 214, to ticket 216; contact to company 279; deal to contact 3, deal to company 341."
    examples:
      - title: A contact
        input: { object_type: contacts, properties: { email: jane.doe@example.test, firstname: Jane, lastname: Doe } }
      - title: A note on a contact
        input:
          object_type: notes
          properties: { hs_note_body: "Called, interested in a demo.", hs_timestamp: "2026-10-21T09:00:00Z" }
          associations: [{ to: { id: "1001" }, types: [{ associationCategory: HUBSPOT_DEFINED, associationTypeId: 202 }] }]
    refusals:
      - { code: already_exists, when: 409, message: "A record with this unique value already exists (a contact's email): HubSpot's message gives its id; update it instead." }
    call:
      method: POST
      path: /crm/v3/objects/{object_type}
      body: { properties: properties, associations: associations }
    cost: *cost

  - name: update_object
    class: write
    description: >-
      Update the properties of one CRM record by its id (PATCH): only the
      properties given change, an empty string clears one. Internal names
      only; list_properties gives them and the values a dropdown accepts.
      Returns the updated record.
    input:
      type: object
      additionalProperties: false
      required: [object_type, object_id, properties]
      properties:
        object_type: *object_type
        object_id: *object_id
        properties: *property_values
    examples:
      - title: Move a deal to another stage
        input: { object_type: deals, object_id: "1001", properties: { dealstage: closedwon } }
    refusals:
      - { code: object_not_found, when: 404, message: "No record with this id in this object type: deleted, archived, or never existed." }
    call:
      method: PATCH
      path: /crm/v3/objects/{object_type}/{object_id}
      body: { properties: properties }
    cost: *cost

  - name: delete_object
    class: sensitive
    description: >-
      Archive one CRM record: it moves to HubSpot's recycle bin, out of lists,
      searches and reports, restorable from HubSpot for 90 days.
    input:
      type: object
      additionalProperties: false
      required: [object_type, object_id]
      properties:
        object_type: *object_type
        object_id: *object_id
    examples:
      - title: Archive a duplicate contact
        input: { object_type: contacts, object_id: "1002" }
    confirm:
      summary: "Archive HubSpot {object_type} record {object_id} (recycle bin, restorable for 90 days)."
    call: { method: DELETE, path: "/crm/v3/objects/{object_type}/{object_id}" }
    cost: *cost

  # --- Associations ---------------------------------------------------------

  - name: list_associations
    class: read
    description: >-
      List the records of to_object_type associated with one record: the
      deals of a contact, the contacts of a company. Returns their ids and
      association types; get_object or search_objects reads their properties.
    input:
      type: object
      additionalProperties: false
      required: [object_type, object_id, to_object_type]
      properties:
        object_type: *object_type
        object_id: *object_id
        to_object_type: { type: string, pattern: "^[A-Za-z0-9_-]+$", description: "Type of the associated records: deals, contacts, companies, tickets, notes." }
    examples:
      - title: The deals of a contact
        input: { object_type: contacts, object_id: "1001", to_object_type: deals }
    call: { method: GET, path: "/crm/v3/objects/{object_type}/{object_id}/associations/{to_object_type}" }
    output: { items: results }
    cost: *cost

  # --- Owners ---------------------------------------------------------------

  - name: list_owners
    class: read
    description: >-
      List the portal's owners (its users): id, email, first and last name,
      teams. An owner's id is the value of hubspot_owner_id on a record.
    input:
      type: object
      additionalProperties: false
      properties:
        limit: *limit
        after: *after
    examples:
      - title: The owners
        input: {}
    call:
      method: GET
      path: /crm/v3/owners
      query: { limit: limit, after: after }
    pagination: *pagination
    output: { items: results }
    cost: *cost

  # --- Properties (schema) --------------------------------------------------

  - name: list_properties
    class: read
    description: >-
      List the properties of an object type: internal name, label, type,
      field type, group, and for a dropdown its options, whose value is what a
      record accepts. Read it before writing a record: internal names are not
      the labels shown in HubSpot (dealstage, not Deal stage).
    input:
      type: object
      additionalProperties: false
      required: [object_type]
      properties:
        object_type: *object_type
        archived: &archived { type: boolean, default: false, description: "True returns archived properties instead." }
        properties: { type: array, minItems: 1, items: { type: string, pattern: "^[A-Za-z0-9_]+$" }, description: "Only these properties, by internal name." }
    examples:
      - title: The properties of deals
        input: { object_type: deals }
    call:
      method: GET
      path: /crm/v3/properties/{object_type}
      query: { archived: archived, properties: properties }
    output: { items: results }
    cost: *cost

  - name: get_property
    class: read
    description: >-
      Get one property of an object type by its internal name: label, type,
      field type, group, options.
    input:
      type: object
      additionalProperties: false
      required: [object_type, property_name]
      properties:
        object_type: *object_type
        property_name: &property_name { type: string, pattern: "^[A-Za-z0-9_]+$", description: "Internal name of the property." }
        archived: *archived
    examples:
      - title: The deal stage property
        input: { object_type: deals, property_name: dealstage }
    refusals:
      - { code: property_not_found, when: 404, message: "No property with this internal name on this object type: list_properties lists them." }
    call:
      method: GET
      path: /crm/v3/properties/{object_type}/{property_name}
      query: { archived: archived }
    cost: *cost

  - name: delete_property
    class: sensitive
    description: >-
      Archive a custom property of an object type: it disappears from records,
      forms and reports. HubSpot's own properties cannot be archived.
    input:
      type: object
      additionalProperties: false
      required: [object_type, property_name]
      properties:
        object_type: *object_type
        property_name: *property_name
    examples:
      - title: Archive a custom property
        input: { object_type: companies, property_name: lead_source_detail }
    confirm:
      summary: "Archive HubSpot property {property_name} of {object_type}."
    call: { method: DELETE, path: "/crm/v3/properties/{object_type}/{property_name}" }
    cost: *cost

  - name: list_property_groups
    class: read
    description: >-
      List the property groups of an object type (the sections of a record):
      the groupName a new property takes.
    input:
      type: object
      additionalProperties: false
      required: [object_type]
      properties:
        object_type: *object_type
    examples:
      - title: The groups of contact properties
        input: { object_type: contacts }
    call: { method: GET, path: "/crm/v3/properties/{object_type}/groups" }
    output: { items: results }
    cost: *cost

  # --- Lists (segments) -----------------------------------------------------
  # Lists are keyed on a numeric objectTypeId: 0-1 contacts, 0-2 companies, 0-3 deals, 0-5 tickets, 2-<n> custom.

  - name: create_list
    class: write
    description: >-
      Create a list (a segment) of records of one object type. MANUAL: members
      added and removed by hand or by add_and_remove_list_memberships.
      DYNAMIC: members recomputed by HubSpot from filter_branch. SNAPSHOT:
      filtered once, then managed by hand. The name is unique per object type.
    input:
      type: object
      additionalProperties: false
      required: [name, object_type_id, processing_type]
      properties:
        name: { type: string, minLength: 1, description: "List name, unique per object type." }
        object_type_id: &object_type_id { type: string, pattern: "^[0-9]+-[0-9]+$", description: "0-1 contacts, 0-2 companies, 0-3 deals, 0-5 tickets, 2-<n> a custom object." }
        processing_type: { enum: [MANUAL, DYNAMIC, SNAPSHOT] }
        filter_branch: &filter_branch
          type: object
          required: [filterBranchType]
          description: "HubSpot's criteria tree (filterBranchType OR, AND, UNIFIED_EVENTS, ASSOCIATION, with filterBranches and filters), passed as is; properties by internal name."
        custom_properties: { type: object, minProperties: 1, additionalProperties: { type: string }, description: "Custom list properties, name to value." }
    examples:
      - title: A manual list of contacts
        input: { name: Conference leads, object_type_id: "0-1", processing_type: MANUAL }
      - title: A dynamic list of contacts by lifecycle stage
        input:
          name: Customers
          object_type_id: "0-1"
          processing_type: DYNAMIC
          filter_branch:
            filterBranchType: OR
            filterBranches:
              - filterBranchType: AND
                filters:
                  - { filterType: PROPERTY, property: lifecyclestage, operation: { operationType: ENUMERATION, operator: IS_ANY_OF, values: [customer] } }
    refusals:
      - { code: list_name_taken, when: 409, message: "A list with this name already exists for this object type." }
    call:
      method: POST
      path: /crm/v3/lists
      body: { name: name, objectTypeId: object_type_id, processingType: processing_type, filterBranch: filter_branch, customProperties: custom_properties }
    cost: *cost

  - name: get_list
    class: read
    description: >-
      Get a list by its id: name, object type, processing type, size;
      include_filters adds its filter_branch.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: &list_id { type: string, pattern: "^[0-9]+$", description: "List id (listId)." }
        include_filters: &include_filters { type: boolean, default: false, description: "True adds the list's filterBranch." }
    examples:
      - title: A list with its filters
        input: { list_id: "42", include_filters: true }
    refusals:
      - &list_not_found { code: list_not_found, when: 404, message: "No list with this id in this portal: deleted lists are restorable for 90 days with restore_list." }
    call:
      method: GET
      path: /crm/v3/lists/{list_id}
      query: { includeFilters: include_filters }
    cost: *cost

  - name: get_list_by_name
    class: read
    description: >-
      Get a list by its exact name within one object type.
    input:
      type: object
      additionalProperties: false
      required: [object_type_id, list_name]
      properties:
        object_type_id: *object_type_id
        list_name: { type: string, pattern: "^[^/]+$", description: "Exact list name." }
        include_filters: *include_filters
    examples:
      - title: A contact list by name
        input: { object_type_id: "0-1", list_name: Conference leads }
    call:
      method: GET
      path: /crm/v3/lists/object-type-id/{object_type_id}/name/{list_name}
      query: { includeFilters: include_filters }
    cost: *cost

  - name: search_lists
    class: read
    description: >-
      Search lists by name, processing type and object type: lists, with
      hasMore, and offset to pass back for the next page.
    input:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, description: "Text in the list name." }
        processing_types: { type: array, minItems: 1, items: { enum: [MANUAL, DYNAMIC, SNAPSHOT] } }
        object_type_id: *object_type_id
        count: { type: integer, minimum: 1, maximum: 500, description: "Lists per page." }
        offset: { type: integer, minimum: 0, description: "offset of the previous page." }
        additional_properties: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "List properties to add to each list (hs_list_size is always there)." }
    examples:
      - title: Manual contact lists about a conference
        input: { query: conference, processing_types: [MANUAL], object_type_id: "0-1" }
    call:
      method: POST
      path: /crm/v3/lists/search
      body: { query: query, processingTypes: processing_types, objectTypeId: object_type_id, count: count, offset: offset, additionalProperties: additional_properties }
    pagination: { kind: cursor, request_param: offset, next: offset, more: hasMore, total: total, max_pages: 10 }
    output: { items: lists }
    cost: *cost

  - name: update_list_name
    class: write
    description: >-
      Rename a list.
    input:
      type: object
      additionalProperties: false
      required: [list_id, list_name]
      properties:
        list_id: *list_id
        list_name: { type: string, minLength: 1, description: "The new name, unique per object type." }
        include_filters: *include_filters
    examples:
      - title: Rename a list
        input: { list_id: "42", list_name: Conference leads 2026 }
    refusals:
      - *list_not_found
    call:
      method: PUT
      path: /crm/v3/lists/{list_id}/update-list-name
      query: { listName: list_name, includeFilters: include_filters }
    cost: *cost

  - name: update_list_filters
    class: sensitive
    description: >-
      Replace the criteria tree of a DYNAMIC or SNAPSHOT list: HubSpot
      recomputes its members, which can add or remove many records, and
      enroll_objects_in_workflows enrolls the new members in the workflows
      that use the list.
    input:
      type: object
      additionalProperties: false
      required: [list_id, filter_branch]
      properties:
        list_id: *list_id
        filter_branch: *filter_branch
        enroll_objects_in_workflows: { type: boolean, default: false, description: "True enrolls the records that join the list in its workflows." }
    examples:
      - title: Customers only
        input:
          list_id: "42"
          filter_branch:
            filterBranchType: OR
            filterBranches:
              - filterBranchType: AND
                filters:
                  - { filterType: PROPERTY, property: lifecyclestage, operation: { operationType: ENUMERATION, operator: IS_ANY_OF, values: [customer] } }
    refusals:
      - *list_not_found
    confirm:
      summary: "Replace the filters of HubSpot list {list_id}: its members are recomputed."
    call:
      method: PUT
      path: /crm/v3/lists/{list_id}/update-list-filters
      query: { enrollObjectsInWorkflows: enroll_objects_in_workflows }
      body: { filterBranch: filter_branch }
    cost: *cost

  - name: delete_list
    class: sensitive
    description: >-
      Delete a list. Its records are untouched; the list is restorable for
      90 days with restore_list.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: *list_id
    examples:
      - title: Delete a list
        input: { list_id: "42" }
    refusals:
      - *list_not_found
    confirm:
      summary: "Delete HubSpot list {list_id} (restorable for 90 days)."
    call: { method: DELETE, path: "/crm/v3/lists/{list_id}" }
    cost: *cost

  - name: restore_list
    class: write
    description: >-
      Restore a list deleted less than 90 days ago.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: *list_id
    examples:
      - title: Restore a list
        input: { list_id: "42" }
    call: { method: PUT, path: "/crm/v3/lists/{list_id}/restore" }
    cost: *cost

  # --- Memberships ------------------------------------------------------------

  - name: get_list_memberships
    class: read
    description: >-
      List the ids of the records that are members of a list (recordId, and
      when they joined), at most 250 per page; get_object or search_objects
      reads their properties. Pass paging.next.after as after for the next
      page.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: *list_id
        limit: { type: integer, minimum: 1, maximum: 250, description: "Members per page, at most 250." }
        after: *after
    examples:
      - title: The members of a list
        input: { list_id: "42", limit: 250 }
    refusals:
      - *list_not_found
    call:
      method: GET
      path: /crm/v3/lists/{list_id}/memberships
      query: { limit: limit, after: after }
    pagination: *pagination
    output: { items: results }
    cost: *cost

  - name: add_and_remove_list_memberships
    class: write
    description: >-
      Add and remove members of a MANUAL or SNAPSHOT list in one revision of
      the list, by record id; pass an empty list for the side with nothing to
      do. A DYNAMIC list refuses it: its members follow its filters.
    input:
      type: object
      additionalProperties: false
      required: [list_id, record_ids_to_add, record_ids_to_remove]
      properties:
        list_id: *list_id
        record_ids_to_add: &record_ids { type: array, maxItems: 100000, items: { type: string, pattern: "^[0-9]+$" }, description: "Record ids." }
        record_ids_to_remove: *record_ids
    examples:
      - title: Add two contacts
        input: { list_id: "42", record_ids_to_add: ["1001", "1002"], record_ids_to_remove: [] }
      - title: Swap one member for another
        input: { list_id: "42", record_ids_to_add: ["1003"], record_ids_to_remove: ["1001"] }
    refusals:
      - *list_not_found
    call:
      method: PUT
      path: /crm/v3/lists/{list_id}/memberships/add-and-remove
      body: { recordIdsToAdd: record_ids_to_add, recordIdsToRemove: record_ids_to_remove }
    cost: *cost

  - name: delete_all_list_memberships
    class: sensitive
    description: >-
      Remove every member from a MANUAL or SNAPSHOT list; the list itself and
      its records stay.
    input:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: *list_id
    examples:
      - title: Empty a list
        input: { list_id: "42" }
    refusals:
      - *list_not_found
    confirm:
      summary: "Remove every member from HubSpot list {list_id}."
    call: { method: DELETE, path: "/crm/v3/lists/{list_id}/memberships" }
    cost: *cost

  - name: add_memberships_from_list
    class: write
    description: >-
      Add the members of another list (of the same object type) to a MANUAL
      or SNAPSHOT list, up to 100,000 records.
    input:
      type: object
      additionalProperties: false
      required: [list_id, source_list_id]
      properties:
        list_id: *list_id
        source_list_id: { type: string, pattern: "^[0-9]+$", description: "Id of the list whose members are copied." }
    examples:
      - title: Copy the members of a list
        input: { list_id: "42", source_list_id: "41" }
    refusals:
      - *list_not_found
    call: { method: PUT, path: "/crm/v3/lists/{list_id}/memberships/add-from/{source_list_id}" }
    cost: *cost

  - name: get_record_memberships
    class: read
    description: >-
      List the lists one record belongs to.
    input:
      type: object
      additionalProperties: false
      required: [object_type_id, record_id]
      properties:
        object_type_id: *object_type_id
        record_id: { type: string, pattern: "^[0-9]+$", description: "Record id." }
    examples:
      - title: The lists of a contact
        input: { object_type_id: "0-1", record_id: "1001" }
    call: { method: GET, path: "/crm/v3/lists/records/{object_type_id}/{record_id}/memberships" }
    output: { items: results }
    cost: *cost

exposure:
  mode: per_connector
  tool: hubspot
