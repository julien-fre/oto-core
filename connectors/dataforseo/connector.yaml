  # --- On-page audit ---------------------------------------------------------------------------------------------------
  - name: onpage_instant
    class: read
    description: >-
      Audit one page now: meta tags, headings, content, links, load time and
      the failed checks. Billed 0.00015 USD.
    input:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: &page_url { type: string, format: uri, pattern: "^https?://", description: "The page's absolute URL." }
    examples:
      - title: Audit a home page
        input: { url: "https://example.com/" }
    call: { method: POST, path: /on_page/instant_pages, body: { url: url }, body_list: true }
    output: *envelope
    cost: &page_cost { per: request, quantity: 150, unit: microdollars, settle: *settle }

  - name: onpage_content
    class: read
    description: >-
      A page's content, structured: title, headings, text blocks and tables.
      Billed 0.00015 USD.
    input:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: *page_url
    examples:
      - title: The content of an article
        input: { url: "https://example.com/blog/article" }
    call: { method: POST, path: /on_page/content_parsing/live, body: { url: url }, body_list: true }
    output: *envelope
    cost: *page_cost

  - name: lighthouse
    class: read
    description: >-
      A Lighthouse run of a page: performance, accessibility, best practices
      and SEO scores, with the audits. Billed 0.005 USD.
    input:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: *page_url
        for_mobile: { type: boolean, description: "Run as a mobile device; DataForSEO runs desktop when omitted." }
        categories: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [seo, performance, best_practices, accessibility] }, description: "The categories run; all when omitted." }
    examples:
      - title: Mobile performance of a page
        input: { url: "https://example.com/", for_mobile: true, categories: [performance] }
    call:
      method: POST
      path: /on_page/lighthouse/live/json
      body: { url: url, for_mobile: for_mobile, categories: categories }
      body_list: true
    # The scores and audits, without the page's screenshots (base64 images), the translations, timings, settings and
    # stack packs.
    output: &lighthouse_output
      projection: [cost, tasks]
      strip:
        - tasks.path
        - tasks.data
        - tasks.time
        - tasks.result.i18n
        - tasks.result.timing
        - tasks.result.configSettings
        - tasks.result.stackPacks
        - tasks.result.categoryGroups
        - tasks.result.entities
        - tasks.result.fullPageScreenshot
        - tasks.result.audits.final-screenshot
        - tasks.result.audits.screenshot-thumbnails
      sample: *sample
    cost: { per: request, quantity: 5000, unit: microdollars, settle: *settle }

