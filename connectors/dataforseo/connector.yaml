    output: *envelope
    cost: { per: request, quantity: 24000, unit: microdollars, settle: *settle }

  # --- Search results and local business (not in the client) -----------------------------------------------------------
  - name: serp_organic
    class: read
    description: >-
      Google organic results of a keyword, as Google shows them in one place:
      position (rank_group, rank_absolute), title, URL, domain, and the other
      result types (local pack, featured snippet), without their snippet. depth bounds the
      results, ten a page, each page billed 0.002 USD. location_coordinate
      places the search at a point: "latitude,longitude,radius". When Google
      serves a URL as a google.com/goto redirect (domain google.com),
      breadcrumb and website_name name the site, goto_url_resolve resolves
      it, and serp_organic_post queues the search with every URL resolved.
    input: &serp_organic_input
      type: object
      additionalProperties: false
      required: [keyword]
      allOf:
        - anyOf: [{ required: [location_code] }, { required: [location_name] }, { required: [location_coordinate] }]
        - anyOf: [{ required: [language_code] }, { required: [language_name] }]
      properties:
        keyword: { type: string, minLength: 1, maxLength: 700, description: "The query, as typed in Google." }
        location_code: *location_code
        location_name: *location_name
        location_coordinate: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?,-?[0-9]+(\\.[0-9]+)?(,[0-9]+)?$", description: "A point: \"latitude,longitude,radius\", the radius in millimetres, 199 to 199999." }
        language_code: *language_code
        language_name: *language_name
        depth: { type: integer, minimum: 1, maximum: 200, description: "Results read, up to 200, ten a page; DataForSEO reads 10 when omitted." }
        device: *device
        os: &os { type: string, enum: [windows, macos, android, ios], description: "Operating system of the device: windows or macos on desktop, android or ios on mobile." }
    examples:
      - title: Rank of a keyword in Lyon, 20 results
        input: { keyword: boulangerie, location_name: "Lyon,Auvergne-Rhone-Alpes,France", language_code: fr, depth: 20 }
    call:
      method: POST
      path: /serp/google/organic/live/advanced
      body: &serp_organic_body { keyword: keyword, location_code: location_code, location_name: location_name,
              location_coordinate: location_coordinate, language_code: language_code, language_name: language_name,
              depth: depth, device: device, os: os }
      body_list: true
    # Each result: type, rank_group, rank_absolute, domain, URL, title, rating, breadcrumb and website_name, and for a
    # local pack its phone and cid; without its layout, snippet, sitelinks, images, FAQ, nested elements (a carousel's,
    # a people-also-ask's) and booking link. Google may serve a result's URL as a google.com/goto redirect, its domain
    # then reading google.com: breadcrumb and website_name still name the site shown.
    output: &serp_organic_output
      projection: [cost, tasks]
      strip:
        - tasks.path
        - tasks.data
        - tasks.time
        - tasks.result.check_url
        - tasks.result.refinement_chips
        - tasks.result.items.xpath
        - tasks.result.items.rectangle
        - tasks.result.items.about_this_result
        - tasks.result.items.page
        - tasks.result.items.position
        - tasks.result.items.cache_url
        - tasks.result.items.related_search_url
        - tasks.result.items.is_image
        - tasks.result.items.is_video
        - tasks.result.items.is_featured_snippet
        - tasks.result.items.is_malicious
        - tasks.result.items.is_web_story
        - tasks.result.items.description
        - tasks.result.items.pre_snippet
        - tasks.result.items.extended_snippet
        - tasks.result.items.images
        - tasks.result.items.amp_version
        - tasks.result.items.price
        - tasks.result.items.highlighted
        - tasks.result.items.links
        - tasks.result.items.faq
        - tasks.result.items.extended_people_also_search
        - tasks.result.items.related_result
        - tasks.result.items.timestamp
        - tasks.result.items.text
        - tasks.result.items.booking_url
        - tasks.result.items.items
      sample: *sample
    cost: { per: request, quantity: 40000, unit: microdollars, settle: *settle }

  - name: serp_organic_post
    class: write
    act: false
    description: >-
      Ask DataForSEO for the Google organic results of a keyword in its
      standard queue: every URL resolved to its site, where serp_organic, in
      live mode, may leave google.com/goto redirects. Returns the task id
      (tasks.0.id): read the results with serp_organic_get once ready (under
      a minute, at times longer). depth bounds the results, ten a page, each
      page billed 0.0006 USD. location_coordinate places the search at a
      point: "latitude,longitude,radius".
    input: *serp_organic_input
    examples:
      - title: Rank of a keyword in Lyon, 20 results, queued
        input: { keyword: boulangerie, location_name: "Lyon,Auvergne-Rhone-Alpes,France", language_code: fr, depth: 20 }
    call:
      method: POST
      path: /serp/google/organic/task_post
      body: *serp_organic_body
      body_list: true
    output: *envelope
    cost: { per: request, quantity: 12000, unit: microdollars, settle: *settle }

  - name: serp_organic_get
    class: read
    description: >-
      The Google organic results a serp_organic_post task collected, as
      serp_organic returns them. While the task runs, refused as
      task_not_ready: read again later. Free.
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: *task_id
    examples:
      - title: The results of a task
        input: { task_id: "11111111-1111-1111-1111-111111111111" }
    call: { method: GET, path: "/serp/google/organic/task_get/advanced/{task_id}" }
    output: *serp_organic_output

  - name: goto_url_resolve
    class: read
    description: >-
      The site URL behind Google redirects (https://google.com/goto?url=...)
      that serp_organic could not resolve: each goto URL with its url. Free.
    input:
      type: object
      additionalProperties: false
      required: [goto_urls]
      properties:
        goto_urls:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, pattern: "^https://(www\\.)?google\\.[a-z.]+/goto\\?" }
          description: "The goto URLs, as serp_organic returns them; up to 200, the results of one search."
    examples:
      - title: Resolve two goto URLs
        input: { goto_urls: ["https://google.com/goto?url=CAESUgHrOzAV", "https://google.com/goto?url=CAESZQHrOzAV"] }
    call:
      method: POST
      path: /appendix/goto_url_converter
      body: { goto_urls: goto_urls }
      body_list: true
    output: *envelope

  - name: serp_maps
    class: read
    description: >-
      Google Maps results of a keyword at a place: rank, title, domain, URL,
      rating, address, phone, category, place_id, cid, latitude and longitude.
      location_coordinate places the search at a point with a zoom:
      "latitude,longitude,zoom", such as "45.764,4.835,15z"; a grid of points
      around a business gives its local visibility. depth bounds the results,
      a hundred a page, each page billed 0.002 USD.
    input:
      type: object
      additionalProperties: false
      required: [keyword]
      allOf:
        - anyOf: [{ required: [location_code] }, { required: [location_name] }, { required: [location_coordinate] }]
        - anyOf: [{ required: [language_code] }, { required: [language_name] }]
      properties:
        keyword: { type: string, minLength: 1, maxLength: 700, description: "The query, as typed in Google Maps." }
        location_code: *location_code
        location_name: *location_name
        location_coordinate: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?,-?[0-9]+(\\.[0-9]+)?(,([3-9]|1[0-9]|2[01])z)?$", description: "A point and a zoom: \"latitude,longitude,zoom\", the zoom 3z to 21z, DataForSEO's 17z when omitted." }
        language_code: *language_code
        language_name: *language_name
        depth: { type: integer, minimum: 1, maximum: 700, description: "Results read, up to 700, a hundred a page; DataForSEO reads 100 when omitted." }
        device: *device
        os: *os
    examples:
      - title: Bakeries around a point in Lyon
        input: { keyword: boulangerie, location_coordinate: "45.764,4.835,15z", language_code: fr, depth: 20 }
    call:
      method: POST
      path: /serp/google/maps/live/advanced
      body: { keyword: keyword, location_code: location_code, location_name: location_name,
              location_coordinate: location_coordinate, language_code: language_code, language_name: language_name,
              depth: depth, device: device, os: os }
      body_list: true
    # Each place: rank, title, domain, URL, rating, address, phone, category, place_id, cid, latitude, longitude,
    # is_claimed; without its images, booking and contribution links, hours, rating distribution and the copies of
    # its address. A grid of points stays small.
    output: &serp_maps_output
      projection: [cost, tasks]
      strip:
        - tasks.path
        - tasks.data
        - tasks.time
        - tasks.result.check_url
        - tasks.result.refinement_chips
        - tasks.result.items.original_title
        - tasks.result.items.contact_url
        - tasks.result.items.contributor_url
        - tasks.result.items.book_online_url
        - tasks.result.items.rating_distribution
        - tasks.result.items.snippet
        - tasks.result.items.address_info
        - tasks.result.items.main_image
        - tasks.result.items.total_photos
        - tasks.result.items.additional_categories
        - tasks.result.items.category_ids
        - tasks.result.items.work_hours
        - tasks.result.items.feature_id
        - tasks.result.items.local_justifications
        - tasks.result.items.is_directory_item
        - tasks.result.items.price_level
        - tasks.result.items.hotel_rating
      sample: *sample
    cost: { per: request, quantity: 14000, unit: microdollars, settle: *settle }

