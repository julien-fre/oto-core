      rank, spam score, top TLDs and link types.
    input:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: *domain_or_page
    examples:
      - title: The link profile of a domain
        input: { target: example.com }
    call: { method: POST, path: /backlinks/summary/live, body: { target: target }, body_list: true }
    # Without the breakdowns by TLD, link type and attribute, platform, place in the page and country.
    output: &backlinks_summary_output
      projection: [cost, tasks]
      strip:
        - tasks.path
        - tasks.data
        - tasks.time
        - tasks.result.referring_links_tld
        - tasks.result.referring_links_types
        - tasks.result.referring_links_attributes
        - tasks.result.referring_links_platform_types
        - tasks.result.referring_links_semantic_locations
        - tasks.result.referring_links_countries
