  - name: llm_response
    class: read
    description: >-
      Ask an AI model a question and get its answer, with the sources it cites.
      engine: chat_gpt, claude, gemini or perplexity; model_name from
      llm_models. Billed 0.0006 USD plus the model's tokens.
    input:
      type: object
      additionalProperties: false
      required: [engine, user_prompt, model_name]
      properties:
        engine: &engine { type: string, enum: [chat_gpt, claude, gemini, perplexity], description: "The AI engine." }
        user_prompt: { type: string, minLength: 1, maxLength: 500, description: "The question, up to 500 characters." }
        model_name: { type: string, minLength: 1, description: "A model of the engine, from llm_models." }
        web_search: { type: boolean, description: "Whether the model searches the web before answering." }
        web_search_country_iso_code: { type: string, pattern: "^[A-Z]{2}$", description: "Country of the web search, two capital letters: FR, US." }
        max_output_tokens: { type: integer, minimum: 16, maximum: 4096, description: "Bound on the answer's length, in tokens." }
    examples:
      - title: Ask a question with web search
        input: { engine: chat_gpt, user_prompt: "Which CRM fits a small agency?", model_name: gpt-4o-mini, web_search: true }
    call:
      method: POST
      path: "/ai_optimization/{engine}/llm_responses/live"
      body: { user_prompt: user_prompt, model_name: model_name, web_search: web_search,
              web_search_country_iso_code: web_search_country_iso_code, max_output_tokens: max_output_tokens }
      body_list: true
    output: *envelope
    cost: { per: request, quantity: 200000, unit: microdollars, settle: *settle }

