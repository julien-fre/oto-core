        location_code: *location_code
        location_name: *location_name
        location_coordinate: *business_point
        language_code: *language_code
        language_name: *language_name
        depth: { type: integer, minimum: 1, maximum: 500, description: "Reviews read, up to 500 (DataForSEO takes 4490), billed by ten; DataForSEO reads 10 when omitted: give 20 for the usual read." }
        sort_by: { type: string, enum: [newest, highest_rating, lowest_rating, relevant], description: "Order of the reviews; DataForSEO takes relevant when omitted." }
