      path: /backlinks/referring_domains/live
      body: &backlinks_list_body { target: target, limit: limit, offset: offset, filters: filters, order_by: order_by }
      body_list: true
    # Each row without the same breakdowns.
    output: &backlinks_rows_output
      projection: [cost, tasks]
      strip:
        - tasks.path
        - tasks.data
        - tasks.time
        - tasks.result.items.referring_links_tld
        - tasks.result.items.referring_links_types
        - tasks.result.items.referring_links_attributes
        - tasks.result.items.referring_links_platform_types
