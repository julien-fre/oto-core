# yaml-language-server: $schema=../connector.schema.json
# DataForSEO: SEO data as JSON (https://dataforseo.com), REST API v3. The values come from the Python client,
# oto.tools.dataforseo, which this description follows for every method of the client: same function name, same
# endpoint, same argument names, same keys sent. The client is not changed (tests/test_dataforseo_description.py reads
# it to keep both equal). Eight functions the client has not are added: serp_organic, serp_maps, my_business_info,
# Google reviews as two plain functions, google_reviews_post then google_reviews_get by the task id (the caller polls;
# no async mode), the organic results in the standard queue the same way (serp_organic_post then serp_organic_get), and
# goto_url_resolve. Use case: local-visibility grid around a business, rank tracking on a keyword list.
#
# Organic URLs: since November 2026 Google slows the resolution of its google.com/goto redirects, and DataForSEO no
# longer resolves them all in live mode (support answer of 12/11/2026, and its note "New goto URL limits and how this
# affects your results"): serp_organic may return goto URLs whose domain reads google.com. The standard queue resolves
# them all (serp_organic_post, measured on 12/11/2026), and goto_url_resolve, free, resolves the rest.
#
# Request: every POST endpoint takes a bare JSON array of task objects; the client sends one task, the description too
# (call.body_list, rule 23). An argument the call does not give is not sent: DataForSEO applies its own default, as
# with the client, which drops the keys set to None.
#
# Errors live in the body: DataForSEO answers HTTP 200 with a five-digit status_code at two levels, the request
# (status_code) and its task (tasks.0.status_code), 20000 meaning ok and 20100 a queued task created. The error table
# reads both levels under 200, then the HTTP statuses DataForSEO also uses (a refused login is a 401 whose body says
# 40100). The codes are those of GET /appendix/errors, read on 2026-11-11, by class:
# - key_refused 40100 (marks the account), account_not_verified 40104;
# - access_denied 40201 (account paused), 40204 (API not in the plan), 40207 (IP not allowed), 40208;
# - balance_exhausted 40200, 40210 (marks the account); cost_limit_reached 40203 (the account's own cap);
# - rate_limited 40202, 40209 (retryable); duplicate_limit 40205, 40206;
# - upstream_failed 40101, 40103 (retryable); no_results 40102, 40405;
# - not_found 40105, 40400 to 40404, 40406; task_not_ready 40601, 40602 (retryable: read the task again later);
# - invalid_request 40000 to 40006, 40407, 40408, 40501 to 40506;
# - upstream_unavailable 50000, 50001, 50100, 50301 to 50304, 50401, 50402 (retryable).
# 40106 (partial results, not billed) and 40007 (a notice) stay a success. A code DataForSEO adds later is not
# refused: the answer is served as is, its status_code and status_message in tasks.
# Deviation from the client: the client reads 40102 (no search results) as a 403; here it is no_results.
#
# Cost: each answer says in cost what the call was billed, in USD, a decimal (0.0054). The quantity is counted in
# microdollars (a millionth of a USD): settle reads cost and multiplies it by 1000000 (settle.scale), rounded up. The
# worst case of each function is its list price at its largest arguments, from the account's price list read on
# 2026-11-11 (GET /appendix/user_data, price), priority normal:
# - Labs (dataforseo_labs/google): 0.012 a request plus 0.00012 a result; historical_rank_overview 0.12 plus 0.0012;
#   a list of up to 1000 rows is 132000 (limit is required, at most 1000);
# - Backlinks and content analysis: 0.024 a request plus 0.000036 a result;
# - Google Ads search volume 0.09; ai_keyword_data 0.01 plus 0.0001 a result; LLM mentions 0.1 plus 0.001 a result;
# - LLM responses 0.0006 plus the model's tokens, unbounded by the price list: 200000 assumed;
# - technologies 0.012, plus 0.0012 a result for the lists (limit at most 1000, where the API takes 10000);
# - on-page: a page 0.00015 (instant, content parsing, each crawled page), Lighthouse 0.005, the crawl reports free;
# - SERP live advanced 0.002 a page of results (organic: ten results a page; Maps: a hundred); organic in the standard
#   queue 0.0006 a page (task_post, measured on 12/11/2026), the read free; goto_url_resolve free (support answer);
# - my_business_info 0.0054; reviews 0.00075 a ten reviews at posting (depth capped at 500: 37500), the read free.
# Estimates, not in the account's price list: Google Trends 20000, Google AI Mode 10000, LLM responses 200000. A call billed more
# than its worst case is settled as read and reported, as the format says.
#
# Probe: user_data, free, reads the balance (money.balance, USD).
#
# Output: the answer without its echo of the request (tasks.data, tasks.path) and its timings, the request's own cost
# and the tasks kept, each with its status_code and cost. A view an agent reads in a loop (a grid of Maps searches):
# the SERP results, places, profile and reviews without their layout, snippets, images, booking and contribution
# links, hours and copies of the address; the Labs keywords without their per-month series, SERP snapshot and
# normalised volumes; the link profiles without their breakdowns; Lighthouse without its screenshots; the account
# without its per-endpoint tables (prices, rate and spend limits, statistics). The format removes named keys only
# (output.strip): a key DataForSEO adds later is served. Google Ads and AI search volumes keep their monthly series,
# which they are read for.
#
# Not described here, left to the hand-written client and its backend tool:
# - options, a free map merged into each task: every documented field the function does not name is out of reach;
# - full, the backend's switch between a trimmed and a raw answer;
# - the location and language given as one argument that may be a code or a name: here location_code or
#   location_name, language_code or language_name;
# - the locations search of the backend (a text filter, the first 50): labs_locations_and_languages answers the whole
#   list.
connector:
  name: dataforseo
  label: DataForSEO
  namespace: dataforseo
  version: 1.0.4
  api_version: v3
  base_url: https://api.dataforseo.com/v3
  auth: { kind: basic, username: login, password: password }
  credential:
    - { name: login, label: API login, secret: false }
    - { name: password, label: API password, secret: true }
  modes: [byo_user, byo_org, platform]
  # The client's read timeout: Labs and backlinks live calls can take about 30 seconds.
  timeout_s: 90
  probe: { function: user_data, balance: { path: tasks.0.result.0.money.balance, min: 1, unit: USD } }
  errors:
    # --- The request's status, under HTTP 200 -------------------------------------------------------------------------
    - { status: 200, body: { path: status_code, equals: [40100] }, code: key_refused, retryable: false,
        marks_account: credential_rejected,
        message: "DataForSEO refused the API login and password: check them in the DataForSEO dashboard, API Access." }
    - { status: 200, body: { path: status_code, equals: [40200, 40210] }, code: balance_exhausted, retryable: false,
        marks_account: quota_exhausted,
        message: "The DataForSEO balance of this account is too low. The call was correct: do not change it nor retry it." }
    - { status: 200, body: { path: status_code, equals: [40104] }, code: account_not_verified, retryable: false,
        message: "The DataForSEO account is not verified yet: verify it in the DataForSEO dashboard." }
    - { status: 200, body: { path: status_code, equals: [40201, 40204, 40207, 40208] }, code: access_denied, retryable: false,
        message: "DataForSEO denied this account access to this API (plan, IP allow-list or a paused account)." }
    - { status: 200, body: { path: status_code, equals: [40203] }, code: cost_limit_reached, retryable: false,
        message: "The cost limit set on this DataForSEO account is reached: raise it in the dashboard, API settings." }
    - { status: 200, body: { path: status_code, equals: [40202, 40209] }, code: rate_limited, retryable: true,
        message: "DataForSEO rate limit reached: retry later." }
    - { status: 200, body: { path: status_code, equals: [40205, 40206] }, code: duplicate_limit, retryable: false,
        message: "The duplicate task limit of this DataForSEO account is reached: the same task was sent too often." }
    - { status: 200, body: { path: status_code, equals: [40101, 40103] }, code: upstream_failed, retryable: true,
        message: "DataForSEO could not complete the task: retry it." }
    - { status: 200, body: { path: status_code, equals: [40102, 40405] }, code: no_results, retryable: false,
        message: "DataForSEO found no results for this request." }
    - { status: 200, body: { path: status_code, equals: [40105, 40400, 40401, 40402, 40403, 40404, 40406] },
        code: not_found, retryable: false, message: "DataForSEO found nothing there: unknown or expired task, or no data." }
    - { status: 200, body: { path: status_code, equals: [40601, 40602] }, code: task_not_ready, retryable: true,
        message: "The DataForSEO task is not done yet: read it again later." }
    - { status: 200, body: { path: status_code, equals: [40000, 40001, 40002, 40003, 40004, 40005, 40006, 40407, 40408,
                                                        40501, 40502, 40503, 40504, 40505, 40506] },
        code: invalid_request, retryable: false,
        message: "DataForSEO rejected the request as invalid: check the arguments (its status_message says which)." }
    - { status: 200, body: { path: status_code, equals: [50000, 50001, 50100, 50301, 50302, 50303, 50304, 50401, 50402] },
        code: upstream_unavailable, retryable: true, message: "DataForSEO is temporarily unavailable: retry later." }
    # --- The task's status, under HTTP 200 ----------------------------------------------------------------------------
    - { status: 200, body: { path: tasks.0.status_code, equals: [40100] }, code: key_refused, retryable: false,
        marks_account: credential_rejected,
        message: "DataForSEO refused the API login and password: check them in the DataForSEO dashboard, API Access." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40200, 40210] }, code: balance_exhausted, retryable: false,
        marks_account: quota_exhausted,
        message: "The DataForSEO balance of this account is too low. The call was correct: do not change it nor retry it." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40104] }, code: account_not_verified, retryable: false,
        message: "The DataForSEO account is not verified yet: verify it in the DataForSEO dashboard." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40201, 40204, 40207, 40208] }, code: access_denied,
        retryable: false,
        message: "DataForSEO denied this account access to this API (plan, IP allow-list or a paused account)." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40203] }, code: cost_limit_reached, retryable: false,
        message: "The cost limit set on this DataForSEO account is reached: raise it in the dashboard, API settings." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40202, 40209] }, code: rate_limited, retryable: true,
        message: "DataForSEO rate limit reached: retry later." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40205, 40206] }, code: duplicate_limit, retryable: false,
        message: "The duplicate task limit of this DataForSEO account is reached: the same task was sent too often." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40101, 40103] }, code: upstream_failed, retryable: true,
        message: "DataForSEO could not complete the task: retry it." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40102, 40405] }, code: no_results, retryable: false,
        message: "DataForSEO found no results for this request." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40105, 40400, 40401, 40402, 40403, 40404, 40406] },
        code: not_found, retryable: false, message: "DataForSEO found nothing there: unknown or expired task, or no data." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40601, 40602] }, code: task_not_ready, retryable: true,
        message: "The DataForSEO task is not done yet: read it again later." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [40000, 40001, 40002, 40003, 40004, 40005, 40006, 40407,
                                                              40408, 40501, 40502, 40503, 40504, 40505, 40506] },
        code: invalid_request, retryable: false,
        message: "DataForSEO rejected the request as invalid: check the arguments (its status_message says which)." }
    - { status: 200, body: { path: tasks.0.status_code, equals: [50000, 50001, 50100, 50301, 50302, 50303, 50304, 50401,
                                                              50402] },
        code: upstream_unavailable, retryable: true, message: "DataForSEO is temporarily unavailable: retry later." }
    # --- HTTP statuses ------------------------------------------------------------------------------------------------
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "DataForSEO refused the API login and password: check them in the DataForSEO dashboard, API Access." }
    - { status: 402, code: balance_exhausted, retryable: false, marks_account: quota_exhausted,
        message: "The DataForSEO balance of this account is too low. The call was correct: do not change it nor retry it." }
    - { status: 403, code: access_denied, retryable: false,
        message: "DataForSEO denied this account access to this API (plan, IP allow-list or a paused account)." }
    - { status: 404, code: not_found, retryable: false, message: "DataForSEO found nothing there: unknown path or task." }
    - { status: [400, 422], code: invalid_request, retryable: false,
        message: "DataForSEO rejected the request as invalid: check the arguments." }
    - { status: 429, code: rate_limited, retryable: true, message: "DataForSEO rate limit reached: retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "DataForSEO is temporarily unavailable: retry later." }

functions:
  # --- Account ---------------------------------------------------------------------------------------------------------
  - name: user_data
    class: read
    description: >-
      The DataForSEO account: login, timezone, balance (money.balance, in
      USD), total deposited (money.total) and subscription expiry dates. Free.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The account and its balance
        input: {}
    call: { method: GET, path: /appendix/user_data }
    # Without the per-endpoint tables, some 230 kB: the price list (price), the rate limits and their use (rates), the
    # spend limits and statistics (money.limits, money.statistics).
    output:
      projection: [cost, tasks]
      strip: [tasks.path, tasks.data, tasks.time, tasks.result.price, tasks.result.rates, tasks.result.money.limits,
              tasks.result.money.statistics]
      sample:
        status_code: 20000
        cost: 0
        tasks:
          - id: "11111111-1111-1111-1111-111111111111"
            status_code: 20000
            cost: 0
            time: "0.1 sec."
            path: [v3, appendix, user_data]
            data: { api: appendix, function: user_data }
            result: [{ login: login-0, money: { total: 50, balance: 10.5, limits: { day: {} }, statistics: { day: {} } },
                       rates: { limits: { day: {} } }, price: { serp: {} } }]

  - name: labs_locations_and_languages
    class: read
    description: >-
      Every location (location_code, location_name, country) with its
      languages (language_code, language_name) that the Labs functions accept.
      The whole list, long: read the code once and reuse it. Free.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The locations and languages of Labs
        input: {}
    call: { method: GET, path: /dataforseo_labs/locations_and_languages }
    output: &envelope
      projection: [cost, tasks]
      strip: [tasks.path, tasks.data, tasks.time]
      sample: &sample
        version: "0.1.20261111"
        status_code: 20000
        status_message: Ok.
        time: "0.1 sec."
        cost: 0.0126
        tasks_count: 1
        tasks_error: 0
        tasks:
          - id: "11111111-1111-1111-1111-111111111111"
            status_code: 20000
            status_message: Ok.
            time: "0.1 sec."
            cost: 0.0126
            result_count: 1
            path: [v3, example, live]
            data: { api: example, function: live, keyword: alpha }
            # One result of each shape the functions trim: a SERP, a Labs list, a link profile, a Lighthouse run.
            result:
              - check_url: "https://www.example.test/search?q=alpha"
                refinement_chips: { items: [] }
                items_count: 4
                items:
                  - { type: organic, rank_group: 1, rank_absolute: 1, page: 1, position: left, xpath: "/html[1]/body[1]",
                      rectangle: null, about_this_result: null, domain: example.test, title: Alpha,
                      url: "https://example.test/", cache_url: null, related_search_url: null, breadcrumb: example.test,
                      website_name: Alpha, is_image: false, is_video: false, is_featured_snippet: false,
                      is_malicious: false, is_web_story: false, description: Alpha bakery., pre_snippet: null,
                      extended_snippet: null, images: null, amp_version: false, rating: null, price: null,
                      highlighted: [], links: null, faq: null, extended_people_also_search: null,
                      related_result: null, timestamp: null }
                  - { type: local_pack, rank_group: 1, rank_absolute: 2, title: Alpha, booking_url: null, cid: "0" }
                  - { type: ai_overview, rank_group: 1, rank_absolute: 3, text: Alpha., items: [] }
                  - { type: maps_search, rank_group: 1, rank_absolute: 1, domain: example.test, title: Alpha,
                      original_title: null, url: "https://example.test/", contact_url: null, contributor_url: null,
                      book_online_url: null, rating: { value: 4.5, votes_count: 10 }, rating_distribution: { "5": 10 },
                      snippet: 1 rue Alpha, address: 1 rue Alpha, address_info: { city: Alpha }, place_id: p-0,
                      phone: "+33 0", main_image: null, total_photos: 1, category: Bakery, additional_categories: null,
                      category_ids: [bakery], work_hours: { timetable: null }, feature_id: f-0, cid: "0",
                      latitude: 0.1, longitude: 0.1, is_claimed: true, local_justifications: null,
                      is_directory_item: false, price_level: null, hotel_rating: null, logo: null,
                      people_also_search: [], popular_times: null, local_business_links: [], directory: null }
                  - { type: google_reviews_search, rank_group: 1, rank_absolute: 1, position: right, review_text: Good.,
                      original_review_text: null, original_owner_answer: null, profile_url: null,
                      profile_image_url: null, review_url: null, images: null, owner_time_ago: null }
              - items_count: 3
                referring_links_tld: { test: 1 }
                referring_links_types: { anchor: 1 }
                referring_links_attributes: { nofollow: 1 }
                referring_links_platform_types: { blogs: 1 }
                referring_links_semantic_locations: { article: 1 }
                referring_links_countries: { FR: 1 }
                items:
                  - { keyword: alpha, keyword_info: { search_volume: 10, monthly_searches: [], categories: [1] },
                      clickstream_keyword_info: null, keyword_info_normalized_with_bing: null,
                      keyword_info_normalized_with_clickstream: null, serp_info: null, avg_backlinks_info: null }
                  - keyword_data: { keyword: alpha, keyword_info: { search_volume: 10, monthly_searches: [], categories: [1] },
                                    clickstream_keyword_info: null, keyword_info_normalized_with_bing: null,
                                    keyword_info_normalized_with_clickstream: null, serp_info: null,
                                    avg_backlinks_info: null }
                    ranked_serp_element: { check_url: "https://www.example.test/search?q=alpha",
                                           serp_item: { type: organic, xpath: "/html[1]", links: null, faq: null } }
                  - { type: referring_domain, domain: example.test, referring_links_tld: { test: 1 },
                      referring_links_types: { anchor: 1 }, referring_links_attributes: { nofollow: 1 },
                      referring_links_platform_types: { blogs: 1 }, referring_links_semantic_locations: { article: 1 },
                      referring_links_countries: { FR: 1 } }
              - { finalUrl: "https://example.test/", categories: { seo: { score: 0.9 } },
                  audits: { final-screenshot: { details: null }, screenshot-thumbnails: { details: null } },
                  i18n: {}, timing: {}, configSettings: {}, stackPacks: [], categoryGroups: {}, entities: [],
                  fullPageScreenshot: null }


  # --- Keywords --------------------------------------------------------------------------------------------------------
  - name: keyword_overview
    class: read
    description: >-
      Search volume, CPC, competition, search intent, keyword difficulty and
      the monthly trend of up to 700 keywords, in one location and language
      (Google, DataForSEO Labs). Billed 0.012 USD plus 0.00012 a keyword.
    input:
      type: object
      additionalProperties: false
      required: [keywords]
      allOf: &location_and_language_required
        - anyOf: [{ required: [location_code] }, { required: [location_name] }]
        - anyOf: [{ required: [language_code] }, { required: [language_name] }]
      properties:
        keywords: { type: array, minItems: 1, maxItems: 700, items: &keyword { type: string, minLength: 1 },
                    description: "The keywords, up to 700." }
        location_code: &location_code { type: integer, minimum: 1, description: "DataForSEO location code: 2250 France, 2840 United States (labs_locations_and_languages)." }
        location_name: &location_name { type: string, minLength: 1, description: "DataForSEO location name, in place of location_code: France, United States." }
        language_code: &language_code { type: string, pattern: "^[A-Za-z]{2,3}(-[A-Za-z]{2,4})?$", description: "Language code: fr, en, pt." }
        language_name: &language_name { type: string, minLength: 1, description: "Language name, in place of language_code: French, English." }
    examples:
      - title: Three keywords in France, in French
        input: { keywords: [boulangerie, boulangerie bio, pain au levain], location_code: 2250, language_code: fr }
    call:
      method: POST
      path: /dataforseo_labs/google/keyword_overview/live
      body: { keywords: keywords, location_code: location_code, location_name: location_name,
              language_code: language_code, language_name: language_name }
      body_list: true
    # Each keyword without its per-month series (monthly_searches: search_volume_trend sums it up), its SERP snapshot
    # (serp_info), its category ids, backlink averages and the volumes normalised with other sources.
    output: &labs_keywords_output
      projection: [cost, tasks]
      strip:
        - tasks.path
        - tasks.data
        - tasks.time
        - tasks.result.items.keyword_info.monthly_searches
        - tasks.result.items.keyword_info.categories
        - tasks.result.items.clickstream_keyword_info
        - tasks.result.items.keyword_info_normalized_with_bing
        - tasks.result.items.keyword_info_normalized_with_clickstream
        - tasks.result.items.serp_info
        - tasks.result.items.avg_backlinks_info
      sample: *sample
    cost: { per: request, quantity: 96000, unit: microdollars, settle: &settle { path: cost, scale: 1000000 } }

  - name: keyword_ideas
    class: read
    description: >-
      Keywords of the same category as up to 200 seed keywords, with their
      volume, CPC and difficulty (Google, DataForSEO Labs). Billed per keyword
      returned: limit bounds the cost. filters and order_by use the DataForSEO
      syntax: [["keyword_info.search_volume", ">", 100]], ["keyword_info.search_volume,desc"].
    input:
      type: object
      additionalProperties: false
      required: [keywords, limit]
      anyOf: &location_required
        - required: [location_code]
        - required: [location_name]
      properties:
        keywords: { type: array, minItems: 1, maxItems: 200, items: *keyword, description: "The seed keywords, up to 200." }
        location_code: *location_code
        location_name: *location_name
        language_code: *language_code
        language_name: *language_name
        limit: &limit { type: integer, minimum: 1, maximum: 1000, description: "Rows returned, at most 1000; each row is billed." }
        offset: &offset { type: integer, minimum: 0, description: "Rows skipped, to read the next rows." }
        filters: &filters { type: array, minItems: 1, description: "DataForSEO filters: [field, operator, value], combined with \"and\" or \"or\": [[\"keyword_info.search_volume\", \">\", 100]]." }
        order_by: &order_by { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 1 }, description: "Sort rules, \"field,asc\" or \"field,desc\", up to 3." }
    examples:
      - title: Ideas around a seed, 50 rows
        input: { keywords: [boulangerie], location_code: 2250, language_code: fr, limit: 50 }
    call:
      method: POST
      path: /dataforseo_labs/google/keyword_ideas/live
      body: &labs_list_body { keywords: keywords, location_code: location_code, location_name: location_name,
                              language_code: language_code, language_name: language_name, limit: limit, offset: offset,
                              filters: filters, order_by: order_by }
      body_list: true
    output: *labs_keywords_output
    cost: &labs_list_cost { per: request, quantity: 132000, unit: microdollars, settle: *settle }

  - name: keyword_suggestions
    class: read
    description: >-
      Long-tail queries that contain the seed keyword, with their volume, CPC
      and difficulty (Google, DataForSEO Labs). Billed per keyword returned:
      limit bounds the cost.
    input:
      type: object
      additionalProperties: false
      required: [keyword, limit]
      properties:
        keyword: &seed { type: string, minLength: 1, description: "The keyword." }
        location_code: *location_code
        location_name: *location_name
        language_code: *language_code
        language_name: *language_name
        limit: *limit
        offset: *offset
        filters: *filters
        order_by: *order_by
    examples:
      - title: Queries containing a keyword, 100 rows
