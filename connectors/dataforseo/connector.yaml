  - name: technologies_summary
    class: read
    description: >-
      How many domains use technologies, or match keywords, by country,
      language and co-used technology.
    input:
      type: object
      additionalProperties: false
      anyOf: *technologies_or_keywords
      properties:
        technologies: *technologies
        keywords: *site_keywords
        filters: *filters
    examples:
      - title: Where a technology is used
        input: { technologies: [Shopify] }
    call:
      method: POST
