  - name: google_reviews_post
    class: write
    act: false
    description: >-
      Ask DataForSEO for the Google reviews of a business, given by name
      (keyword), cid or place_id. Returns the task id (tasks.0.id): read the
      reviews with google_reviews_get, once ready (a few seconds to minutes).
      depth bounds the reviews, billed 0.00075 USD a ten.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - required: [keyword]
        - required: [cid]
        - required: [place_id]
      allOf:
