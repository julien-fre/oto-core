  - name: backlinks_intersection
    class: read
    description: >-
      The referring domains that link to every target (up to 20) and to none
      of exclude_targets (up to 10): competitors as targets and one's own site
      excluded give link prospects. targets is keyed by rank, from "1":
      {"1": "example.org", "2": "example.net"}. Billed per domain returned:
      limit bounds the cost.
    input:
      type: object
      additionalProperties: false
      required: [targets, limit]
      properties:
        targets:
          type: object
          minProperties: 1
          maxProperties: 20
          propertyNames: { pattern: "^([1-9]|1[0-9]|20)$" }
          additionalProperties: *domain_or_page
          description: "The targets, keyed \"1\" to \"20\"."
        exclude_targets: { type: array, minItems: 1, maxItems: 10, items: *domain_or_page, description: "Domains or pages the referring domains must not link to, up to 10." }
        limit: *limit
        offset: *offset
        filters: *filters
        order_by: *order_by
