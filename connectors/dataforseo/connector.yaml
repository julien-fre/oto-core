    cost: &backlinks_cost { per: request, quantity: 60000, unit: microdollars, settle: *settle }

  - name: backlinks_list
    class: read
    description: >-
      The backlinks of a target: source URL, anchor, dofollow, rank, first and
      last seen. mode: as_is (DataForSEO's default), one_per_domain or
      one_per_anchor. Billed per backlink returned: limit bounds the cost.
    input:
      type: object
      additionalProperties: false
      required: [target, limit]
      properties:
        target: *domain_or_page
        mode: { type: string, enum: [as_is, one_per_domain, one_per_anchor], description: "Grouping of the backlinks." }
        limit: *limit
        offset: *offset
        filters: *filters
        order_by: *order_by
    examples:
      - title: One backlink per referring domain
        input: { target: example.com, mode: one_per_domain, limit: 100 }
    call:
      method: POST
      path: /backlinks/backlinks/live
      body: { target: target, mode: mode, limit: limit, offset: offset, filters: filters, order_by: order_by }
      body_list: true
    output: *envelope
    cost: *backlinks_cost

