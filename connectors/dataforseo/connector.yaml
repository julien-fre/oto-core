      path: /ai_optimization/llm_mentions/search_mentions/live
      body: { target: targets, platform: platform, location_code: location_code, location_name: location_name,
              language_code: language_code, language_name: language_name, limit: limit, offset: offset,
              filters: filters, order_by: order_by }
      body_list: true
    output: *envelope
    cost: &mentions_list_cost { per: request, quantity: 1100000, unit: microdollars, settle: *settle }

