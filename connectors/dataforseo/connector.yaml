  - name: llm_mentions_search
    class: read
    description: >-
      The AI answers (question, answer, sources) that mention the targets: a
      domain or a keyword each. platform: google (AI Overviews) or chat_gpt
      (United States, English only); none, both. Billed 0.1 USD plus 0.001 an
      answer returned: limit bounds the cost.
    input:
      type: object
      additionalProperties: false
      required: [targets, limit]
      properties:
        targets: &mention_targets
          type: array
          minItems: 1
          maxItems: 10
          description: "The target entities, up to 10: {\"domain\": \"example.com\"} or {\"keyword\": \"crm\"}."
          items:
            type: object
            additionalProperties: false
            oneOf: [{ required: [domain] }, { required: [keyword] }]
            properties:
              domain: { type: string, minLength: 1, description: "A domain without scheme nor www." }
              keyword: { type: string, minLength: 1, description: "A keyword or a brand." }
              search_filter: { type: string, enum: [include, exclude], description: "Whether the answers must or must not mention it." }
              search_scope: { type: array, minItems: 1, items: { type: string, enum: [any, question, answer, brand_entities, fan_out_queries, sources, search_results] }, description: "Where to look for it." }
              match_type: { type: string, enum: [word_match, partial_match], description: "How a keyword matches." }
        platform: &platform { type: string, enum: [google, chat_gpt], description: "google (AI Overviews) or chat_gpt; omitted, both." }
        location_code: *location_code
        location_name: *location_name
        language_code: *language_code
        language_name: *language_name
        limit: *limit
        offset: *offset
        filters: *filters
        order_by: *order_by
    examples:
      - title: AI answers that mention a domain
        input: { targets: [{ domain: example.com }], platform: google, location_code: 2840, language_code: en, limit: 20 }
