# yaml-language-server: $schema=../connector.schema.json
# Google Calendar API v3 reference: https://developers.google.com/workspace/calendar/api/v3/reference
# The calendars of one signed-in person (delegated access): their own and the
# ones shared with them. Every call sees exactly what that person sees.
# The access token comes from the person's consent (OAuth 2.0 authorization
# code), with the OAuth application of the host or of the organization.
# access_type=offline and prompt=consent bring a refresh token at each consent;
# Google does not rotate it. Incremental authorization (include_granted_scopes)
# is not asked for: a consent at level read never inherits a broader scope
# granted earlier to the same application.
# Two access levels: read (calendar.readonly) and full (calendar).
# send_updates is required on every write: whether guests get an email is
# decided at each call, never left to a default.
# Out of this file: a Google Meet link on a new event (its request needs a new
# random id at each call, which a constant cannot carry).
connector:
  name: google_calendar
  label: Google Calendar
  namespace: google_calendar
  version: 1.0.0
  api_version: v3
  base_url: https://www.googleapis.com/calendar/v3
  auth:
    kind: oauth2_user
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_auth: body
    access_levels:
      read: { scopes: ["https://www.googleapis.com/auth/calendar.readonly"] }
      full: { scopes: ["https://www.googleapis.com/auth/calendar"] }
    scope_implies:
      "https://www.googleapis.com/auth/calendar": ["https://www.googleapis.com/auth/calendar.readonly"]
    authorize_params: { access_type: offline, prompt: select_account consent }
    pkce: S256
    refresh: refresh_token
    rotates: false
    expires_in_default: 3600
    identity: { function: get_primary_calendar, path: id }
  modes: [byo_user]
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Google Calendar rejected the request as invalid: check the arguments and the dates." }
    - { status: 401, code: authorization_expired, retryable: false,
        message: "Google no longer accepts this authorization (expired or revoked): the person must sign in again." }
    - { status: 403, code: permission_missing, retryable: false,
        message: "Google refused the call: the signed-in person cannot see or edit this calendar, a scope is missing, or a per-user rate limit was hit; the reason in the response tells which." }
    - { status: 404, code: not_found, retryable: false,
        message: "Google Calendar object not found, or not visible to the signed-in person: check the id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Google Calendar is throttling these requests: retry after a delay." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Google Calendar is temporarily unavailable: retry later." }

functions:
  - name: get_primary_calendar
    class: read
    scopes: ["https://www.googleapis.com/auth/calendar.readonly"]
    description: >-
      Get the primary calendar of the signed-in person: its id, which is their
      email address, its summary and its time zone.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Whose calendar this is
        input: {}
    call: { method: GET, path: /calendars/primary }
    cost: { per: request }

  - name: list_calendars
    class: read
    scopes: ["https://www.googleapis.com/auth/calendar.readonly"]
    description: >-
      List the calendars in the signed-in person's calendar list: id, summary,
      whether it is primary, and their access role (owner, writer, reader,
      freeBusyReader).
    input:
      type: object
      additionalProperties: false
      properties:
        max_results:
          type: integer
          minimum: 1
          maximum: 250
          default: 100
          description: "Maximum number of calendars in the page."
        page_token: &page_token
          type: string
          minLength: 1
          description: "nextPageToken of the previous page."
    examples:
      - title: Every calendar
        input: {}
    call:
      method: GET
      path: /users/me/calendarList
      query: { maxResults: max_results, pageToken: page_token }
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: items
    cost: { per: page }

  - name: list_events
    class: read
    scopes: ["https://www.googleapis.com/auth/calendar.readonly"]
    description: >-
      List the events of a calendar in start order, recurring events expanded
      into their occurrences, optionally between two instants and matching
      free text. calendar_id primary is the signed-in person's own calendar.
    input:
      type: object
      additionalProperties: false
      required: [calendar_id]
      properties:
        calendar_id: &calendar_id
          type: string
          pattern: "^[^\\s/?#]+$"
          description: "Calendar id from list_calendars, or primary."
        time_min:
          type: string
          format: date-time
          description: "Events ending after this instant, RFC 3339 with offset, e.g. 2026-10-16T00:00:00+02:00."
        time_max:
          type: string
          format: date-time
          description: "Events starting before this instant, RFC 3339 with offset."
        query:
          type: string
          minLength: 1
          description: "Free text matched against summary, description, location and guests."
        max_results:
          type: integer
          minimum: 1
          maximum: 2500
          default: 50
          description: "Maximum number of events in the page."
        page_token: *page_token
    examples:
      - title: My events of one day
        input: { calendar_id: primary, time_min: "2026-10-16T00:00:00+02:00", time_max: "2026-10-17T00:00:00+02:00" }
      - title: Next meetings about a project
        input: { calendar_id: primary, time_min: "2026-10-16T00:00:00Z", query: roadmap, max_results: 10 }
    refusals:
      - { code: calendar_not_found, when: 404, message: "No calendar with this id that the signed-in person can see." }
    call:
      method: GET
      path: "/calendars/{calendar_id}/events"
      query: { timeMin: time_min, timeMax: time_max, q: query, maxResults: max_results, pageToken: page_token }
      constants:
        query: { singleEvents: true, orderBy: startTime }
    pagination: { kind: cursor, request_param: page_token, next: nextPageToken, max_pages: 10 }
    output:
      items: items
    cost: { per: page }

  - name: get_event
    class: read
    scopes: ["https://www.googleapis.com/auth/calendar.readonly"]
    description: >-
      Get one event by id: summary, description, location, start, end, guests
      and their responses, organizer, recurrence, conference link.
    input:
      type: object
      additionalProperties: false
      required: [calendar_id, event_id]
      properties:
        calendar_id: *calendar_id
        event_id: &event_id
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Event id, from list_events."
    examples:
      - title: One event
        input: { calendar_id: primary, event_id: 4k2j9v0q8h1c3m5n7p9r1t3v5x }
    refusals:
      - { code: event_not_found, when: 404, message: "No event with this id in this calendar." }
    call: { method: GET, path: "/calendars/{calendar_id}/events/{event_id}" }
    cost: { per: request }

  - name: create_event
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/calendar"]
    description: >-
      Create an event. start and end are both a date (all-day event, end
      exclusive) or both a dateTime with offset or timeZone. Guests are invited
      by email; send_updates says who Google emails: all, externalOnly (guests
      outside the organization) or none.
    input:
      type: object
      additionalProperties: false
      required: [calendar_id, summary, start, end, send_updates]
      properties:
        calendar_id: *calendar_id
        summary: &summary
          type: string
          minLength: 1
          description: "Title of the event."
        description: &event_description
          type: string
          description: "Description of the event; HTML allowed."
        location: &location
          type: string
          description: "Free-form place or address."
        start: &event_time
          type: object
          additionalProperties: false
          oneOf: [{ required: [date] }, { required: [dateTime] }]
          properties:
            date: { type: string, format: date, description: "All-day: YYYY-MM-DD." }
            dateTime: { type: string, format: date-time, description: "RFC 3339, e.g. 2026-10-20T14:00:00+02:00." }
            timeZone: { type: string, minLength: 1, description: "IANA time zone, e.g. Europe/Paris." }
        end: *event_time
        attendees: &attendees
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string, format: email }
              optional: { type: boolean, default: false }
          description: "Guests, by email."
        send_updates: &send_updates
          enum: [all, externalOnly, none]
          description: "Who Google emails about this change: all guests, guests outside the organization, or nobody."
    examples:
      - title: A meeting with one guest, invited by email
        input:
          calendar_id: primary
          summary: Quarterly review
          start: { dateTime: "2026-10-20T14:00:00+02:00" }
          end: { dateTime: "2026-10-20T15:00:00+02:00" }
          attendees: [{ email: jane.doe@acme.example }]
          send_updates: all
      - title: An all-day event, nobody notified
        input: { calendar_id: primary, summary: Offsite, start: { date: "2026-11-05" }, end: { date: "2026-11-06" }, send_updates: none }
    refusals:
      - { code: calendar_not_found, when: 404, message: "No calendar with this id that the signed-in person can edit." }
    call:
      method: POST
      path: "/calendars/{calendar_id}/events"
      query: { sendUpdates: send_updates }
      body: { summary: summary, description: description, location: location, start: start, end: end, attendees: attendees }
    cost: { per: request }
    confirm:
      summary: "Create event {summary} in calendar {calendar_id} (guests emailed: {send_updates})."

  - name: update_event
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/calendar"]
    description: >-
      Change an event: only the fields given change. attendees replaces the
      whole guest list: pass the full list, current guests included; an empty
      list removes every guest. send_updates says who Google emails about the
      change.
    input:
      type: object
      additionalProperties: false
      required: [calendar_id, event_id, send_updates]
      anyOf:
        - { required: [summary] }
        - { required: [description] }
        - { required: [location] }
        - { required: [start] }
        - { required: [end] }
        - { required: [attendees] }
      properties:
        calendar_id: *calendar_id
        event_id: *event_id
        summary: *summary
        description: *event_description
        location: *location
        start: *event_time
        end: *event_time
        attendees: *attendees
        send_updates: *send_updates
    examples:
      - title: Move a meeting by one hour, guests notified
        input:
          calendar_id: primary
          event_id: 4k2j9v0q8h1c3m5n7p9r1t3v5x
          start: { dateTime: "2026-10-20T15:00:00+02:00" }
          end: { dateTime: "2026-10-20T16:00:00+02:00" }
          send_updates: all
      - title: Fix a title quietly
        input: { calendar_id: primary, event_id: 4k2j9v0q8h1c3m5n7p9r1t3v5x, summary: Quarterly review (Q4), send_updates: none }
    refusals:
      - { code: event_not_found, when: 404, message: "No event with this id in this calendar." }
    call:
      method: PATCH
      path: "/calendars/{calendar_id}/events/{event_id}"
      query: { sendUpdates: send_updates }
      body: { summary: summary, description: description, location: location, start: start, end: end, attendees: attendees }
    cost: { per: request }
    confirm:
      summary: "Change event {event_id} in calendar {calendar_id} (guests emailed: {send_updates})."

  - name: delete_event
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/calendar"]
    description: >-
      Delete an event. For the guests it is cancelled; send_updates says who
      Google emails about it.
    input:
      type: object
      additionalProperties: false
      required: [calendar_id, event_id, send_updates]
      properties:
        calendar_id: *calendar_id
        event_id: *event_id
        send_updates: *send_updates
    examples:
      - title: Cancel a meeting and tell the guests
        input: { calendar_id: primary, event_id: 4k2j9v0q8h1c3m5n7p9r1t3v5x, send_updates: all }
    refusals:
      - { code: event_not_found, when: 404, message: "No event with this id in this calendar." }
      - { code: event_already_deleted, when: 410, message: "This event was already deleted." }
    call:
      method: DELETE
      path: "/calendars/{calendar_id}/events/{event_id}"
      query: { sendUpdates: send_updates }
    cost: { per: request }
    confirm:
      summary: "Delete event {event_id} from calendar {calendar_id} (guests emailed: {send_updates})."

exposure:
  mode: per_connector
  tool: google_calendar
