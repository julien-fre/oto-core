# yaml-language-server: $schema=../connector.schema.json
# 3CX V20 Configuration REST API (XAPI, OData v4): its $metadata document is served by every phone system, at
# {address}/xapi/v1/$metadata. API clients: https://www.3cx.com/docs/configuration-rest-api/
# 1.0.0: the description of the existing client (oto.tools.threecx), unchanged.
#
# The address is the account's: 3CX is self-hosted or hosted under a name of its own, so the https address of the
# phone system (the one of its web client) is a url setting, cited by base_url and token_url.
#
# Not described here:
# - the user account (username and password): the client logs in by POST /webclient/api/Login/GetAccessToken, a JSON
#   body whose answer carries the token under Token.access_token, outside of the OAuth2 grants the format says. Only an
#   API client (client credentials, created in the admin console, Integrations > API) is described.
# - recorded_only of list_calls: a filter the client applies after paging, on its own side.
connector:
  name: threecx
  label: 3CX
  namespace: threecx
  version: 1.0.0
  api_version: XAPI v1 (3CX V20)
  base_url: "{base_url}/xapi/v1"
  auth:
    kind: oauth2_client_credentials
    token_url: "{base_url}/connect/token"
    token_request: form
    client_auth: body
    client_id: client_id
    client_secret: client_secret
    expires_in_default: 3600
  credential:
    - { name: client_id, label: API client ID, secret: false }
    - { name: client_secret, label: API client secret, secret: true }
  settings:
    - { name: base_url, label: Phone system address, type: url }
  modes: [byo_user, byo_org]
  timeout_s: 120
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "3CX rejected the request as invalid: check the arguments (dates are UTC instants)." }
    - { status: [401, 403], code: access_rejected, retryable: false,
        message: "3CX refused the access: check the API client id and secret, and its role (a manager of the groups to read; a system administrator for the whole phone system)." }
    - { status: 404, code: not_found, retryable: false,
        message: "3CX object not found: check the id." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "3CX is temporarily unavailable: retry later." }

functions:
  - name: list_calls
    class: read
    description: >-
      One page of the 3CX call log over a period, every extension and
      direction: one row per call segment (caller, callee, start time,
      ringing and talking durations as ISO 8601 durations, status, reason).
      A recorded segment carries SrcRecId or DstRecId, the id to pass to
      download_recording, which returns the audio as a file; a recording is
      never a link. date_from and date_to are UTC instants
      (2026-10-01T00:00:00Z). top is the number of rows per page, 1 to 500;
      continue with skip increased by top while a page holds top rows: a page
      with fewer rows is the last. What the API client sees bounds the rows.
    input:
      type: object
      additionalProperties: false
      required: [date_from, date_to, top]
      properties:
        date_from: &instant
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?Z$"
          description: "Start of the period, a UTC instant: 2026-10-01T00:00:00Z."
        date_to:
          <<: *instant
          description: "End of the period, a UTC instant: 2026-10-02T00:00:00Z."
        top:
          type: integer
          minimum: 1
          maximum: 500
          description: "Call-log rows per page, 1 to 500."
        skip:
          type: integer
          minimum: 0
          description: "Rows to skip: the skip of the previous page plus its top."
    examples:
      - title: The calls of one day, first page
        input: { date_from: "2026-10-01T00:00:00Z", date_to: "2026-10-02T00:00:00Z", top: 100 }
      - title: The next page
        input: { date_from: "2026-10-01T00:00:00Z", date_to: "2026-10-02T00:00:00Z", top: 100, skip: 100 }
    call:
      method: GET
      path: "/ReportCallLogData/Pbx.GetCallLogData(periodFrom={date_from},periodTo={date_to},sourceType=0,sourceFilter='',destinationType=0,destinationFilter='',callsType=0,callTimeFilterType=0,callTimeFilterFrom='0:00:0',callTimeFilterTo='0:00:0',hidePcalls=true)"
      query: { $top: top, $skip: skip }
    # RecordingUrl is the path of the recording on the phone system: the audio is fetched by download_recording only.
    output: { items: value, strip: [RecordingUrl] }
    cost: { per: request }

  - name: download_recording
    class: read
    description: >-
      Get the audio of one 3CX call recording as a file of yours, kept 24
      hours: the answer gives its file id, to pass as is to a function that
      takes a file (a transcription). Never a link. rec_id is the SrcRecId or
      DstRecId of a list_calls row. The audio is WAV; a recording over 50 MB
      is refused. The API client needs a role that sees the recordings of
      that call.
    input:
      type: object
      additionalProperties: false
      required: [rec_id]
      properties:
        rec_id:
          type: integer
          minimum: 1
          description: "The SrcRecId or DstRecId of a list_calls row."
    examples:
      - title: The recording of one call segment
        input: { rec_id: 4711 }
    refusals:
      - { code: recording_not_found, when: 404, message: "No recording with this id, or not visible to this API client." }
    call: { method: GET, path: "/Recordings/Pbx.DownloadRecording(recId={rec_id})" }
    # The body of the answer is the audio, behind the account's token.
    output:
      file:
        from: body
        types: { wav: [audio/wav, audio/x-wav, audio/wave] }
        name: { header: Content-Disposition, template: "recording-{rec_id}.wav" }
        max_bytes: 52428800
    cost: { per: request }
