# yaml-language-server: $schema=../connector.schema.json
# Google Search Console API reference: https://developers.google.com/webmaster-tools/v1/api_reference_index
# Discovery document read on 2026-11-07 (revision 20261106), again on 2026-11-13 (revision 20261110) for the scopes of
# each method: https://searchconsole.googleapis.com/$discovery/rest?version=v1
# Scopes: https://developers.google.com/webmaster-tools/v1/how-tos/authorizing
# Permissions: https://support.google.com/webmasters/answer/2451999 (Managing owners, users, and permissions)
# Usage limits: https://developers.google.com/webmaster-tools/limits
# Standard errors: https://developers.google.com/webmaster-tools/v1/errors
#
# Qualification
# - Who holds the access: the organization, through a Google Cloud service account. No person signs in: the account
#   sees exactly the Search Console properties to which its address (client_email of the key) was added as a user.
# - How it authenticates: auth.kind oauth2_jwt_bearer (docs/conception/compte.md, "Le compte de service"). The
#   credential is one secret field, the JSON key file of the service account pasted whole; the host signs an RS256
#   assertion with it and exchanges it at https://oauth2.googleapis.com/token for a Bearer token. A key whose token_uri
#   is another address is refused by the host. Domain-wide delegation (sub) is out of the mode.
# - What a key allows: two access levels (docs/conception/niveaux-d-acces.md). read, the default (default_level),
#   claims webmasters.readonly; full claims webmasters and adds add_sitemap. The level only decides the scope claim
#   of the assertion: a service account consents to nothing, so a host that moves an account from read to full signs
#   its next assertion with webmasters, without asking anyone again. scope_implies says webmasters covers
#   webmasters.readonly: the authorizing page gives webmasters as "Read/write access" and webmasters.readonly as
#   "Read-only access", and the discovery document lists both scopes, either one sufficing, on every read method
#   (sites.list, sites.get, searchanalytics.query, urlInspection.index.inspect, sitemaps.list, sitemaps.get) while
#   sitemaps.submit lists webmasters alone.
# - Rights: they come from Search Console, not from the key or the level. Restricted is enough for every read; the
#   permissions page gives "Submit sitemap" to Owner and Full user only, so add_sitemap needs the account added as
#   Owner or Full on the property, whatever the level. The API says the level the account holds on each property
#   (list_sites, permissionLevel).
# - What a call costs: nothing; the API is free, bounded by quotas.
# - Does it commit: add_sitemap only (class write, served as google_search_console_act.add_sitemap): it submits a
#   sitemap, which Google then crawls. Submitting an address already submitted submits it again. Every other function
#   is a read.
# - What it returns that an agent must not see: nothing secret. inspectionResultLink opens the Search Console screen,
#   behind a Google sign-in; it is kept.
# - Limits (public reference, 2026-11-07): Search Analytics 1,200 queries per minute per site and per user, 40,000
#   per minute and 30,000,000 per day per Google Cloud project, plus a load quota counted in 10-minute and 1-day
#   chunks whose values are not published; URL inspection 2,000 per day and 600 per minute per site, 15,000 per minute
#   and 10,000,000 per day per project; other resources 20 per second and 200 per minute per user. No rate_limit is
#   declared: the per-minute limits are per site or per function, which a connector rate does not say.
# - An address per client: no; one root, https://searchconsole.googleapis.com, for both families of routes
#   (webmasters/v3 and v1/urlInspection), as the discovery document gives it.
# - Owner of the access: a product sold to the public. Fits this public repository.
#
# Scope
# - Read, at both levels: list_sites (the probe), query_search_analytics, inspect_url, list_sitemaps, get_sitemap.
# - Write, at level full only: add_sitemap (PUT .../sitemaps/{feedpath}, an empty answer on success, per the reference
#   page https://developers.google.com/webmaster-tools/v1/sitemaps/submit).
# - Left out, and why:
#   - removing a sitemap (DELETE .../sitemaps/{feedpath}), adding or removing a property (PUT, DELETE
#     .../sites/{siteUrl}): not asked for; they would be sensitive (a removal destroys) and need webmasters too.
#   - getting one property (GET .../sites/{siteUrl}): list_sites already says every property and its level.
#   - the mobile-friendly test (urlTestingTools): retired by Google; its discovery entry declares no scope.
# - siteUrl and feedpath travel in the path. The host percent-encodes a path argument whole (encodeURIComponent in
#   oto-core's engine, quote(safe="!*'()") in the reference of connectors/_cases/body.yaml): ":" and "/" become %3A
#   and %2F, so sc-domain:example.com is sent as sc-domain%3Aexample.com and https://www.example.com/ as
#   https%3A%2F%2Fwww.example.com%2F, the form of the reference's own example.
# - Pagination: Search Analytics pages by offset (startRow, rowLimit up to 25,000), which the format does not declare
#   (format-de-description.md, "Pagination"). start_row is an argument the agent passes again, and the description says
#   how. A start_row past the end answers with no rows. The list routes (sites, sitemaps) do not page.
# - Enumerations: the reference pages write them in lower case (query, web, auto, final); the discovery document in
#   upper case. This file sends the lower-case form of the reference pages, whose dataState is stated case-insensitive.
#
# Errors
# - The key refused: the host marks the account credential_rejected when the token exchange answers invalid_grant
#   (key deleted or disabled, account deleted), before any call here. A 401 from the API itself is not marked: the
#   host replays it once with a new token, as for oauth2_client_credentials (signal-de-refus.md, "Quand marquer").
# - 403 reasons, from the standard errors page: accessNotConfigured (the API is not enabled in the Google Cloud
#   project of the service account), also given as SERVICE_DISABLED in error.details by Google's current error model;
#   quotaExceeded and dailyLimitExceeded (marked quota_exhausted: a mark keeps the account callable and lifts at the
#   first success); insufficientPermissions, and the message "User does not have sufficient permission for site",
#   for a property the account was not added to. A 429 is a rate (not marked), unless its message says a daily quota.
#   These paths and texts come from the public reference, not checked by a real call.
#
# For the screen
# - Catalogue: "Read Google Search Console: the properties shared with a service account, search performance
#   (clicks, impressions, CTR, position), URL index status and sitemaps."
# - Where to get the key: Google Cloud console, IAM & Admin > Service accounts > the account > Keys > Add key > JSON;
#   enable "Google Search Console API" in the same project (APIs & Services > Library).
# - Rights: in Search Console, Settings > Users and permissions > Add user, the client_email of the key, permission
#   Restricted (enough to read), for each property the agent should see; Owner or Full to submit sitemaps, which also
#   needs the access level full.
# - Pitfalls: a key sees no property until its address is added to one (the probe then fails, siteEntry empty); a
#   Domain property is named sc-domain:example.com, a URL-prefix property by its full URL with a trailing slash.
#
# No Python client: oto 1 does not serve this connector. Values come from the public reference and the discovery
# document, not checked by a real call.
connector:
  name: google_search_console
  label: Google Search Console
  namespace: google_search_console
  version: 1.1.0
  api_version: v1
  base_url: https://searchconsole.googleapis.com
  auth:
    kind: oauth2_jwt_bearer
    token_url: https://oauth2.googleapis.com/token
    access_levels:
      read: { scopes: ["https://www.googleapis.com/auth/webmasters.readonly"] }
      full: { scopes: ["https://www.googleapis.com/auth/webmasters"] }
    scope_implies:
      "https://www.googleapis.com/auth/webmasters": ["https://www.googleapis.com/auth/webmasters.readonly"]
    default_level: read
    key: service_account_key
  credential:
    - { name: service_account_key, label: "Service account key (JSON file, its client_email added as a user of each property)", secret: true }
  modes: [byo_org]
  probe: { function: list_sites, non_empty: [siteEntry] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Search Console rejected the request as invalid: check the dates (YYYY-MM-DD), the dimensions, filters and aggregation, and the form of the property (sc-domain:example.com or a full URL with a trailing slash)." }
    - { status: 401, code: access_rejected, retryable: false,
        message: "Google rejected the service account's token: check that the key is still valid and its service account enabled." }
    - { status: 403, body: { path: error.errors.0.reason, equals: [accessNotConfigured] }, code: api_not_enabled, retryable: false,
        message: "The Google Search Console API is not enabled in the Google Cloud project of the service account: enable it in that project (APIs & Services > Library), then retry." }
    - { status: 403, body: { path: error.details.0.reason, equals: [SERVICE_DISABLED] }, code: api_not_enabled, retryable: false,
        message: "The Google Search Console API is not enabled in the Google Cloud project of the service account: enable it in that project (APIs & Services > Library), then retry." }
    - { status: 403, body: { path: error.errors.0.reason, equals: [quotaExceeded, dailyLimitExceeded] }, code: quota_exhausted, retryable: false,
        marks_account: quota_exhausted,
        message: "A Search Console quota is spent (URL inspection allows 2,000 a day per property): retry tomorrow." }
    - { status: 403, body: { path: error.message, contains: [sufficient permission] }, code: property_not_shared, retryable: false,
        message: "The service account is not a user of this property: add the client_email of its key as a user (Restricted is enough) in Search Console, Settings > Users and permissions, or check the property name." }
    - { status: 403, body: { path: error.errors.0.reason, equals: [insufficientPermissions] }, code: property_not_shared, retryable: false,
        message: "The service account is not a user of this property: add the client_email of its key as a user (Restricted is enough) in Search Console, Settings > Users and permissions, or check the property name." }
    - { status: 403, code: permission_denied, retryable: false,
        message: "Google refused the call: the service account lacks a right on this property, or a per-user limit was hit; the reason in the response tells which." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Search Console: check the property and the sitemap address." }
    - { status: 429, body: { path: error.message, contains: [per day] }, code: quota_exhausted, retryable: false,
        marks_account: quota_exhausted,
        message: "A daily Search Console quota is spent (URL inspection allows 2,000 a day per property): retry tomorrow." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Search Console is throttling these requests (per property: 1,200 performance queries and 600 URL inspections a minute): retry after a delay." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Search Console is temporarily unavailable: retry later." }

functions:
  - name: list_sites
    class: read
    scopes: ["https://www.googleapis.com/auth/webmasters.readonly"]
    description: >-
      List the Search Console properties this service account can read, each with its permissionLevel
      (SITE_OWNER, SITE_FULL_USER, SITE_RESTRICTED_USER, SITE_UNVERIFIED_USER): {siteEntry: [{siteUrl,
      permissionLevel}]}. siteUrl is the name every other function takes: sc-domain:example.com for a Domain
      property, a full URL with a trailing slash for a URL-prefix property. An empty answer means the account's
      address was added to no property yet. Free.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: Every property shared with the account
        input: {}
    call: { method: GET, path: /webmasters/v3/sites }
    cost: { per: request }

  - name: query_search_analytics
    class: read
    scopes: ["https://www.googleapis.com/auth/webmasters.readonly"]
    description: >-
      Search performance of a property between two dates (inclusive, Pacific time): rows of {keys, clicks,
      impressions, ctr, position}, keys in the order of dimensions, sorted by clicks unless grouped by date. No
      dimension gives one total row. Data lags about two days; data_state all adds fresh, incomplete days (metadata
      says from when). Returns at most row_limit rows (default 1,000, up to 25,000) and may hold back the long
      tail. For more rows, call again with start_row = previous start_row + row_limit, until fewer rows come back.
      Free, bounded by quotas.
    input:
      type: object
      additionalProperties: false
      required: [site_url, start_date, end_date]
      properties:
        site_url: &site_url
          type: string
          pattern: "^(sc-domain:[^\\s/]+|https?://[^\\s]+/)$"
          description: "Property as list_sites names it: sc-domain:example.com, or https://www.example.com/ with its trailing slash."
        start_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "First day, YYYY-MM-DD, inclusive." }
        end_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Last day, YYYY-MM-DD, inclusive, not before start_date." }
        dimensions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { enum: [query, page, country, device, date, searchAppearance, hour] }
          description: "Group by these, in this order. country is ISO 3166-1 alpha-3; hour needs data_state hourly_all."
        type:
          enum: [web, image, video, news, discover, googleNews]
          default: web
          description: "Search type, or the Discover and Google News surfaces."
        dimension_filter_groups:
          type: array
          minItems: 1
          description: "Filters; every group must match, every filter of a group too. A filter may use a dimension not grouped by."
          items:
            type: object
            additionalProperties: false
            required: [filters]
            properties:
              groupType: { const: and }
              filters:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [dimension, expression]
                  properties:
                    dimension: { enum: [query, page, country, device, searchAppearance] }
                    operator:
                      enum: [equals, notEquals, contains, notContains, includingRegex, excludingRegex]
                      default: equals
                      description: "equals is case-sensitive on page and query; contains is not; regexes are RE2."
                    expression: { type: string, minLength: 1, maxLength: 4096, description: "e.g. FRA, MOBILE, a page URL." }
        aggregation_type:
          enum: [auto, byPage, byProperty, byNewsShowcasePanel]
          default: auto
          description: "byProperty is refused when grouping or filtering by page, and for discover and googleNews."
        data_state:
          enum: [final, all, hourly_all]
          default: final
          description: "final: settled data; all: with fresh days; hourly_all: with the hour dimension."
        row_limit: { type: integer, minimum: 1, maximum: 25000, default: 1000, description: "Rows per call." }
        start_row: { type: integer, minimum: 0, default: 0, description: "Zero-based first row, for the next rows." }
    examples:
      - title: Top queries of October
        input: { site_url: "sc-domain:example.com", start_date: "2026-10-01", end_date: "2026-10-31", dimensions: [query], row_limit: 100 }
      - title: Daily clicks of one page on mobile in France
        input:
          site_url: "https://www.example.com/"
          start_date: "2026-10-01"
          end_date: "2026-10-31"
          dimensions: [date]
          dimension_filter_groups:
            - filters:
                - { dimension: page, operator: equals, expression: "https://www.example.com/pricing" }
                - { dimension: device, expression: MOBILE }
                - { dimension: country, expression: FRA }
      - title: The next 25,000 pages
        input: { site_url: "sc-domain:example.com", start_date: "2026-08-01", end_date: "2026-10-31", dimensions: [page], row_limit: 25000, start_row: 25000 }
    call:
      method: POST
      path: "/webmasters/v3/sites/{site_url}/searchAnalytics/query"
      body:
        startDate: start_date
        endDate: end_date
        dimensions: dimensions
        type: type
        dimensionFilterGroups: dimension_filter_groups
        aggregationType: aggregation_type
        dataState: data_state
        rowLimit: row_limit
        startRow: start_row
    cost: { per: request }

  - name: inspect_url
    class: read
    scopes: ["https://www.googleapis.com/auth/webmasters.readonly"]
    description: >-
      Index status of one URL as Google last saw it (not a live test): inspectionResult with indexStatusResult
      (verdict PASS, PARTIAL, FAIL or NEUTRAL, coverageState, robotsTxtState, indexingState, pageFetchState,
      lastCrawlTime, googleCanonical, userCanonical, crawledAs, sitemap, referringUrls), and when they apply
      mobileUsabilityResult, richResultsResult, ampResult, plus inspectionResultLink to the Search Console screen.
      The URL must belong to the property. Free, but bounded to 2,000 inspections a day and 600 a minute per
      property: inspect the pages that matter, not a whole sitemap.
    input:
      type: object
      additionalProperties: false
      required: [site_url, inspection_url]
      properties:
        site_url: *site_url
        inspection_url: { type: string, pattern: "^https?://[^\\s]+$", description: "Full URL to inspect, under site_url." }
        language_code: { type: string, pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$", default: en-US, description: "BCP-47 language of the issue messages, e.g. fr-FR." }
    examples:
      - title: Is the pricing page indexed
        input: { site_url: "sc-domain:example.com", inspection_url: "https://www.example.com/pricing" }
      - title: Messages in French
        input: { site_url: "https://www.example.com/", inspection_url: "https://www.example.com/blog/launch", language_code: fr-FR }
    call:
      method: POST
      path: "/v1/urlInspection/index:inspect"
      body: { siteUrl: site_url, inspectionUrl: inspection_url, languageCode: language_code }
    cost: { per: request }

  - name: list_sitemaps
    class: read
    scopes: ["https://www.googleapis.com/auth/webmasters.readonly"]
    description: >-
      List the sitemaps submitted for a property, or those of one sitemap index:
      [{path, lastSubmitted, lastDownloaded, isPending, isSitemapsIndex, type, warnings, errors,
      contents: [{type, submitted}]}]; warnings, errors and submitted are counts written as strings. Read
      one sitemap with get_sitemap, submit one with add_sitemap. Free.
    input:
      type: object
      additionalProperties: false
      required: [site_url]
      properties:
        site_url: *site_url
        sitemap_index: { type: string, pattern: "^https?://[^\\s]+$", description: "Address of a sitemap index, to list its sitemaps only." }
    examples:
      - title: Sitemaps of a property
        input: { site_url: "sc-domain:example.com" }
      - title: Sitemaps of one index
        input: { site_url: "https://www.example.com/", sitemap_index: "https://www.example.com/sitemap_index.xml" }
    call:
      method: GET
      path: "/webmasters/v3/sites/{site_url}/sitemaps"
      query: { sitemapIndex: sitemap_index }
    output: { items: sitemap }
    cost: { per: request }

  - name: get_sitemap
    class: read
    scopes: ["https://www.googleapis.com/auth/webmasters.readonly"]
    description: >-
      Get one submitted sitemap of a property: {path, lastSubmitted, lastDownloaded, isPending, isSitemapsIndex,
      type, warnings, errors, contents: [{type, submitted}]}; warnings, errors and submitted are counts written as
      strings. A sitemap never submitted for this property is not found. Free.
    input:
      type: object
      additionalProperties: false
      required: [site_url, feedpath]
      properties:
        site_url: *site_url
        feedpath: { type: string, pattern: "^https?://[^\\s]+$", description: "Full address of the sitemap, e.g. https://www.example.com/sitemap.xml." }
    examples:
      - title: The main sitemap
        input: { site_url: "sc-domain:example.com", feedpath: "https://www.example.com/sitemap.xml" }
    refusals:
      - { code: sitemap_not_found, when: 404, message: "No sitemap at this address was submitted for this property: check its full address." }
    call:
      method: GET
      path: "/webmasters/v3/sites/{site_url}/sitemaps/{feedpath}"
    cost: { per: request }

  - name: add_sitemap
    class: write
    scopes: ["https://www.googleapis.com/auth/webmasters"]
    description: >-
      Submit a sitemap for a property, so Google crawls the addresses it lists: answers {} on success. Submitting an
      address already submitted submits it again. The sitemap must be reachable by Google and under the property; its
      processing (isPending, errors, warnings) is read afterwards with get_sitemap. The service account must be an
      Owner or Full user of the property: Restricted only reads. Free.
    input:
      type: object
      additionalProperties: false
      required: [site_url, feedpath]
      properties:
        site_url: *site_url
        feedpath: { type: string, pattern: "^https?://[^\\s]+$", description: "Full address of the sitemap to submit, e.g. https://www.example.com/sitemap.xml." }
    examples:
      - title: Submit the main sitemap
        input: { site_url: "sc-domain:example.com", feedpath: "https://www.example.com/sitemap.xml" }
      - title: Submit a sitemap index of a URL-prefix property
        input: { site_url: "https://www.example.com/", feedpath: "https://www.example.com/sitemap_index.xml" }
    refusals:
      - { code: owner_or_full_required, when: 403, body: { path: error.message, contains: [sufficient permission] },
          message: "The service account may not submit sitemaps for this property: in Search Console, Settings > Users and permissions, give its client_email the Owner or Full permission (Restricted only reads), or check the property name." }
      - { code: owner_or_full_required, when: 403, body: { path: error.errors.0.reason, equals: [insufficientPermissions] },
          message: "The service account may not submit sitemaps for this property: in Search Console, Settings > Users and permissions, give its client_email the Owner or Full permission (Restricted only reads), or check the property name." }
    call:
      method: PUT
      path: "/webmasters/v3/sites/{site_url}/sitemaps/{feedpath}"
    cost: { per: request }
