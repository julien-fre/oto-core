# yaml-language-server: $schema=../connector.schema.json
# Google Sheets API v4 reference: https://developers.google.com/workspace/sheets/api/reference/rest
# The spreadsheets one signed-in person can open (delegated access): every
# call sees exactly what that person sees.
# The access token comes from the person's consent (OAuth 2.0 authorization
# code), with the OAuth application of the host or of the organization.
# access_type=offline and prompt=consent bring a refresh token at each consent;
# Google does not rotate it. Incremental authorization (include_granted_scopes)
# is not asked for: a consent at level read never inherits a broader scope
# granted earlier to the same application.
# Two access levels: read (spreadsheets.readonly) and full (spreadsheets).
# The Sheets API has no read without argument that says who consented: the
# identity is read on Google's OpenID Connect userinfo endpoint, whose scopes
# (openid, email) every level asks for.
# Ranges are in A1 notation: Sheet1!A1:C10, 'Q4 budget'!A:A, or a sheet name
# alone for the whole sheet.
# Values only: list the sheets of a spreadsheet, read, write, append and clear
# values. Out of this file: finding a spreadsheet (a Drive query on its MIME
# type, on another host), creating one, and changing its structure, formatting
# or sharing (spreadsheets.batchUpdate requests, Drive permissions).
connector:
  name: google_sheets
  label: Google Sheets
  namespace: google_sheets
  version: 1.0.0
  api_version: v4
  base_url: https://sheets.googleapis.com/v4
  auth:
    kind: oauth2_user
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    client_auth: body
    access_levels:
      read: { scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly", openid, email] }
      full: { scopes: ["https://www.googleapis.com/auth/spreadsheets", openid, email] }
    scope_implies:
      "https://www.googleapis.com/auth/spreadsheets": ["https://www.googleapis.com/auth/spreadsheets.readonly"]
    authorize_params: { access_type: offline, prompt: select_account consent }
    pkce: S256
    refresh: refresh_token
    rotates: false
    expires_in_default: 3600
    identity:
      url: https://openidconnect.googleapis.com/v1/userinfo
      path: email
      scopes: [openid, email]
  modes: [byo_user]
  query_arrays: repeat
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Google Sheets rejected the request as invalid: check the arguments, and the A1 notation of a range." }
    - { status: 401, code: authorization_expired, retryable: false,
        message: "Google no longer accepts this authorization (expired or revoked): the person must sign in again." }
    - { status: 403, code: permission_missing, retryable: false,
        message: "Google refused the call: the signed-in person cannot open or edit this spreadsheet, a scope is missing, or a per-user rate limit was hit; the reason in the response tells which." }
    - { status: 404, code: not_found, retryable: false,
        message: "Spreadsheet not found, or not visible to the signed-in person: check the id." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Google Sheets is throttling these requests: retry after a delay." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Google Sheets is temporarily unavailable: retry later." }

functions:
  - name: get_spreadsheet
    class: read
    scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"]
    description: >-
      Get the metadata of a spreadsheet: title, locale, time zone, link, and
      each sheet with its id, title, position and size. No cell values: read
      them with read_ranges.
    input:
      type: object
      additionalProperties: false
      required: [spreadsheet_id]
      properties:
        spreadsheet_id: &spreadsheet_id
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Spreadsheet id, the part after /d/ in its link."
    examples:
      - title: One spreadsheet
        input: { spreadsheet_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEf }
    refusals:
      - { code: spreadsheet_not_found, when: 404, message: "No spreadsheet with this id that the signed-in person can open." }
    call:
      method: GET
      path: "/spreadsheets/{spreadsheet_id}"
      constants:
        query: { fields: "spreadsheetId,spreadsheetUrl,properties(title,locale,timeZone),sheets.properties(sheetId,title,index,gridProperties(rowCount,columnCount))" }
    cost: { per: request }

  - name: read_ranges
    class: read
    scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"]
    description: >-
      Read the values of one or more ranges of a spreadsheet. Each range comes
      back in valueRanges, as rows of cells; trailing empty rows and cells are
      left out.
    input:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, ranges]
      properties:
        spreadsheet_id: *spreadsheet_id
        ranges:
          type: array
          minItems: 1
          items: &range { type: string, minLength: 1, description: "A1 notation, e.g. Sheet1!A1:C10." }
          description: "Ranges to read, in A1 notation."
        value_render:
          enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
          default: FORMATTED_VALUE
          description: "FORMATTED_VALUE: as displayed; UNFORMATTED_VALUE: raw numbers; FORMULA: the formulas."
        major_dimension:
          enum: [ROWS, COLUMNS]
          default: ROWS
          description: "Rows of cells (default) or columns of cells."
    examples:
      - title: A table and a total
        input: { spreadsheet_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEf, ranges: ["Sheet1!A1:D50", "Summary!B2"] }
    refusals:
      - { code: spreadsheet_not_found, when: 404, message: "No spreadsheet with this id that the signed-in person can open." }
    call:
      method: GET
      path: "/spreadsheets/{spreadsheet_id}/values:batchGet"
      query: { ranges: ranges, valueRenderOption: value_render, majorDimension: major_dimension }
    cost: { per: request }

  - name: write_ranges
    class: write
    scopes: ["https://www.googleapis.com/auth/spreadsheets"]
    description: >-
      Write values into one or more ranges, replacing what the cells held.
      USER_ENTERED parses each value as if typed in Google Sheets (numbers,
      dates, formulas starting with =); RAW stores it as given.
    input:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, value_input, data]
      properties:
        spreadsheet_id: *spreadsheet_id
        value_input: &value_input
          enum: [USER_ENTERED, RAW]
          description: "USER_ENTERED: parsed as typed in the interface; RAW: stored as given."
        data:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [range, values]
            properties:
              range: *range
              values: &values
                type: array
                minItems: 1
                items: { type: array, items: { type: [string, number, boolean] } }
                description: "Rows of cells."
          description: "Each range with the rows written there."
    examples:
      - title: A header and two rows
        input:
          spreadsheet_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEf
          value_input: USER_ENTERED
          data: [{ range: "Sheet1!A1:C3", values: [[Name, Amount, Date], [Acme, 1200, "2026-10-16"], [Globex, 800, "2026-10-17"]] }]
    refusals:
      - { code: spreadsheet_not_found, when: 404, message: "No spreadsheet with this id that the signed-in person can open." }
    call:
      method: POST
      path: "/spreadsheets/{spreadsheet_id}/values:batchUpdate"
      body: { valueInputOption: value_input, data: data }
    cost: { per: request }

  - name: append_rows
    class: write
    scopes: ["https://www.googleapis.com/auth/spreadsheets"]
    description: >-
      Append rows after the last row of a table, inserting new rows. Give only
      the first column of the table, e.g. Sheet1!A:A: Google appends after the
      table it finds in the range, starting at that table's first column, so a
      wider range can send the rows to another column.
    input:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, range, value_input, values]
      properties:
        spreadsheet_id: *spreadsheet_id
        range:
          type: string
          minLength: 1
          pattern: "^[^/?#]+$"
          description: "First column of the table, A1 notation, e.g. Sheet1!A:A."
        value_input: *value_input
        values: *values
    examples:
      - title: One new row
        input: { spreadsheet_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEf, range: "Sheet1!A:A", value_input: USER_ENTERED, values: [[Initech, 450, "2026-10-18"]] }
    refusals:
      - { code: spreadsheet_not_found, when: 404, message: "No spreadsheet with this id that the signed-in person can open." }
    call:
      method: POST
      path: "/spreadsheets/{spreadsheet_id}/values/{range}:append"
      query: { valueInputOption: value_input }
      body: { values: values }
      constants:
        query: { insertDataOption: INSERT_ROWS }
    cost: { per: request }

  - name: clear_ranges
    class: sensitive
    scopes: ["https://www.googleapis.com/auth/spreadsheets"]
    description: >-
      Clear the values of one or more ranges; formatting stays. The version
      history of the spreadsheet keeps what was there.
    input:
      type: object
      additionalProperties: false
      required: [spreadsheet_id, ranges]
      properties:
        spreadsheet_id: *spreadsheet_id
        ranges:
          type: array
          minItems: 1
          items: *range
          description: "Ranges to clear, in A1 notation."
    examples:
      - title: Clear a table but its header
        input: { spreadsheet_id: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEf, ranges: ["Sheet1!A2:D"] }
    refusals:
      - { code: spreadsheet_not_found, when: 404, message: "No spreadsheet with this id that the signed-in person can open." }
    call:
      method: POST
      path: "/spreadsheets/{spreadsheet_id}/values:batchClear"
      body: { ranges: ranges }
    cost: { per: request }
    confirm:
      summary: "Clear the values of {ranges} in spreadsheet {spreadsheet_id}."

exposure:
  mode: per_connector
  tool: google_sheets
