# yaml-language-server: $schema=../connector.schema.json
# Qonto Business API v2 reference: https://docs.qonto.com/api-reference/business-api
# French business banking, READ-ONLY with an organization API key: the
# organization and its bank accounts (balances), transactions with VAT details,
# labels and attachments, statements, supplier invoices, client invoices,
# credit notes, quotes and clients, SEPA transfers and beneficiaries, spend
# requests and memberships.
#
# The key is two values from Qonto → Settings → Integrations and partnerships →
# API key: the login (acme-1234, not an email) and the secret key. Qonto wants
# them joined by a colon in Authorization, sent as is (no Basic, no base64),
# hence ONE credential field holding login:secret-key.
#
# Not described here: everything an API key is refused with 401 "OAuth2
# authentication is required here" — cards, cash-flow categories, scenarios and
# targets — and every write (transfers, beneficiaries, invoices, attachments),
# which need an OAuth consent and, for payments, strong customer
# authentication. The Sandbox (X-Qonto-Staging-Token) is not described either.
connector:
  name: qonto
  label: Qonto
  namespace: qonto
  version: 1.0.0
  api_version: v2
  base_url: https://thirdparty.qonto.com/v2
  auth:
    kind: api_key
    in: header
    name: Authorization
    key: api_key
  credential:
    - { name: api_key, label: "API key (login:secret-key)", secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  # Array filters are Rails style: status[]=a&status[]=b.
  query_arrays: brackets
  probe:
    function: get_organization
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Qonto rejected the request as invalid: errors[].detail and errors[].source name the faulty parameter." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Qonto did not accept the key: it is the login and the secret key joined by a colon (login:secret-key), from Settings, Integrations and partnerships, API key. Retrying unchanged fails the same way." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Qonto refused this read for this key: the member who owns it lacks the right on the organization." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Qonto: wrong id, or not visible to this organization." }
    - { status: 422, code: invalid_request, retryable: false,
        message: "Qonto could not process the request: errors[].detail names the field. Transactions need bank_account_id or iban." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Qonto rate limit reached (1,000 requests per 10 seconds): wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Qonto is temporarily unavailable: retry later." }

functions:
  # --- organization ---------------------------------------------------------

  - name: get_organization
    class: read
    description: >-
      The organization behind the key and its bank accounts: {organization:
      {id, name, slug, legal_name, legal_number, legal_form, legal_address,
      bank_accounts: [{id, name, iban, bic, currency, status, main, balance,
      authorized_balance, balance_cents, updated_at}]}}. Balances are in the
      account currency, in units (balance) and in cents (balance_cents);
      authorized_balance deducts pending debits. A bank account id is what
      list_transactions takes.
    input:
      type: object
      additionalProperties: false
      properties:
        include_external_accounts:
          type: boolean
          description: "Also list the external bank accounts connected to Qonto."
    examples:
      - { title: Balances, input: {} }
    call:
      method: GET
      path: /organization
      query: { include_external_accounts: include_external_accounts }
    cost: { per: request }

  - name: list_memberships
    class: read
    description: >-
      The members of the organization: {memberships: [{id, first_name,
      last_name, email, role, status, team_id}], meta}. role is owner, admin,
      manager, employee, reporting or accountant.
    input:
      type: object
      additionalProperties: false
      properties:
        page: &page { type: integer, minimum: 1, description: "Page number, from 1." }
        per_page: &per_page { type: integer, minimum: 1, maximum: 100, description: "Items per page, 100 at most." }
    examples:
      - { title: Members, input: {} }
    call: { method: GET, path: /memberships, query: { page: page, per_page: per_page } }
    cost: { per: request }

  - name: list_labels
    class: read
    description: >-
      The labels that tag transactions: {labels: [{id, name, parent_id}],
      meta}. A label id is what a transaction's label_ids holds.
    input:
      type: object
      additionalProperties: false
      properties: { page: *page, per_page: *per_page }
    examples:
      - { title: Labels, input: {} }
    call: { method: GET, path: /labels, query: { page: page, per_page: per_page } }
    cost: { per: request }

  # --- transactions ---------------------------------------------------------

  - name: list_transactions
    class: read
    description: >-
      The transactions of ONE bank account (bank_account_id or iban, exactly
      one; get_organization lists them), newest settled first: {transactions:
      [{id, transaction_id, amount, amount_cents, currency, local_amount,
      local_currency, side (credit or debit), operation_type (card, transfer,
      income, direct_debit, qonto_fee, ...), status, label (counterparty),
      reference, note, settled_at, emitted_at, settled_balance, vat_amount,
      vat_rate, category, cashflow_category, label_ids, attachment_ids,
      card_last_digits, initiator_id}], meta {current_page, next_page,
      total_pages, total_count, per_page}}. includes embeds vat_details (VAT
      per rate), labels and attachments. Date bounds are ISO 8601; a pending
      transaction has no settled_at, so a settled_at window leaves it out.
      meta.next_page is null on the last page.
    input:
      type: object
      additionalProperties: false
      properties:
        bank_account_id: { type: string, minLength: 1, description: "Bank account id, from get_organization." }
        iban: { type: string, minLength: 14, description: "Or the IBAN of the bank account." }
        status:
          type: array
          minItems: 1
          items: { type: string, enum: [pending, declined, completed, reversed] }
          description: "Only these statuses."
        side: { type: string, enum: [credit, debit], description: "Money in (credit) or out (debit)." }
        operation_type:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          description: "Only these operation types: card, transfer, income, direct_debit, qonto_fee, cheque, recall, swift_income, ..."
        settled_at_from: &when { type: string, minLength: 10, description: "ISO 8601 date or date-time, inclusive." }
        settled_at_to: *when
        emitted_at_from: *when
        emitted_at_to: *when
        updated_at_from: *when
        updated_at_to: *when
        with_attachments: { type: boolean, description: "true: only with a receipt; false: only without." }
        includes: &includes
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [vat_details, labels, attachments] }
          description: "Associated resources to embed."
        sort_by:
          type: string
          pattern: "^(created_at|updated_at|settled_at|emitted_at)?(:(asc|desc)?)?$"
          description: "property:order, default settled_at:desc."
        page: *page
        per_page: *per_page
    examples:
      - title: October's money in, with VAT
        input: { bank_account_id: "0f9a3c1e-0000-4000-8000-00000000a001", side: credit, status: [completed],
                 settled_at_from: "2026-10-01", settled_at_to: "2026-10-31T23:59:59Z", includes: [vat_details] }
      - title: Card spend without a receipt
        input: { iban: "FR7616958000010000000000000", operation_type: [card], with_attachments: false }
    call:
      method: GET
      path: /transactions
      query: { bank_account_id: bank_account_id, iban: iban, status: status, side: side,
               operation_type: operation_type, settled_at_from: settled_at_from,
               settled_at_to: settled_at_to, emitted_at_from: emitted_at_from,
               emitted_at_to: emitted_at_to, updated_at_from: updated_at_from,
               updated_at_to: updated_at_to, with_attachments: with_attachments,
               includes: includes, sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_transaction
    class: read
    description: >-
      One transaction by its id (the UUID, not the transaction_id slug):
      {transaction: {...}}, the same fields as list_transactions.
    input:
      type: object
      additionalProperties: false
      required: [transaction_id]
      properties:
        transaction_id: { type: string, minLength: 1, description: "The transaction's id (UUID)." }
        includes: *includes
    examples:
      - { title: One transaction with its receipts, input: { transaction_id: "0f9a3c1e-0000-4000-8000-00000000b001", includes: [attachments] } }
    call:
      method: GET
      path: /transactions/{transaction_id}
      query: { includes: includes }
    cost: { per: request }

  - name: list_transaction_attachments
    class: read
    description: >-
      The receipts attached to one transaction: {attachments: [{id,
      file_name, file_size, file_content_type, url, created_at}], meta}. url is
      signed and expires 30 minutes after the call.
    input:
      type: object
      additionalProperties: false
      required: [transaction_id]
      properties:
        transaction_id: { type: string, minLength: 1, description: "The transaction's id (UUID)." }
        page: *page
        per_page: *per_page
    examples:
      - { title: Receipts of a transaction, input: { transaction_id: "0f9a3c1e-0000-4000-8000-00000000b001" } }
    call:
      method: GET
      path: /transactions/{transaction_id}/attachments
      query: { page: page, per_page: per_page }
    cost: { per: request }

  - name: get_attachment
    class: read
    description: >-
      One attachment (a receipt or an invoice file): {attachment: {id,
      file_name, file_size, file_content_type, url, probative_attachment}}.
      url is signed and expires 30 minutes after the call.
    input:
      type: object
      additionalProperties: false
      required: [attachment_id]
      properties:
        attachment_id: { type: string, minLength: 1, description: "Attachment id, from a transaction or a supplier invoice." }
    examples:
      - { title: An invoice file, input: { attachment_id: "0f9a3c1e-0000-4000-8000-00000000c001" } }
    call: { method: GET, path: "/attachments/{attachment_id}" }
    cost: { per: request }

  # --- statements -----------------------------------------------------------

  - name: list_statements
    class: read
    description: >-
      Monthly bank statements, newest period first: {statements: [{id,
      bank_account_id, period (MM-YYYY), file {file_name, file_url, ...}}],
      meta}. bank_account_ids and ibans are exclusive; periods are MM-YYYY.
    input:
      type: object
      additionalProperties: false
      properties:
        bank_account_ids: &ids { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: "Only these bank accounts." }
        ibans: { type: array, minItems: 1, items: { type: string, minLength: 14 }, description: "Or only these IBANs." }
        period_from: &period { type: string, pattern: "^(0[1-9]|1[0-2])-[0-9]{4}$", description: "First month, MM-YYYY." }
        period_to:
          <<: *period
          description: "Last month, MM-YYYY."
        sort_by: { type: string, enum: ["period:asc", "period:desc"], description: "Default period:desc." }
        page: *page
        per_page: *per_page
    examples:
      - { title: This year's statements, input: { period_from: "01-2026", period_to: "12-2026" } }
    call:
      method: GET
      path: /statements
      query: { bank_account_ids: bank_account_ids, ibans: ibans, period_from: period_from,
               period_to: period_to, sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_statement
    class: read
    description: "One statement: {statement: {id, bank_account_id, period, file}}; the file url is signed."
    input:
      type: object
      additionalProperties: false
      required: [statement_id]
      properties:
        statement_id: { type: string, minLength: 1, description: "Statement id, from list_statements." }
    examples:
      - { title: One statement, input: { statement_id: "0f9a3c1e-0000-4000-8000-00000000d001" } }
    call: { method: GET, path: "/statements/{statement_id}" }
    cost: { per: request }

  # --- spend ----------------------------------------------------------------

  - name: list_supplier_invoices
    class: read
    description: >-
      Invoices and receipts received (forwarded by email, uploaded, e-invoices):
      {supplier_invoices: [{id, status, supplier_name, invoice_number,
      issue_date, due_date, payment_date, total_amount {value, currency},
      total_amount_excluding_taxes, total_tax_amount, payable_amount,
      attachment_id, file_name, attachment_category, matched_transactions_ids,
      is_credit_note}], meta}. Amounts are decimal strings. query searches the
      supplier name, amount, file name and invoice number.
    input:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [to_review, to_approve, awaiting_payment, pending, scheduled, paid, archived, rejected, discarded]
          description: "Only this status."
        created_at_from: *when
        created_at_to: *when
        updated_at_from: *when
        updated_at_to: *when
        query: { type: string, minLength: 1, description: "Full-text search." }
        page: *page
        per_page: *per_page
    examples:
      - { title: Invoices to review, input: { status: to_review } }
      - { title: One supplier's invoices, input: { query: "Acme" } }
    call:
      method: GET
      path: /supplier_invoices
      query: { "filter[status]": status, "filter[created_at_from]": created_at_from,
               "filter[created_at_to]": created_at_to, "filter[updated_at_from]": updated_at_from,
               "filter[updated_at_to]": updated_at_to, query: query, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_supplier_invoice
    class: read
    description: "One supplier invoice: {supplier_invoice: {...}}, the fields of list_supplier_invoices and more."
    input:
      type: object
      additionalProperties: false
      required: [supplier_invoice_id]
      properties:
        supplier_invoice_id: { type: string, minLength: 1, description: "Supplier invoice id." }
    examples:
      - { title: One supplier invoice, input: { supplier_invoice_id: "0f9a3c1e-0000-4000-8000-00000000e001" } }
    call: { method: GET, path: "/supplier_invoices/{supplier_invoice_id}" }
    cost: { per: request }

  - name: list_sepa_transfers
    class: read
    description: >-
      Outgoing SEPA transfers, last updated first: {transfers: [{id,
      beneficiary_id, amount, currency, reference, note, status,
      scheduled_date, processed_at, transaction_id}], meta}.
    input:
      type: object
      additionalProperties: false
      properties:
        status:
          type: array
          minItems: 1
          items: { type: string, enum: [pending, processing, canceled, declined, settled] }
          description: "Only these statuses."
        beneficiary_ids: *ids
        updated_at_from: *when
        updated_at_to: *when
        scheduled_date_from: *when
        scheduled_date_to: *when
        sort_by: { type: string, enum: ["updated_at:asc", "updated_at:desc", "scheduled_date:asc", "scheduled_date:desc"] }
        page: *page
        per_page: *per_page
    examples:
      - { title: Settled transfers, input: { status: [settled] } }
    call:
      method: GET
      path: /sepa/transfers
      query: { status: status, beneficiary_ids: beneficiary_ids, updated_at_from: updated_at_from,
               updated_at_to: updated_at_to, scheduled_date_from: scheduled_date_from,
               scheduled_date_to: scheduled_date_to, sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: list_sepa_beneficiaries
    class: read
    description: >-
      Saved SEPA payees: {beneficiaries: [{id, name, iban, bic, email,
      status, trusted, activity_tag, created_at, updated_at}], meta}. 25 per
      page by default.
    input:
      type: object
      additionalProperties: false
      properties:
        status:
          type: array
          minItems: 1
          items: { type: string, enum: [pending, validated, declined] }
          description: "Only these statuses."
        iban: { type: array, minItems: 1, items: { type: string, minLength: 14 }, description: "Only these IBANs." }
        trusted: { type: boolean, description: "Only trusted, or untrusted, payees." }
        sort_by: { type: string, enum: ["updated_at:asc", "updated_at:desc"] }
        page: *page
        per_page: *per_page
    examples:
      - { title: Trusted payees, input: { trusted: true } }
    call:
      method: GET
      path: /sepa/beneficiaries
      query: { status: status, iban: iban, trusted: trusted, sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: list_requests
    class: read
    description: >-
      Spend requests from members (a transfer, several transfers, a flash or a
      virtual card) and their approval: {requests: [{id, request_type, status,
      initiator_id, approver_id, amount, currency, note, created_at,
      processed_at, ...}], meta}.
    input:
      type: object
      additionalProperties: false
      properties:
        status:
          type: array
          minItems: 1
          items: { type: string, enum: [pending, approved, canceled, declined] }
          description: "Only these statuses."
        request_type:
          type: array
          minItems: 1
          items: { type: string, enum: [transfer, multi_transfer, flash_card, virtual_card] }
          description: "Only these request types."
        created_at_from: *when
        processed_at_from: *when
        sort_by: { type: string, pattern: "^(processed_at|created_at|status):(asc|desc)$", description: "Default created_at:desc." }
        page: *page
        per_page: *per_page
    examples:
      - { title: Pending requests, input: { status: [pending] } }
    call:
      method: GET
      path: /requests
      query: { status: status, request_type: request_type, created_at_from: created_at_from,
               processed_at_from: processed_at_from, sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  # --- invoicing ------------------------------------------------------------

  - name: list_client_invoices
    class: read
    description: >-
      Invoices issued from Qonto, newest first: {client_invoices: [{id,
      number, status (draft, unpaid, paid, canceled), client, issue_date,
      due_date, total_amount {value, currency}, vat_amount, paid_at,
      invoice_url, ...}], meta}. Invoices imported into Qonto are left out
      unless exclude_imported is false. per_page goes up to 500.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [draft, unpaid, paid, canceled], description: "Only this status." }
        created_at_from: *when
        created_at_to: *when
        updated_at_from: *when
        updated_at_to: *when
        due_date_from: *when
        due_date_to: *when
        exclude_imported: { type: boolean, description: "Default true." }
        sort_by: &created_sort { type: string, enum: ["created_at:asc", "created_at:desc"], description: "Default created_at:desc." }
        page: *page
        per_page: &per_page_500 { type: integer, minimum: 1, maximum: 500, description: "Items per page, 500 at most." }
    examples:
      - { title: Unpaid invoices, input: { status: unpaid } }
    call:
      method: GET
      path: /client_invoices
      query: { "filter[status]": status, "filter[created_at_from]": created_at_from,
               "filter[created_at_to]": created_at_to, "filter[updated_at_from]": updated_at_from,
               "filter[updated_at_to]": updated_at_to, "filter[due_date_from]": due_date_from,
               "filter[due_date_to]": due_date_to, exclude_imported: exclude_imported,
               sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_client_invoice
    class: read
    description: "One client invoice with its items: {client_invoice: {...}}."
    input:
      type: object
      additionalProperties: false
      required: [client_invoice_id]
      properties:
        client_invoice_id: { type: string, minLength: 1, description: "Client invoice id." }
    examples:
      - { title: One invoice, input: { client_invoice_id: "0f9a3c1e-0000-4000-8000-00000000f001" } }
    call: { method: GET, path: "/client_invoices/{client_invoice_id}" }
    cost: { per: request }

  - name: list_credit_notes
    class: read
    description: >-
      Credit notes issued against client invoices, newest first:
      {credit_notes: [{id, number, invoice_id, issue_date, total_amount,
      vat_amount, client, ...}], meta}.
    input:
      type: object
      additionalProperties: false
      properties:
        created_at_from: *when
        created_at_to: *when
        sort_by: *created_sort
        page: *page
        per_page: *per_page
    examples:
      - { title: Credit notes, input: {} }
    call:
      method: GET
      path: /credit_notes
      query: { "filter[created_at_from]": created_at_from, "filter[created_at_to]": created_at_to,
               sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: list_quotes
    class: read
    description: >-
      Quotes issued from Qonto, newest first: {quotes: [{id, number, status
      (pending_approval, approved, canceled), client, issue_date, expiry_date,
      total_amount, ...}], meta}. per_page goes up to 500.
    input:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending_approval, approved, canceled], description: "Only this status." }
        created_at_from: *when
        created_at_to: *when
        sort_by: *created_sort
        page: *page
        per_page: *per_page_500
    examples:
      - { title: Approved quotes, input: { status: approved } }
    call:
      method: GET
      path: /quotes
      query: { "filter[status]": status, "filter[created_at_from]": created_at_from,
               "filter[created_at_to]": created_at_to, sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: list_clients
    class: read
    description: >-
      The customers invoiced from Qonto: {clients: [{id, kind (company,
      individual, freelancer), name, first_name, last_name, email,
      vat_number, tax_identification_number, billing_address, currency,
      locale, ...}], meta}. name matches partially, case and accents ignored
      (2 characters at least); email, vat_number and tax_identification_number
      match exactly.
    input:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, description: "Part of the client's name." }
        email: { type: string, minLength: 3, description: "Exact email." }
        vat_number: { type: string, minLength: 2, description: "Exact VAT number." }
        tax_identification_number: { type: string, minLength: 2, description: "Exact tax id (SIREN in France)." }
        updated_at_from: *when
        updated_at_to: *when
        sort_by:
          type: string
          enum: ["created_at:asc", "created_at:desc", "updated_at:asc", "updated_at:desc", "name:asc", "name:desc"]
          description: "Default name:asc."
        page: *page
        per_page: *per_page
    examples:
      - { title: Find a client, input: { name: "Dupont" } }
    call:
      method: GET
      path: /clients
      query: { "filter[name]": name, "filter[email]": email, "filter[vat_number]": vat_number,
               "filter[tax_identification_number]": tax_identification_number,
               "filter[updated_at_from]": updated_at_from, "filter[updated_at_to]": updated_at_to,
               sort_by: sort_by, page: page, per_page: per_page }
    cost: { per: request }

  - name: get_client
    class: read
    description: "One client: {client: {...}}, the fields of list_clients."
    input:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: { type: string, minLength: 1, description: "Client id." }
    examples:
      - { title: One client, input: { client_id: "0f9a3c1e-0000-4000-8000-00000000f002" } }
    call: { method: GET, path: "/clients/{client_id}" }
    cost: { per: request }
