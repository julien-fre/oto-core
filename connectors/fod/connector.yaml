# yaml-language-server: $schema=../connector.schema.json
# France Open Data (FOD), Otomata's service over French public data:
#   https://data.oto.zone/openapi.json
# Every /api/* route needs Authorization: Bearer <key>, one key per consumer.
# FOD holds no third-party credential for the routes described here.
#
# Read only. urban_start_regulation_ingestion starts a background job that fills
# FOD's own cache of local-plan regulations and changes nothing elsewhere; it is
# a read. Six families,
# prefixed in the function names: company_ (company registers, BODACC, INPI
# accounts), property_ (address, cadastre, DPE, DVF, building permits), urban_
# (zoning, written regulation of a local plan, natural and technological risks,
# classified facilities, public services), law_ (consolidated codes and case
# law), tax_ (BOFiP tax doctrine: the administration's reading, kept apart from
# the law), compliance_ (asset-freeze screening; a POST that reads, the name
# kept out of the URL).
#
# Several lookups answer 200 with null, or with {"error": ...}, when nothing
# matches; expect turns them into named refusals. A 500 comes back when a
# required combination of filters is missing: the input schemas require it.
connector:
  name: fod
  label: France Open Data
  namespace: fod
  version: 1.2.0
  api_version: "france-opendata-service 6f69e80 (routes unversioned)"
  base_url: https://data.oto.zone
  auth:
    kind: bearer
    token: api_key
  credential:
    - { name: api_key, label: FOD API key, secret: true }
  modes: [platform, byo_org]
  timeout_s: 60
  probe: { function: law_list_codes, non_empty: [codes] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "FOD or its upstream source rejected an argument as invalid; the message names the accepted values when there is a closed list." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "FOD refused the API key: unknown, revoked or missing. Retrying unchanged fails the same way." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in FOD: check the identifier." }
    - { status: 422, code: invalid_arguments, retryable: false,
        message: "FOD rejected the arguments: a value has the wrong type or is out of bounds." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "The upstream public source behind FOD reached its quota: retry in a moment." }
    - { status: 500, code: service_error, retryable: false,
        message: "FOD failed on this request, most often an argument combination it does not handle; retrying unchanged usually fails the same way." }
    - { status: [502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "FOD or the public source behind it is temporarily unavailable or busy: retry later." }

functions:
  # --- Companies: identity, officers, legal notices, accounts --------------
  - name: company_search
    class: read
    description: >-
      Search French companies (all legal units, from the national company
      register open data) by cumulative criteria: name, activity, place, size,
      legal form, collective agreement. Use it to identify a contract party
      when its SIREN is unknown, or to find the companies of a person's group.
      The name goes in query; a legal form spoken with the name ("SCI Les
      Tilleuls") does not belong there: put the name alone in query and the
      form in nature_juridique (6540 = SCI, 5710 = SAS, 5499 = SARL). Returns
      {results: [{siren, nom_complet, siege, dirigeants, finances, ...}],
      total_results, page, per_page, total_pages}. At least one criterion is
      required.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [query] }
        - { required: [naf] }
        - { required: [departement] }
        - { required: [code_postal] }
        - { required: [commune] }
        - { required: [employees] }
        - { required: [categorie_entreprise] }
        - { required: [ca_min] }
        - { required: [ca_max] }
        - { required: [idcc] }
        - { required: [nature_juridique] }
      properties:
        query: { type: string, minLength: 1, description: "Name, brand or acronym; also accepts a SIREN or SIRET." }
        naf:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{2}\\.[0-9]{2}[A-Z]$" }
          description: "Main activity codes (NAF rev. 2, such as 69.10Z for legal activities, 68.20B for letting of non-residential property)."
        departement: &departement { type: string, pattern: "^([0-9]{2}|2A|2B|97[1-6])$", description: "Department code, such as 33, 2A or 974." }
        code_postal: { type: string, pattern: "^[0-9]{5}$", description: "Postal code of an establishment." }
        commune: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE code of the commune of an establishment (not its name, not its postal code)." }
        employees:
          type: array
          minItems: 1
          items: { type: string, enum: ["NN", "00", "01", "02", "03", "11", "12", "21", "22", "31", "32", "41", "42", "51", "52", "53"] }
          description: "INSEE headcount bands of the establishment (00 = none, 01 = 1-2, 02 = 3-5, 03 = 6-9, 11 = 10-19, 12 = 20-49 ... 53 = 10,000 and more; NN = not filled)."
        categorie_entreprise: { type: string, enum: [PME, ETI, GE], description: "INSEE size category." }
        ca_min: { type: integer, minimum: 1, description: "Minimum turnover, in euros." }
        ca_max: { type: integer, minimum: 1, description: "Maximum turnover, in euros." }
        idcc:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, pattern: "^[0-9]{1,4}$" }
          description: "One collective agreement code (IDCC), such as 1486 for engineering and consulting firms (Syntec). One code per call."
        nature_juridique:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{4}$" }
          description: "INSEE legal-form codes, level III (6540 = SCI, 5710 = SAS, 5499 = SARL, 5485 = SELARL)."
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 25, default: 25 }
    examples:
      - title: An SCI by its name in Gironde
        input: { query: Les Tilleuls, nature_juridique: ["6540"], departement: "33" }
      - title: SELARLs in legal activities in Bordeaux
        input: { naf: ["69.10Z"], commune: "33063", nature_juridique: ["5485"], per_page: 10 }
    call:
      method: POST
      path: /api/fr/entreprises/search
      body: { query: query, naf: naf, departement: departement, code_postal: code_postal,
              commune: commune, employees: employees, categorie_entreprise: categorie_entreprise,
              ca_min: ca_min, ca_max: ca_max, idcc: idcc, nature_juridique: nature_juridique,
              page: page, per_page: per_page }
    cost: { per: request }

  - name: company_get
    class: read
    description: >-
      Get the full record of one French company by its SIREN: identity, legal
      form, registered office, activity, headcount band, VAT number, closure
      status (etat_administratif, date_fermeture), latest summary accounts,
      officers, collective agreements and some thirty labels. Use it to check
      that a contract party exists, is active, and is what the contract says
      it is.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: &siren { type: string, pattern: "^[0-9]{9}$", description: "SIREN, 9 digits without spaces." }
    examples:
      - title: Record of Danone
        input: { siren: "552032534" }
    refusals:
      - &company_not_found { code: company_not_found, when: "the response is null", message: "No French company with this SIREN in the register." }
    expect:
      - { kind: non_empty, refusal: company_not_found, path: siren }
    call: { method: GET, path: "/api/fr/entreprises/{siren}" }
    cost: { per: request }

  - name: company_list_directors
    class: read
    description: >-
      List the officers of a French company as declared in the national
      register (RNE): [{nom, prenoms, date_de_naissance, qualite,
      type_dirigeant}]. An officer is a natural person or a legal person
      (type_dirigeant "personne morale", with its own siren): a subsidiary is
      often chaired by a company. Use it to check who has power to sign for a
      company that is a contract party. Empty list when none is declared or the SIREN is
      unknown.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
    examples:
      - title: Officers of Danone
        input: { siren: "552032534" }
    call: { method: GET, path: "/api/fr/entreprises/{siren}/directors" }
    cost: { per: request }

  - name: company_list_bodacc_notices
    class: read
    description: >-
      List the BODACC legal notices of a French company, newest first:
      insolvency proceedings, changes, filing of accounts, sales and transfers
      of a business, registrations and deregistrations. Returns {results:
      [{dateparution, familleavis, familleavis_lib, tribunal, texte, ...}],
      total_count}. Use it before contracting with a company: an insolvency
      proceeding (famille collective) is the strongest signal read here, and
      the publication date is not the date of the judgment.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
        famille:
          type: string
          enum: [collective, conciliation, creation, divers, dpc, immatriculation, modification, radiation, retablissement_professionnel, vente]
          description: "Only one family, by its code: collective (insolvency proceedings), dpc (filing of accounts), vente (sale or transfer of a business)... Not the label the output shows."
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: Insolvency proceedings of a company
        input: { siren: "552032534", famille: collective }
      - title: Latest notices of any kind
        input: { siren: "552032534", limit: 10 }
    call:
      method: GET
      path: "/api/fr/bodacc/{siren}"
      query: { famille: famille, limit: limit }
    cost: { per: request }

  - name: company_list_fiscal_years
    class: read
    description: >-
      List the fiscal years of a French company for which annual accounts were
      filed with INPI, newest first: [{date_cloture_exercice, type_bilan,
      confidentiality, chiffre_d_affaires, ...}]. A confidential filing has no
      figures. Gives the exact closing date a balance sheet is read by. The
      first call after a restart of the service is slow.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
    examples:
      - title: Filed fiscal years of Danone
        input: { siren: "552032534" }
    call: { method: GET, path: "/api/fr/inpi/{siren}/exercises" }
    cost: { per: request }

  - name: company_get_balance_sheet
    class: read
    description: >-
      Get the balance sheet of one fiscal year of a French company, as filed
      with INPI: the raw items of the tax return (CERFA 2050-2053 or 2033,
      under liasse, keyed by item code), with turnover and net result derived
      from them. Use it to assess the financial standing of a contract party,
      such as a customer, a supplier or a guarantor. date_cloture must be exactly one of the
      closing dates of this company's filed fiscal years.
    input:
      type: object
      additionalProperties: false
      required: [siren, date_cloture]
      properties:
        siren: *siren
        date_cloture: &date { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "YYYY-MM-DD." }
    examples:
      - title: Danone's 2024 balance sheet
        input: { siren: "552032534", date_cloture: "2024-12-31" }
    refusals:
      - { code: balance_sheet_not_found, when: "the response is null",
          message: "No balance sheet filed for this SIREN at this closing date: the date must match a filed fiscal year exactly." }
    expect:
      - { kind: non_empty, refusal: balance_sheet_not_found, path: siren }
    call:
      method: GET
      path: "/api/fr/inpi/{siren}/bilan"
      query: { date_cloture: date_cloture }
    cost: { per: request }

  # --- Property: address, parcel, energy, sales, permits --------------------
  - name: property_geocode_address
    class: read
    description: >-
      Geocode a French address with the national address base (BAN), best
      match first: [{label, score, lon, lat, type, citycode, city, postcode}].
      citycode is the INSEE code of the commune (an arrondissement code in
      Paris, Lyon and Marseille). Use it to normalise the address of a property
      and get the point and commune code that parcel, zoning and risk lookups
      take. A score under about 0.5 is a doubtful match.
    input:
      type: object
      additionalProperties: false
      required: [adresse]
      properties:
        adresse: &adresse { type: string, minLength: 3, description: "Free-text address, ideally with postal code and town." }
        limit: { type: integer, minimum: 1, maximum: 50, default: 5 }
        postcode: { type: string, pattern: "^[0-9]{5}$", description: "Only results in this postal code." }
        citycode: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "Only results in this INSEE commune." }
    examples:
      - title: Address of a flat in Bordeaux
        input: { adresse: "15 cours de l'Intendance, 33000 Bordeaux", limit: 1 }
    call:
      method: POST
      path: /api/foncier/ban/search
      body: { adresse: adresse, limit: limit, postcode: postcode, citycode: citycode }
    cost: { per: request }

  - name: property_reverse_geocode
    class: read
    description: >-
      Give the nearest BAN address of a point: {label, score, lon, lat,
      citycode, city, postcode}.
    input:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: &lat { type: number, minimum: -90, maximum: 90, description: "Latitude, WGS 84." }
        lon: &lon { type: number, minimum: -180, maximum: 180, description: "Longitude, WGS 84." }
    examples:
      - title: Address at a point in Lyon
        input: { lat: 45.758381, lon: 4.83276 }
    refusals:
      - { code: address_not_found, when: "the response is null", message: "No address near this point in the national address base." }
    expect:
      - { kind: non_empty, refusal: address_not_found, path: label }
    call:
      method: GET
      path: /api/foncier/ban/reverse
      query: { lat: lat, lon: lon }
    cost: { per: request }

  - name: property_get_cadastral_parcel
    class: read
    description: >-
      Get the cadastral parcel that contains a point: {idu, commune,
      code_insee, section, numero, contenance_m2, geometry}. Use it to check
      the cadastral references and area a document gives for a property. A
      geocoded house number often falls on the street, outside any parcel:
      the point must lie inside the plot.
    input:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: *lat
        lon: *lon
    examples:
      - title: Parcel of 12 rue de la Paix, Paris
        input: { lat: 48.869141, lon: 2.331303 }
    refusals:
      - { code: parcel_not_found, when: "the response is null",
          message: "No cadastral parcel contains this point: it may lie on a public road; move it inside the plot." }
    expect:
      - { kind: non_empty, refusal: parcel_not_found, path: idu }
    call:
      method: GET
      path: /api/foncier/cadastre/parcelle
      query: { lat: lat, lon: lon }
    cost: { per: request }

  - name: property_list_energy_ratings
    class: read
    description: >-
      List the energy performance diagnoses (DPE, ADEME) of dwellings around an
      address, nearest first: {adresse_geocodee, code_commune, count, dpe:
      [{etiquette_dpe, etiquette_ges, conso_ep_kwh_m2_an, surface_habitable,
      annee_construction, type_batiment, adresse, date_dpe, distance_m}]}. Use
      it to check the DPE a sale or a lease must carry. In a block of flats a
      building has many DPE: match by address, surface and date, never by
      proximity alone.
    input:
      type: object
      additionalProperties: false
      required: [adresse]
      properties:
        adresse: *adresse
        radius_m: { type: integer, minimum: 1, default: 200, description: "Search radius around the geocoded address, in metres." }
        type_batiment: { type: string, enum: [maison, appartement, immeuble] }
        etiquette: { type: string, enum: [A, B, C, D, E, F, G], description: "Only this energy label." }
        surface_min: &surface_min { type: number, minimum: 0, description: "Minimum living area, m²." }
        surface_max: &surface_max { type: number, minimum: 0, description: "Maximum living area, m²." }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    examples:
      - title: DPE of a flat place Bellecour
        input: { adresse: "8 place Bellecour, 69002 Lyon", radius_m: 50, type_batiment: appartement }
    refusals:
      - &address_not_geocoded { code: address_not_geocoded, when: "the response carries error geocode_failed",
          message: "The address could not be geocoded: give a full address with postal code and town." }
    expect:
      - { kind: non_empty, refusal: address_not_geocoded, path: adresse_geocodee }
    call:
      method: POST
      path: /api/foncier/dpe/by_address
      body: { adresse: adresse, radius_m: radius_m, type_batiment: type_batiment, etiquette: etiquette,
              surface_min: surface_min, surface_max: surface_max, limit: limit }
    cost: { per: request }

  - name: property_list_comparable_sales
    class: read
    description: >-
      List the property sales recorded in DVF (land registry transfers, from
      2014) around an address, most recent first: {adresse_geocodee,
      code_commune, count, median_prix_m2, mutations: [{date_mutation,
      nature_mutation, valeur_fonciere, type_local, surface_reelle_bati,
      surface_terrain, prix_m2, vefa, id_parcelle, adresse, distance_m}]}. Use
      it to check a price against the local market or to value an estate
      property. Every kind of sale is listed (outbuildings, land, mixed
      premises) unless filtered. DVF does not cover Alsace-Moselle and Mayotte.
    input:
      type: object
      additionalProperties: false
      required: [adresse]
      properties:
        adresse: *adresse
        radius_m: { type: integer, minimum: 1, default: 500, description: "Search radius around the geocoded address, in metres." }
        type_local: &type_local { type: string, enum: [Appartement, Maison], description: "Only single dwellings of this kind." }
        surface_min: *surface_min
        surface_max: *surface_max
        years: &years { type: integer, minimum: 1, default: 3, description: "Depth in years, counted back from the latest year with data." }
        limit: { type: integer, minimum: 1, default: 50 }
    examples:
      - title: Flat sales near a Bordeaux address over two years
        input: { adresse: "15 cours de l'Intendance, 33000 Bordeaux", radius_m: 300, type_local: Appartement, years: 2 }
    refusals:
      - *address_not_geocoded
    expect:
      - { kind: non_empty, refusal: address_not_geocoded, path: adresse_geocodee }
    call:
      method: POST
      path: /api/foncier/dvf/comparables_by_address
      body: { adresse: adresse, radius_m: radius_m, type_local: type_local, surface_min: surface_min,
              surface_max: surface_max, years: years, limit: limit }
    cost: { per: request }

  - name: property_get_price_stats
    class: read
    description: >-
      Get the price per m² statistics of a commune from DVF: {count,
      median_prix_m2, mean_prix_m2, min_prix_m2, max_prix_m2, by_year: {year:
      {count, median_prix_m2}}}. Only single flats and houses are counted, and
      outliers (under 100 or over 50,000 €/m²) are left out. Use it to place a
      price within its commune.
    input:
      type: object
      additionalProperties: false
      required: [code_commune]
      properties:
        code_commune: &code_insee { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE commune code, 5 characters (not the postal code)." }
        type_local: *type_local
        years: *years
    examples:
      - title: House prices in Bordeaux over three years
        input: { code_commune: "33063", type_local: Maison, years: 3 }
    call:
      method: POST
      path: /api/foncier/dvf/stats
      body: { code_commune: code_commune, type_local: type_local, years: years }
    cost: { per: request }

  - name: property_search_building_permits
    class: read
    description: >-
      Search building and development permits (Sitadel, Ministry for Ecological
      Transition) by commune, department, year of filing or applicant company:
      {total, page, page_size, permis: [{type, num_dau, date_depot,
      date_autorisation, etat, demandeur, adresse, parcelles, logements,
      surf_hab_creee_m2, ...}]}. kind chooses the file: logements (permits
      creating dwellings), locaux (non-residential premises), amenager
      (development permits). Use it to check the permits on a property or a
      plot: the parcel is not a filter, so search the commune and read the
      parcelles of each permit. Applicants who are natural persons are not
      published.
    input:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [logements, locaux, amenager], default: logements }
        communes: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE commune code." }
        dept: *departement
        an_min: { type: integer, minimum: 2000, description: "First year of filing, included." }
        an_max: { type: integer, minimum: 2000, description: "Last year of filing, included." }
        siren: { type: string, pattern: "^[0-9]{9}$", description: "SIREN of the applicant; valid without any place." }
        siret: { type: string, pattern: "^[0-9]{14}$", description: "SIRET of the applicant." }
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { enum: [10, 20, 50, 100], default: 50 }
    examples:
      - title: Housing permits filed in Bordeaux in 2024 and 2025
        input: { kind: logements, communes: "33063", an_min: 2024, an_max: 2025 }
      - title: Housing permits filed by Bouygues Immobilier
        input: { kind: logements, siren: "562091546", page_size: 20 }
    call:
      method: POST
      path: /api/foncier/sitadel/search
      body: { kind: kind, communes: communes, dept: dept, an_min: an_min, an_max: an_max,
              siren: siren, siret: siret, page: page, page_size: page_size }
    cost: { per: request }

  # --- Town planning and risks ---------------------------------------------
  - name: urban_get_zoning
    class: read
    description: >-
      Get the town-planning zoning that applies at a point, from the national
      town-planning portal (GPU): {zone: {libelle, libelle_long, type_zone,
      idurba, reglement_url}, zones_superposees, prescriptions, informations,
      servitudes_utilite_publique, document, documents_couvrants,
      avertissements}. Use it for the planning information of a property: zone of
      the local plan (PLU, PLUi), easements of public interest, pre-emption
      perimeters. zone.idurba and zone.libelle lead to the written regulation
      of the zone. zone and document are null when the commune has no
      digitised plan (national planning rules apply, or the plan is not
      published).
    input:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: *lon
        lat: *lat
    examples:
      - title: Zoning place Bellecour, Lyon
        input: { lon: 4.83276, lat: 45.758381 }
    call:
      method: GET
      path: /api/urba/gpu/zonage
      query: { lon: lon, lat: lat }
    cost: { per: request }

  - name: urban_get_zoning_regulation
    class: read
    description: >-
      Read the written regulation (règlement écrit) of a local plan (PLU,
      PLUi, PSMV): height, footprint, setbacks, prohibited uses, parking.
      idurba and zone come from the zoning at the point (zone.idurba,
      zone.libelle, case kept). With zone alone, the zone's chapter in
      extraits[0], cut at max_chars (tronque); a sector without its own
      chapter (UAa) gets its parent zone's (section.zone_chapitre UA). With
      query too, the passages of that chapter holding it, case and accents
      ignored, in French (hauteur, emprise au sol, recul). With query alone,
      passages of the whole document, general provisions included. Returns
      {idurba, cached, titre, section, nb_occurrences, extraits, note};
      section is null when no chapter of the zone is found. Quote the raw
      extracts, never a figure they do not hold: rules drawn on a graphic
      document are not in the text. cached false comes with a statut: start
      the ingestion, then read its state until pret. scanne_probable true
      means a scanned PDF, unreadable without OCR.
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      anyOf:
        - { required: [zone] }
        - { required: [query] }
      properties:
        idurba: &idurba
          type: string
          pattern: "^[0-9A-Za-z]{5,9}_(PLU|PLUI|PLUi|POS|CC|PSMV)_[0-9]{8}(_[0-9A-Za-z]{1,5})?$"
          description: "Identifier of the planning document, as zone.idurba of the zoning: 80021_PLU_20251211."
        zone: { type: string, minLength: 1, maxLength: 30, description: "Zone code as zone.libelle of the zoning, case kept: UA, UCe1b, 1AUb." }
        query: { type: string, minLength: 2, maxLength: 100, description: "Words to find in the French text: hauteur, emprise au sol, recul." }
        max_extraits: { type: integer, minimum: 1, maximum: 50, default: 8, description: "Most passages returned." }
        context_lignes: { type: integer, minimum: 1, maximum: 200, default: 30, description: "Lines kept after each match in a passage." }
        max_chars: { type: integer, minimum: 1000, maximum: 200000, default: 40000, description: "Cut the zone's chapter at this length (zone without query)." }
    examples:
      - title: Chapter of sector UAa, Amiens local plan
        input: { idurba: 80021_PLU_20251211, zone: UAa }
      - title: Height rules of zone UCe1b, Lyon metropolitan plan
        input: { idurba: 200046977_PLUI_20260326, zone: UCe1b, query: hauteur, max_extraits: 5 }
    call:
      method: GET
      path: /api/reglement
      query: { idurba: idurba, zone: zone, query: query, max_extraits: max_extraits,
               context_lignes: context_lignes, max_chars: max_chars }
    cost: { per: request }

  - name: urban_start_regulation_ingestion
    class: read
    description: >-
      Ask FOD to fetch and index the written regulation of a local plan it does
      not hold yet, from the national town-planning portal (GPU). The work runs
      in the background, from 20 seconds to a few minutes; the answer comes at
      once with the state {idurba, statut, message, ...}: en_cours (started, or
      already running), pret or scanne (already held, nothing restarted), echec
      (a recent failure, erreur gives the cause; no new attempt before
      relance_possible_apres). Calling it again never starts a second
      ingestion. Then read the ingestion state every 20 to 30 seconds until
      pret, scanne or echec. FOD ingests one regulation at a time: a busy
      answer asks to retry in a minute. A document replaced on the portal is
      not swapped for its successor; the refusal names the documents published
      for the same territory.
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      properties:
        idurba: *idurba
    examples:
      - title: Regulation of the Amiens local plan
        input: { idurba: 80021_PLU_20251211 }
    refusals:
      - { code: regulation_not_published, when: 404,
          message: "The national town-planning portal does not publish this document or its written regulation (a municipal map, carte communale, has none); autres_documents names the documents published for the same territory." }
    call:
      method: POST
      path: "/api/reglements/{idurba}/ingestion"
    cost: { per: request }

  - name: urban_get_regulation_ingestion
    class: read
    description: >-
      Read the state of the ingestion of a local plan's written regulation in
      FOD: {idurba, statut, message, ...}. statut is absent (never asked),
      en_cours (with depuis), pret (readable; titre, doc_type, text_chars, and
      sources, the PDF addresses on the portal), scanne (a scanned PDF,
      unreadable without OCR: say so and give the source) or echec (erreur
      gives the cause, relance_possible_apres when a new attempt is allowed).
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      properties:
        idurba: *idurba
    examples:
      - title: State of the Lyon metropolitan plan's regulation
        input: { idurba: 200046977_PLUI_20260326 }
    call:
      method: GET
      path: "/api/reglements/{idurba}/ingestion"
    cost: { per: request }

  - name: urban_list_commune_risks
    class: read
    description: >-
      List the natural and technological risks recorded for a commune
      (Géorisques, GASPAR): {code_insee, risques: [labels]}, such as flood,
      ground movement, clay shrink-swell, earthquake, radon, industrial risk.
      Use it to prepare the risk and pollution statement (ERP) annexed to a
      sale or lease. Takes the commune code: in Paris, Lyon and Marseille the
      whole city (75056, 69123, 13055), not an arrondissement, whose list comes
      back empty.
    input:
      type: object
      additionalProperties: false
      required: [code_insee]
      properties:
        code_insee: *code_insee
    examples:
      - title: Risks recorded in Bordeaux
        input: { code_insee: "33063" }
    call: { method: GET, path: "/api/urba/georisques/risques/{code_insee}" }
    cost: { per: request }

  - name: urban_get_clay_exposure
    class: read
    description: >-
      Get the clay shrink-swell exposure at a point (Géorisques):
      {code_exposition, exposition}, from no exposure to strong. In a medium or
      strong zone, the sale of building land requires a soil study.
    input:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: *lon
        lat: *lat
    examples:
      - title: Clay exposure at a point in Bordeaux
        input: { lon: -0.5753, lat: 44.8417 }
    call:
      method: GET
      path: /api/urba/georisques/argiles
      query: { lon: lon, lat: lat }
    cost: { per: request }

  - name: urban_list_classified_facilities
    class: read
    description: >-
      List the classified facilities for environmental protection (ICPE,
      Géorisques) of a commune or of one establishment: {results, page,
      total_pages, data: [{raisonSociale, adresse1, codeInsee, commune,
      regime, statutSeveso, etatActivite, longitude, latitude, inspections,
      ...}]}, 20 per page. Use it to spot an industrial site on or near a
      property, or to check a company's environmental obligations. A SIRET or
      a commune code is required.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [siret] }
        - { required: [code_insee] }
      properties:
        siret: { type: string, pattern: "^[0-9]{14}$", description: "SIRET of the establishment, exact match." }
        code_insee: *code_insee
        page: { type: integer, minimum: 1, default: 1 }
    examples:
      - title: Classified facilities in Bordeaux
        input: { code_insee: "33063" }
    call:
      method: GET
      path: /api/urba/georisques/icpe
      query: { siret: siret, code_insee: code_insee, page: page }
    cost: { per: request }

  - name: urban_list_public_services
    class: read
    description: >-
      List public services from the official directory of the administration
      (Service-Public): town halls, prefectures, tax offices, departmental
      directorates, public bodies, with phone, email, website, address and
      named head of service. Returns {total, rendus, tronque, signaux: [{nom,
      type_service, siren, siret, code_commune, telephone, courriel,
      site_internet, adresse, affectation_personne, ...}]}. Use it to find the
      town hall for a pre-emption notice (DIA) or a planning certificate, or
      the land registration office. A SIREN or a commune code is required.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [siren] }
        - { required: [code_commune] }
      properties:
        siren: { type: string, pattern: "^[0-9]{9}$", description: "SIREN of the public body, such as a commune." }
        code_commune: *code_insee
        type_service: { type: string, pattern: "^[a-z0-9_]+$", description: "Directory service type, such as mairie, prefecture or dd_fip." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: Town hall of Bordeaux
        input: { code_commune: "33063", type_service: mairie }
    call:
      method: GET
      path: /api/urba/annuaire
      query: { siren: siren, code_commune: code_commune, type_service: type_service, limit: limit }
    cost: { per: request }

  # --- Law: consolidated codes and case law ---------------------------------
  - name: law_list_codes
    class: read
    description: >-
      List the consolidated French codes covered, with the short alias the
      law functions take: {codes: [{alias, legitext, libelle}]}, such as CC
      (Code civil), CGI (Code général des impôts), CU (Code de l'urbanisme),
      CCH (Code de la construction et de l'habitation).
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Codes covered
        input: {}
    call: { method: GET, path: /api/loi/codes }
    cost: { per: request }

  - name: law_get_article
    class: read
    description: >-
      Get one article of a consolidated French code in the version in force at
      a date (today by default): {id, titre_texte, num, etat, date_debut,
      date_fin, texte, nota, source_url}. Use it to quote the exact text that
      applied on a given day, such as the day a contract was signed. source_url points to
      that version on Légifrance.
    input:
      type: object
      additionalProperties: false
      required: [code, num]
      properties:
        code: &code { type: string, pattern: "^([A-Za-z]{2,6}|LEGITEXT[0-9]{12})$", description: "Short alias of the code (CC, CGI, CU, CCH...) or its LEGITEXT id." }
        num: &num { type: string, minLength: 1, maxLength: 30, description: "Article number as the code writes it: 757, 1128, L213-2, 790 G." }
        date: *date
    examples:
      - title: Code civil article 757, in force today
        input: { code: CC, num: "757" }
      - title: Code général des impôts article 790 G at a death in 2019
        input: { code: CGI, num: "790 G", date: "2019-06-15" }
    refusals:
      - { code: article_not_found, when: "the response carries error not_found",
          message: "No version of this article in force at this date in this code: check the code alias, the number as the code writes it, and the date." }
    expect:
      - { kind: non_empty, refusal: article_not_found, path: id }
    call:
      method: GET
      path: /api/loi/article
      query: { code: code, num: num, date: date }
    cost: { per: request }

  - name: law_search_articles
    class: read
    description: >-
      Full-text search in the articles of the consolidated French codes:
      {count, articles: [{id, num, etat, date_debut, date_fin, titre_texte,
      extrait, source_url}]}. The query takes web-search syntax: "quoted
      phrase", OR, -excluded. By default only the versions in force today are
      searched. Use it to find the article that governs a question when its
      number is unknown.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: &fts { type: string, minLength: 2, description: "Search words, web-search syntax: \"phrase\", OR, -word." }
        code: *code
        en_vigueur: { type: boolean, default: true, description: "false also searches past and future versions." }
        limit: &law_limit { type: integer, minimum: 1, maximum: 50, default: 20 }
    examples:
      - title: Reserved portion in the Code civil
        input: { query: "\"réserve héréditaire\"", code: CC, limit: 10 }
    call:
      method: GET
      path: /api/loi/search
      query: { query: query, code: code, en_vigueur: en_vigueur, limit: limit }
    cost: { per: request }

  - name: law_list_article_versions
    class: read
    description: >-
      List every version of one code article, oldest first: {count, versions:
      [{id, etat, date_debut, date_fin, apercu, source_url}]}. Use it to see
      when an article changed, before reading the version in force at a given
      date. Empty when the article is unknown.
    input:
      type: object
      additionalProperties: false
      required: [code, num]
      properties:
        code: *code
        num: *num
    examples:
      - title: History of Code civil article 757
        input: { code: CC, num: "757" }
    call:
      method: GET
      path: /api/loi/versions
      query: { code: code, num: num }
    cost: { per: request }

  - name: law_search_case_law
    class: read
    description: >-
      Search French and European case law, ranked by relevance weighted by the
      authority of the court: {count, decisions: [{id, fond, titre,
      juridiction, numero, date_dec, solution, formation, ecli, autorite,
      extrait}]}. fond picks one collection: cass (Cour de cassation,
      published), inca (Cour de cassation, unpublished), capp (courts of
      appeal), jade (administrative courts), constit (Conseil
      constitutionnel), cnil, cedh (European Court of Human Rights), cjue
      (Court of Justice of the EU), jade_live (recent administrative
      decisions), judilibre (recent judicial decisions). Use it to find the
      case law on a question of succession, property or contract law.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: *fts
        fond: { type: string, enum: [cass, inca, capp, jade, constit, cnil, cedh, cjue, jade_live, judilibre] }
        juridiction: { type: string, minLength: 2, description: "Court name contains this text, such as cassation or appel de Paris." }
        date_min: *date
        date_max: *date
        limit: *law_limit
        expand: { type: boolean, default: false, description: "Widen the query with synonyms from the legal thesaurus." }
    examples:
      - title: Cour de cassation on gifts to report to an estate
        input: { query: "rapport succession donation", fond: cass, limit: 10 }
      - title: Recent appeal decisions on hidden defects in a house sale
        input: { query: "\"vice caché\" vente maison", fond: capp, date_min: "2022-01-01" }
    call:
      method: GET
      path: /api/juris/search
      query: { query: query, fond: fond, juridiction: juridiction, date_min: date_min,
               date_max: date_max, limit: limit, expand: expand }
    cost: { per: request }

  - name: law_get_decision
    class: read
    description: >-
      Get the full text of one court decision by its id, as case-law search
      returns it: {id, fond, titre, juridiction, numero, date_dec, solution,
      formation, ecli, texte, texte_chars, source_url}. The text is cut at
      max_chars (tronque true); source_url leads to the whole decision.
    input:
      type: object
      additionalProperties: false
      required: [decision_id]
      properties:
        decision_id: { type: string, pattern: "^[A-Za-z0-9_.:-]+$", not: { enum: [".", ".."] }, description: "Decision id, such as JURITEXT000036635309 or 001-230875." }
        max_chars: { type: integer, minimum: 0, default: 30000, description: "Cut the text at this length; 0 returns it whole." }
    examples:
      - title: Cass. 1re civ., 24 January 2018, 17-13.017
        input: { decision_id: JURITEXT000036635309 }
    refusals:
      - { code: decision_not_found, when: "the response carries error not_found",
          message: "No decision with this id: take the id from a case-law search result." }
    expect:
      - { kind: non_empty, refusal: decision_not_found, path: fond }
    call:
      method: GET
      path: "/api/juris/decision/{decision_id}"
      query: { max_chars: max_chars }
    cost: { per: request }

  # --- Tax doctrine: BOFiP-Impôts -------------------------------------------
  - name: tax_search_bofip
    class: read
    description: >-
      Search the French tax administration's official doctrine (BOFiP-Impôts,
      DGFiP), commentaries in force only: {total_count, publications:
      [{identifiant_juridique, titre, serie, type, debut_de_validite,
      permalien, extrait}], source}. A commentary matches when it holds every
      word of query: 2 to 5 French keywords (droits de mutation, plus-values,
      IFI, pacte Dutreil, TVA immobilière); no result means fewer or other
      words. extrait is 400 characters around the first word found;
      total_count counts every match, beyond limit. Use it to find how the
      administration reads a tax rule, then read the commentary by its
      identifiant_juridique. Doctrine is the administration's reading of the
      law, not the law itself.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 3, maxLength: 120, description: "2 to 5 French keywords, all required: donation usufruit parts sociales." }
        limit: { type: integer, minimum: 1, maximum: 20, default: 6 }
    examples:
      - title: Doctrine on gifts of usufruct
        input: { query: donation usufruit, limit: 5 }
      - title: Doctrine on the Dutreil pact
        input: { query: pacte Dutreil transmission }
    call:
      method: GET
      path: /api/doctrine/bofip
      query: { query: query, limit: limit }
    cost: { per: request }

  - name: tax_get_bofip_document
    class: read
    description: >-
      Read one BOFiP-Impôts commentary or news item in force by its reference
      (identifiant_juridique of a search result): {identifiant_juridique,
      titre, serie, type, debut_de_validite, permalien, contenu,
      contenu_chars, tronque, source}. The text is cut at max_chars (tronque
      true, contenu_chars gives its whole length); permalien is the official
      page on bofip.impots.gouv.fr. The version suffix of a permalink
      (-20240319) is accepted and dropped.
    input:
      type: object
      additionalProperties: false
      required: [identifiant]
      properties:
        identifiant: { type: string, pattern: "^(BOI|ACTU)-[A-Z0-9-]+$", description: "BOFiP reference: BOI-ENR-DMTG-20-30-20-20, or ACTU-... for a news item." }
        max_chars: { type: integer, minimum: 0, default: 12000, description: "Cut the text at this length; 0 returns it whole." }
    examples:
      - title: Allowances on gifts (BOI-ENR-DMTG-20-30-20-20)
        input: { identifiant: BOI-ENR-DMTG-20-30-20-20, max_chars: 20000 }
    refusals:
      - { code: bofip_document_not_found, when: "the response is null",
          message: "No BOFiP publication in force with this reference: take it from a doctrine search result." }
    expect:
      - { kind: non_empty, refusal: bofip_document_not_found, path: identifiant_juridique }
    call:
      method: GET
      path: "/api/doctrine/bofip/{identifiant}"
      query: { max_chars: max_chars }
    cost: { per: request }

  # --- Compliance: asset freezes ---------------------------------------------
  - name: compliance_screen_asset_freeze
    class: read
    description: >-
      Screen a name against the French national register of asset freezes
      (DG Trésor): persons, entities and ships under a freeze in force in
      France (UN, EU and national measures). Use it to screen a client, a
      supplier or a contract party. An entry matches when its name or an alias holds
      every word of nom, accents, case and punctuation ignored. prenom only
      orders the matches, never drops one: each carries sur, nom_et_prenom
      (one of its first names contains prenom) or nom_seul. Returns
      {publication, inscrits, total, nom_et_prenom, nom_seul, correspondances:
      [{sur, nature, nom, prenoms, naissance, fondement}], source}; limit
      bounds the list, never the counts: total above the list length means
      more matches to read. A match on a common name is not a confirmed
      freeze: compare first names and date of birth. The name travels in the
      request body and FOD does not keep it.
    input:
      type: object
      additionalProperties: false
      required: [nom]
      properties:
        nom: { type: string, minLength: 2, maxLength: 120, description: "Surname, or name of the legal person: Martin, SCI Les Hortillons." }
        prenom: { type: string, minLength: 2, maxLength: 120, description: "First name: puts the entries that carry it first, drops none." }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10, description: "Most matches listed; the counts stay whole." }
    examples:
      - title: A natural person, surname and first name
        input: { nom: Martin, prenom: Jean }
      - title: A company party to a sale
        input: { nom: SCI Les Hortillons, limit: 20 }
    refusals:
      - { code: register_inconclusive, when: 503,
          message: "The asset-freeze register cannot be relied on right now (not loaded, truncated or out of date). This is not an absence of match: do not conclude that the name is not listed; retry later." }
      - { code: name_without_letters, when: 400,
          message: "The name holds no letter or digit: give a surname or the name of a legal person." }
    call:
      method: POST
      path: /api/vigilance/gels-avoirs/controle
      body: { nom: nom, prenom: prenom, limit: limit }
    cost: { per: request }
