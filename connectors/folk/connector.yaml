# yaml-language-server: $schema=../connector.schema.json
# folk API v1 (https://developer.folk.app/api-reference, OpenAPI "2025-06-09" at developer.folk.app/schemas, read on
# 2026-10-22). The values come from the Python client, oto.tools.folk, which this description follows: one request per
# method to api.folk.app/v1, the API key as a bearer token (Authorization: Bearer <key>), JSON bodies. The function
# names, the argument names and the keys sent to folk are the client's; the client is not changed
# (tests/test_folk_description.py reads it to keep both equal).
#
# Read and act. Reads stay on the read side. Every call that creates or changes something is served on the act side
# (class write). Ask for a confirmation (class sensitive): every delete and removal (a person, a company, a deal, a
# note, an interaction, a task, a reminder, a group member, a webhook), every batch call (up to 100 records written at
# once; a batch update replaces groups, and a person or company taken out of a group loses that group's custom field
# values), changing a custom field (removeOptions empties the option on every record that holds it), and creating or
# changing a webhook (folk then posts the workspace's events to an address of the caller's).
#
# Pagination. The client walks every page itself (cursor pagination, 100 per page: limit 100 on every list but the
# two interaction lists, which take no limit). folk gives the next page as a full address, data.pagination.nextLink,
# whose cursor parameter is the cursor of the next request: a full address that the format cannot follow
# (no pagination is declared, as for klaviyo). Each list function reads ONE page, the client's request for it (limit
# 100 as a constant), and takes cursor, an argument the client does not have: the agent passes the cursor parameter
# of nextLink. Absent nextLink means the last page.
#
# Filters. list_people, list_companies and list_deals take, as named arguments, the fields the client filters with a
# bare value: text fields as filter[<field>][like] (contains), groups and companies as filter[<field>][in][id] (the
# record belongs to that group or company). The client's other forms ({operator: value}, a list of ids) and the task
# filters (a dict whose keys name the field and the operator) are left to the client.
#
# Folk's forms. Five methods take the bare id of a person or company (entity_id) and send it as the object
# entity: {id}; create_deal takes people_ids and company_ids and sends people: [{id}] and companies: [{id}]. Their
# functions take folk's form itself (entity, people, companies), the same request: a named gap with the client,
# kept by the test. create_person's company_name, company_id and group_ids, wrapped by the client into companies and
# groups, are left out: the function takes companies and groups in folk's form, which the client passes as is.
#
# Values the client sets and folk requires, here required in the input (the host sends only what the call gives):
# visibility of create_note and create_reminder (the client sends public), dateTime of create_interaction and
# completedAt of mark_task_done (the client sends now), object_type of the deal functions (the client sends deals)
# and entity_type of get_group_custom_fields (the client sends person). content of create_interaction is required,
# as folk's OpenAPI says, where the client makes it optional. The client drops an empty string or an empty list it is
# given (last name, emails, a task's description…): the schema refuses them (minLength, minItems).
#
# Query booleans: onlyAssignedToMe of list_tasks is written true or false, by the host as by the client.
#
# Rate: folk counts per user, every key of that user included: 20 requests per 2 seconds (burst) and 600 per minute
# (default), fixed windows (developer.folk.app/api-reference/rate-limits, read on 2026-10-22). 20 per 2 s implies the
# 600 per minute, hence the declared rate; the client spaces its requests by 125 ms (8 per second), under it.
#
# Errors: folk documents a 401 as "the API key is invalid or not provided"; the host always provides it, so a 401
# says the key was refused: it marks the account credential_rejected. A 403 is a right the key lacks, a 402 only
# answers credit-consuming operations (enrichments, not described). A 429 is refused before it runs and is always
# safe to retry (folk's words); a 5xx is not retryable: a write may have gone through.
#
# Not described here, left to the hand-written client:
# - person_body, company_body, deal_body: local, they build a record and send nothing;
# - the arguments: entity_id of list_notes and list_reminders (folk ignores that filter, the client filters after
#   reading every page), max_items of the two interaction lists (the client stops walking pages), filters and
#   combinator of list_tasks, company_name, company_id and group_ids of create_person, and the filters of the other
#   lists other than a bare value on a text field, groups or companies.
# The batch calls send no Idempotency-Key (the client mints one per call, so that its own 429 retry replays): the
# host never replays a request by itself.
#
# Answers are folk's, whole ({data: …}); the client returns data, and filters fields by a local policy
# (FieldFilter "folk", ~/.otomata/config.yaml), which the description does not apply. The signing secret of a new
# webhook is taken out of the answer (data.signingSecret): it never reaches the agent.
connector:
  name: folk
  label: folk
  namespace: folk
  version: 1.0.0
  api_version: v1 (OpenAPI 2025-06-09)
  base_url: https://api.folk.app/v1
  auth: { kind: bearer, token: api_key }
  credential:
    - { name: api_key, label: API key, secret: true }
  # Each workspace brings its own key: people, companies and deals are the workspace's behind the key.
  modes: [byo_user, byo_org]
  # The client waits 60 s for an answer (10 s to connect).
  timeout_s: 60
  rate_limit: { requests: 20, seconds: 2 }
  probe: { function: get_current_user }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "folk rejected the request as malformed: check the arguments." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "folk refused the API key: invalid or revoked." }
    - { status: 403, code: forbidden, retryable: false,
        message: "folk refused this call for this key: the user behind the key lacks the right." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in folk: wrong id, or not in this workspace." }
    - { status: 422, code: invalid_data, retryable: false,
        message: "folk could not validate the request: details.issues names each field and the rule it breaks." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "folk rate limit reached (20 requests per 2 seconds, 600 per minute, per user): wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: false,
        message: "folk failed. A read can be retried; a write may have been applied: read it back before writing again." }

functions:
  # --- Users -------------------------------------------------------------------

  - name: get_current_user
    class: read
    description: >-
      Get the workspace user behind the API key: id, full name, email.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Who the key belongs to, input: {} }
    call: { method: GET, path: /users/me }
    cost: &request { per: request }

  - name: get_user
    class: read
    description: >-
      Get one workspace user by id (usr_…): full name, email. The id me gives
      the user behind the API key.
    input:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: &user_id { type: string, minLength: 1, description: "User id (usr_…)." }
    examples:
      - { title: One user, input: { user_id: usr_00000000-0000-4000-8000-000000000001 } }
      - { title: The key's own user, input: { user_id: me } }
    call: { method: GET, path: "/users/{user_id}" }
    cost: *request

  - name: list_users
    class: read
    description: >-
      List one page of the workspace users (up to 100): id, full name, email.
      When more remain, the answer gives data.pagination.nextLink: pass the
      cursor parameter of that link as cursor for the next page.
    input:
      type: object
      additionalProperties: false
      properties:
        cursor: &cursor
          type: string
          minLength: 1
          description: "Cursor of the next page: the cursor parameter of data.pagination.nextLink in the previous answer, URL-decoded (%3D is =). Absent: the first page."
    examples:
      - { title: The first page of users, input: {} }
      - { title: The next page, input: { cursor: eyJvZmZzZXQiOjEwMH0= } }
    call: { method: GET, path: /users, query: { cursor: cursor }, constants: { query: { limit: 100 } } }
    cost: *request

  # --- Groups ------------------------------------------------------------------

  - name: list_groups
    class: read
    description: >-
      List one page of the workspace groups (up to 100): id, name. A group
      holds people, companies and its own object types (deals). When more
      remain, pass the cursor parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        cursor: *cursor
    examples:
      - { title: The groups of the workspace, input: {} }
    call: { method: GET, path: /groups, query: { cursor: cursor }, constants: { query: { limit: 100 } } }
    cost: *request

  - name: create_group
    class: write
    description: >-
      Create a group in the workspace. A public group is open to every
      workspace member; a private one to its members only.
    input:
      type: object
      additionalProperties: false
      required: [name, visibility]
      properties:
        name: &group_name { type: string, minLength: 1, maxLength: 255 }
        visibility: &visibility { type: string, enum: [public, private] }
    examples:
      - { title: A private group for a pipeline, input: { name: Partners 2027, visibility: private } }
    call: { method: POST, path: /groups, body: { name: name, visibility: visibility } }
    cost: *request

  - name: update_group
    class: write
    description: >-
      Rename a group or change its visibility (public: every workspace member;
      private: its members only).
    input:
      type: object
      additionalProperties: false
      required: [group_id]
      properties:
        group_id: &group_id { type: string, minLength: 1, description: "Group id (grp_…)." }
        name: *group_name
        visibility: *visibility
    examples:
      - { title: Rename a group, input: { group_id: grp_00000000-0000-4000-8000-000000000001, name: Partners 2028 } }
    call: { method: PATCH, path: "/groups/{group_id}", body: { name: name, visibility: visibility } }
    cost: *request

  - name: list_group_members
    class: read
    description: >-
      List one page of the members of a group (up to 100), with their role
      (admin, contributor, reader). Every workspace member is a member of a
      public group. When more remain, pass the cursor parameter of
      data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      required: [group_id]
      properties:
        group_id: *group_id
        cursor: *cursor
    examples:
      - { title: Who can see a group, input: { group_id: grp_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/groups/{group_id}/members", query: { cursor: cursor }, constants: { query: { limit: 100 } } }
    cost: *request

  - name: add_group_member
    class: write
    description: >-
      Give a workspace user access to a group, with a role: admin, contributor
      or reader.
    input:
      type: object
      additionalProperties: false
      required: [group_id, user_id, role]
      properties:
        group_id: *group_id
        user_id: *user_id
        role: &role { type: string, enum: [admin, contributor, reader] }
    examples:
      - title: A reader on a group
        input: { group_id: grp_00000000-0000-4000-8000-000000000001, user_id: usr_00000000-0000-4000-8000-000000000001, role: reader }
    call: { method: POST, path: "/groups/{group_id}/members", body: { id: user_id, role: role } }
    cost: *request

  - name: update_group_member
    class: write
    description: Change the role of a group member (admin, contributor, reader).
    input:
      type: object
      additionalProperties: false
      required: [group_id, user_id, role]
      properties:
        group_id: *group_id
        user_id: *user_id
        role: *role
    examples:
      - title: Make a member a contributor
        input: { group_id: grp_00000000-0000-4000-8000-000000000001, user_id: usr_00000000-0000-4000-8000-000000000001, role: contributor }
    call: { method: PATCH, path: "/groups/{group_id}/members/{user_id}", body: { role: role } }
    cost: *request

  - name: remove_group_member
    class: sensitive
    description: Remove a user from a group; they no longer see it.
    input:
      type: object
      additionalProperties: false
      required: [group_id, user_id]
      properties:
        group_id: *group_id
        user_id: *user_id
    examples:
      - { title: Remove a member, input: { group_id: grp_00000000-0000-4000-8000-000000000001, user_id: usr_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Remove user {user_id} from folk group {group_id}."
    call: { method: DELETE, path: "/groups/{group_id}/members/{user_id}" }
    cost: *request

  # --- Custom fields of a group ---------------------------------------------------

  - name: get_group_custom_fields
    class: read
    description: >-
      List one page of the custom fields a group defines for an entity type
      (up to 100): name, type, options. entity_type is person, company, or the
      name of an object type of the group (deals). When more remain, pass the
      cursor parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      required: [group_id, entity_type]
      properties:
        group_id: *group_id
        entity_type: &entity_type { type: string, minLength: 1, description: "person, company, or an object type of the group (deals)." }
        cursor: *cursor
    examples:
      - { title: The people fields of a group, input: { group_id: grp_00000000-0000-4000-8000-000000000001, entity_type: person } }
    call:
      method: GET
      path: "/groups/{group_id}/custom-fields/{entity_type}"
      query: { cursor: cursor }
      constants: { query: { limit: 100 } }
    cost: *request

  - name: get_group_custom_field
    class: read
    description: >-
      Get one custom field of a group by its name (as shown in folk), with its
      type and options.
    input:
      type: object
      additionalProperties: false
      required: [group_id, entity_type, custom_field_name]
      properties:
        group_id: *group_id
        entity_type: *entity_type
        custom_field_name: &custom_field_name { type: string, minLength: 1, maxLength: 500, description: "Field name, as shown in folk." }
    examples:
      - { title: One field, input: { group_id: grp_00000000-0000-4000-8000-000000000001, entity_type: person, custom_field_name: Deal Status } }
    call: { method: GET, path: "/groups/{group_id}/custom-fields/{entity_type}/{custom_field_name}" }
    cost: *request

  - name: create_group_custom_field
    class: write
    description: >-
      Create a custom field in a group for an entity type. type: textField,
      dateField, userField, contactField (people or companies), objectField
      (person or company only: creates an object type), singleSelect and
      multipleSelect (with options), numericField (with config). An object
      type cannot have contactField or objectField fields.
    input:
      type: object
      additionalProperties: false
      required: [group_id, entity_type, type, name]
      properties:
        group_id: *group_id
        entity_type: *entity_type
        type: { type: string, enum: [textField, dateField, userField, contactField, objectField, singleSelect, multipleSelect, numericField] }
        name: { type: string, minLength: 1, maxLength: 500 }
        options:
          type: array
          maxItems: 1000
          description: "Options of a singleSelect or multipleSelect field."
          items: &option
            type: object
            additionalProperties: false
            required: [label, color]
            properties:
              label: { type: string, minLength: 1, maxLength: 100 }
              color: &color { type: string, enum: ["#5738ff", "#20cea9", "#f54e50", "#f2b934", "#879aab", "#de4a96", "#4a90e2", "#f5a623"] }
        config: &numeric_config
          type: object
          additionalProperties: false
          required: [format]
          description: "Format of a numericField: none, default, number, percent, or currency with its ISO code."
          properties:
            format: { type: string, enum: [none, default, number, percent, currency] }
            decimals: { type: integer, minimum: 0, maximum: 5 }
            currency: { type: string, minLength: 3, maxLength: 3 }
    examples:
      - title: A status field with two options
        input:
          group_id: grp_00000000-0000-4000-8000-000000000001
          entity_type: person
          type: singleSelect
          name: Stage
          options: [{ label: Lead, color: "#5738ff" }, { label: Customer, color: "#20cea9" }]
      - title: An amount in euros
        input: { group_id: grp_00000000-0000-4000-8000-000000000001, entity_type: deals, type: numericField, name: Amount, config: { format: currency, currency: EUR, decimals: 0 } }
    call:
      method: POST
      path: "/groups/{group_id}/custom-fields/{entity_type}"
      body: { type: type, name: name, options: options, config: config }
    cost: *request

  - name: update_group_custom_field
    class: sensitive
    description: >-
      Change a custom field of a group: rename it, change a numeric format, add,
      change or remove select options. Removing an option empties it on every
      record that holds it.
    input:
      type: object
      additionalProperties: false
      required: [group_id, entity_type, custom_field_name]
      properties:
        group_id: *group_id
        entity_type: *entity_type
        custom_field_name: *custom_field_name
        name: { type: string, minLength: 1, maxLength: 500, description: "New name." }
        config: *numeric_config
        add_options: { type: array, maxItems: 100, items: *option }
        remove_options: { type: array, maxItems: 100, items: { type: string, minLength: 1, description: "Option id." } }
        update_options:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string, minLength: 1, description: "Option id." }
              label: { type: string, minLength: 1, maxLength: 100 }
              color: *color
    examples:
      - title: Rename a field
        input: { group_id: grp_00000000-0000-4000-8000-000000000001, entity_type: person, custom_field_name: Stage, name: Pipeline stage }
      - title: Add an option
        input: { group_id: grp_00000000-0000-4000-8000-000000000001, entity_type: person, custom_field_name: Stage, add_options: [{ label: Lost, color: "#f54e50" }] }
    confirm:
      summary: "Change custom field {custom_field_name} of folk group {group_id} ({entity_type}); a removed option is emptied on every record."
    call:
      method: PATCH
      path: "/groups/{group_id}/custom-fields/{entity_type}/{custom_field_name}"
      body: { name: name, config: config, addOptions: add_options, removeOptions: remove_options, updateOptions: update_options }
    cost: *request

  # --- People -------------------------------------------------------------------

  - name: list_people
    class: read
    description: >-
      List one page of the people of the workspace (up to 100), filtered by the
      fields given: a text field matches when it contains the value (full_name,
      first_name, last_name, job_title, description, emails, phones, addresses,
      urls), groups and companies when the person belongs to that group or
      company (its id). Filters combine with AND. When more remain, pass the
      cursor parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        full_name: &filter_personal { type: string, minLength: 1, personal: true, description: "Contains this text." }
        first_name: *filter_personal
        last_name: *filter_personal
        job_title: &filter_text { type: string, minLength: 1, description: "Contains this text." }
        description: *filter_text
        emails: *filter_personal
        phones: *filter_personal
        addresses: *filter_personal
        urls: *filter_personal
        groups: &filter_group { type: string, minLength: 1, description: "Group id (grp_…): members of this group." }
        companies: &filter_company { type: string, minLength: 1, description: "Company id (com_…): linked to this company." }
        cursor: *cursor
    examples:
      - { title: People of one group, input: { groups: grp_00000000-0000-4000-8000-000000000001 } }
      - { title: People by email domain, input: { emails: "@example.test" } }
      - { title: The next page, input: { groups: grp_00000000-0000-4000-8000-000000000001, cursor: eyJvZmZzZXQiOjEwMH0= } }
    call:
      method: GET
      path: /people
      query:
        "filter[fullName][like]": full_name
        "filter[firstName][like]": first_name
        "filter[lastName][like]": last_name
        "filter[jobTitle][like]": job_title
        "filter[description][like]": description
        "filter[emails][like]": emails
        "filter[phones][like]": phones
        "filter[addresses][like]": addresses
        "filter[urls][like]": urls
        "filter[groups][in][id]": groups
        "filter[companies][in][id]": companies
        cursor: cursor
      constants: { query: { limit: 100 } }
    cost: *request

  - name: get_person
    class: read
    description: >-
      Get one person by id (per_…): names, job title, emails, phones,
      addresses, urls, birthday, companies, groups, and the custom field values
      of each group (customFieldValues, by group id then field name).
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: &person_id { type: string, minLength: 1, description: "Person id (per_…)." }
    examples:
      - { title: One person, input: { person_id: per_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/people/{person_id}" }
    cost: *request

  - name: create_person
    class: write
    description: >-
      Create a person. groups puts them in groups ([{id}]); companies links
      companies, an existing one by id or one created by name ([{id}] or
      [{name}]); custom_field_values sets the custom fields of a group the person
      is in ({groupId: {fieldName: value}}). folk merges a detected duplicate in
      the background.
    input:
      type: object
      additionalProperties: false
      required: [first_name]
      properties:
        first_name: &first_name { type: string, maxLength: 500, personal: true }
        last_name: &last_name { type: string, minLength: 1, maxLength: 500, personal: true }
        emails: &emails { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 254 }, personal: true }
        phones: &phones { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 30 }, personal: true }
        job_title: &job_title { type: string, minLength: 1, maxLength: 500 }
        urls: &urls { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 2048 }, personal: true }
        description: &description { type: string, minLength: 1, maxLength: 5000 }
        full_name: &full_name { type: string, maxLength: 1000, personal: true }
        birthday: &birthday { type: [string, "null"], pattern: "^(\\d{4}-\\d{2}-\\d{2})?$", personal: true, description: "YYYY-MM-DD; empty or null clears it." }
        gender: &gender { type: [string, "null"], enum: [Male, Female, Unknown, Other, null], personal: true }
        groups: &groups
          type: array
          maxItems: 100
          description: "Groups of the record, [{id}]."
          items: &id_object
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string, minLength: 1 }
        companies: &person_companies
          type: array
          maxItems: 20
          description: "Companies, [{id}] for an existing one or [{name}] to create it."
          items:
            oneOf:
              - *id_object
              - type: object
                additionalProperties: false
                required: [name]
                properties:
                  name: { type: string, minLength: 1, maxLength: 1000 }
        addresses: &addresses { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 500 }, personal: true }
        custom_field_values: &custom_field_values
          type: object
          personal: true
          description: "Custom field values by group id, then field name: {grp_…: {Stage: Lead}}. Only for a group the record is in."
    examples:
      - title: A person with an email, in a group
        input:
          first_name: Marie
          last_name: Martin
          emails: [marie@example.test]
          job_title: Head of Sales
          groups: [{ id: grp_00000000-0000-4000-8000-000000000001 }]
          companies: [{ name: Example Corp }]
    call:
      method: POST
      path: /people
      body:
        firstName: first_name
        lastName: last_name
        emails: emails
        phones: phones
        jobTitle: job_title
        urls: urls
        description: description
        fullName: full_name
        birthday: birthday
        gender: gender
        groups: groups
        companies: companies
        addresses: addresses
        customFieldValues: custom_field_values
    cost: *request

  - name: update_person
    class: write
    description: >-
      Change a person: only the fields given change. A list given REPLACES the
      current one (emails, phones, companies, groups…): read the person first
      to keep what stays. Leaving a group out takes the person out of it, with
      that group's custom field values. custom_field_values changes the fields
      named, by group id then field name.
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: *person_id
        first_name: { type: string, maxLength: 500, personal: true }
        last_name: { type: string, maxLength: 500, personal: true }
        full_name: *full_name
        description: { type: string, maxLength: 5000 }
        birthday: *birthday
        gender: *gender
        job_title: { type: string, maxLength: 500 }
        groups: *groups
        companies: *person_companies
        addresses: *addresses
        emails: &emails_replace { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 254 }, personal: true }
        phones: &phones_replace { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 30 }, personal: true }
        urls: &urls_replace { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 2048 }, personal: true }
        custom_field_values: *custom_field_values
    examples:
      - title: A new job title
        input: { person_id: per_00000000-0000-4000-8000-000000000001, job_title: VP Sales }
      - title: A custom field of a group
        input: { person_id: per_00000000-0000-4000-8000-000000000001, custom_field_values: { grp_00000000-0000-4000-8000-000000000001: { Stage: Customer } } }
    call:
      method: PATCH
      path: "/people/{person_id}"
      body: &person_fields
        firstName: first_name
        lastName: last_name
        fullName: full_name
        description: description
        birthday: birthday
        gender: gender
        jobTitle: job_title
        groups: groups
        companies: companies
        addresses: addresses
        emails: emails
        phones: phones
        urls: urls
        customFieldValues: custom_field_values
    cost: *request

  - name: delete_person
    class: sensitive
    description: Delete a person from the workspace, with their notes and field values.
    input:
      type: object
      additionalProperties: false
      required: [person_id]
      properties:
        person_id: *person_id
    examples:
      - { title: Delete a person, input: { person_id: per_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk person {person_id}."
    call: { method: DELETE, path: "/people/{person_id}" }
    cost: *request

  # --- Companies --------------------------------------------------------------------

  - name: list_companies
    class: read
    description: >-
      List one page of the companies of the workspace (up to 100), filtered by
      the fields given: a text field matches when it contains the value (name,
      description, emails, phones, addresses, urls, industry, employee_range),
      groups when the company belongs to that group (its id). Filters combine
      with AND. When more remain, pass the cursor parameter of
      data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        name: *filter_text
        description: *filter_text
        emails: *filter_personal
        phones: *filter_personal
        addresses: *filter_text
        urls: *filter_text
        industry: *filter_text
        employee_range: *filter_text
        groups: *filter_group
        cursor: *cursor
    examples:
      - { title: Companies by name, input: { name: Example } }
      - { title: Companies of one group, input: { groups: grp_00000000-0000-4000-8000-000000000001 } }
    call:
      method: GET
      path: /companies
      query:
        "filter[name][like]": name
        "filter[description][like]": description
        "filter[emails][like]": emails
        "filter[phones][like]": phones
        "filter[addresses][like]": addresses
        "filter[urls][like]": urls
        "filter[industry][like]": industry
        "filter[employeeRange][like]": employee_range
        "filter[groups][in][id]": groups
        cursor: cursor
      constants: { query: { limit: 100 } }
    cost: *request

  - name: get_company
    class: read
    description: >-
      Get one company by id (com_…): name, description, industry, funding,
      foundation year, employee range, emails, phones, addresses, urls, groups,
      and the custom field values of each group.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: &company_id { type: string, minLength: 1, description: "Company id (com_…)." }
    examples:
      - { title: One company, input: { company_id: com_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/companies/{company_id}" }
    cost: *request

  - name: create_company
    class: write
    description: >-
      Create a company. A company named exactly like an existing one (same
      case) UPDATES that company instead. groups puts it in groups ([{id}]);
      custom_field_values sets the custom fields of a group it is in.
    input:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 1000 }
        emails: *emails
        industry: { type: string, minLength: 1, maxLength: 1000 }
        description: { type: string, maxLength: 5000 }
        funding_raised: &funding { anyOf: [{ type: number }, { type: string, minLength: 1, maxLength: 20 }, { type: "null" }] }
        last_funding_date: &funding_date { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        foundation_year: &foundation_year { anyOf: [{ type: string, pattern: "^\\d{4}$" }, { type: number, minimum: 1000, maximum: 2100 }, { type: "null" }] }
        employee_range: &employee_range { type: [string, "null"], enum: ["1-10", "11-50", "51-200", "201-500", "501-1000", "1001-5000", "5001-10000", "10000+", null] }
        groups: *groups
        addresses: *addresses
        phones: *phones_replace
        urls: *urls_replace
        custom_field_values: *custom_field_values
    examples:
      - title: A company in a group
        input: { name: Example Corp, industry: Software, employee_range: "11-50", groups: [{ id: grp_00000000-0000-4000-8000-000000000001 }] }
    call:
      method: POST
      path: /companies
      body:
        name: name
        emails: emails
        industry: industry
        description: description
        fundingRaised: funding_raised
        lastFundingDate: last_funding_date
        foundationYear: foundation_year
        employeeRange: employee_range
        groups: groups
        addresses: addresses
        phones: phones
        urls: urls
        customFieldValues: custom_field_values
    cost: *request

  - name: update_company
    class: write
    description: >-
      Change a company: only the fields given change. A list given REPLACES the
      current one (emails, phones, urls, addresses, groups): read the company
      first to keep what stays. Leaving a group out takes the company out of
      it, with that group's custom field values.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
        name: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 5000 }
        funding_raised: *funding
        last_funding_date: *funding_date
        industry: { type: [string, "null"], maxLength: 1000 }
        foundation_year: *foundation_year
        employee_range: *employee_range
        groups: *groups
        addresses: *addresses
        emails: *emails_replace
        phones: *phones_replace
        urls: *urls_replace
        custom_field_values: *custom_field_values
    examples:
      - { title: A new employee range, input: { company_id: com_00000000-0000-4000-8000-000000000001, employee_range: "51-200" } }
    call:
      method: PATCH
      path: "/companies/{company_id}"
      body: &company_fields
        name: name
        description: description
        fundingRaised: funding_raised
        lastFundingDate: last_funding_date
        industry: industry
        foundationYear: foundation_year
        employeeRange: employee_range
        groups: groups
        addresses: addresses
        emails: emails
        phones: phones
        urls: urls
        customFieldValues: custom_field_values
    cost: *request

  - name: delete_company
    class: sensitive
    description: Delete a company from the workspace.
    input:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: *company_id
    examples:
      - { title: Delete a company, input: { company_id: com_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk company {company_id}."
    call: { method: DELETE, path: "/companies/{company_id}" }
    cost: *request

  # --- Deals (objects of a group) ---------------------------------------------------------

  - name: list_deals
    class: read
    description: >-
      List one page of the objects of one type in a group (up to 100): deals,
      or any object type of the group. name matches when it contains the value;
      companies when the object is linked to that company (its id). When more
      remain, pass the cursor parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type]
      properties:
        group_id: *group_id
        object_type: &object_type { type: string, minLength: 1, description: "Object type of the group, as folk names it (deals for a deal pipeline)." }
        name: *filter_text
        companies: *filter_company
        cursor: *cursor
    examples:
      - { title: The deals of a group, input: { group_id: grp_00000000-0000-4000-8000-000000000001, object_type: deals } }
    call:
      method: GET
      path: "/groups/{group_id}/{object_type}"
      query:
        "filter[name][like]": name
        "filter[companies][in][id]": companies
        cursor: cursor
      constants: { query: { limit: 100 } }
    cost: *request

  - name: get_deal
    class: read
    description: >-
      Get one object of a group (a deal) by id (obj_…): name, linked people and
      companies, custom field values (status, amount…).
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type, deal_id]
      properties:
        group_id: *group_id
        object_type: *object_type
        deal_id: &deal_id { type: string, minLength: 1, description: "Object id (obj_…)." }
    examples:
      - { title: One deal, input: { group_id: grp_00000000-0000-4000-8000-000000000001, object_type: deals, deal_id: obj_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/groups/{group_id}/{object_type}/{deal_id}" }
    cost: *request

  - name: create_deal
    class: write
    description: >-
      Create an object of a group (a deal), linked to people and companies
      ([{id}], 20 each at most), with custom field values by field name
      ({Status: Qualified, Amount: 12000}).
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type, name]
      properties:
        group_id: *group_id
        object_type: *object_type
        name: { type: string, maxLength: 1000 }
        people: &linked { type: array, minItems: 1, maxItems: 20, items: *id_object }
        companies: *linked
        custom_fields: { type: object, minProperties: 1, description: "Custom field values by field name: {Status: Qualified}." }
    examples:
      - title: A deal with its company
        input:
          group_id: grp_00000000-0000-4000-8000-000000000001
          object_type: deals
          name: Example Corp renewal
          companies: [{ id: com_00000000-0000-4000-8000-000000000001 }]
          custom_fields: { Status: Qualified }
    call:
      method: POST
      path: "/groups/{group_id}/{object_type}"
      body: { name: name, people: people, companies: companies, customFieldValues: custom_fields }
    cost: *request

  - name: update_deal
    class: write
    description: >-
      Change an object of a group (a deal): only the fields given change.
      people and companies REPLACE the current links; custom_field_values changes
      the fields named.
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type, deal_id]
      properties:
        group_id: *group_id
        object_type: *object_type
        deal_id: *deal_id
        name: { type: string, maxLength: 1000 }
        people: &links { type: array, maxItems: 20, items: *id_object }
        companies: *links
        custom_field_values: { type: object, description: "Custom field values by field name: {Status: Won}." }
    examples:
      - { title: Move a deal to won, input: { group_id: grp_00000000-0000-4000-8000-000000000001, object_type: deals, deal_id: obj_00000000-0000-4000-8000-000000000001, custom_field_values: { Status: Won } } }
    call:
      method: PATCH
      path: "/groups/{group_id}/{object_type}/{deal_id}"
      body: &deal_fields { name: name, people: people, companies: companies, customFieldValues: custom_field_values }
    cost: *request

  - name: delete_deal
    class: sensitive
    description: Delete an object of a group (a deal).
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type, deal_id]
      properties:
        group_id: *group_id
        object_type: *object_type
        deal_id: *deal_id
    examples:
      - { title: Delete a deal, input: { group_id: grp_00000000-0000-4000-8000-000000000001, object_type: deals, deal_id: obj_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk {object_type} object {deal_id} of group {group_id}."
    call: { method: DELETE, path: "/groups/{group_id}/{object_type}/{deal_id}" }
    cost: *request

  # --- Batches (up to 100 records in one request) -----------------------------------------

  - name: create_people_batch
    class: sensitive
    description: >-
      Create up to 100 people in one request, each record as create_person's
      body in folk's names (firstName, emails, groups [{id}]…). Each record is
      created on its own: the answer gives one result per record, in order,
      succeeded with its data or failed with its error.
    input:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties: &person_record
              firstName: { type: string, maxLength: 500, personal: true }
              lastName: { type: string, maxLength: 500, personal: true }
              fullName: *full_name
              description: { type: string, maxLength: 5000 }
              birthday: *birthday
              gender: *gender
              jobTitle: { type: string, maxLength: 500 }
              groups: *groups
              companies: *person_companies
              addresses: *addresses
              emails: *emails_replace
              phones: *phones_replace
              urls: *urls_replace
              customFieldValues: *custom_field_values
    examples:
      - title: Two people in a group
        input:
          records:
            - { firstName: Marie, lastName: Martin, emails: [marie@example.test], groups: [{ id: grp_00000000-0000-4000-8000-000000000001 }] }
            - { firstName: Paul, lastName: Durand, emails: [paul@example.test], groups: [{ id: grp_00000000-0000-4000-8000-000000000001 }] }
    confirm:
      summary: "Create up to 100 people in folk in one request."
    call: { method: POST, path: /people/batch/create, body: { records: records } }
    cost: *request

  - name: update_people_batch
    class: sensitive
    description: >-
      Update up to 100 people in one request, each record {id, fields of
      update_person}. Lists REPLACE, groups included: leaving a group out takes
      the person out of it with that group's custom field values. Several
      records for one person are merged in order, the last value winning. One
      result per record, in order.
    input:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: *person_id
              firstName: { type: string, maxLength: 500, personal: true }
              lastName: { type: string, maxLength: 500, personal: true }
              fullName: *full_name
              description: { type: string, maxLength: 5000 }
              birthday: *birthday
              gender: *gender
              jobTitle: { type: string, maxLength: 500 }
              groups: *groups
              companies: *person_companies
              addresses: *addresses
              emails: *emails_replace
              phones: *phones_replace
              urls: *urls_replace
              customFieldValues: *custom_field_values
    examples:
      - title: Two job titles
        input:
          records:
            - { id: per_00000000-0000-4000-8000-000000000001, jobTitle: VP Sales }
            - { id: per_00000000-0000-4000-8000-000000000002, jobTitle: CFO }
    confirm:
      summary: "Update up to 100 folk people in one request; lists and groups given replace the current ones."
    call: { method: POST, path: /people/batch/update, body: { records: records } }
    cost: *request

  - name: create_companies_batch
    class: sensitive
    description: >-
      Create up to 100 companies in one request, each record as
      create_company's body (name, industry, groups [{id}]…). A record named
      exactly like an existing company UPDATES it; its result says so
      (operation created or updated). One result per record, in order.
    input:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties: &company_record
              name: { type: string, maxLength: 1000 }
              description: { type: string, maxLength: 5000 }
              fundingRaised: *funding
              lastFundingDate: *funding_date
              industry: { type: [string, "null"], maxLength: 1000 }
              foundationYear: *foundation_year
              employeeRange: *employee_range
              groups: *groups
              addresses: *addresses
              emails: *emails_replace
              phones: *phones_replace
              urls: *urls_replace
              customFieldValues: *custom_field_values
    examples:
      - title: Two companies
        input: { records: [{ name: Example Corp, industry: Software }, { name: Example Labs }] }
    confirm:
      summary: "Create (or, by exact name, update) up to 100 folk companies in one request."
    call: { method: POST, path: /companies/batch/create, body: { records: records } }
    cost: *request

  - name: update_companies_batch
    class: sensitive
    description: >-
      Update up to 100 companies in one request, each record {id, fields of
      update_company}. Lists and groups REPLACE the current ones. One result per
      record, in order.
    input:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: *company_id
              name: { type: string, maxLength: 1000 }
              description: { type: string, maxLength: 5000 }
              fundingRaised: *funding
              lastFundingDate: *funding_date
              industry: { type: [string, "null"], maxLength: 1000 }
              foundationYear: *foundation_year
              employeeRange: *employee_range
              groups: *groups
              addresses: *addresses
              emails: *emails_replace
              phones: *phones_replace
              urls: *urls_replace
              customFieldValues: *custom_field_values
    examples:
      - title: Two industries
        input:
          records:
            - { id: com_00000000-0000-4000-8000-000000000001, industry: Software }
            - { id: com_00000000-0000-4000-8000-000000000002, industry: Retail }
    confirm:
      summary: "Update up to 100 folk companies in one request; lists and groups given replace the current ones."
    call: { method: POST, path: /companies/batch/update, body: { records: records } }
    cost: *request

  - name: create_deals_batch
    class: sensitive
    description: >-
      Create up to 100 objects of one type in a group (deals) in one request,
      each record {name, people [{id}], companies [{id}], customFieldValues by
      field name}. Never matched with existing objects: two records with the
      same name make two deals. One result per record, in order.
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type, records]
      properties:
        group_id: *group_id
        object_type: *object_type
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties: &deal_record
              name: { type: string, maxLength: 1000 }
              people: *links
              companies: *links
              customFieldValues: { type: object, description: "Custom field values by field name." }
    examples:
      - title: Two deals
        input:
          group_id: grp_00000000-0000-4000-8000-000000000001
          object_type: deals
          records: [{ name: Example Corp renewal }, { name: Example Labs pilot, customFieldValues: { Status: Lead } }]
    confirm:
      summary: "Create up to 100 {object_type} objects in folk group {group_id} in one request."
    call: { method: POST, path: "/groups/{group_id}/{object_type}/batch/create", body: { records: records } }
    cost: *request

  - name: update_deals_batch
    class: sensitive
    description: >-
      Update up to 100 objects of one type in a group (deals) in one request,
      each record {id, fields of update_deal}. Records of one object are merged
      in order (customFieldValues field by field, the last value winning) and
      validated as a whole. One result per record, in order.
    input:
      type: object
      additionalProperties: false
      required: [group_id, object_type, records]
      properties:
        group_id: *group_id
        object_type: *object_type
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: *deal_id
              name: { type: string, maxLength: 1000 }
              people: *links
              companies: *links
              customFieldValues: { type: object, description: "Custom field values by field name." }
    examples:
      - title: Two deals won
        input:
          group_id: grp_00000000-0000-4000-8000-000000000001
          object_type: deals
          records:
            - { id: obj_00000000-0000-4000-8000-000000000001, customFieldValues: { Status: Won } }
            - { id: obj_00000000-0000-4000-8000-000000000002, customFieldValues: { Status: Won } }
    confirm:
      summary: "Update up to 100 {object_type} objects of folk group {group_id} in one request."
    call: { method: POST, path: "/groups/{group_id}/{object_type}/batch/update", body: { records: records } }
    cost: *request

  # --- Notes -------------------------------------------------------------------------------

  - name: list_notes
    class: read
    description: >-
      List one page of the notes of the workspace (up to 100), each with the
      person or company it is on (entity.id). folk ignores a filter by entity:
      to find the notes of one person, page through and keep those whose
      entity.id matches. When more remain, pass the cursor parameter of
      data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        cursor: *cursor
    examples:
      - { title: The first page of notes, input: {} }
    call: { method: GET, path: /notes, query: { cursor: cursor }, constants: { query: { limit: 100 } } }
    cost: *request

  - name: create_note
    class: write
    description: >-
      Write a note on a person or a company (entity {id}): public, seen by the
      workspace, or private to the user behind the key.
    input:
      type: object
      additionalProperties: false
      required: [entity, content, visibility]
      properties:
        entity: &entity
          type: object
          additionalProperties: false
          required: [id]
          description: "The person (per_…) or company (com_…), {id}."
          properties:
            id: { type: string, minLength: 1 }
        content: &note_content { type: string, minLength: 1, maxLength: 100000, personal: true }
        visibility: *visibility
    examples:
      - title: A public note on a person
        input: { entity: { id: per_00000000-0000-4000-8000-000000000001 }, content: Met at the trade show., visibility: public }
    call: { method: POST, path: /notes, body: { entity: entity, content: content, visibility: visibility } }
    cost: *request

  - name: update_note
    class: write
    description: Change the content or the visibility of a note.
    input:
      type: object
      additionalProperties: false
      required: [note_id]
      properties:
        note_id: &note_id { type: string, minLength: 1, description: "Note id (nte_…)." }
        content: *note_content
        visibility: *visibility
    examples:
      - { title: Make a note private, input: { note_id: nte_00000000-0000-4000-8000-000000000001, visibility: private } }
    call: { method: PATCH, path: "/notes/{note_id}", body: { content: content, visibility: visibility } }
    cost: *request

  - name: delete_note
    class: sensitive
    description: Delete a note.
    input:
      type: object
      additionalProperties: false
      required: [note_id]
      properties:
        note_id: *note_id
    examples:
      - { title: Delete a note, input: { note_id: nte_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk note {note_id}."
    call: { method: DELETE, path: "/notes/{note_id}" }
    cost: *request

  # --- Interactions --------------------------------------------------------------------------

  - name: create_interaction
    class: write
    description: >-
      Log an interaction with a person or a company (entity {id}): a call, a
      meeting, a message, a coffee… (type, or an emoji), its title, content
      and date-time (ISO 8601).
    input:
      type: object
      additionalProperties: false
      required: [entity, type, title, content, date_time]
      properties:
        entity: *entity
        type: &activity_type { type: string, minLength: 1, maxLength: 50, description: "call, meeting, message, coffee, lunch, event, drink, a messaging app (whatsapp, linkedin, slack…), or an emoji." }
        title: { type: string, minLength: 1, maxLength: 255, personal: true }
        content: { type: string, minLength: 1, maxLength: 100000, personal: true }
        date_time: &date_time { type: string, format: date-time, maxLength: 24, description: "ISO 8601, UTC: 2026-10-22T09:30:00.000Z." }
    examples:
      - title: A call logged now
        input: { entity: { id: per_00000000-0000-4000-8000-000000000001 }, type: call, title: Intro call, content: Interested in a pilot., date_time: "2026-10-22T09:30:00.000Z" }
    call:
      method: POST
      path: /interactions
      body: { entity: entity, type: type, title: title, content: content, dateTime: date_time }
    cost: *request

  - name: list_past_interactions
    class: read
    description: >-
      List one page of the past interactions with a person or a company
      (emails, meetings, messages, logged calls), newest first, 30 per page
      (beta at folk, deprecated since 2026-09-29). An active contact can hold
      hundreds: read the first page, page on only if needed, passing the cursor
      parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      required: [entity_id]
      properties:
        entity_id: &entity_id { type: string, minLength: 1, description: "Person (per_…) or company (com_…) id." }
        cursor: *cursor
    examples:
      - { title: What we said to each other, input: { entity_id: per_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: /interactions/past, query: { entity.id: entity_id, cursor: cursor } }
    cost: *request

  - name: list_upcoming_interactions
    class: read
    description: >-
      List one page of the upcoming interactions with a person or a company
      (scheduled meetings), 30 per page (beta at folk, deprecated since
      2026-09-29). When more remain, pass the cursor parameter of
      data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      required: [entity_id]
      properties:
        entity_id: *entity_id
        cursor: *cursor
    examples:
      - { title: Meetings ahead, input: { entity_id: per_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: /interactions/upcoming, query: { entity.id: entity_id, cursor: cursor } }
    cost: *request

  - name: get_interaction
    class: read
    description: >-
      Get one interaction, with the person or company it is on (entity_id,
      required by folk): the full email or calendar body when privacy rules
      allow it (beta at folk).
    input:
      type: object
      additionalProperties: false
      required: [interaction_id, entity_id]
      properties:
        interaction_id: &interaction_id { type: string, minLength: 1, maxLength: 512, description: "Interaction id; an imported one carries its source's id." }
        entity_id: *entity_id
    examples:
      - { title: One interaction, input: { interaction_id: itr_00000000-0000-4000-8000-000000000001, entity_id: per_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/interactions/{interaction_id}", query: { entity.id: entity_id } }
    cost: *request

  - name: update_interaction
    class: write
    description: >-
      Change a logged interaction (title, content, date_time, activity_type),
      with the person or company it is on (entity {id}, required by folk). An
      imported interaction (email, calendar, WhatsApp) cannot be changed.
    input:
      type: object
      additionalProperties: false
      required: [interaction_id, entity]
      properties:
        interaction_id: *interaction_id
        entity: *entity
        title: { type: string, minLength: 1, maxLength: 255, personal: true }
        content: { type: string, maxLength: 100000, personal: true }
        date_time: *date_time
        activity_type: *activity_type
    examples:
      - title: A new title
        input: { interaction_id: itr_00000000-0000-4000-8000-000000000001, entity: { id: per_00000000-0000-4000-8000-000000000001 }, title: Pricing call }
    call:
      method: PATCH
      path: "/interactions/{interaction_id}"
      body: { entity: entity, title: title, content: content, dateTime: date_time, activityType: activity_type }
    cost: *request

  - name: delete_interaction
    class: sensitive
    description: >-
      Delete a logged interaction, with the person or company it is on. An
      imported interaction cannot be deleted.
    input:
      type: object
      additionalProperties: false
      required: [interaction_id, entity_id]
      properties:
        interaction_id: *interaction_id
        entity_id: *entity_id
    examples:
      - { title: Delete an interaction, input: { interaction_id: itr_00000000-0000-4000-8000-000000000001, entity_id: per_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk interaction {interaction_id} of {entity_id}."
    call: { method: DELETE, path: "/interactions/{interaction_id}", query: { entity.id: entity_id } }
    cost: *request

  # --- Tasks ------------------------------------------------------------------------------------

  - name: list_tasks
    class: read
    description: >-
      List one page of the tasks of the workspace (up to 100): title, due
      date, completion, person or company, assignees. only_assigned_to_me keeps
      the tasks assigned to the user behind the key. When more remain, pass the
      cursor parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        only_assigned_to_me: { type: boolean }
        cursor: *cursor
    examples:
      - { title: My tasks, input: { only_assigned_to_me: true } }
    call:
      method: GET
      path: /tasks
      query: { onlyAssignedToMe: only_assigned_to_me, cursor: cursor }
      constants: { query: { limit: 100 } }
    cost: *request

  - name: get_task
    class: read
    description: Get one task by id.
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: &task_id { type: string, minLength: 1, description: "Task id (tsk_…)." }
    examples:
      - { title: One task, input: { task_id: tsk_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/tasks/{task_id}" }
    cost: *request

  - name: create_task
    class: write
    description: >-
      Create a task on a person or a company (entity {id}), due on a date
      (YYYY-MM-DD) and optionally at a time (HH:mm), possibly recurring,
      assigned to users by id or by email (not both in one call). A task
      completes only by mark_task_done.
    input:
      type: object
      additionalProperties: false
      required: [entity, title, due_at]
      properties:
        entity: *entity
        title: { type: string, minLength: 1, maxLength: 255 }
        due_at: &due_at { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "YYYY-MM-DD." }
        due_time: { type: string, pattern: "^\\d{2}:\\d{2}$", description: "HH:mm." }
        description: { type: string, minLength: 1, maxLength: 10000 }
        recurrence_frequency: { type: string, enum: [weekday, weekly, biweekly, monthly, quarterly, yearly] }
        assigned_users:
          anyOf: &assigned_users_create
            - { type: array, minItems: 1, maxItems: 50, items: &by_id { type: object, additionalProperties: false, required: [id], properties: { id: { type: string, minLength: 1 } } } }
            - { type: array, minItems: 1, maxItems: 50, items: &by_email { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, minLength: 3, maxLength: 254, personal: true } } } }
          description: "Assignees, all by id [{id}] or all by email [{email}]."
        is_public: { type: boolean }
    examples:
      - title: A follow-up call next week
        input:
          entity: { id: per_00000000-0000-4000-8000-000000000001 }
          title: Call back
          due_at: "2026-10-29"
          due_time: "09:30"
          assigned_users: [{ email: me@example.test }]
    call:
      method: POST
      path: /tasks
      body:
        entity: entity
        title: title
        dueAt: due_at
        dueTime: due_time
        description: description
        recurrenceFrequency: recurrence_frequency
        assignedUsers: assigned_users
        isPublic: is_public
    cost: *request

  - name: update_task
    class: write
    description: >-
      Change a task: only the fields given change; assigned_users REPLACES the
      assignees (all by id or all by email). Completion is mark_task_done and
      mark_task_todo, not this.
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: *task_id
        title: { type: string, minLength: 1, maxLength: 255 }
        due_at: *due_at
        due_time: { type: [string, "null"], pattern: "^\\d{2}:\\d{2}$" }
        description: { type: [string, "null"], maxLength: 10000 }
        recurrence_frequency: { type: [string, "null"], enum: [weekday, weekly, biweekly, monthly, quarterly, yearly, null] }
        assigned_users:
          anyOf:
            - { type: array, maxItems: 50, items: *by_id }
            - { type: array, maxItems: 50, items: *by_email }
        is_public: { type: boolean }
        entity: *entity
    examples:
      - { title: Push a task by a week, input: { task_id: tsk_00000000-0000-4000-8000-000000000001, due_at: "2026-11-05" } }
    call:
      method: PATCH
      path: "/tasks/{task_id}"
      body:
        title: title
        dueAt: due_at
        dueTime: due_time
        description: description
        recurrenceFrequency: recurrence_frequency
        assignedUsers: assigned_users
        isPublic: is_public
        entity: entity
    cost: *request

  - name: delete_task
    class: sensitive
    description: Delete a task.
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: *task_id
    examples:
      - { title: Delete a task, input: { task_id: tsk_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk task {task_id}."
    call: { method: DELETE, path: "/tasks/{task_id}" }
    cost: *request

  - name: mark_task_done
    class: write
    description: >-
      Mark a task as done at a date-time (ISO 8601, UTC). Closing a task
      already closed changes nothing.
    input:
      type: object
      additionalProperties: false
      required: [task_id, completed_at]
      properties:
        task_id: *task_id
        completed_at: { type: string, format: date-time, maxLength: 30, description: "ISO 8601, UTC: 2026-10-22T09:30:00.000Z." }
    examples:
      - { title: Done now, input: { task_id: tsk_00000000-0000-4000-8000-000000000001, completed_at: "2026-10-22T09:30:00.000Z" } }
    call: { method: POST, path: "/tasks/{task_id}/mark-as-done", body: { completedAt: completed_at } }
    cost: *request

  - name: mark_task_todo
    class: write
    description: Reopen a task (its completion date is cleared).
    input:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: *task_id
    examples:
      - { title: Reopen a task, input: { task_id: tsk_00000000-0000-4000-8000-000000000001 } }
    call: { method: POST, path: "/tasks/{task_id}/mark-as-todo" }
    cost: *request

  # --- Reminders (deprecated at folk since 2026-08-13, removal on 2027-02-13: tasks succeed them) ---

  - name: list_reminders
    class: read
    description: >-
      List one page of the reminders of the workspace (up to 100). Deprecated
      at folk (removed on 2027-02-13): prefer tasks. folk ignores a filter by
      entity: keep those whose entity.id matches. When more remain, pass the
      cursor parameter of data.pagination.nextLink as cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        cursor: *cursor
    examples:
      - { title: The first page of reminders, input: {} }
    call: { method: GET, path: /reminders, query: { cursor: cursor }, constants: { query: { limit: 100 } } }
    cost: *request

  - name: create_reminder
    class: write
    description: >-
      Create a reminder on a person or a company (entity {id}), with an
      iCalendar recurrence rule. Deprecated at folk (removed on 2027-02-13):
      prefer create_task.
    input:
      type: object
      additionalProperties: false
      required: [entity, name, recurrence_rule, visibility]
      properties:
        entity: *entity
        name: { type: string, minLength: 1, maxLength: 255 }
        recurrence_rule: &recurrence_rule { type: string, minLength: 1, maxLength: 150, description: "iCalendar RRULE with DTSTART: DTSTART;TZID=Europe/Paris:20261029T093000\nRRULE:FREQ=DAILY;COUNT=1" }
        visibility: *visibility
    examples:
      - title: Once, next week
        input: { entity: { id: per_00000000-0000-4000-8000-000000000001 }, name: Call back, recurrence_rule: "DTSTART;TZID=Europe/Paris:20261029T093000\nRRULE:FREQ=DAILY;COUNT=1", visibility: public }
    call:
      method: POST
      path: /reminders
      body: { entity: entity, name: name, recurrenceRule: recurrence_rule, visibility: visibility }
    cost: *request

  - name: get_reminder
    class: read
    description: Get one reminder by id. Deprecated at folk (removed on 2027-02-13).
    input:
      type: object
      additionalProperties: false
      required: [reminder_id]
      properties:
        reminder_id: &reminder_id { type: string, minLength: 1, description: "Reminder id (rmd_…)." }
    examples:
      - { title: One reminder, input: { reminder_id: rmd_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/reminders/{reminder_id}" }
    cost: *request

  - name: update_reminder
    class: write
    description: >-
      Change a reminder: name, recurrence rule, visibility, assignees (all by
      id or all by email). Deprecated at folk (removed on 2027-02-13).
    input:
      type: object
      additionalProperties: false
      required: [reminder_id]
      properties:
        reminder_id: *reminder_id
        name: { type: string, minLength: 1, maxLength: 255 }
        recurrence_rule: *recurrence_rule
        visibility: *visibility
        assigned_users:
          anyOf:
            - { type: array, maxItems: 50, items: *by_id }
            - { type: array, maxItems: 50, items: *by_email }
    examples:
      - { title: Rename a reminder, input: { reminder_id: rmd_00000000-0000-4000-8000-000000000001, name: Send the proposal } }
    call:
      method: PATCH
      path: "/reminders/{reminder_id}"
      body: { name: name, recurrenceRule: recurrence_rule, visibility: visibility, assignedUsers: assigned_users }
    cost: *request

  - name: delete_reminder
    class: sensitive
    description: Delete a reminder.
    input:
      type: object
      additionalProperties: false
      required: [reminder_id]
      properties:
        reminder_id: *reminder_id
    examples:
      - { title: Delete a reminder, input: { reminder_id: rmd_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk reminder {reminder_id}."
    call: { method: DELETE, path: "/reminders/{reminder_id}" }
    cost: *request

  # --- Webhooks ------------------------------------------------------------------------------------

  - name: list_webhooks
    class: read
    description: >-
      List one page of the webhooks of the workspace (up to 100): name, target
      address, subscribed events, status, the signing secret redacted. When
      more remain, pass the cursor parameter of data.pagination.nextLink as
      cursor.
    input:
      type: object
      additionalProperties: false
      properties:
        cursor: *cursor
    examples:
      - { title: The webhooks, input: {} }
    call: { method: GET, path: /webhooks, query: { cursor: cursor }, constants: { query: { limit: 100 } } }
    cost: *request

  - name: get_webhook
    class: read
    description: Get one webhook by id (wbk_…), the signing secret redacted.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      properties:
        webhook_id: &webhook_id { type: string, minLength: 1, description: "Webhook id (wbk_…)." }
    examples:
      - { title: One webhook, input: { webhook_id: wbk_00000000-0000-4000-8000-000000000001 } }
    call: { method: GET, path: "/webhooks/{webhook_id}" }
    cost: *request

  - name: create_webhook
    class: sensitive
    description: >-
      Have folk post the workspace's events to an https address: people,
      companies, objects, notes and reminders created, updated or deleted
      (person.created…), each event optionally filtered (filter: groupId,
      objectType, path, value). The answer never carries the signing secret.
    input:
      type: object
      additionalProperties: false
      required: [name, target_url, subscribed_events]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        target_url: &target_url { type: string, pattern: "^https://", maxLength: 2048 }
        subscribed_events: &subscribed_events
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [eventType]
            properties:
              eventType:
                type: string
                enum:
                  - person.created
                  - person.updated
                  - person.deleted
                  - person.groups_updated
                  - person.workspace_interaction_metadata_updated
                  - company.created
                  - company.updated
                  - company.deleted
                  - company.groups_updated
                  - object.created
                  - object.updated
                  - object.deleted
                  - note.created
                  - note.updated
                  - note.deleted
                  - reminder.created
                  - reminder.updated
                  - reminder.deleted
                  - reminder.triggered
              filter:
                type: object
                additionalProperties: false
                properties:
                  groupId: { type: string, minLength: 1 }
                  objectType: { type: string, minLength: 1 }
                  path: { type: array, items: { type: string, minLength: 1 } }
                  value: { type: string }
    examples:
      - title: People created in one group
        input:
          name: CRM sync
          target_url: https://hooks.example.test/folk
          subscribed_events: [{ eventType: person.created, filter: { groupId: grp_00000000-0000-4000-8000-000000000001 } }]
    confirm:
      summary: "folk will post the workspace events {subscribed_events} to {target_url}."
    call:
      method: POST
      path: /webhooks
      body: { name: name, targetUrl: target_url, subscribedEvents: subscribed_events }
    output:
      strip: [data.signingSecret]
      sample: { data: { id: wbk_0, targetUrl: "https://hooks.example.test/folk", signingSecret: whsec_example } }
    cost: *request

  - name: update_webhook
    class: sensitive
    description: >-
      Change a webhook: its name, target address, events, or status (active,
      inactive). subscribed_events REPLACES the events.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      properties:
        webhook_id: *webhook_id
        name: { type: string, minLength: 1, maxLength: 255 }
        target_url: *target_url
        subscribed_events: *subscribed_events
        status: { type: string, enum: [active, inactive] }
    examples:
      - { title: Pause a webhook, input: { webhook_id: wbk_00000000-0000-4000-8000-000000000001, status: inactive } }
    confirm:
      summary: "Change folk webhook {webhook_id}: its address, events or status."
    call:
      method: PATCH
      path: "/webhooks/{webhook_id}"
      body: { name: name, targetUrl: target_url, subscribedEvents: subscribed_events, status: status }
    cost: *request

  - name: delete_webhook
    class: sensitive
    description: Delete a webhook; folk stops posting its events.
    input:
      type: object
      additionalProperties: false
      required: [webhook_id]
      properties:
        webhook_id: *webhook_id
    examples:
      - { title: Delete a webhook, input: { webhook_id: wbk_00000000-0000-4000-8000-000000000001 } }
    confirm:
      summary: "Delete folk webhook {webhook_id}."
    call: { method: DELETE, path: "/webhooks/{webhook_id}" }
    cost: *request
