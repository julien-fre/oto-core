# Common cases of the whole body: `call.body` that names one input argument, a strict object, instead of a map, with the
# semantics of docs/conception/format-de-description.md, « Le bloc functions », « Le corps entier » (rule 20 of the
# fabrique). At its root only, the object may admit free keys instead of `additionalProperties: false`, each undeclared
# key marked personal data: exactly `{ type: string, personal: true }`, a text, or
# `{ type: [string, number, boolean], personal: true }`, a simple value (both decided 2026-10-22).
#
# Synthetic: no real connector, no vendor, `.test` hosts only. The fabrique assembles `connector` and the functions the
# cases carry into one description, checked with the schema and the rules of every description (rule 20 included), then
# converts it as it converts a description: ts/src/body-cases.ts for the host package
# (`@otomata_tech/connectors/body-cases`), whose engine builds each request. tests/test_body_cases.py plays the cases
# against a reference written in the test: the Python lib sends no request of a description. A function shared by
# several cases is written once, with a YAML anchor; the same name is always the same function.
#
# A case (`cases`): the arguments of a call (`input`, valid against the function input) and the request the host sends:
# its path, its query (name and value pairs, in the order of `call.query`), the headers the arguments set (names in
# lower case) and its JSON body, which is the object given, exactly.
#
# A rejected input (`rejected`): arguments the input schema of a case function refuses, so that nothing is sent.
#
# A refused function (`refused`): a function, valid against the description schema, that rule 20 refuses with this code,
# and no other rule. The codes, the same on both sides (ts/src/body-cases.ts), in the order they are judged:
# body_argument_unknown, body_argument_not_strict, body_argument_optional, body_argument_method,
# body_argument_elsewhere, body_argument_encoded, body_argument_not_alone, body_argument_paginated.
connector:
  name: body_cases
  label: Body cases
  namespace: body_cases
  version: 1.0.0
  api_version: v1
  base_url: https://api.example.test/v1
  auth: { kind: bearer, token: api_key }
  credential:
    - { name: api_key, label: API key, secret: true }
  modes: [byo_org]
  errors:
    - { status: 429, code: rate_limited, retryable: true, message: "Rate limit reached: retry later." }

cases:
  # --- The object is the body, whole and as given -------------------------------------------------------------------
  - name: whole_object
    function: &create_lead
      name: create_lead
      class: write
      description: Add a lead to a campaign; the lead is the whole body.
      input:
        type: object
        additionalProperties: false
        required: [campaign_id, lead]
        properties:
          campaign_id: { type: string }
          lead:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string, personal: true }
              first_name: { type: string }
              company: { type: [string, "null"] }
              tags: { type: array, items: { type: string } }
              # A property of the object may be a map of its own: only the argument itself must be strict.
              variables: { type: object, additionalProperties: { type: string } }
      examples: [{ title: One lead, input: { campaign_id: cam-1, lead: { email: ada@example.test } } }]
      call: { method: POST, path: "/campaigns/{campaign_id}/leads", body: lead }
    input:
      campaign_id: cam-1
      lead: { email: ada@example.test, first_name: Ada, tags: [vip, "2026"], variables: { size: "10-50", city: Lyon } }
    request:
      path: /campaigns/cam-1/leads
      query: []
      headers: {}
      body: { email: ada@example.test, first_name: Ada, tags: [vip, "2026"], variables: { size: "10-50", city: Lyon } }

  - name: absent_properties_are_not_sent
    function: *create_lead
    input: { campaign_id: cam-1, lead: { email: ada@example.test } }
    request:
      path: /campaigns/cam-1/leads
      query: []
      headers: {}
      body: { email: ada@example.test }

  - name: null_is_sent
    function: *create_lead
    input: { campaign_id: cam-1, lead: { email: ada@example.test, company: null } }
    request:
      path: /campaigns/cam-1/leads
      query: []
      headers: {}
      body: { email: ada@example.test, company: null }

  - name: path_argument_encoded
    function: *create_lead
    input: { campaign_id: "cam 1/b", lead: { email: ada@example.test } }
    request:
      path: /campaigns/cam%201%2Fb/leads
      query: []
      headers: {}
      body: { email: ada@example.test }

  # --- The other arguments keep their places -------------------------------------------------------------------------
  - name: with_query_and_header
    function: &update_campaign
      name: update_campaign
      class: write
      description: Change the settings of a campaign; the changes are the whole body.
      input:
        type: object
        additionalProperties: false
        required: [campaign_id, changes]
        properties:
          campaign_id: { type: string }
          dry_run: { type: boolean }
          request_key: { type: string }
          changes:
            type: object
            additionalProperties: false
            properties:
              name: { type: string }
              paused: { type: boolean }
              daily_limit: { type: integer, minimum: 1 }
      examples: [{ title: Pause a campaign, input: { campaign_id: cam-1, changes: { paused: true } } }]
      call:
        method: PATCH
        path: "/campaigns/{campaign_id}"
        query: { dryRun: dry_run }
        headers: { Idempotency-Key: request_key }
        body: changes
    input: { campaign_id: cam-1, dry_run: true, request_key: k-1, changes: { name: Spring, daily_limit: 40 } }
    request:
      path: /campaigns/cam-1
      query: [[dryRun, "true"]]
      headers: { idempotency-key: k-1 }
      body: { name: Spring, daily_limit: 40 }

  - name: optional_arguments_absent
    function: *update_campaign
    input: { campaign_id: cam-1, changes: { paused: false } }
    request:
      path: /campaigns/cam-1
      query: []
      headers: {}
      body: { paused: false }

  - name: empty_object_is_sent
    function: *update_campaign
    input: { campaign_id: cam-1, changes: {} }
    request:
      path: /campaigns/cam-1
      query: []
      headers: {}
      body: {}

  # --- Free text keys at the root of the object, all personal data ---------------------------------------------------
  - name: free_text_keys_are_sent
    function: &upsert_contact
      name: upsert_contact
      class: write
      description: Create or update a contact; the contact is the whole body, its custom fields free text keys.
      input:
        type: object
        additionalProperties: false
        required: [contact]
        properties:
          contact:
            type: object
            # Any key the properties do not declare is a text, and personal data; declared keys keep their own schema.
            additionalProperties: { type: string, personal: true }
            required: [email]
            properties:
              email: { type: string, personal: true }
              first_name: { type: string }
              score: { type: integer, minimum: 0 }
      examples: [{ title: One contact, input: { contact: { email: ada@example.test, city: Lyon } } }]
      call: { method: POST, path: /contacts, body: contact }
    input: { contact: { email: ada@example.test, first_name: Ada, score: 3, city: Lyon, team_size: "10-50" } }
    request:
      path: /contacts
      query: []
      headers: {}
      body: { email: ada@example.test, first_name: Ada, score: 3, city: Lyon, team_size: "10-50" }

  - name: declared_keys_only
    function: *upsert_contact
    input: { contact: { email: ada@example.test, score: 0 } }
    request:
      path: /contacts
      query: []
      headers: {}
      body: { email: ada@example.test, score: 0 }

  - name: empty_free_text_is_sent
    function: *upsert_contact
    input: { contact: { email: ada@example.test, "Favourite colour": "" } }
    request:
      path: /contacts
      query: []
      headers: {}
      body: { email: ada@example.test, "Favourite colour": "" }

  # --- Free keys of a simple value at the root of the object, all personal data ---------------------------------------
  - name: free_simple_values_are_sent
    function: &update_account
      name: update_account
      class: write
      description: Update an account; the account is the whole body, its custom fields free keys of a simple value.
      input:
        type: object
        additionalProperties: false
        required: [account]
        properties:
          account:
            type: object
            # Any key the properties do not declare is a text, a number or a boolean, and personal data.
            additionalProperties: { type: [string, number, boolean], personal: true }
            required: [name]
            properties:
              name: { type: string }
              domain: { type: string }
      examples: [{ title: One account, input: { account: { name: Valbrune, seats: 12, is_customer: true } } }]
      call: { method: PATCH, path: /accounts, body: account }
    input:
      account: { name: Valbrune, domain: valbrune.test, seats: 120, revenue: 2500000.5, is_customer: true, founded: "2001-04-01" }
    request:
      path: /accounts
      query: []
      headers: {}
      body: { name: Valbrune, domain: valbrune.test, seats: 120, revenue: 2500000.5, is_customer: true, founded: "2001-04-01" }

  - name: free_simple_false_and_zero_are_sent
    function: *update_account
    input: { account: { name: Valbrune, is_customer: false, seats: 0, note: "" } }
    request:
      path: /accounts
      query: []
      headers: {}
      body: { name: Valbrune, is_customer: false, seats: 0, note: "" }

  # --- A DELETE carries its body -------------------------------------------------------------------------------------
  - name: delete_with_body
    function:
      name: remove_leads
      class: sensitive
      description: Remove leads from a campaign; the selection is the whole body.
      input:
        type: object
        additionalProperties: false
        required: [campaign_id, selection]
        properties:
          campaign_id: { type: string }
          selection:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
              ids: { type: array, minItems: 1, items: { type: string } }
      examples: [{ title: Two leads, input: { campaign_id: cam-1, selection: { ids: [l-1, l-2] } } }]
      call: { method: DELETE, path: "/campaigns/{campaign_id}/leads", body: selection }
      confirm: { summary: "Remove the leads {selection} from campaign {campaign_id}." }
    input: { campaign_id: cam-1, selection: { ids: [l-1, l-2] } }
    request:
      path: /campaigns/cam-1/leads
      query: []
      headers: {}
      body: { ids: [l-1, l-2] }

rejected:
  - name: unknown_property_in_the_object
    function: create_lead
    input: { campaign_id: cam-1, lead: { email: ada@example.test, phone: "+33100000000" } }
  - name: required_property_missing
    function: create_lead
    input: { campaign_id: cam-1, lead: { first_name: Ada } }
  - name: object_absent
    function: create_lead
    input: { campaign_id: cam-1 }
  - name: object_is_a_text
    function: create_lead
    input: { campaign_id: cam-1, lead: ada@example.test }
  - name: property_out_of_bounds
    function: update_campaign
    input: { campaign_id: cam-1, changes: { daily_limit: 0 } }
  - name: free_key_is_a_number
    function: upsert_contact
    input: { contact: { email: ada@example.test, team_size: 12 } }
  - name: free_key_is_null
    function: upsert_contact
    input: { contact: { email: ada@example.test, city: null } }
  - name: free_key_is_an_object
    function: upsert_contact
    input: { contact: { email: ada@example.test, address: { city: Lyon } } }
  - name: free_key_is_a_list
    function: upsert_contact
    input: { contact: { email: ada@example.test, tags: [vip] } }
  - name: declared_key_keeps_its_schema
    function: upsert_contact
    input: { contact: { email: ada@example.test, score: high } }
  - name: free_keys_without_a_required_property
    function: upsert_contact
    input: { contact: { city: Lyon } }
  - name: free_simple_value_is_null
    function: update_account
    input: { account: { name: Valbrune, seats: null } }
  - name: free_simple_value_is_an_object
    function: update_account
    input: { account: { name: Valbrune, address: { city: Lyon } } }
  - name: free_simple_value_is_a_list
    function: update_account
    input: { account: { name: Valbrune, tags: [vip] } }
  - name: free_simple_declared_key_keeps_its_schema
    function: update_account
    input: { account: { name: Valbrune, domain: 12 } }

refused:
  - name: unknown_argument
    function:
      name: add_note
      class: write
      description: Add a note.
      input: &note_input
        type: object
        additionalProperties: false
        required: [note]
        properties:
          note: &note
            type: object
            additionalProperties: false
            required: [text]
            properties: { text: { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello } } }]
      call: { method: POST, path: /notes, body: notes }
    refusal: body_argument_unknown

  - name: free_bag
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties: { note: { type: object } }
      examples: [{ title: A note, input: { note: { text: Hello } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: open_object
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties: { note: { type: object, additionalProperties: true, properties: { text: { type: string } } } }
      examples: [{ title: A note, input: { note: { text: Hello } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: no_declared_property
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties: { note: { type: object, additionalProperties: false, properties: {} } }
      examples: [{ title: An empty note, input: { note: {} } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: keys_by_pattern
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties:
          note:
            type: object
            additionalProperties: false
            properties: { text: { type: string } }
            patternProperties: { "^x_": { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello, x_any: Hi } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: free_keys_not_personal
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties:
          note:
            type: object
            additionalProperties: { type: string }
            properties: { text: { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello, mood: calm } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: free_keys_personal_false
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties:
          note:
            type: object
            additionalProperties: { type: string, personal: false }
            properties: { text: { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello, mood: calm } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: free_keys_a_number
    function:
      name: add_note
