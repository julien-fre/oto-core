        properties:
          note:
            type: object
            additionalProperties: { type: object, personal: true }
            properties: { text: { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello, meta: {} } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: free_keys_untyped
    function:
      name: add_note
