          note:
            type: object
            additionalProperties: { type: number, personal: true }
            properties: { text: { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello, weight: 2 } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: free_keys_text_or_null
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
        required: [note]
        properties:
          note:
            type: object
            additionalProperties: { type: [string, "null"], personal: true }
            properties: { text: { type: string } }
      examples: [{ title: A note, input: { note: { text: Hello, mood: null } } }]
      call: { method: POST, path: /notes, body: note }
    refusal: body_argument_not_strict

  - name: free_keys_an_object
    function:
      name: add_note
      class: write
      description: Add a note.
      input:
        type: object
        additionalProperties: false
