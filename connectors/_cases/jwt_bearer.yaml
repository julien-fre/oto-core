  - name: token_refused_invalid_grant
    auth: *auth_one
    credential: *credential
    key_file: *key_file
    private_key: test_key
    now: 1767225600
    assertion: *assertion_one
    token_request: *token_request
    token_answer: { status: 400, headers: {}, body: { error: invalid_grant, error_description: Invalid JWT Signature. } }
    outcome: { refusal: credential_rejected }

  - name: token_refused_invalid_scope
    auth: *auth_one
    credential: *credential
    key_file: *key_file
    private_key: test_key
    now: 1767225600
    assertion: *assertion_one
    token_request: *token_request
    token_answer: { status: 400, headers: {}, body: { error: invalid_scope, error_description: Invalid OAuth scope. } }
    outcome: { refusal: upstream_error }

  - name: token_redirect_not_followed
    auth: *auth_one
    credential: *credential
    key_file: *key_file
    private_key: test_key
    now: 1767225600
    assertion: *assertion_one
    token_request: *token_request
    token_answer: { status: 307, headers: { location: https://elsewhere.example.test/token }, body: null }
    outcome: { refusal: upstream_error }

refused:
  - name: key_not_json
    auth: *auth_one
    credential: *credential
    key_text: "{ this is not JSON"
    refusal: service_account_key_not_json

  - name: key_not_an_object
    auth: *auth_one
    credential: *credential
    key_text: "[\"not\", \"an\", \"object\"]"
    refusal: service_account_key_not_json

  - name: key_without_private_key
    auth: *auth_one
    credential: *credential
    key_file: *key_file
    private_key: absent
    refusal: service_account_key_incomplete

  - name: key_without_client_email
    auth: *auth_one
    credential: *credential
    key_file: { type: service_account, private_key_id: test-key-id-not-real, token_uri: https://oauth2.example.test/token }
    private_key: test_key
    refusal: service_account_key_incomplete

  - name: key_with_foreign_token_uri
    auth: *auth_one
    credential: *credential
    key_file: { type: service_account, client_email: reader@test-project-not-real.example.test, token_uri: https://elsewhere.example.test/token }
    private_key: test_key
    refusal: service_account_key_foreign_token_uri

  - name: key_truncated
    auth: *auth_one
    credential: *credential
    key_file: *key_file
    private_key: truncated
    refusal: service_account_key_unreadable

  - name: key_not_pem
    auth: *auth_one
    credential: *credential
    key_file: *key_file
    private_key: not_pem
    refusal: service_account_key_unreadable
