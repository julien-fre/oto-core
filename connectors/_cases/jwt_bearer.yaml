cases:
  - name: assertion_with_key_id
    auth: &auth_one { kind: oauth2_jwt_bearer, token_url: https://oauth2.example.test/token, scopes: [https://api.example.test/auth/read], key: service_account_key }
    credential: &credential
      - { name: service_account_key, label: Service account key (JSON), secret: true }
    key_file: &key_file
      type: service_account
      project_id: test-project-not-real
      private_key_id: test-key-id-not-real
      client_email: reader@test-project-not-real.example.test
      client_id: "100000000000000000001"
      token_uri: https://oauth2.example.test/token
    private_key: test_key
    now: 1767225600
    assertion: &assertion_one
      header: { alg: RS256, typ: JWT, kid: test-key-id-not-real }
      claims: { iss: reader@test-project-not-real.example.test, scope: https://api.example.test/auth/read, aud: https://oauth2.example.test/token, iat: 1767225600, exp: 1767229200 }
      signature: "H5Gm6GIpKnChyX4j5W_f-PWP2BedNB8GMT0VzI5zHoRQwd8WnHtxcg9nV-FnsokEMPcI_ZtaqHVCgG_UhKcyVBAhb0D2fC_DP6i0sA3tvtK4sp3GRWSDGp7paCEFBAqmlQUqQZvTsElLXge8zFtNZWKHOaHMENOtheuviIlEaS0ZG6bUqr62uPn_HVwngGTG8_Uo8kjwdZzwdUURmdUT_9p05BQy-_iKwYE3VVZOBcJSkEUt9uVlGq849eo7PQ2O3GUzHeoVi2OBAJJ3sef9GSMKc36kAgq_V30mWqaDT4RetiXZRC6dOgrJD0CsUYgenqfr-OKIHjkCQ9JDn5Et6A"
    token_request: &token_request
      url: https://oauth2.example.test/token
      content_type: application/x-www-form-urlencoded
      body: "grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion={assertion}"
    token_answer: { status: 200, headers: {}, body: { access_token: test-access-token-not-real, expires_in: 3599, token_type: Bearer } }
    outcome: { headers: { authorization: Bearer test-access-token-not-real }, expires_at: 1767229199 }

  - name: assertion_without_key_id_two_scopes
    auth: { kind: oauth2_jwt_bearer, token_url: https://oauth2.example.test/token, scopes: [https://api.example.test/auth/read, https://api.example.test/auth/write], key: service_account_key }
    credential: *credential
    key_file:
      type: service_account
      client_email: writer@test-project-not-real.example.test
    private_key: test_key
    now: 1767312000
    assertion:
      header: { alg: RS256, typ: JWT }
      claims: { iss: writer@test-project-not-real.example.test, scope: https://api.example.test/auth/read https://api.example.test/auth/write, aud: https://oauth2.example.test/token, iat: 1767312000, exp: 1767315600 }
      signature: "Fq6fg9J3mks1KJrpSZILNPEg-ImMu-YrdpnzAcsbyfuvPofBfV7WTCI49_Dc0oee0x-Yye455xghVA1FIbsQ1A3Y-yZoyxdR0pkXTBtp35OID9OFEjnvbtUyUCJf59BsivxmTC81PvgcIs_g_lf1-3K1QVvBwFQTrx7pEaGLnvNfJFgRYBRLCtSgPqx2SIHkWuuWXY1DNK5dtEyCh4lxxcx-RmOOXLZwDaziaCaMP8_WVwfzC8VJ4ojwAEBGpxEiqen3-wGM5kq-AMYrUdvqygJEileF81rrBXaCOdA5qPWV0Llm_C_Gf91LgCuMeShyKC5NuHpc6yWEn_eKr-72sg"
