# Common cases of a service account (auth.kind: oauth2_jwt_bearer, RFC 7523), with the semantics of
# docs/conception/compte.md: the host reads the JSON key file held by the one credential field, signs an assertion in
# RS256 and exchanges it for an access token at the fixed token_url.
#
# Synthetic: no real connector, no vendor; every value is made up and says so. test_key is a THROWAWAY RSA key
# (2048 bits) generated for these cases alone and used nowhere else: not a secret. It is written as the base64 body of
# its PKCS#8 DER, 64 characters a line, never framed as a PEM: secret guards of public repositories (the one of
# oto-core included, which copies the TypeScript output) refuse a private key header and a JWT written in clear. Both
# sides frame it at run time (credential_value in fabrique/jwt_bearer_cases.py, credentialValue in the output).
#
# The fabrique checks each case as the connector block of a description (the schema, then the rules, rule 2 included:
# a single credential field, secret, named by auth.key), then writes ts/src/jwt-bearer-cases.ts for the host package
# (`@otomata_tech/connectors/jwt-bearer-cases`). tests/test_jwt_bearer_cases.py plays the cases against the engine
# of the Python lib (oto.connectors.engine), before a fake token endpoint, and against a reference written in the test,
# cross-checked by google-auth.
#
# A case:
# - auth, credential: the connector's blocks, in source form;
# - key_file: the fields of the key file, private_key aside; private_key: how it is added, last (test_key: the test key
#   framed as a PEM; absent; truncated: a PEM framing only the first line of the test key; not_pem: a text that is not a
#   PEM); or key_text, the value as is. The value is the key file as compact JSON;
# - access_level: with auth.access_levels, the level of the account; absent, auth.default_level, else full. The scope
#   claim of the assertion is the scopes of that level joined by spaces: a service account consents to nothing, its
#   level only decides what the assertion asks for;
# - now: the clock, in seconds since the epoch;
# - assertion: header (alg, typ, then kid when the key has a private_key_id) and claims (iss, scope, aud, iat, exp), each
#   serialized as compact JSON in this key order, UTF-8, base64url without padding, joined by a dot; then the RS256
#   signature (RSASSA-PKCS1-v1_5, SHA-256: deterministic) of that text, base64url without padding;
# - token_request: the one request sent (POST, never a redirect followed), {assertion} standing for the assertion in its
#   body; the assertion is never in a query;
# - token_answer: the simulated answer; outcome: the header of the call and the expiry (now + expires_in), or a refusal:
#   credential_rejected (invalid_grant: the key is refused), upstream_error (any other refusal, a redirect included).
# A refused key is refused before anything is sent, in this order: service_account_key_not_json (not a JSON object),
# service_account_key_incomplete (client_email or private_key missing or empty), service_account_key_foreign_token_uri
# (a token_uri that is not token_url), service_account_key_unreadable (not an RSA private key in a PKCS#8 PEM).
