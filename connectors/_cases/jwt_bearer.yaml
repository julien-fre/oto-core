    outcome: { headers: { authorization: Bearer test-access-token-two-not-real }, expires_at: 1767315600 }

  - name: assertion_at_default_level
    auth: &auth_levels
      kind: oauth2_jwt_bearer
      token_url: https://oauth2.example.test/token
      access_levels:
        read: { scopes: [https://api.example.test/auth/read] }
        full: { scopes: [https://api.example.test/auth/write] }
