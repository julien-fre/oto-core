[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oto-core"
version = "1.182.0"
description = "Oto connector library — API clients for AI agents. Credentials are always provided by the consumer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
urls = { Homepage = "https://oto.ninja", Repository = "https://github.com/otomata-tech/connectors" }
dependencies = [
    # Floor >=2.33.0 : CVE-2026-25645, CVE-2024-47081 (.netrc leak), CVE-2024-35195
    # (cert verification bypass), CVE-2023-32681 (Proxy-Authorization leak).
    "requests>=2.33.0",
    "france-opendata>=0.7.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
google = ["google-auth>=2.0.0", "google-auth-oauthlib>=1.0.0", "google-api-python-client>=2.0.0", "markdown>=3.8.1"]  # markdown : CVE-2025-69534
browser = ["o-browser"]
vivatech = ["o-browser-vivatech"]
anthropic = ["anthropic>=0.40.0"]
# pyarrow floor >=23.0.1 : CVE-2023-47248 + CVE-2024-52338 (RCE on untrusted
# Parquet/IPC) + GHSA-rgxp-2hwp-jwgg (use-after-free reading pre-buffered IPC).
# `duckdb` est le moteur de lecture des parquets (bilans INPI, stock SIRENE,
# BOAMP) : sans lui, `oto fr get`/`fr bilans` échouent — et l'extra qui prétend
# couvrir ce besoin ne l'embarquait pas, si bien que le remède conseillé à
# l'utilisateur ne réparait rien.
stock = ["duckdb>=1.0", "pyarrow>=23.0.1", "pandas>=1.5.0"]
anonymize = ["faker>=20.0.0"]
# `planity` : le seul client ASYNCHRONE de la lib — l'amont l'impose, et ni son
# transport ni sa boucle n'existent dans `requests`, le socle du reste. Deux libs
# pour un connecteur : c'est un extra, pas une dépendance que tout le monde tire.
# ⚠️ L'absence de l'extra ne doit PAS se lire « module introuvable » :
# `oto/tools/planity/__init__.py` la retraduit en « installe l'extra `planity` »,
# à l'ORIGINE — le consommateur (oto-backend) ne fait que journaliser ce message.
planity = ["httpx>=0.27", "websockets>=13"]
all = ["oto-core[google,browser,vivatech,anthropic,stock,anonymize,planity]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oto*"]
namespaces = true

# Fichiers chargés à l'exécution via Path(__file__) — sans eux, un install
# PyPI casse load_naf_codes() et le rendu PDF.
[tool.setuptools.package-data]
"oto.tools.sirene" = ["data/*.txt"]
"oto.tools.pdf" = ["templates/*.css"]

# `fabrique/` (le générateur, outil du dépôt et pas de la lib) s'importe depuis la racine dans les tests.
[tool.pytest.ini_options]
pythonpath = ["."]
