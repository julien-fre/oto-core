name: CI

# oto-core est une lib pinnée par tag dans oto-backend. Sans CI, une casse ne se
# voyait qu'au bump du tag côté backend. Ce job teste à chaque PR/push.
# Cf. otomata-private#39 (revue CI/CD, #5).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Appelable par `publish.yml` : le tag publié sur PyPI est celui que le backend
  # ÉPINGLE, et jusqu'au 15/09/2026 il pouvait partir suite rouge — ce workflow ne
  # se déclenchait que sur PR et push `main`, jamais sur un tag. Une casse voyageait
  # donc chez son consommateur sans que rien ne l'arrête.
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # `anonymize` = le chemin faker ; `google` = les clients Gmail/Drive/Keep, dont
      # les tests importent google-api-python-client. Sans lui, la COLLECTE pytest
      # s'interrompt (ModuleNotFoundError) et la CI ne teste plus rien du tout —
      # elle est restée rouge sur `main` du 12 au 18/08/2026 pour cette raison.
      # `planity` = httpx + websockets, sortis du socle et passés en extra le
      # 2026-09-09 : sans lui, `tests/test_planity_*.py` interrompt la collecte
      # (« 2 errors during collection ») et la suite entière ne tourne plus.
      # Tout nouvel extra dont un test importe la dépendance doit atterrir ici.
      # `jsonschema` = outil de test, pas une dépendance de la lib : il valide les
      # fichiers de description `connectors/*/connector.yaml` contre leur schéma.
      - name: Install (extras dont les tests importent les deps)
        run: pip install -e ".[anonymize,google,planity]" pytest "jsonschema>=4.18"
      - name: Tests
        run: pytest -q

  # Gardes par commit (docs/conception/format-de-description.md, « Contrôles ») : chaque commit nouveau, jugé contre son
  # premier parent, monte la `version` d'un `connectors/<nom>/connector.yaml` dont il change la description ou le
  # client, sauf trailer `Version-dispense: <connecteur> — <raison>` ; il n'ajoute aucune exception en attente à
  # `connectors/clients.yaml`. Jamais la version de la lib (pyproject, uv.lock, paquet npm). Commits jugés : ceux de la
  # PR (de sa base à sa tête, sans le commit de fusion que GitHub fabrique), ou ceux du push de `main` (d'avant à
  # après) ; d'où l'historique entier (`fetch-depth: 0`). Avant inconnu (premier push) : le commit de tête seul, et la
  # sortie le dit. Ni sur un tag (appel par `publish.yml`), ni sur un dispatch : rien de nouveau à juger.
  commits:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml==6.0.2"
      - name: Chaque commit, contre son parent
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python -m fabrique.commits "$BEFORE" "$AFTER"

  # Sortie TypeScript de la fabrique (`ts/`) : elle compile et ses définitions tiennent leurs exemples et la requête
  # du témoin Notion. Que la sortie commitée soit à jour se vérifie dans `test` (`tests/test_fabrique.py`).
  fabrique-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
